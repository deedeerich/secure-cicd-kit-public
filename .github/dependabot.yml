# Dependabot — present, and deliberately not load-bearing.
#
# WHY THIS FILE DID NOT EXIST UNTIL NOW
#   The kit had dependency SCANNING (OWASP Dependency-Check, the NVD CVE workflows) and no
#   dependency UPDATING. Those are different capabilities: one tells you a dependency is
#   vulnerable, the other opens the PR that fixes it. Having the first is not having the second,
#   and the capability matrix has listed this gap rather than hiding it.
#
# WHAT IT DOES AND DOES NOT ASSUME
#   Dependabot is a platform feature. If alerts or security updates are disabled for the
#   repository or the org, this file changes nothing and fails nothing -- it simply does not fire.
#   That is the intended behaviour: available where enabled, silent where not, never a hard
#   dependency of the pipeline.
#
#   Which means its absence must NEVER be read as "no vulnerable dependencies". A repo with
#   Dependabot off and this file present looks identical to a repo with no vulnerable
#   dependencies, and that ambiguity is the failure this kit exists to prevent. The scanners in
#   reusable-security.yml remain the thing that establishes posture; this only proposes fixes.
#
# ECOSYSTEMS
#   ONLY WHERE A MANIFEST IS (tests/check_action_pins.py P7). This file used to list pip, npm,
#   nuget, gomod, maven, composer, docker and terraform at `/` "because Dependabot skips an
#   ecosystem with no manifest". It does not: it fails that update job with
#   dependency_file_not_found ("No Dockerfiles nor Kubernetes YAML found", file-path /Dockerfile),
#   every week, on every copy of the kit (the owner's work copy, 2026-11-02). The kit's root holds
#   no application manifest; its real ones are the workflows and composites (github-actions) and
#   infra/feed-mirrors (terraform). The fixture directories below are listed only to be HELD.
#   A copy of the kit that adds a manifest adds its entry, beside the manifest.

# THE TEST FIXTURES ARE DELIBERATELY VULNERABLE -- never "fix" them.
#   tests/consumer-fixture/ holds the scanners' acceptance signals: pinned vulnerable packages the
#   kit's own tests must DETECT. A Dependabot PR that upgrades them makes those tests pass for the
#   wrong reason (the public mirror received exactly such PRs; closed 2026-10-16). Every ecosystem
#   below excludes that tree; its pins are maintained by hand, deliberately.

version: 2

updates:
  # SHA PINS STAY CURRENT HERE (ledger L82). Every remote `uses:` is `owner/repo@<sha> # vX.Y.Z`;
  # Dependabot moves the SHA and the version comment together. `/` reads .github/workflows and a
  # root action.yml only, so the composites are listed by glob (`directories` supports `*`;
  # `directory` does not). templates/ holds placeholders a consumer pins, and is not read.
  # overlays/ is deliberately not read either: an overlay ships into its consumer's own copy and is
  # maintained there, by that consumer's Dependabot (tests/check_action_pins.py P5 holds both).
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    exclude-paths:
      - "tests/consumer-fixture/**"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels: [dependencies, github-actions]
    commit-message:
      prefix: "deps(actions)"
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  # THE KIT'S OWN TERRAFORM (infra/feed-mirrors, KDEC-032): its provider pins stay current.
  - package-ecosystem: terraform
    directory: /infra/feed-mirrors
    exclude-paths:
      - "tests/consumer-fixture/**"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, terraform]
    commit-message:
      prefix: "deps(terraform)"

  # THE FIXTURE, HELD STILL AGAINST SECURITY UPDATES TOO (tests/check_action_pins.py P6).
  #   exclude-paths above binds VERSION updates only. An alert-driven SECURITY update ignores it and
  #   opened #2, #4, #7 (pip) and #9 (log4j-core 2.14.1 -> 2.25.4, full/java) against the fixture.
  #   A security update does apply the `ignore` of the entry matching its ecosystem and directory,
  #   so each fixture manifest directory has one: every dependency ignored, and a version-update
  #   limit of 0. A new fixture manifest without its entry fails P6.
  - package-ecosystem: pip
    directory: "/tests/consumer-fixture/clean"
    schedule: {interval: monthly}
    open-pull-requests-limit: 0
    ignore: [{dependency-name: "*"}]
  - package-ecosystem: pip
    directory: "/tests/consumer-fixture/seeded"
    schedule: {interval: monthly}
    open-pull-requests-limit: 0
    ignore: [{dependency-name: "*"}]
  - package-ecosystem: pip
    directory: "/tests/consumer-fixture/full/python"
    schedule: {interval: monthly}
    open-pull-requests-limit: 0
    ignore: [{dependency-name: "*"}]
  - package-ecosystem: npm
    directory: "/tests/consumer-fixture/full/node"
    schedule: {interval: monthly}
    open-pull-requests-limit: 0
    ignore: [{dependency-name: "*"}]
  - package-ecosystem: npm
    directory: "/tests/consumer-fixture/full/services/api"
    schedule: {interval: monthly}
    open-pull-requests-limit: 0
    ignore: [{dependency-name: "*"}]
  - package-ecosystem: maven
    directory: "/tests/consumer-fixture/full/java"
    schedule: {interval: monthly}
    open-pull-requests-limit: 0
    ignore: [{dependency-name: "*"}]
  - package-ecosystem: nuget
    directory: "/tests/consumer-fixture/full/dotnet"
    schedule: {interval: monthly}
    open-pull-requests-limit: 0
    ignore: [{dependency-name: "*"}]
  - package-ecosystem: gomod
