name: Resolve versions, capability, coverage and plan
description: >-
  The position between discover and the scanners (SINGLE_PIPELINE_TARGET section 5.1;
  PIPELINE_ORDERING_AND_SCAN_VALIDITY section 1.6): the version each discovered class is
  WRITTEN FOR per root (R2), each scanner's DECLARED range matched against it (R3), class-and-count
  coverage, an advisory execution plan (R4), and the platform-probe consumers (section 6). The
  step bodies lived inline in the `resolve` job until the flagship reached 518 KB -- over GitHub's
  500 KB ceiling, where a workflow does not fail, it never starts. Reached through `$/`, which
  delivers the whole kit at the commit the caller pinned, exactly as scan-report is (C1, KDEC-002).
  tests/test_resolve.py runs these steps as shipped, from this file, against fixture trees.
  Every answer is DATA on $GITHUB_OUTPUT; nothing here fails the job -- a resolver that failed
  closed would turn its own defect into an unscanned repository.

inputs:
  # ── the caller's inputs, verbatim -- the RUNNER toolchain, not what the repository targets ──
  paths:
    description: The scope the caller asked to scan. Empty or missing means the whole checkout.
    required: false
    default: ''
  python-version:
    description: The Python the kit installs on the runner. bandit's and mypy's ceiling.
    required: false
    default: ''
  node-version:
    description: The Node the kit installs on the runner.
    required: false
    default: ''
  go-version:
    description: The Go the kit installs on the runner.
    required: false
    default: ''
  dotnet-version:
    description: The .NET SDK the kit installs on the runner. The restore ceiling (NETSDK1045).
    required: false
    default: ''
  java-version:
    description: The JDK the kit installs on the runner. CodeQL autobuild's ceiling.
    required: false
    default: ''
  image-ref:
    description: The container image the caller named, if any. Decides image-scan in the plan.
    required: false
    default: ''
  enable-sbom:
    description: The caller's enable_sbom, as text. Decides sbom in the plan.
    required: false
    default: ''
  enable-malicious-pkg-scan:
    description: The caller's enable_malicious_pkg_scan, as text. Decides malicious-deps in the plan.
    required: false
    default: ''
  # ── what discovery established. Read as DATA; empty is "discovery did not say", an unknown ──
  discovered-python:
    description: needs.discover.outputs.python -- "true", "false" or "".
    required: false
    default: ''
  discovered-node:
    description: needs.discover.outputs.node.
    required: false
    default: ''
  discovered-go:
    description: needs.discover.outputs.go.
    required: false
    default: ''
  discovered-dotnet:
    description: needs.discover.outputs.dotnet.
    required: false
    default: ''
  discovered-java:
    description: needs.discover.outputs.java.
    required: false
    default: ''
  discovered-cpp:
    description: needs.discover.outputs.cpp.
    required: false
    default: ''
  discovered-php:
    description: needs.discover.outputs.php (lane L-PHP).
    required: false
    default: ''
  discovered-kotlin:
    description: needs.discover.outputs.kotlin (lane L-SCAN-B, KDEC-026).
    required: false
    default: ''
  discovered-swift:
    description: needs.discover.outputs.swift (lane L-SCAN-B, KDEC-026).
    required: false
    default: ''
  discovered-mobile:
    description: needs.discover.outputs.mobile (KDEC-026) -- decides sast-mobile in the plan.
    required: false
    default: ''
  discovered-iac:
    description: needs.discover.outputs.iac.
    required: false
    default: ''
  discovery-state:
    description: needs.discover.outputs.state -- COMPLETE, DISCOVERY_PARTIAL or DISCOVERY_UNAVAILABLE.
    required: false
    default: ''
  coverage-gaps:
    description: needs.discover.outputs.coverage_gaps -- the classes present that no scanner here reads.
    required: false
    default: ''
  unsupported:
    description: needs.discover.outputs.unsupported.
    required: false
    default: ''
  # ── the trigger context, for the advisory plan's depth (EXECUTION_PLANNING section 3.2) ──
  event-name:
    description: github.event_name. Set by GitHub, so TRUSTED; passed as data so the step reads one name.
    required: false
    default: ''
  # ── the platform-probe values discover established once (PIPELINE_ORDERING section 6) ──
  ghas-available:
    description: needs.discover.outputs.ghas_available.
    required: false
    default: ''
  code-scanning:
    description: needs.discover.outputs.code_scanning -- ENABLED, NOT_CONFIGURED, UNAVAILABLE or UNKNOWN.
    required: false
    default: ''
  secret-scanning:
    description: needs.discover.outputs.secret_scanning.
    required: false
    default: ''
  push-protection:
    description: needs.discover.outputs.push_protection.
    required: false
    default: ''
  dependabot-alerts:
    description: needs.discover.outputs.dependabot_alerts.
    required: false
    default: ''
  dependabot-updates:
    description: needs.discover.outputs.dependabot_updates.
    required: false
    default: ''
  dependabot-config:
    description: needs.discover.outputs.dependabot_config -- PRESENT or ABSENT.
    required: false
    default: ''
  visibility:
    description: needs.discover.outputs.visibility.
    required: false
    default: ''
  platform-source:
    description: needs.discover.outputs.platform_source -- how the platform values were established.
    required: false
    default: ''

outputs:
  # The job maps every one of these to a job output of the same name, so consumers read
  # `needs.resolve.outputs.<name>` and never learn where the step runs.
  state:
    description: COMPLETE / DISCOVERY_PARTIAL / DISCOVERY_UNAVAILABLE for this position.
    value: ${{ steps.r.outputs.state }}
  versions:
    description: R2. JSON list, one record per (class, root, kind), with the strength of the evidence.
    value: ${{ steps.r.outputs.versions }}
  capability:
    description: R3. JSON list, one row per (class, root, scanner job, tool), with the answer and its basis.
    value: ${{ steps.r.outputs.capability }}
  version_gaps:
    description: Every VERSION_UNSUPPORTED answer as class@root:job/tool, comma-separated.
    value: ${{ steps.r.outputs.version_gaps }}
  version_gap_count:
    description: The count of version_gaps; UNDETERMINED when the resolver itself failed.
    value: ${{ steps.r.outputs.version_gap_count }}
  version_undetermined_count:
    description: The count of VERSION_SUPPORT_UNDETERMINED answers; UNDETERMINED when the resolver failed.
    value: ${{ steps.r.outputs.version_undetermined_count }}
  coverage:
    description: Class-and-count coverage, never a percentage.
    value: ${{ steps.r.outputs.coverage }}
  plan:
    description: R4, ADVISORY. The execution plan as data; enforced by nothing.
    value: ${{ steps.r.outputs.plan }}
  # ── KDEC-010: the capability selects the scanner ──────────────────────────────────────
  selection:
    description: >-
      JSON list, one record per (capability, root): the ordered candidates with each one's
      verdict, the default, the selected scanner, and SERVED / SUBSTITUTION / VERSION_GAP.
    value: ${{ steps.r.outputs.selection }}
  substitutions:
    description: Every SUBSTITUTION as capability@root:default->selected, comma-separated. Never equivalence.
    value: ${{ steps.r.outputs.substitutions }}
  capability_gaps:
    description: Every capability@root no carried scanner can read, comma-separated. Each is PARTIAL, never PASS.
    value: ${{ steps.r.outputs.capability_gaps }}
  capability_gap_count:
    description: The count of capability_gaps; UNDETERMINED when the resolver itself failed.
    value: ${{ steps.r.outputs.capability_gap_count }}
  capped_jobs:
    description: Space-separated scanner jobs pointed at a VERSION_GAP. Their PASS is capped at PARTIAL by the gate and the report.
    value: ${{ steps.r.outputs.capped_jobs }}
  proven_gap_jobs:
    description: >-
      KDEC-014. Space-separated capped jobs at least one of whose VERSION_GAPs is established by
      READ ranges for every claimed candidate, each answering that it cannot read the target. A
      production-tier deploy enforces those; a gap resting on an UNVERIFIED range, or on a target
      no range can be held against (no version declared, a floor spanning the ceiling), is
      recorded instead.
    value: ${{ steps.r.outputs.proven_gap_jobs }}
  not_selected_jobs:
    description: >-
      Space-separated scanner jobs that cannot read a target another selected scanner serves.
      Their PASS for it is PARTIAL; the selected scanner carries the claim.
    value: ${{ steps.r.outputs.not_selected_jobs }}
  fitness_notes:
    description: One human-readable note per capped or not-selected job, " ; "-separated, for the gate summary.
    value: ${{ steps.r.outputs.fitness_notes }}
  dependabot_state:
    description: Dependabot alerts read as a scanner -- FINDINGS / PASS / UNAVAILABLE / COLLECTION_FAILED.
    value: ${{ steps.platform.outputs.dependabot_state }}
  dependabot_open_alerts:
    description: The open-alert count behind dependabot_state, when one was read.
    value: ${{ steps.platform.outputs.dependabot_open_alerts }}
  dependabot_basis:
    description: Why dependabot_state is what it is; an API answer has no SARIF behind it.
    value: ${{ steps.platform.outputs.dependabot_basis }}
  dependabot_owner_role:
    description: The ROLE that owns the Dependabot state, never a person.
    value: ${{ steps.platform.outputs.dependabot_owner_role }}
  dataflow_capability:
    description: >-
      ordinary | UNKNOWN for interprocedural dataflow on this tier. Code scanning UNAVAILABLE is
      UNKNOWN, not a gap: it refuses publication, and CodeQL's own job says whether it analysed (D-10).
    value: ${{ steps.platform.outputs.dataflow_capability }}
  platform_owners:
    description: JSON list of every platform-owned state with its owner role and action.
    value: ${{ steps.platform.outputs.platform_owners }}

runs:
  using: composite
  steps:
    - name: Resolve versions, capability, coverage and the plan
      id: r
      shell: bash
      env:
        # CALLER-CONTROLLED INPUT ARRIVES AS DATA, NOT AS SCRIPT TEXT (same rule as discover).
        IN_PATHS: ${{ inputs.paths }}
        # The RUNNER toolchain versions. These are what the kit installs; they are NOT what the
        # repository targets, and the whole point of this job is to compare the two.
        IN_PYTHON_VERSION: ${{ inputs.python-version }}
        IN_NODE_VERSION: ${{ inputs.node-version }}
        IN_GO_VERSION: ${{ inputs.go-version }}
        IN_DOTNET_VERSION: ${{ inputs.dotnet-version }}
        IN_JAVA_VERSION: ${{ inputs.java-version }}
        IN_IMAGE_REF: ${{ inputs.image-ref }}
        IN_ENABLE_SBOM: ${{ inputs.enable-sbom }}
        IN_ENABLE_MALICIOUS_PKG_SCAN: ${{ inputs.enable-malicious-pkg-scan }}
        # The platform's answer for code scanning (PO 6). It governs PUBLICATION, not analysis
        # (KNOWN_DEFECTS D-10): recorded on the CodeQL candidate, never a withdrawal of it.
        IN_CODE_SCANNING: ${{ inputs.code-scanning }}
        # What discovery established. Read as DATA; an empty value is "discovery did not say",
        # which is an unknown and is treated as one, never as false.
        D_PYTHON: ${{ inputs.discovered-python }}
        D_NODE: ${{ inputs.discovered-node }}
        D_GO: ${{ inputs.discovered-go }}
        D_DOTNET: ${{ inputs.discovered-dotnet }}
        D_JAVA: ${{ inputs.discovered-java }}
        D_CPP: ${{ inputs.discovered-cpp }}
        D_PHP: ${{ inputs.discovered-php }}
        D_KOTLIN: ${{ inputs.discovered-kotlin }}
        D_SWIFT: ${{ inputs.discovered-swift }}
        D_MOBILE: ${{ inputs.discovered-mobile }}
        D_IAC: ${{ inputs.discovered-iac }}
        D_STATE: ${{ inputs.discovery-state }}
        D_COVERAGE_GAPS: ${{ inputs.coverage-gaps }}
        D_UNSUPPORTED: ${{ inputs.unsupported }}
        # The trigger context, for the advisory plan's depth (EXECUTION_PLANNING §3.2). Set
        # by GitHub, so TRUSTED; passed as data anyway so the step reads one name.
        gh_event: ${{ inputs.event-name }}
      run: |
        set -uo pipefail
        scope="${IN_PATHS:-.}"
        [ -d "$scope" ] || scope="."

        # FAIL-SAFE, THE SAME SHAPE AS DISCOVERY'S. If the resolver itself cannot run, nothing
        # it would have established is established. That is DISCOVERY_UNAVAILABLE for this
        # position -- every capability answer is undetermined, which is a gap, and the scanners
        # still run. It must never present as a tidy COMPLETE, and it must never block the
        # scanners from running: a resolver that fails closed would convert its own defect into
        # an unscanned repository.
        trap 'echo "::error title=Resolve failed::Versions and capability could not be established. Every version answer is VERSION_SUPPORT_UNDETERMINED; scanners run and their silence is not coverage."; \
              echo "state=DISCOVERY_UNAVAILABLE" >> "$GITHUB_OUTPUT"; \
              echo "versions=[]" >> "$GITHUB_OUTPUT"; \
              echo "capability=[]" >> "$GITHUB_OUTPUT"; \
              echo "coverage=[]" >> "$GITHUB_OUTPUT"; \
              echo "plan={\"advisory\":true,\"enforced_by\":\"nothing\",\"survey\":\"DISCOVERY_UNAVAILABLE\",\"jobs\":[],\"decisions\":{}}" >> "$GITHUB_OUTPUT"; \
              echo "version_gaps=" >> "$GITHUB_OUTPUT"; \
              echo "version_gap_count=UNDETERMINED" >> "$GITHUB_OUTPUT"; \
              echo "version_undetermined_count=UNDETERMINED" >> "$GITHUB_OUTPUT"; \
              echo "selection=[]" >> "$GITHUB_OUTPUT"; \
              echo "substitutions=" >> "$GITHUB_OUTPUT"; \
              echo "capability_gaps=" >> "$GITHUB_OUTPUT"; \
              echo "capability_gap_count=UNDETERMINED" >> "$GITHUB_OUTPUT"; \
              echo "capped_jobs=" >> "$GITHUB_OUTPUT"; \
              echo "proven_gap_jobs=" >> "$GITHUB_OUTPUT"; \
              echo "not_selected_jobs=" >> "$GITHUB_OUTPUT"; \
              echo "fitness_notes=" >> "$GITHUB_OUTPUT"; \
              echo "| (resolve) | DISCOVERY_UNAVAILABLE | the resolver itself failed; every version answer is undetermined |" >> "$GITHUB_STEP_SUMMARY"; \
              exit 0' ERR

        # Lower-case env names on purpose: these are transport, not vocabulary, and the taxonomy
        # reconciler reads an upper-case underscored name as a state.
        export resolve_scope="$scope"
        export resolve_work="$(mktemp -d)"

        # ── THE PER-SCANNER RANGE TABLE, AS DATA ──────────────────────────────────────────
        # A byte-for-byte copy of `version_support:` in scanner-registry.yaml, carried here because
        # a reusable workflow cannot read the kit's own files at consumer runtime.
        # tests/test_resolve.py fails if this copy and the registry differ. EDIT THE REGISTRY, then
        # paste `json.dumps(version_support, indent=2, sort_keys=True)` here.
        cat > "$resolve_work/version_support.json" <<'JSON'
        {
          "code-quality": {
            "node": [
              {
                "basis": "eslint's parser is configured by the project (ecmaVersion); not established here.",
                "compare": "version",
                "max": null,
                "max_from_input": null,
                "min": null,
                "tool": "eslint",
                "unbounded": false,
                "verified": "UNVERIFIED"
              }
            ],
            "python": [
              {
                "basis": "mypy parses with the running interpreter and exits 2 on a syntax it cannot read (PO section 3.6). ruff has its own parser and is not declared here.",
                "compare": "version",
                "max": null,
                "max_from_input": "python_version",
                "min": null,
                "tool": "mypy",
                "unbounded": false,
                "verified": "READ"
              }
            ]
          },
          "codeql": {
            "cpp": [
              {
                "basis": "C89 to C23, C++98 to C++23, the 23s in beta; C++20 modules not supported (same page).",
                "compare": "standard_year",
                "max": "23",
                "max_from_input": null,
                "min": null,
                "tool": "codeql",
                "unbounded": false,
                "verified": "READ"
              }
            ],
            "dotnet": [
              {
                "basis": "C# up to 14 and .NET up to 10 (same page); autobuild restores with the SDK the caller chose.",
                "compare": "version",
                "max": "10",
                "max_from_input": "dotnet_version",
                "min": null,
                "tool": "codeql",
                "unbounded": false,
                "verified": "READ"
              }
            ],
            "go": [
              {
                "basis": "Go up to 1.27, requires Go 1.11 or newer (same page).",
                "compare": "version",
                "max": "1.27",
                "max_from_input": null,
                "min": "1.11",
                "tool": "codeql",
                "unbounded": false,
                "verified": "READ"
              }
            ],
            "java": [
              {
                "basis": "Java 7 to 26 (javac, ECJ) (same page); autobuild compiles with the JDK the caller chose, so a release above it fails the build (PO section 3.5, the cq_build defect).",
                "compare": "version",
                "max": "26",
                "max_from_input": "java_version",
                "min": "7",
                "tool": "codeql",
                "unbounded": false,
                "verified": "READ"
              }
            ],
            "kotlin": [
              {
                "basis": "Kotlin 1.8.0 to 2.4.20 (CodeQL supported languages page as fetched 2026-10-23, KDEC-026). The java-kotlin leg extracts Kotlin while autobuild compiles it; Swift is not carried (it needs a macOS runner).",
                "compare": "version",
                "max": "2.4.20",
                "max_from_input": null,
                "min": "1.8.0",
                "tool": "codeql",
                "unbounded": false,
                "verified": "READ"
              }
            ],
            "node": [
              {
                "basis": "ECMAScript 2022 or lower; TypeScript 2.6 to 7.0 (same page). A node RUNTIME version does not establish the syntax level; tsconfig target does.",
                "compare": "syntax_level",
                "max": "ES2022",
                "max_from_input": null,
                "min": null,
                "tool": "codeql",
                "unbounded": false,
                "verified": "READ"
              }
            ],
            "python": [
              {
                "basis": "Python 2.7, 3.5 to 3.14; the extractor needs a Python 3 to run but parses independently of it (CodeQL supported languages page as fetched 2026-09-23, PO section 3.5). 2.7 is not modelled.",
                "compare": "version",
                "max": "3.14",
                "max_from_input": null,
                "min": "3.5",
                "tool": "codeql",
                "unbounded": false,
                "verified": "READ"
              }
            ]
          },
          "deps-scan": {
            "GitHubActionsWorkflow": [
              {
                "basis": "actionlint 1.7.12 (sha256-pinned) checks against the workflow syntax it ships; a key newer than it is reported as a syntax-check finding, never skipped. It shellchecks every run: block with shellcheck 0.11.0. Measured 2026-10-23 by tests/prove_pipeline_lint.py.",
                "compare": "version",
                "corpus": "tests/corpora/pipeline_lint_corpus.py",
                "max": null,
                "max_from_input": null,
                "min": null,
                "tool": "actionlint",
                "unbounded": true,
                "verified": "READ"
              },
              {
                "basis": "zizmor 1.30.1 (sha256-pinned), offline, --no-config: template injection, excessive permissions, unpinned uses, dangerous triggers. A workflow it cannot load is a zizmor error exit, COLLECTION_FAILED. Measured 2026-10-23 by tests/prove_pipeline_lint.py.",
                "compare": "version",
                "corpus": "tests/corpora/pipeline_lint_corpus.py",
                "max": null,
                "max_from_input": null,
                "min": null,
                "tool": "zizmor",
                "unbounded": true,
                "verified": "READ"
              }
            ],
            "PowerShell": [
              {
                "basis": "PSScriptAnalyzer 1.25.0 (sha256-pinned nupkg) parses with the runner's pwsh, 7.4.x on ubuntu-latest at 2026-10-23; the job compares each file's #Requires -Version with the pwsh it actually ran and names a newer one as a VERSION_GAP (measured: #Requires -Version 99.0 returned no result and no error). Measured 2026-10-23 by tests/prove_pipeline_lint.py.",
                "compare": "version",
                "corpus": "tests/corpora/pipeline_lint_corpus.py",
                "max": "7.4",
                "max_from_input": null,
                "min": null,
                "tool": "psscriptanalyzer",
                "unbounded": false,
                "verified": "READ"
              }
            ],
            "Shell": [
              {
                "basis": "shellcheck 0.11.0 (sha256-pinned) reads the sh, bash, dash, ksh and busybox dialects; any other shebang (zsh, fish, csh) is a per-file VERSION_GAP the job names (measured: SC1071 on zsh). No shebang: .sh as POSIX sh, .bash as bash, stated. Measured 2026-10-23 by tests/prove_pipeline_lint.py.",
                "compare": "version",
                "corpus": "tests/corpora/pipeline_lint_corpus.py",
                "max": null,
                "max_from_input": null,
                "min": null,
                "tool": "shellcheck",
                "unbounded": true,
                "verified": "READ"
              }
            ]
          },
          "iac-scan": {
            "Dockerfile": [
              {
                "basis": "hadolint 2.15.1 (sha256-pinned in iac-scan) parses the Dockerfile itself; no syntax version is discovered or claimed. An unparseable file is DL1000, NAMED as a VERSION_GAP by the job, not counted. Measured 2026-10-23 (DL3000/DL3002/DL3007/DL3008/DL3020 seeded and read) by tests/prove_pipeline_lint.py.",
                "compare": "version",
                "corpus": "tests/corpora/pipeline_lint_corpus.py",
                "max": null,
                "max_from_input": null,
                "min": null,
                "tool": "hadolint",
                "unbounded": true,
                "verified": "READ"
              }
            ],
            "iac": [
              {
                "basis": "MEASURED by the seeded Terraform corpus (tests/corpora/terraform_corpus.py; D-VF-4): checkov 3.3.30 (and 3.3.29) read the seed in every family 0.12..1.14 (families: 0.12, 0.13, 0.14, 0.15, 1.1, 1.2, 1.3, 1.4, 1.5, 1.7, 1.8, 1.9, 1.10, 1.11, 1.14); every family in the corpus was read; no newer family is in it, so a newer release is outside what was measured. Releases with no new .tf construct are claimed through their neighbours. Measured 2026-10-21 (locally: the image checkov-action@v12 runs, ghcr.io/bridgecrewio/checkov 3.3.30 by digest sha256:4b65e89f1fde, and pip 3.3.29/3.3.30 on Windows; confirmed hosted by probe-scanner-corpora run 39640950138 on 37e4e77, --check PASS) by tests/corpora/probe_iac_corpus.py.",
                "compare": "version",
                "corpus": "tests/corpora/terraform_corpus.py",
                "max": "1.14",
                "max_from_input": null,
                "min": "0.12",
                "tool": "checkov",
                "unbounded": false,
                "verified": "READ"
              },
              {
                "basis": "MEASURED by the seeded Terraform corpus (tests/corpora/terraform_corpus.py; D-VF-4): trivy-config 0.71.2 (and 0.70.0) read the seed in every family 0.12..1.14 (families: 0.12, 0.13, 0.14, 0.15, 1.1, 1.2, 1.3, 1.4, 1.5, 1.7, 1.8, 1.9, 1.10, 1.11, 1.14); every family in the corpus was read; no newer family is in it, so a newer release is outside what was measured. Releases with no new .tf construct are claimed through their neighbours. Measured 2026-10-21 (locally, sha256-verified Windows release binaries; confirmed hosted for 0.71.2 and 0.70.0 by probe-scanner-corpora run 39640950138 on 37e4e77, --check PASS) by tests/corpora/probe_iac_corpus.py.",
                "compare": "version",
                "corpus": "tests/corpora/terraform_corpus.py",
                "max": "1.14",
                "max_from_input": null,
                "min": "0.12",
                "tool": "trivy-config",
                "unbounded": false,
                "verified": "READ"
              }
            ]
          },
          "sast-bandit": {
            "python": [
              {
                "basis": "bandit builds its AST with the ast module of the interpreter it runs under, so its ceiling IS the runner interpreter. Reproduced 2026-09-23: PEP 695 syntax skipped with exit 0 under 3.11 (PO section 3.1-3.2).",
                "compare": "version",
                "max": null,
                "max_from_input": "python_version",
                "min": null,
                "tool": "bandit",
                "unbounded": false,
                "verified": "READ"
              }
            ]
          },
          "sast-cpp": {
            "cpp": [
              {
                "basis": "simple lexical tokenisation, no parse, so no language standard can break it; blind only by file extension (PO section 3.6).",
                "compare": "standard_year",
                "max": null,
                "max_from_input": null,
                "min": null,
                "tool": "flawfinder",
                "unbounded": true,
                "verified": "READ"
              },
              {
                "basis": "not established; whether its critical-error report survives into SARIF is PO section 3.6's open experiment.",
                "compare": "standard_year",
                "max": null,
                "max_from_input": null,
                "min": null,
                "tool": "cppcheck",
                "unbounded": false,
                "verified": "UNVERIFIED"
              }
