name: SAST (C / C++)
description: >-
  The sast-cpp job's steps (cppcheck and flawfinder), moved out of reusable-security.yml unchanged
  (completion ledger L64, decomposition plan section 7 step 12) and reached through `$/`, which
  delivers the whole kit at the commit the caller pinned. The job keeps its discovery condition,
  timeout, needs and Result summary; this composite is its FIRST step, so every `if:` below sees
  exactly the step history it saw inline. tests/prove_composite_move_equivalence.py expands this
  file back into the job and compares it with the job as it stood before the move.

# Each input carries the job's own expression through unchanged, and each is read only as DATA
# through env:, where a boolean and its string rendering are the same text.
inputs:
  paths:
    description: The workflow's `paths` input -- the scope both analyzers read.
    required: true
  soft_fail_sast:
    description: The workflow's `soft_fail_sast` input, rendered as 'true' or 'false'.
    required: true
  advisory_mode:
    description: The workflow's `advisory_mode` input, rendered as 'true' or 'false'.
    required: true

# What the security gate enforces (lane L-S, O-24): FINDINGS when cppcheck's or flawfinder's
# threshold fired and no caller input softened it, '' otherwise. Read through the call's id.
outputs:
  findings_state:
    description: FINDINGS when this scan's own threshold fired unsoftened; '' otherwise.
    value: ${{ steps.cppcheck_enforce.outputs.findings_state || steps.flawfinder_enforce.outputs.findings_state }}
  # KDEC-026 (lane L-SCAN-B): COMPLETE when every C/C++ source was analysed through a compilation
  # database; PARTIAL with scan_reason CPP_ANALYSIS_PARTIAL when any was analysed source-only.
  scan_state:
    description: COMPLETE or PARTIAL (build metadata); '' when the step did not run.
    value: ${{ steps.cpp_build.outputs.scan_state }}
  scan_reason:
    description: CPP_ANALYSIS_PARTIAL beside a PARTIAL scan_state; '' otherwise.
    value: ${{ steps.cpp_build.outputs.scan_reason }}

runs:
  using: composite
  steps:
    # BEGIN FETCH_KIT_SCRIPTS — generated by scripts/inline_normalizer.py. DO NOT EDIT HERE.
    - name: Fetch the kit's own scripts
      # A RUN-SCOPED ARTIFACT, NOT `uses: ./` and NOT a copy per call site. Why, at
      # length, in the `kit-scripts` job at the top of .github/workflows/reusable-security.yml.
      if: always()
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: kit-scripts-${{ github.run_attempt }}
        path: /tmp
    - name: Verify the kit scripts against their pinned digest
      # A DOWNLOADED SCRIPT NOBODY VERIFIED IS A SUPPLY CHAIN STEP WITH NO INTEGRITY
      # CHECK. Why this digest and not a manifest fetched beside it: `kit-scripts`.
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        cd /tmp
        echo "77747346d57de23c8a301758499db36f89f41e3850a2495497d2983a6cb3916a  kit-scripts.sha256" | sha256sum -c -
        sha256sum -c kit-scripts.sha256
    # END FETCH_KIT_SCRIPTS
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    # THIS STEP HUNG FOR THREE HOURS on 2026-08-18 with ZERO output and billed ~193 minutes
    # before anything stopped it. A slow mirror still prints "Get:" lines; silence means apt is
    # BLOCKING ON THE DPKG LOCK, which GitHub's Ubuntu images hold at boot via
    # unattended-upgrades. Under -qq it waits silently and forever. DPkg::Lock::Timeout makes it
    # FAIL instead of blocking -- without it there is no bound except the job timeout.
    - name: Install analyzers
      shell: bash -e {0}
      run: |
        set -euo pipefail
        # PRESENCE IS NOT FITNESS, and an install that "succeeded" is not a tool that runs.
        # Skip the call that hangs when the tools are already usable; otherwise install with
        # the dpkg-lock bound; then PROVE both execute before claiming any coverage.
        need_apt=false
        for tool in cppcheck flawfinder; do
          command -v "$tool" >/dev/null 2>&1 || need_apt=true
        done

        if [ "$need_apt" = "true" ]; then
          for i in 1 2 3; do
            if timeout 180 sudo apt-get -o DPkg::Lock::Timeout=60 update -qq; then break; fi
            echo "::warning title=apt update blocked::attempt $i (likely dpkg lock); retrying"
            sleep $(( i * 10 ))
          done
          timeout 300 sudo apt-get -o DPkg::Lock::Timeout=60 install -y --no-install-recommends cppcheck flawfinder || {
            echo "::error title=DEPENDENCY_ACQUISITION_UNAVAILABLE::cppcheck/flawfinder not installed."
            echo "The C/C++ scanners never ran. This is NOT evidence of no vulnerabilities."
            exit 1; }
        else
          echo "cppcheck and flawfinder already present -- no package installation attempted."
        fi

        # USABILITY BY RUNNING THE REAL TOOL, not a proxy for it. `command -v` only proves a
        # name resolves; a version string only proves something self-reported. Invoking the
        # actual binary proves the whole chain. Do not 'simplify' this back to `command -v`.
        # A tool on PATH that cannot execute is an absent tool
        # wearing a convincing costume.
        for tool in cppcheck flawfinder; do
          if ! "$tool" --version >/dev/null 2>&1; then
            echo "::error title=DEPENDENCY_ACQUISITION_UNAVAILABLE::$tool present but not runnable."
            echo "The C/C++ scanners never ran. This is NOT evidence of no vulnerabilities."
            exit 1
          fi
          echo "  $tool: $("$tool" --version 2>&1 | head -1)"
        done

        # RECORD the SARIF capability rather than discovering it by failure. flawfinder gained
        # --sarif in 2.0.11; older distro builds lack it and the kit falls back to CSV.
        # Establishing it up front makes the fallback a DECISION with evidence instead of an
        # exception handler that happens to catch it.
        if flawfinder --help 2>&1 | grep -q -- "--sarif"; then
          echo "FLAWFINDER_SARIF=true" >> "$GITHUB_ENV"
          echo "  flawfinder: SARIF supported"
        else
          echo "FLAWFINDER_SARIF=false" >> "$GITHUB_ENV"
          echo "::notice title=flawfinder SARIF unsupported::This build predates --sarif; the"
          echo "CSV path will be used and converted. Coverage is unaffected."
        fi
    # BUILD-AWARE C/C++, WITHOUT INVENTING A BUILD (lane L-SCAN-B, KDEC-026). FUTURE_WORK section 5:
    # "Report CPP_ANALYSIS_PARTIAL when source exists without build metadata -- and never
    # synthesise a build system to make a scanner happy." Measured 2026-10-23 (cppcheck 2.13.0,
    # tests/prove_cpp_build_aware.py): a write past a buffer whose size comes from a header on the
    # build's include path is INVISIBLE source-only and reported through the compilation database.
    # A compilation database is taken from, in order: one committed in the tree (trusted only when
    # the files it names exist here); CMake CONFIGURE ONLY (-DCMAKE_EXPORT_COMPILE_COMMANDS=ON)
    # for each top-level CMakeLists.txt, into a build tree OUTSIDE the checkout; bear over make for
    # each top-level Makefile, only when `make -n` already works. Nothing else: no CMakeLists, no
    # Makefile and no flags are ever written for code that has none. Configure and make run the
    # repository's own build scripts -- the trust CodeQL's autobuild already extends to them.
    # Any source file no database covers is analysed source-only and the scan is PARTIAL
    # (scan_reason CPP_ANALYSIS_PARTIAL): read by the gate as COVERAGE_PARTIAL, never PASS.
    - name: C/C++ build metadata
      id: cpp_build
      env:
        IN_PATHS: ${{ inputs.paths }}
      shell: bash -e {0}
      run: |
        set -uo pipefail
        scope="${IN_PATHS:-.}"; [ -d "$scope" ] || scope="."
        work="$RUNNER_TEMP/cpp-build"
        rm -rf "$work"; mkdir -p "$work"
        : > "$work/dbs.txt"; : > "$work/notes.txt"
        note() { printf '%s\n' "$1" >> "$work/notes.txt"; echo "$1"; }
        absdb() { printf '%s/%s\n' "$(cd "$(dirname "$1")" && pwd)" "$(basename "$1")"; }
        # suppression: PRESENTATION_ONLY -- find's stderr is noise on unreadable subtrees; a root it
        # cannot see contributes no database, and its sources are then counted as uncovered below.
        # discards: find's stderr on unreadable subtrees
        # preserved_by: the coverage count, which makes any source without a database PARTIAL
        find "$scope" -maxdepth 8 -type f -name compile_commands.json -not -path '*/node_modules/*' \
          -not -path '*/vendor/*' -not -path '*/.git/*' 2>/dev/null | sort > "$work/committed.txt" || true
        while IFS= read -r db; do
          [ -n "$db" ] || continue
          absdb "$db" >> "$work/dbs.txt"; note "committed compilation database: $db"
        done < "$work/committed.txt"
        # CMake: configure only, for each TOP-LEVEL CMakeLists.txt (its parent directory has none).
        i=0
        find "$scope" -maxdepth 8 -type f -name CMakeLists.txt -not -path '*/node_modules/*' \
          -not -path '*/vendor/*' -not -path '*/.git/*' 2>/dev/null | sort > "$work/cmake.txt" || true
        while IFS= read -r cm; do
          [ -n "$cm" ] || continue
          d="$(dirname "$cm")"
          if [ "$d" != "$scope" ] && [ -f "$(dirname "$d")/CMakeLists.txt" ]; then continue; fi
          if ! command -v cmake >/dev/null 2>&1; then note "cmake is not on this runner: $d is analysed source-only"; continue; fi
          i=$((i + 1)); b="$work/cmake-$i"
          if timeout 300 cmake -S "$d" -B "$b" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON > "$b.log" 2>&1 \
             && [ -s "$b/compile_commands.json" ]; then
            echo "$b/compile_commands.json" >> "$work/dbs.txt"
            note "cmake configure-only export for $d (build tree outside the checkout)"
          else
            note "cmake configure FAILED for $d: its sources are analysed source-only (last lines: $(tail -n 3 "$b.log" | tr '\n|' ' /'))"
          fi
        done < "$work/cmake.txt"
        # make: bear over the repository's own Makefile, for each TOP-LEVEL Makefile in a directory
        # with no CMakeLists.txt, and only when `make -n` already works there.
        j=0
        find "$scope" -maxdepth 8 -type f \( -name Makefile -o -name makefile -o -name GNUmakefile \) \
          -not -path '*/node_modules/*' -not -path '*/vendor/*' -not -path '*/.git/*' 2>/dev/null | sort > "$work/make.txt" || true
        while IFS= read -r mk; do
          [ -n "$mk" ] || continue
          d="$(dirname "$mk")"
          [ -f "$d/CMakeLists.txt" ] && continue
          if [ "$d" != "$scope" ] && { [ -f "$(dirname "$d")/Makefile" ] || [ -f "$(dirname "$d")/makefile" ] || [ -f "$(dirname "$d")/GNUmakefile" ]; }; then continue; fi
          if ! timeout 60 make -n -C "$d" > /dev/null 2>&1; then
            note "make -n does not work in $d: no database is invented, its sources are analysed source-only"
            continue
          fi
          if ! command -v bear >/dev/null 2>&1; then
            timeout 300 sudo apt-get -o DPkg::Lock::Timeout=60 install -y --no-install-recommends bear > /dev/null 2>&1 || true
          fi
          if ! command -v bear >/dev/null 2>&1; then note "bear could not be installed: $d is analysed source-only"; continue; fi
          j=$((j + 1)); out="$work/make-$j.json"
          if timeout 600 bear --output "$out" -- make -k -C "$d" > "$work/make-$j.log" 2>&1 || [ -s "$out" ]; then
            if [ -s "$out" ]; then echo "$out" >> "$work/dbs.txt"; note "bear over make in $d"; else note "bear recorded nothing in $d"; fi
          else
            note "bear over make FAILED in $d: its sources are analysed source-only"
          fi
        done < "$work/make.txt"
        # WHAT THE DATABASES COVER, from the files they name that EXIST HERE. A database naming none
        # (built on another machine) is not trusted. Every C/C++ translation unit no trusted
        # database covers is listed for the source-only pass, and makes the scan PARTIAL.
        SCOPE="$scope" WORK="$work" python3 - <<'CPPDB_PY'
        import io, json, os
        scope, work = os.environ["SCOPE"], os.environ["WORK"]
        def out(**kv):
            with io.open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as o:
                for k, v in kv.items():
                    o.write("%s=%s\n" % (k, v))
        notes = [l.rstrip("\n") for l in io.open(os.path.join(work, "notes.txt"), encoding="utf-8")]
        covered, trusted = set(), []
        for db in [l.strip() for l in io.open(os.path.join(work, "dbs.txt"), encoding="utf-8") if l.strip()]:
            try:
                entries = json.load(io.open(db, encoding="utf-8"))
            except (OSError, ValueError) as exc:
                notes.append("database %s unreadable (%s): not used" % (db, exc)); continue
            here = set()
            for e in entries if isinstance(entries, list) else []:
                f = e.get("file") or ""
                f = f if os.path.isabs(f) else os.path.join(e.get("directory") or "", f)
                if os.path.isfile(f):
                    here.add(os.path.realpath(f))
            if here:
                trusted.append(db); covered |= here
            else:
                notes.append("database %s names no file that exists here: not trusted" % db)
        exts = (".c", ".cc", ".cpp", ".cxx", ".c++")
        sources = []
        for root, dirs, files in os.walk(scope):
            dirs[:] = [d for d in dirs if d not in ("node_modules", "vendor", ".git")]
            if os.path.relpath(root, scope).count(os.sep) >= 8:
                dirs[:] = []
            sources += [os.path.join(root, f) for f in files if f.lower().endswith(exts)]
        uncovered = sorted(s for s in sources if os.path.realpath(s) not in covered)
        io.open(os.path.join(work, "dbs-trusted.txt"), "w", encoding="utf-8").write("".join(d + "\n" for d in trusted))
        io.open(os.path.join(work, "uncovered.txt"), "w", encoding="utf-8").write("".join(u + "\n" for u in uncovered))
        state = "COMPLETE" if not uncovered else "PARTIAL"
        out(compile_dbs=len(trusted), uncovered=len(uncovered), sources=len(sources))
        io.open(os.path.join(work, "scan_state"), "w", encoding="utf-8").write(state)
        with io.open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as s:
            s.write("### C/C++ build metadata\n\n")
            for n in notes:
                s.write("- %s\n" % n.replace("|", "/"))
            if not sources:
                s.write("- no C/C++ translation unit in scope\n\n")
            elif uncovered:
                io.open(os.path.join(work, "scan_reason"), "w", encoding="utf-8").write("CPP_ANALYSIS_PARTIAL")
                s.write("\n**PARTIAL -- CPP_ANALYSIS_PARTIAL**: %d of %d C/C++ source file(s) had no build "
                        "metadata and were analysed source-only (includes and macros unresolved; a "
                        "silence there is not clean). No build system was synthesised.\n\n"
                        % (len(uncovered), len(sources)))
                for u in uncovered[:20]:
                    s.write("- `%s`\n" % os.path.relpath(u, ".").replace(os.sep, "/"))
                s.write("\n")
                print("::warning title=PARTIAL (CPP_ANALYSIS_PARTIAL)::%d of %d C/C++ source file(s) had no "
                      "compilation database and were analysed source-only. Findings stand; the rest of "
                      "those files' behaviour under their real includes and macros was NOT analysed. "
                      "PARTIAL, never PASS." % (len(uncovered), len(sources)))
            else:
                s.write("\nEvery C/C++ source file was analysed through a compilation database (%d).\n\n"
                        % len(trusted))
        print("build metadata: %d database(s), %d of %d source file(s) uncovered -> %s"
              % (len(trusted), len(uncovered), len(sources), state))
        CPPDB_PY
        # The state is written HERE, by name, and only once the coverage was computed: a step that
        # failed above publishes no state, and the gate reads '' as unknown, never as COMPLETE.
        # One line each (KDEC-027): a value is read into a variable and its newlines flattened.
        if [ -s "$work/scan_state" ]; then
          v="$(cat "$work/scan_state")"
          echo "scan_state=${v//[$'\r\n']/ }" >> "$GITHUB_OUTPUT"
        fi
        if [ -s "$work/scan_reason" ]; then
          v="$(cat "$work/scan_reason")"
          echo "scan_reason=${v//[$'\r\n']/ }" >> "$GITHUB_OUTPUT"
        fi
    - name: cppcheck
      id: cppcheck
      env:
        IN_PATHS: ${{ inputs.paths }}
      shell: bash -e {0}
      run: |
        set -uo pipefail
        scope="${IN_PATHS:-.}"; [ -d "$scope" ] || scope="."
        # Continuation-then-comment defect -- see the note at the C# scanner. `--xml`,
        # `--output-file` and "$scope" were all being discarded, so cppcheck ran unscoped and
        # wrote no XML for the converter downstream.
        #
        # THE XML DECIDES, NOT THE EXIT CODE. Measured, cppcheck 2.21.0
        # (tests/prove_cppcheck_collects.py): findings of severity `error` exit 0; an output
        # file it cannot write ALSO exits 0, with no XML; a scope with no C/C++ exits 1 with
        # "could not find or open any of the paths given". So the code is recorded for the
        # converter, which reads it beside the XML.
        rm -f cppcheck.xml cppcheck.sarif cppcheck-db-*.xml cppcheck-db-*.out
        rc=0
        # BUILD-AWARE FIRST (KDEC-026): one pass per trusted compilation database, then the
        # source-only pass over only what no database covers. With no database the source-only pass
        # is the whole scan, exactly as before.
        dbs="${RUNNER_TEMP:-/tmp}/cpp-build/dbs-trusted.txt"; unc="${RUNNER_TEMP:-/tmp}/cpp-build/uncovered.txt"
        passes=""
        if [ -s "$dbs" ]; then
          k=0
          while IFS= read -r db; do
            [ -n "$db" ] || continue
            k=$((k + 1)); rcp=0
            cppcheck --enable=warning,style,performance,portability --inline-suppr --project="$db" \
              --xml --output-file="cppcheck-db-$k.xml" > "cppcheck-db-$k.out" 2>&1 || rcp=$?
            tail -n 5 "cppcheck-db-$k.out"
            passes="$passes cppcheck-db-$k:$rcp"
          done < "$dbs"
          if [ -s "$unc" ]; then
            cppcheck --enable=warning,style,performance,portability --inline-suppr --file-list="$unc" \
              --xml --output-file=cppcheck.xml > cppcheck.out 2>&1 || rc=$?
            tail -n 20 cppcheck.out
            passes="$passes cppcheck:$rc"
          fi
        else
          cppcheck --enable=warning,style,performance,portability --inline-suppr \
            --xml --output-file=cppcheck.xml "$scope" > cppcheck.out 2>&1 || rc=$?
          tail -n 20 cppcheck.out
          passes="cppcheck:$rc"
        fi
        # suppression: PRESENTATION_ONLY -- a human-readable listing for the log; the XML run
        # above is the evidence.
        # discards: this listing's exit code, which repeats the XML run's
        # preserved_by: the XML run's exit code and output, read by the converter below, which
        # preserved_by: emits COLLECTION_FAILED for any outcome it cannot account for
        cppcheck --enable=warning --template=gcc "$scope" 2>&1 | tee cppcheck.txt || true
        echo "cppcheck lines: $(wc -l < cppcheck.txt)"

        # cppcheck's findings were produced and then thrown away. The XML was written, never
        # converted, never published, never gated — 159 real defects on the first legacy C++
        # consumer (uninitialised members across several classes) were invisible to everything
        # downstream. A scanner whose output nothing consumes is not a control.
        #
        # A FAILED CONVERSION WRITES NOTHING (ledger L08). An absent or unparseable XML used to
        # produce `results: []` anyway -- a well-formed, clean-looking report from a scan that
        # produced nothing. Now it is COLLECTION_FAILED and no SARIF is written at all.
        CPPCHECK_RC="$rc" CPPCHECK_PASSES="$passes" python3 - <<'CC_PY'
        import io, os, xml.etree.ElementTree as ET, json
        SEV = {"error": "error", "warning": "warning", "portability": "warning",
               "performance": "note", "style": "note", "information": "note"}
        def out(**kv):
            with io.open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as o:
                for k, v in kv.items():
                    o.write("%s=%s\n" % (k, " ".join(str(v).splitlines())))  # one line (KDEC-027)
        def failed(why):
            print("::error title=COLLECTION_FAILED::cppcheck: %s. No SARIF was written: an empty report "
                  "from a scan that produced nothing would read as clean." % why)
            out(collection="COLLECTION_FAILED", sarif="false")
            raise SystemExit(1)
        rc = os.environ.get("CPPCHECK_RC", "")
        # Every pass that ran, as name:exit (KDEC-026: one per compilation database, and the
        # source-only pass). Each one's XML must exist and parse, or nothing is written.
        passes = [p.rsplit(":", 1) for p in os.environ.get("CPPCHECK_PASSES", "cppcheck:" + rc).split()]
        ws = os.getcwd()
        def rel(f):
            if os.path.isabs(f):
                r = os.path.relpath(f, ws)
                f = r if not r.startswith("..") else f
            f = f.replace(os.sep, "/")
            return f[2:] if f.startswith("./") else f
        rows, seen = [], set()
        for name, prc in passes:
            said = io.open(name + ".out", encoding="utf-8", errors="replace").read() if os.path.exists(name + ".out") else ""
            if not os.path.isfile(name + ".xml") or os.path.getsize(name + ".xml") == 0:
                if len(passes) == 1 and prc == "1" and "could not find or open any of the paths" in said:
                    print("::notice title=No C/C++ sources::cppcheck found no sources under the scope. NOT_APPLICABLE.")
                    out(collection="NOT_APPLICABLE", count=0, sarif="false")
                    raise SystemExit(0)
                failed("no XML report from %s (exit %s)" % (name, prc or "unset"))
            try:
                root = ET.parse(name + ".xml").getroot()
            except ET.ParseError as e:
                failed("the XML report of %s does not parse (%s)" % (name, e))
            if root.tag != "results" or root.find("errors") is None:
                failed("the XML report of %s has no <results><errors> element" % name)
            for err in root.iter("error"):
                loc = err.find("location")
                uri = rel(loc.get("file") if loc is not None else "unknown")
                line = max(1, int((loc.get("line") if loc is not None else 1) or 1))
                key = (err.get("id"), uri, line, err.get("msg"))
                if key in seen:
                    continue
                seen.add(key)
                rows.append({
                    "ruleId": f"cppcheck.{err.get('id','unknown')}",
                    "level": SEV.get(err.get("severity", ""), "note"),
                    "message": {"text": (err.get("msg") or "").strip()},
                    "locations": [{"physicalLocation": {
                        "artifactLocation": {"uri": uri},
                        "region": {"startLine": line}}}],
                })
        json.dump({"version": "2.1.0",
                   "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
                   "runs": [{"tool": {"driver": {"name": "cppcheck"}}, "results": rows}]},
                  open("cppcheck.sarif", "w", encoding="utf-8"))
        n = sum(1 for r in rows if r["level"] == "error")
        out(collection="COMPLETE", count=n, sarif="true")
        print(f"cppcheck findings converted to SARIF: {len(rows)} ({n} at severity error)")
        CC_PY
    - name: cppcheck — enforce
      id: cppcheck_enforce
      if: always()
      env:
        N: ${{ steps.cppcheck.outputs.count }}
        COLLECTION: ${{ steps.cppcheck.outputs.collection }}
        SOFT_FAIL_SAST: ${{ inputs.soft_fail_sast }}
        ADVISORY_MODE: ${{ inputs.advisory_mode }}
      shell: bash -e {0}
      run: |
        if [ "${COLLECTION:-}" = "COLLECTION_FAILED" ] || [ -z "${N:-}" ]; then
          echo "::error title=COLLECTION_FAILED::No cppcheck count. An ABSENT measurement is not a measurement of zero."
          exit 1
        fi
        # Findings go to the gate (findings_state), which enforces by the resolved policy (O-24).
        if [ "$N" -gt 0 ] && [ "$SOFT_FAIL_SAST" != "true" ] && [ "$ADVISORY_MODE" != "true" ]; then
          echo "findings_state=FINDINGS" >> "$GITHUB_OUTPUT"
          echo "::warning title=cppcheck::${N} error-severity finding(s). ANALYSIS=COMPLETE -- handed to the security gate, which decides by the resolved policy."
          exit 0
        fi
        echo "cppcheck: ${COLLECTION}, ${N} error-severity finding(s) (soft_fail=${SOFT_FAIL_SAST})"

    # BEGIN REDACT_STEP — generated by scripts/inline_normalizer.py. DO NOT EDIT HERE.
    - name: Redact credential material before upload
      if: always()
      shell: bash
      run: |
        # ORDER IS THE WHOLE CONTROL: this runs immediately before an upload, and
        # again before every later upload that follows a step which may have written
        # output -- a redactor after the upload protects nothing while looking exactly
        # like protection (N24/WP19). The sweep itself is ONE canonical script --
        # scripts/redact_all.sh, written by the `kit-scripts` job and fetched into
        # /tmp by every other -- because fourteen copies of one wrapper are how this
        # file reached 608.8 KB and stopped starting.
        #
        # A MISSING TOOL IS NOT A CLEAN RESULT. If the bundle did not arrive,
        # publication must not proceed on the strength of a scrub that never ran.
        if [ ! -s /tmp/redact_all.sh ]; then
          echo "::error title=Redaction could not be guaranteed::/tmp/redact_all.sh is absent."
          echo "The kit-scripts artifact did not reach this job, so no SARIF was scrubbed"
          echo "and none may be published. A MISSING TOOL IS NOT A CLEAN RESULT."
          exit 1
        fi
        bash /tmp/redact_all.sh
    # END REDACT_STEP
    - name: cppcheck — keep SARIF as an artifact
      # Only a SARIF the converter actually wrote. On COLLECTION_FAILED there is none, by design.
      if: always() && steps.cppcheck.outputs.sarif == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: sarif-cppcheck-${{ github.run_attempt }}
        path: cppcheck.sarif
        retention-days: 30
        if-no-files-found: warn
    - name: cppcheck — publish to the Security tab where available
      id: cs_cppcheck
      if: always() && steps.cppcheck.outputs.sarif == 'true'
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        sarif_file: cppcheck.sarif
        category: cppcheck
    # Findings must survive whether or not this repo has code scanning. Uploading to the
    # Security tab is a PUBLICATION channel, not the finding itself — free on public repos,
    # otherwise Advanced Security. Treating it as mandatory turned successful scans into
    # failed jobs on every private repo without GHAS.
    - name: flawfinder
      id: flawfinder
      # A cppcheck finding fails "cppcheck — enforce" by design; without always() that
      # skipped flawfinder, so the more defects a tree had, the less of it was scanned
      # (tests/prove_scanners_survive_enforce.py; hosted run 38779814703).
      if: always()
      env:
        # CALLER INPUT ARRIVES AS DATA, NEVER AS SCRIPT TEXT (ledger L38).
        IN_PATHS: ${{ inputs.paths }}
      shell: bash -e {0}
      run: |
        set -uo pipefail
        # flawfinder WAS NEVER INVOKED. The job installed it, ran cppcheck instead, then
        # published `flawfinder.sarif` — which nothing wrote. cppcheck's own findings were
        # never converted to SARIF either, so they never reached the gate.
        scope="${IN_PATHS}"; [ -d "$scope" ] || scope="."
        # "NONE FOUND" AND "COULD NOT LOOK" ARE DIFFERENT ANSWERS. A find that ERRORS produces
        # empty output, which read as "this language is not here", which skipped the job, which
        # reported green over code nobody scanned. Same defect discovery had; same fix.
        # suppression: PRESENTATION_ONLY -- find's stderr is noise on unreadable subtrees; the EXIT
        # STATUS is checked on the next line and a failure raises COLLECTION_FAILED rather than reading
        # as 'nothing found'.
        # discards: find's stderr, which is noise on unreadable or permission-denied subtrees
        # preserved_by: the EXIT STATUS is captured on the next line and a non-zero rc raises
        # preserved_by: COLLECTION_FAILED, so 'could not look' never reads as 'found nothing'
        if ! _hits=$(find "$scope" \( -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.h' \) 2>/dev/null); then
          echo "::error title=COLLECTION_FAILED::Applicability survey failed; cannot establish scope."
          echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
          exit 1
        fi
        if [ -z "$_hits" ]; then
          echo "::notice title=No C/C++ sources::None under '$scope'. Skipping."
          exit 0
        fi
        # NEVER SUPPRESS THE HARNESS'S OWN DIAGNOSTICS. This step used to end in
        # `2>/dev/null || true`, so when flawfinder failed it produced no SARIF, no error,
        # and a green job — indistinguishable from "scanned and found nothing". A real C++
        # repository with 29 files reported zero findings and nobody could tell why.
        # CAPABILITY_MATRIX records this exact defect costing two debug cycles; it recurred
        # here because the fix was applied to the probes and not to the workflow.
        flawfinder --version || echo "::warning::flawfinder --version failed"

        # REAL LEGACY CODE IS NOT ALWAYS UTF-8. flawfinder is a Python tool and aborts
        # outright on the first undecodable byte:
        #     'utf-8' codec can't decode byte 0xf1 ... invalid continuation byte
        # A 2019 C++ project with one Latin-1 character in one file produced ZERO findings
        # and a green job. Worse, flawfinder wrote that error to STDOUT, so the redirect
        # captured it AS the report — a non-empty file that is not JSON. Checking only that
        # the file exists is not enough; a malformed report is not a clean report.
        #
        # Transcode a COPY. The consumer's repository is never modified — mutating source to
        # make a scanner happy is the same failure as generating a lockfile to silence SCA.
        work=$(mktemp -d)
        python3 - "$scope" "$work" <<'TX_PY'
        import os, shutil, sys
        src, dst = sys.argv[1], sys.argv[2]
        exts = (".c", ".cc", ".cpp", ".cxx", ".h", ".hpp", ".hh")
        copied = transcoded = 0
        for root, _d, files in os.walk(src):
            for fn in files:
                if not fn.lower().endswith(exts):
                    continue
                sp = os.path.join(root, fn)
                dp = os.path.join(dst, os.path.relpath(sp, src))
                os.makedirs(os.path.dirname(dp), exist_ok=True)
                raw = open(sp, "rb").read()
                try:
                    raw.decode("utf-8")
                    shutil.copyfile(sp, dp)
                except UnicodeDecodeError:
                    # latin-1 never fails and preserves byte values; the goal is analysability,
                    # not a faithful re-encoding.
                    open(dp, "w", encoding="utf-8").write(raw.decode("latin-1"))
                    transcoded += 1
                    print(f"::notice title=Transcoded for analysis::{os.path.relpath(sp, src)}"
                          f" is not valid UTF-8. A COPY was transcoded; your file is untouched.")
                copied += 1
        print(f"prepared {copied} source file(s); {transcoded} transcoded")
        TX_PY

        rc=0
        flawfinder --sarif "$work" > flawfinder.sarif 2>flawfinder.err || rc=$?
        if [ -s flawfinder.err ]; then
          echo "::group::flawfinder stderr"; cat flawfinder.err; echo "::endgroup::"
        fi
        # A non-empty file is NOT proof of a valid report. Validate it parses.
        if ! python3 -c "import json,sys; json.load(open('flawfinder.sarif'))" 2>/dev/null; then
          echo "::warning title=flawfinder SARIF invalid (rc=$rc)::Output was not JSON — most"
          echo "likely an error message captured as the report. First 200 bytes:"
          # suppression: EXPECTED_NEGATIVE_RESULT -- this scanner exits nonzero when it FINDS something,
          # which is not an error. Detection is separated from enforcement here; the count step downstream
          # distinguishes 'found nothing' from 'produced no report' and emits COLLECTION_FAILED for the
          # latter.
          # discards: this scanner's non-zero exit, which means FINDINGS rather than malfunction
          # preserved_by: the count step distinguishes an absent report from an empty one and emits
          # preserved_by: COLLECTION_FAILED for the former; the enforce step refuses an absent count
          head -c 200 flawfinder.sarif || true; echo
          # suppression: EXPECTED_NEGATIVE_RESULT -- this scanner exits nonzero when it FINDS something,
          # which is not an error. Detection is separated from enforcement here; the count step downstream
          # distinguishes 'found nothing' from 'produced no report' and emits COLLECTION_FAILED for the
          # latter.
          flawfinder --csv "$work" > flawfinder.csv 2>>flawfinder.err || true
          python3 - "$work" <<'FF_PY'
        import csv, json, os, sys
        base = sys.argv[1]
        rows = []
        if os.path.exists("flawfinder.csv"):
            with open("flawfinder.csv", newline="", encoding="utf-8", errors="replace") as fh:
                for r in csv.DictReader(fh):
                    if not r.get("File"):
                        continue
                    lvl = int(r.get("Level") or 0)
                    uri = os.path.relpath(r["File"], base).replace("\\", "/")
                    rows.append({
                        "ruleId": f"flawfinder.{r.get('Category','')}.{r.get('Name','')}".strip("."),
                        "level": "error" if lvl >= 4 else "warning" if lvl >= 2 else "note",
                        "message": {"text": f"[level {lvl}] {r.get('Warning','')}".strip()},
                        "locations": [{"physicalLocation": {
                            "artifactLocation": {"uri": uri},
                            "region": {"startLine": max(1, int(r.get("Line") or 1))}}}],
                    })
        json.dump({"version": "2.1.0",
                   "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
                   "runs": [{"tool": {"driver": {"name": "flawfinder"}}, "results": rows}]},
                  open("flawfinder.sarif", "w", encoding="utf-8"))
        print(f"converted {len(rows)} flawfinder finding(s) from CSV")
        FF_PY
        fi
        # A PARSE FAILURE IS NOT ZERO FINDINGS.
        #
        # This was `jq ... 2>/dev/null || echo 0`, so a missing, truncated or malformed report
        # produced n=0 -- which the gate reads as CLEAN. The taxonomy already had a word for
        # exactly this (COLLECTION_FAILED: "an empty but well-formed result is indistinguishable
        # from a clean scan") while the code did the opposite. Found by auditing the class after
        # the same defect turned up in discovery, not by reading this line.
        if [ ! -s flawfinder.sarif ]; then
          echo "::error title=COLLECTION_FAILED::flawfinder.sarif was not produced."
          echo "An ABSENT report is not zero findings. Posture cannot be established from this run."
          echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
          exit 1
        fi
        # VALIDITY ROWS 1-6, ON THE RUNNER, BEFORE PUBLICATION (ledger L02; PIPELINE_ORDERING 4.5):
        # results absent (did not attempt), no run, an error-level tool notification or
        # executionSuccessful false is COLLECTION_FAILED -- never a count of zero, and never
        # published as a clean scan. Per-tool profile, not a hollow-rules rule (KDEC-008 OD-2).
        if ! _v=$(python3 /tmp/sarif_validity.py --tool flawfinder flawfinder.sarif 2>&1); then
          echo "::error title=COLLECTION_FAILED::$_v"
          echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
          exit 1
        fi
        if ! n=$(jq '[.runs[].results[]] | length' flawfinder.sarif 2>&1); then
          echo "::error title=COLLECTION_FAILED::flawfinder.sarif is not valid SARIF."
          echo "jq said: $n"
          echo "A PARSE FAILURE is not zero findings."
          echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
          exit 1
        fi
        echo "count=${n//[$'\r\n']/ }" >> "$GITHUB_OUTPUT"
        echo "flawfinder findings: $n"

    - name: flawfinder — enforce
      id: flawfinder_enforce
      if: always()
      env:
        # CALLER INPUT ARRIVES AS DATA, NEVER AS SCRIPT TEXT (ledger L38).
        IN_SOFT_FAIL_SAST: ${{ inputs.soft_fail_sast }}
        IN_ADVISORY_MODE: ${{ inputs.advisory_mode }}
      shell: bash -e {0}
      run: |
        n='${{ steps.flawfinder.outputs.count }}'
        # COLLECTION_FAILED IS NOT ZERO FINDINGS -- AND THIS STEP RUNS ON always().
        #
        # The counting step above correctly refuses to turn a missing or malformed report
        # into n=0, and exits non-zero. But `if: always()` means THIS step still runs, reads
        # an output that was never written, and ${n:-0} quietly supplies the very zero the
        # step above refused to invent -- announcing GATE=PASS one line after the failure was
        # detected. Each side assumed the other had handled it. Check explicitly.
        collection='${{ steps.flawfinder.outputs.collection }}'
        if [ "$collection" = "COLLECTION_FAILED" ]; then
          echo "::error title=COLLECTION_FAILED::Evidence could not be collected."
          echo "Posture CANNOT be established from this run. This is not a clean result."
          exit 1
        fi
        if [ -z "${n:-}" ]; then
          echo "::error title=COLLECTION_FAILED::No count was produced by the scan step."
          echo "An ABSENT measurement is not a measurement of zero."
          exit 1
        fi
        # Findings go to the gate (findings_state), which enforces by the resolved policy (O-24).
        if [ "${n:-0}" -gt 0 ] && [ "${IN_SOFT_FAIL_SAST}" != "true" ] && [ "${IN_ADVISORY_MODE}" != "true" ]; then
          echo "findings_state=FINDINGS" >> "$GITHUB_OUTPUT"
          echo "::warning title=flawfinder::${n} finding(s). ANALYSIS=COMPLETE -- handed to the security gate, which decides by the resolved policy."; exit 0
        fi
        echo "ANALYSIS=COMPLETE GATE=PASS (${n:-0} finding(s))"

    - name: flawfinder — is there anything to publish?
      if: always()
      id: sarif_flawfinder
      shell: bash -e {0}
      run: |
        # No SARIF usually means no applicable source (gosec on a repo with no Go). That is
        # a legitimate outcome, not a failure, and previously crashed the upload step.
        if [ -s "flawfinder.sarif" ]; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
          echo "::notice title=flawfinder: nothing to publish::No SARIF at 'flawfinder.sarif' — no applicable source files. Not a failure."
        fi
    # BEGIN REDACT_STEP — generated by scripts/inline_normalizer.py. DO NOT EDIT HERE.
    - name: Redact credential material before upload
      if: always()
      shell: bash
      run: |
        # ORDER IS THE WHOLE CONTROL: this runs immediately before an upload, and
        # again before every later upload that follows a step which may have written
        # output -- a redactor after the upload protects nothing while looking exactly
        # like protection (N24/WP19). The sweep itself is ONE canonical script --
        # scripts/redact_all.sh, written by the `kit-scripts` job and fetched into
        # /tmp by every other -- because fourteen copies of one wrapper are how this
        # file reached 608.8 KB and stopped starting.
        #
        # A MISSING TOOL IS NOT A CLEAN RESULT. If the bundle did not arrive,
        # publication must not proceed on the strength of a scrub that never ran.
        if [ ! -s /tmp/redact_all.sh ]; then
          echo "::error title=Redaction could not be guaranteed::/tmp/redact_all.sh is absent."
          echo "The kit-scripts artifact did not reach this job, so no SARIF was scrubbed"
          echo "and none may be published. A MISSING TOOL IS NOT A CLEAN RESULT."
          exit 1
        fi
        bash /tmp/redact_all.sh
    # END REDACT_STEP
    - name: flawfinder — keep SARIF as an artifact
      if: always() && steps.sarif_flawfinder.outputs.exists == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: sarif-flawfinder-${{ github.run_attempt }}
        path: flawfinder.sarif
        retention-days: 30
        if-no-files-found: warn
    - name: flawfinder — publish to the Security tab where available
      id: cs_flawfinder
      if: always() && steps.sarif_flawfinder.outputs.exists == 'true'
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        sarif_file: flawfinder.sarif
        category: flawfinder
    - name: flawfinder — state plainly if publication degraded
      if: always() && steps.sarif_flawfinder.outputs.exists == 'true' && steps.cs_flawfinder.outcome != 'success'
      shell: bash -e {0}
      run: |
        # Loud, never silent. An empty Security tab is indistinguishable from a clean
        # codebase, and that ambiguity is how a control becomes false assurance.
        echo "::warning title=flawfinder: NOT published to the Security tab::Code scanning is"
        echo "unavailable here (free on public repos, otherwise GitHub Advanced Security)."
        echo "The scan SUCCEEDED and the gate still enforces on these findings."
        echo "Retrieve them from the 'sarif-flawfinder' artifact."
    # THE RAW cppcheck XML AND TEXT ARE NO LONGER PUBLISHED (N24/WP19). The redactor scrubs
    # SARIF only, so an artifact of raw scanner output would ship whatever credential material a
    # finding's context carried. The same findings are already published as the REDACTED
    # sarif-cppcheck artifact. A redaction step placed in front of this upload would have
    # satisfied the order check while scrubbing nothing in it -- protection in appearance only.
