name: "Docker Build, Scan & Push"
description: >-
  Build ONCE, Trivy-gate the loaded image, Syft SBOM of the same bytes, push those bytes, then ask
  the registry what it holds. Emits the digest WITH its identity class. Assumes Azure login done.
# THE SAME CHAIN AS reusable-build-docker.yml, for repos that build inside their own workflow.
# This composite used to build twice: a `load: true` build that was scanned and SBOM'd, and a
# second `push: true` build that reached the registry. Two invocations are two images unless the
# Dockerfile is bit-reproducible, so the gate cleared one artifact and the registry received
# another (ledger L85, review G3-5). tests/check_artifact_identity.py now reads composites too.
inputs:
  acr-login-server:
    description: "ACR login server FQDN (e.g. myacr.azurecr.io)"
    required: true
  image-repository:
    description: "Image repository name (e.g. team/app)"
    required: true
  dockerfile:
    description: "Path to Dockerfile"
    required: false
    default: "Dockerfile"
  context:
    description: "Docker build context"
    required: false
    default: "."
  image-tag:
    description: "Image tag"
    required: false
    default: "${{ github.sha }}"
  trivy-severity:
    description: "Trivy severities that FAIL the build"
    required: false
    default: "HIGH,CRITICAL"
  push:
    description: "Push after a clean scan"
    required: false
    default: "true"
  # Release 4 (KDEC-032): the organisation feed mirror, from the caller's vars.KIT_FEED_MIRROR_*.
  # Empty mirror URL: NOT_CONFIGURED, Trivy reads its public database exactly as before.
  feed-mirror-url:
    description: The organisation feed mirror's base URL. Empty reads Trivy's public database.
    required: false
    default: ''
  feed-mirror-max-age-hours:
    description: Refuse a mirror refreshed longer ago than this. The policy ceiling (48) applies to anything larger.
    required: false
    default: '48'
  feed-mirror-fallback:
    description: "`upstream` reads the public database when the mirror is refused, and records it."
    required: false
    default: 'none'
outputs:
  image-digest:
    description: >-
      Registry manifest digest of the pushed image. Only safe to treat as provenance when
      artifact-identity is REGISTRY_IDENTITY_PROVEN.
    value: ${{ steps.push.outputs.digest }}
  config-digest:
    description: >-
      Config digest of the scanned image as the registry states it once identity is proven
      (KDEC-065); without a push, the scanned image's daemon Id (see scanned-image-id).
    value: ${{ steps.assert_identity.outputs.config_digest || steps.built.outputs.scanned_image_id }}
  scanned-image-id:
    description: "The daemon's Id for the image the gate and the SBOM inspected (KDEC-065)."
    value: ${{ steps.built.outputs.scanned_image_id }}
  identity-rule:
    description: "CONTENT_ADDRESS_INDEX | CONTENT_ADDRESS_MANIFEST | CONFIG_DIGEST: the equality that proved identity."
    value: ${{ steps.assert_identity.outputs.identity_rule }}
  platform-manifest-digest:
    description: >-
      The image manifest the identity assertion read the config from: image-digest itself, or the
      built platform's entry when image-digest is an index (KDEC-065).
    value: ${{ steps.assert_identity.outputs.platform_manifest_digest }}
  artifact-identity:
    description: >-
      REGISTRY_IDENTITY_PROVEN | LOCAL_BUILD_ONLY | IDENTITY_UNVERIFIED | NOT_ESTABLISHED. Never
      collapse into a boolean.
    value: ${{ steps.classify.outputs.class }}
  sbom-sha256:
    description: "SHA256 of the SPDX SBOM"
    value: ${{ steps.sbom.outputs.sha256 }}
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: ACR login
      shell: bash
      env:
        ACR_LOGIN_SERVER: ${{ inputs.acr-login-server }}
      run: az acr login --name "${ACR_LOGIN_SERVER%%.*}"
    - name: Build (once — this is the only image that will exist)
      id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        load: true
        tags: ${{ inputs.acr-login-server }}/${{ inputs.image-repository }}:${{ inputs.image-tag }}
    - name: Establish the built image identity
      id: built
      shell: bash
      env:
        IMAGE: ${{ inputs.acr-login-server }}/${{ inputs.image-repository }}:${{ inputs.image-tag }}
        ACTION_ID: ${{ steps.build.outputs.imageid }}
        BUILD_METADATA: ${{ steps.build.outputs.metadata }}
      run: |
        set -euo pipefail
        SCANNED_ID="$(docker image inspect --format '{{.Id}}' "$IMAGE")"
        if [ -z "$SCANNED_ID" ]; then
          echo "::error title=Built image identity not established::docker image inspect returned no Id for $IMAGE. Everything downstream would be describing an artifact this job cannot name. Failing here rather than scanning an image of unknown identity."
          exit 1
        fi
        # The action reports its own view. Two independent reads agreeing is worth the four
        # lines; two disagreeing means the tag moved between build and inspect, which is the
        # precise condition this whole section exists to catch.
        if [ -n "$ACTION_ID" ] && [ "$ACTION_ID" != "$SCANNED_ID" ]; then
          echo "::error title=Image identity disagreement::build-push-action reported $ACTION_ID; the daemon reports $SCANNED_ID for the same tag. The tag moved. Refusing to scan."
          exit 1
        fi
        # THE SCANNED IMAGE IS NAMED BY ITS DAEMON Id (KDEC-065). That Id is the config digest on the
        # classic image store and the image's index or manifest digest on the containerd store; the
        # identity assertion proves it against the REGISTRY either way, by content address. Build
        # metadata is not required (on ubuntu-26.04 it intermittently carries no containerimage.* keys,
        # hosted run 44156650539); a config digest it does carry is passed on as a cross-check only.
        BUILD_CONFIG="$(printf '%s' "$BUILD_METADATA" | jq -r '."containerimage.config.digest" // empty' 2>/dev/null || true)"
        if [ -n "$BUILD_CONFIG" ] && ! printf '%s' "$BUILD_CONFIG" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
          echo "::error title=Malformed build config digest::build-push-action's metadata names config digest '$BUILD_CONFIG', which is not sha256:<64 hex>. Refusing to scan."
          exit 1
        fi
        # The built platform, which the identity assertion selects from a pushed index.
        PLATFORM="$(docker image inspect --format '{{.Os}}/{{.Architecture}}{{with .Variant}}/{{.}}{{end}}' "$IMAGE")"
        if ! printf '%s' "$PLATFORM" | grep -Eq '^[a-z0-9]+/[a-z0-9_]+(/[a-z0-9]+)?$'; then
          echo "::error title=Built image platform not established::docker image inspect reported '$PLATFORM' for $IMAGE. Refusing: the pushed index could not be resolved to this image."
          exit 1
        fi
        echo "scanned_image_id=${SCANNED_ID//[$'\r\n']/ }" >> "$GITHUB_OUTPUT"
        echo "build_config_digest=${BUILD_CONFIG//[$'\r\n']/ }" >> "$GITHUB_OUTPUT"
        echo "platform=${PLATFORM//[$'\r\n']/ }" >> "$GITHUB_OUTPUT"
        echo "Scanning and pushing image $SCANNED_ID ($PLATFORM)"
    # TRIVY IS INSTALLED, NOT SET UP BY AN ACTION (KDEC-027): aquasecurity/trivy-action's
    # setup-trivy checks out `aquasecurity/trivy` against github.server_url, which on a GHE.com
    # tenant does not have it. Release binary from github.com, pinned by version and sha256.
    - name: Install Trivy (pinned release binary)
      id: trivy_install
      shell: bash
      run: |
        set -euo pipefail
        v=0.71.2
        if [ "$(trivy --version 2>/dev/null | sed -n 's/^Version: //p' | head -n 1)" != "$v" ]; then
          t="trivy_${v}_Linux-64bit.tar.gz"
          d="$(mktemp -d)"
          curl -sSfL --retry 3 --connect-timeout 20 -o "$d/$t" \
            "https://github.com/aquasecurity/trivy/releases/download/v${v}/$t"
          echo "0510e71e2fd39bf863856d499c8dc19feb4e7336546394c502a8f5cc7ab27460  $d/$t" | sha256sum -c -
          tar -xzf "$d/$t" -C "$d" trivy
          sudo install -m 0755 "$d/trivy" /usr/local/bin/trivy
          rm -rf "$d"
        fi
        trivy --version | head -n 1
        echo "TRIVY_CACHE_DIR=$RUNNER_TEMP/trivy-cache" >> "$GITHUB_ENV"
        echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
    - name: Trivy database cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/trivy-cache
        key: trivy-db-${{ runner.os }}-${{ steps.trivy_install.outputs.day }}
        restore-keys: trivy-db-${{ runner.os }}-
    # AFTER the cache restore (KDEC-032): a current mirror replaces whatever was restored; a refused
    # one empties the cache with the update off, so Trivy refuses rather than scan stale data.
    - name: Trivy database from the organisation mirror (KDEC-032)
      shell: bash
      env:
        M_FEED: trivy
        M_URL: ${{ inputs.feed-mirror-url }}
        M_MAX_AGE: ${{ inputs.feed-mirror-max-age-hours }}
        M_FALLBACK: ${{ inputs.feed-mirror-fallback }}
      run: bash "$(cd "${GITHUB_ACTION_PATH}/../../.." && pwd)/scripts/feed_mirror_step.sh"
    - name: Trivy image scan (gate before push)
      shell: bash
      env:
        TRIVY_IMAGE_SRC: docker   # the daemon's image, never a same-tagged registry image
        # Each TRIVY_* is the option trivy-action@v0.36.0 passed for the `with:` key it replaces.
        IMAGE_REF: ${{ inputs.acr-login-server }}/${{ inputs.image-repository }}:${{ inputs.image-tag }}
        TRIVY_SEVERITY: ${{ inputs.trivy-severity }}
        TRIVY_EXIT_CODE: "1"
        TRIVY_IGNORE_UNFIXED: "true"
      run: trivy image --quiet "$IMAGE_REF"
    - name: SBOM (Syft, SPDX JSON)
      id: sbom
      shell: bash
      env:
        IMAGE: ${{ inputs.acr-login-server }}/${{ inputs.image-repository }}:${{ inputs.image-tag }}
      run: |
        # Pinned (ledger L84): syft v1.54.1, verified against a recorded digest.
        s=syft_1.54.1_linux_amd64.tar.gz
        curl -sSfLO "https://github.com/anchore/syft/releases/download/v1.54.1/$s"
        echo "c069905b391cc4c20a5ba65ad5c10be2a7ba074f8ea6ad203e24d14e303dad47  $s" | sha256sum -c -
        tar -xzf "$s" syft && sudo mv syft /usr/local/bin/ && rm -f "$s"
        syft "docker:$IMAGE" -o spdx-json=sbom.spdx.json
        echo "sha256=$(sha256sum sbom.spdx.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
    # `docker push` ships the bytes already in the daemon -- the scanned bytes. Not a rebuild.
    - name: Push (the scanned bytes — not a rebuild)
      id: push
      if: inputs.push == 'true'
      shell: bash
      env:
        IMAGE: ${{ inputs.acr-login-server }}/${{ inputs.image-repository }}:${{ inputs.image-tag }}
        REPO: ${{ inputs.acr-login-server }}/${{ inputs.image-repository }}
      run: |
        docker push "$IMAGE"
        DIGEST=""
        while IFS= read -r rd; do
          case "$rd" in "$REPO"@sha256:*) DIGEST="${rd#*@}"; break ;; esac
        done < <(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$IMAGE")
        if [ -z "$DIGEST" ]; then
          echo "::error title=Push digest not established::no RepoDigest for $REPO after push."
          exit 1
        fi
        echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
    # The round trip. Everything above is one machine agreeing with itself.
    - name: Assert artifact identity — the registry is holding the image that was scanned
      id: assert_identity
      if: inputs.push == 'true'
      shell: bash
      env:
        REPO: ${{ inputs.acr-login-server }}/${{ inputs.image-repository }}
        SCANNED_ID: ${{ steps.built.outputs.scanned_image_id }}
        BUILD_CONFIG: ${{ steps.built.outputs.build_config_digest }}
        DIGEST: ${{ steps.push.outputs.digest }}
        PLATFORM: ${{ steps.built.outputs.platform }}
      run: |
        set -euo pipefail
        # AN INDEX IS RESOLVED, NEVER GUESSED (KDEC-065). On the containerd image store `docker
        # push` publishes an OCI index (the image manifest plus attestation manifests) and the
        # RepoDigest names the INDEX. The image manifest for the built platform is selected from
        # it; an attestation manifest never is; none, or more than one, refuses by name.
        for pair in "scanned image Id:$SCANNED_ID" "pushed digest:$DIGEST"; do
          if ! printf '%s' "${pair#*:}" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error title=Artifact identity UNESTABLISHED::the ${pair%%:*} is '${pair#*:}', not sha256:<64 hex>. Nothing to compare; refusing to publish this digest as assured."
            exit 1
          fi
        done
        PLATFORM="${PLATFORM:-linux/amd64}"
        # THE BYTES ARE HASHED, NEVER TRUSTED (KDEC-065 M5). `imagetools inspect --raw` prints the
        # registry's bytes unchanged and does not check them against the digest asked for (measured
        # 2026-11-18, buildx v0.34.1: other bytes served for <repo>@<digest> were printed, exit 0). A
        # digest is the sha256 of exactly one document, so the step hashes what it fetched -- from a
        # file, because a command substitution drops trailing newlines -- and refuses any difference,
        # for the pushed digest and for the platform manifest. tests/prove_oci_index_identity.py.
        DOC="$(mktemp)"
        trap 'rm -f "$DOC"' EXIT
        fetch_exact() {
          docker buildx imagetools inspect --raw "$REPO@$1" > "$2"
          got="sha256:$(sha256sum < "$2" | cut -d' ' -f1)"
          if [ "$got" != "$1" ]; then
            echo "::error title=ARTIFACT IDENTITY MISMATCH::the registry answered $REPO@$1 with bytes whose sha256 is $got. A digest names exactly one document and these bytes are another, so nothing read from them is the pushed artifact. Refusing to publish this digest as assured."
            exit 1
          fi
        }
        fetch_exact "$DIGEST" "$DOC"
        PLATFORM_MANIFEST="$DIGEST"
        IS_INDEX=false
        if jq -e 'type == "object" and has("manifests")' < "$DOC" >/dev/null; then
          IS_INDEX=true
          IFS=/ read -r P_OS P_ARCH P_VAR <<< "$PLATFORM"
          CANDS="$(jq -r --arg o "$P_OS" --arg a "$P_ARCH" --arg v "${P_VAR:-}" '[.manifests[]
            | select((.annotations // {})["vnd.docker.reference.type"] != "attestation-manifest")
            | select(.platform.os == $o and .platform.architecture == $a)
            | select($v == "" or (.platform.variant // "") == $v) | .digest] | unique | .[]' < "$DOC")"
          N="$(printf '%s' "$CANDS" | grep -c . || true)"
          if [ "$N" != 1 ] || ! printf '%s' "$CANDS" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            REASON=NO_PLATFORM_MANIFEST; [ "$N" -gt 1 ] && REASON=AMBIGUOUS_PLATFORM_MANIFEST
            echo "::error title=Artifact identity UNESTABLISHED ($REASON)::$REPO@$DIGEST is an index with $N non-attestation image manifest(s) for $PLATFORM. Exactly one is required; the first is never taken. Refusing to publish this digest as assured."
            exit 1
          fi
          PLATFORM_MANIFEST="$CANDS"
          fetch_exact "$PLATFORM_MANIFEST" "$DOC"
        fi
        REGISTRY_CONFIG="$(jq -r '.config.digest // empty' < "$DOC")"
        if ! printf '%s' "$REGISTRY_CONFIG" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
          echo "::error title=Artifact identity UNESTABLISHED::$REPO@$PLATFORM_MANIFEST resolved to a document with no .config.digest -- an index or attestation manifest rather than a plain image manifest. The link between the scanned image and the pushed digest could not be established. UNESTABLISHED is not established: refusing to publish this digest as assured."
          exit 1
        fi
        # THE RULE THAT HOLDS, NEVER A GUESSED STORE (KDEC-065). The registry served $DIGEST by digest,
        # so a scanned Id equal to it is the same bytes (containerd store: the Id IS the index or
        # manifest). A scanned Id equal to the registry's config digest for the platform manifest is the
        # classic store's proof. Neither holding is a MISMATCH.
        RULE=""
        if [ "$SCANNED_ID" = "$DIGEST" ]; then
          RULE=CONTENT_ADDRESS_MANIFEST
          if [ "$IS_INDEX" = true ]; then RULE=CONTENT_ADDRESS_INDEX; fi
        elif [ "$SCANNED_ID" = "$REGISTRY_CONFIG" ]; then
          RULE=CONFIG_DIGEST
        fi
        if [ -z "$RULE" ]; then
          echo "::error title=ARTIFACT IDENTITY MISMATCH::Scanned image $SCANNED_ID is neither the pushed digest $REPO@$DIGEST nor the config $REGISTRY_CONFIG of its $PLATFORM manifest $PLATFORM_MANIFEST. The gate and the SBOM describe a different artifact from the one now in the registry. This is the defect the single-build rewrite exists to make impossible, so its recurrence means an assumption in that rewrite is wrong -- do not suppress this check."
          exit 1
        fi
        if [ -n "$BUILD_CONFIG" ] && [ "$BUILD_CONFIG" != "$REGISTRY_CONFIG" ]; then
          echo "::error title=ARTIFACT IDENTITY MISMATCH::the build's metadata names config $BUILD_CONFIG; the registry says $REPO@$PLATFORM_MANIFEST has config $REGISTRY_CONFIG. Refusing: the two accounts of one image disagree."
          exit 1
        fi
        echo "platform_manifest_digest=${PLATFORM_MANIFEST//[$'\r\n']/ }" >> "$GITHUB_OUTPUT"
        echo "config_digest=${REGISTRY_CONFIG//[$'\r\n']/ }" >> "$GITHUB_OUTPUT"
        echo "identity_rule=${RULE//[$'\r\n']/ }" >> "$GITHUB_OUTPUT"
        echo "Artifact identity PROVEN ($RULE): scanned $SCANNED_ID; pushed $DIGEST -> $PLATFORM manifest $PLATFORM_MANIFEST -> config $REGISTRY_CONFIG"
    - name: Classify what the SBOM is evidence of
      id: classify
      if: always()
      shell: bash
      env:
        PUSH: ${{ inputs.push }}
        ASSERTED: ${{ steps.assert_identity.outcome }}
      run: |
        if [ ! -f sbom.spdx.json ]; then CLASS=NOT_ESTABLISHED
        elif [ "$PUSH" != "true" ]; then CLASS=LOCAL_BUILD_ONLY
        elif [ "$ASSERTED" = "success" ]; then CLASS=REGISTRY_IDENTITY_PROVEN
        else CLASS=IDENTITY_UNVERIFIED
        fi
        echo "class=$CLASS" >> "$GITHUB_OUTPUT"
        echo "artifact identity: $CLASS"
    - name: Upload SBOM artifact
      if: always() && steps.classify.outputs.class != 'NOT_ESTABLISHED'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        # Named by evidence class, so an unverified SBOM cannot be cited as a proven one.
        name: sbom-${{ steps.classify.outputs.class }}-${{ inputs.image-tag }}
        path: sbom.spdx.json
        if-no-files-found: error
