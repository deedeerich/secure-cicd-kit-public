name: "Docker Build, Scan & Push"
description: >-
  Build ONCE, Trivy-gate the loaded image, Syft SBOM of the same bytes, push those bytes, then ask
  the registry what it holds. Emits the digest WITH its identity class. Assumes Azure login done.
# THE SAME CHAIN AS reusable-build-docker.yml, for repos that build inside their own workflow.
# This composite used to build twice: a `load: true` build that was scanned and SBOM'd, and a
# second `push: true` build that reached the registry. Two invocations are two images unless the
# Dockerfile is bit-reproducible, so the gate cleared one artifact and the registry received
# another (ledger L85, review G3-5). tests/check_artifact_identity.py now reads composites too.
inputs:
  acr-login-server:
    description: "ACR login server FQDN (e.g. myacr.azurecr.io)"
    required: true
  image-repository:
    description: "Image repository name (e.g. team/app)"
    required: true
  dockerfile:
    description: "Path to Dockerfile"
    required: false
    default: "Dockerfile"
  context:
    description: "Docker build context"
    required: false
    default: "."
  image-tag:
    description: "Image tag"
    required: false
    default: "${{ github.sha }}"
  trivy-severity:
    description: "Trivy severities that FAIL the build"
    required: false
    default: "HIGH,CRITICAL"
  push:
    description: "Push after a clean scan"
    required: false
    default: "true"
outputs:
  image-digest:
    description: >-
      Registry manifest digest of the pushed image. Only safe to treat as provenance when
      artifact-identity is REGISTRY_IDENTITY_PROVEN.
    value: ${{ steps.push.outputs.digest }}
  config-digest:
    description: "Config digest of the image the gate and the SBOM inspected (the SCANNED artifact)."
    value: ${{ steps.built.outputs.config_digest }}
  artifact-identity:
    description: >-
      REGISTRY_IDENTITY_PROVEN | LOCAL_BUILD_ONLY | IDENTITY_UNVERIFIED | NOT_ESTABLISHED. Never
      collapse into a boolean.
    value: ${{ steps.classify.outputs.class }}
  sbom-sha256:
    description: "SHA256 of the SPDX SBOM"
    value: ${{ steps.sbom.outputs.sha256 }}
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: ACR login
      shell: bash
      env:
        ACR_LOGIN_SERVER: ${{ inputs.acr-login-server }}
      run: az acr login --name "${ACR_LOGIN_SERVER%%.*}"
    - name: Build (once — this is the only image that will exist)
      id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        load: true
        tags: ${{ inputs.acr-login-server }}/${{ inputs.image-repository }}:${{ inputs.image-tag }}
    - name: Establish the built image identity
      id: built
      shell: bash
      env:
        IMAGE: ${{ inputs.acr-login-server }}/${{ inputs.image-repository }}:${{ inputs.image-tag }}
        ACTION_ID: ${{ steps.build.outputs.imageid }}
      run: |
        CONFIG_DIGEST="$(docker image inspect --format '{{.Id}}' "$IMAGE")"
        if [ -z "$CONFIG_DIGEST" ]; then
          echo "::error title=Built image identity not established::no Id for $IMAGE."
          exit 1
        fi
        if [ -n "$ACTION_ID" ] && [ "$ACTION_ID" != "$CONFIG_DIGEST" ]; then
          echo "::error title=Image identity disagreement::build-push-action reported $ACTION_ID; the daemon reports $CONFIG_DIGEST. The tag moved. Refusing to scan."
          exit 1
        fi
        echo "config_digest=${CONFIG_DIGEST//[$'\r\n']/ }" >> "$GITHUB_OUTPUT"
    # TRIVY IS INSTALLED, NOT SET UP BY AN ACTION (KDEC-027): aquasecurity/trivy-action's
    # setup-trivy checks out `aquasecurity/trivy` against github.server_url, which on a GHE.com
    # tenant does not have it. Release binary from github.com, pinned by version and sha256.
    - name: Install Trivy (pinned release binary)
      id: trivy_install
      shell: bash
      run: |
        set -euo pipefail
        v=0.71.2
        if [ "$(trivy --version 2>/dev/null | sed -n 's/^Version: //p' | head -n 1)" != "$v" ]; then
          t="trivy_${v}_Linux-64bit.tar.gz"
          d="$(mktemp -d)"
          curl -sSfL --retry 3 --connect-timeout 20 -o "$d/$t" \
            "https://github.com/aquasecurity/trivy/releases/download/v${v}/$t"
          echo "0510e71e2fd39bf863856d499c8dc19feb4e7336546394c502a8f5cc7ab27460  $d/$t" | sha256sum -c -
          tar -xzf "$d/$t" -C "$d" trivy
          sudo install -m 0755 "$d/trivy" /usr/local/bin/trivy
          rm -rf "$d"
        fi
        trivy --version | head -n 1
        echo "TRIVY_CACHE_DIR=$RUNNER_TEMP/trivy-cache" >> "$GITHUB_ENV"
        echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
    - name: Trivy database cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/trivy-cache
        key: trivy-db-${{ runner.os }}-${{ steps.trivy_install.outputs.day }}
        restore-keys: trivy-db-${{ runner.os }}-
    - name: Trivy image scan (gate before push)
      shell: bash
      env:
        TRIVY_IMAGE_SRC: docker   # the daemon's image, never a same-tagged registry image
        # Each TRIVY_* is the option trivy-action@v0.36.0 passed for the `with:` key it replaces.
        IMAGE_REF: ${{ inputs.acr-login-server }}/${{ inputs.image-repository }}:${{ inputs.image-tag }}
        TRIVY_SEVERITY: ${{ inputs.trivy-severity }}
        TRIVY_EXIT_CODE: "1"
        TRIVY_IGNORE_UNFIXED: "true"
      run: trivy image --quiet "$IMAGE_REF"
    - name: SBOM (Syft, SPDX JSON)
      id: sbom
      shell: bash
      env:
        IMAGE: ${{ inputs.acr-login-server }}/${{ inputs.image-repository }}:${{ inputs.image-tag }}
      run: |
        # Pinned (ledger L84): syft v1.54.1, verified against a recorded digest.
        s=syft_1.54.1_linux_amd64.tar.gz
        curl -sSfLO "https://github.com/anchore/syft/releases/download/v1.54.1/$s"
        echo "c069905b391cc4c20a5ba65ad5c10be2a7ba074f8ea6ad203e24d14e303dad47  $s" | sha256sum -c -
        tar -xzf "$s" syft && sudo mv syft /usr/local/bin/ && rm -f "$s"
        syft "docker:$IMAGE" -o spdx-json=sbom.spdx.json
        echo "sha256=$(sha256sum sbom.spdx.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
    # `docker push` ships the bytes already in the daemon -- the scanned bytes. Not a rebuild.
    - name: Push (the scanned bytes — not a rebuild)
      id: push
      if: inputs.push == 'true'
      shell: bash
      env:
        IMAGE: ${{ inputs.acr-login-server }}/${{ inputs.image-repository }}:${{ inputs.image-tag }}
        REPO: ${{ inputs.acr-login-server }}/${{ inputs.image-repository }}
      run: |
        docker push "$IMAGE"
        DIGEST=""
        while IFS= read -r rd; do
          case "$rd" in "$REPO"@sha256:*) DIGEST="${rd#*@}"; break ;; esac
        done < <(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$IMAGE")
        if [ -z "$DIGEST" ]; then
          echo "::error title=Push digest not established::no RepoDigest for $REPO after push."
          exit 1
        fi
        echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
    # The round trip. Everything above is one machine agreeing with itself.
    - name: Assert artifact identity — the registry is holding the image that was scanned
      id: assert_identity
      if: inputs.push == 'true'
      shell: bash
      env:
        REPO: ${{ inputs.acr-login-server }}/${{ inputs.image-repository }}
        SCANNED: ${{ steps.built.outputs.config_digest }}
        DIGEST: ${{ steps.push.outputs.digest }}
      run: |
        RAW="$(docker buildx imagetools inspect --raw "$REPO@$DIGEST")"
        REGISTRY_CONFIG="$(printf '%s' "$RAW" | jq -r '.config.digest // empty')"
        if [ -z "$REGISTRY_CONFIG" ]; then
          echo "::error title=Artifact identity UNESTABLISHED::$REPO@$DIGEST has no .config.digest (an index or attestation manifest)."
          exit 1
        fi
        if [ "$REGISTRY_CONFIG" != "$SCANNED" ]; then
          echo "::error title=ARTIFACT IDENTITY MISMATCH::scanned $SCANNED; the registry says $REPO@$DIGEST has config $REGISTRY_CONFIG."
          exit 1
        fi
        echo "Artifact identity PROVEN: $DIGEST -> config $SCANNED"
    - name: Classify what the SBOM is evidence of
      id: classify
      if: always()
      shell: bash
      env:
        PUSH: ${{ inputs.push }}
        ASSERTED: ${{ steps.assert_identity.outcome }}
      run: |
        if [ ! -f sbom.spdx.json ]; then CLASS=NOT_ESTABLISHED
        elif [ "$PUSH" != "true" ]; then CLASS=LOCAL_BUILD_ONLY
        elif [ "$ASSERTED" = "success" ]; then CLASS=REGISTRY_IDENTITY_PROVEN
        else CLASS=IDENTITY_UNVERIFIED
        fi
        echo "class=$CLASS" >> "$GITHUB_OUTPUT"
        echo "artifact identity: $CLASS"
    - name: Upload SBOM artifact
      if: always() && steps.classify.outputs.class != 'NOT_ESTABLISHED'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        # Named by evidence class, so an unverified SBOM cannot be cited as a proven one.
        name: sbom-${{ steps.classify.outputs.class }}-${{ inputs.image-tag }}
        path: sbom.spdx.json
        if-no-files-found: error
