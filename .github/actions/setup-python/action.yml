name: "Setup Python"
description: "Set up Python with pip caching and install requirements if present."
inputs:
  python-version:
    description: "Python version to install"
    required: false
    default: "3.12"
  requirements-file:
    description: "Path to pip requirements file (skipped if absent)"
    required: false
    default: "requirements.txt"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
    - name: Install requirements
      shell: bash
      run: |
        python -m pip install --upgrade pip
        if [ -f "${{ inputs.requirements-file }}" ]; then
          pip install -r "${{ inputs.requirements-file }}"
        else
          echo "No ${{ inputs.requirements-file }} — skipping install."
        fi
