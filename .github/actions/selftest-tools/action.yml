name: Self-test pinned tools
description: >-
  The scanner binaries and Python packages the kit's own proofs run with, installed ONCE from ONE
  pin list, for every self-test job that runs proofs against real tools. Normalizer drift and the
  tree-clean sweep (tests/prove_tests_leave_tree_clean.py, every test in a throwaway clone) both
  call this; neither inlines an install, so the two jobs cannot drift apart, and the sweep checks
  as much as the drift job does (a test whose tool is missing reports UNKNOWN, which the sweep
  does not fail). Pinned and verified (ledger L84): a release, never a branch script or `latest`;
  pip by exact version; every downloaded archive against the release's published checksums, or a
  digest written here. tests/check_pinned_installs.py holds this file to that; tests/prove_tree_clean_job.py
  holds the two jobs to this file. Downloads go to $RUNNER_TEMP, never the checkout (a scanner
  archive left in the working tree was exported by prove_export_scope.py, hosted run 39618329392).
runs:
  using: composite
  steps:
    - name: Python packages (PyYAML, Semgrep, Bandit, detect-secrets), each by exact version
      shell: bash
      run: |
        set -euo pipefail
        python3 -m pip install --quiet PyYAML==6.0.2
        # The release the sast-semgrep image is (tests/_semgrep_pin.py holds the two equal).
        python3 -m pip install --quiet semgrep==1.178.0
        # The release the sast-python job pins.
        python3 -m pip install --quiet "bandit[sarif]==1.9.4"
        python3 -m pip install --quiet detect-secrets==1.5.0

    - name: Trivy v0.71.2 (the release's own install script, from its tag)
      shell: bash
      run: |
        set -euo pipefail
        # The install script from the RELEASE TAG, installing the SAME release. Never `main` and
        # never `latest` (L84): a probe that installs whatever is current proves something about a
        # tool nobody chose.
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/v0.71.2/contrib/install.sh \
          | sudo sh -s -- -b /usr/local/bin v0.71.2

    - name: osv-scanner v2.6.0, gosec 2.24.6, syft 1.52.0, gitleaks 8.21.2 (release assets, checksummed)
      shell: bash
      run: |
        set -euo pipefail
        dl="$RUNNER_TEMP/selftest-tools"; mkdir -p "$dl"; cd "$dl"
        # osv-scanner: the release the deps-scan job pins, against a digest written here (copied
        # from the release's osv-scanner_SHA256SUMS).
        v=v2.6.0
        curl -sSfL --retry 3 -o osv-scanner \
          "https://github.com/google/osv-scanner/releases/download/${v}/osv-scanner_linux_amd64"
        echo "ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108  osv-scanner" | sha256sum -c -
        sudo install -m 0755 osv-scanner /usr/local/bin/osv-scanner && rm -f osv-scanner
        # gosec: the release the sast-go container pins, against its published checksums.
        v=2.24.6; t=gosec_${v}_linux_amd64.tar.gz
        curl -sSfLO --retry 3 "https://github.com/securego/gosec/releases/download/v${v}/${t}"
        curl -sSfL --retry 3 "https://github.com/securego/gosec/releases/download/v${v}/gosec_${v}_checksums.txt" \
          | grep " ${t}\$" | sha256sum -c -
        tar -xzf "$t" gosec && sudo install -m 0755 gosec /usr/local/bin/gosec && rm -f gosec "$t"
        # syft: the release the sbom job pins, against its published checksums.
        v=1.52.0; t=syft_${v}_linux_amd64.tar.gz
        curl -sSfLO --retry 3 "https://github.com/anchore/syft/releases/download/v${v}/${t}"
        curl -sSfL --retry 3 "https://github.com/anchore/syft/releases/download/v${v}/syft_${v}_checksums.txt" \
          | grep " ${t}\$" | sha256sum -c -
        tar -xzf "$t" syft && sudo install -m 0755 syft /usr/local/bin/syft && rm -f syft "$t"
        # gitleaks: the release the secret-scan job pins, against its published checksums.
        v=8.21.2; t=gitleaks_${v}_linux_x64.tar.gz
        curl -sSfLO --retry 3 "https://github.com/gitleaks/gitleaks/releases/download/v${v}/${t}"
        curl -sSfL --retry 3 "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_checksums.txt" \
          | grep " ${t}\$" | sha256sum -c -
        tar -xzf "$t" gitleaks && sudo install -m 0755 gitleaks /usr/local/bin/gitleaks && rm -f gitleaks "$t"

    - name: cppcheck and flawfinder (the distribution packages the sast-cpp job installs)
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get -o DPkg::Lock::Timeout=60 install -y --no-install-recommends cppcheck flawfinder

    - name: Say what was installed (a tool that is missing fails here, not as a proof's UNKNOWN)
      shell: bash
      run: |
        set -euo pipefail
        for t in semgrep bandit detect-secrets trivy osv-scanner gosec syft gitleaks cppcheck flawfinder; do
          command -v "$t" >/dev/null || { echo "::error title=selftest-tools::$t was not installed"; exit 1; }
        done
        echo "semgrep $(semgrep --version 2>/dev/null | tail -1); bandit $(bandit --version 2>/dev/null | head -1)"
        echo "trivy $(trivy --version 2>/dev/null | head -1); osv-scanner $(osv-scanner --version 2>/dev/null | head -1)"
        echo "gosec $(gosec --version 2>/dev/null | head -1); syft $(syft version 2>/dev/null | grep -i '^version' || true)"
        echo "gitleaks $(gitleaks version 2>/dev/null); cppcheck $(cppcheck --version 2>/dev/null); flawfinder $(flawfinder --version 2>/dev/null)"
        python3 -c 'import yaml, sys; print("PyYAML", yaml.__version__, "on", sys.version.split()[0])'
