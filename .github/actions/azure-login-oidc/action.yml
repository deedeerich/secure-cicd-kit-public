name: "Azure Login (OIDC)"
description: "Authenticate to Azure via OIDC federation. Supports Commercial and US Government clouds."
inputs:
  cloud:
    description: "Target partition: commercial | gov"
    required: true
    default: "commercial"
  tenant-id:
    description: "Azure AD tenant ID"
    required: true
  subscription-id:
    description: "Azure subscription ID"
    required: true
  client-id:
    description: "App registration / managed identity client ID for OIDC federation"
    required: true
  audience:
    description: "Azure Government only: the federated credential's audience. Empty uses api://AzureADTokenExchangeUSGov (Microsoft's Government audience); set api://AzureADTokenExchange for a Government credential made with the global one. Commercial always uses api://AzureADTokenExchange."
    required: false
    default: ""
runs:
  using: composite
  steps:
    # Requires the calling job to grant: permissions: { id-token: write, contents: read }
    - name: Azure login
      uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
      with:
        client-id: ${{ inputs.client-id }}
        tenant-id: ${{ inputs.tenant-id }}
        subscription-id: ${{ inputs.subscription-id }}
        environment: ${{ inputs.cloud == 'gov' && 'AzureUSGovernment' || 'AzureCloud' }}
        audience: ${{ inputs.cloud == 'gov' && (inputs.audience || 'api://AzureADTokenExchangeUSGov') || 'api://AzureADTokenExchange' }}
