name: "Setup Terraform"
description: "Install Terraform CLI at a pinned version."
inputs:
  terraform-version:
    description: "Terraform version to install"
    required: false
    default: "1.9.5"
runs:
  using: composite
  steps:
    - uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: ${{ inputs.terraform-version }}
