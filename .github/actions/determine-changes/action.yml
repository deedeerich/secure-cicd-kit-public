name: "Determine Changed Components"
description: "Path-based change detection (dorny/paths-filter) with a manual-dispatch override ('all' or a named component)."
inputs:
  filters:
    description: "YAML string mapping component name -> path globs (dorny/paths-filter format)"
    required: true
  component:
    description: "Manual override: a component name, 'all', or '' to auto-detect from changed paths"
    required: false
    default: ""
  event-name:
    description: "github.event_name (passed through for override logic)"
    required: true
outputs:
  changes:
    description: "JSON array of changed component names (or 'all')"
    value: ${{ steps.decide.outputs.changes }}
  any-changed:
    description: "true if at least one component changed / was selected"
    value: ${{ steps.decide.outputs.any }}
runs:
  using: composite
  steps:
    - name: Path filter (auto-detect)
      id: filter
      if: inputs.component == ''
      uses: dorny/paths-filter@v4
      with:
        filters: ${{ inputs.filters }}
    - name: Decide
      id: decide
      shell: bash
      env:
        # CALLER INPUT ARRIVES AS DATA, NEVER AS SCRIPT TEXT (tests/lint_injection.py). A
        # component name interpolated into the body truncated on a quote and could carry `$( )`;
        # the filter's output is a list derived from the caller's filters and gets the same
        # treatment.
        COMPONENT: ${{ inputs.component }}
        FILTERED: ${{ steps.filter.outputs.changes }}
      run: |
        comp="$COMPONENT"
        if [ "$comp" = "all" ]; then
          echo 'changes=["all"]' >> "$GITHUB_OUTPUT"; echo "any=true" >> "$GITHUB_OUTPUT"
        elif [ -n "$comp" ]; then
          echo "changes=[\"$comp\"]" >> "$GITHUB_OUTPUT"; echo "any=true" >> "$GITHUB_OUTPUT"
        else
          c="$FILTERED"
          [ -z "$c" ] && c='[]'
          echo "changes=$c" >> "$GITHUB_OUTPUT"
          if [ "$c" != "[]" ]; then echo "any=true" >> "$GITHUB_OUTPUT"; else echo "any=false" >> "$GITHUB_OUTPUT"; fi
        fi
