name: Secret scan (gitleaks + detect-secrets)
description: >-
  The secret-scan job's steps, moved out of reusable-security.yml unchanged (completion ledger L64,
  decomposition plan section 7 step 12) and reached through `$/`, which delivers the whole kit at
  the commit the caller pinned. The job keeps its condition, timeout, needs and Result summary; this
  composite is its FIRST step, so every `if:` below sees exactly the step history it saw inline.
  tests/prove_composite_move_equivalence.py expands this file back into the job and compares it with
  the job as it stood before the move; the proofs that run these steps run them from here.

# Each input carries the job's own expression through unchanged. Inputs arrive as STRINGS, so the
# one boolean the job used inside an expression (`scan_git_history && '0' || '1'`) is evaluated in
# the JOB and arrives here as its result, `checkout_fetch_depth`.
inputs:
  paths:
    description: The workflow's `paths` input -- the scope scanned in working-tree mode.
    required: true
  scan_git_history:
    description: The workflow's `scan_git_history` input, rendered as 'true' or 'false'.
    required: true
  test_only_seed_artifact:
    description: The workflow's `test_only_seed_artifact` input (KDEC-011). Empty for every consumer.
    required: true
  checkout_fetch_depth:
    description: The job's `inputs.scan_git_history && '0' || '1'`, evaluated where the boolean is a boolean.
    required: true

# What the security gate enforces (owner ruling 2026-10-22, lane L-S): FINDINGS and the count when
# gitleaks found secrets, '' otherwise. The gate blocks on them unless each one is excepted.
outputs:
  findings_state:
    description: FINDINGS when the secret scan found secrets; '' otherwise.
    value: ${{ steps.secret_enforce.outputs.findings_state }}
  secret_count:
    description: How many secrets the scan found; '' when none or not counted.
    value: ${{ steps.secret_enforce.outputs.secret_count }}

runs:
  using: composite
  steps:
    # BEGIN FETCH_KIT_SCRIPTS — generated by scripts/inline_normalizer.py. DO NOT EDIT HERE.
    - name: Fetch the kit's own scripts
      # A RUN-SCOPED ARTIFACT, NOT `uses: ./` and NOT a copy per call site. Why, at
      # length, in the `kit-scripts` job at the top of .github/workflows/reusable-security.yml.
      if: always()
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: kit-scripts-${{ github.run_attempt }}
        path: /tmp
    - name: Verify the kit scripts against their pinned digest
      # A DOWNLOADED SCRIPT NOBODY VERIFIED IS A SUPPLY CHAIN STEP WITH NO INTEGRITY
      # CHECK. Why this digest and not a manifest fetched beside it: `kit-scripts`.
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        cd /tmp
        echo "77747346d57de23c8a301758499db36f89f41e3850a2495497d2983a6cb3916a  kit-scripts.sha256" | sha256sum -c -
        sha256sum -c kit-scripts.sha256
    # END FETCH_KIT_SCRIPTS
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Full history ONLY when explicitly requested. gitleaks-action previously forced
        # fetch-depth 0 and scanned every commit regardless of `paths` — a consumer asking
        # for one service got 33 commits of unrelated history scanned instead.
        fetch-depth: ${{ inputs.checkout_fetch_depth }}

    # ── TEST-ONLY SEEDS (KDEC-011): ADD FILES TO THE SCANNED TREE, AND NOTHING ELSE ──────
    #
    # The consumer-path test's credential seeds are generated and never committed (0917493),
    # so a checkout cannot carry them: hosted run 38784374419 graded all four ABSENT, because no
    # scanner had been shown them. The test delivers them as a run artifact named by
    # `test_only_seed_artifact`. Three steps, each a refusal: the name is validated BEFORE
    # anything is fetched; the fetch lands in a staging directory OUTSIDE the tree; placement
    # copies regular files only, into the scanned tree only, never over an existing file, and
    # never a hidden file or a scanner configuration -- a .gitleaksignore would be an add-only
    # way to silence a finding. Empty input: none of this runs and the job is what it was.
    # tests/prove_test_only_seeds_add_only.py runs the shipped steps against every refusal.
    - name: TEST-ONLY seeds — validate the artifact name before anything is fetched
      if: inputs.test_only_seed_artifact != ''
      env:
        # CALLER INPUT ARRIVES AS DATA, NEVER AS SCRIPT TEXT (ledger L38).
        IN_SEED_ARTIFACT: ${{ inputs.test_only_seed_artifact }}
      shell: bash -e {0}
      run: |
        set -euo pipefail
        # A simple charset, checked before the name reaches any tool: no separators, no
        # traversal, no shell metacharacters, no leading dot, at most 128 characters.
        if ! printf '%s' "$IN_SEED_ARTIFACT" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'; then
          echo "::error title=TEST-ONLY seed artifact refused::the name is not [A-Za-z0-9][A-Za-z0-9._-]{0,127}."
          exit 1
        fi
        echo "TEST-ONLY seed artifact '$IN_SEED_ARTIFACT': name validated; fetching next."

    - name: TEST-ONLY seeds — fetch into a staging directory outside the tree
      if: inputs.test_only_seed_artifact != ''
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.test_only_seed_artifact }}
        path: ${{ runner.temp }}/test-only-seeds

    - name: TEST-ONLY seeds — place into the scanned tree, add-only
      id: seeds
      if: inputs.test_only_seed_artifact != ''
      env:
        # CALLER INPUT ARRIVES AS DATA, NEVER AS SCRIPT TEXT (ledger L38).
        IN_PATHS: ${{ inputs.paths }}
        IN_SEED_ARTIFACT: ${{ inputs.test_only_seed_artifact }}
        SEED_DIR: ${{ runner.temp }}/test-only-seeds
      shell: bash -e {0}
      run: |
        set -euo pipefail
        # ADD-ONLY MEANS EVERY OTHER OPERATION IS REFUSED, AND A REFUSAL PLACES NOTHING.
        # Every entry is checked before any entry is copied.
        if [ ! -d "$SEED_DIR" ]; then
          echo "::error title=TEST-ONLY seeds refused::the staging directory '$SEED_DIR' never arrived."
          exit 1
        fi
        if [ ! -d "$IN_PATHS" ]; then
          echo "::error title=TEST-ONLY seeds refused::the scope '$IN_PATHS' is not a directory."
          exit 1
        fi
        # Anything that is not a regular file or a directory -- a symlink could point a seed
        # outside the tree -- is refused outright.
        odd=$(find "$SEED_DIR" -mindepth 1 ! -type f ! -type d)
        if [ -n "$odd" ]; then
          echo "::error title=TEST-ONLY seeds refused::non-regular entries in the artifact:"
          printf '%s\n' "$odd"
          exit 1
        fi
        refused=0; n=0
        while IFS= read -r f; do
          [ -n "$f" ] || continue
          n=$((n+1))
          rel="${f#"$SEED_DIR"/}"
          case "$rel" in
            /*|*/../*|../*|*/..|..)
              echo "::error title=TEST-ONLY seeds refused::'$rel' would leave the scanned tree."
              refused=1 ;;
          esac
          case "/$rel" in
            */.*)
              # A .gitleaksignore or a .secrets.baseline is an add-only way to silence a finding.
              echo "::error title=TEST-ONLY seeds refused::hidden entry '$rel'. A dotfile can be a suppression."
              refused=1 ;;
          esac
          case "${rel##*/}" in
            *gitleaks*.toml|*.baseline)
              echo "::error title=TEST-ONLY seeds refused::'$rel' is scanner configuration."
              refused=1 ;;
          esac
          if [ -e "$IN_PATHS/$rel" ] || [ -L "$IN_PATHS/$rel" ]; then
            echo "::error title=TEST-ONLY seeds refused::'$rel' already exists in the scanned tree. Add-only never overwrites."
            refused=1
          fi
        done < <(find "$SEED_DIR" -type f | sort)
        if [ "$n" -eq 0 ]; then
          echo "::error title=TEST-ONLY seeds refused::artifact '$IN_SEED_ARTIFACT' holds no files. A delivery of nothing is not a delivery."
          exit 1
        fi
        if [ "$refused" != "0" ]; then
          echo "::error title=TEST-ONLY seeds refused::nothing was placed."
          exit 1
        fi
        placed=0
        while IFS= read -r f; do
          [ -n "$f" ] || continue
          rel="${f#"$SEED_DIR"/}"
          mkdir -p "$(dirname "$IN_PATHS/$rel")"
          cp "$f" "$IN_PATHS/$rel"
          placed=$((placed+1))
          echo "  added  $IN_PATHS/$rel"
        done < <(find "$SEED_DIR" -type f | sort)
        echo "placed=$placed" >> "$GITHUB_OUTPUT"
        echo "::warning title=TEST-ONLY input in force::$placed file(s) from artifact '$IN_SEED_ARTIFACT' were ADDED to '$IN_PATHS'. Nothing was removed or overwritten. A consumer run has no reason to set test_only_seed_artifact."
        echo "| TEST-ONLY seeds | $placed file(s) added to \`$IN_PATHS\` from artifact \`$IN_SEED_ARTIFACT\` | test-only input in force; add-only |" >> "$GITHUB_STEP_SUMMARY"

    - name: Write the Azure/Entra rules
      shell: bash -e {0}
      run: |
        # INLINED ON PURPOSE. A reusable workflow runs against the CALLER's checkout, so
        # developer-safety/hooks/gitleaks-azure.toml does not exist at runtime. Referencing
        # it worked only inside this repo. Consumers were silently getting STOCK gitleaks
        # while the capability matrix claimed 14 custom Azure/Entra classes — detection the
        # caller never actually had.
        #
        # WRITTEN TO RUNNER_TEMP, NEVER INTO THE CHECKOUT (lane L-SD). The scanned scope is the
        # repository root (KDEC-018), so a rules file written there was counted by the denominator
        # as a file the scan read: an EMPTY repository reported "1 file scanned, 0 secrets" and
        # was never COLLECTION_FAILED (hosted self-test job 119995060869). Every file this job
        # writes before or during a scan lives outside the scope. tests/prove_secret_denominator.py.
        : "${RUNNER_TEMP:?RUNNER_TEMP is unset: the kit has nowhere outside the scanned scope to write}"
        cat > "$RUNNER_TEMP/gitleaks-azure.toml" <<'GITLEAKS_TOML'
        # Gitleaks config — Azure / Entra credential classes.
        #
        # WHY THIS EXISTS: the baseline hook set carried `detect-aws-credentials` and nothing equivalent for
        # Azure. Generic high-entropy detection MAY catch some Azure secrets. "May catch" is not deliberate
        # coverage of the credential classes you actually use.
        #
        # SCOPE: this is a DEVELOPER GUARDRAIL. It is bypassable with --no-verify and is not the security
        # boundary. Repository/organization secret scanning in CI is the authoritative layer. Both should
        # exist; neither substitutes for the other.
        #
        # Usage:  gitleaks detect --config developer-safety/hooks/gitleaks-azure.toml --source .
        # Extend: [extend] useDefault = true  pulls in gitleaks' built-in rules as well.

        title = "Azure / Entra credential detection"

        [extend]
        useDefault = true

        # --- Storage ------------------------------------------------------------------

        [[rules]]
        id = "azure-storage-connection-string"
        description = "Azure Storage connection string containing an account key"
        regex = '''DefaultEndpointsProtocol=https?;.*AccountKey=[A-Za-z0-9+/=]{80,}'''
        tags = ["azure", "storage", "connection-string"]

        [[rules]]
        id = "azure-storage-account-key"
        description = "Azure Storage account key (88-char base64 ending in ==)"
        regex = '''(?i)(accountkey|storage[_-]?key|primary[_-]?key)\s*[:=]\s*['\"]?([A-Za-z0-9+/]{86}==)'''
        secretGroup = 2
        tags = ["azure", "storage"]

        [[rules]]
        id = "azure-sas-token"
        description = "Azure Shared Access Signature token"
        regex = '''[?&]sv=\d{4}-\d{2}-\d{2}&(?:[a-z]{2}=[^&\s'\"]*&){1,8}sig=[A-Za-z0-9%+/=]{20,}'''
        tags = ["azure", "sas"]

        # --- Messaging ----------------------------------------------------------------

        [[rules]]
        id = "azure-shared-access-key"
        description = "Service Bus / Event Hub / Relay / IoT Hub SharedAccessKey"
        regex = '''(?i)Endpoint=sb://[^;]+;SharedAccessKeyName=[^;]+;SharedAccessKey=[A-Za-z0-9+/=]{20,}'''
        tags = ["azure", "servicebus", "eventhub"]

        [[rules]]
        id = "azure-iothub-connection-string"
        description = "IoT Hub connection string"
        regex = '''HostName=[^;]+\.azure-devices\.net;.*SharedAccessKey=[A-Za-z0-9+/=]{20,}'''
        tags = ["azure", "iot"]

        # --- Data ---------------------------------------------------------------------

        [[rules]]
        id = "azure-cosmos-key"
        description = "Cosmos DB account key or connection string"
        regex = '''(?i)(AccountEndpoint=https://[^;]+\.documents\.azure\.com[^;]*;AccountKey=|cosmos[_-]?key\s*[:=]\s*['\"]?)([A-Za-z0-9+/]{86}==)'''
        secretGroup = 2
        tags = ["azure", "cosmos"]

        [[rules]]
        id = "azure-sql-connection-string"
        description = "Azure SQL connection string with an inline password"
        regex = '''(?i)Server=tcp:[^;]+\.database\.windows\.net.*(Password|Pwd)=[^;\s'\"]{6,}'''
        tags = ["azure", "sql"]

        [[rules]]
        id = "azure-redis-key"
        description = "Azure Cache for Redis connection string with a password"
        regex = '''(?i)[a-z0-9-]+\.redis\.cache\.windows\.net:\d+,password=[A-Za-z0-9+/=]{20,}'''
        tags = ["azure", "redis"]

        # --- Entra / identity ---------------------------------------------------------

        [[rules]]
        id = "entra-client-secret-value"
        description = "Entra app registration client secret (newer value format)"
        regex = '''\b[A-Za-z0-9~._-]{3}8Q~[A-Za-z0-9~._-]{31,34}\b'''
        tags = ["azure", "entra", "client-secret"]

        [[rules]]
        id = "entra-client-secret-assignment"
        description = "Client secret assigned to a variable or config key"
        regex = '''(?i)(client[_-]?secret|app[_-]?secret|azure[_-]?client[_-]?secret|arm[_-]?client[_-]?secret)\s*[:=]\s*['\"]([A-Za-z0-9~._@#$%^&*+/=-]{20,})['\"]'''
        secretGroup = 2
        tags = ["azure", "entra"]

        [[rules]]
        id = "azure-service-principal-password-cli"
        description = "Service principal credential printed or passed on a CLI"
        regex = '''(?i)az\s+(ad\s+sp|login).*--password\s+['\"]?[^\s'\"]{8,}'''
        tags = ["azure", "entra", "cli"]

        # --- DevOps / platform --------------------------------------------------------

        [[rules]]
        id = "azure-devops-pat"
        description = "Azure DevOps personal access token"
        regex = '''(?i)(azure[_-]?devops|ado|vsts|system[_-]?accesstoken)[_-]?(pat|token)?\s*[:=]\s*['\"]?([a-z2-7]{52})['\"]?'''
        secretGroup = 3
        tags = ["azure", "devops", "pat"]

        [[rules]]
        id = "azure-subscription-key"
        description = "API Management / Cognitive Services subscription key"
        regex = '''(?i)(ocp-apim-subscription-key|subscription[_-]?key|api[_-]?key)\s*[:=]\s*['\"]?([a-f0-9]{32})['\"]?'''
        secretGroup = 2
        tags = ["azure", "apim"]

        [[rules]]
        id = "azure-publish-settings"
        description = "App Service publish profile containing userPWD"
        regex = '''userPWD=['\"][^'\"]{8,}['\"]'''
        tags = ["azure", "appservice"]

        # --- Allowlist ----------------------------------------------------------------
        # Placeholders, docs and test fixtures. Extend locally — do not weaken the rules to silence noise.

        [allowlist]
        description = "Documentation placeholders and obvious non-secrets"
        regexes = [
          '''00000000-0000-0000-0000-000000000000''',
          '''(?i)(your|my|the|example|sample|dummy|placeholder|redacted|changeme|xxx+|<[^>]+>)[_-]?(secret|key|password|token)''',
          '''(?i)accountkey=[A-Za-z0-9+/]{0,20}(example|test|fake|dummy)''',
        ]
        paths = [
          # DO NOT allowlist .md / .rst / .txt wholesale. Secrets land in runbooks, notes and
          # READMEs constantly, and a doc-wide exemption makes every one of them invisible.
          # This was shipped once and the validation fixture caught it — three of four rules
          # silently stopped detecting because their fixture files ended in .txt.
          '''(^|/)docs/adr/.*\.md$''',              # ADRs quote config examples; narrow and deliberate
          '''(^|/)tests?/fixtures?/''',
          '''\.env\.example$''',
          '''\.env\.template$''',
          '''(^|/)CHANGELOG\.md$''',
        ]
        GITLEAKS_TOML
        echo "rules loaded: $(grep -c 'rules' "$RUNNER_TEMP/gitleaks-azure.toml")"

    - name: Install gitleaks
      shell: bash -e {0}
      run: |
        set -euo pipefail
        # The release CDN returned 503 in a prior run. URL and asset name were correct; the
        # delivery path is not reliable. Extract from the vendor image instead.
        IMG=zricethezav/gitleaks:v8.21.2
        docker pull -q "$IMG"
        CID=$(docker create "$IMG")
        # Staged in RUNNER_TEMP, not the checkout: the checkout is the scanned scope (KDEC-018).
        docker cp "$CID:/usr/bin/gitleaks" "$RUNNER_TEMP/gitleaks" \
          || docker cp "$CID:/gitleaks" "$RUNNER_TEMP/gitleaks"
        docker rm -f "$CID" >/dev/null
        sudo mv "$RUNNER_TEMP/gitleaks" /usr/local/bin/ && sudo chmod +x /usr/local/bin/gitleaks
        gitleaks version

    - name: Gitleaks (path-scoped, redacted)
      id: gitleaks
      env:
        # CALLER INPUT ARRIVES AS DATA, NEVER AS SCRIPT TEXT (ledger L38).
        IN_SCAN_GIT_HISTORY: ${{ inputs.scan_git_history }}
        IN_PATHS: ${{ inputs.paths }}
      shell: bash -e {0}
      run: |
        set -uo pipefail
        # --redact is NOT optional. Without it the matched credential is written into the
        # SARIF, which then reaches job logs and a downloadable artifact — turning the secret
        # scanner into a secret DISCLOSURE channel. Findings carry rule, file and line only.
        #
        # "NO SECRETS FOUND" OVER A SCOPE IT DID NOT READ IS NOT A RESULT (L04; PIPELINE_ORDERING
        # section 5.4). Measured against the pinned gitleaks 8.21.2: with --no-git an EMPTY scope
        # prints "no leaks found", exits 0 and writes a valid SARIF with zero results -- exactly
        # what a clean scan writes -- and prints no byte count at all; history mode prints
        # "0 commits scanned." and exits 0. The design's `scanned ~0 bytes` signal does not exist
        # in either mode, so the kit establishes its own denominator: it enumerates the scope and
        # refuses an empty one, and in history mode it reads the commit count gitleaks prints.
        # tests/prove_secret_denominator.py runs this step against empty and populated scopes.
        if [ "${IN_SCAN_GIT_HISTORY}" = "true" ]; then
          echo "Scanning working tree AND git history (repository-wide; ignores paths)."
          gitleaks detect --redact --config "$RUNNER_TEMP/gitleaks-azure.toml" \
            --report-format sarif --report-path gitleaks.sarif --exit-code 0 2>&1 \
            | tee "$RUNNER_TEMP/gitleaks.log"
          commits=$(sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/gitleaks.log" \
            | grep -oE '[0-9]+ commits scanned' | grep -oE '^[0-9]+' | tail -1)
          if [ -z "${commits:-}" ] || [ "$commits" -eq 0 ]; then
            echo "::error title=COLLECTION_FAILED::gitleaks scanned ${commits:-no} commits."
            echo "A history scan that read no commits has established nothing about secrets."
            echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "commits_scanned=$commits" >> "$GITHUB_OUTPUT"
        else
          echo "Scanning working tree at: ${IN_PATHS}"
          # suppression: PRESENTATION_ONLY -- find's stderr is noise on unreadable subtrees.
          # discards: find's stderr on unreadable or permission-denied subtrees
          # preserved_by: the EXIT STATUS is checked here and a failure is COLLECTION_FAILED,
          # preserved_by: so 'could not enumerate' never reads as 'nothing to scan'
          if ! _list=$(find "${IN_PATHS}" -type f -not -path '*/.git/*' 2>/dev/null); then
            echo "::error title=COLLECTION_FAILED::The scope could not be enumerated."
            echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          files=$(printf '%s\n' "$_list" | sed '/^$/d' | wc -l | tr -d ' ')
          if [ "$files" -eq 0 ]; then
            echo "::error title=COLLECTION_FAILED::The scope '${IN_PATHS}' holds no files."
            echo "gitleaks would report 'no leaks found' over it. That is 'no files read', not"
            echo "'no secrets': posture cannot be established from this run."
            echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "files_scanned=$files" >> "$GITHUB_OUTPUT"
          gitleaks detect --no-git --source "${IN_PATHS}" --redact \
            --config "$RUNNER_TEMP/gitleaks-azure.toml" \
            --report-format sarif --report-path gitleaks.sarif --exit-code 0
        fi
        # A PARSE FAILURE IS NOT ZERO FINDINGS.
        #
        # This was `jq ... 2>/dev/null || echo 0`, so a missing, truncated or malformed report
        # produced n=0 -- which the gate reads as CLEAN. The taxonomy already had a word for
        # exactly this (COLLECTION_FAILED: "an empty but well-formed result is indistinguishable
        # from a clean scan") while the code did the opposite. Found by auditing the class after
        # the same defect turned up in discovery, not by reading this line.
        if [ ! -s gitleaks.sarif ]; then
          echo "::error title=COLLECTION_FAILED::gitleaks.sarif was not produced."
          echo "An ABSENT report is not zero findings. Posture cannot be established from this run."
          echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
          exit 1
        fi
        # VALIDITY ROWS 1-6, ON THE RUNNER, BEFORE PUBLICATION (ledger L02; PIPELINE_ORDERING 4.5):
        # results absent (did not attempt), no run, an error-level tool notification or
        # executionSuccessful false is COLLECTION_FAILED -- never a count of zero, and never
        # published as a clean scan. Per-tool profile, not a hollow-rules rule (KDEC-008 OD-2).
        if ! _v=$(python3 /tmp/sarif_validity.py --tool gitleaks gitleaks.sarif 2>&1); then
          echo "::error title=COLLECTION_FAILED::$_v"
          echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
          exit 1
        fi
        if ! n=$(jq '[.runs[].results[]] | length' gitleaks.sarif 2>&1); then
          echo "::error title=COLLECTION_FAILED::gitleaks.sarif is not valid SARIF."
          echo "jq said: $n"
          echo "A PARSE FAILURE is not zero findings."
          echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
          exit 1
        fi
        echo "count=${n//[$'\r\n']/ }" >> "$GITHUB_OUTPUT"
        echo "secret findings: $n"

    - name: Strip residual secret material before persisting
      if: always()
      shell: bash -e {0}
      run: |
        # Defence in depth behind --redact. The artifact is downloadable by anyone with repo
        # read access, so drop snippets and fingerprints; keep rule, file and line.
        [ -s gitleaks.sarif ] || exit 0
        python3 - <<'STRIP_PY'
        import json
        d = json.load(open("gitleaks.sarif", encoding="utf-8"))
        for run in d.get("runs", []):
            for res in run.get("results", []):
                for loc in res.get("locations", []):
                    pl = loc.get("physicalLocation", {})
                    pl.get("region", {}).pop("snippet", None)
                    pl.get("contextRegion", {}).pop("snippet", None)
                res.pop("partialFingerprints", None)
        json.dump(d, open("gitleaks.sarif", "w", encoding="utf-8"))
        print("snippets and fingerprints stripped from gitleaks.sarif")
        STRIP_PY

    - name: Enforce
      id: secret_enforce
      if: always()
      shell: bash -e {0}
      run: |
        # Detection and ENFORCEMENT complete here, BEFORE any publication is attempted.
        # Whether the Security tab accepts the report must never decide whether the scan
        # passed. Publication is a projection of the result, not the result.
        n='${{ steps.gitleaks.outputs.count }}'
        # COLLECTION_FAILED IS NOT ZERO FINDINGS -- AND THIS STEP RUNS ON always().
        #
        # The counting step above correctly refuses to turn a missing or malformed report
        # into n=0, and exits non-zero. But `if: always()` means THIS step still runs, reads
        # an output that was never written, and ${n:-0} quietly supplies the very zero the
        # step above refused to invent -- announcing GATE=PASS one line after the failure was
        # detected. Each side assumed the other had handled it. Check explicitly.
        collection='${{ steps.gitleaks.outputs.collection }}'
        if [ "$collection" = "COLLECTION_FAILED" ]; then
          echo "::error title=COLLECTION_FAILED::Evidence could not be collected."
          echo "Posture CANNOT be established from this run. This is not a clean result."
          exit 1
        fi
        if [ -z "${n:-}" ]; then
          echo "::error title=COLLECTION_FAILED::No count was produced by the scan step."
          echo "An ABSENT measurement is not a measurement of zero."
          exit 1
        fi
        # SECRETS ARE OUTSIDE advisory_mode, HERE AS WELL AS IN THE GATE (C2 / N1).
        #
        # This step used to exit 0 on findings when advisory_mode was on. The job then
        # succeeded, the gate read `success`, its secret_fail was never set -- and the rule the
        # gate enforces before advisory_mode had nothing to enforce. The gate can only block what
        # this step reports, so this step does not consult advisory_mode at all.
        # tests/prove_secrets_always_block.py runs this step in both modes.
        #
        # HANDED TO THE GATE, NOT FAILED HERE (owner ruling 2026-10-22, lane L-S). A secret may now
        # be excepted -- ONE finding, ticketed, attributed, unexpired, in the protected-branch policy
        # register -- and only the gate holds the resolved policy. So this step reports the secrets
        # (findings_state=FINDINGS, secret_count) and the gate BLOCKS on them at every tier unless
        # each one is excepted by fingerprint. advisory_mode still has no say in either place.
        # tests/prove_secrets_always_block.py, tests/prove_gate_policy_enforcement.py (sx_*).
        if [ "${n:-0}" -gt 0 ]; then
          echo "findings_state=FINDINGS" >> "$GITHUB_OUTPUT"
          echo "secret_count=${n}" >> "$GITHUB_OUTPUT"
          echo "::error title=Secrets detected::${n} finding(s). Values redacted by design —"
          echo "see the sarif-gitleaks artifact for rule, file and line. The security gate blocks"
          echo "on them at every tier unless each is excepted, by fingerprint, in the policy register."
          exit 0
        fi
        echo "ANALYSIS=COMPLETE  GATE=PASS  (no secrets detected)"

    - name: gitleaks — is there anything to publish?
      if: always()
      id: sarif_gitleaks
      shell: bash -e {0}
      run: |
        if [ -s "gitleaks.sarif" ]; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
          echo "::notice title=gitleaks: nothing to publish::No SARIF produced. Not a failure."
        fi
    # BEGIN REDACT_STEP — generated by scripts/inline_normalizer.py. DO NOT EDIT HERE.
    - name: Redact credential material before upload
      if: always()
      shell: bash
      run: |
        # ORDER IS THE WHOLE CONTROL: this runs immediately before an upload, and
        # again before every later upload that follows a step which may have written
        # output -- a redactor after the upload protects nothing while looking exactly
        # like protection (N24/WP19). The sweep itself is ONE canonical script --
        # scripts/redact_all.sh, written by the `kit-scripts` job and fetched into
        # /tmp by every other -- because fourteen copies of one wrapper are how this
        # file reached 608.8 KB and stopped starting.
        #
        # A MISSING TOOL IS NOT A CLEAN RESULT. If the bundle did not arrive,
        # publication must not proceed on the strength of a scrub that never ran.
        if [ ! -s /tmp/redact_all.sh ]; then
          echo "::error title=Redaction could not be guaranteed::/tmp/redact_all.sh is absent."
          echo "The kit-scripts artifact did not reach this job, so no SARIF was scrubbed"
          echo "and none may be published. A MISSING TOOL IS NOT A CLEAN RESULT."
          exit 1
        fi
        bash /tmp/redact_all.sh
    # END REDACT_STEP
    - name: gitleaks — keep SARIF as an artifact
      if: always() && steps.sarif_gitleaks.outputs.exists == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: sarif-gitleaks-${{ github.run_attempt }}
        path: gitleaks.sarif
        retention-days: 30
        if-no-files-found: warn
    - name: gitleaks — publish to the Security tab where available
      id: cs_gitleaks
      if: always() && steps.sarif_gitleaks.outputs.exists == 'true'
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        sarif_file: gitleaks.sarif
        category: gitleaks
    - name: gitleaks — state plainly if publication degraded
      if: always() && steps.sarif_gitleaks.outputs.exists == 'true' && steps.cs_gitleaks.outcome != 'success'
      shell: bash -e {0}
      run: |
        echo "::warning title=gitleaks: NOT published to the Security tab::Code scanning is"
        echo "unavailable for this repository. ANALYSIS=COMPLETE, enforcement already ran."
        echo "Retrieve redacted findings from the 'sarif-gitleaks' artifact."

    - name: detect-secrets (defense in depth)
      if: always()
      env:
        # CALLER INPUT ARRIVES AS DATA, NEVER AS SCRIPT TEXT (ledger L38).
        IN_PATHS: ${{ inputs.paths }}
      shell: bash -e {0}
      run: |
        set -uo pipefail
        python -m pip install --quiet detect-secrets
        # THE EXIT CODE OF `detect-secrets scan` CARRIES NO INFORMATION: it is 0 unconditionally.
        # Its default scope is git-tracked files, and a failing `git ls-files` is swallowed to an
        # empty set -- `"results": {}` and exit 0, which is how a scan of nothing reads as clean
        # (PIPELINE_ORDERING section 5.4 hit exactly that). So: the kit enumerates the scope
        # itself, scans ALL files rather than git's view of them, and refuses a report it cannot
        # parse. Its finding count is emitted as evidence rather than discarded (L04).
        # suppression: PRESENTATION_ONLY -- find's stderr is noise on unreadable subtrees.
        # discards: find's stderr on unreadable or permission-denied subtrees
        # preserved_by: the EXIT STATUS is checked here and a failure is COLLECTION_FAILED
        #
        # THE KIT'S OWN REPORT IS NOT A FILE THE SCAN READ (lane L-SD). The scope is the
        # repository root (KDEC-018), and by now gitleaks has written gitleaks.sarif there -- it
        # must stay there, because the redaction sweep, the artifact and the Security-tab upload
        # read it from the working directory -- and the redactor may have renamed it to
        # gitleaks.sarif.UNREDACTED-WITHHELD. Counted, either made an empty repository read as
        # "1 file scanned". Exactly those two working-directory files are left out, by file
        # identity in the count and by an anchored path in the scan; a gitleaks.sarif anywhere
        # else in the tree is the consumer's and is counted. Everything else this step writes
        # goes to RUNNER_TEMP. tests/prove_secret_denominator.py (ds_empty, ds_after_report).
        _kit=()
        for _k in gitleaks.sarif gitleaks.sarif.UNREDACTED-WITHHELD; do
          if [ -f "$_k" ]; then _kit+=( ! -samefile "$_k" ); fi
        done
        if ! _list=$(find "${IN_PATHS}" -type f -not -path '*/.git/*' "${_kit[@]}" 2>/dev/null); then
          echo "::error title=COLLECTION_FAILED (detect-secrets)::The scope could not be enumerated."
          exit 1
        fi
        files=$(printf '%s\n' "$_list" | sed '/^$/d' | wc -l | tr -d ' ')
        if [ "$files" -eq 0 ]; then
          echo "::error title=COLLECTION_FAILED (detect-secrets)::The scope holds no files."
          exit 1
        fi
        # detect-secrets records hashes rather than values, so its report is safe to retain.
        detect-secrets scan --all-files --exclude-files '(^|/)\.git/' \
          --exclude-files '^(\./)?gitleaks\.sarif(\.UNREDACTED-WITHHELD)?$' \
          "${IN_PATHS}" > "$RUNNER_TEMP/ds-scan.json"
        if ! ds=$(jq -e '.results | if type == "object" then ([.[] | length] | add // 0)
                         else error("no results map") end' "$RUNNER_TEMP/ds-scan.json" 2>&1); then
          echo "::error title=COLLECTION_FAILED (detect-secrets)::the detect-secrets report is not usable."
          echo "jq said: $ds"
          exit 1
        fi
        echo "ds_count=$ds" >> "$GITHUB_OUTPUT"
        echo "ds_files_scanned=$files" >> "$GITHUB_OUTPUT"
        echo "detect-secrets: $ds potential secret(s) across $files file(s) -- reported as evidence;"
        echo "gitleaks is the enforcing scanner in this job."
        echo "| detect-secrets | $ds finding(s) over $files file(s) | evidence, not enforced |" >> "$GITHUB_STEP_SUMMARY"
        if [ -f .secrets.baseline ]; then
          detect-secrets audit --report --baseline .secrets.baseline || true
        fi
