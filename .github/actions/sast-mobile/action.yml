name: SAST (mobile)
description: >-
  The sast-mobile job's steps (lane L-SCAN-B, KDEC-026): mobsfscan over Android (Kotlin and Java
  source, AndroidManifest.xml, network_security_config) and iOS (Swift, Objective-C, Info.plist
  ATS, keychain), plus the kit's own Semgrep rules for what mobsfscan does not read (exported
  components with no permission, hard-coded Gradle signing passwords, Gradle minSdk, debuggable
  release builds -- mobile-config.semgrep.yml beside this file). Reached through `$/`, which
  delivers the whole kit at the commit the caller pinned; the job keeps its discovery condition,
  timeout and Result summary, and this composite is its FIRST step. iOS is analysed from source on
  ubuntu-latest: CodeQL for Swift needs a macOS runner (10x the minute rate), which the kit does not
  add -- a deliberate cost decision recorded in KDEC-026.

inputs:
  paths:
    description: The workflow's `paths` input -- the scope both scanners read.
    required: true
  soft_fail_sast:
    description: The workflow's `soft_fail_sast` input, rendered as 'true' or 'false'.
    required: true
  advisory_mode:
    description: The workflow's `advisory_mode` input, rendered as 'true' or 'false'.
    required: true

# What the security gate enforces (lane L-S, O-24): FINDINGS when either scanner's error-level
# threshold fired and no caller input softened it, '' otherwise. Read through the call's id.
outputs:
  findings_state:
    description: FINDINGS when this scan's own threshold fired unsoftened; '' otherwise.
    value: ${{ steps.mobsfscan_enforce.outputs.findings_state || steps.mobile_rules_enforce.outputs.findings_state }}

runs:
  using: composite
  steps:
    # BEGIN FETCH_KIT_SCRIPTS — generated by scripts/inline_normalizer.py. DO NOT EDIT HERE.
    - name: Fetch the kit's own scripts
      # A RUN-SCOPED ARTIFACT, NOT `uses: ./` and NOT a copy per call site. Why, at
      # length, in the `kit-scripts` job at the top of .github/workflows/reusable-security.yml.
      if: always()
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: kit-scripts-${{ github.run_attempt }}
        path: /tmp
    - name: Verify the kit scripts against their pinned digest
      # A DOWNLOADED SCRIPT NOBODY VERIFIED IS A SUPPLY CHAIN STEP WITH NO INTEGRITY
      # CHECK. Why this digest and not a manifest fetched beside it: `kit-scripts`.
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        cd /tmp
        echo "77747346d57de23c8a301758499db36f89f41e3850a2495497d2983a6cb3916a  kit-scripts.sha256" | sha256sum -c -
        sha256sum -c kit-scripts.sha256
    # END FETCH_KIT_SCRIPTS
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    # PINNED BY VERSION AND DIGEST (KDEC-026). mobsfscan 1.0.1 (PyPI, 2026-09-21) pins semgrep
    # 1.172.0 exactly, so both are installed --no-deps against the sha256 PyPI published for each
    # file, into a venv of their own (this job's Semgrep is not the sast-semgrep image's 1.178.0, and
    # the runner's system Python is externally managed). Only then are the remaining, ordinary
    # dependencies resolved by version. A digest that does not match installs nothing.
    - name: Install mobsfscan
      shell: bash -e {0}
      run: |
        set -euo pipefail
        venv="$RUNNER_TEMP/mobsf-venv"
        python3 -m venv "$venv"
        {
          echo "mobsfscan==1.0.1 --hash=sha256:4d755d4b7910fdbb119f1844433a1fbe1d8c2d64e02eee4b648331c51f260bd3"
          echo "semgrep==1.172.0 --hash=sha256:d8b94af4266a575287ad2cd844573743ab4fe58f6bfb6d9229327807937eade3 --hash=sha256:f13ddebc870e784b03c9247f095720f49f67244eca1e7da493364f55c65b4493"
        } > "$RUNNER_TEMP/mobsf-pinned.txt"
        if ! timeout 300 "$venv/bin/python" -m pip install --quiet --no-deps --only-binary=:all: \
             --require-hashes -r "$RUNNER_TEMP/mobsf-pinned.txt"; then
          echo "::error title=DEPENDENCY_ACQUISITION_UNAVAILABLE::mobsfscan 1.0.1 / semgrep 1.172.0 did not install against their pinned digests. The mobile scanners never ran. This is NOT evidence of no vulnerabilities."
          exit 1
        fi
        timeout 300 "$venv/bin/python" -m pip install --quiet mobsfscan==1.0.1
        # USABILITY BY RUNNING THE REAL TOOL, not `command -v`.
        "$venv/bin/mobsfscan" --version
        "$venv/bin/semgrep" --version
        echo "$venv/bin" >> "$GITHUB_PATH"
    - name: mobsfscan
      id: mobsfscan
      env:
        IN_PATHS: ${{ inputs.paths }}
      shell: bash -e {0}
      run: |
        set -uo pipefail
        scope="${IN_PATHS:-.}"; [ -d "$scope" ] || scope="."
        cf() {
          echo "::error title=COLLECTION_FAILED::mobsfscan: $1 An absent or untrusted report is not zero findings."
          echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
          exit 1
        }
        # "NONE FOUND" AND "COULD NOT LOOK" ARE DIFFERENT ANSWERS.
        # suppression: PRESENTATION_ONLY -- find's stderr is noise on unreadable subtrees; the EXIT
        # STATUS is checked and a failure raises COLLECTION_FAILED rather than reading as 'nothing'.
        # discards: find's stderr on unreadable or permission-denied subtrees
        # preserved_by: the exit status, which raises COLLECTION_FAILED below
        if ! hits=$(find "$scope" -maxdepth 8 -type f \( -name AndroidManifest.xml -o -name Info.plist \
              -o -name '*.kt' -o -name '*.java' -o -name '*.swift' -o -name '*.m' -o -name '*.mm' \
              -o -name network_security_config.xml \) -not -path '*/node_modules/*' -not -path '*/.git/*' 2>/dev/null); then
          cf "the applicability survey failed; scope could not be established."
        fi
        if [ -z "$hits" ]; then
          echo "::notice title=No mobile sources::None under '$scope'. NOT_APPLICABLE."
          { echo "collection=NOT_APPLICABLE"; echo "count=0"; } >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # A POSITIVE CONTROL BEFORE THE SCAN (KDEC-026). Measured 2026-10-23, two silent failures:
        # mobsfscan pointed at a path that does not exist exits 0 with an empty SARIF whose
        # executionSuccessful is true; and with no `semgrep` on PATH it skips EVERY code rule
        # (Kotlin, Java, Swift) without a word while still reporting the manifest. So a planted
        # manifest AND a planted Kotlin MD5 call (a Semgrep-backed rule) are scanned first; a tool
        # that cannot find both on this runner is not trusted with the repository.
        canary="$RUNNER_TEMP/mobsf-canary"
        mkdir -p "$canary"
        printf '%s\n' '<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="kit.canary">' \
          '<application android:debuggable="true"/></manifest>' > "$canary/AndroidManifest.xml"
        printf '%s\n' 'import java.security.MessageDigest' \
          'fun h(b: ByteArray) = MessageDigest.getInstance("MD5").digest(b)' > "$canary/Canary.kt"
        mobsfscan --json --no-fail -o "$RUNNER_TEMP/mobsf-canary.json" "$canary" >/dev/null 2>&1 || true
        if ! jq -e '.results.android_manifest_debugging_enabled and .results.android_kotlin_md5' "$RUNNER_TEMP/mobsf-canary.json" >/dev/null 2>&1; then
          cf "the positive control (a planted debuggable manifest and a planted MD5 call in Kotlin) was not fully detected on this runner, so its silence on the repository could not be trusted."
        fi
        rm -f mobsfscan.sarif mobsfscan.raw.sarif
        # --no-fail: findings are not an exit code here, so a non-zero exit IS a failure.
        rc=0
        mobsfscan --sarif --no-fail -o mobsfscan.raw.sarif "$scope" > mobsfscan.log 2>&1 || rc=$?
        tail -n 20 mobsfscan.log
        [ "$rc" -eq 0 ] || cf "exited $rc."
        [ -s mobsfscan.raw.sarif ] || cf "wrote no SARIF."
        # NORMALISED BEFORE IT IS COUNTED OR PUBLISHED: every location repository-relative; each
        # result's level taken from its rule (mobsfscan writes `problem.severity` on the rule and
        # often no `level` on the result, which SARIF reads as "warning"); and the "hardening not
        # detected" notes mobsfscan files against the scan ROOT rather than a file are moved to the
        # summary -- they are advice about what is absent, not a finding at a location.
        python3 - <<'MOBSF_PY'
        import io, json, os, sys
        ws = os.getcwd()
        try:
            doc = json.load(io.open("mobsfscan.raw.sarif", encoding="utf-8"))
            runs = doc["runs"]
        except (OSError, ValueError, KeyError, TypeError) as exc:
            print("::error title=COLLECTION_FAILED::mobsfscan SARIF unreadable (%s)." % exc)
            sys.exit(1)
        absent_controls = []
        for run in runs:
            sev = {r.get("id"): (r.get("properties") or {}).get("problem.severity", "warning")
                   for r in ((run.get("tool") or {}).get("driver") or {}).get("rules") or []}
            kept = []
            for res in run.get("results") or []:
                lv = res.get("level") or sev.get(res.get("ruleId"), "warning")
                res["level"] = {"error": "error", "warning": "warning", "info": "note", "note": "note"}.get(lv, "warning")
                filed = False
                for loc in res.get("locations") or []:
                    al = (loc.get("physicalLocation") or {}).get("artifactLocation") or {}
                    uri = al.get("uri") or ""
                    p = uri if os.path.isabs(uri) else os.path.join(ws, uri)
                    if not os.path.isfile(p) and os.path.isfile("/" + uri):
                        p = "/" + uri
                    if os.path.isfile(p):
                        al["uri"] = os.path.relpath(p, ws).replace(os.sep, "/")
                        filed = True
                if filed:
                    kept.append(res)
                else:
                    absent_controls.append(res.get("ruleId"))
            run["results"] = kept
        json.dump(doc, io.open("mobsfscan.sarif", "w", encoding="utf-8"), indent=1)
        with io.open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as s:
            s.write("### mobsfscan\n\n")
            if absent_controls:
                s.write("Hardening mobsfscan did not detect (advice, not findings): %s\n\n"
                        % ", ".join(sorted(set(absent_controls))))
        MOBSF_PY
        [ -s mobsfscan.sarif ] || cf "its SARIF could not be normalised."
        # VALIDITY ROWS 1-6, ON THE RUNNER, BEFORE PUBLICATION (ledger L02).
        if ! _v=$(python3 /tmp/sarif_validity.py --tool mobsfscan mobsfscan.sarif 2>&1); then
          cf "$_v"
        fi
        if ! n=$(jq '[.runs[].results[] | select(.level == "error")] | length' mobsfscan.sarif 2>&1); then
          cf "mobsfscan.sarif is not valid SARIF ($n)."
        fi
        { echo "collection=COMPLETE"; echo "count=${n//[$'\r\n']/ }"; } >> "$GITHUB_OUTPUT"
        echo "mobsfscan: $(jq '[.runs[].results[]] | length' mobsfscan.sarif) finding(s), $n at error"
    - name: mobsfscan — enforce
      id: mobsfscan_enforce
      if: always()
      env:
        N: ${{ steps.mobsfscan.outputs.count }}
        COLLECTION: ${{ steps.mobsfscan.outputs.collection }}
        SOFT_FAIL_SAST: ${{ inputs.soft_fail_sast }}
        ADVISORY_MODE: ${{ inputs.advisory_mode }}
      shell: bash -e {0}
      run: |
        if [ "${COLLECTION:-}" = "COLLECTION_FAILED" ] || [ -z "${N:-}" ]; then
          echo "::error title=COLLECTION_FAILED::No mobsfscan count. An ABSENT measurement is not a measurement of zero."
          exit 1
        fi
        # Findings go to the gate (findings_state), which enforces by the resolved policy (O-24).
        if [ "$N" -gt 0 ] && [ "$SOFT_FAIL_SAST" != "true" ] && [ "$ADVISORY_MODE" != "true" ]; then
          echo "findings_state=FINDINGS" >> "$GITHUB_OUTPUT"
          echo "::warning title=mobsfscan::${N} error-level finding(s). ANALYSIS=COMPLETE -- handed to the security gate, which decides by the resolved policy."
          exit 0
        fi
        echo "mobsfscan: ${COLLECTION}, ${N} error-level finding(s) (soft_fail=${SOFT_FAIL_SAST})"
    # BEGIN REDACT_STEP — generated by scripts/inline_normalizer.py. DO NOT EDIT HERE.
    - name: Redact credential material before upload
      if: always()
      shell: bash
      run: |
        # ORDER IS THE WHOLE CONTROL: this runs immediately before an upload, and
        # again before every later upload that follows a step which may have written
        # output -- a redactor after the upload protects nothing while looking exactly
        # like protection (N24/WP19). The sweep itself is ONE canonical script --
        # scripts/redact_all.sh, written by the `kit-scripts` job and fetched into
        # /tmp by every other -- because fourteen copies of one wrapper are how this
        # file reached 608.8 KB and stopped starting.
        #
        # A MISSING TOOL IS NOT A CLEAN RESULT. If the bundle did not arrive,
        # publication must not proceed on the strength of a scrub that never ran.
        if [ ! -s /tmp/redact_all.sh ]; then
          echo "::error title=Redaction could not be guaranteed::/tmp/redact_all.sh is absent."
          echo "The kit-scripts artifact did not reach this job, so no SARIF was scrubbed"
          echo "and none may be published. A MISSING TOOL IS NOT A CLEAN RESULT."
          exit 1
        fi
        bash /tmp/redact_all.sh
    # END REDACT_STEP
    - name: mobsfscan — keep SARIF as an artifact
      if: always() && steps.mobsfscan.outputs.collection == 'COMPLETE'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: sarif-mobsfscan-${{ github.run_attempt }}
        path: mobsfscan.sarif
        retention-days: 30
        if-no-files-found: warn
    - name: mobsfscan — publish to the Security tab where available
      id: cs_mobsfscan
      if: always() && steps.mobsfscan.outputs.collection == 'COMPLETE'
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        sarif_file: mobsfscan.sarif
        category: mobsfscan
    - name: Mobile configuration rules (Semgrep)
      id: mobile_rules
      # A mobsfscan finding must not stop the configuration rules (tests/prove_scanners_survive_enforce.py).
      if: always()
      env:
        IN_PATHS: ${{ inputs.paths }}
      shell: bash -e {0}
      run: |
        set -uo pipefail
        scope="${IN_PATHS:-.}"; [ -d "$scope" ] || scope="."
        cf() {
          echo "::error title=COLLECTION_FAILED::mobile configuration rules: $1 An absent or untrusted report is not zero findings."
          echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
          exit 1
        }
        # suppression: PRESENTATION_ONLY -- find's stderr is noise on unreadable subtrees; the EXIT
        # STATUS is checked and a failure raises COLLECTION_FAILED.
        # discards: find's stderr on unreadable or permission-denied subtrees
        # preserved_by: the exit status, which raises COLLECTION_FAILED below
        if ! hits=$(find "$scope" -maxdepth 8 -type f \( -name AndroidManifest.xml -o -name '*.gradle' \
              -o -name '*.gradle.kts' \) -not -path '*/node_modules/*' -not -path '*/.git/*' 2>/dev/null); then
          cf "the applicability survey failed."
        fi
        if [ -z "$hits" ]; then
          echo "::notice title=No Android manifests or Gradle scripts::None under '$scope'. NOT_APPLICABLE."
          { echo "collection=NOT_APPLICABLE"; echo "count=0"; } >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # THE RULES SHIP WITH THIS COMPOSITE (`$/` delivers the whole kit). Copied to the workspace
        # root under one fixed name so Semgrep's rule ids are the same on every runner and every
        # path (it prefixes ids with the config file's directory).
        rules="${GITHUB_ACTION_PATH}/mobile-config.semgrep.yml"
        [ -s "$rules" ] || cf "the kit's rule file ${rules} is absent."
        cp "$rules" .kit-mobile-config.yml
        printf 'node_modules/\n.git/\n.kit-mobile-config.yml\n' > .semgrepignore
        sg_rc=0
        semgrep scan --strict --metrics=off --config .kit-mobile-config.yml \
          --sarif --output mobile-config.sarif "$scope" > mobile-config.log 2>&1 || sg_rc=$?
        rm -f .kit-mobile-config.yml
        tail -n 15 mobile-config.log
        if [ "$sg_rc" = "3" ]; then
          echo "::error title=COLLECTION_FAILED::semgrep could not parse a file in scope (exit 3 under --strict). What it skipped was not scanned."
          echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
          exit 1
        fi
        [ "$sg_rc" -eq 0 ] || cf "semgrep exited $sg_rc under --strict."
        [ -s mobile-config.sarif ] || cf "mobile-config.sarif was not produced."
        if ! _v=$(python3 /tmp/sarif_validity.py --tool semgrep mobile-config.sarif 2>&1); then
          cf "$_v"
        fi
        # A RULE FILE THAT DID NOT LOAD IS NOT A CLEAN SCAN: every kit rule must be in the run.
        loaded=$(jq '[.runs[].tool.driver.rules[]?.id] | map(select(test("android-"))) | length' mobile-config.sarif 2>/dev/null || echo "")
        [ "${loaded:-0}" -ge 4 ] || cf "only ${loaded:-an unknown number of} of the kit's 4 rules loaded."
        # THE EFFECTIVE LEVEL (SARIF 3.27.10): the result's own, else its rule's default.
        if ! n=$(jq '[.runs[] | ((.tool.driver.rules // []) | map({key: .id, value: (.defaultConfiguration.level // "warning")}) | from_entries) as $lv | .results[] | select((.level // $lv[.ruleId] // "warning") == "error")] | length' mobile-config.sarif 2>&1); then
          cf "mobile-config.sarif is not valid SARIF ($n)."
        fi
        { echo "collection=COMPLETE"; echo "count=${n//[$'\r\n']/ }"; } >> "$GITHUB_OUTPUT"
        echo "mobile configuration rules: $(jq '[.runs[].results[]] | length' mobile-config.sarif) finding(s), $n at error"
    - name: Mobile configuration rules — enforce
      id: mobile_rules_enforce
      if: always()
      env:
        N: ${{ steps.mobile_rules.outputs.count }}
        COLLECTION: ${{ steps.mobile_rules.outputs.collection }}
        SOFT_FAIL_SAST: ${{ inputs.soft_fail_sast }}
        ADVISORY_MODE: ${{ inputs.advisory_mode }}
      shell: bash -e {0}
      run: |
        if [ "${COLLECTION:-}" = "COLLECTION_FAILED" ] || [ -z "${N:-}" ]; then
          echo "::error title=COLLECTION_FAILED::No mobile-configuration count. An ABSENT measurement is not a measurement of zero."
          exit 1
        fi
        if [ "$N" -gt 0 ] && [ "$SOFT_FAIL_SAST" != "true" ] && [ "$ADVISORY_MODE" != "true" ]; then
          echo "findings_state=FINDINGS" >> "$GITHUB_OUTPUT"
          echo "::warning title=Mobile configuration::${N} error-level finding(s). ANALYSIS=COMPLETE -- handed to the security gate, which decides by the resolved policy."
          exit 0
        fi
        echo "mobile configuration rules: ${COLLECTION}, ${N} error-level finding(s) (soft_fail=${SOFT_FAIL_SAST})"
    # BEGIN REDACT_STEP — generated by scripts/inline_normalizer.py. DO NOT EDIT HERE.
    - name: Redact credential material before upload
      if: always()
      shell: bash
      run: |
        # ORDER IS THE WHOLE CONTROL: this runs immediately before an upload, and
        # again before every later upload that follows a step which may have written
        # output -- a redactor after the upload protects nothing while looking exactly
        # like protection (N24/WP19). The sweep itself is ONE canonical script --
        # scripts/redact_all.sh, written by the `kit-scripts` job and fetched into
        # /tmp by every other -- because fourteen copies of one wrapper are how this
        # file reached 608.8 KB and stopped starting.
        #
        # A MISSING TOOL IS NOT A CLEAN RESULT. If the bundle did not arrive,
        # publication must not proceed on the strength of a scrub that never ran.
        if [ ! -s /tmp/redact_all.sh ]; then
          echo "::error title=Redaction could not be guaranteed::/tmp/redact_all.sh is absent."
          echo "The kit-scripts artifact did not reach this job, so no SARIF was scrubbed"
          echo "and none may be published. A MISSING TOOL IS NOT A CLEAN RESULT."
          exit 1
        fi
        bash /tmp/redact_all.sh
    # END REDACT_STEP
    - name: Mobile configuration rules — keep SARIF as an artifact
      if: always() && steps.mobile_rules.outputs.collection == 'COMPLETE'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: sarif-mobile-config-${{ github.run_attempt }}
        path: mobile-config.sarif
        retention-days: 30
        if-no-files-found: warn
    - name: Mobile configuration rules — publish to the Security tab where available
      id: cs_mobile_rules
      if: always() && steps.mobile_rules.outputs.collection == 'COMPLETE'
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        sarif_file: mobile-config.sarif
        category: mobile-config
    - name: Mobile — state plainly if publication degraded
      if: always() && (steps.cs_mobsfscan.outcome == 'failure' || steps.cs_mobile_rules.outcome == 'failure')
      shell: bash -e {0}
      run: |
        # Loud, never silent. An empty Security tab is indistinguishable from a clean codebase.
        echo "::warning title=Mobile: NOT published to the Security tab::Code scanning is"
        echo "unavailable here (free on public repos, otherwise GitHub Advanced Security)."
        echo "The scans SUCCEEDED and the gate still enforces on these findings."
        echo "Retrieve them from the 'sarif-mobsfscan' and 'sarif-mobile-config' artifacts."
