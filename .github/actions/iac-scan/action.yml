name: IaC scan (Checkov + Trivy config)
description: >-
  The iac-scan job's steps, moved out of reusable-security.yml unchanged (completion ledger L64,
  decomposition plan section 7 step 12) and reached through `$/`, which delivers the whole kit at
  the commit the caller pinned. The job keeps its condition, timeout, needs and Result summary;
  this composite is its FIRST step, so every `if:` below sees exactly the step history it saw
  inline. tests/prove_composite_move_equivalence.py expands this file back into the job and
  compares it with the job as it stood before the move.

# Each input carries the workflow input of the same name through unchanged. Inputs arrive as
# STRINGS; a boolean is read below only as text (env: or an interpolation), where its rendering
# is the same.
inputs:
  advisory_mode:
    description: The workflow's `advisory_mode` input (boolean), passed through unchanged.
    required: true
  fail_on_severity:
    description: The workflow's `fail_on_severity` input (string), passed through unchanged.
    required: true
  paths:
    description: The workflow's `paths` input (string), passed through unchanged.
    required: true

runs:
  using: composite
  steps:
    # BEGIN FETCH_KIT_SCRIPTS — generated by scripts/inline_normalizer.py. DO NOT EDIT HERE.
    - name: Fetch the kit's own scripts
      # A RUN-SCOPED ARTIFACT, NOT `uses: ./` and NOT a copy per call site. Why, at
      # length, in the `kit-scripts` job at the top of .github/workflows/reusable-security.yml.
      if: always()
      uses: actions/download-artifact@v8
      with:
        name: kit-scripts-${{ github.run_attempt }}
        path: /tmp
    - name: Verify the kit scripts against their pinned digest
      # A DOWNLOADED SCRIPT NOBODY VERIFIED IS A SUPPLY CHAIN STEP WITH NO INTEGRITY
      # CHECK. Why this digest and not a manifest fetched beside it: `kit-scripts`.
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        cd /tmp
        echo "77747346d57de23c8a301758499db36f89f41e3850a2495497d2983a6cb3916a  kit-scripts.sha256" | sha256sum -c -
        sha256sum -c kit-scripts.sha256
    # END FETCH_KIT_SCRIPTS
    - uses: actions/checkout@v7
    # DETECTION FIRST. `soft_fail: true` IS NOT LENIENCY AND DOES NOT LOSE A FINDING.
    #
    #   scanner exit / findings  ->  normalized result  ->  policy decision
    #                                                        advisory -> report, never block
    #                                                        blocking -> fail the gate
    #
    # It stops checkov's EXIT CODE from doubling as the gate. Every finding still lands in the
    # SARIF, in the retained artifact, in the Security tab and in the count two steps below --
    # nothing is suppressed, scoped away or downgraded. Only the CONSEQUENCE is decided
    # elsewhere, by the policy layer, which is the only layer that knows what mode the caller
    # asked for. This is the same separation sast-semgrep and sast-bandit already use.
    - name: Checkov
      uses: bridgecrewio/checkov-action@v12
      with:
        directory: ${{ inputs.paths }}
        output_format: sarif
        output_file_path: checkov.sarif
        soft_fail: true
    - name: Checkov — count findings
      if: always()
      id: checkov
      shell: bash
      run: |
        set -uo pipefail
        # checkov-action treats `output_file_path` as a DIRECTORY and writes the report inside
        # it. Pointing anything at `checkov.sarif` gets a directory, not a report.
        f=checkov.sarif/results_sarif.sarif
        # AN ABSENT REPORT IS NOT ZERO FINDINGS. This job only runs because discovery FOUND IaC
        # artifacts in scope, so a missing or unparseable report means the evidence could not be
        # collected -- which is UNDETERMINED, and must never be counted as a clean scan.
        if [ ! -s "$f" ]; then
          echo "::error title=COLLECTION_FAILED::$f was not produced."
          echo "Discovery established that IaC artifacts ARE present, so an ABSENT report is a"
          echo "collection failure, not zero findings."
          echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # THE EFFECTIVE LEVEL, NOT THE RESULT'S OWN FIELD (SARIF 2.1.0 section 3.27.10): a result's level
        # is its own `level`, else its rule's `defaultConfiguration.level`, else "warning". This
        # counted `.level // "warning"` alone; Semgrep never writes `level` on a result, so every
        # ERROR-severity finding counted 0 and this scanner could never block -- while the report,
        # which reads the rule's level, listed them as errors. tests/prove_sarif_effective_level.py.
        # VALIDITY ROWS 1-6, ON THE RUNNER, BEFORE PUBLICATION (ledger L02; PIPELINE_ORDERING 4.5):
        # results absent (did not attempt), no run, an error-level tool notification or
        # executionSuccessful false is COLLECTION_FAILED -- never a count of zero, and never
        # published as a clean scan. Per-tool profile, not a hollow-rules rule (KDEC-008 OD-2).
        if ! _v=$(python3 /tmp/sarif_validity.py --tool checkov "$f" 2>&1); then
          echo "::error title=COLLECTION_FAILED::$_v"
          echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if ! n=$(jq '[.runs[] | ((.tool.driver.rules // []) | map({key: .id, value: (.defaultConfiguration.level // "warning")}) | from_entries) as $lv | .results[] | select((.level // $lv[.ruleId] // "warning") == "error")] | length' "$f" 2>&1); then
          echo "::error title=COLLECTION_FAILED::$f is not valid SARIF."
          echo "jq said: $n"
          echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # suppression: FAILURE_ISOLATION_WITH_STATE_CAPTURE -- `total` is context for the log
        # line only. The GATE reads $n, which was produced by the checked jq call above; if that
        # one had failed this step would already have declared COLLECTION_FAILED and returned.
        # discards: a second jq invocation's error, which cannot occur once the first succeeded
        # preserved_by: $n, the error-level count the enforcement step actually reads, and the
        # preserved_by: collection=COMPLETE/COLLECTION_FAILED state emitted either way
        total=$(jq '[.runs[].results[]] | length' "$f" 2>/dev/null || echo "$n")
        echo "collection=COMPLETE" >> "$GITHUB_OUTPUT"
        echo "count=$n" >> "$GITHUB_OUTPUT"
        echo "total=$total" >> "$GITHUB_OUTPUT"
        echo "Checkov ERROR-level findings: $n (of $total result(s))"
    # THE POLICY LAYER. The ONLY step in this job permitted to decide whether truth blocks.
    #
    # iac-scan used to have no such step at all: the scanner's soft_fail was the whole policy,
    # so IaC findings could not block in ANY mode, and whether the job went red was decided by
    # whichever housekeeping step happened to fail. That is an enforcement decision taken by
    # accident, in the wrong layer, from the wrong signal.
    - name: Checkov — enforce
      if: always()
      shell: bash
      env:
        # CALLER INPUT ARRIVES AS DATA, NEVER AS SCRIPT TEXT (ledger L38).
        IN_ADVISORY_MODE: ${{ inputs.advisory_mode }}
      run: |
        set -uo pipefail
        collection='${{ steps.checkov.outputs.collection }}'
        n='${{ steps.checkov.outputs.count }}'
        advisory="${IN_ADVISORY_MODE}"
        # COLLECTION_FAILED IS NOT ZERO FINDINGS -- AND THIS STEP RUNS ON always(). Without this
        # check ${n:-0} quietly supplies the very zero the counting step refused to invent.
        if [ "$collection" = "COLLECTION_FAILED" ] || [ -z "$collection" ]; then
          echo "::error title=COLLECTION_FAILED::IaC posture could NOT be established from this run."
          echo "This is not a clean result and it is not a finding -- it is an unknown."
          if [ "$advisory" = "true" ]; then
            echo "::warning title=IaC UNDETERMINED (advisory)::Not blocked, not established."
            echo "ANALYSIS=INCOMPLETE GATE=ADVISORY"
            exit 0
          fi
          echo "ANALYSIS=INCOMPLETE GATE=FAIL"
          exit 1
        fi
        if [ -z "${n:-}" ]; then
          echo "::error title=COLLECTION_FAILED::No count was produced by the scan step."
          echo "An ABSENT measurement is not a measurement of zero."
          [ "$advisory" = "true" ] || exit 1
          exit 0
        fi
        if [ "${n:-0}" -gt 0 ] && [ "$advisory" = "true" ]; then
          # ADVISORY: THE FINDING IS REAL, REPORTED AND PERSISTED. Only the block is withheld.
          echo "::warning title=Checkov (advisory)::${n} ERROR-level IaC finding(s) were found"
          echo "and are reported in the SARIF, the artifact and the gate summary. advisory_mode"
          echo "is on, so they do not block promotion. ANALYSIS=COMPLETE GATE=ADVISORY"
          exit 0
        fi
        if [ "${n:-0}" -gt 0 ]; then
          echo "::error title=Checkov::${n} ERROR-level IaC finding(s). ANALYSIS=COMPLETE GATE=FAIL"
          exit 1
        fi
        echo "ANALYSIS=COMPLETE GATE=PASS (0 error-level finding(s), advisory_mode=$advisory)"
    # Findings must survive whether or not this repo has code scanning. Uploading to the
    # Security tab is a PUBLICATION channel, not the finding itself — free on public repos,
    # otherwise Advanced Security. Treating it as mandatory turned successful scans into
    # failed jobs on every private repo without GHAS.
    - name: Checkov — is there anything to publish?
      if: always()
      id: sarif_checkov
      shell: bash -e {0}
      run: |
        # No SARIF usually means no applicable source (gosec on a repo with no Go). That is
        # a legitimate outcome, not a failure, and previously crashed the upload step.
        if [ -s "checkov.sarif/results_sarif.sarif" ]; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
          echo "::notice title=Checkov: nothing to publish::No SARIF at 'checkov.sarif/results_sarif.sarif' — no applicable source files. Not a failure."
        fi
    # BEGIN REDACT_STEP — generated by scripts/inline_normalizer.py. DO NOT EDIT HERE.
    - name: Redact credential material before upload
      if: always()
      shell: bash
      run: |
        # ORDER IS THE WHOLE CONTROL: this runs immediately before an upload, and
        # again before every later upload that follows a step which may have written
        # output -- a redactor after the upload protects nothing while looking exactly
        # like protection (N24/WP19). The sweep itself is ONE canonical script --
        # scripts/redact_all.sh, written by the `kit-scripts` job and fetched into
        # /tmp by every other -- because fourteen copies of one wrapper are how this
        # file reached 608.8 KB and stopped starting.
        #
        # A MISSING TOOL IS NOT A CLEAN RESULT. If the bundle did not arrive,
        # publication must not proceed on the strength of a scrub that never ran.
        if [ ! -s /tmp/redact_all.sh ]; then
          echo "::error title=Redaction could not be guaranteed::/tmp/redact_all.sh is absent."
          echo "The kit-scripts artifact did not reach this job, so no SARIF was scrubbed"
          echo "and none may be published. A MISSING TOOL IS NOT A CLEAN RESULT."
          exit 1
        fi
        bash /tmp/redact_all.sh
    # END REDACT_STEP
    - name: Checkov — keep SARIF as an artifact
      if: always() && steps.sarif_checkov.outputs.exists == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: sarif-checkov-${{ github.run_attempt }}
        path: checkov.sarif/results_sarif.sarif
        retention-days: 30
        if-no-files-found: warn
    - name: Checkov — publish to the Security tab where available
      id: cs_checkov
      if: always() && steps.sarif_checkov.outputs.exists == 'true'
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: checkov.sarif/results_sarif.sarif
        category: checkov
    - name: Checkov — state plainly if publication degraded
      if: always() && steps.sarif_checkov.outputs.exists == 'true' && steps.cs_checkov.outcome != 'success'
      shell: bash -e {0}
      run: |
        # Loud, never silent. An empty Security tab is indistinguishable from a clean
        # codebase, and that ambiguity is how a control becomes false assurance.
        echo "::warning title=Checkov: NOT published to the Security tab::Code scanning is"
        echo "unavailable here (free on public repos, otherwise GitHub Advanced Security)."
        echo "The scan SUCCEEDED and the gate still enforces on these findings."
        echo "Retrieve them from the 'sarif-checkov' artifact."
    # ONE SCANNER'S VERDICT MUST NOT CANCEL ANOTHER SCANNER'S COLLECTION.
    #
    # Without always(), a Checkov finding (or, in the live run that exposed this, a crashed
    # housekeeping step) skipped Trivy config entirely -- so the job reported a Checkov failure
    # AND silently established nothing about the half of the IaC surface Trivy covers. A gate
    # decision is not a reason to stop looking.
    - name: Trivy IaC misconfig
      if: always()
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: config
        scan-ref: ${{ inputs.paths }}
        severity: ${{ inputs.fail_on_severity }}
        format: sarif
        output: trivy-iac.sarif
    # Findings must survive whether or not this repo has code scanning. Uploading to the
    # Security tab is a PUBLICATION channel, not the finding itself — free on public repos,
    # otherwise Advanced Security. Treating it as mandatory turned successful scans into
    # failed jobs on every private repo without GHAS.
    # SECOND IMPLEMENTATION OF THE CAPTURE CONTRACT. Trivy roots its URIs at the SCAN SCOPE it
    # was handed, while Checkov and Semgrep report repo-relative -- so the same file arrived with
    # two identities inside one repository. The expected-signal contract missed it because the IaC
    # signals are not tool-pinned, which is the same blind spot the Go pin exposed one layer over.
    #
    # gosec exposed the abstraction; this proves it generalizes. Verified against the real Trivy
    # SARIF from run 32151293153: `infra/main.tf` -> `tests/consumer-fixture/full/infra/main.tf`,
    # identical in form to what Checkov and Semgrep already produced.
    - name: Normalize Trivy IaC paths onto the repository
      if: always()
      env:
        # CALLER INPUT ARRIVES AS DATA, NEVER AS SCRIPT TEXT (ledger L38).
        IN_PATHS: ${{ inputs.paths }}
      shell: bash -e {0}
      run: |
        set -uo pipefail
        if [ ! -s trivy-iac.sarif ]; then
          echo "::notice title=Nothing to normalize::no trivy-iac.sarif; scanner produced no report."
          exit 0
        fi
        # A MISSING NORMALIZER IS NOT A NORMALIZED REPORT. The script arrives from the
        # run-scoped kit-scripts artifact; if it did not, paths stay module-relative and two
        # different files share one identity, which breaks annotation and correlation silently.
        if [ ! -s /tmp/normalize_sarif.py ]; then
          echo "::error title=Normalizer absent::/tmp/normalize_sarif.py did not reach this job."
          echo "Scanner paths cannot be re-rooted, and a report with the wrong paths is a report"
          echo "you cannot act on. This is not a clean result."
          exit 1
        fi
        # Read source, write destination -- never rewrite in place. Containerized scanners emit
        # root-owned files, and opening one for writing turned a misreported finding into an
        # absent one once already.
        python3 /tmp/normalize_sarif.py trivy-iac.sarif trivy-iac.sarif.norm "${IN_PATHS}"
        mv trivy-iac.sarif.norm trivy-iac.sarif

    # COUNTED AND VALIDATED BEFORE IT IS PUBLISHED (ledger L02; flagship lane report row 10).
    # This report went to the Security tab with no count and no validity check at all: a run
    # that recorded no results array, or a failed invocation, presented there as a successful
    # scan with no alerts. The findings are counted at the blocking severities and REPORTED;
    # whether they block is not decided here (ledger L17: detection is never what gets turned
    # off), but a report that establishes nothing is refused before any upload.
    - name: Trivy (IaC) — count findings
      id: trivy_iac_count
      if: always()
      env:
        FAIL_ON: ${{ inputs.fail_on_severity }}
        REPORT: trivy-iac.sarif
      shell: bash -e {0}
      run: |
        set -uo pipefail
        cf() {
          echo "::error title=COLLECTION_FAILED::$1 An absent or unreadable report is not zero findings."
          echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
          exit 1
        }
        # AN ABSENT REPORT IS NOT ZERO FINDINGS. This job runs because discovery FOUND IaC
        # artifacts in scope (the same rule the Checkov count applies two steps up).
        [ -s "$REPORT" ] || cf "$REPORT was not produced."
        # VALIDITY ROWS 1-6, ON THE RUNNER, BEFORE PUBLICATION (ledger L02; PIPELINE_ORDERING 4.5):
        # results absent (did not attempt), no run, an error-level tool notification or
        # executionSuccessful false is COLLECTION_FAILED -- never a count of zero, and never
        # published as a clean scan. Per-tool profile, not a hollow-rules rule (KDEC-008 OD-2).
        if ! _v=$(python3 /tmp/sarif_validity.py --tool trivy "$REPORT" 2>&1); then
          echo "::error title=COLLECTION_FAILED::$_v"
          echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
          exit 1
        fi
        want=",$(printf '%s' "$FAIL_ON" | tr 'a-z' 'A-Z' | tr -d ' '),"
        if ! n=$(jq --arg want "$want" '[.runs[] | ((.tool.driver.rules // []) | map({key: .id, value: ([(.properties.tags // [])[] | select(. == "CRITICAL" or . == "HIGH" or . == "MEDIUM" or . == "LOW" or . == "UNKNOWN")] | first // "UNKNOWN")}) | from_entries) as $sev | .results[] | ($sev[.ruleId] // "UNKNOWN") as $s | select($want | contains("," + $s + ","))] | length' "$REPORT" 2>&1); then
          cf "$REPORT could not be counted: $n"
        fi
        echo "collection=COMPLETE" >> "$GITHUB_OUTPUT"
        echo "count=$n" >> "$GITHUB_OUTPUT"
        echo "Trivy IaC findings at ${FAIL_ON}: $n of $(jq '[.runs[].results[]] | length' "$REPORT") reported"

    - name: Trivy (IaC) — is there anything to publish?
      if: always()
      id: sarif_trivy_iac
      shell: bash -e {0}
      run: |
        # No SARIF usually means no applicable source (gosec on a repo with no Go). That is
        # a legitimate outcome, not a failure, and previously crashed the upload step.
        if [ -s "trivy-iac.sarif" ]; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
          echo "::notice title=Trivy (IaC): nothing to publish::No SARIF at 'trivy-iac.sarif' — no applicable source files. Not a failure."
        fi
    # BEGIN REDACT_STEP — generated by scripts/inline_normalizer.py. DO NOT EDIT HERE.
    - name: Redact credential material before upload
      if: always()
      shell: bash
      run: |
        # ORDER IS THE WHOLE CONTROL: this runs immediately before an upload, and
        # again before every later upload that follows a step which may have written
        # output -- a redactor after the upload protects nothing while looking exactly
        # like protection (N24/WP19). The sweep itself is ONE canonical script --
        # scripts/redact_all.sh, written by the `kit-scripts` job and fetched into
        # /tmp by every other -- because fourteen copies of one wrapper are how this
        # file reached 608.8 KB and stopped starting.
        #
        # A MISSING TOOL IS NOT A CLEAN RESULT. If the bundle did not arrive,
        # publication must not proceed on the strength of a scrub that never ran.
        if [ ! -s /tmp/redact_all.sh ]; then
          echo "::error title=Redaction could not be guaranteed::/tmp/redact_all.sh is absent."
          echo "The kit-scripts artifact did not reach this job, so no SARIF was scrubbed"
          echo "and none may be published. A MISSING TOOL IS NOT A CLEAN RESULT."
          exit 1
        fi
        bash /tmp/redact_all.sh
    # END REDACT_STEP
    - name: Trivy (IaC) — keep SARIF as an artifact
      if: always() && steps.sarif_trivy_iac.outputs.exists == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: sarif-trivy-iac-${{ github.run_attempt }}
        path: trivy-iac.sarif
        retention-days: 30
        if-no-files-found: warn
    - name: Trivy (IaC) — publish to the Security tab where available
      id: cs_trivy_iac
      if: always() && steps.sarif_trivy_iac.outputs.exists == 'true'
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: trivy-iac.sarif
        category: trivy-iac
    - name: Trivy (IaC) — state plainly if publication degraded
      if: always() && steps.sarif_trivy_iac.outputs.exists == 'true' && steps.cs_trivy_iac.outcome != 'success'
      shell: bash -e {0}
      run: |
        # Loud, never silent. An empty Security tab is indistinguishable from a clean
        # codebase, and that ambiguity is how a control becomes false assurance.
        echo "::warning title=Trivy (IaC): NOT published to the Security tab::Code scanning is"
        echo "unavailable here (free on public repos, otherwise GitHub Advanced Security)."
        echo "The scan SUCCEEDED and the gate still enforces on these findings."
        echo "Retrieve them from the 'sarif-trivy-iac' artifact."
