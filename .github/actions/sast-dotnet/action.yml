name: SAST + deps (.NET)
description: >-
  The sast-dotnet job's steps, moved out of reusable-security.yml unchanged (completion ledger L64,
  decomposition plan section 7 step 12) and reached through `$/`, which delivers the whole kit at
  the commit the caller pinned. The job keeps its condition, timeout, needs and Result summary;
  this composite is its FIRST step, so every `if:` below sees exactly the step history it saw
  inline. tests/prove_composite_move_equivalence.py expands this file back into the job and
  compares it with the job as it stood before the move.

# Each input carries the workflow input of the same name through unchanged. Inputs arrive as
# STRINGS; a boolean is read below only as text (env: or an interpolation), where its rendering
# is the same.
inputs:
  advisory_mode:
    description: The workflow's `advisory_mode` input (boolean), passed through unchanged.
    required: true
  dotnet_version:
    description: The workflow's `dotnet_version` input (string), passed through unchanged.
    required: true
  paths:
    description: The workflow's `paths` input (string), passed through unchanged.
    required: true
  soft_fail_sast:
    description: The workflow's `soft_fail_sast` input (boolean), passed through unchanged.
    required: true

runs:
  using: composite
  steps:
    # BEGIN FETCH_KIT_SCRIPTS — generated by scripts/inline_normalizer.py. DO NOT EDIT HERE.
    - name: Fetch the kit's own scripts
      # A RUN-SCOPED ARTIFACT, NOT `uses: ./` and NOT a copy per call site. Why, at
      # length, in the `kit-scripts` job at the top of .github/workflows/reusable-security.yml.
      if: always()
      uses: actions/download-artifact@v8
      with:
        name: kit-scripts-${{ github.run_attempt }}
        path: /tmp
    - name: Verify the kit scripts against their pinned digest
      # A DOWNLOADED SCRIPT NOBODY VERIFIED IS A SUPPLY CHAIN STEP WITH NO INTEGRITY
      # CHECK. Why this digest and not a manifest fetched beside it: `kit-scripts`.
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        cd /tmp
        echo "77747346d57de23c8a301758499db36f89f41e3850a2495497d2983a6cb3916a  kit-scripts.sha256" | sha256sum -c -
        sha256sum -c kit-scripts.sha256
    # END FETCH_KIT_SCRIPTS
    - uses: actions/checkout@v7
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ inputs.dotnet_version }}
    - name: Restore
      env:
        IN_PATHS: ${{ inputs.paths }}
      shell: bash -e {0}
      run: |
        set -uo pipefail
        # ROOT ASSUMPTION, same class as Node and Go. The glob ran from the repository root
        # and ignored `paths`, so a nested solution was never restored and the dependency
        # audit below then had nothing to resolve — reporting success having checked nothing.
        scope="${IN_PATHS:-.}"; [ -d "$scope" ] || scope="."
        : > .dotnet-restore-failed.txt
        # 8 levels, the bound discovery searches (W4K-120; was 6). Deeper is declared, not absent.
        find "$scope" -maxdepth 8 \( -name '*.sln' -o -name '*.csproj' \) | sort > .dotnet-roots.txt
        n=$(wc -l < .dotnet-roots.txt)
        if [ -n "$(find "$scope" -mindepth 9 -print -quit 2>/dev/null)" ]; then
          echo "::warning title=COVERAGE_GAP - beyond depth 8::.NET projects deeper than 8 levels under '$scope' were not enumerated or scanned."
        fi
        if [ "$n" -eq 0 ]; then
          echo "::notice title=No .NET projects::No .sln or .csproj under '$scope'."
          echo "COVERAGE=NOT_APPLICABLE"
          exit 0
        fi
        echo "### .NET projects discovered ($n)" >> "$GITHUB_STEP_SUMMARY"
        while read -r proj; do
          echo "- \`$proj\`" >> "$GITHUB_STEP_SUMMARY"
          echo "restoring $proj"
          # A FAILED RESTORE IS RECORDED, NOT SWALLOWED. This was `|| true`, and the audit then
          # had no assets to read for that project -- and said nothing. The count step reads
          # this list and reports COLLECTION_FAILED: dependencies nobody resolved were not audited.
          if ! dotnet restore "$proj"; then
            echo "$proj" >> .dotnet-restore-failed.txt
            echo "::error title=Restore failed::$proj -- its dependencies cannot be audited."
          fi
        done < .dotnet-roots.txt
    - name: Vulnerable + deprecated NuGet packages
      shell: bash -e {0}
      run: |
        set -uo pipefail
        # TWO FALSE PASSES LIVED HERE, both measured (tests/prove_nuget_audit.py):
        #   1. `dotnet list package` ran from the ROOT. A project at src/App/App.csproj gives "A
        #      project or solution file could not be found", exit 1, `|| true` -- nothing audited.
        #   2. It grepped `>\s*(Critical|High)`, but the row reads `> Newtonsoft.Json 12.0.1
        #      12.0.1 High ...`: the package NAME follows `>`, so a High advisory never matched.
        # Each discovered project is now listed BY PATH, as JSON, with its exit code kept.
        echo "## .NET dependency audit" >> "$GITHUB_STEP_SUMMARY"
        rm -rf .nuget-audit; mkdir -p .nuget-audit; : > .nuget-audit/index.txt
        [ -s .dotnet-roots.txt ] || exit 0
        i=0
        while read -r proj; do
          i=$((i + 1))
          rc=0
          dotnet list "$proj" package --vulnerable --include-transitive --format json \
            > ".nuget-audit/$i.json" 2> ".nuget-audit/$i.err" || rc=$?
          printf '%s\t%s\n' "$rc" "$proj" >> .nuget-audit/index.txt
          # Deprecation is reported, never gated: a deprecated package is advice, not a CVE.
          dotnet list "$proj" package --deprecated 2>&1 | tee -a dotnet-vuln.txt
        done < .dotnet-roots.txt
    - name: NuGet audit — count
      id: nuget_count
      if: always()
      shell: bash -e {0}
      run: |
        set -uo pipefail
        # collection: COMPLETE | NOT_APPLICABLE | COLLECTION_FAILED. count: distinct Critical/
        # High (package, version, advisory). A failed restore, a non-zero list, unparseable
        # JSON or a reported `problem` is COLLECTION_FAILED -- never zero.
        python3 - <<'NUGET_PY'
        import io, json, os
        def emit(coll, n=None, why=''):
            with io.open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as o:
                o.write('collection=%s\n' % coll)
                if n is not None:
                    o.write('count=%d\n' % n)
            if coll == 'COLLECTION_FAILED':
                print('::error title=COLLECTION_FAILED::NuGet audit: %s' % why)
                raise SystemExit(1)
            print('NuGet audit: %s%s' % (coll, '' if n is None else ', %d Critical/High' % n))
            raise SystemExit(0)
        # No stale report may stand in for this run's answer: only a COMPLETE audit writes one.
        if os.path.exists('dotnet-vuln.sarif'):
            os.remove('dotnet-vuln.sarif')
        roots = []
        if os.path.isfile('.dotnet-roots.txt'):
            roots = [l.strip() for l in io.open('.dotnet-roots.txt', encoding='utf-8') if l.strip()]
        if not roots:
            emit('NOT_APPLICABLE', 0)
        failed = []
        if os.path.isfile('.dotnet-restore-failed.txt'):
            failed = [l.strip() for l in io.open('.dotnet-restore-failed.txt', encoding='utf-8') if l.strip()]
        if failed:
            emit('COLLECTION_FAILED', why='restore failed for %s' % ', '.join(failed))
        index = []
        if os.path.isfile('.nuget-audit/index.txt'):
            index = [l.rstrip('\n').split('\t', 1) for l in io.open('.nuget-audit/index.txt', encoding='utf-8') if l.strip()]
        if len(index) != len(roots):
            emit('COLLECTION_FAILED', why='%d project(s) discovered, %d audited' % (len(roots), len(index)))
        hits = set()
        # THE AUDIT'S EVIDENCE OUTLIVES THE RUNNER. It blocked and kept nothing: the report's
        # dotnet-vuln row expects dotnet-vuln.sarif, nothing wrote it, and hosted run
        # 38779814703 read the seeded NuGet advisories as MISSED while this job was red. One
        # result per counted (package, version, advisory), at the declaring project's line.
        results, rules = [], {}
        def line_of(proj, pkg):
            try:
                for n, text in enumerate(io.open(proj, encoding='utf-8-sig', errors='replace'), 1):
                    if ('"%s"' % pkg).lower() in text.lower():
                        return n
            except OSError:
                pass
            return 1
        for i, (rc, proj) in enumerate(index, 1):
            if rc != '0':
                emit('COLLECTION_FAILED', why='dotnet list exited %s for %s' % (rc, proj))
            try:
                doc = json.load(io.open('.nuget-audit/%d.json' % i, encoding='utf-8-sig'))
                projects = doc['projects']
            except (OSError, ValueError, KeyError, TypeError) as exc:
                emit('COLLECTION_FAILED', why='unreadable audit for %s (%s)' % (proj, exc))
            if doc.get('problems') or any(p.get('problems') for p in projects):
                emit('COLLECTION_FAILED', why='dotnet reported problems for %s' % proj)
            for p in projects:
                for fw in (p.get('frameworks') or []):
                    for kind in ('topLevelPackages', 'transitivePackages'):
                        for pkg in (fw.get(kind) or []):
                            for v in (pkg.get('vulnerabilities') or []):
                                if str(v.get('severity', '')).lower() in ('critical', 'high'):
                                    key = (pkg.get('id'), pkg.get('resolvedVersion'), v.get('advisoryurl'))
                                    if key in hits:
                                        continue
                                    hits.add(key)
                                    print('::warning title=Vulnerable NuGet package::%s %s %s %s' % (
                                        pkg.get('id'), pkg.get('resolvedVersion'), v.get('severity'), v.get('advisoryurl')))
                                    rid = str(v.get('advisoryurl') or 'nuget-advisory').rstrip('/').rsplit('/', 1)[-1]
                                    rules[rid] = {'id': rid, 'helpUri': v.get('advisoryurl') or '',
                                                  'shortDescription': {'text': 'Vulnerable NuGet package (%s)' % v.get('severity')}}
                                    results.append({'ruleId': rid, 'level': 'error',
                                        'message': {'text': '%s %s: %s advisory %s' % (pkg.get('id'), pkg.get('resolvedVersion'), v.get('severity'), v.get('advisoryurl'))},
                                        'locations': [{'physicalLocation': {
                                            'artifactLocation': {'uri': proj[2:] if proj.startswith('./') else proj},
                                            'region': {'startLine': line_of(proj, pkg.get('id'))}}}]})
        sarif = {'version': '2.1.0',
                 '$schema': 'https://json.schemastore.org/sarif-2.1.0.json',
                 'runs': [{'tool': {'driver': {'name': 'dotnet-vuln',
                                               'informationUri': 'https://learn.microsoft.com/dotnet/core/tools/dotnet-list-package',
                                               'rules': list(rules.values())}},
                           'invocations': [{'executionSuccessful': True}],
                           'results': results}]}
        json.dump(sarif, io.open('dotnet-vuln.sarif', 'w', encoding='utf-8'), indent=1)
        with io.open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as o:
            o.write('sarif=true\n')
        emit('COMPLETE', len(hits))
        NUGET_PY
    - name: NuGet audit — enforce
      if: always()
      env:
        N: ${{ steps.nuget_count.outputs.count }}
        COLLECTION: ${{ steps.nuget_count.outputs.collection }}
        SOFT_FAIL_SAST: ${{ inputs.soft_fail_sast }}
        ADVISORY_MODE: ${{ inputs.advisory_mode }}
      shell: bash -e {0}
      run: |
        if [ "${COLLECTION:-}" = "COLLECTION_FAILED" ] || [ -z "${N:-}" ]; then
          echo "::error title=COLLECTION_FAILED::No NuGet audit count. An ABSENT measurement is not a measurement of zero."
          exit 1
        fi
        if [ "$N" -gt 0 ] && [ "$SOFT_FAIL_SAST" != "true" ] && [ "$ADVISORY_MODE" != "true" ]; then
          echo "::error title=NuGet::${N} Critical/High vulnerable package(s). GATE=FAIL"
          exit 1
        fi
        echo "NuGet audit: ${COLLECTION}, ${N} Critical/High (soft_fail=${SOFT_FAIL_SAST})"
    # Findings must survive whether or not this repo has code scanning. Uploading to the
    # Security tab is a PUBLICATION channel, not the finding itself — free on public repos,
    # otherwise Advanced Security. Treating it as mandatory turned successful scans into
    # failed jobs on every private repo without GHAS.
    - name: Semgrep (C#)
      id: dotnet_semgrep
      # A vulnerable package fails "NuGet audit — enforce" by design; without always() that
      # skipped C# SAST entirely (tests/prove_scanners_survive_enforce.py; run 38779814703).
      if: always()
      env:
        # CALLER INPUT ARRIVES AS DATA, NEVER AS SCRIPT TEXT (ledger L38).
        IN_PATHS: ${{ inputs.paths }}
      shell: bash -e {0}
      run: |
        set -uo pipefail
        # THIS STEP DID NOT EXIST. The job installed .NET, audited NuGet packages, then
        # published `dotnet-semgrep.sarif` — a file nothing ever wrote. .NET had dependency
        # scanning and ZERO static analysis, while the job reported success every time.
        scope="${IN_PATHS}"; [ -d "$scope" ] || scope="."
        # "NONE FOUND" AND "COULD NOT LOOK" ARE DIFFERENT ANSWERS. A find that ERRORS produces
        # empty output, which read as "this language is not here", which skipped the job, which
        # reported green over code nobody scanned. Same defect discovery had; same fix.
        # suppression: PRESENTATION_ONLY -- find's stderr is noise on unreadable subtrees; the EXIT
        # STATUS is checked on the next line and a failure raises COLLECTION_FAILED rather than reading
        # as 'nothing found'.
        # discards: find's stderr, which is noise on unreadable or permission-denied subtrees
        # preserved_by: the EXIT STATUS is captured on the next line and a non-zero rc raises
        # preserved_by: COLLECTION_FAILED, so 'could not look' never reads as 'found nothing'
        if ! _hits=$(find "$scope" -name '*.cs' 2>/dev/null); then
          echo "::error title=COLLECTION_FAILED::Applicability survey failed; cannot establish scope."
          echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
          exit 1
        fi
        if [ -z "$_hits" ]; then
          echo "::notice title=No C# sources::None under '$scope'. Skipping."
          exit 0
        fi
        # PINNED (ledger L84): the version tests/prove_semgrep_rulesets.py measured.
        python3 -m pip install --quiet semgrep==1.178.0
        # SEMGREP SKIPS test/ and fixture/ DIRECTORIES BY DEFAULT.
        # That default is why every semgrep job reported success with zero findings while
        # bandit — which has no such default — found the seeded flaw in the same tree. Any
        # consumer whose code sits under a path matching semgrep's built-in ignore list gets
        # a silent, confident, empty result. Writing our own .semgrepignore replaces the
        # default entirely; the caller's scope decides what is scanned, not semgrep's guess.
        printf 'node_modules/\n.git/\n' > .semgrepignore
        # A LINE CONTINUATION FOLLOWED BY A COMMENT IS NOT A CONTINUATION.
        #
        # The `\` escapes the newline and joins the COMMENT line, so everything after `#` is
        # discarded -- taking the output flags AND "$scope" with it. The scanner then ran
        # unscoped over the whole checkout and wrote no report, while the orphaned flag line
        # became a bogus command that `|| true` swallowed. Exit 0. Job green. Nothing detected.
        # Four sites carried this; found 2026-09-02 by sibling search after the seeded Go
        # signal came back WRONG-TOOL. Comments now sit ABOVE the command, never inside it.
        #
        # suppression: EXPECTED_NEGATIVE_RESULT -- this scanner exits nonzero when it FINDS something,
        # which is not an error. Detection is separated from enforcement here; the count step downstream
        # distinguishes 'found nothing' from 'produced no report' and emits COLLECTION_FAILED for the
        # latter.
        # discards: this scanner's non-zero exit, which means FINDINGS rather than malfunction
        # preserved_by: the count step distinguishes an absent report from an empty one and emits
        # preserved_by: COLLECTION_FAILED for the former; the enforce step refuses an absent count
        # --strict turns an unparseable file into exit 3 instead of a warning and a zero
        # (PIPELINE_ORDERING 3.4; tests/prove_semgrep_strict.py). Exit 3 is COLLECTION_FAILED.
        sg_rc=0
        semgrep scan --strict --config p/csharp --config p/security-audit \
          --sarif --output dotnet-semgrep.sarif --metrics=off "$scope" || sg_rc=$?
        if [ "$sg_rc" = "3" ]; then
          echo "::error title=COLLECTION_FAILED::semgrep could not parse at least one C# file in scope (exit 3 under --strict). What it skipped was not scanned."
          echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
          exit 1
        fi
        # A PARSE FAILURE IS NOT ZERO FINDINGS.
        #
        # This was `jq ... 2>/dev/null || echo 0`, so a missing, truncated or malformed report
        # produced n=0 -- which the gate reads as CLEAN. The taxonomy already had a word for
        # exactly this (COLLECTION_FAILED: "an empty but well-formed result is indistinguishable
        # from a clean scan") while the code did the opposite. Found by auditing the class after
        # the same defect turned up in discovery, not by reading this line.
        if [ ! -s dotnet-semgrep.sarif ]; then
          echo "::error title=COLLECTION_FAILED::dotnet-semgrep.sarif was not produced."
          echo "An ABSENT report is not zero findings. Posture cannot be established from this run."
          echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
          exit 1
        fi
        # VALIDITY ROWS 1-6, ON THE RUNNER, BEFORE PUBLICATION (ledger L02; PIPELINE_ORDERING 4.5):
        # results absent (did not attempt), no run, an error-level tool notification or
        # executionSuccessful false is COLLECTION_FAILED -- never a count of zero, and never
        # published as a clean scan. Per-tool profile, not a hollow-rules rule (KDEC-008 OD-2).
        if ! _v=$(python3 /tmp/sarif_validity.py --tool semgrep dotnet-semgrep.sarif 2>&1); then
          echo "::error title=COLLECTION_FAILED::$_v"
          echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
          exit 1
        fi
        if ! n=$(jq '[.runs[].results[]] | length' dotnet-semgrep.sarif 2>&1); then
          echo "::error title=COLLECTION_FAILED::dotnet-semgrep.sarif is not valid SARIF."
          echo "jq said: $n"
          echo "A PARSE FAILURE is not zero findings."
          echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
          exit 1
        fi
        echo "count=$n" >> "$GITHUB_OUTPUT"
        echo "C# SAST findings: $n"

    - name: Semgrep (C#) — enforce
      if: always()
      env:
        # CALLER INPUT ARRIVES AS DATA, NEVER AS SCRIPT TEXT (ledger L38).
        IN_SOFT_FAIL_SAST: ${{ inputs.soft_fail_sast }}
        IN_ADVISORY_MODE: ${{ inputs.advisory_mode }}
      shell: bash -e {0}
      run: |
        n='${{ steps.dotnet_semgrep.outputs.count }}'
        # COLLECTION_FAILED IS NOT ZERO FINDINGS -- AND THIS STEP RUNS ON always().
        #
        # The counting step above correctly refuses to turn a missing or malformed report
        # into n=0, and exits non-zero. But `if: always()` means THIS step still runs, reads
        # an output that was never written, and ${n:-0} quietly supplies the very zero the
        # step above refused to invent -- announcing GATE=PASS one line after the failure was
        # detected. Each side assumed the other had handled it. Check explicitly.
        collection='${{ steps.dotnet_semgrep.outputs.collection }}'
        if [ "$collection" = "COLLECTION_FAILED" ]; then
          echo "::error title=COLLECTION_FAILED::Evidence could not be collected."
          echo "Posture CANNOT be established from this run. This is not a clean result."
          exit 1
        fi
        if [ -z "${n:-}" ]; then
          echo "::error title=COLLECTION_FAILED::No count was produced by the scan step."
          echo "An ABSENT measurement is not a measurement of zero."
          exit 1
        fi
        if [ "${n:-0}" -gt 0 ] && [ "${IN_SOFT_FAIL_SAST}" != "true" ] && [ "${IN_ADVISORY_MODE}" != "true" ]; then
          echo "::error title=Semgrep (C#)::${n} finding(s). ANALYSIS=COMPLETE GATE=FAIL"; exit 1
        fi
        echo "ANALYSIS=COMPLETE GATE=PASS (${n:-0} finding(s))"

    - name: Semgrep (C#) — is there anything to publish?
      if: always()
      id: sarif_semgrep_csharp
      shell: bash -e {0}
      run: |
        # No SARIF usually means no applicable source (gosec on a repo with no Go). That is
        # a legitimate outcome, not a failure, and previously crashed the upload step.
        if [ -s "dotnet-semgrep.sarif" ]; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
          echo "::notice title=Semgrep (C#): nothing to publish::No SARIF at 'dotnet-semgrep.sarif' — no applicable source files. Not a failure."
        fi
    # BEGIN REDACT_STEP — generated by scripts/inline_normalizer.py. DO NOT EDIT HERE.
    - name: Redact credential material before upload
      if: always()
      shell: bash
      run: |
        # ORDER IS THE WHOLE CONTROL: this runs immediately before an upload, and
        # again before every later upload that follows a step which may have written
        # output -- a redactor after the upload protects nothing while looking exactly
        # like protection (N24/WP19). The sweep itself is ONE canonical script --
        # scripts/redact_all.sh, written by the `kit-scripts` job and fetched into
        # /tmp by every other -- because fourteen copies of one wrapper are how this
        # file reached 608.8 KB and stopped starting.
        #
        # A MISSING TOOL IS NOT A CLEAN RESULT. If the bundle did not arrive,
        # publication must not proceed on the strength of a scrub that never ran.
        if [ ! -s /tmp/redact_all.sh ]; then
          echo "::error title=Redaction could not be guaranteed::/tmp/redact_all.sh is absent."
          echo "The kit-scripts artifact did not reach this job, so no SARIF was scrubbed"
          echo "and none may be published. A MISSING TOOL IS NOT A CLEAN RESULT."
          exit 1
        fi
        bash /tmp/redact_all.sh
    # END REDACT_STEP
    - name: NuGet audit — keep SARIF as an artifact
      # The report's dotnet-vuln row reads this; the consumer path's expected-vs-observed
      # assertion reads it. Kept whether or not the audit blocked.
      if: always() && steps.nuget_count.outputs.sarif == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: sarif-dotnet-vuln-${{ github.run_attempt }}
        path: dotnet-vuln.sarif
        retention-days: 30
        if-no-files-found: warn
    - name: Semgrep (C#) — keep SARIF as an artifact
      if: always() && steps.sarif_semgrep_csharp.outputs.exists == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: sarif-semgrep-csharp-${{ github.run_attempt }}
        path: dotnet-semgrep.sarif
        retention-days: 30
        if-no-files-found: warn
    - name: Semgrep (C#) — publish to the Security tab where available
      id: cs_semgrep_csharp
      if: always() && steps.sarif_semgrep_csharp.outputs.exists == 'true'
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: dotnet-semgrep.sarif
        category: semgrep-csharp
    - name: Semgrep (C#) — state plainly if publication degraded
      if: always() && steps.sarif_semgrep_csharp.outputs.exists == 'true' && steps.cs_semgrep_csharp.outcome != 'success'
      shell: bash -e {0}
      run: |
        # Loud, never silent. An empty Security tab is indistinguishable from a clean
        # codebase, and that ambiguity is how a control becomes false assurance.
        echo "::warning title=Semgrep (C#): NOT published to the Security tab::Code scanning is"
        echo "unavailable here (free on public repos, otherwise GitHub Advanced Security)."
        echo "The scan SUCCEEDED and the gate still enforces on these findings."
        echo "Retrieve them from the 'sarif-semgrep-csharp' artifact."
