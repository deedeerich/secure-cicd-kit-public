name: Validate scanners

# Crosses the rung that self-test cannot: self-test validates SHAPE, this validates BEHAVIOR.
#
# Three questions, tested SEPARATELY, because passing one says nothing about the others:
#   1. EXECUTION  — did the scanner actually run?
#   2. DETECTION  — did it find the thing the fixture deliberately seeded?
#   3. GATE       — when a finding class should block, did the workflow actually fail?
#
# (3) exists because this kit already shipped jobs that ran perfectly while being wired
# out of the gate. A scanner can work flawlessly while the control does nothing.
#
# Plus a fourth: NEGATIVE behavior. A forced tool failure must render UNKNOWN/ERROR and
# must never be indistinguishable from a clean result.

on:
  schedule:
    - cron: "0 6 * * 1"          # weekly, Monday — drift in upstream actions surfaces here
  workflow_dispatch:
    inputs:
      verbose:
        description: "Print full scanner output"
        type: boolean
        default: false
  push:
    paths:
      - ".github/workflows/reusable-security.yml"
      # Scanner job bodies and their pins live in composites since ledger L64.
      - ".github/actions/**"
      - ".github/workflows/reusable-nvd-cve.yml"
      - ".github/workflows/validate-scanners.yml"
      - "tests/**"
      - "developer-safety/hooks/**"

# Metered minutes: supersede in-flight runs of this workflow on the same ref instead of
# letting an obsolete run finish at full cost. A private repo pays for every minute.
#
# A push may supersede a push, never a dispatched or scheduled run (lane L-SG): with one group per
# ref and cancel-in-progress always on, later pushes cancelled dispatch runs 39681385412 and
# 39688249062 -- the depcheck leg's cold NVD update alone can need 32+ minutes. The event name
# splits the group, and only push and pull_request runs cancel their predecessor.
# tests/prove_validate_scanners_matrix.py M8.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write

jobs:

  # ---------------------------------------------------------------- fixture
  fixture:
    name: Build synthetic fixture
    runs-on: ubuntu-latest
    # Bounded so a stalled dependency cannot bill six hours (LM-001: unbounded execution
    # converts a dependency failure into uncontrolled cost).
    # NOT YET: a timeout still surfaces as a plain job failure. It SHOULD classify as
    # UNAVAILABLE / EXECUTION_TIMEOUT — cost is bounded here, semantics are not. See
    # docs/roadmap/FUTURE_WORK.md. Do not let this comment imply the mapping exists.
    timeout-minutes: 10
    outputs:
      signals: ${{ steps.gen.outputs.signals }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - id: gen
        run: |
          set -euo pipefail
          python tests/make_fixture.py --out fixture
          echo "signals=$(jq -c '[.[].expected_signal]|unique' fixture/EXPECTED_SIGNALS.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: fixture
          path: fixture/
          retention-days: 7

  # ------------------------------------------------------- secret detection
  # Tests the Azure rules added to developer-safety: positives must fire,
  # near-misses must NOT. Fourteen regexes are fourteen chances at a false negative
  # AND fourteen chances at a false positive.
  secret-rules:
    name: "DETECTION: Azure secret rules"
    needs: fixture
    runs-on: ubuntu-latest
    # Bounded so a stalled dependency cannot bill six hours (LM-001: unbounded execution
    # converts a dependency failure into uncontrolled cost).
    # NOT YET: a timeout still surfaces as a plain job failure. It SHOULD classify as
    # UNAVAILABLE / EXECUTION_TIMEOUT — cost is bounded here, semantics are not. See
    # docs/roadmap/FUTURE_WORK.md. Do not let this comment imply the mapping exists.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: fixture
          path: fixture
      - name: Install gitleaks
        run: |
          set -euo pipefail
          # A prior run got HTTP 503 from the release CDN. The URL and asset name are
          # correct; the delivery path is not reliable. Extract the binary from the
          # vendor container image instead — no release-asset dependency.
          IMG=zricethezav/gitleaks:v8.21.2
          docker pull -q "$IMG"
          CID=$(docker create "$IMG")
          docker cp "$CID:/usr/bin/gitleaks" ./gitleaks || docker cp "$CID:/gitleaks" ./gitleaks
          docker rm -f "$CID" >/dev/null
          sudo mv gitleaks /usr/local/bin/ && sudo chmod +x /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan fixture
        run: |
          set -uo pipefail
          gitleaks detect --no-git --source fixture \
            --config developer-safety/hooks/gitleaks-azure.toml \
            --report-format json --report-path leaks.json --exit-code 0
          echo "findings: $(jq 'length' leaks.json)"
      - name: Assert positives detected
        run: |
          set -uo pipefail
          fail=0
          for rule in azure-storage-connection-string entra-client-secret-assignment \
                      azure-devops-pat azure-shared-access-key; do
            if jq -e --arg r "$rule" 'any(.[]; .RuleID == $r)' leaks.json >/dev/null; then
              echo "  ✅ $rule"
            else
              echo "  ❌ $rule  NOT DETECTED"; fail=1
            fi
          done
          [ "$fail" = "0" ] || { echo "::error::Azure secret rules failed to detect seeded credentials."; exit 1; }
      - name: Assert NO false positives on near-misses
        run: |
          set -uo pipefail
          fp=$(jq '[.[] | select(.File | test("negative_controls"))] | length' leaks.json)
          if [ "$fp" != "0" ]; then
            echo "::error::$fp false positive(s) on documented near-misses:"
            jq '[.[] | select(.File | test("negative_controls")) | {RuleID, Match}]' leaks.json
            exit 1
          fi
          echo "  ✅ no false positives on near-misses"

  # ------------------------------------------------------- scanner behavior
  scanners:
    name: "EXEC+DETECT: ${{ matrix.probe.id }}"
    needs: fixture
    runs-on: ubuntu-latest
    # Bounded so a stalled dependency cannot bill six hours (LM-001: unbounded execution
    # converts a dependency failure into uncontrolled cost).
    # NOT YET: a timeout still surfaces as a plain job failure. It SHOULD classify as
    # UNAVAILABLE / EXECUTION_TIMEOUT — cost is bounded here, semantics are not. See
    # docs/roadmap/FUTURE_WORK.md. Do not let this comment imply the mapping exists.
    # depcheck alone gets longer: with the NVD key it builds the NVD database first.
    # 65, SIZED FROM EVIDENCE (2026-10-21). The real scan's keyed COLD update -- same
    # Dependency-Check 12.1.0, same --updateonly --data /tmp/nvd-data, no cache restored -- took
    # 32 min 03 s on 2026-08-18 (hosted run 32190300370) and 9 min 17 s on 2026-08-20 (run
    # 32382255986): the same 380k records, so the NVD API's pace alone varies about 3.5x. The cache
    # save took 4 s (116 MB) and the scan 8 s. The update here gets a 50-min budget (about 1.5x the
    # WORST measured; step limit 55) and the job 10 more for install, restore, save and scan.
    # NOT longer: run 39668863606 sat silently for its whole 45 min in the OLD design (update and
    # scan in ONE call, default data dir, OSS Index enabled) and its log showed nothing, so the
    # cause -- a slow NVD day or that design -- is unexplained. A longer limit would pay to hide
    # it. If the budget is spent again, the heartbeat shows whether the download crawled or
    # stalled, and the partial database is kept.
    timeout-minutes: ${{ matrix.probe.id == 'depcheck' && 65 || 15 }}
    # NOT continue-on-error (ledger L76, lane L-E). It was, "so a probe failing must not hide the
    # others" -- but `fail-fast: false` already keeps every leg running, and continue-on-error ALSO
    # turned a failed probe into a green run. A probe that cannot fail the run proves nothing.
    strategy:
      fail-fast: false
      matrix:
        probe:
          - id: bandit
            lang: python
          - id: semgrep
            lang: multi
          # The SHIPPED container: the image the flagship's sast-semgrep job runs, by digest. W4K-116
          # left it unprobed (L76); since lane L-SG it is the 1.178.0 image, the same release the
          # C# and Java jobs pip-install.
          - id: semgrep-container
            lang: multi
          # The same image over the seeded PHP files alone, with p/php (lane L-SG; KDEC-016).
          - id: semgrep-php
            lang: php
          - id: gosec
            lang: go
          - id: flawfinder
            lang: cpp
          - id: checkov
            lang: iac
          - id: trivy
            lang: deps
          - id: osv
            lang: deps
          - id: syft
            lang: sbom
          - id: dotnet
            lang: dotnet
          - id: depcheck
            lang: nvd
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: fixture
          path: fixture
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # ---- depcheck leg only: the NVD database, built the way reusable-nvd-cve.yml builds it ----
      # restore (complete, else partial) -> --updateonly with the key -> save complete OR partial
      # -> scan --noupdate against that database. Run 39668863606 did all of it inside one silent
      # scan call: 45 minutes of cold download, cancelled, and nothing kept for the next run.
      #
      # ITS OWN CACHE NAMESPACE (nvd-probe-*), NOT the real scan's nvd-data-*. Deliberately not
      # shared: (1) this probe validates the scanner, and a database built by the system under
      # test would let a broken update in one pass silently in the other; (2) the probe pins
      # Dependency-Check 12.1.0 while reusable-nvd-cve.yml's version is caller input, and an H2
      # database written by another release is not a safe restore; (3) a probe that starts cold in
      # its own namespace is what MEASURES the cold-update time the real scan's limit still needs.
      # (4) sharing would not warm the probe anyway: on 2026-10-21 this repository held NO
      # nvd-data-* cache (the real scan last ran 2026-08-20; unused caches are evicted after 7 days).
      # The cost is a second copy of the database (116 MB compressed, run 32382255986) in this
      # repository's cache. The version is in the key, so a bump starts cold instead of restoring
      # another release's database.
      - name: Install Dependency-Check (depcheck leg)
        if: matrix.probe.id == 'depcheck'
        run: |
          set -uo pipefail
          # The hosted image already ships a JRE and unzip. Do not make the call that hangs.
          if ! command -v java >/dev/null 2>&1 || ! command -v unzip >/dev/null 2>&1; then
            timeout 180 sudo apt-get -o DPkg::Lock::Timeout=60 update -qq || true
            timeout 300 sudo apt-get -o DPkg::Lock::Timeout=60 install -y --no-install-recommends openjdk-17-jre-headless unzip
          fi
          # The version AND digest reusable-nvd-cve.yml ships as its defaults; the two may not drift
          # (tests/prove_validate_scanners_matrix.py M9). Bump both workflows, the digest, and the
          # dc<version> in the cache keys below together. 12.2.2 (lane L-NV, 2026-10-21) over 12.1.0:
          # 12.1.1 gave the NVD HTTP client a read timeout (12.1.0 could wait on a dead response
          # forever, upstream #7418/#7437), 12.2.2 widened the reference-URL column (12.1.0 drops
          # CVE-2026-6785/6786 with "Value too long", seen in run 32382255986 and locally) and parses
          # NVD's 9-digit timestamps (#8427). Digest: Maven Central's published .sha256 for
          # dependency-check-cli-12.2.2-release.zip, equal to the GitHub asset (PGP-signed, key
          # 259A55407DD6C00299E6607EFFDE55BE73A2D1ED). 13.0.0 is not taken: its keyless update is
          # broken (upstream #8715). THE CANONICAL REPOSITORY, dependency-check/DependencyCheck: the
          # old jeremylong/DependencyCheck URL is a separate repository (created 2025-01-15, not a
          # redirect) whose releases stop at 12.1.0, and returns 404 for 12.2.2.
          VER=12.2.2
          if wget -q "https://github.com/dependency-check/DependencyCheck/releases/download/v${VER}/dependency-check-${VER}-release.zip" \
             && echo "bf07fefd81af3094c5f6850423b014df44db62ce2dbad0f79079a90df675e44a  dependency-check-${VER}-release.zip" | sha256sum -c -; then
            unzip -q "dependency-check-${VER}-release.zip" -d /opt/
            chmod +x /opt/dependency-check/bin/dependency-check.sh
          else
            # Not fatal here: the probe step reports EXEC=fail with this reason, as before.
            echo "::error title=DEPENDENCY_ACQUISITION_UNAVAILABLE::dependency-check ${VER} download or digest failed"
          fi

      - name: Restore NVD data cache (depcheck leg)
        if: matrix.probe.id == 'depcheck'
        id: nvd_cache
        uses: actions/cache/restore@v6
        with:
          path: /tmp/nvd-data
          # Keyed on run_id, so the primary key never hits; restores come through the prefixes.
          key: nvd-probe-good-${{ runner.os }}-dc12.2.2-${{ github.run_id }}-${{ github.run_attempt }}
          # ORDER MATTERS: a COMPLETE database first; a PARTIAL one only as a resume base.
          restore-keys: |
            nvd-probe-good-${{ runner.os }}-dc12.2.2-
            nvd-probe-partial-${{ runner.os }}-dc12.2.2-

      - name: Update NVD database (depcheck leg)
        if: matrix.probe.id == 'depcheck'
        id: nvd_update
        # Backstop only. The script's own budget (50 min, about 1.5x the worst measured cold
        # update of 32 min) ends the update first, so the saves run in the ordinary path; this
        # limit and the job's sit outside it.
        timeout-minutes: 55
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          RESTORED_FROM: ${{ steps.nvd_cache.outputs.cache-matched-key }}
          # An empty key means a cache MISS only when the restore step itself succeeded;
          # otherwise nothing was looked up and the start state is unknown, not cold.
          RESTORE_OUTCOME: ${{ steps.nvd_cache.outcome }}
        run: |
          set -uo pipefail
          if [ "${RESTORE_OUTCOME:-}" != "success" ]; then
            RESTORED_FROM="UNKNOWN (the cache restore step's outcome was '${RESTORE_OUTCOME:-not reported}')"
          elif [ -z "${RESTORED_FROM:-}" ]; then
            RESTORED_FROM="nothing (cold)"
          fi
          DC=/opt/dependency-check/bin/dependency-check.sh
          mkdir -p /tmp/nvd-data
          echo "NVD cache restored from: ${RESTORED_FROM}"
          du -sh /tmp/nvd-data 2>/dev/null || true
          KEY="$(printf '%s' "${NVD_API_KEY:-}" | tr -d '[:space:]')"
          if [ ! -x "$DC" ]; then
            echo "Dependency-Check is not installed; nothing to update."
            echo "keyless=true" >> "$GITHUB_OUTPUT"; echo "NVD_DB_STATE=not installed" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ -z "$KEY" ]; then
            echo "::warning title=No NVD API key::the depcheck leg scans whatever cached database exists."
            echo "keyless=true" >> "$GITHUB_OUTPUT"
            echo "NVD_DB_STATE=no key: cached database only (${RESTORED_FROM})" >> "$GITHUB_ENV"
            exit 0
          fi
          # Its SHAPE is reported, never its value.
          echo "NVD key shape: ${#NVD_API_KEY} chars as stored, ${#KEY} after removing whitespace"
          # THE DATA SOURCE (lane L-NV, 2026-10-21): the Dependency-Check project's own NVD mirror,
          # the same URL as reusable-nvd-cve.yml's nvd_datafeed_url default (M9 holds them equal).
          # WHY: the NVD API itself now delivers ~10-40 kB/s per response. Measured from a 30 MB/s
          # host: one 2000-record page took 203 s (8.15 MB) and gzip did not help; NVD's own 2.0
          # feed gave 3.7 of 25 MB in 197 s. A cold build of ~413k records (207 pages) cannot fit any
          # budget here: runs 39688249062 and 39701225219 sat at 10,000-20,000 records for 35+ min.
          # The mirror built the same database cold in 91-95 s (12.1.0 and 12.2.2, locally). With a
          # datafeed set, Dependency-Check updates from it alone (NvdApiDataSource.update) and the key
          # is unused; it stays on the command line so an emptied feed falls back to the keyed API.
          # TRUST: the mirror is published by the project whose code this runs, on the same origin as
          # the hosted suppressions it already fetches by default (hosted.suppressions.url).
          feed=https://dependency-check.github.io/DependencyCheck_Builder/nvd_cache/
          # HEARTBEAT, NEVER SILENCE. The update runs in the background under its own budget, and
          # every 60 s this prints the elapsed time and the last [INFO] line. TERM first, so the
          # JVM can close its database; KILL two minutes later only if it will not stop.
          budget_s=3000
          LOG=dc-update.log
          START=$(date +%s)
          timeout --signal=TERM --kill-after=120 "$budget_s" "$DC" --updateonly --data /tmp/nvd-data --nvdDatafeed "$feed" --nvdApiKey "$KEY" > "$LOG" 2>&1 &
          pid=$!
          while kill -0 "$pid" 2>/dev/null; do
            for _ in $(seq 1 60); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
            last="$(grep -F '[INFO]' "$LOG" | tail -1 || true)"
            [ -n "$last" ] || last="$(tail -1 "$LOG" 2>/dev/null || true)"
            echo "[heartbeat] $(( ($(date +%s) - START) / 60 )) min elapsed; last: ${last:-<no output yet>}"
          done
          # NOT `wait "$pid"; rc=$?`: GitHub runs this under `bash -e`, so a non-zero wait ENDED THE
          # STEP there (run 39701225219: "exit code 124" straight after the last heartbeat) and none
          # of the evidence below was ever printed or recorded. M10 runs this step as shipped.
          rc=0; wait "$pid" || rc=$?
          MIN=$(( ($(date +%s) - START) / 60 ))
          echo "--- warnings and errors ---"
          grep -E '^\[(ERROR|WARN)\]|Exception' "$LOG" | head -15 || true
          echo "--- last lines ---"; tail -8 "$LOG" || true
          du -sh /tmp/nvd-data 2>/dev/null || true
          if [ "$rc" -eq 0 ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
            echo "NVD_DB_STATE=complete: updated in ${MIN} min from ${RESTORED_FROM}" >> "$GITHUB_ENV"
            echo "NVD update finished in ${MIN} min (restored from: ${RESTORED_FROM})"
            echo "- NVD update finished in **${MIN} min**; restored from \`${RESTORED_FROM}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            why="exit $rc"; [ "$rc" -eq 124 ] && why="budget of $(( budget_s / 60 )) min spent"
            # THE STALL EVIDENCE, not only "INCOMPLETE": the last progress line, how many requests
            # were retried and the last one, and any HTTP status the client named. It travels in
            # NVD_DB_STATE into the probe's NOTE and the step summary. Reduced to a safe character
            # set, because the NOTE is later written into a JSON result by a heredoc.
            progress="$(grep -E '\[INFO\] (Downloaded|NVD API has|Download (Started|Complete))' "$LOG" | tail -1 || true)"
            retries="$(grep -c -F 'Retrying request' "$LOG" || true)"
            last_retry="$(grep -F 'Retrying request' "$LOG" | tail -1 || true)"
            statuses="$(grep -o -E 'Status Code: [0-9]{3}|HTTP/[0-9.]+ [0-9]{3}' "$LOG" | sort | uniq -c | tr -s ' \n' ' ' || true)"
            evidence="last progress: ${progress:-none}; retried requests: ${retries:-0}${last_retry:+ (last: $last_retry)}; HTTP statuses: ${statuses:-none named}"
            evidence="$(printf '%s' "$evidence" | tr -cd 'A-Za-z0-9 ,.:;/?=&%()_+#-' | cut -c1-400)"
            echo "--- stall evidence ---"; echo "$evidence"
            echo "::warning title=NVD update incomplete::$why after ${MIN} min. $evidence. The partial database is saved as a resume base; this run's scan is NOT a clean verdict."
            echo "NVD_DB_STATE=PARTIAL ($why after ${MIN} min; $evidence): not a clean verdict" >> "$GITHUB_ENV"
            echo "- NVD update INCOMPLETE ($why after **${MIN} min**); restored from \`${RESTORED_FROM}\`; $evidence" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Saved BEFORE the scan, so a failing scan cannot cost the database (as in the real scan).
      - name: Save NVD data cache (complete, depcheck leg)
        if: always() && matrix.probe.id == 'depcheck' && steps.nvd_update.outputs.complete == 'true'
        uses: actions/cache/save@v6
        with:
          path: /tmp/nvd-data
          key: nvd-probe-good-${{ runner.os }}-dc12.2.2-${{ github.run_id }}-${{ github.run_attempt }}

      # always(): this runs when the update spent its budget, failed, timed out or was CANCELLED
      # (job limit, or a newer push superseding this run) -- the downloaded work survives as a
      # resume base and is never restored ahead of a complete copy. As in reusable-nvd-cve.yml.
      # NOT ESTABLISHED: how much a partial base saves. Dependency-Check records its NVD
      # last-modified mark only when an update completes, so a partial base may still be
      # downloaded in full; a cold update must therefore fit the budget on its own.
      - name: Save NVD data cache (partial, resume base only, depcheck leg)
        if: always() && matrix.probe.id == 'depcheck' && steps.nvd_update.outcome != 'skipped' && steps.nvd_update.outputs.complete != 'true' && steps.nvd_update.outputs.keyless != 'true'
        uses: actions/cache/save@v6
        with:
          path: /tmp/nvd-data
          key: nvd-probe-partial-${{ runner.os }}-dc12.2.2-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Probe
        id: probe
        env:
          # As data, not script text: it also keeps this long script free of any expression, so
          # GitHub's 21,000-character expression-template limit cannot reach it (L76 grew it).
          PROBE_ID: ${{ matrix.probe.id }}
          # NVD_API_KEY no longer reaches this step: only the depcheck leg's update step uses it,
          # and the scan here runs --noupdate. (NVD_DB_STATE arrives through GITHUB_ENV.)
        run: |
          set -uo pipefail
          exec 2>&1
          ID="$PROBE_ID"
          EXEC=fail; DETECT=fail; ARTIFACT=fail; NOTE=""

          case "$ID" in
            bandit)
              pip install --quiet bandit==1.9.4
              # suppression: EXPECTED_NEGATIVE_RESULT -- this scanner exits nonzero when it FINDS something,
              # which is not an error. Detection is separated from enforcement here; the count step downstream
              # distinguishes 'found nothing' from 'produced no report' and emits COLLECTION_FAILED for the
              # latter.
              # discards: this scanner's non-zero exit, which means FINDINGS rather than malfunction
              # preserved_by: the count step distinguishes an absent report from an empty one and emits
              # preserved_by: COLLECTION_FAILED for the former; the enforce step refuses an absent count
              bandit --version; bandit -r fixture/python -f json -o out.json || true; EXEC=ok; ls -l out.json || true
              # A PARSE FAILURE IS NOT ZERO FINDINGS.
              #
              # This was `jq ... 2>/dev/null || echo 0`, so a missing, truncated or malformed report
              # produced n=0 -- which the gate reads as CLEAN. The taxonomy already had a word for
              # exactly this (COLLECTION_FAILED: "an empty but well-formed result is indistinguishable
              # from a clean scan") while the code did the opposite. Found by auditing the class after
              # the same defect turned up in discovery, not by reading this line.
              if [ ! -s out.json ]; then
                echo "::error title=COLLECTION_FAILED::out.json was not produced."
                echo "An ABSENT report is not zero findings. Posture cannot be established from this run."
                echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
                exit 1
              fi
              if ! n=$(jq '.results|length' out.json 2>&1); then
                echo "::error title=COLLECTION_FAILED::out.json is not valid SARIF."
                echo "jq said: $n"
                echo "A PARSE FAILURE is not zero findings."
                echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
                exit 1
              fi
              [ "${n:-0}" -gt 0 ] && DETECT=ok; NOTE="$n findings"
              ;;
            semgrep)
              # The SHIPPED pin (W4K-116) of the C# and Java jobs; the container is probed below.
              pip install --quiet semgrep==1.178.0
              semgrep scan --config p/default --config p/csharp --config p/java \
                --json --output out.json fixture >/dev/null 2>&1; EXEC=ok
              # A PARSE FAILURE IS NOT ZERO FINDINGS.
              #
              # This was `jq ... 2>/dev/null || echo 0`, so a missing, truncated or malformed report
              # produced n=0 -- which the gate reads as CLEAN. The taxonomy already had a word for
              # exactly this (COLLECTION_FAILED: "an empty but well-formed result is indistinguishable
              # from a clean scan") while the code did the opposite. Found by auditing the class after
              # the same defect turned up in discovery, not by reading this line.
              if [ ! -s out.json ]; then
                echo "::error title=COLLECTION_FAILED::out.json was not produced."
                echo "An ABSENT report is not zero findings. Posture cannot be established from this run."
                echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
                exit 1
              fi
              if ! n=$(jq '.results|length' out.json 2>&1); then
                echo "::error title=COLLECTION_FAILED::out.json is not valid SARIF."
                echo "jq said: $n"
                echo "A PARSE FAILURE is not zero findings."
                echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
                exit 1
              fi
              [ "${n:-0}" -gt 0 ] && DETECT=ok; NOTE="$n findings"
              ;;
            semgrep-container)
              # The image and the default rulesets the flagship's sast-semgrep job runs; the
              # flagship job scans with --strict and SARIF, this probes DETECTION on the seeded
              # fixture with the same binary. tests/prove_validate_scanners_matrix.py holds the
