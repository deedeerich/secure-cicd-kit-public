              # above. This scan runs --noupdate against that database; DC_MODE says what the
              # database was (complete, PARTIAL, or cached-only without a key).
              if [ -x /opt/dependency-check/bin/dependency-check.sh ]; then
                EXEC=ok
                DC_MODE="NVD database: ${NVD_DB_STATE:-unknown}"
                # --format SARIF is the assumption recorded as untested in VALIDATION_DEBT.
                # DETECT follows a RESULT in the SARIF, never the file existing.
                # --enableExperimental and --disableOssIndex: the arguments reusable-nvd-cve.yml
