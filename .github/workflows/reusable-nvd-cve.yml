name: "Kit: NVD CVE Scan"

# =============================================================================
# NVD API COMPLIANCE (https://nvd.nist.gov/developers)
#
# DISCLAIMER (required by NIST):
# This product uses data from the NVD API but is not endorsed or certified by the NVD.
#
# TERMS OF USE: https://nvd.nist.gov/developers/terms-of-use
# API KEY:      https://nvd.nist.gov/developers/request-an-api-key
# =============================================================================
#
# Employer-neutral CVE scanning against the public NIST National Vulnerability Database,
# via Trivy (vulnerability DB) and OWASP Dependency-Check (NVD-backed, API-key accelerated).
# Complements reusable-security.yml: that one runs Trivy for fast dependency triage; this one
# adds Dependency-Check's deeper CPE matching and a scheduled full-DB pass.
#
# Zero cloud dependencies. Reference via workflow_call.

on:
  workflow_call:
    inputs:
      github_environment:
        description: >-
          GitHub Environment supplying NVD_API_KEY. REQUIRED to use an API key at all: the key is an
          ENVIRONMENT secret, a caller job that `uses:` a reusable workflow may not declare an
          environment, and `secrets: inherit` does not carry environment secrets on its own. Without
          this the scan silently takes the un-keyed path -- which still works, but rate-limited DB
          updates take 20-40 minutes instead of minutes. Leave empty to scan without a key.
        type: string
        required: false
        default: ''
      sbom_path:
        description: >-
          Path to a CycloneDX or SPDX SBOM to re-scan against the CURRENT vulnerability database.
          Empty skips it, reported NOT_APPLICABLE.

          THIS IS WHAT CONTINUOUS REVALIDATION ACTUALLY IS. The SBOM is the durable record of
          what a build produced. Re-scanning it on a schedule finds vulnerabilities disclosed
          AFTER that build passed -- the software did not change, the database did. Zero-days
          land in NVD when they are classified, which is usually long after the artifact shipped.

          `passed when built != safe now`, and this is the input that lets anything prove the
          second half. Keep the SBOM with the deployment record; a revalidation run needs no
          source checkout at all.
        type: string
        default: ""
      image_ref:
        description: >-
          Deployed image to re-scan, ideally by DIGEST. Empty skips it, reported NOT_APPLICABLE.
          A digest is the artifact; a tag is a moving pointer and cannot be matched against a
          deployment record later.
        type: string
        default: ""
      scan_paths:
        description: "Space-separated repo-relative paths to scan. Default: whole repo."
        type: string
        required: false
        default: "."
      project_name:
        description: "Project name used in Dependency-Check reports."
        type: string
        required: false
        default: "${{ github.repository }}"
      fail_on_cvss:
        description: >-
          Fail the job when a finding at or above this CVSS score exists. Ships at 9.0 (owner
          ruling O-12: an unreachable default is a decorative gate). Above 10 never fails, and
          the posture record calls any value above 9.0 a softened gate.
        type: number
        required: false
        default: 9.0
      trivy_severities:
        description: "Trivy severities to report."
        type: string
        required: false
        default: "CRITICAL,HIGH,MEDIUM"
      trivy_fail_severities:
        description: "Trivy severities that FAIL the job. Empty string = report only."
        type: string
        required: false
        default: ""
      enable_dependency_check:
        description: "Run OWASP Dependency-Check. Slow on a cold NVD cache; consider scheduled runs only."
        type: boolean
        required: false
        default: true
      enable_trivy:
        description: "Run Trivy filesystem scan."
        type: boolean
        required: false
        default: true
      scan_dockerfiles:
        description: "Also scan any Dockerfiles found in the repo for misconfiguration."
        type: boolean
        required: false
        default: true
      dependency_check_version:
        description: "OWASP Dependency-Check release to install."
        type: string
        required: false
        # KEEP THIS CURRENT. 9.0.9 (early 2024) predates NIST retiring the legacy NVD data feeds,
        # and the first real run of this workflow failed with "the NVD returned a 403 or 404 error"
        # on database update -- the classic outdated-client symptom.
        #
        # The API key was NOT the cause. It had been tested independently against the NVD connection
        # and works. A valid key against a RETIRED ENDPOINT still returns 404: the credential
        # authenticates fine while the URL it authenticates to no longer exists. Proving the
        # credential is not proving the client can still speak the current API -- the same
        # tool-is-not-workflow distinction this kit exists to enforce, one layer down.
        #
        # So the version is a live dependency of the scan working at all, not a preference.
        #
        # 12.2.2 (lane L-NV, 2026-10-21), from 12.1.0 -- which was "upstream latest" only because the
        # download URL named jeremylong/DependencyCheck, a separate repository whose releases stop at
        # 12.1.0; the project lives at dependency-check/DependencyCheck. 12.1.1 gave the NVD client a
        # read timeout (12.1.0 could wait forever on a dead response, upstream #7418/#7437); 12.2.2
        # widened the reference-URL column (12.1.0 drops CVE-2026-6785/6786, "Value too long", run
        # 32382255986) and parses NVD's 9-digit timestamps (#8427). 13.0.0 is not taken: its keyless
        # update is broken (#8715). validate-scanners.yml probes THIS version and digest
        # (tests/prove_validate_scanners_matrix.py M9 fails if they drift).
        default: "12.2.2"
      dependency_check_sha256:
        description: >-
          SHA-256 of dependency-check-<version>-release.zip. The download is refused unless it
          matches. The default is the digest of the default version; change both together.
        type: string
        required: false
        # Maven Central's published .sha256 for dependency-check-cli-12.2.2-release.zip, equal to
        # the GitHub release asset; the asset's PGP signature verifies against key
        # 259A55407DD6C00299E6607EFFDE55BE73A2D1ED (Jeremy Long).
        default: "bf07fefd81af3094c5f6850423b014df44db62ce2dbad0f79079a90df675e44a"
      nvd_datafeed_url:
        description: >-
          Where Dependency-Check builds and refreshes its NVD database. Default: the Dependency-Check
          project's own NVD mirror, which builds the full database in about 1.5 minutes. Empty: the
          NVD API directly, with NVD_API_KEY -- which, at the NVD API's 2026-10 throughput, cannot
          finish a cold build inside this job's limit.
        type: string
        required: false
        # WHY NOT THE NVD API (lane L-NV, 2026-10-21, measured): it now delivers ~10-40 kB/s per
        # response (one 2000-record page: 203 s from a 30 MB/s host), and its own 2.0 data feeds are
        # as slow; ~413k records is 207 such pages. Keyed cold builds in validate-scanners.yml (runs
        # 39688249062, 39701225219) sat at 10,000-20,000 records for 35+ minutes. This mirror built
        # the same database in 91-95 s. With a datafeed set, Dependency-Check reads it alone and the
        # key is unused. TRUST: published by the project whose code this job runs, on the origin of
        # the hosted suppressions Dependency-Check already fetches by default.
        default: "https://dependency-check.github.io/DependencyCheck_Builder/nvd_cache/"
      python_version:
        description: "Python version used for the scan runner environment."
        type: string
        required: false
        default: "3.12"
      artifact_retention_days:
        description: "Days to retain the uploaded scan-results artifact."
        type: number
        required: false
        default: 30
      # ── GOVERNANCE OF WEAKENINGS ────────────────────────────────────────────────────────
      # A WEAKENING IS A GOVERNED EXCEPTION, NOT A BOOLEAN PREFERENCE. These four inputs are
      # where the exception is recorded. They are optional, so no existing caller breaks; a
      # caller who supplies none gets identical behaviour PLUS a record saying the weakening
      # in force is unattributed, which is the truth and was previously invisible.
      weakening_reason:
        description: >-
          Why a control on this invocation is weaker than baseline. Free text. Empty means the
          record says WEAKENING_UNATTRIBUTED and routing_result becomes DECISION_REQUIRED —
          not a failure, and not a pass: a decision nobody has made yet.
        type: string
        required: false
        default: ""
      weakening_authority:
        description: >-
          WHO decided. A role, a team, a named approver. A reason without an authority is an
          explanation, not a decision, and both are required before a weakening is attributed.
        type: string
        required: false
        default: ""
      weakening_exception_ref:
        description: >-
          Where the exception or deferral is recorded — a ticket, a disposition id, a register
          entry. Reported when present, and its ABSENCE is reported too: an exception nobody
          can find is an exception nobody can review or expire.
        type: string
        required: false
        default: ""
      weakening_expires:
        description: >-
          ISO date (YYYY-MM-DD) on which the weakening lapses. Empty means no expiry was set,
          which is reported. A past date routes to DECISION_REQUIRED — silence must never renew
          a weakening, the same mechanism disposition_type and validation_debt_state already use.
        type: string
        required: false
        default: ""
    outputs:
      # THE SAME TAXONOMY AS reusable-security. NVD has different scanner details; it does NOT get
      # a different assurance vocabulary. A caller must not have to learn a second dialect to find
      # out whether posture was established.
      assurance_state:
        description: "PASS | FINDINGS | PARTIAL | UNDETERMINED — what this run ESTABLISHED."
        value: ${{ jobs.nvd-cve-scan.outputs.assurance_state }}
      enforcement_state:
        description: "BLOCKED | ALLOWED | ADVISORY — what the workflow DID about it."
        value: ${{ jobs.nvd-cve-scan.outputs.enforcement_state }}
      undetermined:
        description: >-
          true when posture could not be established. Consumers must not read "did not block" as
          "safe" while this is true.
        value: ${{ jobs.nvd-cve-scan.outputs.undetermined }}
      evidence_artifact:
        description: "Run artifact holding the persisted evidence."
        value: ${{ jobs.nvd-cve-scan.outputs.evidence_artifact }}
      # Capability-specific metadata: ADDITIONAL fields, never a competing vocabulary.
      nvd_database_state:
        description: "UPDATED | STALE | UNAVAILABLE — NVD-specific, and NOT a substitute for assurance_state."
        value: ${{ jobs.nvd-cve-scan.outputs.nvd_database_state }}
      cache_state:
        description: "RESTORED_COMPLETE | RESTORED_PARTIAL | COLD — why this run cost what it cost."
        value: ${{ jobs.nvd-cve-scan.outputs.cache_state }}
      # ── THE CONTROL POSTURE RECORD ──────────────────────────────────────────────────────
      # WHAT THIS INVOCATION SHOULD HAVE RUN, WHAT IT ACTUALLY RAN, AND WHAT WAS WEAKENED.
      # Without these a caller who softens a control is reported identically to one that passed
      # honestly — the collapse this kit refuses everywhere else, performed at its own boundary.
      # Every value is a term from assurance-taxonomy.yaml :: control_weakening / routing_result.
      routing_result:
        description: >-
          PROCEED | PROCEED_WITH_ADVISORY | DECISION_REQUIRED | BLOCKED | EVIDENCE_UNTRUSTED.
          What should happen next. EVIDENCE_UNTRUSTED is the one that matters: a scanner that
          could not be acquired is not a decision someone owes and is emphatically not clean.
        value: ${{ jobs.nvd-cve-scan.outputs.routing_result }}
      controls_required:
        description: "Comma list of the controls this invocation should have run."
        value: ${{ jobs.nvd-cve-scan.outputs.controls_required }}
      controls_executed:
        description: "Comma list of the controls that actually ran. Never includes a skipped one."
        value: ${{ jobs.nvd-cve-scan.outputs.controls_executed }}
      controls_unavailable:
        description: >-
          Controls whose tool could not be acquired or whose evidence could not be collected.
          NOT THE SAME AS CLEAN, and not the same as a decision being owed.
        value: ${{ jobs.nvd-cve-scan.outputs.controls_unavailable }}
      controls_reduced:
        description: "Controls that ran with severity lowered, depth reduced or scope narrowed."
        value: ${{ jobs.nvd-cve-scan.outputs.controls_reduced }}
      controls_skipped:
        description: "Controls that were not run at all. Nothing looked, so nothing was established."
        value: ${{ jobs.nvd-cve-scan.outputs.controls_skipped }}
      weakenings:
        description: >-
          JSON array, one object per declared input that governs a control: input, class,
          control, baseline, value and state. The enumeration is TOTAL over the workflow's
          inputs — a hand-written list is a list that goes stale.
        value: ${{ jobs.nvd-cve-scan.outputs.weakenings }}
      weakening_attribution:
        description: >-
          WEAKENING_AT_BASELINE | WEAKENING_ATTRIBUTED | WEAKENING_UNATTRIBUTED |
          WEAKENING_EXCEPTION_EXPIRED — whether a person stands behind the weakening.
        value: ${{ jobs.nvd-cve-scan.outputs.weakening_attribution }}
      weakening_record:
        description: >-
          Reason, authority, exception reference and expiry as one compact JSON object, so a
          consumer gets the decision and its provenance together rather than four loose strings.
        value: ${{ jobs.nvd-cve-scan.outputs.weakening_record }}
    secrets:
      NVD_API_KEY:
        description: "NVD API key. Strongly recommended — without it, DB updates are heavily rate limited."
        required: false

permissions:
  contents: read
  security-events: write   # upload SARIF to code scanning

jobs:

  nvd-cve-scan:
    name: NVD CVE scan
    outputs:
      assurance_state: ${{ steps.summary.outputs.assurance_state }}
      enforcement_state: ${{ steps.summary.outputs.enforcement_state }}
      undetermined: ${{ steps.summary.outputs.undetermined }}
      evidence_artifact: ${{ steps.summary.outputs.evidence_artifact }}
      nvd_database_state: ${{ steps.summary.outputs.nvd_database_state }}
      cache_state: ${{ steps.summary.outputs.cache_state }}
      routing_result: ${{ steps.posture.outputs.routing_result }}
      # KDEC-022 item 3: AVAILABLE or UNAVAILABLE, and the check's verdict over this run's SARIF.
      kev_state: ${{ steps.posture.outputs.kev_state }}
      kev_verdict: ${{ steps.kev.outputs.kev_verdict }}
      controls_required: ${{ steps.posture.outputs.controls_required }}
      controls_executed: ${{ steps.posture.outputs.controls_executed }}
      controls_unavailable: ${{ steps.posture.outputs.controls_unavailable }}
      controls_reduced: ${{ steps.posture.outputs.controls_reduced }}
      controls_skipped: ${{ steps.posture.outputs.controls_skipped }}
      weakenings: ${{ steps.posture.outputs.weakenings }}
      weakening_attribution: ${{ steps.posture.outputs.weakening_attribution }}
      weakening_record: ${{ steps.posture.outputs.weakening_record }}
    # The environment is what makes NVD_API_KEY resolvable at all -- see the input's note.
    environment: ${{ inputs.github_environment }}
    runs-on: ubuntu-latest
    # Bounded so a stalled dependency cannot bill six hours (LM-001: unbounded execution
    # converts a dependency failure into uncontrolled cost).
    # NOT YET: a timeout still surfaces as a plain job failure. It SHOULD classify as
    # UNAVAILABLE / EXECUTION_TIMEOUT — cost is bounded here, semantics are not. See
    # docs/roadmap/FUTURE_WORK.md. Do not let this comment imply the mapping exists.
    # 60, NOT the 20 the other scanners get. First sized from documentation (a cold update of
    # 20-40 min without an NVD_API_KEY, 30+ expected).
    # MEASURED 2026-10-21 (correcting "this workflow has NEVER RUN", which was false). Two keyed
    # COLD updates on hosted runners, Dependency-Check 12.1.0, no cache restored, ~380k records:
    #   run 32382255986 (2026-08-20, main at 665028b): update 9 min 17 s, cache save 116 MB in
    #     4 s, scan 8 s, whole job 11.5 min -- SUCCESS
    #   run 32190300370 (2026-08-18): update 32 min 03 s (the NVD API's pace varies ~3.5x), after
    #     an install step that hung 23 min on apt -- since removed (the preinstalled-JRE path)
    # 60 fits the slower cold update with ~25 min to spare. Keyless runs remain unmeasured. The
    # depcheck leg of validate-scanners.yml now prints its own cold and warm update times;
    # re-size from those if they disagree.
    timeout-minutes: 60
    env:
      # Every step writes its evidence here, and "Upload scan artifacts" collects exactly this
      # directory. Referenced as $OUTDIR and defined NOWHERE until ledger L90.
      OUTDIR: nvd-scan-results
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python_version }}

      - name: Prepare output directory
        run: mkdir -p nvd-scan-results

      # ---------------------------------------------------------------- Trivy

      # TRIVY IS INSTALLED, NOT SET UP BY AN ACTION (KDEC-027): aquasecurity/trivy-action's
      # setup-trivy checks out `aquasecurity/trivy` against github.server_url, which on a GHE.com
      # tenant does not have it. Release binary from github.com, pinned by version and sha256.
      - name: Install Trivy (pinned release binary)
        id: trivy_install
        if: inputs.enable_trivy
        shell: bash
        run: |
          set -euo pipefail
          v=0.71.2
          if [ "$(trivy --version 2>/dev/null | sed -n 's/^Version: //p' | head -n 1)" != "$v" ]; then
            t="trivy_${v}_Linux-64bit.tar.gz"
            d="$(mktemp -d)"
            curl -sSfL --retry 3 --connect-timeout 20 -o "$d/$t" \
              "https://github.com/aquasecurity/trivy/releases/download/v${v}/$t"
            echo "0510e71e2fd39bf863856d499c8dc19feb4e7336546394c502a8f5cc7ab27460  $d/$t" | sha256sum -c -
            tar -xzf "$d/$t" -C "$d" trivy
            sudo install -m 0755 "$d/trivy" /usr/local/bin/trivy
            rm -rf "$d"
          fi
          trivy --version | head -n 1
          echo "TRIVY_CACHE_DIR=$RUNNER_TEMP/trivy-cache" >> "$GITHUB_ENV"
          echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Trivy database cache
        if: inputs.enable_trivy
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy-cache
          key: trivy-db-${{ runner.os }}-${{ steps.trivy_install.outputs.day }}
          restore-keys: trivy-db-${{ runner.os }}-
      - name: Trivy filesystem scan (SARIF)
        id: trivy_fs
        if: inputs.enable_trivy
        shell: bash
        env:
          # Each TRIVY_* is the option trivy-action@v0.36.0 passed for the `with:` key it replaced.
          # Its `severity:` was dropped for a SARIF (entrypoint.sh), so this reporting pass carries
          # none: every severity is reported, as it always was; the gate below applies them.
          SCAN_REF: "."
          TRIVY_FORMAT: sarif
          TRIVY_OUTPUT: nvd-scan-results/trivy-nvd.sarif
          TRIVY_EXIT_CODE: "0"          # reporting pass; gating happens below
        run: trivy fs --quiet "$SCAN_REF"

      # PUBLICATION IS NOT DETECTION. Code scanning is free on public repos and otherwise
      # Advanced Security; on a private repo without it, upload-sarif returns "Resource not
      # accessible by integration". On the first real run of this workflow that failure SKIPPED
      # EVERY REMAINING STEP -- the NVD database update, Dependency-Check itself and the
      # Dockerfile scan never ran, because a publication channel was unavailable. An unreachable
      # dashboard must never be able to cancel the scan it was going to display.
      - name: Trivy SARIF — is there anything to publish?
        if: always()
        id: pub_trivy
        run: |
          set -uo pipefail
          if [ -s nvd-scan-results/trivy-nvd.sarif ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Trivy: nothing to publish::No SARIF produced. Not a failure."
          fi

      - name: Upload Trivy SARIF
        if: always() && inputs.enable_trivy && steps.pub_trivy.outputs.publish == 'true'
        continue-on-error: true          # PUBLICATION=DEGRADED, never ANALYSIS=FAILED
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: nvd-scan-results/trivy-nvd.sarif
          category: trivy-nvd

      - name: Trivy gate
        if: inputs.enable_trivy && inputs.trivy_fail_severities != ''
        shell: bash
        env:
          SCAN_REF: "."
          TRIVY_FORMAT: table
          TRIVY_SEVERITY: ${{ inputs.trivy_fail_severities }}
          TRIVY_EXIT_CODE: "1"          # this one is the gate, and it is explicit
        run: trivy fs --quiet "$SCAN_REF"

      # ------------------------------------------------- OWASP Dependency-Check

      # RESTORE ONLY. actions/cache's combined form saves in a post-job step that DOES NOT RUN
      # WHEN THE JOB FAILS -- so a ~50-minute NVD database build was discarded because a downstream
      # analyzer exited non-zero. Every failed run then paid the full cost again, and while
      # Dependency-Check was failing the cache could never save, so the run could never get cheaper.
      # A self-sustaining expense. The save is now an explicit step below, tied to whether the
      # DATABASE was built, not to whether the job as a whole succeeded.
      - name: Restore NVD data cache
        if: inputs.enable_dependency_check
        id: nvd_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/nvd-data
          # NOTE: keyed on run_id, so the PRIMARY key never hits by design -- every restore comes
          # through the prefix restore-key, which is what lets a previous run's database warm this
          # one. (The old comment claimed "date-keyed", which this never was.)
          key: nvd-data-good-${{ runner.os }}-${{ github.run_id }}
          # ORDER MATTERS. Prefer a COMPLETE database; fall back to a partial one only as a resume
          # base, never as a basis for a clean verdict.
          restore-keys: |
            nvd-data-good-${{ runner.os }}-
            nvd-data-partial-${{ runner.os }}-

      # ROOT CAUSE, not a workaround. This step hung 26 minutes with ZERO output -- no "Get:",
      # no "Reading package lists" -- then the C/C++ analyzer install did the same thing earlier in
      # the week. A slow mirror still prints progress. Silence means `apt-get` is BLOCKING ON THE
      # DPKG LOCK, which GitHub's Ubuntu images hold at boot via unattended-upgrades. Under -qq it
      # waits silently and forever, and an outer job timeout is the only thing that ever ends it.
      # Those two hangs billed roughly 386 minutes between them.
      #
      # The deeper point: we were paying that risk for packages ALREADY ON THE IMAGE. The hosted
      # runner ships a JRE and unzip. The cheapest fix for a hang is not to make the hanging call.
      - name: Install OWASP Dependency-Check
        if: inputs.enable_dependency_check
        env:
          DC_VERSION: ${{ inputs.dependency_check_version }}   # caller input: data, not script text
          DC_SHA256: ${{ inputs.dependency_check_sha256 }}
        run: |
          set -euo pipefail

          # PRESENCE IS NOT FITNESS. `command -v java` succeeds on a Java 8 runtime, and
          # Dependency-Check 12.x requires 11+. Checking only that the binary exists is the
          # same defect this kit keeps finding elsewhere: a credential that exists but is
          # never delivered, a job that is green but ran no scanner, a tag that resolves to
          # nothing. Establish the VERSION, and say which path was taken and why.
          MIN_JAVA=11
          need_apt=false
          java_ver=""
          if command -v java >/dev/null 2>&1; then
            raw="$(java -version 2>&1 | head -1)"
            # Handles both "11.0.22" and legacy "1.8.0_402" forms.
            java_ver="$(printf '%s' "$raw" | sed -E 's/.*version "([0-9]+)\.([0-9]+).*/\1 \2/' \
                        | awk '{ if ($1 == 1) print $2; else print $1 }')"
            case "$java_ver" in
              ''|*[!0-9]*) java_ver="" ;;   # unparseable is NOT a pass
            esac
            if [ -z "$java_ver" ]; then
              echo "::warning title=Java version unreadable::could not parse. Treating as unfit."
              need_apt=true
            elif [ "$java_ver" -lt "$MIN_JAVA" ]; then
              echo "::warning title=Java too old::found $java_ver, need >= $MIN_JAVA."
              need_apt=true
            fi
          else
            need_apt=true
          fi
          command -v unzip >/dev/null 2>&1 || need_apt=true

          if [ "$need_apt" = "true" ]; then
            echo "::notice title=Installing a JRE::java missing or below $MIN_JAVA, or no unzip."
            # DPkg::Lock::Timeout makes apt FAIL rather than block forever. Without it there is no
            # bound at all: the process simply waits for a lock nobody told us about.
            for i in 1 2 3; do
              if timeout 180 sudo apt-get -o DPkg::Lock::Timeout=60 update -qq; then break; fi
              echo "::warning title=apt update blocked::attempt $i (likely dpkg lock); retrying"
              sleep $(( i * 10 ))
            done
            timeout 300 sudo apt-get -o DPkg::Lock::Timeout=60 install -y               --no-install-recommends openjdk-17-jre-headless unzip || {
                echo "::error title=DEPENDENCY_ACQUISITION_UNAVAILABLE::Could not install a JRE."
                echo "The scanner never ran. This is NOT evidence of no vulnerabilities."
                exit 1; }
          else
            echo "Using preinstalled java $java_ver and unzip -- no install attempted."
            java -version 2>&1 | head -1
          fi

          # DO NOT TEST A PROXY FOR THE TOOL. The version check above is a DIAGNOSTIC only: it
          # explains WHY we did or did not install, and produces a useful message. It is not the
          # gate, for two reasons the owner identified:
          #
          #   1. A version string can be wrong or spoofed. `java -version` is self-reported.
          #   2. More fundamentally, it is the WRONG JAVA. This kit never sets JAVA_HOME, so
          #      dependency-check.sh selects its own JVM -- honouring JAVA_HOME if present,
          #      otherwise PATH. Checking `java` proves nothing about the runtime the tool picks.
          #
          # So the gate is running the ACTUAL TOOL. If dependency-check.sh reports its version,
          # the toolchain is fit BY CONSTRUCTION -- JVM selection, classpath and all. This is the
          # same tool-is-not-a-proxy-for-the-tool rule that caught a probe proving Dependency-
          # Check the binary while the workflow around it had never run.
          #
          # ORDER (ledger L91): the tool must EXIST before it can be run. This check used to sit
          # here, before the download below, so on every fresh runner it ran a binary that was not
          # there yet and refused acquisition every time. It now runs after the unzip.
          VER="$DC_VERSION"
          # The canonical repository. jeremylong/DependencyCheck is a separate one whose releases
          # stop at 12.1.0 (404 for 12.2.2).
          URL="https://github.com/dependency-check/DependencyCheck/releases/download/v${VER}/dependency-check-${VER}-release.zip"
          # Bound each attempt AND the total. A 429/5xx from the release host is transient; an
          # unreachable host is a classification to report, never a reason to wait out the job bound.
          ok=false
          for i in 1 2 3; do
            if timeout 300 wget -q --tries=2 --timeout=60 "$URL"; then ok=true; break; fi
            echo "::warning title=Download retry::attempt $i for dependency-check ${VER} failed"
            sleep $(( i * 15 ))
          done
          if [ "$ok" != "true" ]; then
            echo "::error title=DEPENDENCY_ACQUISITION_UNAVAILABLE::Could not fetch dependency-check ${VER}."
            echo "The scanner never ran. This is NOT evidence of no vulnerabilities."
            exit 1
          fi
          # VERIFIED BYTES (ledger L84). The digest is the caller's dependency_check_sha256 (default:
          # the digest of the default version). A version bumped without its digest is refused,
          # not installed unverified.
          if ! echo "$DC_SHA256  dependency-check-${VER}-release.zip" | sha256sum -c -; then
            echo "::error title=DEPENDENCY_ACQUISITION_UNAVAILABLE::dependency-check ${VER} does not match dependency_check_sha256."
            echo "The scanner never ran. This is NOT evidence of no vulnerabilities."
            exit 1
          fi
          unzip -q "dependency-check-${VER}-release.zip" -d /opt/
          sudo chmod +x /opt/dependency-check/bin/dependency-check.sh

          echo "JAVA_HOME=${JAVA_HOME:-<unset -- dependency-check will resolve java from PATH>}"
          if ! dc_ver="$(/opt/dependency-check/bin/dependency-check.sh --version 2>&1)"; then
            echo "::error title=DEPENDENCY_ACQUISITION_UNAVAILABLE::dependency-check.sh will not run."
            echo "Output was: $dc_ver"
            echo "The scanner never ran. This is NOT evidence of no vulnerabilities."
            exit 1
          fi
          echo "  dependency-check: $dc_ver"
          echo "/opt/dependency-check/bin" >> "$GITHUB_PATH"

      - name: Warn when no NVD API key is configured
        if: inputs.enable_dependency_check && env.NVD_API_KEY == ''
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          echo "::warning title=No NVD API key::NVD_API_KEY is not set. With nvd_datafeed_url empty, \
          database updates will be heavily rate limited and may not complete within this job. \
          Request a free key at https://nvd.nist.gov/developers/request-an-api-key"

      - name: Update NVD database
        if: inputs.enable_dependency_check
        id: nvd_update
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          W_NVD_DATAFEED: ${{ inputs.nvd_datafeed_url }}   # caller input: data, not script text
        run: |
          set -euo pipefail
          mkdir -p /tmp/nvd-data
          ARGS=(--updateonly --data /tmp/nvd-data)
          # The same source the scan step below names, so its own update check reads it too.
          if [ -n "${W_NVD_DATAFEED:-}" ]; then
            ARGS+=(--nvdDatafeed "$W_NVD_DATAFEED")
            echo "Updating NVD database from the datafeed $W_NVD_DATAFEED (the API key is unused)."
          fi
          if [ -n "${NVD_API_KEY:-}" ]; then
            ARGS+=(--nvdApiKey "$NVD_API_KEY")
            echo "Updating NVD database with API key."
          else
            echo "Updating NVD database without API key (rate limited)."
          fi
          # Update failure is not silently swallowed: it downgrades the run to
          # report-only and says so, rather than scanning against a stale DB
          # while implying currency.
          #
          # `complete` is the ONLY signal the cache saves may read. This step swallows its own
          # failure on purpose (the scan still runs, marked stale), so its OUTCOME is success either
          # way -- and the good-cache save keyed on that outcome stored a STALE database under the
          # key every later run prefers (ledger L91: a poisoned good cache).
          if /opt/dependency-check/bin/dependency-check.sh "${ARGS[@]}"; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=NVD update failed::Scanning against whatever cached NVD data \
            exists. Results may be STALE — do not treat an empty result as 'no vulnerabilities'."
            echo "NVD_UPDATE_FAILED=true" >> "$GITHUB_ENV"
          fi

      # Save HERE, immediately after the build and BEFORE any analyzer can fail. An expensive
      # artifact that was correctly produced must not be destroyed by a later stage's failure --
      # the same contagion shape as a publication failure cancelling detection, one layer over.
      - name: Save NVD data cache (complete)
        if: always() && inputs.enable_dependency_check && steps.nvd_update.outputs.complete == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/nvd-data
          key: nvd-data-good-${{ runner.os }}-${{ github.run_id }}

      # TWO TIERS, ON PURPOSE. A build that dies at 80% still represents real downloaded work, and
      # throwing it away means the next run starts from zero again -- the trap that made this
      # workflow permanently expensive. But a half-written H2 database must NEVER be mistaken for a
      # complete one, or the kit scans against partial data and reports a clean result.
      #
      # So: the COMPLETE copy is what a normal run restores. The PARTIAL copy exists only as a
      # RESUME BASE -- Dependency-Check updates incrementally, so starting from partial data is
      # cheaper than starting from none. It is restored only when no complete copy exists, and any
      # run that restores it still has NVD_UPDATE_FAILED semantics available: an incomplete database
      # can never produce a "no known vulnerabilities" verdict.
      - name: Save NVD data cache (partial — resume base only)
        if: always() && inputs.enable_dependency_check && steps.nvd_update.outputs.complete != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/nvd-data
          key: nvd-data-partial-${{ runner.os }}-${{ github.run_id }}

      - name: Run OWASP Dependency-Check
        id: dc_run
        if: inputs.enable_dependency_check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          # CALLER INPUT ARRIVES AS DATA, NEVER AS SCRIPT TEXT (tests/lint_injection.py).
          W_PROJECT_NAME: ${{ inputs.project_name }}
          W_FAIL_ON_CVSS: ${{ inputs.fail_on_cvss }}
          W_SCAN_PATHS: ${{ inputs.scan_paths }}
          W_NVD_DATAFEED: ${{ inputs.nvd_datafeed_url }}
        run: |
          set -euo pipefail
          ARGS=(
            --project "$W_PROJECT_NAME"
            --format JSON --format HTML --format SARIF
            --out nvd-scan-results/dependency-check
            --data /tmp/nvd-data
            --enableExperimental
            --disableOssIndex
            --failOnCVSS "$W_FAIL_ON_CVSS"
          )
          # Unquoted on purpose: scan_paths is SPACE-SEPARATED by contract, so it is word-split
          # (and globbed) as before -- but a quote or `$( )` in it is now data, not shell.
          # shellcheck disable=SC2086
          for p in $W_SCAN_PATHS; do ARGS+=(--scan "$p"); done
          # This call checks for updates too: name the update step's source, or it would go back
          # to the slow NVD API for the delta (lane L-NV).
          if [ -n "${W_NVD_DATAFEED:-}" ]; then ARGS+=(--nvdDatafeed "$W_NVD_DATAFEED"); fi
          if [ -n "${NVD_API_KEY:-}" ]; then ARGS+=(--nvdApiKey "$NVD_API_KEY"); fi
          /opt/dependency-check/bin/dependency-check.sh "${ARGS[@]}"

      # This uploaded a report NOTHING CREATED on the first run -- "Path does not exist" --
      # because Dependency-Check had been skipped upstream. Publishing an artifact that was never
      # produced is the same defect class as a job that installs a tool and never runs it.
      - name: Dependency-Check SARIF — is there anything to publish?
        if: always()
        id: pub_dc
        run: |
          set -uo pipefail
          f=nvd-scan-results/dependency-check/dependency-check-report.sarif
          if [ -s "$f" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Dependency-Check: nothing to publish::No SARIF at '$f'."
            echo "ANALYSIS did not produce a report. This is NOT evidence of no vulnerabilities."
          fi

      - name: Upload Dependency-Check SARIF
        if: always() && inputs.enable_dependency_check && steps.pub_dc.outputs.publish == 'true'
        continue-on-error: true          # PUBLICATION=DEGRADED, never ANALYSIS=FAILED
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: nvd-scan-results/dependency-check/dependency-check-report.sarif
          category: owasp-dependency-check

      - name: State plainly if publication degraded
        if: always()
        run: |
          set -uo pipefail
          # An empty Security tab is indistinguishable from a clean codebase. Say which it is.
          if [ "${{ steps.pub_trivy.outputs.publish }}" = "true" ] ||              [ "${{ steps.pub_dc.outputs.publish }}" = "true" ]; then
            echo "PUBLICATION: attempted. If the Security tab is empty, code scanning is"
            echo "unavailable on this repository — the findings are in the uploaded artifact."
            echo "GHAS is a PRESENTATION surface, not the security engine."
          fi

      # ----------------------------------------------------------- Dockerfiles

      # always(): Dockerfile misconfiguration has NOTHING to do with dependency analysis. Without
      # this, a Dependency-Check failure silently suppressed an unrelated scanner -- one control's
      # failure quietly reducing another control's coverage, reported as a single red.
      # ── CONTINUOUS REVALIDATION ────────────────────────────────────────────────────────
      #
      # Scanning a Dockerfile is not scanning what is running. The Dockerfile says what the
      # image was MEANT to contain; the SBOM says what the build ACTUALLY produced, and the
      # image digest is the artifact itself.
      - name: Re-scan recorded SBOM against current vulnerability data
        id: sbom_reval
        if: inputs.sbom_path != ''
        # suppression: FAILURE_ISOLATION_WITH_STATE_CAPTURE -- a revalidation run must not be
        # aborted by one artifact it could not read. The other revalidation targets and the
        # source scans still need to produce their evidence, and an absent or unparseable SBOM
        # is reported as NOT ESTABLISHED rather than silently passing.
        continue-on-error: true
        env:
          SBOM_PATH: ${{ inputs.sbom_path }}   # caller input: data, not script text
        run: |
          set -uo pipefail
          # $OUTDIR is set at JOB level (ledger L90). It was referenced here and defined nowhere,
          # so under set -u this step died before scanning, and continue-on-error hid it.
          if [ ! -s "$SBOM_PATH" ]; then
            echo "::warning title=SBOM absent::$SBOM_PATH is missing or empty."
            echo "Revalidation state: NOT ESTABLISHED. This is not a clean result."
            exit 0
          fi
          # suppression: FAILURE_ISOLATION_WITH_STATE_CAPTURE -- a non-zero exit here means
          # findings were present, which is the gate's verdict to make and not this step's.
          # The SARIF is produced and published either way; its ABSENCE is what the posture
          # record reads as "did not run".
          trivy sbom --format sarif --output "$OUTDIR/trivy-sbom-revalidation.sarif" "$SBOM_PATH" || true
          n=$(jq '[.runs[].results[]] | length' "$OUTDIR/trivy-sbom-revalidation.sarif" 2>/dev/null || echo "")
          {
            echo ""
            echo "### SBOM revalidation"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| SBOM | \`$SBOM_PATH\` |"
            echo "| Findings against CURRENT data | ${n:-NOT ESTABLISHED -- no readable SARIF} |"
            echo ""
            echo "The software did not change; the vulnerability database did. A finding here is"
            echo "a vulnerability disclosed AFTER the build that produced this SBOM passed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Re-scan deployed image
        id: image_reval
        if: inputs.image_ref != ''
        # suppression: FAILURE_ISOLATION_WITH_STATE_CAPTURE -- a registry that is unreachable at
        # 05:00 must not delete the rest of the run's evidence. Unreachable is reported; it is
        # not the same as scanned-and-clean.
        continue-on-error: true
        env:
          IMAGE_REF: ${{ inputs.image_ref }}   # caller input: data, not script text
        run: |
          set -uo pipefail
          # suppression: FAILURE_ISOLATION_WITH_STATE_CAPTURE -- same reason as above; findings
          # are the gate's decision, and the report is produced regardless.
          trivy image --format sarif --output "$OUTDIR/trivy-image-revalidation.sarif" "$IMAGE_REF" || true
          {
            echo ""
            echo "### Deployed image revalidation"
            echo ""
            echo "| Image | \`$IMAGE_REF\` |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          case "$IMAGE_REF" in
            *@sha256:*) : ;;
            *) echo "::warning title=Image referenced by tag::A tag is a moving pointer. This"
               echo "result cannot be matched against a deployment record later. Prefer a digest." ;;
          esac

      - name: Scan Dockerfiles for misconfiguration
        id: dockerfile
        if: always() && inputs.scan_dockerfiles
        run: |
          set -euo pipefail
          # NOT `find ... | grep -q .`, and the reason is a race, not a style preference.
          #
          # grep -q exits on the FIRST match. If find still has matches to write, it takes SIGPIPE
          # and the pipeline reports 141 under pipefail. This branch is `if ! <pipeline>`, so a
          # SIGPIPE would invert to "no Dockerfiles found" and SILENTLY SKIP container
          # misconfiguration scanning on a repository that demonstrably has Dockerfiles. That is a
          # false negative in a security control, produced by an unrelated timing accident.
          #
          # HONESTY ABOUT EVIDENCE: this was NOT reproduced here. The sibling construct in the
          # discovery job reproduced at 4/30 runs on identical inputs, so the race is real but
          # intermittent, and absence of a local repro is not absence of the defect -- it is a
          # sampling result. The construct is unsound whether or not it has fired yet.
          #
          # -print -quit is find's own early exit: it stops walking itself, so there is no second
          # writer and no signal. Capture, then test. No pipe, no race, no inverted branch.
          first_dockerfile="$(find . -name 'Dockerfile*' -not -path './.git/*' -print -quit)"
          if [ -z "$first_dockerfile" ]; then
            echo "No Dockerfiles found; skipping."
            exit 0
          fi
          # Pinned (ledger L84): release v0.71.2, verified against a digest recorded in this file --
          # never `main`, never `latest`. Bump the version and the digest together.
          t=trivy_0.71.2_Linux-64bit.tar.gz
          curl -sSfLO "https://github.com/aquasecurity/trivy/releases/download/v0.71.2/$t"
          echo "0510e71e2fd39bf863856d499c8dc19feb4e7336546394c502a8f5cc7ab27460  $t" | sha256sum -c -
          tar -xzf "$t" trivy && sudo mv trivy /usr/local/bin/ && rm -f "$t"
          trivy config --format table --exit-code 0 . | tee nvd-scan-results/trivy-dockerfile.txt

      # KNOWN EXPLOITED IN THE WILD BLOCKS HERE TOO (KDEC-022 item 3). This path has no report job
      # and no policy step, so the check reads the CVEs straight from its own SARIF and honours no
      # exception: a CVE on the CISA KEV catalog routes this run BLOCKED (the posture step below).
      # An unreadable catalog is kev_state UNAVAILABLE -- visible, never a pass.
      - name: Check every CVE found against the CISA KEV catalog
        id: kev
        if: always()
        uses: $/.github/actions/known-exploited
        with:
          sarif: >-
            nvd-scan-results/trivy-nvd.sarif nvd-scan-results/dependency-check/dependency-check-report.sarif
            nvd-scan-results/trivy-sbom-revalidation.sarif nvd-scan-results/trivy-image-revalidation.sarif
          sarif-job: nvd-cve-scan

      # --------------------------------------------------------------- Results

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nvd-scan-results
          path: nvd-scan-results/
          retention-days: ${{ inputs.artifact_retention_days }}

      - name: Summary
        id: summary
        if: always()
        env:
          # CALLER INPUT ARRIVES AS DATA, NEVER AS SCRIPT TEXT (tests/lint_injection.py). These
          # two decide whether this run could block anything at all, and they are PRINTED into
          # the summary -- a value interpolated into the script would truncate at the first
          # quote and could be read as shell.
          W_FAIL_ON_CVSS: ${{ inputs.fail_on_cvss }}
          W_TRIVY_FAIL_SEVERITIES: ${{ inputs.trivy_fail_severities }}
          W_SCAN_PATHS: ${{ inputs.scan_paths }}
          # WHAT ACTUALLY RAN (ledger L91). Each scanner's own step outcome, read here, because
          # the posture record used to derive "executed" from the INPUTS -- a crashed scanner was
          # reported as having run.
          ENABLE_TRIVY: ${{ inputs.enable_trivy }}
          ENABLE_DC: ${{ inputs.enable_dependency_check }}
          ENABLE_DOCKERFILE: ${{ inputs.scan_dockerfiles }}
          TRIVY_OUTCOME: ${{ steps.trivy_fs.outcome }}
          DC_OUTCOME: ${{ steps.dc_run.outcome }}
          DOCKERFILE_OUTCOME: ${{ steps.dockerfile.outcome }}
          SBOM_REQUESTED: ${{ inputs.sbom_path != '' }}
          IMAGE_REQUESTED: ${{ inputs.image_ref != '' }}
        run: |
          # EMIT THE CALLER CONTRACT. Same taxonomy as reusable-security -- a consumer must
          # not have to learn a second dialect to discover whether posture was established.
          # NVD-specific facts (database freshness, cache) are ADDITIONAL fields, never a
          # competing vocabulary.
          #
          # ASSURANCE IS DERIVED FROM THE EVIDENCE, not from the inputs. A scanner is COMPLETE when
          # its report exists and parses (Dependency-Check also needs a database that updated --
          # a stale one cannot establish "no known vulnerabilities"). Then:
          #   no enabled scanner complete       -> UNDETERMINED
          #   some enabled scanner incomplete   -> PARTIAL
          #   all complete, any result          -> FINDINGS
          #   all complete, zero results        -> PASS
          # It used to be PASS or UNDETERMINED only, so findings read as PASS.
          R=nvd-scan-results
          enabled=0; done_=0; found=0; unav=""
          # Empty output = absent or unparseable. `|| true` because this step runs under `bash -e`,
          # where a failed command substitution would kill the step that reports the failure.
          results() { jq '[.runs[]?.results[]?] | length' "$1" 2>/dev/null || true; }
          if [ "$ENABLE_TRIVY" = true ]; then
            enabled=$((enabled+1))
            n="$(results "$R/trivy-nvd.sarif")"
            if [ "$TRIVY_OUTCOME" = success ] && [ -n "$n" ]; then
              done_=$((done_+1)); found=$((found+n))
            else unav="$unav,nvd-trivy"; fi
          fi
          if [ "$ENABLE_DC" = true ]; then
            enabled=$((enabled+1))
            n="$(results "$R/dependency-check/dependency-check-report.sarif")"
            # Dependency-Check exits non-zero when failOnCVSS trips, so a REPORT, not the outcome,
            # is what says it ran.
            if [ -n "$n" ] && [ "${NVD_UPDATE_FAILED:-false}" != true ]; then
              done_=$((done_+1)); found=$((found+n))
            else unav="$unav,nvd-dependency-check"; fi
          fi
          if [ "$ENABLE_DOCKERFILE" = true ]; then
            enabled=$((enabled+1))
            if [ "$DOCKERFILE_OUTCOME" = success ]; then done_=$((done_+1))
            else unav="$unav,nvd-dockerfile"; fi
          fi
          if [ "$SBOM_REQUESTED" = true ] && [ -z "$(results "$R/trivy-sbom-revalidation.sarif")" ]; then
            unav="$unav,nvd-sbom-revalidation"
          fi
          if [ "$IMAGE_REQUESTED" = true ] && [ -z "$(results "$R/trivy-image-revalidation.sarif")" ]; then
            unav="$unav,nvd-image-revalidation"
          fi
          if [ "$done_" -eq 0 ]; then state=UNDETERMINED
          elif [ "$done_" -lt "$enabled" ]; then state=PARTIAL
          elif [ "$found" -gt 0 ]; then state=FINDINGS
          else state=PASS; fi
          und=false
          case "$state" in UNDETERMINED|PARTIAL) und=true ;; esac
          emit() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          emit unavailable "${unav#,}"
          emit findings_count "$found"
          emit undetermined "$und"
          emit evidence_artifact "nvd-scan-results"
          if [ "${NVD_UPDATE_FAILED:-false}" = "true" ]; then
            emit nvd_database_state STALE
          else
            emit nvd_database_state UPDATED
          fi
          emit cache_state "${NVD_CACHE_STATE:-COLD}"
          # UNDETERMINED is never PASS. A stale database cannot establish 'no known
          # vulnerabilities' -- that was the original defect this workflow was rebuilt to fix.
          emit assurance_state "$state"
          # fail_on_cvss ships at 9.0 (owner ruling O-12, 2026-10-16/21): the gate can block by
          # default. A value above 10 is unreachable and makes this workflow report only.
          # NUMERIC, NOT `-le`: `[ 9.0 -le 10 ]` is an error, and an error here read as "cannot
          # block" -- a 9.0 threshold reported ALLOWED (tests/prove_nvd_cvss_default.py N2).
          cvss_can_block() {
            awk -v v="$1" 'BEGIN { exit !(v ~ /^[0-9]+([.][0-9]+)?$/ && v + 0 <= 10) }'
          }
          if cvss_can_block "$W_FAIL_ON_CVSS"; then
            emit enforcement_state BLOCKED
          else
            emit enforcement_state ALLOWED
          fi

          {
            echo "### NVD CVE scan"
            echo ""
            # THE ADVISORY POSTURE IS STATED BEFORE THE RESULTS, NOT AFTER THEM.
            #
            # A `fail_on_cvss` above 10 cannot be reached -- CVSS maxes at 10 -- and
            # `trivy_fail_severities: ""` names no severity to fail on. The CVSS default is 9.0
            # (O-12), so the banner below appears only when a caller raised it past 10 AND left
            # the Trivy list at its empty default. But a run that REPORTS while a reader assumes it
            # ENFORCES is worse than either posture honestly declared, and the only thing that
            # previously said so was a posture table three sections further down, which is
            # exactly where a reader stops looking once the top of the summary looks green.
            #
            # Changing these defaults is an interface version with migration guidance. Saying
            # what they mean is not, and it is owed on every run.
            _blocks=0
            if cvss_can_block "${W_FAIL_ON_CVSS:-11}"; then _blocks=1; fi
            if [ -n "${W_TRIVY_FAIL_SEVERITIES:-}" ]; then _blocks=1; fi
            if [ "$_blocks" -eq 0 ]; then
              echo "> ## THIS RUN BLOCKED NOTHING, BY CONFIGURATION"
              echo ">"
              echo "> \`fail_on_cvss: ${W_FAIL_ON_CVSS}\` — CVSS maxes at 10, so no score can reach this."
              echo "> \`trivy_fail_severities: \"${W_TRIVY_FAIL_SEVERITIES}\"\` — empty names no severity to fail on."
              echo ">"
              echo "> Every finding below was REPORTED and PERSISTED. None of them could have"
              echo "> stopped anything. **A green result here is the absence of a gate, not the"
              echo "> absence of risk.** To enforce, set \`fail_on_cvss\` to 9 or lower and give"
              echo "> \`trivy_fail_severities\` a value such as \`CRITICAL,HIGH\`."
              echo ""
            fi
            if [ "${NVD_UPDATE_FAILED:-false}" = "true" ]; then
              echo "⚠️ **NVD database update failed — results may be stale.**"
              echo "An empty result set here does NOT establish 'no known vulnerabilities'."
              echo ""
            fi
            echo "| Scanner | Ran |"
            echo "|---|---|"
            echo "| Trivy (fs) | $ENABLE_TRIVY |"
            echo "| OWASP Dependency-Check | $ENABLE_DC |"
            echo "| Dockerfile config | $ENABLE_DOCKERFILE |"
            echo ""
            echo "Paths scanned: \`$W_SCAN_PATHS\`"
            echo ""
            echo "_This product uses data from the NVD API but is not endorsed or certified by the NVD._"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── CONTROL POSTURE RECORD ────────────────────────────────────────────────────────────
      #
      # A WEAKENING IS A GOVERNED EXCEPTION, NOT A BOOLEAN PREFERENCE.
      #
      # Before this step existed a caller could switch a scanner off, empty the failing-severity
      # list, or leave the CVSS gate at "never fail", and the run was reported exactly like one
      # that passed honestly. Nothing named the weakening in the summary, in an output, or in an
      # annotation. That is the collapse this kit refuses everywhere else, arriving at its own
      # front door: `configured` is not `effective`, and an unrecorded weakening is
      # indistinguishable from a clean result.
      #
      # THE ENUMERATION IS TOTAL OVER THE WORKFLOW'S OWN INPUTS. Every declared input carries
      # exactly one `control_weakening` class below, and tests/check_weakening_record.py fails the
      # build when an input exists without one — because a hand-written list of weakenings is a
      # list that goes stale, and a stale list reports clean on a narrower denominator.
      #
      # Vocabulary: assurance-taxonomy.yaml :: control_weakening, routing_result.
      - name: Control posture — required, executed, unavailable, reduced, skipped, and who decided
        id: posture
        if: always()
        env:
          # CALLER INPUT ARRIVES AS DATA, NEVER AS SCRIPT TEXT (tests/lint_injection.py). Every
          # value here is compared, printed and emitted; none of it is ever parsed as shell.
          W_SBOM_PATH: ${{ inputs.sbom_path }}
          W_IMAGE_REF: ${{ inputs.image_ref }}
          W_SCAN_PATHS: ${{ inputs.scan_paths }}
          W_FAIL_ON_CVSS: ${{ inputs.fail_on_cvss }}
          W_TRIVY_SEVERITIES: ${{ inputs.trivy_severities }}
          W_TRIVY_FAIL_SEVERITIES: ${{ inputs.trivy_fail_severities }}
          W_ENABLE_DEPENDENCY_CHECK: ${{ inputs.enable_dependency_check }}
          W_ENABLE_TRIVY: ${{ inputs.enable_trivy }}
          W_SCAN_DOCKERFILES: ${{ inputs.scan_dockerfiles }}
          W_WEAKENING_REASON: ${{ inputs.weakening_reason }}
          W_WEAKENING_AUTHORITY: ${{ inputs.weakening_authority }}
          W_WEAKENING_EXCEPTION_REF: ${{ inputs.weakening_exception_ref }}
          W_WEAKENING_EXPIRES: ${{ inputs.weakening_expires }}
          JOB_STATUS: ${{ job.status }}
          SUM_UNAVAILABLE: ${{ steps.summary.outputs.unavailable }}
          SUM_STATE: ${{ steps.summary.outputs.assurance_state }}
          # KDEC-022 item 3: the known-exploited check over this run's SARIF.
          K_STATE: ${{ steps.kev.outputs.kev_state }}
          K_VERDICT: ${{ steps.kev.outputs.kev_verdict }}
          K_BLOCKING: ${{ steps.kev.outputs.kev_blocking }}
        run: |
          set -u
          req=""; exe=""; skp=""; red=""; wk=""; dead=""; inforce=0; badclass=0

          # AT BASELINE MEANS "AS STRONG AS THIS KIT SHIPS IT", NOT "AS STRONG AS IT COULD BE".
          # Where the shipped default IS the weak side, the baseline is declared at the strong
          # value and the default run therefore records a weakening. That is the honest reading
          # and it is the whole point: this workflow blocks nothing by default, and until now
          # nothing said so.
          #   NONEMPTY  at baseline when any value was supplied
          #   max:N     at baseline when the number is N or below
          #   literal   at baseline on exact equality
          at_baseline() {
            case "$2" in
              NONEMPTY) [ -n "$1" ] ;;
              # Numeric, so a decimal is a number: `[ 9.0 -le 9 ]` is a shell ERROR, and the
              # shipped 9.0 default read as a weakening of itself (prove_nvd_cvss_default N3).
              max:*)    awk -v v="$1" -v m="${2#max:}" \
                          'BEGIN { exit !(v ~ /^[0-9]+([.][0-9]+)?$/ && v + 0 <= m + 0) }' ;;
              *)        [ "$1" = "$2" ] ;;
            esac
          }

          # posture <input> <control_weakening class> <baseline> <control> "<value>"
          posture() {
            n="$1"; cls="$2"; base="$3"; ctl="$4"; val="${5-}"; st=WEAKENING_AT_BASELINE
            case "$cls" in
              NOT_A_CONTROL_SURFACE|EXCEPTION_ATTRIBUTION)
                return 0 ;;
              CONTROL_SURFACE_DEAD)
                at_baseline "$val" "$base" || dead="$dead,$n" ;;
              TARGET_NOT_SUPPLIED)
                # Skipped because the caller supplied no target, which the kit cannot invent.
                # Distinct from CONTROL_DISABLED and deliberately NOT counted as a weakening.
                req="$req,$ctl"
                if at_baseline "$val" "$base"; then exe="$exe,$ctl"; else skp="$skp,$ctl"; fi ;;
              CONTROL_DISABLED)
                req="$req,$ctl"
                if at_baseline "$val" "$base"; then
                  exe="$exe,$ctl"
                else
                  st=WEAKENING_IN_FORCE; skp="$skp,$ctl"; inforce=$((inforce+1))
                fi ;;
              GATE_SOFTENED)
                # The control still runs and still reports. Only the block is withheld — which
                # is why it lands in reduced and never in skipped.
                req="$req,$ctl"; exe="$exe,$ctl"
                at_baseline "$val" "$base" || {
                  st=WEAKENING_IN_FORCE; red="$red,$ctl"; inforce=$((inforce+1)); } ;;
              SCOPE_NARROWED|SEVERITY_RAISED|DEPTH_REDUCED)
                # Direction is NOT established by a string comparison. Different is not provably
                # weaker, and calling it equivalent to baseline would be the silence this record
                # exists to end — so it is reported as owing a decision.
                req="$req,$ctl"; exe="$exe,$ctl"
                at_baseline "$val" "$base" || {
                  st=CONTROL_RECONFIGURED; red="$red,$ctl"; inforce=$((inforce+1)); } ;;
              *)
                echo "::error title=Unregistered control_weakening class::$cls on input $n is not"
                echo "a term in assurance-taxonomy.yaml. The posture record cannot be trusted."
                badclass=1; return 0 ;;
            esac
            wk="$wk,{\"input\":\"$n\",\"class\":\"$cls\",\"control\":\"$ctl\",\"baseline\":\"$base\",\"value\":\"$val\",\"state\":\"$st\"}"
          }

          posture github_environment        NOT_A_CONTROL_SURFACE - -
          posture project_name              NOT_A_CONTROL_SURFACE - -
          posture python_version            NOT_A_CONTROL_SURFACE - -
          posture artifact_retention_days   NOT_A_CONTROL_SURFACE - -
          # Tool CURRENCY, not control strength. An outdated client fails acquisition and lands in
          # controls_unavailable at run time; assurance-taxonomy.yaml :: toolchain_currency owns it.
          posture dependency_check_version  NOT_A_CONTROL_SURFACE - -
          # An integrity pin on the download, not a strength setting: a wrong value REFUSES the
          # install (controls_unavailable), it never softens a control.
          posture dependency_check_sha256   NOT_A_CONTROL_SURFACE - -
          # The database's SOURCE, not a strength setting: an unreachable or failing source fails
          # the update (NVD_UPDATE_FAILED -> controls_unavailable). NOT ESTABLISHED: this record does
          # not check how fresh a reachable source is (lane L-NV).
          posture nvd_datafeed_url          NOT_A_CONTROL_SURFACE - -
          posture sbom_path                TARGET_NOT_SUPPLIED  NONEMPTY               nvd-sbom-revalidation   "$W_SBOM_PATH"
          posture image_ref                 TARGET_NOT_SUPPLIED  NONEMPTY               nvd-image-revalidation  "$W_IMAGE_REF"
          posture scan_paths                SCOPE_NARROWED       "."                    nvd-trivy               "$W_SCAN_PATHS"
          posture fail_on_cvss              GATE_SOFTENED        max:9.0                nvd-dependency-check    "$W_FAIL_ON_CVSS"
          posture trivy_severities          SEVERITY_RAISED      "CRITICAL,HIGH,MEDIUM" nvd-trivy               "$W_TRIVY_SEVERITIES"
          posture trivy_fail_severities     GATE_SOFTENED        NONEMPTY               nvd-trivy               "$W_TRIVY_FAIL_SEVERITIES"
          posture enable_dependency_check   CONTROL_DISABLED     true                   nvd-dependency-check    "$W_ENABLE_DEPENDENCY_CHECK"
          posture enable_trivy              CONTROL_DISABLED     true                   nvd-trivy               "$W_ENABLE_TRIVY"
          posture scan_dockerfiles          CONTROL_DISABLED     true                   nvd-dockerfile          "$W_SCAN_DOCKERFILES"
          posture weakening_reason          EXCEPTION_ATTRIBUTION - -
          posture weakening_authority       EXCEPTION_ATTRIBUTION - -
          posture weakening_exception_ref   EXCEPTION_ATTRIBUTION - -
          posture weakening_expires         EXCEPTION_ATTRIBUTION - -

          # UNAVAILABLE IS NOT CLEAN. A stale NVD database cannot establish "no known
          # vulnerabilities" — an empty result set from data that could not be updated is a
          # failure to observe, not an observation.
          unav=""
          [ "${NVD_UPDATE_FAILED:-false}" = "true" ] && unav="$unav,nvd-dependency-check"
          # WHAT THE EVIDENCE SAYS DID NOT RUN (Summary, from each scanner's step outcome and
          # report). A crashed scanner lands here and is removed from executed below (L91). If
          # the Summary itself produced nothing, nothing it would have vouched for is trusted.
          # Its unavailable list is read ONLY when it wrote its state (it writes the list first),
          # so an empty list is the Summary's statement and never a default standing in for one.
          if [ -n "${SUM_STATE:-}" ]; then
            unav="$unav,$SUM_UNAVAILABLE"
          else
            unav="$unav,$req"
          fi

          dedupe() {
            printf '%s' "${1#,}" | tr ',' '\n' | sed '/^$/d' | sort -u | tr '\n' ',' | sed 's/,$//'
          }
          REQ="$(dedupe "$req")"; EXE="$(dedupe "$exe")"
          SKP="$(dedupe "$skp")"; RED="$(dedupe "$red")"; UNAV="$(dedupe "$unav")"
          # A CONTROL THAT WAS SKIPPED DID NOT EXECUTE, whatever another input said about it.
          # AND A CONTROL THAT CRASHED DID NOT EXECUTE either: it is unavailable, never both.
          for c in $(printf '%s,%s' "$SKP" "$UNAV" | tr ',' ' '); do
            EXE="$(printf '%s' "$EXE" | tr ',' '\n' | grep -vx "$c" | tr '\n' ',' | sed 's/,$//')"
          done

          # WHO DECIDED, AND ON WHAT BASIS. A reason without an authority is an explanation, not
          # a decision. Silence never renews a weakening: a past expiry reverts to owing one.
          auth=WEAKENING_AT_BASELINE
          if [ "$inforce" -gt 0 ]; then
            if [ -n "$W_WEAKENING_REASON" ] && [ -n "$W_WEAKENING_AUTHORITY" ]; then
              auth=WEAKENING_ATTRIBUTED
              # AN EXPIRY NOBODY CAN READ HAS NOT "NOT ARRIVED". Dates compare as strings below, which
              # is correct only for a real YYYY-MM-DD: `never` or `31/12/1999` sorted after every ISO
              # date and read as unexpired forever. Anything that is not a valid calendar date reverts
              # to owing a decision, and says why. tests/prove_gate_routing.py, expiry_* scenarios.
              if [ -n "$W_WEAKENING_EXPIRES" ]; then
                if ! printf '%s' "$W_WEAKENING_EXPIRES" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' ||
                   [ "$(date -u -d "$W_WEAKENING_EXPIRES" +%Y-%m-%d 2>/dev/null)" != "$W_WEAKENING_EXPIRES" ]; then
                  echo "::warning title=Unreadable weakening expiry::'$W_WEAKENING_EXPIRES' is not a"
                  echo "YYYY-MM-DD calendar date, so the exception cannot be shown to be in force."
                  auth=WEAKENING_EXCEPTION_EXPIRED
                elif [ "$(date -u +%Y-%m-%d)" ">" "$W_WEAKENING_EXPIRES" ]; then
                  auth=WEAKENING_EXCEPTION_EXPIRED
                fi
              fi
            else
              auth=WEAKENING_UNATTRIBUTED
            fi
          fi

          # ROUTING. Five outcomes, because pass/fail is the collapse this kit refuses.
          #
          # A REFUSAL MUST BE OBSERVED, NOT INFERRED. This workflow cannot tell a control that
          # refused from a tool that could not be acquired once both are present, so it declines
          # to claim BLOCKED while any control is unavailable. An unattributed failure is not an
          # observed refusal, and EVIDENCE_UNTRUSTED is the honest answer.
          route=PROCEED
          if [ -n "$UNAV" ] || [ "$badclass" = "1" ]; then
            route=EVIDENCE_UNTRUSTED
          elif [ "${JOB_STATUS:-success}" = "failure" ]; then
            route=BLOCKED
          elif [ "$auth" = "WEAKENING_UNATTRIBUTED" ] || [ "$auth" = "WEAKENING_EXCEPTION_EXPIRED" ]; then
            route=DECISION_REQUIRED
          elif [ "$inforce" -gt 0 ]; then
            route=PROCEED_WITH_ADVISORY
          fi
          # FINDING_KNOWN_EXPLOITED (KDEC-022 item 3): a CVE on the CISA KEV catalog is an observed
          # refusal at every rung -- BLOCKED, ahead of everything else. An unreadable catalog, or a
          # check that did not report, is never a pass: at least PROCEED_WITH_ADVISORY.
          # An absent output is a check that did not report: UNAVAILABLE, said so, never CLEAR.
          if [ -z "${K_STATE:-}" ]; then kev_state=UNAVAILABLE; else kev_state="$K_STATE"; fi
          if [ -z "${K_VERDICT:-}" ]; then kev_verdict=UNAVAILABLE; else kev_verdict="$K_VERDICT"; fi
          if [ "$kev_verdict" = "BLOCKED" ]; then
            route=BLOCKED
            echo "::error title=GATE=FAIL (FINDING_KNOWN_EXPLOITED)::on the CISA KEV catalog: ${K_BLOCKING:-unnamed}. Exploited in the wild blocks at every rung."
          elif [ "$route" = "PROCEED" ] && [ "$kev_state" != "AVAILABLE" ]; then
            route=PROCEED_WITH_ADVISORY
            echo "::warning title=kev_state UNAVAILABLE::the CISA KEV catalog could not be read; no CVE here has been shown not to be exploited in the wild."
          fi

          emit() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          emit routing_result "$route"
          emit kev_state "$kev_state"
          emit controls_required "$REQ"
          emit controls_executed "$EXE"
          emit controls_unavailable "$UNAV"
          emit controls_reduced "$RED"
          emit controls_skipped "$SKP"
          emit weakenings "[${wk#,}]"
          emit weakening_attribution "$auth"
          emit weakening_record "{\"reason\":\"$W_WEAKENING_REASON\",\"authority\":\"$W_WEAKENING_AUTHORITY\",\"exception_ref\":\"$W_WEAKENING_EXCEPTION_REF\",\"expires\":\"$W_WEAKENING_EXPIRES\"}"

          {
            echo "### Control posture — NVD CVE scan"
            echo ""
            echo "| Row | Value |"
            echo "|---|---|"
            echo "| controls required | \`${REQ:-none}\` |"
            echo "| controls executed | \`${EXE:-none}\` |"
            echo "| controls unavailable | \`${UNAV:-none}\` — tool could not be acquired; NOT the same as clean |"
            echo "| controls reduced | \`${RED:-none}\` |"
            echo "| controls skipped | \`${SKP:-none}\` |"
            echo "| reason | ${W_WEAKENING_REASON:-_(none recorded)_} |"
            echo "| authority | ${W_WEAKENING_AUTHORITY:-_(none recorded)_} |"
            echo "| exception / deferral id | ${W_WEAKENING_EXCEPTION_REF:-_(none recorded)_} |"
            echo "| expiry | ${W_WEAKENING_EXPIRES:-_(no expiry set)_} |"
            echo "| attribution | \`$auth\` |"
            echo "| **routing result** | **\`$route\`** |"
            echo "| kev_state (CISA known exploited) | \`${kev_state}\` — verdict \`${kev_verdict}\`${K_BLOCKING:+ — FINDING_KNOWN_EXPLOITED: ${K_BLOCKING}} |"
            echo ""
            # THE SAME FACT THE TOP OF THE SUMMARY STATES, RESTATED WHERE THE RECORD IS.
            #
            # `fail_on_cvss` and `trivy_fail_severities` are the two inputs that decide whether
            # this workflow can block at all. They are already enumerated above as GATE_SOFTENED
            # rows, which is precise and easy to read past. Said plainly, it is neither. Numeric,
            # not `-gt`: a decimal threshold is a number, not a shell error.
            if ! awk -v v="${W_FAIL_ON_CVSS:-11}" \
                   'BEGIN { exit !(v ~ /^[0-9]+([.][0-9]+)?$/ && v + 0 <= 10) }' \
               && [ -z "${W_TRIVY_FAIL_SEVERITIES:-}" ]; then
              echo "> **Enforcement posture: REPORT ONLY.** \`fail_on_cvss=${W_FAIL_ON_CVSS}\`"
              echo "> is unreachable (CVSS maxes at 10) and \`trivy_fail_severities\` is empty."
              echo "> No finding in this run could have blocked anything. The shipped CVSS"
              echo "> default is 9.0; this run raised it. It is recorded here so a green result"
              echo "> is never read as an enforced one."
              echo ""
            fi
            if [ -n "$dead" ]; then
              echo "> **Dead input(s) set:** \`${dead#,}\` — declared and read by nothing. A dead"
              echo "> input reads as configuration and silently means nothing."
              echo ""
            fi
            if [ "$route" = "DECISION_REQUIRED" ]; then
              echo "> **A weakening is in force and nobody has said why.** Not a failure and not a"
              echo "> pass. Record \`weakening_reason\` and \`weakening_authority\` (and an expiry),"
              echo "> or restore the control to baseline."
              echo ""
            fi
            if [ "$route" = "EVIDENCE_UNTRUSTED" ]; then
              echo "> **This result cannot be relied on.** A control was unavailable, so an empty"
              echo "> finding set is a failure to observe rather than an observation. Do not read"
              echo "> the absence of a block as the absence of risk."
              echo ""
            fi
            echo "Vocabulary: \`assurance-taxonomy.yaml\` :: \`control_weakening\`, \`routing_result\`."
          } >> "$GITHUB_STEP_SUMMARY"

          printf 'routing_result=%s attribution=%s in_force=%s\n' "$route" "$auth" "$inforce"
