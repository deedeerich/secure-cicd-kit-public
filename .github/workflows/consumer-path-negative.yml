name: Consumer path — negative (EXPECTED TO FAIL)

# This workflow is SUPPOSED to end red. Do not "fix" it.
#
# It calls reusable-security.yml exactly as a consumer would, pointed at a fixture carrying
# known HIGH/CRITICAL dependency advisories. A successful run here means the gate did NOT
# block on a real finding, which is the single worst failure this kit can have: the control
# reports clean while the condition it exists to catch is present.
#
# `consumer-path-test.yml` dispatches this and asserts it FAILED. It is dispatch-only so it
# never adds red to the default branch's status on its own.
#
# Why a separate workflow at all: GitHub does not permit `continue-on-error` on a job that
# calls a reusable workflow, so an "expected failure" cannot be absorbed inline.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── THE NEVER-COMMITTED SEEDS, GENERATED ON THE RUNNER (KDEC-011) ───────────────────
  #
  # The three credential seeds and the negative control under tests/consumer-fixture/full/secrets/
  # are generated by tests/make_fixture.py and git-ignored (0917493): a credential SHAPE must not
  # sit in a committed file. A checkout therefore cannot carry them, and hosted run 38784374419
  # graded all four ABSENT -- no scanner had been shown them. They are generated here, on the
  # runner, and handed to the security scan through `test_only_seed_artifact`, an input that can
  # only ADD files to the scanned tree. Only secrets/ is staged: every other fixture file is
  # committed and already in the checkout the scan reads.
  seed:
    name: Generate the never-committed secret seeds
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.stage.outputs.artifact }}
    steps:
      - uses: actions/checkout@v7
      - name: Generate the fixture and stage only its secrets/
        id: stage
        run: |
          set -euo pipefail
          python3 tests/make_fixture.py --out "$RUNNER_TEMP/fixture"
          mkdir -p "$RUNNER_TEMP/seeds"
          cp -R "$RUNNER_TEMP/fixture/secrets" "$RUNNER_TEMP/seeds/secrets"
          n=$(find "$RUNNER_TEMP/seeds/secrets" -type f | wc -l | tr -d ' ')
          if [ "$n" -lt 4 ]; then
            echo "::error title=Seeds not generated::expected the three credential seeds and the"
            echo "negative control under secrets/; the generator wrote $n file(s)."
            exit 1
          fi
          find "$RUNNER_TEMP/seeds" -type f | sort
          echo "artifact=test-only-seeds-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.stage.outputs.artifact }}
          path: ${{ runner.temp }}/seeds
          retention-days: 7
          if-no-files-found: error

  seeded:
    name: Seeded findings MUST block the caller
    needs: seed
    uses: ./.github/workflows/reusable-security.yml
    permissions:
      contents: read
      security-events: write
      actions: read   # the CodeQL job reads workflow metadata on private repositories
    with:
      # The FULL multi-language fixture, so one run proves two things at once: that the gate
      # blocks, and that every seeded signal is actually detected through the consumer path.
      # 20 expected signals — Python, Node, .NET/C#, Java, Go, C/C++, Terraform, Dockerfile,
      # three Azure/Entra credential classes — and a negative control that must NOT fire.
      language: multi
      paths: tests/consumer-fixture/full
      enable_iac: true
      enable_sbom: true
      enable_malicious_pkg_scan: true
      # Defaults to true, which would let SAST findings pass without blocking. The point of
      # this run is to prove the gate blocks, so enforcement has to be on.
      soft_fail_sast: false
      # TEST-ONLY (KDEC-011): the seeds generated above, ADDED to the scanned tree before the
      # secret scan. The artifact belongs to this run; the name is the `seed` job's output.
      test_only_seed_artifact: ${{ needs.seed.outputs.artifact }}
    secrets: inherit
