name: Consumer path — negative (EXPECTED TO FAIL)

# This workflow is SUPPOSED to end red. Do not "fix" it.
#
# It calls reusable-security.yml exactly as a consumer would, pointed at a fixture carrying
# known HIGH/CRITICAL dependency advisories. A successful run here means the gate did NOT
# block on a real finding, which is the single worst failure this kit can have: the control
# reports clean while the condition it exists to catch is present.
#
# `consumer-path-test.yml` dispatches this and asserts it FAILED. It is dispatch-only so it
# never adds red to the default branch's status on its own.
#
# Why a separate workflow at all: GitHub does not permit `continue-on-error` on a job that
# calls a reusable workflow, so an "expected failure" cannot be absorbed inline.
#
# WHAT ENDS IT RED (lane L-S, owner ruling O-24). The security gate is the single enforcement
# point: scanner jobs REPORT findings and fail only when they could not scan, and the gate
# enforces by the resolved policy. This repository registers no policy, so it runs at the kit
# default, crawl: only a secret (or a scan the kit could not run or trust) blocks. The full
# fixture carries three generated credential seeds: the secret scan hands them to the gate (a
# secret may be excepted only by a ticketed register entry, owner ruling 2026-10-22, and this
# repository registers none), and the gate is BLOCKED -- red, as designed. The PHP-only leg carries no secret: at crawl its findings are
# handed to the gate and routed PROCEED_WITH_ADVISORY, so that leg ends GREEN, and its
# `php-verdict` job publishes the verdict for consumer-path-test.yml to assert. It blocks only
# where a register raises this repository above crawl (run: BLOCKED).

on:
  workflow_dispatch:
    inputs:
      # ONE REUSABLE CALL PER RUN, ON PURPOSE. Two calls in one run publish artifacts under the
      # same names (sarif-semgrep-1, ...), and the grader downloads this run's sarif-* by name. So
      # the PHP-only proof (lane L-PHP) is its own dispatch of this file, selected here, and the
      # full fixture -- the graded one -- stays the default.
      scope:
        description: "full = the graded multi-language fixture; php = the PHP subtree alone"
        type: choice
        options: [full, php]
        default: full

permissions:
  contents: read

jobs:
  # ── THE NEVER-COMMITTED SEEDS, GENERATED ON THE RUNNER (KDEC-011) ───────────────────
  #
  # The three credential seeds and the negative control under tests/consumer-fixture/full/secrets/
  # are generated by tests/make_fixture.py and git-ignored (0917493): a credential SHAPE must not
  # sit in a committed file. A checkout therefore cannot carry them, and hosted run 38784374419
  # graded all four ABSENT -- no scanner had been shown them. They are generated here, on the
  # runner, and handed to the security scan through `test_only_seed_artifact`, an input that can
  # only ADD files to the scanned tree. Only secrets/ is staged: every other fixture file is
  # committed and already in the checkout the scan reads.
  seed:
    name: Generate the never-committed secret seeds
    if: inputs.scope != 'php'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.stage.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate the fixture and stage only its secrets/
        id: stage
        run: |
          set -euo pipefail
          python3 tests/make_fixture.py --out "$RUNNER_TEMP/fixture"
          mkdir -p "$RUNNER_TEMP/seeds"
          cp -R "$RUNNER_TEMP/fixture/secrets" "$RUNNER_TEMP/seeds/secrets"
          n=$(find "$RUNNER_TEMP/seeds/secrets" -type f | wc -l | tr -d ' ')
          if [ "$n" -lt 4 ]; then
            echo "::error title=Seeds not generated::expected the three credential seeds and the"
            echo "negative control under secrets/; the generator wrote $n file(s)."
            exit 1
          fi
          find "$RUNNER_TEMP/seeds" -type f | sort
          echo "artifact=test-only-seeds-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.stage.outputs.artifact }}
          path: ${{ runner.temp }}/seeds
          retention-days: 7
          if-no-files-found: error

  seeded:
    name: Seeded findings MUST block the caller
    needs: seed
    if: inputs.scope != 'php'
    uses: ./.github/workflows/reusable-security.yml
    permissions:
      contents: read
      security-events: write
      actions: read   # the CodeQL job reads workflow metadata on private repositories
    with:
      # The FULL multi-language fixture, so one run proves two things at once: that the gate
      # blocks, and that every seeded signal is actually detected through the consumer path.
      # 24 expected signals — Python, Node, .NET/C#, Java, Go, C/C++, PHP (SQL injection, XSS,
      # command injection, a vulnerable Composer lock), Terraform, Dockerfile, three Azure/Entra
      # credential classes — and a negative control that must NOT fire.
      language: multi
      paths: tests/consumer-fixture/full
      enable_iac: true
      enable_sbom: true
      enable_malicious_pkg_scan: true
      # Defaults to true, which would let SAST findings pass without blocking. The point of
      # this run is to prove the gate blocks, so enforcement has to be on.
      soft_fail_sast: false
      # TEST-ONLY (KDEC-011): the seeds generated above, ADDED to the scanned tree before the
      # secret scan. The artifact belongs to this run; the name is the `seed` job's output.
      test_only_seed_artifact: ${{ needs.seed.outputs.artifact }}
    secrets: inherit

  # ── PHP ALONE: DETECTED, HANDED TO THE GATE, ROUTED BY THE POLICY (lane L-PHP, L-S) ──────
  #
  # The full fixture blocks on its secrets, so its failure cannot show what PHP findings do by
  # themselves. This call scans ONLY the PHP subtree -- three Semgrep seeds and a Composer lock
  # with a CRITICAL advisory -- with `language: auto`, so discovery alone decides that PHP is
  # here. It runs only when dispatched with scope=php; consumer-path-test.yml asserts, by job
  # name, that this call's Semgrep job and dependency scan each SUCCEEDED (they report; they do
  # not enforce), and asserts the gate by the verdict `php-verdict` records: at crawl
  # PROCEED_WITH_ADVISORY with FINDINGS_NOT_BLOCKED and a green gate; above crawl BLOCKED and red.
  seeded-php:
    name: Seeded PHP MUST block the caller
    if: inputs.scope == 'php'
    uses: ./.github/workflows/reusable-security.yml
    permissions:
      contents: read
      security-events: write
      actions: read   # the CodeQL job reads workflow metadata on private repositories
    with:
      language: auto
      paths: tests/consumer-fixture/full/php
      soft_fail_sast: false
      enable_sbom: false
      # enable_malicious_pkg_scan stays at its default (true): turning it off is below crawl and
      # refused (KDEC-020), which would turn this leg's crawl verdict into BLOCKED.
    secrets: inherit

  # THE PHP LEG'S VERDICT, KEPT AS EVIDENCE (lane L-S). A job conclusion cannot say WHY the gate
  # passed or failed; the assertion in consumer-path-test.yml reads what the gate emitted.
  php-verdict:
    name: Record the PHP leg's verdict
    needs: seeded-php
    if: always() && inputs.scope == 'php'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Write the verdict the security gate emitted
        env:
          V_ROUTE: ${{ needs.seeded-php.outputs.routing_result }}
          V_CAUSES: ${{ needs.seeded-php.outputs.advisory_causes }}
          V_RUNG: ${{ needs.seeded-php.outputs.rung_effective }}
          V_SOURCE: ${{ needs.seeded-php.outputs.policy_source }}
          V_STATES: ${{ needs.seeded-php.outputs.scanner_states }}
          V_RESULT: ${{ needs.seeded-php.result }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/verdict"
          jq -n --arg route "$V_ROUTE" --arg causes "$V_CAUSES" --arg rung "$V_RUNG" \
                --arg source "$V_SOURCE" --arg states "$V_STATES" --arg result "$V_RESULT" \
            '{routing_result:$route, advisory_causes:$causes, rung_effective:$rung,
              policy_source:$source, scanner_states:$states, call_result:$result}' \
            > "$RUNNER_TEMP/verdict/php-verdict.json"
          cat "$RUNNER_TEMP/verdict/php-verdict.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: php-verdict-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verdict
          retention-days: 7
          if-no-files-found: error
