                           ctx['digest'], col.get('run_id'), ctx['source_environment'], ctx['required_predecessor'])]
              for r in res['refusals']:
                  lines.append('- REFUSED `%s`: %s -- %s' % (r['code'], REFUSALS.get(r['code'], ''), r['why']))
