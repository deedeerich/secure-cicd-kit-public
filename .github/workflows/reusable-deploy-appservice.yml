          #!/usr/bin/env python3
          """The cross-repository target lease, as a model: one lease per deploy target, a fencing token.
          (KDEC-030 draft, lane L-SEAM; docs/architecture/LZ_KIT_SEAM_CONTRACT.md, "The lease".)

          WHY THIS EXISTS

              A GitHub Actions concurrency group is evaluated inside one repository. The landing-zone apply
              runs in the platform repository and the kit's deploy runs in the application repository, so
              the two never wait for each other, whatever their groups are called. KDEC-030 proposes ONE
              lease per target that every pipeline mutating the target acquires first: an Azure Storage blob
              lease on a blob named for the target, plus a GENERATION number kept in the blob's metadata.
              The pair (lease id, generation) is the fencing token. A holder checks it again immediately
              before every mutation, and once more after it; a holder that lost the lease -- broken, taken
              over, past its own expiry -- is refused before it touches the target, or reported after.

              This module is the model only: pure Python, standard library, no network. `BlobLeaseStore`
              emulates the Lease Blob REST operation's documented states and status codes (Microsoft Learn,
              "Lease Blob": acquire / renew / change / release / break; Available, Leased, Expired,
              Breaking, Broken; 409 and 412). `TargetLease` is the seam protocol on top of it;
              tests/prove_target_lease.py proves the protocol.

              Since lane L-SEAM2 (2026-10-27): `AzureBlobLeaseStore` sends the same calls to the Blob REST
              API with an Entra bearer token, keyed by the target's ARM resource id, and `run_cli` gives
              each pipeline step a subcommand (acquire, begin, fence, end, release, status, break). The
              composite .github/actions/target-lease runs it for BOTH sides -- the landing-zone apply and
              the kit's deploy reusables (opt-in: KIT_TARGET_LEASE_ACCOUNT). tests/prove_target_lease_crossrepo.py
              proves it across two independent callers against a local Blob-service emulation. Not yet
              run against real Azure Storage.

          THE PROTOCOL
              acquire     an INFINITE blob lease (an apply runs 4-27 minutes, a rollback sequence up to 240;
                          a 15-60 s lease would need a renewer that can die silently) with a LOGICAL expiry,
                          `expires_at`, in the metadata, extended by heartbeat. Generation + 1. A target held
                          by a live holder is refused LEASE_HELD, naming the holder.
              takeover    a holder past `expires_at` that left the target CLEAN is broken and replaced
                          automatically, recorded (`took_over`). One that left it MID-MUTATION is not:
                          LEASE_ABANDONED_MID_MUTATION -- a human decides (the break authority).
              fence       before every mutation: a read conditional on the lease id (the service answers
                          409/412 when the id is no longer the blob's lease), the generation and holder
                          compared with the token, and the logical expiry checked. Any miss is
                          STALE_LEASE_HOLDER or LEASE_EXPIRED_HOLDER; the mutation does not happen.
              mutate      fence, mark `mutating`, mutate, fence again. A lease lost during the mutation is
                          MUTATED_WITHOUT_LEASE and ROLLBACK_REQUIRES_HUMAN_DECISION, never a clean result.
              break       only an actor in the break authority (the platform admins by default). The blob
                          service lets ANY caller with blob write break a lease (Lease Blob: "Any authorized
                          request can break the lease"), so the authority is enforced by this protocol and by
                          audit, not by Azure RBAC; the generation bump makes every broken holder fenced.

          WHAT THE FENCE DOES NOT CLOSE (stated in the contract): fencing stops a stale holder before its
          next call; it cannot recall an Azure mutation already sent. The Azure target itself does not check
          the token, so a mutation already sent when the lease is lost lands. The after-fence detects it.
          """
          import argparse
          import base64
          import copy
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys
          import time
          import urllib.error
          import urllib.request
          import uuid
          from email.utils import formatdate
          from urllib.parse import urlparse

          # ----------------------------------------------------------------------------- the blob service
          AVAILABLE, LEASED, EXPIRED, BREAKING, BROKEN = 'available', 'leased', 'expired', 'breaking', 'broken'


          class LeaseError(Exception):
              """`code` is an HTTP status (int) from the blob emulation, or a seam outcome (str)."""

              def __init__(self, code, message=''):
                  Exception.__init__(self, '%s: %s' % (code, message) if message else str(code))
                  self.code = code


          class BlobLeaseStore(object):
              """In-memory emulation of the Lease Blob operation over named blobs (one per target).

              Times are plain numbers (seconds) passed in, so a proof controls the clock."""

              def __init__(self):
                  self._b = {}

              def _blob(self, key):
                  return self._b.setdefault(key, {'state': AVAILABLE, 'lease_id': None, 'duration': None,
                                                   'expires': None, 'break_at': None, 'md': {},
                                                   'written_after_expiry': False})

              def _tick(self, key, now):
                  b = self._blob(key)
                  if b['state'] == LEASED and b['duration'] != -1 and now >= b['expires']:
                      b['state'], b['written_after_expiry'] = EXPIRED, False
                  if b['state'] == BREAKING and now >= b['break_at']:
                      b['state'] = BROKEN
                  return b

              def state(self, key, now):
                  return self._tick(key, now)['state']

              def acquire(self, key, duration, proposed_id, now):
                  if not (duration == -1 or 15 <= duration <= 60):
                      raise LeaseError(400, 'a lease is 15-60 seconds or -1 (infinite)')
                  b = self._tick(key, now)
                  lid = proposed_id or str(uuid.uuid4())
                  if b['state'] == BREAKING or (b['state'] == LEASED and lid != b['lease_id']):
                      raise LeaseError(409, 'the blob has an active lease')
                  b.update(state=LEASED, lease_id=lid, duration=duration,
                           expires=None if duration == -1 else now + duration, break_at=None)
                  return lid

              def renew(self, key, lease_id, now):
                  b = self._tick(key, now)
                  if lease_id != b['lease_id'] or b['state'] in (AVAILABLE, BREAKING, BROKEN):
                      raise LeaseError(409, 'the lease cannot be renewed')
                  if b['state'] == EXPIRED and b['written_after_expiry']:
                      raise LeaseError(409, 'the blob was modified since the lease expired')
                  b.update(state=LEASED, expires=None if b['duration'] == -1 else now + b['duration'])
                  return lease_id

              def release(self, key, lease_id, now):
                  b = self._tick(key, now)
                  if b['state'] == AVAILABLE or lease_id != b['lease_id']:
                      raise LeaseError(409, 'the lease id does not match')
                  b.update(state=AVAILABLE, lease_id=None, break_at=None)

              def break_lease(self, key, period, now):
                  """No lease id needed. Returns the seconds until a new lease can be acquired."""
                  b = self._tick(key, now)
                  if b['state'] == AVAILABLE:
                      raise LeaseError(409, 'there is currently no lease on the blob')
                  if b['state'] in (BROKEN, EXPIRED):
                      b['state'] = BROKEN
                      return 0
                  remaining = None if (b['state'] == LEASED and b['duration'] == -1) else \
                      ((b['expires'] if b['state'] == LEASED else b['break_at']) - now)
                  if period is None:
                      wait = 0 if remaining is None else remaining
                  else:
                      wait = period if remaining is None else min(period, remaining)
                  if wait <= 0:
                      b['state'] = BROKEN
                      return 0
                  b.update(state=BREAKING, break_at=now + wait)
                  return wait

              def write(self, key, lease_id, md, now):
                  """Set Blob Metadata: the write rules of the documented outcome table."""
                  b = self._tick(key, now)
                  st, held = b['state'], b['lease_id']
                  if st == LEASED:
                      if lease_id is None:
                          raise LeaseError(412, 'there is a lease on the blob and no lease id was given')
                      if lease_id != held:
                          raise LeaseError(409, 'the lease id does not match')
                  elif st == BREAKING:
                      if lease_id != held:
                          raise LeaseError(412, 'the lease is breaking')
                  elif lease_id is not None:
                      raise LeaseError(412, 'there is no active lease with that id')
                  elif st in (BROKEN, EXPIRED):
                      b.update(state=AVAILABLE, lease_id=None)
                  if st == EXPIRED:
                      b['written_after_expiry'] = True
                  b['md'] = copy.deepcopy(md)

              def read(self, key, lease_id, now):
                  """Get Blob Properties, conditional on the lease id when one is given."""
                  b = self._tick(key, now)
                  if lease_id is not None:
                      st = b['state']
                      if st in (AVAILABLE, BROKEN, EXPIRED):
                          raise LeaseError(412, 'there is no active lease with that id')
                      if lease_id != b['lease_id']:
                          raise LeaseError(409, 'the lease id does not match')
                  return copy.deepcopy(b['md'])


          # ----------------------------------------------------------------------------- the seam protocol
          CLEAN, MUTATING, broken_mark = 'clean', 'mutating', 'broken'
          HUMAN = 'ROLLBACK_REQUIRES_HUMAN_DECISION'


          class Token(object):
              """The fencing token a holder carries: (target, lease id, generation, holder)."""

              def __init__(self, target, lease_id, generation, holder, took_over=None):
                  self.target, self.lease_id, self.generation = target, lease_id, generation
                  self.holder, self.took_over = holder, took_over

              def __repr__(self):
                  return 'Token(%s gen=%s holder=%s)' % (self.target, self.generation, self.holder)


          class TargetLease(object):
              def __init__(self, store, heartbeat_ttl=600, break_authority=()):
                  self.store, self.ttl = store, heartbeat_ttl
                  self.authority = set(break_authority)

              # -- acquisition
              def acquire(self, target, holder, now):
                  lid, took_over = str(uuid.uuid4()), None
                  try:
                      self.store.acquire(target, -1, lid, now)
                  except LeaseError as e:
                      if e.code != 409:
                          raise
                      md = self.store.read(target, None, now)
                      exp = md.get('expires_at')
                      if exp is None or now <= exp:
                          raise LeaseError('LEASE_HELD', 'target %s is held by %s (generation %s) until %s'
                                           % (target, md.get('holder', '?'), md.get('generation'), exp))
                      if md.get('state') == MUTATING:
                          raise LeaseError('LEASE_ABANDONED_MID_MUTATION',
                                           '%s expired at %s while mutating (%s); a human decides before '
                                           'anyone takes the target' % (md.get('holder'), exp,
                                                                        md.get('mutation')))
                      self.store.break_lease(target, 0, now)
                      took_over = md.get('holder')
                      self.store.acquire(target, -1, lid, now)
                  md = self.store.read(target, lid, now)
                  gen = int(md.get('generation') or 0) + 1
                  hist = list(md.get('history') or [])
                  hist.append({'generation': gen, 'holder': holder, 'acquired_at': now,
                               'took_over': took_over})
                  self.store.write(target, lid, {'generation': gen, 'holder': holder,
                                                 'expires_at': now + self.ttl, 'state': CLEAN,
                                                 'mutation': None, 'history': hist[-20:]}, now)
                  return Token(target, lid, gen, holder, took_over)

              # -- the fence
              def fence(self, token, now):
                  try:
                      md = self.store.read(token.target, token.lease_id, now)
                  except LeaseError as e:
                      if e.code in UNKNOWN_CODES:   # a store that cannot be read is not a lost lease: fail closed
                          raise
                      raise LeaseError('STALE_LEASE_HOLDER', '%r no longer holds the lease (%s)' % (token, e.code))
                  if md.get('generation') != token.generation or md.get('holder') != token.holder:
                      raise LeaseError('STALE_LEASE_HOLDER', '%r: the blob is at generation %s, holder %s'
                                       % (token, md.get('generation'), md.get('holder')))
                  if now > md.get('expires_at', -1):
                      raise LeaseError('LEASE_EXPIRED_HOLDER', '%r expired at %s' % (token, md.get('expires_at')))
                  return md

              def _put(self, token, md, now):
                  self.store.write(token.target, token.lease_id, md, now)

              def heartbeat(self, token, now):
                  md = self.fence(token, now)
                  md['expires_at'] = now + self.ttl
                  self._put(token, md, now)

              def begin_mutation(self, token, what, now):
                  md = self.fence(token, now)
                  md.update(state=MUTATING, mutation=what)
                  self._put(token, md, now)

              def end_mutation(self, token, now):
                  md = self.fence(token, now)
                  md.update(state=CLEAN, mutation=None)
                  self._put(token, md, now)

              def mutate(self, token, what, fn, now, after):
                  """Fence, mark, mutate, fence again. -> a result dict; never raises for a lost lease."""
                  self.begin_mutation(token, what, now)
                  try:
                      fn()
                  except Exception as e:  # noqa: BLE001 -- the mutation's own failure, recorded
                      return {'outcome': 'MUTATION_FAILED', 'rollback_state': HUMAN, 'reason': str(e)}
                  try:
                      self.end_mutation(token, after)
                  except LeaseError as e:
                      return {'outcome': 'MUTATED_WITHOUT_LEASE', 'rollback_state': HUMAN,
                              'reason': '%s: the lease was lost while "%s" was in flight' % (e.code, what)}
                  return {'outcome': 'MUTATED_UNDER_LEASE', 'rollback_state': None, 'reason': ''}

              def release(self, token, now):
                  md = self.fence(token, now)
                  if md.get('state') == MUTATING:
                      raise LeaseError('RELEASE_MID_MUTATION', '%r is mid-mutation (%s); end or record it '
                                       'first' % (token, md.get('mutation')))
                  self.store.release(token.target, token.lease_id, now)

              # -- break authority
              def break_lease(self, target, actor, reason, now):
                  if actor not in self.authority:
                      raise LeaseError('BREAK_NOT_AUTHORISED', '%s is not in the break authority' % actor)
                  md = self.store.read(target, None, now)
                  self.store.break_lease(target, 0, now)
                  md.update(generation=int(md.get('generation') or 0) + 1, broken_by=actor, reason=reason,
                            broken_at=now, state_at_break=md.get('state'), state=broken_mark,
                            expires_at=now)
                  self.store.write(target, None, md, now)
                  return md


          # ----------------------------------------------------------------------------- the live adapter
          API_VERSION = '2021-12-02'
          STORAGE_RESOURCE = 'https://storage.azure.com/'
          BLOB_SUFFIX = {'public': 'blob.core.windows.net', 'gov': 'blob.core.usgovcloudapi.net'}
          LEASE_BLOB = 'lease'
          META_KEY = 'seam'      # the whole metadata dict, JSON then base64: Azure metadata values are strings


          def normalise_target(resource_id):
              """An ARM resource id, lower-cased (ARM ids are case-insensitive): one target, one lease."""
              rid = (resource_id or '').strip().rstrip('/').lower()
              if not re.match(r'^/subscriptions/[0-9a-f-]+/resourcegroups/[^/]+/providers/[^/]+/[^/]+/[^/]+', rid):
                  raise ValueError('not an ARM resource id: %r' % resource_id)
              return rid


          def container_for(target):
              """The per-target container the LZ vend creates: 't-' + the first 40 hex of sha256(id)."""
              return 't-' + hashlib.sha256(normalise_target(target).encode('utf-8')).hexdigest()[:40]


          def bearer_from_az():
              """A storage-scoped Entra token for the identity `az login` (azure/login) signed in."""
              try:
                  p = subprocess.run(['az', 'account', 'get-access-token', '--resource', STORAGE_RESOURCE,
                                      '--query', 'accessToken', '-o', 'tsv'],
                                     capture_output=True, text=True, timeout=60)
              except (OSError, subprocess.SubprocessError) as e:
                  raise LeaseError('LEASE_STORE_UNREACHABLE', 'no storage token: %s' % e)
              if p.returncode != 0 or not p.stdout.strip():
                  raise LeaseError('LEASE_STORE_UNREACHABLE', 'no storage token: %s'
                                   % (p.stderr.strip().splitlines() or ['az failed'])[-1])
              return p.stdout.strip()


          class AzureBlobLeaseStore(object):
              """The same five calls as BlobLeaseStore, sent to the Blob service's REST API.

              Entra (OAuth bearer) only; shared keys are never used. One container per target, vended by the
              landing zone; the blob `lease` inside it is created on first use. `now` is accepted for the
              model's signature and ignored: the service keeps its own clock, and the protocol's logical
              expiry is the caller's clock (TargetLease). HTTP status codes become LeaseError(status), as the
              emulation raises them; anything that is not a lease answer fails closed."""

              def __init__(self, account=None, endpoint=None, cloud='public', bearer=None, timeout=30):
                  if endpoint:
                      u = urlparse(endpoint)
                      if u.scheme != 'https' and not (u.scheme == 'http' and u.hostname in ('127.0.0.1', 'localhost')):
                          raise ValueError('the lease store is reached over https (plain http only to a local '
                                           'test emulator): %s' % endpoint)
                      self.base = endpoint.rstrip('/')
                  else:
                      if not re.match(r'^[a-z0-9]{3,24}$', account or ''):
                          raise ValueError('not a storage account name: %r' % account)
                      self.base = 'https://%s.%s' % (account, BLOB_SUFFIX.get(cloud, BLOB_SUFFIX['public']))
                  self._bearer, self.timeout = bearer, timeout

              def _token(self):
                  if not self._bearer:
                      self._bearer = os.environ.get('TARGET_LEASE_BEARER') or bearer_from_az()
                  return self._bearer

              def _call(self, method, key, comp='', headers=None):
                  url = '%s/%s/%s' % (self.base, container_for(key), LEASE_BLOB) + ('?comp=' + comp if comp else '')
                  h = {'Authorization': 'Bearer ' + self._token(), 'x-ms-version': API_VERSION,
                       'x-ms-date': formatdate(usegmt=True)}
                  h.update({k: v for k, v in (headers or {}).items() if v is not None})
                  data = b'' if method == 'PUT' else None
                  req = urllib.request.Request(url, data=data, method=method, headers=h)
                  try:
                      with urllib.request.urlopen(req, timeout=self.timeout) as r:
                          return r.status, {k.lower(): v for k, v in r.headers.items()}
                  except urllib.error.HTTPError as e:
                      code, err = e.code, (e.headers.get('x-ms-error-code') or '')
                      if code == 404 and err == 'ContainerNotFound':
                          raise LeaseError('LEASE_TARGET_NOT_VENDED', 'no lease container %s for %s: the landing '
                                           'zone vends it with the target' % (container_for(key), key))
                      if code in (404, 409, 412):
                          raise LeaseError(code, err or 'blob service %s' % code)
                      raise LeaseError('LEASE_STORE_UNREACHABLE', 'blob service answered %s %s' % (code, err))
                  except (urllib.error.URLError, OSError) as e:
                      raise LeaseError('LEASE_STORE_UNREACHABLE', '%s: %s' % (self.base, getattr(e, 'reason', e)))

              def _ensure_blob(self, key):
                  try:
                      self._call('PUT', key, headers={'x-ms-blob-type': 'BlockBlob', 'If-None-Match': '*',
                                                      'Content-Length': '0'})
                  except LeaseError as e:
                      if e.code not in (409, 412):      # it exists already (or is leased): both fine
                          raise

              def state(self, key, now=None):
                  try:
                      return self._call('HEAD', key)[1].get('x-ms-lease-state', AVAILABLE)
                  except LeaseError as e:
                      if e.code == 404:
                          return AVAILABLE
                      raise

              def acquire(self, key, duration, proposed_id, now=None):
                  hdr = {'x-ms-lease-action': 'acquire', 'x-ms-lease-duration': str(duration),
                         'x-ms-proposed-lease-id': proposed_id or str(uuid.uuid4())}
                  try:
                      return self._call('PUT', key, 'lease', hdr)[1].get('x-ms-lease-id', hdr['x-ms-proposed-lease-id'])
                  except LeaseError as e:
                      if e.code != 404:
                          raise
                  self._ensure_blob(key)
                  return self._call('PUT', key, 'lease', hdr)[1].get('x-ms-lease-id', hdr['x-ms-proposed-lease-id'])

              def release(self, key, lease_id, now=None):
                  self._call('PUT', key, 'lease', {'x-ms-lease-action': 'release', 'x-ms-lease-id': lease_id})

              def break_lease(self, key, period, now=None):
                  h = self._call('PUT', key, 'lease', {'x-ms-lease-action': 'break',
                                                       'x-ms-lease-break-period': None if period is None else str(period)})[1]
                  return int(h.get('x-ms-lease-time') or 0)

              def write(self, key, lease_id, md, now=None):
                  enc = base64.b64encode(json.dumps(md, sort_keys=True).encode('utf-8')).decode('ascii')
                  self._call('PUT', key, 'metadata', {'x-ms-lease-id': lease_id, 'x-ms-meta-' + META_KEY: enc})

              def read(self, key, lease_id, now=None):
                  try:
                      h = self._call('HEAD', key, headers={'x-ms-lease-id': lease_id})[1]
                  except LeaseError as e:
                      if e.code == 404 and lease_id is None:
                          return {}
                      raise
                  raw = h.get('x-ms-meta-' + META_KEY)
                  if not raw:
                      return {}
                  try:
                      return json.loads(base64.b64decode(raw).decode('utf-8'))
                  except (ValueError, TypeError) as e:
                      raise LeaseError('LEASE_STORE_UNREACHABLE', 'the lease metadata is unreadable (%s)' % e)


          # ----------------------------------------------------------------------------- the command line
          # One subcommand per pipeline step; the token file carries the fencing token between steps.
          # Prints `target_lease=<VALUE>` and `target_lease_reason=<text>` (and appends them to
          # $GITHUB_OUTPUT when set). EXIT 0 done; 1 refused, by name; 2 could not check -- fail closed.
          #
          #   hold  runs a long step (the e2e test period, a whole rollback sequence) as a child process
          #         and renews the lease every --every seconds (default 180, below a third of the 10-minute
          #         TTL). A failed renewal stops the child at once and ends LEASE_LOST, exit 1; the loss is
          #         recorded beside the token, so every later fence of this run -- including the one each
          #         mutating az call takes (deploy_contract.az) -- is refused LEASE_LOST without asking the
          #         store again: no further mutation. --mark-mutating marks the lease `mutating` for the
          #         child's whole run and clean only when it exits 0 (a halted rollback stays a human decision).
          UNKNOWN_CODES = ('LEASE_STORE_UNREACHABLE', 'LEASE_TARGET_NOT_VENDED')
          ARM_TYPES = {'containerapp': 'Microsoft.App/containerApps', 'appservice': 'Microsoft.Web/sites'}
          LOST_SUFFIX = '.lost'
          DEFAULT_TOKEN = os.path.join('kit-target-lease', 'token.json')


          def default_token_file():
              """Where a job keeps its token: KIT_TARGET_LEASE_TOKEN, else $RUNNER_TEMP/kit-target-lease/token.json."""
              return os.environ.get('KIT_TARGET_LEASE_TOKEN') or os.path.join(
                  os.environ.get('RUNNER_TEMP') or '.', DEFAULT_TOKEN)


          def target_id(adapter, subscription, resource_group, name):
              """The ARM resource id of a kit target. App Service: the SITE, never a slot (a swap changes both)."""
              if adapter not in ARM_TYPES:
                  raise ValueError('no lease target type for adapter %r' % adapter)
              return '/subscriptions/%s/resourceGroups/%s/providers/%s/%s' % (subscription, resource_group,
                                                                              ARM_TYPES[adapter], name)


          def _emit(values, github_output):
              lines = []
              for k, v in values.items():
                  lines.append('%s=%s' % (k, ' '.join(str(v if v is not None else '').split())))
              print('\n'.join(lines))
              sys.stdout.flush()
              if github_output:
                  with open(github_output, 'a', encoding='utf-8') as f:
                      f.write('\n'.join(lines) + '\n')


          def _store(a):
              return AzureBlobLeaseStore(account=a.account, endpoint=a.endpoint, cloud=a.cloud)


          def _load_token(path):
              with open(path, encoding='utf-8') as f:
                  d = json.load(f)
              a = argparse.Namespace(account=d.get('account'), endpoint=d.get('endpoint'), cloud=d.get('cloud'),
                                     ttl=d.get('ttl', 600))
              return a, Token(d['target'], d['lease_id'], d['generation'], d['holder'], d.get('took_over'))


          def check_not_lost(path):
              marker = path + LOST_SUFFIX
              if os.path.exists(marker):
                  with open(marker, encoding='utf-8') as f:
                      why = f.read().strip()
                  raise LeaseError('LEASE_LOST', 'this run lost the lease earlier (%s); nothing further is mutated' % why)


          def mark_lost(path, why):
              with open(path + LOST_SUFFIX, 'w', encoding='utf-8') as f:
                  f.write(' '.join(str(why).split()))


          def fence_token_file(path=None, now=None, mark=True):
              """The fence a mutating call takes, and the hold's renewal: fence + heartbeat. -> the token.

              Raises LeaseError: LEASE_NOT_HELD (no token: this run never acquired the target), LEASE_LOST
              (lost earlier in this run), or the fence's own refusal. With `mark`, any refusal is recorded as
              lost, so nothing later in the run mutates on a lease that failed once."""
              path = path or default_token_file()
              if not os.path.exists(path):
                  raise LeaseError('LEASE_NOT_HELD', 'no lease token at %s: this run never acquired the target' % path)
              check_not_lost(path)
              cfg, tok = _load_token(path)
              lease = TargetLease(_store(cfg), heartbeat_ttl=int(cfg.ttl or 600))
              try:
                  lease.heartbeat(tok, time.time() if now is None else now)
              except LeaseError as e:
                  if mark:
                      mark_lost(path, '%s: %s' % (e.code, e))
                  raise
              return tok


          def _stop(child):
              try:
                  if os.name == 'posix':
                      import signal
                      os.killpg(child.pid, signal.SIGTERM)
                  else:
                      child.terminate()
                  child.wait(timeout=15)
              except Exception:  # noqa: BLE001 -- stopping is best effort, then forced
                  try:
                      if os.name == 'posix':
                          import signal
                          os.killpg(child.pid, signal.SIGKILL)
                      else:
                          child.kill()
                  except Exception:  # noqa: BLE001
                      pass


          def _hold(a, cmd, done):
              if not cmd:
                  raise ValueError('hold needs the command to run after --')
              path = a.token_file or default_token_file()

              def lost(e):
                  return done('LEASE_LOST', '%s: %s; the held step was stopped and nothing further is mutated'
                              % (e.code, e), 1)
              try:
                  tok = fence_token_file(path)
                  if a.mark_mutating:
                      cfg, _ = _load_token(path)
                      TargetLease(_store(cfg), heartbeat_ttl=int(cfg.ttl or 600)).begin_mutation(
                          tok, a.mark_mutating, time.time())
              except LeaseError as e:
                  if not os.path.exists(path + LOST_SUFFIX) and os.path.exists(path):
                      mark_lost(path, '%s: %s' % (e.code, e))
                  return lost(e)
              kw = {'start_new_session': True} if os.name == 'posix' else {}
              child = subprocess.Popen(cmd, **kw)
              while True:
                  try:
                      rc = child.wait(timeout=max(1, a.every))
                      break
                  except subprocess.TimeoutExpired:
                      try:
                          fence_token_file(path)
                      except LeaseError as e:
                          _stop(child)
                          return lost(e)
              try:
                  tok = fence_token_file(path)
                  if a.mark_mutating and rc == 0:
                      cfg, _ = _load_token(path)
                      TargetLease(_store(cfg), heartbeat_ttl=int(cfg.ttl or 600)).end_mutation(tok, time.time())
              except LeaseError as e:
                  if not os.path.exists(path + LOST_SUFFIX):
                      mark_lost(path, '%s: %s' % (e.code, e))
                  return lost(e)
              return done('LEASE_FENCE_PASSED', '%r held through the step (exit %s)%s' % (
                  tok, rc, '' if not a.mark_mutating else (', clean' if rc == 0 else ', left mutating: a human decides')),
                  rc)


          def run_cli(argv=None):
              argv = list(sys.argv[1:] if argv is None else argv)
              cmd = []
              if '--' in argv:
                  k = argv.index('--')
                  argv, cmd = argv[:k], argv[k + 1:]
              p = argparse.ArgumentParser(description='The cross-repository target lease (KDEC-030 draft).')
              p.add_argument('op', choices=['acquire', 'fence', 'begin', 'end', 'release', 'status', 'break', 'hold'])
              p.add_argument('--resource-id', default='')
              p.add_argument('--adapter', default='', help='with --subscription --resource-group --name: builds the id')
              p.add_argument('--subscription', default='')
              p.add_argument('--resource-group', default='')
              p.add_argument('--name', default='')
              p.add_argument('--holder', default='')
              p.add_argument('--account', default='')
              p.add_argument('--endpoint', default='', help='test emulator only; the account name decides the URL')
              p.add_argument('--cloud', default=os.environ.get('CLOUD') or 'public')
              p.add_argument('--ttl', type=int, default=600, help='heartbeat TTL in seconds (KDEC-030 O-5)')
              p.add_argument('--token-file', default='')
              p.add_argument('--what', default='')
              p.add_argument('--every', type=int, default=180, help='hold: seconds between renewals (below TTL/3)')
              p.add_argument('--mark-mutating', default='', help='hold: mark the lease mutating for the child run')
              p.add_argument('--actor', default='')
              p.add_argument('--reason', default='')
              p.add_argument('--authority', default=os.environ.get('TARGET_LEASE_BREAK_AUTHORITY') or 'platform-admins')
              p.add_argument('--now', type=float, default=None, help='a fixed clock, for proofs only')
              p.add_argument('--github-output', default=os.environ.get('GITHUB_OUTPUT') or '')
              a = p.parse_args(argv)
              now = a.now if a.now is not None else time.time()
              out = {}

              def done(value, reason='', code=0, **extra):
                  out.update(target_lease=value, target_lease_reason=reason, **extra)
                  _emit(out, a.github_output)
                  return code

              try:
                  if a.op == 'hold':
                      return _hold(a, cmd, done)
                  if a.op in ('acquire', 'status', 'break'):
                      rid = a.resource_id or (target_id(a.adapter, a.subscription, a.resource_group, a.name)
                                              if a.adapter else '')
                      target = normalise_target(rid)
                      store = _store(a)
                      lease = TargetLease(store, heartbeat_ttl=a.ttl, break_authority=a.authority.split(','))
                      if a.op == 'status':
                          md = store.read(target, None, now)
                          return done('LEASE_STATUS', 'holder %s generation %s state %s expires_at %s'
                                      % (md.get('holder'), md.get('generation'), md.get('state'), md.get('expires_at')))
                      if a.op == 'break':
                          md = lease.break_lease(target, a.actor, a.reason, now)
                          return done('LEASE_BROKEN', '%s broke generation %s (%s): %s' % (
                              a.actor, int(md['generation']) - 1, md.get('state_at_break'), a.reason))
                      if not a.holder:
                          raise ValueError('acquire needs --holder')
                      token_file = a.token_file or default_token_file()
                      tok = lease.acquire(target, a.holder, now)
                      d = os.path.dirname(os.path.abspath(token_file))
                      os.makedirs(d, exist_ok=True)
                      if os.path.exists(token_file + LOST_SUFFIX):
                          os.remove(token_file + LOST_SUFFIX)
                      with open(token_file, 'w', encoding='utf-8') as f:
                          json.dump({'target': tok.target, 'lease_id': tok.lease_id, 'generation': tok.generation,
                                     'holder': tok.holder, 'took_over': tok.took_over, 'account': a.account,
                                     'endpoint': a.endpoint, 'cloud': a.cloud, 'ttl': a.ttl}, f)
                      return done('LEASE_ACQUIRED', '%s holds %s at generation %s' % (tok.holder, target, tok.generation),
                                  target_lease_generation=tok.generation, target_lease_took_over=tok.took_over or '')
                  token_file = a.token_file or default_token_file()
                  if not os.path.exists(token_file):
                      raise LeaseError('LEASE_NOT_HELD', 'no lease token at %s: this run never acquired the target'
                                       % token_file)
                  check_not_lost(token_file)
                  cfg, tok = _load_token(token_file)
                  lease = TargetLease(_store(cfg), heartbeat_ttl=int(cfg.ttl or 600))
                  if a.op == 'fence':
                      lease.heartbeat(tok, now)
                      return done('LEASE_FENCE_PASSED', '%r, renewed for %ss' % (tok, lease.ttl))
                  if a.op == 'begin':
                      lease.heartbeat(tok, now)
                      lease.begin_mutation(tok, a.what or 'mutation', now)
                      return done('LEASE_MUTATION_MARKED', '%r: %s' % (tok, a.what or 'mutation'))
                  if a.op == 'end':
                      try:
                          lease.end_mutation(tok, now)
                      except LeaseError as e:
                          if e.code in UNKNOWN_CODES:
                              raise
                          return done('MUTATED_WITHOUT_LEASE', '%s: %s; %s' % (e.code, e, HUMAN), 1)
                      return done('MUTATED_UNDER_LEASE', repr(tok))
                  lease.release(tok, now)
                  return done('LEASE_RELEASED', repr(tok))
              except LeaseError as e:
                  code = e.code if isinstance(e.code, str) else 'LEASE_STORE_UNREACHABLE'
                  return done(code, str(e), 2 if code in UNKNOWN_CODES else 1)
              except ValueError as e:
                  print('UNKNOWN: %s' % e, file=sys.stderr)
                  return 2


          if __name__ == '__main__':
              sys.exit(run_cli())
          kit_target_lease_py

      - name: Bind the tier and target to the GitHub environment (refuse before login)
        id: bind
        # B-13 / LZ-1 (ledger P-01). The landing zone vends the tier and the target as VARIABLES of
        # this job's GitHub environment (docs/architecture/LZ_KIT_HANDOFF_CONTRACT.md). A caller job
        # cannot read them, so the tier was whatever string the caller typed -- `prod` in the
        # starter template, for every target -- and the tier decides the production rules. This job
        # runs IN the environment: an empty input is filled from the vended value (GITHUB_ENV, read
        # by every later step), an input that disagrees with it is refused here, before the verdict
        # is weighed and before login, and an environment that vends nothing leaves the inputs as
        # given (UNBOUND, recorded). The body is identical in both deploy reusables.
        # tests/prove_deploy_environment_binding.py.
        env:
          APP_VARIABLE: WEBAPP_NAME
          APP_INPUT: webapp_name
        run: |
          set -u
          # A value is named in a message only when it is a plain name: caller or vended text could
          # otherwise carry a workflow command (`::`) into the log.
          # The whole value, never line by line (grep would pass a value whose first line is plain).
          plain() { [[ "$1" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$ ]]; }
          shown() {
            if [ -z "$1" ]; then printf '(none)'
            elif plain "$1"; then printf "'%s'" "$1"
            else printf '(a value that is not a plain name, not shown)'; fi
          }
          refuse() {
            echo "target_binding=REFUSED" >> "$GITHUB_OUTPUT"
            echo "::error title=Deploy refused before login::$1"
            printf '### Deploy refused before login\n\n%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          bound=0
          # bind <job variable> <input name> <the value this environment vends>
          bind() {
            var="$1"; name="$2"; vended="$3"; given="${!var:-}"
            [ -n "$vended" ] || return 0
            plain "$vended" ||
              refuse "This GitHub environment vends ${name} as a value that is not a plain name. It is not echoed, and nothing is deployed against it."
            if [ -n "$given" ] && [ "$given" != "$vended" ]; then
              refuse "${name} is $(shown "$given") in the call, but GitHub environment $(shown "${DEPLOY_ENVIRONMENT:-}") vends '${vended}'. A deploy runs under the tier, and against the target, the landing zone vended to the environment that holds its identity. Pass an empty value, or the vended one."
            fi
            if [ -z "$given" ]; then
              fills+=("${var}=${vended}")
              echo "${name}: filled from this environment ('${vended}')."
            fi
            bound=$((bound + 1))
          }
          fills=()
          bind ENVIRONMENT_TIER environment_tier "${KIT_BOUND_ENVIRONMENT_TIER:-}"
          bind RESOURCE_GROUP resource_group "${KIT_BOUND_RESOURCE_GROUP:-}"
          bind "$APP_VARIABLE" "$APP_INPUT" "${KIT_BOUND_APP_NAME:-}"
          bind ACR_LOGIN_SERVER acr_login_server "${KIT_BOUND_ACR_LOGIN_SERVER:-}"
          bind IMAGE_REPOSITORY image_repository "${KIT_BOUND_IMAGE_REPOSITORY:-}"
          # azure/login reads the cloud from the input itself, so a vended cloud is CHECKED, never
          # filled: an empty or other value logs in to the commercial cloud.
          if [ -n "${KIT_BOUND_CLOUD:-}" ]; then
            login=commercial
            if [ "${CLOUD:-}" = "gov" ]; then login=gov; fi
            plain "$KIT_BOUND_CLOUD" ||
              refuse "This GitHub environment vends cloud as a value that is not a plain name. It is not echoed, and nothing is deployed against it."
            if [ "$KIT_BOUND_CLOUD" != "$login" ]; then
              refuse "GitHub environment $(shown "${DEPLOY_ENVIRONMENT:-}") vends cloud '${KIT_BOUND_CLOUD}', and this call would log in to ${login}. Pass cloud: ${KIT_BOUND_CLOUD}."
            fi
            bound=$((bound + 1))
          fi
          # Written only once every value has been checked: a refused binding fills nothing.
          for f in ${fills[@]+"${fills[@]}"}; do echo "$f" >> "$GITHUB_ENV"; done
          if [ "$bound" -gt 0 ]; then
            echo "target_binding=BOUND" >> "$GITHUB_OUTPUT"
            echo "Bound to ${bound} value(s) this GitHub environment vends."
          else
            echo "target_binding=UNBOUND" >> "$GITHUB_OUTPUT"
            echo "This GitHub environment vends no KIT_* values: the inputs are used as given (UNBOUND)."
          fi

      - name: Verify the environment's deployment protection (refuse before login)
        id: protection
        # Owner, 2026-10-22: uat and prod need ONE approver from a named reviewer group who is NOT
        # the deploying developer -- the GitHub environment's required reviewers, self-review
        # prevented. The kit cannot set that; it READS it back (read-only environments API) and,
        # at uat and prod, refuses when the policy demands it and the environment lacks it, or when
        # it cannot be read (NOT_ESTABLISHED is not a pass). Below uat it is recorded and warned.
        # The body is identical in both deploy reusables. tests/prove_deploy_environment_protection.py.
        env:
          DEPLOY_APPROVAL: ${{ inputs.deploy_approval }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          python3 "$RUNNER_TEMP/kit-deploy/environment_protection.py" \
            --repository "${GITHUB_REPOSITORY:-}" --environment "${DEPLOY_ENVIRONMENT:-}" \
            --tier "${ENVIRONMENT_TIER:-}" --demand-json "${DEPLOY_APPROVAL:-}" \
            > "$RUNNER_TEMP/environment-protection.txt" 2>&1
          rc=$?
          cat "$RUNNER_TEMP/environment-protection.txt"
          outcome="$(sed -n 's/^environment_protection=\([A-Z_]*\) .*/\1/p' "$RUNNER_TEMP/environment-protection.txt" | head -1)"
          # No outcome printed is not a pass: it is NOT_ESTABLISHED, and the exit code decides.
          [ -n "$outcome" ] || outcome=ENVIRONMENT_PROTECTION_NOT_ESTABLISHED
          echo "environment_protection=${outcome}" >> "$GITHUB_OUTPUT"
          { echo "### GitHub environment protection"; echo ""
            echo "\`${outcome:-ENVIRONMENT_PROTECTION_NOT_ESTABLISHED}\` at tier \`${ENVIRONMENT_TIER:-none}\`."; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" != "0" ]; then
            echo "::error title=Deploy refused before login (environment protection)::${outcome:-ENVIRONMENT_PROTECTION_NOT_ESTABLISHED}: the GitHub environment this deploy runs in does not have the required reviewers (one from the named group, self-review prevented) that ${ENVIRONMENT_TIER:-this tier} demands, or they could not be read. Set them on the environment; nothing was deployed."
            exit 1
          fi
          case "$outcome" in
            ENVIRONMENT_PROTECTION_VERIFIED|ENVIRONMENT_PROTECTION_NOT_REQUIRED) ;;
            *) echo "::warning title=Environment protection ${outcome:-unknown}::recorded below uat; at uat and prod this deploy would be refused." ;;
          esac

      - name: Gate verdict (refuse before login)
        id: verdict
        # L93. SINGLE_PIPELINE_TARGET.md section 5.2: "The deploy stage reads the verdict, not
        # needs.gate.result." A job result cannot tell DECISION_REQUIRED from BLOCKED and cannot
        # express PROCEED_WITH_ADVISORY; the routing_result can. Read FIRST, before login, so a
        # refused deploy never holds the deploy identity. Proven by tests/prove_deploy_gate.py.
        env:
          ROUTING_RESULT: ${{ inputs.routing_result }}
        run: |
          refuse() {
            echo "::error title=Deploy refused before login::$1"
            {
              echo "### Deploy refused before login"
              echo ""
              echo "$1"
            } >> "$GITHUB_STEP_SUMMARY"
            not_engaged_unless_ruled
            echo "verdict_permits=false" >> "$GITHUB_OUTPUT"
            exit 1
          }
          # KDEC-014 (owner, 2026-10-16): "Version-gap-only PROCEED_WITH_ADVISORY is DEV/TEST
          # ONLY. UAT and prod refuse it until the scanner gap is closed or a named person accepts
          # it as an attributed exception." The gate names WHY a verdict is advisory
          # (advisory_causes). ROLLOUT (owner, same day): enforcement is DATA-DRIVEN. A
          # VERSION_GAP is a gap every candidate's READ range establishes (resolve
          # proven_gap_jobs), and at uat/prod it -- wholly or partly -- needs the weakening record
          # as the exception: a named accepter (weakening_authority), a reason and an unexpired
          # YYYY-MM-DD weakening_expires, approved by the GitHub environment's required reviewers.
          # A VERSION_GAP_UNVERIFIED rests on an UNVERIFIED range: it proceeds, recorded loudly,
          # until a seeded corpus makes the range READ. An advisory whose cause is absent or
          # unregistered cannot be shown not to be a gap and is refused at uat/prod. Other causes
          # are unchanged. Vocabulary: assurance-taxonomy.yaml :: advisory_cause,
          # version_gap_ruling. tests/prove_version_gap_production.py.
          # EXACTLY ONE RULING ON EVERY PATH THAT REACHES THIS STEP, refused or not --
          # VERSION_GAP_NOT_ENGAGED where no version-gap rule applied. The posture step reads an
          # EMPTY ruling as "the verdict step never answered" (EVIDENCE_UNTRUSTED), so silence here
          # can never be read as "not engaged" (scripts/trace_assurance_flow.py UNGUARDED).
          ruled=0
          ruling() { echo "version_gap_ruling=$1" >> "$GITHUB_OUTPUT"; ruled=1; }
          not_engaged_unless_ruled() { [ "$ruled" = "1" ] || ruling VERSION_GAP_NOT_ENGAGED; }
          version_gap_ruling() {
            gap=0; unverified=0; unknown=0
            for c in $(printf '%s' "${ADVISORY_CAUSES:-}" | tr ',' ' '); do
              case "$c" in
                VERSION_GAP) gap=1 ;;
                VERSION_GAP_UNVERIFIED) unverified=1 ;;
                COVERAGE_PARTIAL|WEAKENING_ATTRIBUTED|FINDINGS_NOT_BLOCKED|SECRET_EXCEPTION_ATTRIBUTED|KNOWN_EXPLOITED_EXCEPTION_ATTRIBUTED|KEV_UNAVAILABLE) ;;
                *) unknown=1 ;;
              esac
            done
            [ -n "$(printf '%s' "${ADVISORY_CAUSES:-}" | tr -d ', ')" ] || unknown=1
            case "${ENVIRONMENT_TIER:-}" in
              uat|prod) ;;
              *)
                if [ "$gap" = "1" ] || [ "$unverified" = "1" ]; then
                  ruling VERSION_GAP_RECORDED
                  echo "::warning title=Version gap recorded (KDEC-014)::No carried scanner can read the target version. Permitted below uat and recorded."
                fi
                return 0 ;;
            esac
            if [ "$unknown" = "1" ]; then
              ruling ADVISORY_CAUSE_UNKNOWN
              refuse "KDEC-014: the gate verdict is PROCEED_WITH_ADVISORY at ${ENVIRONMENT_TIER}, and its advisory cause is absent or not a registered advisory_cause value (VERSION_GAP, VERSION_GAP_UNVERIFIED, COVERAGE_PARTIAL, WEAKENING_ATTRIBUTED, FINDINGS_NOT_BLOCKED, SECRET_EXCEPTION_ATTRIBUTED). It cannot be shown not to be a version gap. Pass the security gate's advisory_causes output."
            fi
            if [ "$gap" != "1" ]; then
              if [ "$unverified" = "1" ]; then
                ruling VERSION_GAP_UNVERIFIED_RECORDED
                echo "::warning title=VERSION GAP AT ${ENVIRONMENT_TIER}, RECORDED NOT ENFORCED (KDEC-014)::No carried scanner can read the target version, and the gap rests on an UNVERIFIED scanner range. Until a seeded corpus proves that range, ${ENVIRONMENT_TIER} proceeds with this advisory recorded in the posture record and outcome.json; once the range is READ, this deploy is refused without an attributed exception."
                {
                  echo "### Version gap at ${ENVIRONMENT_TIER}: recorded, not enforced (KDEC-014)"
                  echo ""
                  echo "No carried scanner can read the target version, and the gap rests on an UNVERIFIED range. Enforcement turns on when a seeded corpus proves the range (READ); until then this release proceeds with the gap on record."
                } >> "$GITHUB_STEP_SUMMARY"
              fi
              return 0
            fi
            why=""
            [ -n "$(printf '%s' "${WEAKENING_AUTHORITY:-}" | tr -d '[:space:]')" ] ||
              why="no named accepter (weakening_authority)"
            [ -n "$(printf '%s' "${WEAKENING_REASON:-}" | tr -d '[:space:]')" ] ||
              why="${why:+$why; }no reason (weakening_reason)"
            exp="${WEAKENING_EXPIRES:-}"
            if [ -z "$exp" ]; then
              why="${why:+$why; }no expiry (weakening_expires)"
            elif ! printf '%s' "$exp" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' ||
                 [ "$(date -u -d "$exp" +%Y-%m-%d 2>/dev/null)" != "$exp" ]; then
              why="${why:+$why; }an expiry that is not a YYYY-MM-DD calendar date"
            elif [ "$(date -u +%Y-%m-%d)" ">" "$exp" ]; then
              why="${why:+$why; }an exception that expired on $exp"
            fi
            # KDEC-018 item 4: THE EXCEPTION'S HISTORY AND THE RENEWAL CAP. weakening_renews lists this
            # acceptance's PRIOR grants {ticket, approver, from, expires}; more of them than the cap --
            # the stronger of max_exception_renewals and the kit default 2 -- is EXCEPTION_RENEWAL_LIMIT,
            # and a history that cannot be read is not "no history". scripts/exception_history.py holds
            # the same rules; tests/prove_exception_lifecycle.py H6.
            cap=2
            case "${MAX_EXCEPTION_RENEWALS:-}" in 0|1) cap="$MAX_EXCEPTION_RENEWALS" ;; esac
            renewals=0; history="first exception"
            if [ -n "$(printf '%s' "${WEAKENING_RENEWS:-}" | tr -d '[:space:]')" ]; then
              if renewals=$(printf '%s' "$WEAKENING_RENEWS" | jq -e 'if type == "array" and all(.[]; type == "object" and ((keys - ["ticket","approver","from","expires"]) | length) == 0 and ((.ticket // "") | test("^[A-Z][A-Z0-9_]*-[0-9]+$")) and ((.approver // "") | test("[^ ]")) and ((.from // "") | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$")) and ((.expires // "") | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$"))) then length else error("unreadable") end' 2>/dev/null); then
                if [ "$renewals" -gt 0 ]; then
                  history=$(printf '%s' "$WEAKENING_RENEWS" | jq -r 'sort_by(.from) | "previously excepted \(length) time(s) since \(.[0].from), tickets \(map(.ticket) | join(", ")), approvers \(reduce (map(.approver))[] as $a ([]; if index([$a]) then . else . + [$a] end) | join(", "))"')
                fi
                if [ "$renewals" -gt "$cap" ]; then
                  why="${why:+$why; }EXCEPTION_RENEWAL_LIMIT: renewed ${renewals} time(s) and the cap is ${cap} -- endless exceptions are not a thing; close the scanner gap"
                fi
              else
                renewals=unreadable; history=unreadable
                why="${why:+$why; }a renewal history (weakening_renews) that is not a list of prior grants {ticket, approver, from, expires}"
              fi
            fi
            { echo "exception_renewals=${renewals}"; echo "exception_history=${history}"; } >> "$GITHUB_OUTPUT"
            if [ -n "$why" ]; then
              ruling VERSION_GAP_REFUSED
              refuse "KDEC-014: the gate verdict is PROCEED_WITH_ADVISORY caused by a VERSION_GAP (no carried scanner can read the target version, established by READ ranges), and ${ENVIRONMENT_TIER} is a production tier. Close the scanner gap, or record an attributed exception in the weakening record: ${why}. Exception history: ${history}."
            fi
            ruling VERSION_GAP_EXCEPTION_ACCEPTED
            echo "::warning title=Version gap accepted by attributed exception (KDEC-014)::Proceeding at ${ENVIRONMENT_TIER} on a named person's exception (the weakening record), expiring ${exp}, in a GitHub environment whose required reviewers approved this job. Exception history: ${history}. The record is in the posture summary and outcome.json."
            echo "Version-gap exception accepted at ${ENVIRONMENT_TIER}, expiring ${exp}. Exception history: ${history}." >> "$GITHUB_STEP_SUMMARY"
          }
          case "$ROUTING_RESULT" in
            PROCEED)
              ruling VERSION_GAP_NOT_ENGAGED
              echo "verdict_permits=true" >> "$GITHUB_OUTPUT"
              echo "Gate verdict ${ROUTING_RESULT}: the deploy may proceed." ;;
            PROCEED_WITH_ADVISORY)
              version_gap_ruling
              not_engaged_unless_ruled
              echo "verdict_permits=true" >> "$GITHUB_OUTPUT"
              echo "Gate verdict ${ROUTING_RESULT}: the deploy may proceed." ;;
            BLOCKED)
              refuse "Gate verdict BLOCKED: a control refused this release. Nothing was deployed." ;;
            DECISION_REQUIRED)
              refuse "Gate verdict DECISION_REQUIRED: a weakening or exception is in force that nobody has attributed. A decision is owed before this can ship." ;;
            EVIDENCE_UNTRUSTED)
              refuse "Gate verdict EVIDENCE_UNTRUSTED: the evidence for this release could not be relied on. Re-collect it; a deploy may not convert it into a successful state." ;;
            '')
              refuse "There is no gate verdict. routing_result was empty, and no verdict is not a permissive verdict. Pass the gate stage's routing_result output." ;;
            *)
              # Named only when it is a plain token: caller text could otherwise carry a
              # workflow command (`::`) or markup into the annotation and the summary.
              # The WHOLE value, not each line of it: grep matches per line, so a value whose
              # first line is a plain token passed and its second line became a workflow command.
              if [[ "$ROUTING_RESULT" =~ ^[A-Za-z0-9_-]{1,64}$ ]]; then
                shown="'${ROUTING_RESULT}'"
              else
                shown="The supplied value (not echoed: it holds characters outside [A-Za-z0-9_-])"
              fi
              refuse "${shown} is not a registered routing_result value (PROCEED, PROCEED_WITH_ADVISORY, DECISION_REQUIRED, EVIDENCE_UNTRUSTED, BLOCKED). A near-miss spelling is refused, not interpreted." ;;
          esac

      - name: Environment tier and target (refuse before login)
        id: tier
        # DCR section 5 gap 1(a). `slot: ''` sets the image on production, restarts production and
        # only THEN probes it: there is no pre-traffic check and, until reversal exists, no way
        # back. At a production tier that path is refused here, before the deploy identity is
        # even acquired. Proven by tests/prove_deploy_direct_to_production.py.
        run: |
          refuse() {
            echo "::error title=Deploy refused before login::$1"
            printf '### Deploy refused before login\n\n%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          case "$ENVIRONMENT_TIER" in
            sandbox|dev|test|uat|prod) ;;
            *) refuse "environment_tier is not one of the registered tiers (sandbox, dev, test, uat, prod). The consequence of this deploy cannot be judged from an unregistered value." ;;
          esac
          if [ -z "$SLOT" ] && { [ "$ENVIRONMENT_TIER" = "uat" ] || [ "$ENVIRONMENT_TIER" = "prod" ]; }; then
            refuse "slot '' deploys direct to production with no pre-traffic health check, and ${ENVIRONMENT_TIER} is a production tier. Stage into a slot; the swap is what lets the probe run before traffic moves."
          fi
          echo "Tier ${ENVIRONMENT_TIER}, target ${SLOT:-production (direct)}: permitted."

      - name: Validate digest (refuse mutable tags)
        run: |
          d="$IMAGE_DIGEST"
          if ! printf '%s' "$d" | grep -Eq '^sha256:[a-f0-9]{64}$'; then
            echo "::error::image_digest must be a full sha256 digest. Tag-based deploys are not permitted."
            exit 1
          fi
          echo "Deploying immutable reference: ${ACR_LOGIN_SERVER}/${IMAGE_REPOSITORY}@$d"

      - name: Verify the build-provenance attestation (V1, refuse before login)
        id: attestation
        # GENERATED by scripts/inline_deploy_scripts.py from .github/actions/verify-attestation/action.yml -- do not
        # edit here; edit the composite and run `--write`. self-test fails on any drift.
        # P-02 (PROVENANCE_AND_ATTESTATION.md section 6.1): V1 runs IN the deploy, before the
        # point of no return, so no caller deploys an unverified digest by calling this
        # reusable directly. Five outcomes routed by rung (section 6.3); a plan that offers no
        # attestations is HELD (PROCEED_WITH_ADVISORY, IMPLEMENTATION_HELD, gh never called).
        # tests/prove_deploy_attestation.py.
        shell: bash
        env:
          REPO: ${{ github.repository }}
          SIGNER: ${{ inputs.attestation_signer_workflow }}
          RUNG: ${{ inputs.attestation_rung }}
          VISIBILITY: ${{ github.event.repository.visibility }}
          AVAILABLE: ${{ inputs.attestations_available }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # The digest and target this job deploys (after the bind step), never a second copy.
          DIGEST="$IMAGE_DIGEST"
          SUBJECT="${ACR_LOGIN_SERVER}/${IMAGE_REPOSITORY}"
          RUNG="${RUNG:-run}"   # an empty rung reads as the strictest, never as a weaker one
          # KDEC-027: gh's token goes to this run's host only (gh api / -R default to github.com).
          GH_HOST="${GITHUB_SERVER_URL:-https://github.com}"; export GH_HOST="${GH_HOST#*://}"
          case "$RUNG" in crawl|walk|run) ;; *)
            echo "::error title=Unknown rung::'$RUNG' is not crawl, walk or run."; exit 1 ;; esac
          if ! printf '%s' "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error title=Malformed digest::'$DIGEST' is not sha256:<64 hex>."; exit 1
          fi
          debt=""
          # PLAN UNAVAILABILITY IS NOT A MISSING ATTESTATION (section 6.4). Spelled differently,
          # never calls the API, and carried as held debt whose trigger is the plan, not a date.
          if [ "$VISIBILITY" != public ] && [ "$AVAILABLE" != true ]; then
            outcome=ATTESTATION_HELD_BY_PLAN; debt=IMPLEMENTATION_HELD
          elif [ -z "$SIGNER" ]; then
            # No signer to pin: "GitHub signed something" would pass for "the kit's build signed
            # this digest" (section 4.5). The check cannot be performed as specified; gh is not asked.
            outcome=ATTESTATION_NOT_ESTABLISHABLE
          elif ! command -v gh >/dev/null 2>&1; then
            outcome=ATTESTATION_NOT_ESTABLISHABLE
          else
            set +e
            out="$(gh attestation verify "oci://$SUBJECT@$DIGEST" --repo "$REPO" \
                     --signer-workflow "$SIGNER" --deny-self-hosted-runners --format json 2>err.txt)"
            rc=$?
            set -e
            err="$(cat err.txt 2>/dev/null)"; rm -f err.txt
            if [ "$rc" = 0 ]; then
              # Defence in depth: every verified statement must name THIS digest.
              want="${DIGEST#sha256:}"
              if printf '%s' "$out" | jq -e --arg d "$want" \
                   'type == "array" and length > 0 and
                    all(.[]; [.verificationResult.statement.subject[]?.digest.sha256] | index($d))' \
                   >/dev/null 2>&1; then
                outcome=ATTESTATION_VERIFIED
              else
                outcome=ATTESTATION_CONTRADICTED
              fi
            elif printf '%s' "$err" | grep -qiE 'no attestations found|HTTP 404'; then
              outcome=ATTESTATION_ABSENT
            elif printf '%s' "$err" | grep -qiE 'failed to verify|does not match|signature|certificate|mismatch|expected'; then
              outcome=ATTESTATION_CONTRADICTED
            else
              # Unreachable, unauthorised, rate-limited, or something unrecognised: the check could
              # not be performed. Never a pass, never a contradiction.
              outcome=ATTESTATION_NOT_ESTABLISHABLE
            fi
            [ -z "$err" ] || echo "gh: ${err%%$'\n'*}"
          fi
          case "$outcome:$RUNG" in
            ATTESTATION_VERIFIED:*)            route=PROCEED ;;
            ATTESTATION_ABSENT:crawl)          route=PROCEED_WITH_ADVISORY ;;
            ATTESTATION_ABSENT:*)              route=DECISION_REQUIRED ;;
            ATTESTATION_CONTRADICTED:*)        route=BLOCKED ;;
            # Held: neither a permanent stop nor a clean pass -- visible, and owed.
            ATTESTATION_HELD_BY_PLAN:*)        route=PROCEED_WITH_ADVISORY ;;
            *)                                 route=EVIDENCE_UNTRUSTED ;;
          esac
          {
            echo "outcome=$outcome"
            echo "routing_result=$route"
            echo "debt=$debt"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Attestation verification (V1)"
            echo ""
            echo "| subject | outcome | rung | routing |"
            echo "|---|---|---|---|"
            echo "| \`$SUBJECT@$DIGEST\` | **$outcome** | $RUNG | \`$route\` |"
            if [ -n "$debt" ]; then
              echo ""
              echo "> Held, not failed: this repository's plan offers no attestations (PROVENANCE_AND_ATTESTATION.md section 6.4). Debt \`$debt\`; trigger: the plan moves to Enterprise Cloud or the repository is public."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "attestation: $outcome -> $route"
          # The deploy acts on the route: anything but PROCEED or PROCEED_WITH_ADVISORY stops here.
          case "$route" in
            PROCEED|PROCEED_WITH_ADVISORY)
              echo "Attestation V1 ${outcome}: the deploy may proceed (${route})." ;;
            *)
              echo "::error title=Deploy refused before login (V1)::attestation ${outcome} at rung ${RUNG} routes ${route}. The digest about to be deployed is not shown to be the one the kit build signed. Nothing was deployed."
              { echo "### Deploy refused before login (V1)"; echo ""
                echo "${outcome} routes ${route} at rung ${RUNG}."; } >> "$GITHUB_STEP_SUMMARY"
              exit 1 ;;
          esac

      - name: Check this deploy against a rollback of its target (refuse before login)
        id: rollback_check
        # KDEC-023 item 4 (owner, 2026-10-23): "We need to do a dependency check on the incoming
        # deployment to ensure that it isn't reliant on things that were just rolled back and if they
        # are you give a report to the deploying team ... If there are no dependencies on rolled back
        # items then deploy it." The rollback reusable leaves a marker for the target (an artifact,
        # read with actions: read). A deploy built BEFORE that rollback completed is checked: built on
        # a rolled-back commit, shipping a rolled-back image, or declaring a dependency on something
        # the rollback removed or changed -> DEPLOY_REFUSED_ROLLBACK_DEPENDENCY, with the report
        # (summary, annotation, deploy evidence). None -> it proceeds, with the note. A check that
        # cannot be completed refuses (ROLLBACK_DEPENDENCY_CHECK_INCOMPLETE). There is no override:
        # the fix is to correct the deploy. scripts/rollback_hold.py; tests/prove_rollback_dependencies.py D7/D8.
        env:
          DECLARED_DEPENDENCIES: ${{ inputs.declared_dependencies }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          python3 "$RUNNER_TEMP/kit-deploy/rollback_hold.py" check \
            --environment "${DEPLOY_ENVIRONMENT:-}" --resource-group "${RESOURCE_GROUP:-}" \
            --name "${WEBAPP_NAME:-}" --commit "${GITHUB_SHA:-}" --run-id "${GITHUB_RUN_ID:-}" \
            --declared-dependencies "${DECLARED_DEPENDENCIES:-}" \
            --image "${ACR_LOGIN_SERVER:-}/${IMAGE_REPOSITORY:-}@${IMAGE_DIGEST:-}" \
            --out "$RUNNER_TEMP/deploy-evidence/rollback-check.json" \
            --summary "$GITHUB_STEP_SUMMARY"
          rc=$?
          # The outcome the check wrote, read back here so the step itself emits it; none written is
          # INCOMPLETE, never a pass.
          outcome="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("rollback_check") or "")' \
            "$RUNNER_TEMP/deploy-evidence/rollback-check.json" 2>/dev/null || true)"
          [ -n "$outcome" ] || { outcome=ROLLBACK_DEPENDENCY_CHECK_INCOMPLETE; rc=1; }
          echo "rollback_check=${outcome}" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Promotion preflight (refuse before login)
        # KDEC-029 (owner, 2026-10-26). uat and prod are promoted, never deployed from a build
        # (PROMOTION_REFUSED_NO_PREDECESSOR); active DAST against prod is refused
        # (DAST_REFUSED_PRODUCTION_TARGET); break-glass needs an attributed exception that expires
        # within 7 days; the test period is bounded. scripts/promotion.py; tests/prove_promotion.py.
        id: promotion_preflight
        run: python3 "$RUNNER_TEMP/kit-deploy/promotion.py" preflight --adapter appservice

      - name: Install the pinned Trivy (promotion re-scan of the build's SBOM)
        if: inputs.promote_from_run_id != ''
        run: |
          set -euo pipefail
          if trivy --version 2>/dev/null | grep -q 'Version: 0.71.2'; then echo "trivy 0.71.2 present"; exit 0; fi
          # Pinned (ledger L84): the same release and digest as reusable-nvd-cve.yml.
          t=trivy_0.71.2_Linux-64bit.tar.gz
          curl -sSfLO "https://github.com/aquasecurity/trivy/releases/download/v0.71.2/$t"
          echo "0510e71e2fd39bf863856d499c8dc19feb4e7336546394c502a8f5cc7ab27460  $t" | sha256sum -c -
          tar -xzf "$t" trivy && sudo mv trivy /usr/local/bin/ && rm -f "$t"

      - name: Promotion gate -- the source record, its predecessor, the revocations and an SBOM re-scan
        # Reads run Y's record for environment Y, the predecessor's later records (supersession),
        # .security/promotion-revocations.json on the default branch, and the build's SBOM (sha256
        # checked against the record), re-scanned by Trivy at the build gate's thresholds. Never a
        # rebuild, never a registry pull. The verdict is the decide step's.
        id: promotion_collect
        if: inputs.promote_from_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$RUNNER_TEMP/kit-deploy/promotion.py" gate-collect --adapter appservice

      - name: Promotion gate -- known exploited re-check of the re-scan (KDEC-022)
        id: promotion_kev
        if: inputs.promote_from_run_id != ''
        uses: $/.github/actions/known-exploited
        with:
          sarif: ${{ steps.promotion_collect.outputs.rescan_sarif }}
          sarif-job: promotion-rescan

      - name: Promotion gate -- decide (refuse before login)
        id: promotion_gate
        if: inputs.promote_from_run_id != ''
        env:
          KEV_STATE: ${{ steps.promotion_kev.outputs.kev_state }}
          KEV_BLOCKING: ${{ steps.promotion_kev.outputs.kev_blocking }}
          ATTESTATION_OUTCOME: ${{ steps.attestation.outputs.outcome }}
        run: python3 "$RUNNER_TEMP/kit-deploy/promotion.py" gate-decide --adapter appservice

      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        # The hand-off contract vends the identifiers as VARIABLES of this environment (the
        # identity is federated and holds no key); a secret of the same name, when one exists, wins.
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID }}
          environment: ${{ inputs.cloud == 'gov' && 'AzureUSGovernment' || 'AzureCloud' }}

      - name: Target lease -- acquire (KDEC-030, opt-in; refuse before the first capture)
        # The ONE lock the landing-zone apply and this deploy both take (a concurrency group
        # cannot: it is evaluated inside one repository). Held by someone else -> LEASE_HELD,
        # naming the holder, and nothing below runs. docs/architecture/LZ_KIT_SEAM_CONTRACT.md.
        id: lease_acquire
        if: env.KIT_TARGET_LEASE_ACCOUNT != ''
        uses: $/.github/actions/target-lease
        with:
          op: acquire
          account: ${{ env.KIT_TARGET_LEASE_ACCOUNT }}
          cloud: ${{ inputs.cloud }}
          resource-id: /subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ inputs.resource_group }}/providers/Microsoft.Web/sites/${{ inputs.webapp_name }}
          holder: kit-deploy:${{ github.repository }}/${{ github.run_id }}-${{ github.run_attempt }}

      - name: Capture pre-change state (rollback point)
        # DCR gap 4 / L97. App Service captured NOTHING before mutating: the image set below was
        # the first thing to touch the target. previous_state now takes exactly one of three
        # values (EXISTING_DEPLOYMENT, EMPTY measured, UNKNOWN), read from the target slot and
        # from production, and an UNKNOWN fails this step before anything is changed.
        id: before
        run: python3 "$RUNNER_TEMP/kit-deploy/deploy_contract.py" capture --adapter appservice

      - name: Establish rollback capability (before the point of no return)
        # DCR gap 9 / 3.5. Nothing established whether this change could be reversed before
        # making it, and the environment/enforcement axis never reached the deploy. Now
        # rollback_capability (AVAILABLE, UNAVAILABLE, NO_PRIOR_STATE) is decided here, from the
        # captured state and the adapter's mechanism, and at a production tier (uat, prod)
        # UNAVAILABLE refuses BEFORE the first mutation. Lower tiers proceed with the risk
        # recorded in deploy-evidence/capability.json.
        id: capability
        run: python3 "$RUNNER_TEMP/kit-deploy/deploy_contract.py" capability --adapter appservice

      - name: Target lease -- fence and mark the mutation
        # From here to the end step the lease reads `mutating`: a run that dies inside this
        # window is never taken over by a machine (LEASE_ABANDONED_MID_MUTATION).
        id: lease_begin
        if: env.KIT_TARGET_LEASE_ACCOUNT != ''
        uses: $/.github/actions/target-lease
        with:
          op: begin
          what: appservice by digest (${{ github.run_id }})

      - name: Set container image (digest-pinned) and restart
        # DCR gap 6. The change manifest (deploy-evidence/manifest.json) is written as `planned`
        # BEFORE the first mutating call: a MODIFIED entry carrying the captured prior image and
        # the post-state, with the ownership stamp tagged onto the target first.
        id: deploy
        run: python3 "$RUNNER_TEMP/kit-deploy/deploy_contract.py" mutate --adapter appservice

      - name: Verify the intended digest is loaded and healthy (before any traffic move)
        # L101. A 200 from the target is not a digest: someone else's image written to the slot
        # after ours answered 200 and was swapped into production as this run's healthy deploy.
        # Now: read the target's image back from live state and require the intended digest,
        # then probe it. App Service does not expose the running digest of a restarted site;
        # the configured image read back after the restart is the strongest available reading.
        # suppression: FAILURE_ISOLATION_WITH_STATE_CAPTURE -- the outcome is read by the swap,
        # reversal, provenance and report steps, and the last step fails the job on it.
        id: health
        continue-on-error: true
        run: python3 "$RUNNER_TEMP/kit-deploy/deploy_contract.py" verify --adapter appservice

      - name: Target lease -- fence before swap slot into production
        id: lease_fence_move
        if: env.KIT_TARGET_LEASE_ACCOUNT != '' && steps.health.outcome == 'success' && inputs.swap_on_healthy && inputs.slot != ''
        uses: $/.github/actions/target-lease
        with:
          op: fence

      - name: Swap slot into production
        id: swap
        if: steps.health.outcome == 'success' && inputs.swap_on_healthy && inputs.slot != ''
        # Recorded in the change manifest as a REDIRECTION before it is performed.
        run: python3 "$RUNNER_TEMP/kit-deploy/deploy_contract.py" swap --adapter appservice

      - name: Verify the consumer path reaches it
        # DCR 3.1 serving_verified: production's image read back and its public name probed.
        # On a slot staged without a swap, production is deliberately unchanged and this says so.
        # suppression: FAILURE_ISOLATION_WITH_STATE_CAPTURE -- as above.
        id: serving
        continue-on-error: true
        if: steps.health.outcome == 'success'
        env:
          SWAPPED: ${{ steps.swap.outcome }}
        run: python3 "$RUNNER_TEMP/kit-deploy/deploy_contract.py" serving --adapter appservice

      - name: Target lease -- fence before the reversal
        # A stale holder reverses nothing: the change may be someone else's by now.
        id: lease_fence_reversal
        if: "!cancelled() && env.KIT_TARGET_LEASE_ACCOUNT != '' && steps.deploy.outcome == 'success'"
        uses: $/.github/actions/target-lease
        with:
          op: fence

      - name: Reverse this run's changes
        # DCR gaps 1(c) and 5. App Service had NO reversal step: a failed direct deploy left
        # production serving the failed digest. Reversal reads the CHANGE MANIFEST, and each
        # entry is a proposal whose disposition is derived from live state by
        # scripts/derive_reversal_disposition.py (DCR section 8): swap back what this run
        # swapped, restore the captured prior image -- or the measured empty configuration --
        # where the target is still exactly as this run left it. deploy-evidence/reversal.json.
        # suppression: FAILURE_ISOLATION_WITH_STATE_CAPTURE -- a partial reversal is a terminal
        # state the report must describe, so the job continues to the report.
        id: reversal
        continue-on-error: true
        if: >-
          !cancelled() && steps.deploy.outcome == 'success' && inputs.rollback_on_failure &&
          (steps.health.outcome == 'failure' || steps.swap.outcome == 'failure' ||
          steps.serving.outcome == 'failure') &&
          (env.KIT_TARGET_LEASE_ACCOUNT == '' || steps.lease_fence_reversal.outcome == 'success')
        run: python3 "$RUNNER_TEMP/kit-deploy/deploy_contract.py" reverse --adapter appservice

      - name: Target lease -- fence before the provenance stamp
        id: lease_fence_provenance
        if: env.KIT_TARGET_LEASE_ACCOUNT != '' && steps.serving.outcome == 'success' && inputs.version_metadata != ''
        uses: $/.github/actions/target-lease
        with:
          op: fence

      - name: Stamp provenance (after health and a live read)
        # DCR gap 3. Provenance means "this is running and it works". It was stamped as an app
        # setting BEFORE the health probe, so a failed deploy left the target advertising a
        # version that never passed health. Now: only after health (and after the swap, when
        # there is one), only once a fresh live read shows the intended artefact on the target,
        # as tags on the object that serves it. A failed deploy writes nothing.
        id: provenance
        if: steps.serving.outcome == 'success' && inputs.version_metadata != ''
        env:
          SWAPPED: ${{ steps.swap.outcome }}
        run: python3 "$RUNNER_TEMP/kit-deploy/deploy_contract.py" provenance --adapter appservice

      - name: Target lease -- end the mutation (after-fence)
        # MUTATED_WITHOUT_LEASE if the lease was lost while a change was in flight: the change
        # may have landed and the fence cannot recall it. A failed mutate or reversal leaves the
        # lease `mutating` on purpose: the target's state is unknown and a human decides.
        id: lease_end
        if: "!cancelled() && env.KIT_TARGET_LEASE_ACCOUNT != '' && steps.lease_begin.outcome == 'success' && steps.deploy.outcome != 'failure' && steps.reversal.outcome != 'failure'"
        uses: $/.github/actions/target-lease
        with:
          op: end

      - name: Report an unhealthy target
        # DCR gap 1(b). This step was gated on `inputs.slot != ''`, so the only path that printed
        # anything about production was the path that never touched it. Its firing condition is
        # now invariant across both paths; only the TEXT differs, because only the slot path can
        # truthfully say production is untouched. On the direct path what production holds NOW is
        # read back from live state here, after the reversal -- never echoed from the inputs: live
        # run 38879879589 said production "now serves" this run's image while a second actor had
        # replaced it. tests/prove_deploy_outcome.py live_appservice_refused_reversal_is_not_verified.
        if: steps.health.outcome == 'failure'
        run: |
          if [ -n "$SLOT" ]; then
            echo "::warning::Health probe failed on slot '${SLOT}' — no swap performed. Production is untouched."
          else
            python3 "$RUNNER_TEMP/kit-deploy/deploy_contract.py" unhealthy --adapter appservice
          fi

      - name: Check out the repository (its end-to-end tests and DAST configuration)
        if: >-
          steps.serving.outcome == 'success' && inputs.environment_tier != 'prod' &&
          (inputs.e2e_test_command != '' || inputs.dast_command != '')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: End-to-end test period (KDEC-021, KDEC-029)
        # "Tested" part 2. Health and the e2e command at start, at each interval and at the end;
        # any failure fails the period (and this job), never the deploy outcome. Not run at prod.
        id: test_period
        if: "!cancelled() && steps.serving.outcome == 'success'"
        env:
          APP_URL: ${{ steps.serving.outputs.app_url }}
        run: |
          if [ -n "${KIT_TARGET_LEASE_ACCOUNT:-}" ]; then
            # KDEC-030: the period runs HOLDING the target lease, renewed every 180 s (below a
            # third of its 10-minute expiry), so no landing-zone apply lands mid-test. A failed
            # renewal stops the period at once: LEASE_LOST, this step fails, and every later
            # mutating az call of this run is refused (scripts/target_lease.py hold).
            exec python3 "$RUNNER_TEMP/kit-deploy/target_lease.py" hold --every 180 -- \
              python3 "$RUNNER_TEMP/kit-deploy/promotion.py" test-period --adapter appservice
          fi
          exec python3 "$RUNNER_TEMP/kit-deploy/promotion.py" test-period --adapter appservice

      - name: Target lease -- release
        # After the e2e test period, which ran HOLDING the lease (renewed every 180 s). Refused
        # (RELEASE_MID_MUTATION) while the lease still reads `mutating`, and LEASE_LOST if a
        # renewal failed during the period.
        id: lease_release
        if: "!cancelled() && env.KIT_TARGET_LEASE_ACCOUNT != '' && steps.lease_acquire.outcome == 'success'"
        uses: $/.github/actions/target-lease
        with:
          op: release

      - name: DAST baseline against this environment (never prod)
        # "Tested" part 3: DAST where configured (the caller's command; an overlay supplies ZAP
        # baseline through it), no new blocking finding.
        id: dast
        if: "!cancelled() && steps.serving.outcome == 'success'"
        env:
          APP_URL: ${{ steps.serving.outputs.app_url }}
        run: python3 "$RUNNER_TEMP/kit-deploy/promotion.py" dast --adapter appservice

      - name: Security-settings posture (live, passive)
        # "Tested" part 4, and prod's passive check: the target's security settings read back.
        id: target_posture
        if: "!cancelled() && steps.serving.outcome == 'success'"
        run: python3 "$RUNNER_TEMP/kit-deploy/promotion.py" posture --adapter appservice

      - name: Reconcile and report outcome
        id: report
        # DCR gap 2. The summary printed the digest this run TRIED to deploy beside a health
        # cell, with no row that could say what production actually serves. Every identifier is
        # now ATTEMPTED or NOW SERVING, and NOW SERVING is read back from live state --
        # `unknown` when the read fails, never the attempted value.
        if: always()
        env:
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          ATTESTATION_OUTCOME: ${{ steps.attestation.outputs.outcome }}
          ATTESTATION_ROUTE: ${{ steps.attestation.outputs.routing_result }}
          ATTESTATION_DEBT: ${{ steps.attestation.outputs.debt }}
          SERVING_OUTCOME: ${{ steps.serving.outcome }}
          CANCELLED: ${{ job.status == 'cancelled' }}   # cancelled() is not allowed in env: (actionlint)
          VERSION_GAP_RULING: ${{ steps.verdict.outputs.version_gap_ruling }}
          EXCEPTION_RENEWALS: ${{ steps.verdict.outputs.exception_renewals }}
          EXCEPTION_HISTORY: ${{ steps.verdict.outputs.exception_history }}
          SWAPPED: ${{ steps.swap.outcome }}
        # Exit 0 only for DEPLOY_HEALTHY: this step's outcome IS the job's verdict (DCR gap 8).
        run: python3 "$RUNNER_TEMP/kit-deploy/deploy_contract.py" report --adapter appservice

      # ── CONTROL POSTURE RECORD ────────────────────────────────────────────────────────────
      #
      # A WEAKENING IS A GOVERNED EXCEPTION, NOT A BOOLEAN PREFERENCE.
      #
      # This workflow declared weakening inputs and recorded none of them: a caller who switched
      # reversal off, or re-pointed the health probe, was reported exactly like one who deployed
      # at baseline. The enumeration below is TOTAL over this workflow's declared inputs
      # (tests/check_weakening_record.py W1-W7, whose dated exemption for this file is deleted),
      # and the record ROUTES what the deploy did -- by the registered precedence, and never
      # weaker than the gate verdict it was given. A deploy that cannot be reversed at a
      # production tier was already refused by the capability step, so that path is BLOCKED
      # whatever the caller recorded about it. tests/prove_deploy_posture.py.
      #
      # Vocabulary: assurance-taxonomy.yaml :: control_weakening, routing_result.
      - name: Control posture — required, executed, unavailable, reduced, skipped, and who decided
        id: posture
        if: always()
        env:
          # CALLER INPUT ARRIVES AS DATA, NEVER AS SCRIPT TEXT (tests/lint_injection.py).
          W_ROUTING_RESULT: ${{ inputs.routing_result }}
          W_ROLLBACK_ON_FAILURE: ${{ inputs.rollback_on_failure }}
          W_SLOT: ${{ inputs.slot }}
          W_SWAP_ON_HEALTHY: ${{ inputs.swap_on_healthy }}
          W_HEALTH_PATH: ${{ inputs.health_path }}
          W_HEALTH_RETRIES: ${{ inputs.health_retries }}
          W_HEALTH_INTERVAL_SECONDS: ${{ inputs.health_interval_seconds }}
          W_WEAKENING_REASON: ${{ inputs.weakening_reason }}
          W_WEAKENING_AUTHORITY: ${{ inputs.weakening_authority }}
          W_WEAKENING_EXCEPTION_REF: ${{ inputs.weakening_exception_ref }}
          W_WEAKENING_EXPIRES: ${{ inputs.weakening_expires }}
          W_WEAKENING_RENEWS: ${{ inputs.weakening_renews }}
          W_MAX_EXCEPTION_RENEWALS: ${{ inputs.max_exception_renewals }}
          W_ADVISORY_CAUSES: ${{ inputs.advisory_causes }}
          W_GITHUB_ENVIRONMENT: ${{ inputs.github_environment }}
          W_ATTESTATION_RUNG: ${{ inputs.attestation_rung }}
          ATTEST_OUTCOME: ${{ steps.attestation.outcome }}
          ATTEST_ROUTE: ${{ steps.attestation.outputs.routing_result }}
          ATTEST_RESULT: ${{ steps.attestation.outputs.outcome }}
          ATTEST_DEBT: ${{ steps.attestation.outputs.debt }}
          VERSION_GAP_RULING: ${{ steps.verdict.outputs.version_gap_ruling }}
          # What the deploy's own controls established, as data.
          JOB_STATUS: ${{ job.status }}
          BIND_OUTCOME: ${{ steps.bind.outcome }}
          TARGET_BINDING: ${{ steps.bind.outputs.target_binding }}
          VERDICT_OUTCOME: ${{ steps.verdict.outcome }}
          TIER_OUTCOME: ${{ steps.tier.outcome }}
          CAPABILITY_OUTCOME: ${{ steps.capability.outcome }}
          ROLLBACK_CHECK_OUTCOME: ${{ steps.rollback_check.outcome }}
          PREFLIGHT_OUTCOME: ${{ steps.promotion_preflight.outcome }}
          PROMOTION_GATE_OUTCOME: ${{ steps.promotion_gate.outcome }}
          TEST_PERIOD_OUTCOME: ${{ steps.test_period.outcome }}
          DAST_OUTCOME: ${{ steps.dast.outcome }}
          TARGET_POSTURE_OUTCOME: ${{ steps.target_posture.outcome }}
          W_RELEASE_PATH: ${{ inputs.release_path }}
          W_E2E_TEST_COMMAND: ${{ inputs.e2e_test_command }}
          W_E2E_TEST_PERIOD_MINUTES: ${{ inputs.e2e_test_period_minutes }}
          ROLLBACK_CHECK: ${{ steps.rollback_check.outputs.rollback_check }}
          ROLLBACK_CAPABILITY: ${{ steps.capability.outputs.rollback_capability }}
          REPORT_OUTCOME: ${{ steps.report.outcome }}
          DEPLOYMENT_OUTCOME: ${{ steps.report.outputs.deployment_outcome }}
        run: |
          set -u
          req=""; exe=""; skp=""; red=""; wk=""; dead=""; inforce=0; badclass=0

          # AT BASELINE MEANS "AS STRONG AS THIS KIT SHIPS IT".
          #   NONEMPTY  at baseline when any value was supplied
          #   max:N     at baseline when the number is N or below
          #   literal   at baseline on exact equality
          at_baseline() {
            case "$2" in
              NONEMPTY) [ -n "$1" ] ;;
              max:*)    [ -n "$1" ] && [ "$1" -le "${2#max:}" ] 2>/dev/null ;;
              min:*)    [ -n "$1" ] && [ "${1%.*}" -ge "${2#min:}" ] 2>/dev/null ;;
              *)        [ "$1" = "$2" ] ;;
            esac
          }

          # posture <input> <control_weakening class> <baseline> <control> "<value>"
          posture() {
            n="$1"; cls="$2"; base="$3"; ctl="$4"; val="${5-}"; st=WEAKENING_AT_BASELINE
            case "$cls" in
              NOT_A_CONTROL_SURFACE|EXCEPTION_ATTRIBUTION)
                return 0 ;;
              CONTROL_SURFACE_DEAD)
                at_baseline "$val" "$base" || dead="$dead,$n" ;;
              TARGET_NOT_SUPPLIED)
                req="$req,$ctl"
                if at_baseline "$val" "$base"; then exe="$exe,$ctl"; else skp="$skp,$ctl"; fi ;;
              CONTROL_DISABLED)
                req="$req,$ctl"
                if at_baseline "$val" "$base"; then
                  exe="$exe,$ctl"
                else
                  st=WEAKENING_IN_FORCE; skp="$skp,$ctl"; inforce=$((inforce+1))
                fi ;;
              GATE_SOFTENED)
                req="$req,$ctl"; exe="$exe,$ctl"
                at_baseline "$val" "$base" || {
                  st=WEAKENING_IN_FORCE; red="$red,$ctl"; inforce=$((inforce+1)); } ;;
              SCOPE_NARROWED|SEVERITY_RAISED|DEPTH_REDUCED)
                # Different is not provably weaker, and calling it baseline would be the silence
                # this record exists to end -- so it owes a decision.
                req="$req,$ctl"; exe="$exe,$ctl"
                at_baseline "$val" "$base" || {
                  st=CONTROL_RECONFIGURED; red="$red,$ctl"; inforce=$((inforce+1)); } ;;
              *)
                echo "::error title=Unregistered control_weakening class::$cls on input $n is not"
                echo "a term in assurance-taxonomy.yaml. The posture record cannot be trusted."
                badclass=1; return 0 ;;
            esac
            wk="$wk,{\"input\":\"$n\",\"class\":\"$cls\",\"control\":\"$ctl\",\"baseline\":\"$base\",\"value\":\"$val\",\"state\":\"$st\"}"
          }

          posture github_environment      NOT_A_CONTROL_SURFACE - -
          # The gate verdict this deploy was given. The verdict GUARD is the control; this input
          # is what it examines, as the digest is what the digest guard examines.
          posture routing_result          NOT_A_CONTROL_SURFACE - -
          posture controls_unavailable    NOT_A_CONTROL_SURFACE - -
          # What the verdict guard examines beside routing_result (KDEC-014). The exception that
          # lets a proven version gap through at uat/prod is the weakening record below.
          posture advisory_causes         NOT_A_CONTROL_SURFACE - -
          posture resource_group          NOT_A_CONTROL_SURFACE - -
          posture webapp_name             NOT_A_CONTROL_SURFACE - -
          posture acr_login_server        NOT_A_CONTROL_SURFACE - -
          posture image_repository        NOT_A_CONTROL_SURFACE - -
          posture image_digest            NOT_A_CONTROL_SURFACE - -
          posture cloud                   NOT_A_CONTROL_SURFACE - -
          # Where the job runs. The lease (KDEC-030) needs a runner that reaches its private store;
          # the label changes no control, and an unreachable store refuses rather than skips.
          posture runner_label             NOT_A_CONTROL_SURFACE - -
          posture environment_tier        NOT_A_CONTROL_SURFACE - -
          # Can only TIGHTEN the environment-protection demand: the step holds the stronger of it
          # and the kit default (tests/prove_deploy_environment_protection.py), so no value weakens.
          posture deploy_approval         NOT_A_CONTROL_SURFACE - -
          # What the rollback dependency check examines (KDEC-023), as the digest is what the
          # digest guard examines; the check itself always runs and has no override.
          posture declared_dependencies   NOT_A_CONTROL_SURFACE - -
          # slot '' deploys straight to production: the pre-traffic health check -- the probe that
          # runs BEFORE production traffic moves -- does not exist on that path. Refused at uat/prod
          # by the tier guard; at lower tiers it is a control switched off, and recorded as one.
          posture slot                    CONTROL_DISABLED      NONEMPTY        pre-traffic-health "$W_SLOT"
          # Reversal is shipped ON. Off leaves a failed change in place (the outcome report says so).
          posture rollback_on_failure     CONTROL_DISABLED      "true"          reversal           "$W_ROLLBACK_ON_FAILURE"
          # Off stages into the slot and never swaps: production is untouched and the serving
          # verification of production does not run. A deliberate shape, and still a control off.
          posture swap_on_healthy         CONTROL_DISABLED      "true"          production-swap    "$W_SWAP_ON_HEALTHY"
          # What the probe is pointed at. A path that answers 200 for anything proves nothing.
          posture health_path             SCOPE_NARROWED        "/health"       health-probe       "$W_HEALTH_PATH"
          # The threshold at which the deploy is declared failed. More attempts, or a longer wait
          # between them, tolerates an artefact the shipped probe would have failed; fewer is
          # stricter and at baseline. The kit cannot tell patience from hiding, so above the
          # shipped values it owes a decision.
          posture health_retries          SEVERITY_RAISED       "max:18"        health-probe       "$W_HEALTH_RETRIES"
          posture health_interval_seconds SEVERITY_RAISED       "max:10"        health-probe       "$W_HEALTH_INTERVAL_SECONDS"
          posture version_metadata        NOT_A_CONTROL_SURFACE - -
          posture weakening_reason        EXCEPTION_ATTRIBUTION - -
          posture weakening_authority     EXCEPTION_ATTRIBUTION - -
          posture weakening_exception_ref EXCEPTION_ATTRIBUTION - -
          posture weakening_expires       EXCEPTION_ATTRIBUTION - -
          posture weakening_renews        EXCEPTION_ATTRIBUTION - -
          posture max_exception_renewals  EXCEPTION_ATTRIBUTION - -
          # V1 (P-02). The signer and the plan flag say WHAT is verified and WHETHER the plan can;
          # the rung is how hard an absent attestation is refused -- run is the baseline, any other
          # rung is a change from it that someone must own.
          posture attestation_signer_workflow NOT_A_CONTROL_SURFACE - -
          posture attestations_available  NOT_A_CONTROL_SURFACE - -
          # V1 reads an empty rung as run (its strictest), so the record does too.
          W_ATTESTATION_RUNG="${W_ATTESTATION_RUNG:-run}"
          posture attestation_rung        GATE_SOFTENED         "run"           attestation-verify "$W_ATTESTATION_RUNG"

          # KDEC-029. The promotion source and policy are what the gate examines; the gate always
          # runs in promotion mode and has no off switch. A release path other than normal is a
          # change someone owns (break-glass must be attributed before it is accepted at all).
          posture promote_from_run_id      NOT_A_CONTROL_SURFACE - -
          posture promote_from_environment NOT_A_CONTROL_SURFACE - -
          posture promotion_predecessor    NOT_A_CONTROL_SURFACE - -
          posture artifact_identity        NOT_A_CONTROL_SURFACE - -
          W_RELEASE_PATH="${W_RELEASE_PATH:-normal}"
          posture release_path             GATE_SOFTENED         "normal"        promotion-gate     "$W_RELEASE_PATH"
          # No e2e command: the test period is not run and the deploy can never be verified.
          posture e2e_test_command         TARGET_NOT_SUPPLIED   NONEMPTY        e2e-test-period    "$W_E2E_TEST_COMMAND"
          # The input defaults to 15; an absent value reads as that default, as V1 reads an empty rung.
          W_E2E_TEST_PERIOD_MINUTES="${W_E2E_TEST_PERIOD_MINUTES:-15}"
          posture e2e_test_period_minutes  SEVERITY_RAISED       "min:15"        e2e-test-period    "$W_E2E_TEST_PERIOD_MINUTES"
          posture e2e_check_interval_minutes NOT_A_CONTROL_SURFACE - -
          posture e2e_timeout_minutes      NOT_A_CONTROL_SURFACE - -
          # DAST is "where configured" (KDEC-029 decision 3); its absence is in the record.
          posture dast_command             NOT_A_CONTROL_SURFACE - -

          # THE GUARDS BEFORE THE POINT OF NO RETURN ARE CONTROLS TOO. Each is required and
          # executed when it ran -- whether it permitted or REFUSED (a refusal is the control
          # working) -- and absent from the record when an earlier guard stopped the job first.
          ran() {
            case "$2" in success|failure) req="$req,$1"; exe="$exe,$1" ;; esac
          }
          ran target-binding "${BIND_OUTCOME:-}"
          ran gate-verdict "${VERDICT_OUTCOME:-}"
          ran attestation-verify "${ATTEST_OUTCOME:-}"
          ran tier-guard "${TIER_OUTCOME:-}"
          ran rollback-capability "${CAPABILITY_OUTCOME:-}"
          ran rollback-check "${ROLLBACK_CHECK_OUTCOME:-}"
          ran promotion-preflight "${PREFLIGHT_OUTCOME:-}"
          ran promotion-gate "${PROMOTION_GATE_OUTCOME:-}"
          ran e2e-test-period "${TEST_PERIOD_OUTCOME:-}"
          ran dast "${DAST_OUTCOME:-}"
          ran security-settings "${TARGET_POSTURE_OUTCOME:-}"

          # UNAVAILABLE IS NOT CLEAN. Reversal was REQUIRED (the caller did not switch it off)
          # and the capability step established it could not be provided -- no prior state, or a
          # mechanism that is not valid for the observed configuration -- and the deploy went
          # ahead at a lower tier as a recorded risk. Named here so a promotion can see it.
          # A capability step that succeeded and wrote no verdict has established nothing, so
          # its silence reads as UNAVAILABLE, never as available (trace_assurance_flow UNGUARDED).
          unav=""
          if [ "$W_ROLLBACK_ON_FAILURE" = "true" ] && [ "${CAPABILITY_OUTCOME:-}" = "success" ] &&
             [ "${ROLLBACK_CAPABILITY:-UNAVAILABLE}" = "UNAVAILABLE" ]; then
            unav="$unav,reversal"
          fi

          dedupe() {
            printf '%s' "${1#,}" | tr ',' '\n' | sed '/^$/d' | sort -u | tr '\n' ',' | sed 's/,$//'
          }
          REQ="$(dedupe "$req")"; EXE="$(dedupe "$exe")"
          SKP="$(dedupe "$skp")"; RED="$(dedupe "$red")"; UNAV="$(dedupe "$unav")"
          for c in $(printf '%s' "$SKP" | tr ',' ' '); do
            EXE="$(printf '%s' "$EXE" | tr ',' '\n' | grep -vx "$c" | tr '\n' ',' | sed 's/,$//')"
          done

          auth=WEAKENING_AT_BASELINE
          if [ "$inforce" -gt 0 ]; then
            if [ -n "$W_WEAKENING_REASON" ] && [ -n "$W_WEAKENING_AUTHORITY" ]; then
              auth=WEAKENING_ATTRIBUTED
              # AN EXPIRY NOBODY CAN READ HAS NOT "NOT ARRIVED". Anything that is not a valid
              # calendar date reverts to owing a decision, and says why.
              if [ -n "$W_WEAKENING_EXPIRES" ]; then
                if ! printf '%s' "$W_WEAKENING_EXPIRES" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' ||
                   [ "$(date -u -d "$W_WEAKENING_EXPIRES" +%Y-%m-%d 2>/dev/null)" != "$W_WEAKENING_EXPIRES" ]; then
                  echo "::warning title=Unreadable weakening expiry::'$W_WEAKENING_EXPIRES' is not a"
                  echo "YYYY-MM-DD calendar date, so the exception cannot be shown to be in force."
                  auth=WEAKENING_EXCEPTION_EXPIRED
                elif [ "$(date -u +%Y-%m-%d)" ">" "$W_WEAKENING_EXPIRES" ]; then
                  auth=WEAKENING_EXCEPTION_EXPIRED
                fi
              fi
            else
              auth=WEAKENING_UNATTRIBUTED
            fi
          fi

          # ROUTING, by the registered precedence:
          #   BLOCKED > EVIDENCE_UNTRUSTED > DECISION_REQUIRED > PROCEED_WITH_ADVISORY > PROCEED
          # NEVER WEAKER THAN THE GATE VERDICT: a deploy refused on BLOCKED, DECISION_REQUIRED or
          # EVIDENCE_UNTRUSTED carries that verdict forward; a refusal by the tier guard or the
          # capability step (which is where a deploy that cannot be reversed at uat/prod stops)
          # is an OBSERVED refusal, BLOCKED, and outranks any weakening the caller recorded.
          # An outcome the run could not reconcile is evidence nobody can rely on.
          route=PROCEED
          if [ "${VERDICT_OUTCOME:-}" = "failure" ]; then
            case "$W_ROUTING_RESULT" in
              BLOCKED)           route=BLOCKED ;;
              DECISION_REQUIRED) route=DECISION_REQUIRED ;;
              *)                 route=EVIDENCE_UNTRUSTED ;;
            esac
            # KDEC-014: a version gap refused at uat/prod owes a named person's decision.
            if [ "${VERSION_GAP_RULING:-}" = "VERSION_GAP_REFUSED" ]; then route=DECISION_REQUIRED; fi
          elif [ "${ATTEST_OUTCOME:-}" = "failure" ]; then
            # P-02: V1 refused before login; its own route stands (section 6.3), never weakened.
            case "${ATTEST_ROUTE:-}" in
              BLOCKED)           route=BLOCKED ;;
              DECISION_REQUIRED) route=DECISION_REQUIRED ;;
              *)                 route=EVIDENCE_UNTRUSTED ;;
            esac
          elif [ "${ATTEST_OUTCOME:-}" = "success" ] && [ -z "${ATTEST_ROUTE:-}" ]; then
            route=EVIDENCE_UNTRUSTED   # V1 ran and answered nothing: not a verification
          elif [ "${BIND_OUTCOME:-}" = "failure" ] || [ "${TIER_OUTCOME:-}" = "failure" ] ||
               [ "${CAPABILITY_OUTCOME:-}" = "failure" ] || [ "${ROLLBACK_CHECK_OUTCOME:-}" = "failure" ]; then
            route=BLOCKED
          elif [ "${REPORT_OUTCOME:-}" = "failure" ] || [ "${JOB_STATUS:-success}" != "success" ]; then
            case "${DEPLOYMENT_OUTCOME:-}" in
              STATUS_UNTRUSTED|PARTIAL_APPLY|'') route=EVIDENCE_UNTRUSTED ;;
              *)                                 route=BLOCKED ;;
            esac
          elif [ -n "$UNAV" ] || [ "$badclass" = "1" ]; then
            route=EVIDENCE_UNTRUSTED
          elif [ "$auth" = "WEAKENING_UNATTRIBUTED" ] || [ "$auth" = "WEAKENING_EXCEPTION_EXPIRED" ]; then
            route=DECISION_REQUIRED
          elif [ "$inforce" -gt 0 ] || [ "$W_ROUTING_RESULT" = "PROCEED_WITH_ADVISORY" ] ||
               [ "${ATTEST_ROUTE:-}" = "PROCEED_WITH_ADVISORY" ]; then
            route=PROCEED_WITH_ADVISORY
          fi

          # KDEC-014: AN ABSENT RULING IS NOT "NOT ENGAGED". The verdict step writes exactly one
          # registered ruling (VERSION_GAP_NOT_ENGAGED included) on every path that reaches it, so
          # an EMPTY one means it never ran or never finished -- an answer nobody gave, which is
          # evidence nobody can rely on. Never weaker than the precedence above: BLOCKED stands.
          if [ -z "${VERSION_GAP_RULING:-}" ] && [ "$route" != "BLOCKED" ]; then
            route=EVIDENCE_UNTRUSTED
          fi

          emit() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          emit routing_result "$route"
          emit controls_required "$REQ"
          emit controls_executed "$EXE"
          emit controls_unavailable "$UNAV"
          emit controls_reduced "$RED"
          emit controls_skipped "$SKP"
          emit weakenings "[${wk#,}]"
          emit weakening_attribution "$auth"
          emit weakening_record "{\"reason\":\"$W_WEAKENING_REASON\",\"authority\":\"$W_WEAKENING_AUTHORITY\",\"exception_ref\":\"$W_WEAKENING_EXCEPTION_REF\",\"expires\":\"$W_WEAKENING_EXPIRES\"}"

          {
            echo "### Control posture — deploy (App Service)"
            echo ""
            echo "| Row | Value |"
            echo "|---|---|"
            echo "| controls required | \`${REQ:-none}\` |"
            echo "| controls executed | \`${EXE:-none}\` |"
            echo "| controls unavailable | \`${UNAV:-none}\` — required and not provided; NOT the same as clean |"
            echo "| controls reduced | \`${RED:-none}\` |"
            echo "| controls skipped | \`${SKP:-none}\` |"
            echo "| reason | ${W_WEAKENING_REASON:-_(none recorded)_} |"
            echo "| authority | ${W_WEAKENING_AUTHORITY:-_(none recorded)_} |"
            echo "| exception / deferral id | ${W_WEAKENING_EXCEPTION_REF:-_(none recorded)_} |"
            echo "| expiry | ${W_WEAKENING_EXPIRES:-_(no expiry set)_} |"
            echo "| attribution | \`$auth\` |"
            echo "| gate verdict given | \`${W_ROUTING_RESULT:-none}\` |"
            echo "| advisory causes given | \`${W_ADVISORY_CAUSES:-none}\` |"
            echo "| version-gap ruling (KDEC-014) | \`${VERSION_GAP_RULING:-not reported}\` |"
            echo "| GitHub environment | \`${W_GITHUB_ENVIRONMENT:-none}\` — at uat/prod its required reviewers approve the deploy (KDEC-014) |"
            echo "| attestation (V1) | \`${ATTEST_RESULT:-not run}\` routes \`${ATTEST_ROUTE:-none}\`${ATTEST_DEBT:+ — held: \`$ATTEST_DEBT\`, trigger: the plan} |"
            echo "| tier and target binding (B-13) | \`${TARGET_BINDING:-not reported}\` — BOUND: held to the values this environment vends; UNBOUND: it vends none |"
            echo "| rollback dependency check (KDEC-023) | \`${ROLLBACK_CHECK:-not reported}\` -- a deploy built before a rollback of its target, checked for what it took out |"
            if [ "${VERSION_GAP_RULING:-}" = "VERSION_GAP_EXCEPTION_ACCEPTED" ]; then
              echo "| **version-gap exception ACCEPTED** | accepted by ${W_WEAKENING_AUTHORITY}; reason ${W_WEAKENING_REASON}; expires ${W_WEAKENING_EXPIRES} (the weakening record) |"
            fi
            echo "| **routing result** | **\`$route\`** |"
            echo ""
            if [ -n "$dead" ]; then
              echo "> **Dead input(s) set:** \`${dead#,}\` — declared and read by nothing."
              echo ""
            fi
            if [ "${VERSION_GAP_RULING:-}" = "VERSION_GAP_REFUSED" ]; then
              echo "> **A version gap at a production tier (KDEC-014).** Close the scanner gap, or"
              echo "> record a named accepter (\`weakening_authority\`), a reason and an unexpired"
              echo "> \`weakening_expires\`, in an environment whose required reviewers approve."
              echo ""
            elif [ "${VERSION_GAP_RULING:-}" = "VERSION_GAP_UNVERIFIED_RECORDED" ]; then
              echo "> **VERSION GAP AT A PRODUCTION TIER, RECORDED AND NOT ENFORCED (KDEC-014).** The"
              echo "> gap rests on an UNVERIFIED scanner range; enforcement turns on when a seeded"
              echo "> corpus proves it. This release proceeded with the gap on record."
              echo ""
            elif [ "$route" = "DECISION_REQUIRED" ]; then
              echo "> **A weakening is in force and nobody has said why.** Record"
              echo "> \`weakening_reason\` and \`weakening_authority\`, or restore the baseline."
              echo ""
            fi
            if [ -z "${VERSION_GAP_RULING:-}" ]; then
              echo "> **No version-gap ruling was reported (KDEC-014).** The verdict step answers on"
              echo "> every path it reaches; none means it never ran or never finished."
              echo ""
            fi
            if [ "$route" = "EVIDENCE_UNTRUSTED" ]; then
              echo "> **This result cannot be relied on.** The outcome could not be reconciled, the"
              echo "> gate verdict was not usable, or a required control (\`${UNAV:-none}\`) was unavailable."
              echo ""
            fi
            echo "Vocabulary: \`assurance-taxonomy.yaml\` :: \`control_weakening\`, \`routing_result\`."
          } >> "$GITHUB_STEP_SUMMARY"

          printf 'routing_result=%s attribution=%s in_force=%s\n' "$route" "$auth" "$inforce"

      - name: Write the promotion record (KDEC-029)
        # The record promotion verifies and consumes: digest, build provenance, the required
        # predecessor, per-environment test evidence, the environment identity, approval, validity
        # and the live read-back. Written on every path; only a healthy, tested deploy reads
        # verified-for-promotion. schemas/promotion-record.schema.json.
        id: promotion_record
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_OUTCOME: ${{ steps.attestation.outputs.outcome }}
        run: python3 "$RUNNER_TEMP/kit-deploy/promotion.py" record --adapter appservice

      - name: Publish the promotion record
        if: always() && steps.promotion_record.outputs.promotion_record_name != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.promotion_record.outputs.promotion_record_name }}
          path: ${{ runner.temp }}/promotion/record/promotion-record.json
          if-no-files-found: warn
          overwrite: true
          retention-days: 30

      - name: Keep the run record (deploy evidence)
        # The snapshot, change manifest, capability, verification, reversal and outcome files are
        # the record a later recovery reads (ROLLBACK_CONTRACT.md: "the run record is the thing a
        # cancelled run does not finish"). Uploaded on every path, including refusals and
        # cancellation, so it does not die with the runner.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deploy-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deploy-evidence
          if-no-files-found: warn
          retention-days: 30
