          python3 tests/check_artifact_identity.py

      - name: A reversal may not delete what it has not established it owns
        run: |
          # ROLLBACK_CONTRACT.md scopes reversal to a change manifest: remove what this run
          # created, restore what it changed, leave the rest alone. Right, and not sufficient --
          # a manifest records the PAST and a reversal acts on the PRESENT.
          #
          # Release R1 creates resource X. Something else later modifies X or takes a dependency
          # on it. R1's manifest still says "I created X", which is still TRUE and is no longer
          # authority to delete X. The owner's words: you cannot assume the subscription stays
          # empty and let a teardown run without possibly destroying the new state for something
          # that got onboarded in between.
          #
          # So this refuses the SHAPE that permits it: a step that removes a deployed object with
          # no live ownership read before it, no read of the object's current version, a guard
          # that is `always()` rather than a disposition, or a precondition read that swallows
          # its own failure -- the last one being how an unreadable stamp becomes an empty string
          # and an empty string becomes "nobody owns it".
          #
          # SHAPE, NOT BEHAVIOUR. That an ownership comparison is CORRECT needs a live target and
          # a second actor changing state between deploy and reversal. The bad fixtures are
          # single-substring mutations of the PASSING fixture, so a mutant cannot trip for an
          # unrelated reason -- this repository has already shipped a fixture that "proved" a
          # guard whose regex was dead.
          python3 tests/check_reversal_preconditions.py

