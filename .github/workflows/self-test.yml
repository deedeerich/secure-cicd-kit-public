          # EXISTS != CALLED != IN THE PIPELINE, with the kit's own centrepiece on the wrong side.
          # A PARSEABLE FILE IS NOT A RUNNABLE FILE.
          python3 tests/check_workflow_size.py
          # L66: composites and overlay workflows are in scope, measured in the LF bytes GitHub
          # reads. A seeded oversized composite and overlay fail; a CRLF-only overage does not.
          python3 tests/prove_workflow_size_scope.py

      - name: No control bytes in source
        run: |
          # RUN THIS FIRST, BEFORE ANYTHING THAT READS A PATTERN FILE.
          #
          # A shell heredoc turns `\b` in a source string into a literal 0x08 BACKSPACE. The file
          # still compiles and the regex still "works" -- it just matches a backspace character,
          # which nothing contains. It renders as `\b` in an editor, a diff and a terminal, so no
          # amount of reading finds it.
          #
          # This is not hypothetical. On 2026-09-15 five of six patterns added to
          # scripts/export-deny.txt were poisoned this way, and check_export_safety.py reported
          # CLEAN for two days over a neutral core that contained five real violations. A control
          # with dead patterns and a clean repository produce the identical output.
          #
          # Hence the ordering: a disarmed control must fail AS A CONTROL PROBLEM here, rather
          # than pass as a clean result three steps later.
          python3 tests/check_source_hygiene.py

      - name: The neutral core must not name anyone
        run: |
          # scripts/export-deny.txt has listed account identities, private repository names and a
          # former engagement since it was written -- and exactly one thing read it: an export
          # script a human runs by hand. The protection was real and entirely deferred. Nothing
          # failed while the names simply sat in the tree.
