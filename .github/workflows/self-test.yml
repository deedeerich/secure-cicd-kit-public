      - name: A cluster is one obligation to coordinate and several to discharge
        run: |
          # The parent/child work-item model, carried from a prior engagement's ticket engine
          # whose ticket creation was DETERMINISTIC -- a vulnerability class mapped to a ticket
          # and to the corresponding compliance request through a table, with no model and no
          # agent in the path. A reconciler whose output depends on a model cannot be defended to
          # an auditor, and that property is the reason to carry the pattern in.
          #
          # What it fixes here: this kit produced ONE ticket per cluster and no child objects, so
          # a cluster of six findings was six obligations sharing one status and "partially
          # fixed" was not representable. Each finding now has a child task with its own
          # lifecycle, and a parent cannot close while any child is open, deferred or disputed.
          #
          # DEFERRAL DISCIPLINE closes the hole this kit already had. A deferral needs a reason
          # AND an end date, and reopening needs the date to have passed AND a named trigger AND
          # a human approval. This is where the carried pattern is DEPARTED from: the reference
          # engine declared silent reopening forbidden and then reopened past-due items inside
          # its own split routine with the actor recorded as the system. The date passing is a
          # precondition that makes a reopen available; it is never a trigger that performs one.
          #
          # CONFIDENCE IS A LABEL CARRYING ITS DERIVATION, never a number. The reference carried
          # a float defaulting to 0.5, and `epistemic_property.CONFIDENCE` already explains why
          # that is refused -- a figure without provenance is "numerology with an API", and a
          # defaulted one is indistinguishable downstream from a measured one.
          python3 scripts/ticket_model.py --self-test

