          # G-03: the census also counts PROOFS. An unrun proof, one only mentioned in a comment, an
          # unrun --self-test, and a stale or expired UNWIRED entry are each seeded and refused.
          python3 tests/prove_proof_census.py

      - name: A workflow over the size limit does not fail, it never starts
        run: |
          # RUN THIS EARLY. reusable-security.yml crossed 500 KB on 2026-09-16 and GitHub stopped
          # starting it -- zero jobs, a startup failure on every push, for six days, while every
          # check in this repository reported green.
          #
          # Nothing caught it because every check READS the file and none RUNS it: the self-test
