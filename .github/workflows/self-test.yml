          python3 scripts/remediation_sla.py --self-test
          python3 tests/prove_remediation_sla.py

      - name: A ticket may not be created before a lookup establishes nothing is there
        run: |
          # Stage 13 was a document with no code. The kit was being delivered on the promise that
          # a team could respond to tickets and request exceptions, and a grep for any ticket
          # system call -- a REST path, JQL, `gh issue create`, a curl to an issue API -- returned
          # nothing at all.
          #
          # The defect a reconciler ships without these guards is specific and fast: duplicate
          # tickets on every run. ENFORCEMENT_TIERS_AND_FINDING_BASELINE.md section 9.5 states
          # the rule it must follow -- "the pipeline looks up by cluster key before creating
          # anything" -- and the reason it matters, which is that a team learns within a
          # fortnight that the pipeline is noise.
          #
          # The sharper hazard is the one the contract did not anticipate, because it assumed
          # identity worked. Identity extraction currently returns UNFINGERPRINTABLE for findings
          # that should fingerprint. A reconciler that ticketed those anyway would key them on
          # nothing, find nothing next run, and create the whole set again -- every run, forever.
          # So an empty identity withholds the ticket and reports IDENTITY_NOT_ESTABLISHED, which
          # is a state and not a zero.
          #
          # The mutation suite is the part that makes this green worth reading. Ten guards are
          # broken one at a time and the self-test must go red for each; a surviving mutant means
          # that assertion was decorative. It caught one while this was being written -- nothing
          # asserted that clustering refuses to merge across subject classes, so a DEPENDENCY and
          # a RESOURCE finding sharing a CVE would have become one ticket and hidden one of two
          # obligations. It also proves the anti-vacuity abort fires: most assertions here have
          # the form "X creates nothing" and all of them pass trivially against a program that
          # creates nothing at all.
          #
          # NO NETWORK. The backend is in-memory and the child environment is scrubbed of every
          # tracker credential. That neither real backend has ever been exercised against a live
          # tracker is recorded, not implied.
          python3 scripts/reconcile_tickets.py --self-test
          python3 scripts/ticket_reference.py --self-test
          python3 tests/prove_ticket_idempotency.py

