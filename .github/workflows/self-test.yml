name: Self-test

# The kit's own CI. A shared CI library that isn't itself linted is a liability:
# every consumer inherits its defects. This validates syntax, contract shape, and
# the kit's own compliance with the policy gate it ships.

on:
  push:
    branches: [main]
    # Documentation cannot change what the policy gate, profile schema, contract shape or
    # validation-coverage jobs evaluate — they read workflows, actions and the registry.
    # Running six jobs on a docs-only commit buys nothing and costs metered minutes.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  pull_request:
  workflow_dispatch:

# Metered minutes: supersede in-flight runs of this workflow on the same ref instead of
# letting an obsolete run finish at full cost. A private repo pays for every minute.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  yaml-lint:
    name: YAML lint
    runs-on: ubuntu-latest
    # Bounded so a stalled dependency cannot bill six hours (LM-001: unbounded execution
    # converts a dependency failure into uncontrolled cost).
    # NOT YET: a timeout still surfaces as a plain job failure. It SHOULD classify as
    # UNAVAILABLE / EXECUTION_TIMEOUT — cost is bounded here, semantics are not. See
    # docs/roadmap/FUTURE_WORK.md. Do not let this comment imply the mapping exists.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: yamllint
        run: |
          python -m pip install --quiet yamllint
          cat > .yamllint.kit.yml <<'EOF'
          extends: default
          rules:
            line-length: {max: 140, level: warning}
            comments: {min-spaces-from-content: 1}
            truthy: {allowed-values: ["true", "false", "on"]}
            document-start: disable
            # A consumer who enables code scanning from the GitHub UI gets a generated
            # codeql.yml written `branches: [ "main" ]` with sequences at the parent indent.
            # yamllint's DEFAULT preset rejects both. Neither is a security or correctness
            # rule -- they are whitespace preferences -- and GitHub regenerates that file
            # identically every time, so a consumer cannot fix it once. A linter that fails
            # the platform's own supported output is the linter that is wrong, and this kit
            # is unadoptable through the one-click path every customer takes.
            brackets: {max-spaces-inside: 1}
            indentation: {spaces: consistent, indent-sequences: whatever}
          EOF
          yamllint -c .yamllint.kit.yml .github/ profiles/
      - name: yamllint as the local battery runs it (same config, read from the step above)
        # Release 3 went red here with 27 errors no local gate could see: the config existed only
        # in the heredoc above. tests/check_yamllint.py extracts that heredoc, so the two cannot drift.
        run: python3 tests/check_yamllint.py
      - name: Action manifests load on GitHub's parser (no unquoted colon in a flow-mapping value)
        # Run 40007007260: PyYAML read known-exploited/action.yml, GitHub's runner refused it.
        run: python3 tests/check_action_manifest_flow_scalars.py

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    # Bounded so a stalled dependency cannot bill six hours (LM-001: unbounded execution
    # converts a dependency failure into uncontrolled cost).
    # NOT YET: a timeout still surfaces as a plain job failure. It SHOULD classify as
    # UNAVAILABLE / EXECUTION_TIMEOUT — cost is bounded here, semantics are not. See
    # docs/roadmap/FUTURE_WORK.md. Do not let this comment imply the mapping exists.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run actionlint
        run: |
          set -uo pipefail
          # ACQUISITION FAILURE IS NOT A LINT RESULT, and this step could not tell them apart.
          #
          # On 2026-09-21 the download returned 92 bytes instead of a 2.3MB tarball -- `gzip:
          # stdin: not in gzip format` -- and the job failed with exit 2 and no indication that
          # the linter had never run. The asset was fine; the fetch was transient.
          #
          # That conflation is this kit's founding lesson arriving at the kit. `securego/gosec`
          # was pinned to a tag that has never existed, every `docker run` failed at manifest
          # lookup, `|| true` swallowed it, and "the scanner could not be acquired" was recorded
          # as "the scanner found nothing". Here it failed loudly rather than silently, which is
          # the better direction -- but "the linter is unavailable" and "your workflows are
          # invalid" are two different facts and an operator must not have to read the log to
          # tell which one they have.
          #
          # So: retry, verify the binary actually exists and runs, and classify. Three attempts
          # because the observed failure was transient; a persistent one still fails, and it
          # fails saying WHY.
          #
          # PINNED, AND VERIFIED (L84). This fetched an installer script from the actionlint
          # repository's `main` branch, which installed whatever that branch said that day; the
          # first hosted milestone run (2026-10-15) could not acquire it at all. Now: one release,
          # its published checksum, no script from a moving branch.
          v=1.7.7; t=actionlint_${v}_linux_amd64.tar.gz
          acquired=""
          for attempt in 1 2 3; do
            if curl -sfLO "https://github.com/rhysd/actionlint/releases/download/v${v}/${t}" \
               && curl -sfL "https://github.com/rhysd/actionlint/releases/download/v${v}/actionlint_${v}_checksums.txt" \
                    | grep " ${t}$" | sha256sum -c - \
               && tar -xzf "$t" actionlint \
               && [ -x ./actionlint ] && ./actionlint --version >/dev/null 2>&1; then
              acquired=yes
              break
            fi
            echo "::warning title=actionlint acquisition attempt $attempt failed::retrying"
            rm -f ./actionlint
            sleep $((attempt * 5))
          done
          if [ -z "$acquired" ]; then
            echo "::error title=UNAVAILABLE — actionlint could not be acquired::The linter was"
            echo "never obtained after 3 attempts, so NOTHING WAS LINTED. This is an acquisition"
            echo "failure, not a lint failure: it says nothing about whether the workflows are"
            echo "valid. Failure to observe is not an observation."
            exit 1
          fi
          echo "actionlint $(./actionlint --version | head -1) acquired and verified runnable"
          # The kit's own wrapper: every finding fails, except the two exact messages it documents
          # (the `$/` composite form, proven on GitHub; the stale 10-input dispatch rule).
          ACTIONLINT="$PWD/actionlint" python3 tests/check_actionlint.py

  contract-check:
    name: Contract shape
    runs-on: ubuntu-latest
    # Bounded so a stalled dependency cannot bill six hours (LM-001: unbounded execution
    # converts a dependency failure into uncontrolled cost).
    # NOT YET: a timeout still surfaces as a plain job failure. It SHOULD classify as
    # UNAVAILABLE / EXECUTION_TIMEOUT — cost is bounded here, semantics are not. See
    # docs/roadmap/FUTURE_WORK.md. Do not let this comment imply the mapping exists.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate reusable/action contracts
        run: |
          python -m pip install --quiet PyYAML jsonschema
          cat > /tmp/contract.py <<'PYEOF'
          import glob, sys, os
          import yaml

          fail = []

          def note(p, m):
              fail.append(f"{p}: {m}")

          # Every reusable-* workflow must expose a workflow_call contract with documented inputs.
          for p in sorted(glob.glob(".github/workflows/reusable-*.yml")) + sorted(glob.glob(".github/workflows/workflow-policy-check.yml")):
              doc = yaml.safe_load(open(p, encoding="utf-8")) or {}
              on = doc.get("on", doc.get(True)) or {}
              if not isinstance(on, dict) or "workflow_call" not in on:
                  note(p, "must be callable: `on: workflow_call`")
                  continue
              call = on["workflow_call"] or {}
              for name, spec in (call.get("inputs") or {}).items():
                  if not isinstance(spec, dict):
                      note(p, f"input `{name}` is malformed"); continue
                  if not spec.get("description"):
                      note(p, f"input `{name}` has no description")
                  if not spec.get("type"):
                      note(p, f"input `{name}` has no type")
                  if not spec.get("required") and "default" not in spec:
                      note(p, f"optional input `{name}` has no default")
              # Secrets are part of the contract too. This check was ABSENT, which is how
              # nine undocumented secrets shipped past the gate that exists to catch them.
              # A consumer cannot supply a secret correctly if nothing says what it is for.
              for name, spec in (call.get("secrets") or {}).items():
                  if isinstance(spec, dict) and not spec.get("description"):
                      note(p, f"secret `{name}` has no description")
              if doc.get("permissions") is None:
                  note(p, "no top-level `permissions:` declared")

          # Every composite action must declare name/description/runs and document its inputs.
          for p in sorted(glob.glob(".github/actions/*/action.yml")):
              doc = yaml.safe_load(open(p, encoding="utf-8")) or {}
              for k in ("name", "description", "runs"):
                  if not doc.get(k):
                      note(p, f"missing `{k}`")
              if (doc.get("runs") or {}).get("using") != "composite":
                  note(p, "`runs.using` must be `composite`")
              for name, spec in (doc.get("inputs") or {}).items():
                  if not isinstance(spec, dict) or not spec.get("description"):
                      note(p, f"input `{name}` has no description")

          # Every action directory must be named after its action.yml location.
          for d in sorted(glob.glob(".github/actions/*")):
              if os.path.isdir(d) and not os.path.exists(os.path.join(d, "action.yml")):
                  note(d, "action directory has no action.yml")

          if fail:
              print("Contract violations:")
              for f in fail:
                  print(f"  - {f}")
              sys.exit(1)
          print("All reusable-workflow and composite-action contracts are well-formed.")
          PYEOF
          python /tmp/contract.py

  profile-schema:
    name: Profile schema
    runs-on: ubuntu-latest
    # Bounded so a stalled dependency cannot bill six hours (LM-001: unbounded execution
    # converts a dependency failure into uncontrolled cost).
    # NOT YET: a timeout still surfaces as a plain job failure. It SHOULD classify as
    # UNAVAILABLE / EXECUTION_TIMEOUT — cost is bounded here, semantics are not. See
    # docs/roadmap/FUTURE_WORK.md. Do not let this comment imply the mapping exists.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate profiles against schema
        run: |
          python -m pip install --quiet PyYAML jsonschema
          python - <<'PYEOF'
          import glob, json, sys
          import yaml, jsonschema

          schema = json.load(open("profiles/profile.schema.json", encoding="utf-8"))
          bad = 0
          for p in sorted(glob.glob("profiles/*.yml")):
              doc = yaml.safe_load(open(p, encoding="utf-8"))
              try:
                  jsonschema.validate(doc, schema)
                  print(f"  ok  {p}")
              except jsonschema.ValidationError as e:
                  bad += 1
                  print(f"  ERR {p}: {e.message} (at {'/'.join(str(x) for x in e.path)})")
          sys.exit(1 if bad else 0)
          PYEOF

  normalizer-drift:
    name: Normalizer drift
    runs-on: ubuntu-latest
    # Bounded so a stalled dependency cannot bill six hours (LM-001). RAISED 10 -> 15 on 2026-10-15:
    # run 38811959160 took 7m29s, and the three install/registry proofs added that day (real pip
    # venvs, npm, a local registry with a syft download) are estimated at 2-3 minutes more. Still a
    # bound, not a budget: a job that needs the full fifteen has a stalled dependency.
    # RAISED 15 -> 30 on 2026-10-21, from measurements, not estimates: the job grew with every
    # proof wired that day (L-E census, L-B composite equivalence, L-C1 corpora, L-D deploy, L-PHP).
    # 12m52s on a re-run of 39658855303, 14m09s on 39659025182, then cut off at 15m06s on
    # 39694056635 (cancelled, every step that had run had passed). Thirty is twice the measured
    # time; if it needs more, split the job rather than raise it again.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the clean-tree sweep below runs check_context_current.py, which resolves
          # the commit .context says it was reconciled against. A depth-1 checkout holds only the
          # PR merge commit, so the check refused on the private repo (Release 3 re-cut, run
          # 39985896367, job 120524861777) while passing locally and on the source-only mirror.
          fetch-depth: 0
      - name: Inlined normalizer must match the canonical source
        run: |
          set -euo pipefail
          # The SARIF normalizer is inlined into the reusable workflow, because `uses: ./` does not
          # resolve for a cross-repo consumer -- the same reason 14 Azure gitleaks rules once
          # silently never loaded. Inlining means COPIES, and copies drift: this kit has already
          # shipped a fix applied to a probe but not the workflow, and a tag bumped in one place and
          # not another. So the copies are GENERATED and this check fails if any has diverged.
          # It also fails when a bundled script imports anything the bundle cannot satisfy (L61).
          python3 scripts/inline_normalizer.py --check
          python3 tests/prove_bundle_import_closure.py

      - name: The pinned script digest must be the digest the bootstrap job produces
        run: |
          set -euo pipefail
          # ONE sha256 IS PINNED AT FOURTEEN DOWNLOAD SITES, and it is DERIVED: the generator
          # right-strips every emitted line, YAML strips the block scalar's indent, and bash's
          # heredoc writes what survives. A digest computed by re-implementing those three
          # transformations is a second implementation of them -- wrong in both places at once,
          # agreeing with itself perfectly, and first heard about as fourteen jobs refusing the
          # bundle on a live dispatch.
          #
          # So this does not recompute. It extracts the bootstrap job's own two steps from the
          # workflow AS SHIPPED, RUNS them, and compares. A parseable file is not a runnable
          # file, and a derived constant is not a verified one.
          python3 tests/prove_kit_script_digests.py

      - name: The digest proof must leave the shared /tmp as it found it
        run: |
          set -euo pipefail
          # The proof above runs the bootstrap step in the REAL /tmp and once ended by deleting
          # that whole directory -- on a runner, every other step's files; under MSYS, the
          # operator's Temp folder. This runs the proof against a sandboxed stand-in holding a file
          # the proof never wrote, and fails if that file, or a displaced one, does not survive.
          python3 tests/prove_digest_proof_spares_tmp.py

      - name: The pinning tools must cover composite actions and accept $/
        run: |
          set -euo pipefail
          # Decomposition Phase 2 moves scanner steps, and the images they pin, into composites.
          # A pin checker that reads only workflows would lose every one of them in the move.
          python3 tests/prove_pin_scope_covers_composites.py
          # The resolver writes the EXACT release beside each SHA and pins every owner by default,
          # so its output passes check_action_pins.py (offline: a local API stand-in).
          python3 -m pip install --quiet PyYAML
          python3 tests/prove_pin_actions_names_release.py

      - name: Every pinned image and action ref must resolve
        env:
          # Refs resolve by git against github.com with no token (KDEC-027). The token is used for
          # the REST fallback ONLY when GITHUB_API_URL is api.github.com: on a GHE.com data-residency
          # tenant it was issued by api.<tenant>.ghe.com and is never sent to api.github.com.
          # UNKNOWN is never PASS, and an UNKNOWN step is a red step.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The run's token stays on the host that issued it; refs resolve through git (no network).
          python3 tests/prove_github_token_stays_on_its_host.py
          # No step writes external text into $GITHUB_OUTPUT/$GITHUB_ENV unsanitised: an API error
          # body crashed the resolve step on a GHE.com tenant, and a newline is output injection.
          python3 tests/check_output_writes.py
          # The whole kit on a simulated GHE.com host: GH_HOST on every gh step, no api.github.com
          # with a token, no github.com/<repo> links, no trivy-action/setup-trivy, and the resolve
          # step degrades on a tenant API error instead of crashing (H6 runs it under bash).
          python3 tests/prove_ghe_host.py
          # A Go scanner image tag that never existed was pinned for two weeks behind a green job
          # (FUTURE_WORK §11); an action ref that never existed shipped the same way (§9). This
          # checker was written for the first and could not see `v`-prefixed tags or `uses:` refs
          # until 2026-10-14 (L23). Now it resolves every image and every third-party action ref in
          # workflows and composites, after a self-test proving it can still say NO to a tag that
          # does not exist.
          python3 tests/check_pinned_artifacts.py
          # The pin checker's own scope proof: v-prefixed tags and third-party action refs are in
          # it; ./, $/, docker:// and comments are not. Existed and ran nowhere (ledger G-03).
          python3 tests/prove_pin_check_sees_v_tags_and_action_refs.py

      - name: Every remote uses is a commit SHA naming its exact release (L82)
        env:
          # --online resolves the tag each comment names by git (KDEC-027); the token is used only
          # as a REST fallback on a github.com run. UNKNOWN is a red step.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The kit's own tree carried 161 remote `uses:` by tag until the L-H sweep. Workflows,
          # job-level reusable calls, composites and templates; no owner exempt; the `# vX.Y.Z`
          # comment must be the release that SHA is. A Dependabot bump moves both together.
          python3 -m pip install --quiet PyYAML
          python3 tests/check_action_pins.py --online

      - name: A bootstrap failure must not read as thirteen inapplicable scanners
        run: |
          set -euo pipefail
          # Every scanner declares `needs: kit-scripts`. If that job fails, GitHub SKIPS all
          # thirteen -- and the gate projects `skipped` into NOT_APPLICABLE. Thirteen
          # NOT_APPLICABLE rows over code nobody scanned is the strongest-looking green this
          # workflow can produce, and no static check in this repository can see it: they prove
          # the gate DEPENDS on each job, not what it DECIDES when a dependency dies.
          #
          # This runs the gate's own script with its dependencies forced, under advisory_mode
          # as well as without it -- advisory_mode being the switch a first-time adopter is
          # most likely to have on, and the one that used to turn this exact case green.
          python3 tests/prove_bootstrap_failure.py

      - name: Every security job must be registered, and the gate must read every one it waits for
        run: |
          set -euo pipefail
          # The denominator (scanner-registry.yaml). Waiting for a job is not enforcing on it:
          # image-scan once sat in the gate's needs and was never read. Decomposition Phase 2
          # moves jobs into composites one at a time, and this must stay green after each move.
          python3 tests/check_scanner_registry.py

      - name: A scanner job moved into a composite must expand to exactly the job it replaced
        run: |
          set -euo pipefail
          # Ledger L64: each moved job's `$/` composite, expanded back into the job with its
          # inputs substituted, has the canonical digest the job had before the move -- every
          # step, condition, artefact name and SARIF category -- and nothing in the composite
          # reads a context a composite does not have.
          python3 tests/prove_composite_move_equivalence.py

      - name: The reporter must run where the report job runs it, with only what reaches that job
        run: |
          set -euo pipefail
          # C1: the reporter imports two identity modules the bootstrap bundle never shipped, and
          # every proof imported it from scripts/, where they sit beside it. This runs it the way
          # the report job does -- from the bundle or through the composite -- and nowhere else.
          python3 tests/prove_report_runs_as_shipped.py
          # The reporter's own self-test (a scanner that did not run never reports 0; unparseable
          # output is not clean; a hollow scan prints its witness). Ran nowhere (ledger G-03).
          python3 scripts/scan_report.py --self-test
          # A hollow scan must not read clean, and a clean bandit run (rules: [], KDEC-008 OD-2)
          # must. Unwired until 2026-10-16, while it defended the rule OD-2 retired.
          python3 tests/prove_hollow_scan.py
          python3 tests/prove_hollow_scan.py --self-test

      - name: A secret finding must fail the secret-scan job in every mode
        run: |
          set -euo pipefail
          # The gate blocks secrets before advisory_mode -- but it can only block what the
          # secret-scan job reports. This runs that job's Enforce step under both modes.
          python3 tests/prove_secrets_always_block.py

      - name: assurance_state must follow the findings evidence, not job conclusions
        run: |
          set -euo pipefail
          # Softened enforcement (soft_fail_sast, advisory_mode) lets a job succeed WITH findings,
          # and a job that failed BECAUSE it found something is FINDINGS, not UNAVAILABLE. The
          # reporter publishes blocking findings per job; the gate reads them.
          python3 tests/prove_report_counts_findings.py
          python3 tests/prove_gate_reads_findings.py

      - name: The report must publish identify() results as a file, not only as prose
        run: |
          set -euo pipefail
          # L52. The cascade, correlation and the ledger's only write authority consume identify()
          # records, and nothing published them -- the identity was computed on every finding and
          # rendered as a hex string in a markdown bullet. This runs the reporter over three
          # scanners and reads the file back through finding_match and finding_correlation.
          python3 tests/prove_report_emits_findings.py

      - name: The reporter must call the identity libraries, not sit beside them
        run: |
          set -euo pipefail
          # L44/L45/L46/L48 wiring. Correlation on durable identity (anchored tier only, never the
          # (uri, rule) key), the rule family through the alias table with refusal when it
          # disagrees, the cascade against a per-environment ledger, and EVIDENCE_UNTRUSTED
          # published for the identity claim with the blocking count untouched.
          python3 tests/prove_report_wires_identity.py

      - name: The report job must read the ledger from history, with every input as data
        run: |
          set -euo pipefail
          # L45 wiring. fetch-depth 0 on the report checkout and no depth limit on the composite's
          # fetch (a shallow boundary hides the merge base the reader needs); baseline_ledger.py
          # invoked with every value a variable; `environment` declared with no default and
          # handed through to the reporter; identity_routing and baseline_state published.
          python3 tests/prove_report_job_reads_ledger.py

      - name: The propose-ledger job can push one ref -- its proposal branch -- and nothing else
        run: |
          set -euo pipefail
          # L45 / SINGLE_PIPELINE_TARGET.md section 9.3. The only write authority in the design,
          # held structurally: runs after the gate on default-branch non-PR runs only, exactly
          # contents+pull-requests write at job level, one allowed `git push` form behind a
          # branch guard, the run's own token. Then the pushing step is run against a throwaway
          # remote: the proposal branch arrives, main never moves, and main/release/1 as BRANCH
          # are refused.
          python3 tests/prove_propose_ledger_job_scope.py
          # F-01: the shipped reusable's steps, run in order against a throwaway remote. No ledger
          # and no approver role refuses with the reason as a workflow output; a role without
          # CODEOWNERS over the ledger refuses; a role with it opens an ESTABLISH pull request and
          # the default branch never moves; an existing ledger proposes normally.
          python3 tests/prove_propose_ledger_establishment.py
          # T-20: the ticket ledger proposal the ticket job uploads joins the same pull request
          # (one write path): a changed one lands at .security/ticket-ledger.json, an unchanged one
          # adds nothing, a malformed one refuses.
          python3 tests/prove_propose_ledger_ticket_ledger.py

      - name: A disposition suppresses only to the schema, and on the durable key
        run: |
          set -euo pipefail
          # L49 / KDEC-008 OD-6. The claim is disposition_type and only state=approved buys
          # passage; an absent expiry is invalid, not open-ended; the reporter and the linter read
          # one schema. Dispositions key on the durable identity; the legacy fingerprint is
          # honoured inside the 30-day window and refused after it, with the run naming the key.
          python3 tests/prove_disposition_schema_and_key.py

      - name: A malformed SARIF is one UNPARSEABLE row and takes no other scanner with it
        run: |
          set -euo pipefail
          # L06. Valid JSON that is not SARIF-shaped raised out of the parser; in batch mode the
          # report died and every scanner's evidence went with it. Three malformed shapes through
          # parse_sarif, then the reporter over two broken scanners and one sound one.
          python3 tests/prove_malformed_sarif_isolated.py

      - name: No expression may use `cond && <falsy> || x`, which always yields x
        run: |
          set -euo pipefail
          # `scan_git_history && 0 || 1` was always 1, so a requested full-history secret scan
          # read one commit.
          python3 tests/lint_falsy_ternary.py

      - name: The gate's evidence pointer must name the artifact the report uploads
        run: |
          set -euo pipefail
          python3 tests/prove_evidence_artifact_named.py

      - name: Lint findings must fail the code-quality job when enforcement is on
        run: |
          set -euo pipefail
          # Runs the job's own Ruff and ESLint steps against seeded and clean fixtures.
          python3 tests/prove_code_quality_enforces.py

      - name: The toolchain composites must install from a fixture and report what they installed
        run: |
          set -euo pipefail
