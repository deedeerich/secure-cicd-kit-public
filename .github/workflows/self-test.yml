          python3 tests/prove_custody_overlays.py

      - name: Every overlay this copy carries proves itself
        run: |
          set -euo pipefail
          python3 -m pip install --quiet PyYAML
          # An overlay's own proofs ran nowhere: its Jira caller and its crawl behaviour were a
          # reading of the YAML. Each overlay ships its proofs under overlays/<name>/tests/; every
          # one is run here, by glob, so this file names no overlay. A neutral copy carries none,
          # and says so rather than passing silently.
          shopt -s nullglob
          n=0
          for t in overlays/*/tests/*.py; do
            case "$(basename "$t")" in _*) continue ;; esac
            echo "::group::$t"
            python3 "$t"
            echo "::endgroup::"
            n=$((n+1))
          done
          echo "overlay proofs run: $n (zero means this copy carries no overlay)"

