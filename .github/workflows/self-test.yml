          # DOCUMENTED and ENFORCED are two rungs apart, and the gap is invisible from the inside:
          # a control nobody runs looks identical to a control with nothing to find. A sweep on
          # 2026-09-15 found 89 line hits across 19 neutral files naming one employer's tooling and
