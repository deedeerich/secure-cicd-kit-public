    # converts a dependency failure into uncontrolled cost).
    # NOT YET: a timeout still surfaces as a plain job failure. It SHOULD classify as
    # UNAVAILABLE / EXECUTION_TIMEOUT — cost is bounded here, semantics are not. See
    # docs/roadmap/FUTURE_WORK.md. Do not let this comment imply the mapping exists.
    timeout-minutes: 20
    steps:
      # BEGIN FETCH_KIT_SCRIPTS — generated by scripts/inline_normalizer.py. DO NOT EDIT HERE.
      - name: Fetch the kit's own scripts
        # A RUN-SCOPED ARTIFACT, NOT `uses: ./` and NOT a copy per call site. Why, at
        # length, in the `kit-scripts` job at the top of this file.
        if: always()
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kit-scripts-${{ github.run_attempt }}
          path: /tmp
      - name: Verify the kit scripts against their pinned digest
        # A DOWNLOADED SCRIPT NOBODY VERIFIED IS A SUPPLY CHAIN STEP WITH NO INTEGRITY
        # CHECK. Why this digest and not a manifest fetched beside it: `kit-scripts`.
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp
          echo "77747346d57de23c8a301758499db36f89f41e3850a2495497d2983a6cb3916a  kit-scripts.sha256" | sha256sum -c -
          sha256sum -c kit-scripts.sha256
      # END FETCH_KIT_SCRIPTS
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go_version }}
      - name: gosec
        id: gosec
        env:
          # CALLER INPUT ARRIVES AS DATA, NEVER AS SCRIPT TEXT (ledger L38).
          IN_PATHS: ${{ inputs.paths }}
        run: |
          set -uo pipefail
          # NEVER ASSUME go.mod IS AT THE REPOSITORY ROOT. setup-go's cache looked only at the
          # root and failed the job outright on a nested module. gosec then ran ./... from the
          # root, ignoring `paths` entirely.
          scope="${IN_PATHS}"; [ -d "$scope" ] || scope="."
          # A repository can contain several Go modules. Scanning only the first is coverage
          # that stops wherever the sort order happens to land, while still reporting success.
          # 8 levels, the bound discovery searches (W4K-120; was 6). Deeper is declared, not absent.
          find "$scope" -maxdepth 8 -name go.mod -not -path '*/vendor/*' | sort > .go-mods.txt
          n=$(wc -l < .go-mods.txt)
          if [ -n "$(find "$scope" -mindepth 9 -not -path '*/vendor/*' -print -quit 2>/dev/null)" ]; then
            echo "::warning title=COVERAGE_GAP - beyond depth 8::Go modules deeper than 8 levels under '$scope' were not enumerated or scanned."
          fi
          if [ "$n" -eq 0 ]; then
            echo "::notice title=No Go module::No go.mod under '$scope'."
            echo "COVERAGE=NOT_APPLICABLE — absence of a language is reported, never inferred."
            exit 0
          fi
          echo "Go modules discovered: $n"

          # ACQUISITION FAILURE IS NOT ZERO FINDINGS.
          #
          # This step pinned securego/gosec:2.28.0 -- A TAG THAT HAS NEVER EXISTED. Upstream stops
          # at 2.24.x. Every `docker run` failed at manifest lookup, `|| true` swallowed it, and
          # "the scanner could not be acquired" was recorded as "the scanner found nothing." The
          # job went green with no SARIF while a seeded G401/G204 fixture sat unscanned.
          #
          # The bitter part: that pin was introduced BY a staleness fix. Reaching forward for a
          # current version landed on a version that does not exist, and nothing checked, because
          # acquisition had no failure path -- only execution did. The kit already names this state
          # DEPENDENCY_ACQUISITION_UNAVAILABLE and enforces it for cppcheck; gosec was exempt by
          # omission, which is how exemptions usually happen.
          #
          # Acquire ONCE, before the loop, and let the failure land somewhere.
          GOSEC_IMAGE='securego/gosec:2.24.6'
          if ! docker image inspect "$GOSEC_IMAGE" >/dev/null 2>&1; then
            if ! timeout 300 docker pull -q "$GOSEC_IMAGE"; then
              echo "::error title=DEPENDENCY_ACQUISITION_UNAVAILABLE::Could not acquire $GOSEC_IMAGE."
              echo "The scanner was never obtained, so nothing was analysed. This is NOT zero findings,"
              echo "and posture for Go cannot be established from this run."
              echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          fi
          echo "gosec image acquired: $GOSEC_IMAGE"
          echo "### Go modules scanned ($n)" >> "$GITHUB_STEP_SUMMARY"
          # `go install gosec@latest` couples the SCANNER to the CONSUMER's Go version:
          # gosec now requires Go >= 1.25.8, this kit defaults go_version 1.22, and the install
          # failed outright. Nobody should have to upgrade their toolchain to run a security
          # scanner. Run it from its own container, pinned, exactly as gitleaks is handled.
          #
          # THE PRECONDITION IS STATED BECAUSE IT IS STILL LIVE. The container carries its own
          # Go toolchain, so the kit's `go_version` does not gate gosec's INSTALL -- but a module
          # whose `go` directive is newer than the toolchain inside the image will fail to LOAD,
          # and a load failure is the exact condition the rest of this comment exists to catch.
          _load_failures=0
          # -no-fail WAS REMOVED, AND THIS IS THE WHOLE REASON THIS COMMENT IS LONG.
          #
          # gosec documents three outcomes:
          #     0   scan finished without unsuppressed findings OR ERRORS
          #     1   at least one unsuppressed finding OR A PROCESSING ERROR
          #    -no-fail  always return 0
          #
          # So `-no-fail` does not separate detection from enforcement. It erases the difference
          # between "found nothing" and "could not read your code" -- and gosec's SARIF writer
          # never populates `Invocations`, so the error leaves no trace in the report either. A
          # package that failed to load produced an empty, well-formed SARIF, exit 0, and a green
          # job: COLLECTION_FAILED wearing CLEAN's clothes, which is this kit's founding defect.
          #
          # Detection is still separated from enforcement -- by the `gosec — enforce` step below,
          # which is where that decision belongs. What is NOT deferred is the question of whether
          # the scanner could read the code at all. Exit 1 with a report and findings is
          # DETECTION. Exit 1 with no findings is a PROCESSING ERROR by gosec's own definition,
          # because a finding is the only other thing that produces a 1.
          while read -r mod; do
            dir=$(dirname "$mod")
            _mod_counted=0   # a module is counted as failed at most once, whichever path finds it
            echo "::group::gosec $dir"
            echo "- \`$dir\`" >> "$GITHUB_STEP_SUMMARY"
            # KEEP CURRENT. This was pinned at 2.21.4 -- seven minor versions behind upstream
            # when audited 2026-08-19. A stale scanner is not a neutral choice: it silently
            # stops detecting whatever was added since. This kit already learned the
            # expensive version of that lesson, when a three-major drift in Dependency-Check
            # meant calling a retired NVD endpoint. Nothing here checks drift yet.
            # Continuation-then-comment defect -- see the note at the C# scanner. `docker run`
            # was executing with NO gosec arguments at all: no -fmt, no -out, no ./... . The
            # container started, did nothing useful, wrote no SARIF, and exited 0. This is the
            # defect the seeded `sast:go-gosec` signal caught as WRONG-TOOL on 2026-09-02.
            #
            # THE EXIT CODE IS CAPTURED, NOT DISCARDED, AND NOT THROUGH A PIPE.
            #
            # `|| true` threw away the one signal gosec gives. `| tee` would have thrown away
            # the same thing more expensively -- a pipeline reports the LAST command's status,
            # so the scanner's verdict becomes tee's. A plain assignment, and then a decision.
            #
            # suppression: EXPECTED_NEGATIVE_RESULT -- gosec exits 1 when it FINDS something, which is not
            # an error. The rc is preserved in _rc and disambiguated three lines below against the report
            # gosec wrote: findings come with a report, a processing error does not.
            # discards: nothing. The status is bound to _rc and consumed immediately.
            # preserved_by: the _rc/report cross-check below, which raises DEPENDENCY_ACQUISITION_UNAVAILABLE
            # preserved_by: style load failure as a counted error rather than letting it read as clean
            _rc=0
            docker run --rm -v "$PWD/$dir":/src -w /src "$GOSEC_IMAGE" \
              -fmt sarif -out /src/gosec.sarif ./... || _rc=$?
            # EXIT 1 WITH NOTHING FOUND IS A PROCESSING ERROR, BY GOSEC'S OWN DEFINITION.
            #
            # 1 means "at least one unsuppressed finding OR a processing error". If the report is
            # absent, or present and empty, then no finding explains the 1 -- so the code did not
            # parse. That module contributed no coverage, and the merged report below would
            # otherwise absorb it into a total that reads as a clean scan of every module.
            if [ "$_rc" -ne 0 ]; then
              _found=0
              if [ -s "$dir/gosec.sarif" ]; then
                _found=$(jq '[.runs[].results[]] | length' "$dir/gosec.sarif" 2>/dev/null || echo 0)
              fi
              if [ "$_found" -eq 0 ]; then
                _load_failures=$((_load_failures + 1))
                echo "::error title=COLLECTION_FAILED::gosec exited $_rc on '$dir' with no"
                echo "findings to explain it. By gosec's documented exit codes that is a"
                echo "PROCESSING ERROR -- most often a module whose Go directive is newer than"
                echo "the toolchain in $GOSEC_IMAGE. This module was NOT analysed, and an"
                echo "unanalysed module is not a clean one."
                echo "- \`$dir\` — **COLLECTION_FAILED** (gosec rc=$_rc, no findings)" >> "$GITHUB_STEP_SUMMARY"
                _mod_counted=1
              fi
            fi
            # A MODULE MAY NOT LEAVE THE MERGE WITHOUT SAYING SO (ledger L08). Three paths used to
            # drop one silently: exit 0 with NO report (the 2026-09-02 shape -- a container that
            # did nothing), a report that is not readable SARIF (the normaliser then fails and the
            # merge never sees a file), and a merge that skips what it cannot parse. Each left a
            # count over fewer modules than were discovered, read as complete.
            # tests/prove_gosec_modules.py runs all three beside a real module.
            _mod_bad=""
            if [ ! -s "$dir/gosec.sarif" ]; then
              [ "$_rc" -eq 0 ] && _mod_bad="gosec exited 0 and wrote no report"
            elif ! jq -e '.runs | type == "array"' "$dir/gosec.sarif" >/dev/null 2>&1; then
              _mod_bad="its report is not readable SARIF"
            fi
            if [ -n "$_mod_bad" ] && [ "${_mod_counted:-0}" = "0" ]; then
              _load_failures=$((_load_failures + 1))
              echo "::error title=COLLECTION_FAILED::'$dir': $_mod_bad. This module was NOT analysed."
              echo "- \`$dir\` — **COLLECTION_FAILED** ($_mod_bad)" >> "$GITHUB_STEP_SUMMARY"
              _mod_counted=1
            fi
            # gosec's working directory is the MODULE, so every URI it emits is module-relative:
            # `go/vuln.go` and `services/worker/vuln.go` both arrive as `vuln.go`. Two different
            # files then share one identity, which breaks annotation, finding history, and any
            # later correlation — two modules would merge as one finding. Re-root HERE, while
            # $dir is still known: the merged filename cannot carry it back, because `/` -> `_`
            # is lossy. A scanner that reports the wrong path is a scanner you cannot act on.
            # FETCHED ON PURPOSE. A reusable workflow runs against the CALLER's checkout, so a
            # helper under scripts/ does not exist at consumer runtime — the same way the Azure
            # gitleaks rules silently never loaded. Referencing the kit's own repo to fetch it
            # would hardcode an owner, which is its own portability defect. So the normalizer is
            # written ONCE by the kit-scripts job and reaches this job as a run-scoped artifact.
            if [ -f "$dir/gosec.sarif" ] && [ -z "$_mod_bad" ]; then
              out="gosec-$(echo "$dir" | tr '/' '_').sarif"
              # A MISSING NORMALIZER IS NOT A NORMALIZED REPORT. The script arrives from the
              # run-scoped kit-scripts artifact; if it did not, paths stay module-relative and two
              # different files share one identity, which breaks annotation and correlation silently.
              if [ ! -s /tmp/normalize_sarif.py ]; then
                echo "::error title=Normalizer absent::/tmp/normalize_sarif.py did not reach this job."
                echo "Scanner paths cannot be re-rooted, and a report with the wrong paths is a report"
                echo "you cannot act on. This is not a clean result."
                exit 1
              fi
              # One canonical normalizer, fetched once per run and invoked here. It is
              # GENERATED into the kit-scripts job -- self-test fails if it drifts from
              # scripts/normalize_sarif.py, or if it is ever inlined more than once.
              if ! python3 /tmp/normalize_sarif.py "$dir/gosec.sarif" "$out" "$dir"; then
                rm -f "$out"
                if [ "${_mod_counted:-0}" = "0" ]; then
                  _load_failures=$((_load_failures + 1))
                  echo "::error title=COLLECTION_FAILED::'$dir': its report could not be normalised. NOT analysed."
                  _mod_counted=1
                fi
              fi
              # suppression: EXPECTED_NEGATIVE_RESULT -- this scanner exits nonzero when it FINDS something,
              # which is not an error. Detection is separated from enforcement here; the count step downstream
              # distinguishes 'found nothing' from 'produced no report' and emits COLLECTION_FAILED for the
              # latter.
              # discards: this scanner's non-zero exit, which means FINDINGS rather than malfunction
              # preserved_by: the count step distinguishes an absent report from an empty one and emits
              # preserved_by: COLLECTION_FAILED for the former; the enforce step refuses an absent count
              rm -f "$dir/gosec.sarif" || true   # root-owned; rm needs the dir, not the file
            fi
            echo "::endgroup::"
          done < .go-mods.txt

          # Merge every module's SARIF into one report. Merging RUNS preserves each module's
          # provenance — findings are never collapsed together, which matters for correlation.
          _mrc=0
          python3 - <<'MERGE_PY' || _mrc=$?
          import glob, json
          runs, skipped = [], 0
          for f in sorted(glob.glob("gosec-*.sarif")):
              try:
                  runs += json.load(open(f, encoding="utf-8")).get("runs", [])
              except Exception as e:
                  print(f"::error title=COLLECTION_FAILED::{f} could not be merged: {e}")
                  skipped += 1
          if runs:
              json.dump({"version": "2.1.0",
                         "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
                         "runs": runs},
                        open("gosec.sarif", "w", encoding="utf-8"))
              print(f"merged {len(runs)} gosec run(s) into gosec.sarif")
          raise SystemExit(3 if skipped else 0)
          MERGE_PY
          # A FILE THE MERGE SKIPPED IS A MODULE THE COUNT DOES NOT COVER.
          [ "$_mrc" -eq 0 ] || _load_failures=$((_load_failures + 1))
          # A PARSE FAILURE IS NOT ZERO FINDINGS.
          #
          # This was `jq ... 2>/dev/null || echo 0`, so a missing, truncated or malformed report
          # produced n=0 -- which the gate reads as CLEAN. The taxonomy already had a word for
          # exactly this (COLLECTION_FAILED: "an empty but well-formed result is indistinguishable
          # from a clean scan") while the code did the opposite. Found by auditing the class after
          # the same defect turned up in discovery, not by reading this line.
          if [ ! -s gosec.sarif ]; then
            echo "::error title=COLLECTION_FAILED::gosec.sarif was not produced."
            echo "An ABSENT report is not zero findings. Posture cannot be established from this run."
            echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          # VALIDITY ROWS 1-6, ON THE RUNNER, BEFORE PUBLICATION (ledger L02; PIPELINE_ORDERING 4.5):
          # results absent (did not attempt), no run, an error-level tool notification or
          # executionSuccessful false is COLLECTION_FAILED -- never a count of zero, and never
          # published as a clean scan. Per-tool profile, not a hollow-rules rule (KDEC-008 OD-2).
          if ! _v=$(python3 /tmp/sarif_validity.py --tool gosec gosec.sarif 2>&1); then
            echo "::error title=COLLECTION_FAILED::$_v"
            echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if ! n=$(jq '[.runs[].results[]] | length' gosec.sarif 2>&1); then
            echo "::error title=COLLECTION_FAILED::gosec.sarif is not valid SARIF."
            echo "jq said: $n"
            echo "A PARSE FAILURE is not zero findings."
            echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          # A COUNT OVER MODULES THAT WOULD NOT LOAD IS A COUNT WITH A HOLE IN IT.
          #
          # The merge above is happy to produce a valid, parseable, well-formed report from three
          # modules when there were five, and `n` would then be a true statement about a
          # denominator nobody was shown. If any module failed to load, the count is not a
          # posture claim -- it is a partial one, and the taxonomy has a word for that which is
          # not PASS.
          if [ "$_load_failures" -gt 0 ]; then
            echo "::error title=COLLECTION_FAILED::$_load_failures Go module(s) did not analyse."
            echo "The findings that WERE collected still stand and are published. What did not"
            echo "analyse stays unknown: this run does not establish Go posture."
            echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
            echo "count=${n//[$'\r\n']/ }" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "count=${n//[$'\r\n']/ }" >> "$GITHUB_OUTPUT"
          echo "gosec findings: $n"

      - name: gosec — enforce
        id: gosec_enforce
        if: always()
        env:
          # CALLER INPUT ARRIVES AS DATA, NEVER AS SCRIPT TEXT (ledger L38).
          IN_SOFT_FAIL_SAST: ${{ inputs.soft_fail_sast }}
          IN_ADVISORY_MODE: ${{ inputs.advisory_mode }}
        run: |
          n='${{ steps.gosec.outputs.count }}'
          # COLLECTION_FAILED IS NOT ZERO FINDINGS -- AND THIS STEP RUNS ON always().
          #
          # The counting step above correctly refuses to turn a missing or malformed report
          # into n=0, and exits non-zero. But `if: always()` means THIS step still runs, reads
          # an output that was never written, and ${n:-0} quietly supplies the very zero the
          # step above refused to invent -- announcing GATE=PASS one line after the failure was
          # detected. Each side assumed the other had handled it. Check explicitly.
          collection='${{ steps.gosec.outputs.collection }}'
          if [ "$collection" = "COLLECTION_FAILED" ]; then
            echo "::error title=COLLECTION_FAILED::Evidence could not be collected."
            echo "Posture CANNOT be established from this run. This is not a clean result."
            exit 1
          fi
          if [ -z "${n:-}" ]; then
            echo "::error title=COLLECTION_FAILED::No count was produced by the scan step."
            echo "An ABSENT measurement is not a measurement of zero."
            exit 1
          fi
          # Findings go to the gate (findings_state), which enforces by the resolved policy (O-24).
          if [ "${n:-0}" -gt 0 ] && [ "${IN_SOFT_FAIL_SAST}" != "true" ] && [ "${IN_ADVISORY_MODE}" != "true" ]; then
            echo "findings_state=FINDINGS" >> "$GITHUB_OUTPUT"
            echo "::warning title=gosec::${n} finding(s). ANALYSIS=COMPLETE -- handed to the security gate, which decides by the resolved policy."
            exit 0
          fi
          echo "ANALYSIS=COMPLETE GATE=PASS (${n:-0} finding(s))"
      # Findings must survive whether or not this repo has code scanning. Uploading to the
      # Security tab is a PUBLICATION channel, not the finding itself — free on public repos,
      # otherwise Advanced Security. Treating it as mandatory turned successful scans into
      # failed jobs on every private repo without GHAS.
      - name: gosec — is there anything to publish?
        if: always()
        id: sarif_gosec
        run: |
          # No SARIF usually means no applicable source (gosec on a repo with no Go). That is
          # a legitimate outcome, not a failure, and previously crashed the upload step.
          if [ -s "gosec.sarif" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=gosec: nothing to publish::No SARIF at 'gosec.sarif' — no applicable source files. Not a failure."
          fi
      # BEGIN REDACT_STEP — generated by scripts/inline_normalizer.py. DO NOT EDIT HERE.
      - name: Redact credential material before upload
        if: always()
        shell: bash
        run: |
          # ORDER IS THE WHOLE CONTROL: this runs immediately before an upload, and
          # again before every later upload that follows a step which may have written
          # output -- a redactor after the upload protects nothing while looking exactly
          # like protection (N24/WP19). The sweep itself is ONE canonical script --
          # scripts/redact_all.sh, written by the `kit-scripts` job and fetched into
          # /tmp by every other -- because fourteen copies of one wrapper are how this
          # file reached 608.8 KB and stopped starting.
          #
          # A MISSING TOOL IS NOT A CLEAN RESULT. If the bundle did not arrive,
          # publication must not proceed on the strength of a scrub that never ran.
          if [ ! -s /tmp/redact_all.sh ]; then
            echo "::error title=Redaction could not be guaranteed::/tmp/redact_all.sh is absent."
            echo "The kit-scripts artifact did not reach this job, so no SARIF was scrubbed"
            echo "and none may be published. A MISSING TOOL IS NOT A CLEAN RESULT."
            exit 1
          fi
          bash /tmp/redact_all.sh
      # END REDACT_STEP
      - name: gosec — keep SARIF as an artifact
        if: always() && steps.sarif_gosec.outputs.exists == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-gosec-${{ github.run_attempt }}
          path: gosec.sarif
          retention-days: 30
          if-no-files-found: warn
      - name: gosec — publish to the Security tab where available
        id: cs_gosec
        if: always() && steps.sarif_gosec.outputs.exists == 'true'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: gosec.sarif
          category: gosec
      - name: gosec — state plainly if publication degraded
        if: always() && steps.sarif_gosec.outputs.exists == 'true' && steps.cs_gosec.outcome != 'success'
        run: |
          # Loud, never silent. An empty Security tab is indistinguishable from a clean
          # codebase, and that ambiguity is how a control becomes false assurance.
          echo "::warning title=gosec: NOT published to the Security tab::Code scanning is"
          echo "unavailable here (free on public repos, otherwise GitHub Advanced Security)."
          echo "The scan SUCCEEDED and the gate still enforces on these findings."
          echo "Retrieve them from the 'sarif-gosec' artifact."

      # BEGIN STATUS_STEP — generated by scripts/inline_normalizer.py. DO NOT EDIT HERE.
      - name: Result summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          # A SUMMARY IS NOT A VERDICT. If the script did not arrive, say so and stop;
          # never fail the job for it. A housekeeping step deciding a security verdict
          # is how a scan that had SUCCEEDED went red twice in this file's history.
          if [ ! -s /tmp/scan_status.sh ]; then
            echo "::warning title=Result summary unavailable::/tmp/scan_status.sh did not reach this job."
            echo "No per-job summary was printed. The scan's own verdict stands."
            exit 0
          fi
          . /tmp/scan_status.sh
          if [ "$JOB_STATUS" = "success" ]; then _e=COMPLETE; else _e=FAILED; fi
          scan_status "SAST (Go)" "$_e" "" "go"
      # END STATUS_STEP

  sast-cpp:
    needs: [discover, kit-scripts]
    # DISCOVERED, NOT DECLARED. Runs because roots for this ecosystem were actually
    # found in the caller's scope -- not because a selector named it. On failure
    # discovery turns everything on rather than producing a tidy row of NOT_APPLICABLE.
    if: needs.discover.outputs.cpp == 'true'
    name: SAST (C / C++)
    runs-on: ubuntu-latest
    outputs:
      # FINDINGS when this job's own threshold fired and no caller input softened it; '' otherwise.
      # The job does not fail on it: the security gate enforces it by the resolved policy (O-24).
      findings_state: ${{ steps.scan.outputs.findings_state }}
      # KDEC-026: PARTIAL / CPP_ANALYSIS_PARTIAL when any C/C++ source had no build metadata.
      scan_state: ${{ steps.scan.outputs.scan_state }}
      scan_reason: ${{ steps.scan.outputs.scan_reason }}
    # Bounded so a stalled dependency cannot bill six hours (LM-001: unbounded execution
    # converts a dependency failure into uncontrolled cost).
    # NOT YET: a timeout still surfaces as a plain job failure. It SHOULD classify as
    # UNAVAILABLE / EXECUTION_TIMEOUT — cost is bounded here, semantics are not. See
    # docs/roadmap/FUTURE_WORK.md. Do not let this comment imply the mapping exists.
    timeout-minutes: 20
    steps:
      # THE STEP BODIES RUN FROM THE KIT, NOT FROM THIS FILE (ledger L64; decomposition step 12).
      # `$/` delivers the whole kit at the caller's pinned commit. The composite is this job's
      # FIRST step and carries the fetch, both analyzers, the redactions and the uploads in their
      # old order, so every artefact name, annotation and SARIF category is what it was inline.
      # tests/prove_composite_move_equivalence.py holds that; the Result summary stays here
      # because it reads `job.status`, which is the job's fact, not the composite's.
      - name: SAST (C / C++)
        id: scan
        uses: $/.github/actions/sast-cpp
        with:
          paths: ${{ inputs.paths }}
          soft_fail_sast: ${{ inputs.soft_fail_sast }}
          advisory_mode: ${{ inputs.advisory_mode }}
  # ------------------------------------------------- known-malicious packages
  # CVE scanning finds VULNERABLE packages. This finds COMPROMISED ones —
  # typosquats, hijacked maintainer accounts, backdoored releases. OSV carries
  # OpenSSF Malicious Packages advisories (MAL-*), which CVE feeds do not.

      # BEGIN STATUS_STEP — generated by scripts/inline_normalizer.py. DO NOT EDIT HERE.
      - name: Result summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          # A SUMMARY IS NOT A VERDICT. If the script did not arrive, say so and stop;
          # never fail the job for it. A housekeeping step deciding a security verdict
          # is how a scan that had SUCCEEDED went red twice in this file's history.
          if [ ! -s /tmp/scan_status.sh ]; then
            echo "::warning title=Result summary unavailable::/tmp/scan_status.sh did not reach this job."
            echo "No per-job summary was printed. The scan's own verdict stands."
            exit 0
          fi
          . /tmp/scan_status.sh
          if [ "$JOB_STATUS" = "success" ]; then _e=COMPLETE; else _e=FAILED; fi
          scan_status "SAST (C/C++)" "$_e" "" "c / c++"
      # END STATUS_STEP

  image-scan:
    # kit-scripts: the redactor that runs before these reports are uploaded lives in its bundle.
    needs: [discover, kit-scripts]
    # Only when an image is supplied. Nothing to infer: either a caller names an artifact to
    # scan or there is no artifact, and "no image configured" is NOT_APPLICABLE rather than a
    # scan that found nothing.
    if: inputs.image_ref != ''
    name: Container image (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      # success / failure of the secrets step. The gate reads `failure` as a SECRET finding, which
      # advisory_mode never softens. Empty when the job did not run.
      secret_state: ${{ steps.img_secret.outcome }}
      # FINDINGS when the vulnerability threshold fired and advisory_mode did not soften it; ''
      # otherwise. The job does not fail on it: the security gate enforces it by the policy (O-24).
      findings_state: ${{ steps.trivy_image_enforce.outputs.findings_state }}
    permissions:
      contents: read
      security-events: write
    steps:
      # BEGIN FETCH_KIT_SCRIPTS — generated by scripts/inline_normalizer.py. DO NOT EDIT HERE.
      - name: Fetch the kit's own scripts
        # A RUN-SCOPED ARTIFACT, NOT `uses: ./` and NOT a copy per call site. Why, at
        # length, in the `kit-scripts` job at the top of this file.
        if: always()
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kit-scripts-${{ github.run_attempt }}
          path: /tmp
      - name: Verify the kit scripts against their pinned digest
        # A DOWNLOADED SCRIPT NOBODY VERIFIED IS A SUPPLY CHAIN STEP WITH NO INTEGRITY
        # CHECK. Why this digest and not a manifest fetched beside it: `kit-scripts`.
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp
          echo "77747346d57de23c8a301758499db36f89f41e3850a2495497d2983a6cb3916a  kit-scripts.sha256" | sha256sum -c -
          sha256sum -c kit-scripts.sha256
      # END FETCH_KIT_SCRIPTS
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # TWO STEPS, BECAUSE THE TWO FINDING CLASSES ARE ENFORCED DIFFERENTLY.
      # This was one step with `scanners: vuln,secret` and an exit code that advisory_mode set to
      # 0 -- so a credential baked into the image passed in advisory mode, against the kit's rule
      # that secrets block in every mode (START-HERE; ENFORCEMENT_TIERS section 1.1). Vulnerabilities
      # follow advisory_mode; secrets never do. Proven by tests/prove_image_scan_enforces.py, and
      # the gate reads the secrets outcome (job output `secret_state`) as a secret, not as an
      # ordinary failed scanner.
      # TRIVY IS INSTALLED, NOT SET UP BY AN ACTION (KDEC-027): aquasecurity/trivy-action's
      # setup-trivy checks out `aquasecurity/trivy` against github.server_url, which on a GHE.com
      # tenant does not have it. Release binary from github.com, pinned by version and sha256
      # (ledger L84); the database cached per day, as the action did.
      - name: Install Trivy (pinned release binary)
        id: trivy_install
        shell: bash
        run: |
          set -euo pipefail
          v=0.71.2
          if [ "$(trivy --version 2>/dev/null | sed -n 's/^Version: //p' | head -n 1)" != "$v" ]; then
            t="trivy_${v}_Linux-64bit.tar.gz"
            d="$(mktemp -d)"
            curl -sSfL --retry 3 --connect-timeout 20 -o "$d/$t" \
              "https://github.com/aquasecurity/trivy/releases/download/v${v}/$t"
            echo "0510e71e2fd39bf863856d499c8dc19feb4e7336546394c502a8f5cc7ab27460  $d/$t" | sha256sum -c -
            tar -xzf "$d/$t" -C "$d" trivy
            sudo install -m 0755 "$d/trivy" /usr/local/bin/trivy
            rm -rf "$d"
          fi
          trivy --version | head -n 1
          echo "TRIVY_CACHE_DIR=$RUNNER_TEMP/trivy-cache" >> "$GITHUB_ENV"
          echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Trivy database cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy-cache
          key: trivy-db-${{ runner.os }}-${{ steps.trivy_install.outputs.day }}
          restore-keys: trivy-db-${{ runner.os }}-
      - name: Trivy image (vulnerabilities)
        shell: bash
        env:
          # Each TRIVY_* is the option trivy-action@v0.36.0 passed for the `with:` key it replaced.
          IMAGE_REF: ${{ inputs.image_ref }}
          TRIVY_SCANNERS: vuln
          # --ignore-unfixed is deliberately NOT set. A vulnerability with no fix available is
          # still a vulnerability in the thing you are about to run; hiding it turns a risk
          # decision into a silent one. Suppression belongs in the disposition register where
          # it is attributable and expires, not in a scanner flag.
          #
          # REPORT EVERYTHING, DECIDE ELSEWHERE (ledger L17). trivy-action ignored `severity:`
          # for a SARIF and then applied `exit-code` to every severity, so fail_on_severity never
          # held here either. Trivy reports all; the count and enforce steps below apply it.
          TRIVY_EXIT_CODE: '0'
          TRIVY_FORMAT: sarif
          TRIVY_OUTPUT: trivy-image.sarif
        run: trivy image --quiet "$IMAGE_REF"
      - name: Trivy image (secrets)
        id: img_secret
        # Runs even when the vulnerability step failed: a vulnerable image can also carry a
        # credential, and the second finding must not hide behind the first.
        if: always()
        shell: bash
        env:
          IMAGE_REF: ${{ inputs.image_ref }}
          TRIVY_SCANNERS: secret
          # Every severity, and never advisory: a secret is a secret at any rating.
          TRIVY_EXIT_CODE: '1'
          TRIVY_FORMAT: sarif
          TRIVY_OUTPUT: trivy-image-secret.sarif
        run: trivy image --quiet "$IMAGE_REF"
      # THE EVIDENCE IS RETAINED (ledger L12, KNOWN_GAPS section 1). Both reports were written and
      # then died with the runner: no redaction, no artifact, no publication. Each now gets the four
      # steps every scanner job has -- redaction (generated, placed before each upload), the
      # artifact, the Security-tab publication, and a plain statement when publication degraded.
      # tests/prove_image_scan_retains.py checks the order and runs the redaction over a real
      # Trivy secret report.
      - name: Trivy image — count findings at the blocking severities
        id: trivy_image_count
        if: always()
        env:
          FAIL_ON: ${{ inputs.fail_on_severity }}
          REPORT: trivy-image.sarif
        run: |
          set -uo pipefail
          cf() {
            echo "::error title=COLLECTION_FAILED::$1 An absent or unreadable report is not zero findings."
            echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
            exit 1
          }
          [ -s "$REPORT" ] || cf "$REPORT was not produced."
          jq -e '(.runs | type == "array") and (.runs | length > 0) and all(.runs[]; (.results | type) == "array")' \
            "$REPORT" >/dev/null 2>&1 || cf "$REPORT is not SARIF with a results array."
          want=",$(printf '%s' "$FAIL_ON" | tr 'a-z' 'A-Z' | tr -d ' '),"
          # VALIDITY ROWS 1-6, ON THE RUNNER, BEFORE PUBLICATION (ledger L02; PIPELINE_ORDERING 4.5):
          # results absent (did not attempt), no run, an error-level tool notification or
          # executionSuccessful false is COLLECTION_FAILED -- never a count of zero, and never
          # published as a clean scan. Per-tool profile, not a hollow-rules rule (KDEC-008 OD-2).
          if ! _v=$(python3 /tmp/sarif_validity.py --tool trivy "$REPORT" 2>&1); then
            echo "::error title=COLLECTION_FAILED::$_v"
            echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if ! n=$(jq --arg want "$want" '[.runs[] | ((.tool.driver.rules // []) | map({key: .id, value: ([(.properties.tags // [])[] | select(. == "CRITICAL" or . == "HIGH" or . == "MEDIUM" or . == "LOW" or . == "UNKNOWN")] | first // "UNKNOWN")}) | from_entries) as $sev | .results[] | ($sev[.ruleId] // "UNKNOWN") as $s | select($want | contains("," + $s + ","))] | length' "$REPORT" 2>&1); then
            cf "$REPORT could not be counted: $n"
          fi
          echo "count=${n//[$'\r\n']/ }" >> "$GITHUB_OUTPUT"
          echo "Trivy image findings at ${FAIL_ON}: $n of $(jq '[.runs[].results[]] | length' "$REPORT") reported"
      - name: Trivy image — enforce
        id: trivy_image_enforce
        if: always()
        env:
          N: ${{ steps.trivy_image_count.outputs.count }}
          COLLECTION: ${{ steps.trivy_image_count.outputs.collection }}
          ADVISORY_MODE: ${{ inputs.advisory_mode }}
          FAIL_ON: ${{ inputs.fail_on_severity }}
        run: |
          if [ "${COLLECTION:-}" = "COLLECTION_FAILED" ] || [ -z "${N:-}" ]; then
            echo "::error title=COLLECTION_FAILED::No Trivy image count. An ABSENT measurement is not a measurement of zero."
            exit 1
          fi
          # Vulnerabilities go to the gate (findings_state), which enforces by the resolved policy
          # (O-24). A secret in the image still fails this job: the secrets step above, every mode.
          if [ "$N" -gt 0 ] && [ "$ADVISORY_MODE" != "true" ]; then
            echo "findings_state=FINDINGS" >> "$GITHUB_OUTPUT"
            echo "::warning title=Trivy image::${N} finding(s) at ${FAIL_ON} -- handed to the security gate, which decides by the resolved policy."
            exit 0
          fi
          echo "Trivy image: ${N} finding(s) at ${FAIL_ON} (advisory=${ADVISORY_MODE})"
      # THE SECRET REPORT IS HELD TO THE SAME ROWS BEFORE IT IS PUBLISHED (ledger L02; flagship
      # lane report row 10). Its verdict is the secrets step's own exit (secret_state, read by the
      # gate in every mode); this step establishes that the document behind that verdict is a
      # report of a run -- an absent or hollow one is COLLECTION_FAILED, never "no secrets".
      - name: Trivy image secrets — count findings
        id: trivy_image_secret_count
        if: always()
        env:
          REPORT: trivy-image-secret.sarif
        run: |
          set -uo pipefail
          cf() {
            echo "::error title=COLLECTION_FAILED::$1 An absent or unreadable report is not zero findings."
            echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
            exit 1
          }
          [ -s "$REPORT" ] || cf "$REPORT was not produced."
          # VALIDITY ROWS 1-6, ON THE RUNNER, BEFORE PUBLICATION (ledger L02; PIPELINE_ORDERING 4.5):
          # results absent (did not attempt), no run, an error-level tool notification or
          # executionSuccessful false is COLLECTION_FAILED -- never a count of zero, and never
          # published as a clean scan. Per-tool profile, not a hollow-rules rule (KDEC-008 OD-2).
          if ! _v=$(python3 /tmp/sarif_validity.py --tool trivy "$REPORT" 2>&1); then
            echo "::error title=COLLECTION_FAILED::$_v"
            echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if ! n=$(jq '[.runs[].results[]] | length' "$REPORT" 2>&1); then
            cf "$REPORT could not be counted: $n"
          fi
          echo "collection=COMPLETE" >> "$GITHUB_OUTPUT"
          echo "count=${n//[$'\r\n']/ }" >> "$GITHUB_OUTPUT"
          echo "Trivy image secrets: $n finding(s) at every severity (a secret blocks in every mode through the gate)"
      - name: Trivy image — is there anything to publish?
        id: sarif_img
        if: always()
        run: |
          for f in trivy-image.sarif trivy-image-secret.sarif; do
            k=$([ "$f" = trivy-image.sarif ] && echo vuln || echo secret)
            if [ -s "$f" ]; then
              echo "$k=true" >> "$GITHUB_OUTPUT"
            else
              echo "$k=false" >> "$GITHUB_OUTPUT"
              echo "::error title=Image scan: $f absent::An image was named and Trivy wrote no $f. That is not a clean image; nothing was established."
            fi
          done
      # BEGIN REDACT_STEP — generated by scripts/inline_normalizer.py. DO NOT EDIT HERE.
      - name: Redact credential material before upload
        if: always()
        shell: bash
        run: |
          # ORDER IS THE WHOLE CONTROL: this runs immediately before an upload, and
          # again before every later upload that follows a step which may have written
          # output -- a redactor after the upload protects nothing while looking exactly
          # like protection (N24/WP19). The sweep itself is ONE canonical script --
          # scripts/redact_all.sh, written by the `kit-scripts` job and fetched into
          # /tmp by every other -- because fourteen copies of one wrapper are how this
          # file reached 608.8 KB and stopped starting.
          #
          # A MISSING TOOL IS NOT A CLEAN RESULT. If the bundle did not arrive,
          # publication must not proceed on the strength of a scrub that never ran.
          if [ ! -s /tmp/redact_all.sh ]; then
            echo "::error title=Redaction could not be guaranteed::/tmp/redact_all.sh is absent."
            echo "The kit-scripts artifact did not reach this job, so no SARIF was scrubbed"
            echo "and none may be published. A MISSING TOOL IS NOT A CLEAN RESULT."
            exit 1
          fi
          bash /tmp/redact_all.sh
      # END REDACT_STEP
      - name: Trivy image — keep SARIF as an artifact
        if: always() && steps.sarif_img.outputs.vuln == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-trivy-image-${{ github.run_attempt }}
          path: trivy-image.sarif
          retention-days: 30
          if-no-files-found: warn
      - name: Trivy image — publish to the Security tab where available
        id: cs_img
        if: always() && steps.sarif_img.outputs.vuln == 'true'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - name: Trivy image — state plainly if publication degraded
        if: always() && steps.sarif_img.outputs.vuln == 'true' && steps.cs_img.outcome != 'success'
        run: |
          echo "::warning title=Trivy image: NOT published to the Security tab::Code scanning is"
          echo "unavailable here (free on public repos, otherwise GitHub Advanced Security)."
          echo "The findings are retained in the 'sarif-trivy-image' artifact."
      # BEGIN REDACT_STEP — generated by scripts/inline_normalizer.py. DO NOT EDIT HERE.
      - name: Redact credential material before upload
        if: always()
        shell: bash
        run: |
          # ORDER IS THE WHOLE CONTROL: this runs immediately before an upload, and
          # again before every later upload that follows a step which may have written
          # output -- a redactor after the upload protects nothing while looking exactly
          # like protection (N24/WP19). The sweep itself is ONE canonical script --
          # scripts/redact_all.sh, written by the `kit-scripts` job and fetched into
          # /tmp by every other -- because fourteen copies of one wrapper are how this
          # file reached 608.8 KB and stopped starting.
          #
          # A MISSING TOOL IS NOT A CLEAN RESULT. If the bundle did not arrive,
          # publication must not proceed on the strength of a scrub that never ran.
          if [ ! -s /tmp/redact_all.sh ]; then
            echo "::error title=Redaction could not be guaranteed::/tmp/redact_all.sh is absent."
            echo "The kit-scripts artifact did not reach this job, so no SARIF was scrubbed"
            echo "and none may be published. A MISSING TOOL IS NOT A CLEAN RESULT."
            exit 1
          fi
          bash /tmp/redact_all.sh
      # END REDACT_STEP
      - name: Trivy image secrets — keep SARIF as an artifact
        if: always() && steps.sarif_img.outputs.secret == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-trivy-image-secret-${{ github.run_attempt }}
          path: trivy-image-secret.sarif
          retention-days: 30
          if-no-files-found: warn
      - name: Trivy image secrets — publish to the Security tab where available
        id: cs_img_secret
        if: always() && steps.sarif_img.outputs.secret == 'true'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-image-secret.sarif
          category: trivy-image-secret
      - name: Trivy image secrets — state plainly if publication degraded
        if: always() && steps.sarif_img.outputs.secret == 'true' && steps.cs_img_secret.outcome != 'success'
        run: |
          echo "::warning title=Trivy image secrets: NOT published to the Security tab::Code"
          echo "scanning is unavailable here. The findings are retained in the"
          echo "'sarif-trivy-image-secret' artifact, and the gate still blocks on them."

      # BEGIN STATUS_STEP — generated by scripts/inline_normalizer.py. DO NOT EDIT HERE.
      - name: Result summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          # A SUMMARY IS NOT A VERDICT. If the script did not arrive, say so and stop;
          # never fail the job for it. A housekeeping step deciding a security verdict
          # is how a scan that had SUCCEEDED went red twice in this file's history.
          if [ ! -s /tmp/scan_status.sh ]; then
            echo "::warning title=Result summary unavailable::/tmp/scan_status.sh did not reach this job."
            echo "No per-job summary was printed. The scan's own verdict stands."
            exit 0
          fi
          . /tmp/scan_status.sh
          if [ "$JOB_STATUS" = "success" ]; then _e=COMPLETE; else _e=FAILED; fi
          scan_status "Container image" "$_e" "trivy-image.sarif" "image vulnerabilities"
      # END STATUS_STEP

  malicious-deps:
    needs: [discover, kit-scripts]
    name: Malicious / compromised packages (OSV)
    if: inputs.enable_malicious_pkg_scan
    runs-on: ubuntu-latest
    # Bounded so a stalled dependency cannot bill six hours (LM-001: unbounded execution
    # converts a dependency failure into uncontrolled cost).
    # NOT YET: a timeout still surfaces as a plain job failure. It SHOULD classify as
    # UNAVAILABLE / EXECUTION_TIMEOUT — cost is bounded here, semantics are not. See
    # docs/roadmap/FUTURE_WORK.md. Do not let this comment imply the mapping exists.
    timeout-minutes: 20
    outputs:
      # PASS | FINDINGS | NOT_APPLICABLE | COLLECTION_FAILED. The gate reads FINDINGS as a
      # secret-class finding advisory_mode never softens, and COLLECTION_FAILED as no evidence.
      # Empty when the job did not run.
      malicious_state: ${{ steps.osv_count.outputs.state }}
      malicious_count: ${{ steps.osv_count.outputs.malicious }}
    steps:
      # BEGIN FETCH_KIT_SCRIPTS — generated by scripts/inline_normalizer.py. DO NOT EDIT HERE.
      - name: Fetch the kit's own scripts
        # A RUN-SCOPED ARTIFACT, NOT `uses: ./` and NOT a copy per call site. Why, at
        # length, in the `kit-scripts` job at the top of this file.
        if: always()
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kit-scripts-${{ github.run_attempt }}
          path: /tmp
      - name: Verify the kit scripts against their pinned digest
        # A DOWNLOADED SCRIPT NOBODY VERIFIED IS A SUPPLY CHAIN STEP WITH NO INTEGRITY
        # CHECK. Why this digest and not a manifest fetched beside it: `kit-scripts`.
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp
          echo "77747346d57de23c8a301758499db36f89f41e3850a2495497d2983a6cb3916a  kit-scripts.sha256" | sha256sum -c -
          sha256sum -c kit-scripts.sha256
      # END FETCH_KIT_SCRIPTS
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install OSV-Scanner
        # PINNED BY VERSION, VERIFIED BY CHECKSUM (ledger L84). This fetched `releases/latest`:
        # never stale, never reproducible, and a release replaced upstream would have run inside
        # every consumer with nothing checking it. The digest is copied from that release's
        # published osv-scanner_SHA256SUMS and is written HERE, not fetched beside the binary --
        # a checksum downloaded from the same place as the file proves only that the download
        # finished. Bump both values together. tests/prove_malicious_deps_enforces.py refuses an
        # unpinned or unverified install.
        env:
          OSV_VERSION: v2.6.0
          OSV_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
        run: |
          set -euo pipefail
          dl="${RUNNER_TEMP:-/tmp}/osv-scanner"
          curl -sSfL --retry 3 --connect-timeout 20 -o "$dl" \
            "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  $dl" | sha256sum -c -
          install -m 0755 "$dl" /usr/local/bin/osv-scanner
      - name: Scan lockfiles
        id: osv_scan
        env:
          # CALLER INPUT ARRIVES AS DATA, NEVER AS SCRIPT TEXT (ledger L38).
          IN_PATHS: ${{ inputs.paths }}
        run: |
          set -uo pipefail
          # THE CALLER'S SCOPE, LIKE EVERY OTHER SCANNER. This scanned `.`: on consumer-path
          # run 38779788549 the clean leg walked the whole checkout, reached another fixture's
          # unresolvable requirements and reported COLLECTION_FAILED for a tree it was never
          # asked about (tests/prove_scope_reaches_osv_and_syft.py).
          scope="${IN_PATHS:-.}"; [ -d "$scope" ] || scope="."
          # THE EXIT CODE IS RECORDED, NOT SWALLOWED. Measured against osv-scanner v2.6.0:
          #   0    package sources scanned, nothing matched
          #   1    package sources scanned, at least one advisory matched (CVE or MAL-)
          #   128  "No package sources found" -- which is ALSO what a lockfile that failed to
          #        parse produces; only "Error during extraction" on stderr tells them apart
          #   127  one lockfile parsed and another did not (and bash's "command not found")
          # `--output` is deprecated in v2.6.0 in favour of `--output-file`.
          # So neither the exit code nor the file's presence decides anything alone: the count
          # step reads the code, stderr and the JSON together. No stale file may stand in for
          # this run's answer, hence the rm.
          rm -f osv.json osv.sarif osv-scan.err
          rc=0
          osv-scanner scan source --recursive --format json --output-file osv.json "$scope" 2> osv-scan.err || rc=$?
          cat osv-scan.err >&2
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # PUBLICATION ONLY. The SARIF is the human-facing copy; the JSON above is the evidence
          # the count and the gate read, so this run's exit code decides nothing.
          # suppression: PRESENTATION_ONLY -- the SARIF is a publication copy of the JSON above.
          # discards: this second run's exit code and stderr, which repeat the first run's
          # preserved_by: the JSON run's exit code and stderr, recorded above and read by the count
          # preserved_by: step, which emits COLLECTION_FAILED for anything it cannot account for
          osv-scanner scan source --recursive --format sarif --output-file osv.sarif "$scope" 2>/dev/null || true
      - name: OSV — count malicious packages
        id: osv_count
        # A KNOWN-MALICIOUS PACKAGE IS IDENTIFIED BY A MAL- ADVISORY (OpenSSF Malicious Packages).
        # Measured: one malicious crate came back as THREE records -- MAL-2022-1, its RUSTSEC id
        # and its GHSA id -- with MAL- as an ALIAS on the other two. So ids AND aliases are read,
        # and the count is distinct (MAL id, package, version). Malware published under a GHSA id
        # with no MAL- alias is not seen by this rule; it reaches the report as a vulnerability.
        #
        #   state  PASS | FINDINGS | NOT_APPLICABLE | COLLECTION_FAILED  (scanner_state terms)
        # Absent, empty or unparseable output is COLLECTION_FAILED, never zero.
        if: always()
        env:
          OSV_RC: ${{ steps.osv_scan.outputs.rc }}
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import io, json, os
          rc = os.environ.get('OSV_RC', '')
          err = ''
          if os.path.isfile('osv-scan.err'):
              err = io.open('osv-scan.err', encoding='utf-8', errors='replace').read()
          state, why, mal = None, '', {}
          if rc in ('0', '1') and os.path.isfile('osv.json') and os.path.getsize('osv.json') > 0:
              try:
                  doc = json.load(io.open('osv.json', encoding='utf-8'))
                  results = doc.get('results') if isinstance(doc, dict) else None
                  if not isinstance(results, list):
                      raise ValueError('no results array')
                  for res in results:
                      for pk in (res.get('packages') or []):
                          p = pk.get('package') or {}
                          for v in (pk.get('vulnerabilities') or []):
                              ids = [v.get('id') or ''] + list(v.get('aliases') or [])
                              m = sorted(str(x) for x in ids if str(x).startswith('MAL-'))
                              if m:
                                  mal[(m[0], p.get('name'), p.get('version'))] = p.get('ecosystem')
                  state = 'FINDINGS' if mal else 'PASS'
              except (ValueError, AttributeError, TypeError) as exc:
                  state, why = 'COLLECTION_FAILED', 'osv.json is not a readable result (%s)' % exc
          elif rc == '128' and 'No package sources found' in err and 'Error during extraction' not in err:
              state, why = 'NOT_APPLICABLE', 'no lockfile or manifest osv-scanner can resolve'
          else:
              state, why = 'COLLECTION_FAILED', 'osv-scanner exit %r, output %s' % (
                  rc or 'unset', 'absent' if not os.path.isfile('osv.json') else 'not trusted')
          # A LOCKFILE THAT FAILED TO PARSE WAS NOT EXAMINED. Its packages are unknown, and an
          # unknown is not a clean supply chain -- even when other lockfiles parsed.
          if state in ('PASS', 'FINDINGS') and 'Error during extraction' in err:
              state, why = 'COLLECTION_FAILED', 'a lockfile could not be parsed, so it was not examined'
          ids = ' '.join(sorted({' '.join(str(k[0]).split()) for k in mal}))  # one line (KDEC-027)
          with io.open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as o:
              o.write('state=%s\nmalicious=%d\nids=%s\n' % (state, len(mal), ids))
          for (mid, name, ver), eco in sorted(mal.items()):
              print('::error title=Known-malicious package::%s %s@%s (%s)' % (mid, name, ver, eco))
          print('OSV malicious-package check: %s, %d malicious%s' % (
              state, len(mal), (' -- ' + why) if why else ''))
          PY
      - name: OSV — enforce on malicious packages
        id: osv_enforce
        # EVERY MODE, LIKE A SECRET. advisory_mode softens enforcement on inherited findings; a
        # typosquat or a hijacked release is live compromise, so this step does not read it. The
        # job publishes the count step's state and the gate reads FINDINGS there as secret-class.
        if: always()
        env:
          OSV_STATE: ${{ steps.osv_count.outputs.state }}
          OSV_MALICIOUS: ${{ steps.osv_count.outputs.malicious }}
          OSV_IDS: ${{ steps.osv_count.outputs.ids }}
        run: |
          case "$OSV_STATE" in
            PASS)
              echo "No known-malicious package in any resolved lockfile." ;;
            NOT_APPLICABLE)
              echo "::notice title=OSV: no lockfiles::No lockfile or manifest osv-scanner can resolve. NOT_APPLICABLE, not a clean supply chain." ;;
            FINDINGS)
              echo "::error title=GATE=FAIL (malicious package)::${OSV_MALICIOUS} known-malicious package(s): ${OSV_IDS}."
              echo "advisory_mode does NOT cover this: a compromised package is live exposure."
              echo "Remove it, rotate anything the build environment could reach, and pin a clean version."
              exit 1 ;;
            *)
              echo "::error title=OSV: COLLECTION_FAILED::No readable malicious-package result (state '${OSV_STATE:-none}')."
              echo "Absence of a match is not proof of a clean supply chain."
              exit 1 ;;
          esac
      # Findings must survive whether or not this repo has code scanning. Uploading to the
      # Security tab is a PUBLICATION channel, not the finding itself — free on public repos,
      # otherwise Advanced Security. Treating it as mandatory turned successful scans into
      # failed jobs on every private repo without GHAS.
      # THE JSON IS THE EVIDENCE; THE SARIF IS WHAT GETS PUBLISHED. A publication copy that records
      # no run, no results array or a failed invocation presents on the Security tab as a clean
      # scan whatever the JSON said (ledger L02; PIPELINE_ORDERING 4.5-4.6; flagship lane report
      # row 10), so it is held to validity rows 1-6 before any upload and withheld when it fails
      # them. Absent is legitimate only where the JSON run itself found nothing to resolve.
      - name: OSV — count findings (SARIF, before publication)
        id: sarif_osv
        # A blocking OSV verdict must not lose the evidence that blocked
        # (tests/prove_scanners_survive_enforce.py; run 38779814703).
        if: always()
        env:
          OSV_STATE: ${{ steps.osv_count.outputs.state }}
          REPORT: osv.sarif
        run: |
          set -uo pipefail
          cf() {
            echo "::error title=COLLECTION_FAILED::$1"
            echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 1
          }
          if [ ! -s "$REPORT" ]; then
            if [ "${OSV_STATE:-}" = "NOT_APPLICABLE" ]; then
              echo "exists=false" >> "$GITHUB_OUTPUT"
              echo "::notice title=OSV: nothing to publish::No lockfile osv-scanner can resolve, so no SARIF. Not a failure."
              exit 0
            fi
            cf "$REPORT was not produced while the JSON run recorded '${OSV_STATE:-none}'. An absent publication copy is not zero findings."
          fi
          if ! _v=$(python3 /tmp/sarif_validity.py --tool osv-scanner "$REPORT" 2>&1); then
            cf "$_v"
          fi
          if ! n=$(jq '[.runs[].results[]] | length' "$REPORT" 2>&1); then
            cf "$REPORT could not be counted: $n"
          fi
          echo "collection=COMPLETE" >> "$GITHUB_OUTPUT"
          echo "count=${n//[$'\r\n']/ }" >> "$GITHUB_OUTPUT"
          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "OSV SARIF: $n result(s) of every kind; the malicious-package verdict is the JSON count above"
      # BEGIN REDACT_STEP — generated by scripts/inline_normalizer.py. DO NOT EDIT HERE.
      - name: Redact credential material before upload
        if: always()
        shell: bash
        run: |
          # ORDER IS THE WHOLE CONTROL: this runs immediately before an upload, and
          # again before every later upload that follows a step which may have written
          # output -- a redactor after the upload protects nothing while looking exactly
          # like protection (N24/WP19). The sweep itself is ONE canonical script --
          # scripts/redact_all.sh, written by the `kit-scripts` job and fetched into
          # /tmp by every other -- because fourteen copies of one wrapper are how this
          # file reached 608.8 KB and stopped starting.
          #
          # A MISSING TOOL IS NOT A CLEAN RESULT. If the bundle did not arrive,
          # publication must not proceed on the strength of a scrub that never ran.
          if [ ! -s /tmp/redact_all.sh ]; then
            echo "::error title=Redaction could not be guaranteed::/tmp/redact_all.sh is absent."
            echo "The kit-scripts artifact did not reach this job, so no SARIF was scrubbed"
            echo "and none may be published. A MISSING TOOL IS NOT A CLEAN RESULT."
            exit 1
          fi
          bash /tmp/redact_all.sh
      # END REDACT_STEP
      - name: OSV — keep SARIF as an artifact
        if: always() && steps.sarif_osv.outputs.exists == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-osv-${{ github.run_attempt }}
          path: osv.sarif
          retention-days: 30
          if-no-files-found: warn
      - name: OSV — publish to the Security tab where available
        id: cs_osv
        if: always() && steps.sarif_osv.outputs.exists == 'true'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: osv.sarif
          category: osv
      - name: OSV — state plainly if publication degraded
        if: always() && steps.sarif_osv.outputs.exists == 'true' && steps.cs_osv.outcome != 'success'
        run: |
          # Loud, never silent. An empty Security tab is indistinguishable from a clean
          # codebase, and that ambiguity is how a control becomes false assurance.
          echo "::warning title=OSV: NOT published to the Security tab::Code scanning is"
          echo "unavailable here (free on public repos, otherwise GitHub Advanced Security)."
          echo "The scan SUCCEEDED and the gate still enforces on these findings."
          echo "Retrieve them from the 'sarif-osv' artifact."

  # ------------------------------------------------------------------- SBOM

      # BEGIN STATUS_STEP — generated by scripts/inline_normalizer.py. DO NOT EDIT HERE.
      - name: Result summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          # A SUMMARY IS NOT A VERDICT. If the script did not arrive, say so and stop;
          # never fail the job for it. A housekeeping step deciding a security verdict
          # is how a scan that had SUCCEEDED went red twice in this file's history.
          if [ ! -s /tmp/scan_status.sh ]; then
            echo "::warning title=Result summary unavailable::/tmp/scan_status.sh did not reach this job."
            echo "No per-job summary was printed. The scan's own verdict stands."
            exit 0
          fi
          . /tmp/scan_status.sh
          if [ "$JOB_STATUS" = "success" ]; then _e=COMPLETE; else _e=FAILED; fi
          scan_status "Malicious packages" "$_e" "" "dependency provenance"
      # END STATUS_STEP

  sbom:
    needs: [discover, kit-scripts]
    name: SBOM (CycloneDX)
    if: inputs.enable_sbom
    runs-on: ubuntu-latest
    # Bounded so a stalled dependency cannot bill six hours (LM-001: unbounded execution
    # converts a dependency failure into uncontrolled cost).
    # NOT YET: a timeout still surfaces as a plain job failure. It SHOULD classify as
    # UNAVAILABLE / EXECUTION_TIMEOUT — cost is bounded here, semantics are not. See
    # docs/roadmap/FUTURE_WORK.md. Do not let this comment imply the mapping exists.
    timeout-minutes: 20
    outputs:
      # The licence verdict the gate reads (ledger L16): PASS | FINDINGS | NOT_APPLICABLE (no
      # denylist supplied) | COLLECTION_FAILED, and how many components were denied.
      licence_state: ${{ steps.licences.outputs.licence_state }}
      licence_denied: ${{ steps.licences.outputs.licence_denied }}
    steps:
      # BEGIN FETCH_KIT_SCRIPTS — generated by scripts/inline_normalizer.py. DO NOT EDIT HERE.
      - name: Fetch the kit's own scripts
        # A RUN-SCOPED ARTIFACT, NOT `uses: ./` and NOT a copy per call site. Why, at
        # length, in the `kit-scripts` job at the top of this file.
        if: always()
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kit-scripts-${{ github.run_attempt }}
          path: /tmp
      - name: Verify the kit scripts against their pinned digest
        # A DOWNLOADED SCRIPT NOBODY VERIFIED IS A SUPPLY CHAIN STEP WITH NO INTEGRITY
        # CHECK. Why this digest and not a manifest fetched beside it: `kit-scripts`.
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp
          echo "77747346d57de23c8a301758499db36f89f41e3850a2495497d2983a6cb3916a  kit-scripts.sha256" | sha256sum -c -
          sha256sum -c kit-scripts.sha256
      # END FETCH_KIT_SCRIPTS
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Syft (pinned, verified)
        # PINNED BY VERSION, VERIFIED BY CHECKSUM (ledger L84). This fetched anchore/syft's
        # install.sh from `main` and ran whatever it installed -- 1.54.1 on the last hosted run,
        # while tests/prove_sbom_licence_verdict.py measured the licence step on 1.52.0. The
        # version is the one that proof measured; the digest is the linux_amd64 line of the
        # release's syft_1.52.0_checksums.txt, verified against the downloaded bytes before
        # anything is extracted. Its own step, so the scope proof can run the generate step
        # under shims without pretending to install anything.
        run: |
          set -euo pipefail
          s=syft_1.52.0_linux_amd64.tar.gz
          curl -sSfL --retry 3 --connect-timeout 20 -o "$s" "https://github.com/anchore/syft/releases/download/v1.52.0/$s"
          echo "caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d  $s" | sha256sum -c -
          tar -xzf "$s" syft && sudo mv syft /usr/local/bin/ && rm -f "$s"
          syft version
      - name: Generate SBOM with Syft
        env:
          # CALLER INPUT ARRIVES AS DATA, NEVER AS SCRIPT TEXT (ledger L38).
          IN_PATHS: ${{ inputs.paths }}
        run: |
          # THE CALLER'S SCOPE. `dir:.` inventoried the whole checkout: the clean leg of run
          # 38779788549 listed another fixture's log4j-core and handlebars as its dependencies
          # (tests/prove_scope_reaches_osv_and_syft.py).
          scope="${IN_PATHS:-.}"; [ -d "$scope" ] || scope="."
          syft "dir:$scope" -o cyclonedx-json=sbom.cyclonedx.json -o spdx-json=sbom.spdx.json
      - name: Summarize
        run: |
          python - <<'PY'
          import json
          d=json.load(open('sbom.cyclonedx.json'))
          c=d.get('components',[])
          print(f"components: {len(c)}")
          with open('sbom-summary.txt','w') as f: f.write(f"components: {len(c)}\n")
          PY
          cat sbom-summary.txt >> "$GITHUB_STEP_SUMMARY"

      # THE SBOM ALREADY KNEW. CycloneDX and SPDX both carry per-component licence data; the
      # kit generated both, uploaded both, and read neither. "We produce an SBOM" was true and
      # answered nothing -- the licence question, the one an SBOM is most often asked, went to
      # an artifact nobody opened. Producer with no consumer, third instance in one day.
      - name: Dependency licences
        id: licences
        if: always()
        shell: bash
        env:
          DENY: ${{ inputs.license_deny }}
        run: |
          # A MISSING READER IS NOT AN EMPTY LICENCE SET. Establish that the tool arrived before
          # trusting what it did not say.
          if [ ! -s /tmp/sbom_licenses.py ]; then
            echo "::error title=Licence reader absent::/tmp/sbom_licenses.py did not reach this job."
            echo "The SBOM was not read, which is NOT the same as an SBOM with nothing to report."
            echo "licence_state=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          # THE VERDICT GOES TO THE GATE, NOT TO /dev/null (ledger L16). This ran `|| true`
          # without `--out`, so a denied licence was printed and could never block. Now the
          # verdict is written (licences.json, kept with the SBOM) and published as job outputs
          # the gate reads: FINDINGS blocks there, under advisory_mode like any inherited
          # finding. A denial does not fail THIS step -- the gate owns that decision -- but no
          # SBOM does: exit 3 means NOT ESTABLISHED, never "nothing denied".
          rc=0
          python3 /tmp/sbom_licenses.py sbom.cyclonedx.json sbom.spdx.json \
            ${DENY:+--deny "$DENY"} --out licences.json || rc=$?
          state=""; denied=""
          if [ -s licences.json ]; then
            state=$(jq -r '.state // empty' licences.json 2>/dev/null)
            denied=$(jq -r 'if .denied then (.denied | length) else empty end' licences.json 2>/dev/null)
          fi
          case "$rc:$state" in
            0:PASS|0:NOT_APPLICABLE|1:FINDINGS) ;;
            *) state=COLLECTION_FAILED ;;
          esac
          echo "licence_state=$state" >> "$GITHUB_OUTPUT"
          echo "licence_denied=${denied:-}" >> "$GITHUB_OUTPUT"
          echo "licence verdict: $state (${denied:-?} denied, reader exit $rc)"
          [ "$state" != "COLLECTION_FAILED" ] || exit 1

      # BEGIN REDACT_STEP — generated by scripts/inline_normalizer.py. DO NOT EDIT HERE.
      - name: Redact credential material before upload
        if: always()
        shell: bash
        run: |
          # ORDER IS THE WHOLE CONTROL: this runs immediately before an upload, and
          # again before every later upload that follows a step which may have written
          # output -- a redactor after the upload protects nothing while looking exactly
          # like protection (N24/WP19). The sweep itself is ONE canonical script --
          # scripts/redact_all.sh, written by the `kit-scripts` job and fetched into
          # /tmp by every other -- because fourteen copies of one wrapper are how this
          # file reached 608.8 KB and stopped starting.
          #
          # A MISSING TOOL IS NOT A CLEAN RESULT. If the bundle did not arrive,
          # publication must not proceed on the strength of a scrub that never ran.
          if [ ! -s /tmp/redact_all.sh ]; then
            echo "::error title=Redaction could not be guaranteed::/tmp/redact_all.sh is absent."
            echo "The kit-scripts artifact did not reach this job, so no SARIF was scrubbed"
            echo "and none may be published. A MISSING TOOL IS NOT A CLEAN RESULT."
            exit 1
          fi
          bash /tmp/redact_all.sh
      # END REDACT_STEP
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sbom
          # licences.json is the licence verdict the gate read, kept beside the SBOM it came from.
          path: |
            sbom.cyclonedx.json
            sbom.spdx.json
            licences.json
          retention-days: 90

  # ─────────────────────────────────────────────────────────────────────────
  # REPORT — the run's work surface, for security and engineering at once
  # ─────────────────────────────────────────────────────────────────────────
  #
  # Before this job existed, of sixteen scanner jobs six wrote a step-summary block, nine emitted
  # only a log annotation, one printed nothing, and THREE reported a findings count. A reviewer
  # could not tell a clean scan from a scan that never happened without opening the job, and an
  # engineer could not act without downloading artifacts.
  #
  # WHY ONE JOB AND NOT SIXTEEN REPORTING STEPS
  #
  #   (1) A contract implemented in sixteen places drifts in sixteen places. This kit has already
  #       lost fourteen Azure gitleaks rules and a flawfinder fix to exactly that, and carries
  #       "one truth in three places" in its LANDMINES register. Each scanner establishes only
  #       what it alone can know; interpretation happens once.
  #
  #   (2) Deduplication and correlation are only possible where every finding is visible at once.
  #       Trivy, Checkov and CodeQL will each report the same exposed storage account. Sixteen
  #       reporters holding one SARIF each cannot see that, and will raise three tickets and three
  #       risk acceptances for one condition.
  #
  # STATE IS DERIVED FROM `needs.<job>.result`, NOT FROM SIXTEEN NEW STEPS. That is already the
  # gate's source of truth, so the report and the gate cannot disagree about what ran.
  #
  # `if: always()` is essential. A report that only runs when the scanners succeeded is a report
  # that disappears exactly when someone needs to know what happened.

      # BEGIN STATUS_STEP — generated by scripts/inline_normalizer.py. DO NOT EDIT HERE.
      - name: Result summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          # A SUMMARY IS NOT A VERDICT. If the script did not arrive, say so and stop;
          # never fail the job for it. A housekeeping step deciding a security verdict
          # is how a scan that had SUCCEEDED went red twice in this file's history.
          if [ ! -s /tmp/scan_status.sh ]; then
            echo "::warning title=Result summary unavailable::/tmp/scan_status.sh did not reach this job."
            echo "No per-job summary was printed. The scan's own verdict stands."
            exit 0
          fi
          . /tmp/scan_status.sh
          if [ "$JOB_STATUS" = "success" ]; then _e=COMPLETE; else _e=FAILED; fi
          scan_status "SBOM" "$_e" "" "components"
      # END STATUS_STEP

  report:
    name: Security scan report
    # THE FINDINGS EVIDENCE THE GATE READS (C3). Counted by the reporter from SARIF, after
    # dispositions, over ESTABLISHED rows only. Absent outputs mean the evidence was never
    # assembled -- the gate reads that as unknown, never as zero.
    outputs:
      blocking_findings: ${{ steps.render.outputs.blocking_findings }}
      jobs_with_findings: ${{ steps.render.outputs.jobs_with_findings }}
      # The secret scan's findings by fingerprint, for the gate's secret exceptions (lane L-S).
      secret_findings: ${{ steps.render.outputs.secret_findings }}
      # Every dependency/image finding's CVE, job:fingerprint:CVE, for the gate's KEV check (KDEC-022).
      cve_findings: ${{ steps.render.outputs.cve_findings }}
      # THE FINDINGS FILE (L52): identify() results, one per finding, inside the evidence
      # artifact. propose-ledger reads it from the artifact; this output names the path.
      findings: ${{ steps.render.outputs.findings }}
      # THE IDENTITY CLAIM (L44/L45), beside the block and never inside it. EVIDENCE_UNTRUSTED
      # when the ledger could not be read or an identity could not be computed.
      identity_routing: ${{ steps.render.outputs.identity_routing }}
      baseline_state: ${{ steps.render.outputs.baseline_state }}
    # image-scan IS IN THIS LIST BECAUSE THE REPORT READS IT.
    #
    # `needs.image-scan.result` is consumed below to render the trivy-image row. An
    # expression naming a job that is not in `needs` does not error in GitHub Actions --
    # it evaluates to the empty string -- so the container-image row has been rendering
    # from an empty result on every run since it was added, and the report could not
    # distinguish "no image configured" from "the image scan failed". actionlint caught
    # it; the workflow never would have. Two things are fixed by the edge, not one: the
    # report also DOWNLOADS sarif-* artifacts, and without the dependency it could run
    # before image-scan had uploaded its own.
    # resolve IS IN THIS LIST BECAUSE THE REPORT READS IT (KDEC-010): the capability selection
    # caps a scanner row's PASS at PARTIAL where the scanner cannot read the code at its version.
    needs: [discover, kit-scripts, resolve, secret-scan, code-quality, sast-semgrep, sast-bandit,
            codeql, deps-scan, iac-scan, sast-dotnet, sast-java, sast-go, sast-cpp,
            sast-mobile, malicious-deps, sbom, image-scan]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # BEGIN FETCH_KIT_SCRIPTS — generated by scripts/inline_normalizer.py. DO NOT EDIT HERE.
      - name: Fetch the kit's own scripts
        # A RUN-SCOPED ARTIFACT, NOT `uses: ./` and NOT a copy per call site. Why, at
        # length, in the `kit-scripts` job at the top of this file.
        if: always()
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kit-scripts-${{ github.run_attempt }}
          path: /tmp
      - name: Verify the kit scripts against their pinned digest
        # A DOWNLOADED SCRIPT NOBODY VERIFIED IS A SUPPLY CHAIN STEP WITH NO INTEGRITY
        # CHECK. Why this digest and not a manifest fetched beside it: `kit-scripts`.
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp
          echo "77747346d57de23c8a301758499db36f89f41e3850a2495497d2983a6cb3916a  kit-scripts.sha256" | sha256sum -c -
          sha256sum -c kit-scripts.sha256
      # END FETCH_KIT_SCRIPTS
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # THE LEDGER NEEDS A MERGE BASE (L45). baseline_ledger.py grandfathers from the merge
          # base of this commit and the default branch, and a depth-1 checkout has none -- the
          # reader says so and every run would read BASELINE_UNAVAILABLE forever.
          fetch-depth: 0

      - name: Collect every SARIF this run produced
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        # suppression: FAILURE_ISOLATION_WITH_STATE_CAPTURE -- with `if: always()` this job
        # runs even when every scanner was skipped, and
        # download-artifact fails when no artifact matches the pattern. Failing here would delete
        # the report in precisely the case it is needed -- a run that collected nothing. What was
        # and was not collected is established per scanner from `needs.*.result` below, so a
        # missing download degrades the report to NOT ESTABLISHED rather than to silence.
        continue-on-error: true
        with:
          pattern: sarif-*
          path: _sarif
          merge-multiple: true

      - name: Build per-scanner state
        env:
          # EVERY VALUE ARRIVES AS DATA, NEVER AS SCRIPT TEXT.
          #
          # These are workflow-controlled strings and most could not plausibly carry shell syntax.
          # They go through `env:` regardless, because a ticket-reference gate reviewed during this
          # kit's development was interpolating a PR body straight into a `run:` block -- executable
          # by anyone who could open a pull request, and silently truncating at the first double
          # quote, so it reported a reference absent from text it had never received. Deciding case
          # by case which inputs are "safe enough" is how that happens. The rule is the whole control.
          R_SECRET: ${{ needs.secret-scan.result }}
          R_QUALITY: ${{ needs.code-quality.result }}
          R_SEMGREP: ${{ needs.sast-semgrep.result }}
          # KDEC-016 (2026-10-22): the Semgrep scan's own state and the PHP files it could not fully parse.
          R_SEMGREP_SCAN_STATE: ${{ needs.sast-semgrep.outputs.scan_state }}
          R_SEMGREP_PARTIAL_FILES: ${{ needs.sast-semgrep.outputs.parse_partial_files }}
          R_BANDIT: ${{ needs.sast-bandit.result }}
          R_CODEQL: ${{ needs.codeql.result }}
          R_DEPS: ${{ needs.deps-scan.result }}
          R_IAC: ${{ needs.iac-scan.result }}
          R_DOTNET: ${{ needs.sast-dotnet.result }}
          R_JAVA: ${{ needs.sast-java.result }}
          R_GO: ${{ needs.sast-go.result }}
          R_CPP: ${{ needs.sast-cpp.result }}
          # KDEC-026: PARTIAL when any C/C++ source had no build metadata (CPP_ANALYSIS_PARTIAL).
          R_CPP_SCAN_STATE: ${{ needs.sast-cpp.outputs.scan_state }}
          R_MOBILE: ${{ needs.sast-mobile.result }}
          R_MALDEPS: ${{ needs.malicious-deps.result }}
          R_SBOM: ${{ needs.sbom.result }}
          R_IMAGE: ${{ needs.image-scan.result }}
          IMAGE_REF: ${{ inputs.image_ref }}
          D_PYTHON: ${{ needs.discover.outputs.python }}
          D_NODE: ${{ needs.discover.outputs.node }}
          D_GO: ${{ needs.discover.outputs.go }}
          D_DOTNET: ${{ needs.discover.outputs.dotnet }}
          D_JAVA: ${{ needs.discover.outputs.java }}
          D_CPP: ${{ needs.discover.outputs.cpp }}
          D_MOBILE: ${{ needs.discover.outputs.mobile }}
          D_IAC: ${{ needs.discover.outputs.iac }}
          # Pipeline lint (lane L-SCAN-A, KDEC-025): applicability by artefact, and the files each
          # linter could not read (VERSION_GAP) -- a row over unread files is PARTIAL, never PASS.
          D_WORKFLOWS: ${{ needs.discover.outputs.workflows }}
          D_SHELL: ${{ needs.discover.outputs.shell }}
          D_POWERSHELL: ${{ needs.discover.outputs.powershell }}
          D_DOCKERFILE: ${{ needs.discover.outputs.dockerfile }}
          R_LINT_GAPS: ${{ needs.deps-scan.outputs.lint_version_gaps }}
          R_HADOLINT_GAPS: ${{ needs.iac-scan.outputs.lint_version_gaps }}
          D_STATE: ${{ needs.discover.outputs.state }}
          P_CODESCAN: ${{ needs.discover.outputs.code_scanning }}
          P_SOURCE: ${{ needs.discover.outputs.platform_source }}
        run: |
          set -uo pipefail
          mkdir -p _states
          # suppression: FAILURE_ISOLATION_WITH_STATE_CAPTURE -- a run where NO scanner
          # produced SARIF is a legitimate state -- every
          # ecosystem absent, or every scanner unlicensed. The copy failing here must not abort
          # the report, because a run with nothing collected is exactly the run whose report
          # matters most. Absence is carried forward as NOT ESTABLISHED per scanner below, which
          # is louder than a failed job would have been.
          cp -f _sarif/*.sarif _states/ 2>/dev/null || true
          # suppression: PRESENTATION_ONLY -- listing is diagnostic output for the log. An empty directory is
          # information, not an error, and is reported properly by the renderer.
          ls -1 _states/ || true

          # applicability(<language-gate>) -> APPLICABLE | NOT_APPLICABLE | UNKNOWN
          #
          # DISCOVERY FAILURE MUST NOT BECOME "NOT APPLICABLE". If the survey could not run, the
          # honest answer is that nobody knows whether this ecosystem is present -- which is
          # UNKNOWN, and downstream is reported as unestablished scope. Turning a failure to
          # observe into a confident negative is the inversion this pipeline exists to prevent.
          appl() {
            if [ "$D_STATE" = "DISCOVERY_UNAVAILABLE" ]; then printf 'UNKNOWN'; return; fi
            [ "$1" = "true" ] && printf 'APPLICABLE' || printf 'NOT_APPLICABLE'
          }

          # A job conclusion is not an execution state. `skipped` in particular collapses
          # "not licensed", "switched off", "nothing to scan" and "an earlier job failed" into
          # one word, which is why applicability is established separately above.
          exec_of() {
            case "$1" in
              success)   printf 'COMPLETE' ;;
              failure)   printf 'FAILED' ;;
              cancelled) printf 'NOT_RUN' ;;
              skipped)   printf 'NOT_RUN' ;;
              *)         printf 'NOT_RUN' ;;
            esac
          }

          # sarif_for <basename-glob> -- the first matching report, or empty.
          sarif_for() {
            for f in _states/$1; do [ -f "$f" ] && { printf '%s' "${f#_states/}"; return; }; done
            printf ''
          }

          add() {
            # add <scanner> <applicability> <job-result> <scope> <sarif-name> <job>
            #
            # ARGUMENT 6 IS THE PRODUCING JOB (C3). The gate reads findings per JOB, because a
            # job that FAILED because it found something is FINDINGS, and one that failed with
            # nothing on record crashed -- and only the evidence can tell those apart.
            #
            # ARGUMENT 5 IS AN EXACT NAME, NOT A PREFIX GLOB. It used to be `trivy*.sarif`, which
            # matches trivy-deps.sarif, trivy-iac.sarif AND trivy-image.sarif -- so whichever
            # sorted first became "the dependency scanner's findings" and the other two vanished
            # into a row that already looked answered. `dotnet*.sarif` did the same to Semgrep-C#,
            # attributing its findings to the NuGet audit, and `go*.sarif` would collide with
            # CodeQL's per-language output the moment that was split out. One scanner, one file,
            # no prefix relationships between them.
            _s=$(sarif_for "$5")
            _up=UNKNOWN
            [ -n "$_s" ] && _up=COMPLETE
            [ -z "$_s" ] && _up=NONE
            _art=RETAINED
            [ -z "$_s" ] && _art=NONE
            # A GATE VERDICT REQUIRES EVIDENCE, NOT A GREEN JOB.
            #
            # This was `gate: PASS if the job succeeded`. A job can succeed having published
            # nothing -- image-scan writes trivy-image.sarif and uploads it nowhere; the .NET
            # audit and detect-secrets emit no SARIF at all -- and every one of those rows read
            # PASS. That is a clean verdict sourced from a job conclusion rather than from a
            # report, which is the substitution this kit exists to refuse. PASS now needs all
            # three: the scanner was applicable, the job completed, and a report actually
            # arrived. Anything less is UNDETERMINED, which is not a failure and is not clean.
            _gate=UNDETERMINED
            if [ "$(exec_of "$3")" = "COMPLETE" ] && [ "$2" = "APPLICABLE" ] && [ -n "$_s" ]; then
              _gate=PASS
            fi
            jq -n --arg sc "$1" --arg ap "$2" --arg ex "$(exec_of "$3")" \
                  --arg sp "$4" --arg sa "$_s" --arg ar "$_art" --arg up "$_up" \
                  --arg gt "$_gate" --arg jb "${6:-}" \
              '{scanner:$sc, applicability:$ap, execution:$ex, scope:$sp,
                sarif:$sa, artifact:$ar, upload:$up, gate:$gt, job:$jb}' \
              > "_states/state-$1.json"
          }

          # TWENTY-FIVE SCANNERS, TWENTY-FIVE VERDICTS.
          #
          # Eighteen JOBS is a packaging decision. How many independent things looked at this
          # repository is a correctness one, and the two were conflated: six scanners had no row
          # of their own, so their result was silently carried by a neighbour's. detect-secrets
          # rode on gitleaks, ESLint on ruff, Semgrep-C# on the NuGet audit, cppcheck on
          # flawfinder, Trivy-IaC on Trivy-deps, and CodeQL's six languages on one aggregate. A
          # row that is absent reads as "nothing to report" to every human who has ever read a
          # report -- so an unreported scanner is indistinguishable from a scanner with nothing
          # to say, which is the whole failure family in one line.
          #
          # None of this changes the topology. These are verdicts, assembled here from evidence
          # the jobs already produce; no job was added, merged or moved.

          # --- secrets -------------------------------------------------------------------
          add "gitleaks"      APPLICABLE          "$R_SECRET"  "whole repository"       'gitleaks.sarif' secret-scan
          # SECOND SCANNER IN THE SAME JOB, AND IT HAS NEVER HAD A VERDICT. detect-secrets runs
          # after gitleaks in `secret-scan`, writes .ds-scan.json, and that file is retained
          # nowhere. Its row therefore establishes nothing -- which is exactly what must be
          # visible, because until now "secret scanning" read as one green row covering both.
          add "detect-secrets" APPLICABLE         "$R_SECRET"  "whole repository"       'detect-secrets.sarif' secret-scan

          # --- linters -------------------------------------------------------------------
          add "code-quality"  "$(appl "$D_PYTHON")" "$R_QUALITY" "ruff / mypy"          'quality.sarif' code-quality
          # ESLINT RUNS WHEREVER NODE IS DISCOVERED (L13, closed 2026-10-14). This row was a fixed
          # COVERAGE_GAP while the job gated on discovered python and the steps on the declared
          # language; both now key on discovery (tests/prove_code_quality_enforces.py). ESLint
          # still writes no SARIF, so like ruff its row establishes no machine-readable result
          # (KNOWN_GAPS section 3) -- applicable, and honestly NOT ESTABLISHED, never CLEAN.
          add "eslint"        "$(appl "$D_NODE")" "$R_QUALITY" "node sources"           'eslint.sarif' code-quality

          # --- SAST ----------------------------------------------------------------------
          # A PARTIAL SEMGREP SCAN IS NOT A PASS ROW (KDEC-016, 2026-10-22: scan what parses, flag
          # the rest). The files it could not fully parse are named in the row's scope, and a PASS
          # the state builder would write is PARTIAL; findings stay findings.
          sg_scope="source"
          [ "${R_SEMGREP_SCAN_STATE:-}" = "PARTIAL" ] && sg_scope="source; PARTIAL (PARSE_PARTIAL_PHP_SYNTAX), not fully parsed: ${R_SEMGREP_PARTIAL_FILES:-unnamed}"
          add "semgrep"       APPLICABLE          "$R_SEMGREP" "$sg_scope"              'semgrep.sarif' sast-semgrep
          if [ "${R_SEMGREP_SCAN_STATE:-}" = "PARTIAL" ] && [ -f _states/state-semgrep.json ]; then
            jq '.gate = (if .gate == "PASS" then "PARTIAL" else .gate end)' _states/state-semgrep.json > _states/state-semgrep.tmp &&
              mv _states/state-semgrep.tmp _states/state-semgrep.json
          fi
          add "bandit"        "$(appl "$D_PYTHON")" "$R_BANDIT" "python"                'bandit.sarif' sast-bandit
          add "java-sast"     "$(appl "$D_JAVA")" "$R_JAVA"    "java"                   'java-semgrep.sarif' sast-java
          add "gosec"         "$(appl "$D_GO")"   "$R_GO"      "go"                     'gosec.sarif' sast-go
          # TWO SCANNERS THAT SHARED ONE VERDICT. `dotnet list package --vulnerable` audits
          # NuGet metadata and emits no SARIF; Semgrep-C# analyses source and writes
          # dotnet-semgrep.sarif. Under the old `dotnet*.sarif` glob the dependency row claimed
          # the SAST scanner's report, so one of the two was invisible and the other was
          # misattributed. Separate identities, separate evidence, separate verdicts.
          add "dotnet-vuln"   "$(appl "$D_DOTNET")" "$R_DOTNET" "nuget metadata"        'dotnet-vuln.sarif' sast-dotnet
          add "semgrep-csharp" "$(appl "$D_DOTNET")" "$R_DOTNET" "c# sources"           'dotnet-semgrep.sarif' sast-dotnet
          # cppcheck AND flawfinder BOTH RUN IN sast-cpp AND FIND DIFFERENT THINGS -- the seeded
          # fixture carries a double free only cppcheck detects. cppcheck had no row, so a dead
          # cppcheck path was covered for by a live flawfinder and the table could not show it.
          cc_scope="c / c++"
          [ "${R_CPP_SCAN_STATE:-}" = "PARTIAL" ] && cc_scope="c / c++; PARTIAL (CPP_ANALYSIS_PARTIAL): some sources had no build metadata"
          add "cppcheck"      "$(appl "$D_CPP")"  "$R_CPP"     "$cc_scope"              'cppcheck.sarif' sast-cpp
          if [ "${R_CPP_SCAN_STATE:-}" = "PARTIAL" ] && [ -f _states/state-cppcheck.json ]; then
            jq '.gate = (if .gate == "PASS" then "PARTIAL" else .gate end)' _states/state-cppcheck.json > _states/state-cppcheck.tmp &&
              mv _states/state-cppcheck.tmp _states/state-cppcheck.json
          fi
          add "flawfinder"    "$(appl "$D_CPP")"  "$R_CPP"     "c / c++"                'flawfinder.sarif' sast-cpp
          # ANDROID AND iOS (KDEC-026): two scanners in sast-mobile, two rows, two reports.
          add "mobsfscan"     "$(appl "$D_MOBILE")" "$R_MOBILE" "android / ios"         'mobsfscan.sarif' sast-mobile
          add "mobile-config" "$(appl "$D_MOBILE")" "$R_MOBILE" "manifests / gradle"    'mobile-config.sarif' sast-mobile

          # --- dependencies and infrastructure -------------------------------------------
          add "trivy"         APPLICABLE          "$R_DEPS"    "dependencies"           'trivy-deps.sarif' deps-scan
          add "trivy-iac"     "$(appl "$D_IAC")"  "$R_IAC"     "terraform / bicep / docker" 'trivy-iac.sarif' iac-scan
          # checkov-action treats output_file_path as a DIRECTORY; the artifact it uploads is the
          # file INSIDE it, named results_sarif.sarif. `checkov*.sarif` matched nothing, so the
          # IaC row reported NOT ESTABLISHED on runs where checkov had just counted findings.
          add "checkov"       "$(appl "$D_IAC")"  "$R_IAC"     "infrastructure as code" 'results_sarif.sarif' iac-scan

          # --- pipeline lint (lane L-SCAN-A, KDEC-025) -------------------------------------
          # Four classes that were COVERAGE_GAP rows, each with its own linter and its own row.
          # They ride in deps-scan and iac-scan, so the job result is shared; the SARIF is not.
          # A file a linter could not read (VERSION_GAP) caps that row's PASS at PARTIAL.
          add "actionlint"    "$(appl "$D_WORKFLOWS")" "$R_DEPS" "github actions workflows" 'actionlint.sarif' deps-scan
          add "zizmor"        "$(appl "$D_WORKFLOWS")" "$R_DEPS" "github actions workflows" 'zizmor.sarif' deps-scan
          add "shellcheck"    "$(appl "$D_SHELL")" "$R_DEPS"   "shell scripts"          'shellcheck.sarif' deps-scan
          add "psscriptanalyzer" "$(appl "$D_POWERSHELL")" "$R_DEPS" "powershell"       'psscriptanalyzer.sarif' deps-scan
          add "hadolint"      "$(appl "$D_DOCKERFILE")" "$R_IAC" "dockerfiles"          'hadolint.sarif' iac-scan
          for _ln in shellcheck psscriptanalyzer hadolint; do
            _gaps="$R_LINT_GAPS"; [ "$_ln" = hadolint ] && _gaps="$R_HADOLINT_GAPS"
            _mine=""
            for _f in $_gaps; do
              case "$_ln:$_f" in
                shellcheck:*.sh|shellcheck:*.bash|psscriptanalyzer:*.ps1|psscriptanalyzer:*.psm1|psscriptanalyzer:*.psd1|hadolint:*) _mine="$_mine $_f" ;;
              esac
            done
            [ -n "$_mine" ] && [ -f "_states/state-$_ln.json" ] || continue
            jq --arg g "$_mine" '.gate = (if .gate == "PASS" then "PARTIAL" else .gate end) | .scope += "; VERSION_GAP, not read:" + $g' \
              "_states/state-$_ln.json" > "_states/state-$_ln.tmp" && mv "_states/state-$_ln.tmp" "_states/state-$_ln.json"
          done
          # OSV writes osv.sarif. `maldeps*.sarif` matched nothing, and has never matched
          # anything, so this row has been NOT ESTABLISHED since it was added.
          add "malicious-deps" APPLICABLE         "$R_MALDEPS" "dependency provenance"  'osv.sarif' malicious-deps
          add "sbom"          APPLICABLE          "$R_SBOM"    "components"             'sbom.sarif' sbom

          # --- container image ------------------------------------------------------------
          #   no image named   NOT_APPLICABLE -- nobody asked for a container scan
          #   image named      APPLICABLE -- the row is built from trivy-image.sarif, which the
          #                    image-scan job now redacts and retains as `sarif-trivy-image-<n>`
          #                    (L12). A named image with no retained report renders
          #                    COLLECTION_FAILED from the row builder, never CLEAN.
          # This row was a fixed COVERAGE_GAP while the evidence died with the runner.
          #
          # SECRETS IN THE IMAGE ARE A SECOND SCANNER, AND THEY HAVE THEIR OWN ROW (the remainder of
          # docs/assurance/KNOWN_GAPS.md section 1). image-scan runs Trivy twice -- vulnerabilities, then secrets -- and
          # writes a separate SARIF for each. The secret report was redacted, kept and published
          # and then read by nothing here: a credential baked into the image blocked through the
          # gate's secret_fail and appeared on no row, so the roster was one scanner short. Same
          # applicability and job as the vulnerability row; a named image with no secret report
          # renders NOT ESTABLISHED from the row builder, never clean.
          # tests/prove_image_secret_row.py.
          _img_appl=NOT_APPLICABLE
          _img_scope="no image configured"
          if [ -n "$IMAGE_REF" ]; then
            _img_scope="$IMAGE_REF"
            _img_appl=APPLICABLE
          fi
          add "trivy-image"   "$_img_appl"        "$R_IMAGE"   "$_img_scope"            'trivy-image.sarif' image-scan
          add "trivy-image-secret" "$_img_appl"   "$R_IMAGE"   "$_img_scope"            'trivy-image-secret.sarif' image-scan

          # --- CodeQL, one verdict per language -------------------------------------------
          #
          # CodeQL's applicability is a PLATFORM fact, established once in discovery, not a
          # language fact and not a guess made here. UNAVAILABLE and NOT_CONFIGURED send a
          # platform owner after a licence; NOT_APPLICABLE sends nobody anywhere; UNKNOWN says
          # plainly that the token could not see the answer. All four render as `skipped` in the
          # Actions UI, which is why none of them is inferred from the job conclusion.
          #
          # SIX MATRIX LEGS WERE ONE ROW. The legs are already separate jobs at run time and each
          # writes codeql-results/<language>.sarif, so a per-language verdict needs no
          # restructuring -- only the admission that "CodeQL: PASS" over six languages, five of
          # which may have skipped everything, is six claims wearing one row.
          cq_appl="$P_CODESCAN"
          case "$cq_appl" in
            ENABLED) cq_appl=APPLICABLE ;;
            UNAVAILABLE|NOT_CONFIGURED) : ;;
            *) cq_appl=APPLICABLE ;;
          esac
          # cq_lang <matrix-leg> <sarif-analyze-writes> <discovery-flag>. The platform verdict
          # narrows to NOT_APPLICABLE where the language itself was not discovered: a licence
          # that is present does not make Go applicable to a repository with no Go in it.
          #
          # THE FILE IS NAMED BY CODEQL'S LANGUAGE ID, NOT BY THE MATRIX LEG. The first Level 2
          # dispatch of this job (private consumer, run 38817782084, kit at 1a5f6f9) wrote
          # javascript.sarif for the javascript-typescript leg; this read `<leg>.sarif`, so a
          # SARIF carrying four JavaScript results sat in the evidence bundle while its row
          # rendered sarif NONE, gate UNDETERMINED. java-kotlin and c-cpp alias the same way
          # (java.sarif, cpp.sarif). One scanner, one file -- the file the tool actually writes.
          # tests/prove_codeql_rows_read_sarif.py runs this step against those names.
          cq_lang() {
            _a="$cq_appl"
            [ "$3" = "true" ] || _a=NOT_APPLICABLE
            # EVIDENCE BEATS THE PRE-FLIGHT. On the same run the platform probe read code
            # scanning UNAVAILABLE (no licence on the private repository), and CodeQL still
            # initialised, analysed and wrote five Python and four JavaScript results; only
            # PUBLICATION to the Security tab was refused. The licence governs where results can
            # go, not whether the analysis runs. A discovered language whose SARIF arrived WAS
            # analysed, whatever the pre-flight said -- calling its retained findings UNAVAILABLE
            # writes "the control found nothing" over "the control found something". A discovered
            # language that left no SARIF keeps the platform's word: that is the case where init
            # really did not run, and it stays unestablished.
            if [ "$3" = "true" ] && [ -n "$(sarif_for "$2")" ]; then _a=APPLICABLE; fi
            add "codeql-$1" "$_a" "$R_CODEQL" "$1" "$2" codeql
          }
          cq_lang python                python.sarif     "$D_PYTHON"
          cq_lang javascript-typescript javascript.sarif "$D_NODE"
          cq_lang go                    go.sarif         "$D_GO"
          cq_lang csharp                csharp.sarif     "$D_DOTNET"
          cq_lang java-kotlin           java.sarif       "$D_JAVA"
          cq_lang c-cpp                 cpp.sarif        "$D_CPP"

          # --- EXTERNAL EVIDENCE (KDEC-028): a caller's own scanner, adopted by contract ----------
          # A caller may run a scanner this kit does not ship, in the same run, before calling it,
          # and upload `sarif-external-<name>-<attempt>` holding ext-<name>.sarif and its row
          # state-ext-<name>.json (and an `-floor` pair for the secret/KEV/malicious class). The
          # sarif-* pull above already fetched them. A row is ADOPTED only when it is well typed:
          # its name is ext-<lowercase>, its job is external or external-floor (never a core job
          # it could impersonate), every value is from the registered vocabulary, and its SARIF is
          # empty or exactly <scanner>.sarif and present. Anything else is refused out loud and
          # not adopted -- it can never become a row that reads clean. The kit names no tool here.
          for _x in _sarif/state-ext-*.json; do
            [ -f "$_x" ] || continue
            _xn="$(jq -r '.scanner // ""' "$_x" 2>/dev/null)" || _xn=""
            _why=""
            printf '%s' "$_xn" | grep -Eq '^ext-[a-z0-9][a-z0-9-]*$' || _why="name '${_xn}' is not ext-<lowercase>"
            [ -n "$_why" ] || [ "$(basename "$_x")" = "state-${_xn}.json" ] || _why="file name does not match scanner ${_xn}"
            [ -n "$_why" ] || jq -e '(.job == "external" or .job == "external-floor")
                and (.applicability | IN("APPLICABLE","NOT_APPLICABLE","UNKNOWN","NOT_CONFIGURED","UNAVAILABLE"))
                and (.execution | IN("COMPLETE","FAILED","COLLECTION_FAILED","NOT_RUN"))
                and (.gate | IN("PASS","UNDETERMINED"))
                and ((.subject // "") | IN("SOURCE","SOURCE_DEPENDENCY","RUNTIME_OBSERVATION","IAC_PLAN","IMAGE"))
                and (.external == true)' "$_x" >/dev/null 2>&1 || _why="job, vocabulary or subject out of contract"
            _xs="$(jq -r '.sarif // ""' "$_x" 2>/dev/null)" || _xs=""
            if [ -z "$_why" ] && [ -n "$_xs" ]; then
              { [ "$_xs" = "${_xn}.sarif" ] && [ -f "_sarif/$_xs" ]; } || _why="sarif '${_xs}' is not ${_xn}.sarif or was not delivered"
            fi
            if [ -n "$_why" ]; then
              echo "::warning title=External evidence refused::$(basename "$_x"): ${_why}. Not adopted."
              continue
            fi
            # PASS is recomputed here, never taken on the row's word.
            jq --arg has "$_xs" '.gate = (if .execution == "COMPLETE" and .applicability == "APPLICABLE" and $has != "" then "PASS" else "UNDETERMINED" end)' \
              "$_x" > "_states/state-${_xn}.json"
            [ -z "$_xs" ] || cp -f "_sarif/$_xs" "_states/$_xs"
            echo "adopted external evidence: ${_xn} ($(jq -r '.job + " " + .execution' "$_x"))"
          done

          echo "built $(ls -1 _states/state-*.json | wc -l) scanner state file(s)"

      - name: Render the report
        id: render
        # THE REPORTER RUNS FROM THE KIT, NOT FROM THE BUNDLE (C1, KDEC-002). It imports
        # finding_identity and finding_subject, which the six-file bootstrap bundle never shipped,
        # so `/tmp/scan_report.py` died at import on every run. `$/` delivers the whole kit at the
        # caller's pinned commit, so the composite runs scripts/scan_report.py beside its modules.
        # tests/prove_report_runs_as_shipped.py runs it the way this step does.
        uses: $/.github/actions/scan-report
        with:
          states-dir: _states
          default-branch: ${{ github.event.repository.default_branch }}
          environment: ${{ inputs.environment }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          max-detail: '20'
          expect: gitleaks,detect-secrets,code-quality,eslint,semgrep,bandit,java-sast,gosec,dotnet-vuln,semgrep-csharp,cppcheck,flawfinder,mobsfscan,mobile-config,trivy,trivy-iac,checkov,actionlint,zizmor,shellcheck,psscriptanalyzer,hadolint,malicious-deps,sbom,trivy-image,trivy-image-secret,codeql-python,codeql-javascript-typescript,codeql-go,codeql-csharp,codeql-java-kotlin,codeql-c-cpp
          # KDEC-010: the capability selection. A scanner row whose job cannot read the code at
          # its version renders PARTIAL, never PASS; a substitution is labelled as one.
          capped-jobs: ${{ needs.resolve.outputs.capped_jobs }}
          not-selected-jobs: ${{ needs.resolve.outputs.not_selected_jobs }}
          fitness-notes: ${{ needs.resolve.outputs.fitness_notes }}

      # BEGIN REDACT_STEP — generated by scripts/inline_normalizer.py. DO NOT EDIT HERE.
      - name: Redact credential material before upload
        if: always()
        shell: bash
        run: |
          # ORDER IS THE WHOLE CONTROL: this runs immediately before an upload, and
          # again before every later upload that follows a step which may have written
          # output -- a redactor after the upload protects nothing while looking exactly
          # like protection (N24/WP19). The sweep itself is ONE canonical script --
          # scripts/redact_all.sh, written by the `kit-scripts` job and fetched into
          # /tmp by every other -- because fourteen copies of one wrapper are how this
          # file reached 608.8 KB and stopped starting.
          #
          # A MISSING TOOL IS NOT A CLEAN RESULT. If the bundle did not arrive,
          # publication must not proceed on the strength of a scrub that never ran.
          if [ ! -s /tmp/redact_all.sh ]; then
            echo "::error title=Redaction could not be guaranteed::/tmp/redact_all.sh is absent."
            echo "The kit-scripts artifact did not reach this job, so no SARIF was scrubbed"
            echo "and none may be published. A MISSING TOOL IS NOT A CLEAN RESULT."
            exit 1
          fi
          bash /tmp/redact_all.sh
      # END REDACT_STEP
      - name: Keep the report as evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-report-${{ github.run_attempt }}
          path: _states
          retention-days: 30
          if-no-files-found: warn

  security-gate:
    name: Security gate
    # THE JOB THAT MATERIALISES THE SCRIPTS IS NOT EXEMPT EITHER. Every scanner `needs`
    # kit-scripts, so if it fails they are SKIPPED -- and the loop in the gate step projects
    # `skipped` into NOT_APPLICABLE. A row of NOT_APPLICABLE over code nobody scanned is the
    # precise collapse this kit exists to refuse, so that job's result is read explicitly
    # below rather than inferred from its dependants.
    #
    # THE NOTE SITS ABOVE THE KEY, NOT INSIDE THE LIST. A comment between two `- item` lines
    # truncates this list for anything reading it line by line: placed inside, it made
    # tests/capability_inventory.py report EVERY scanner as not referenced by the gate --
    # a census downgraded by a comment.
    needs:
      - discover
      - resolve
      - kit-scripts
      - secret-scan
      - code-quality
      - sast-semgrep
      - sast-bandit
      - sast-dotnet
      - sast-java
      - sast-go
      - sast-cpp
      - sast-mobile
      - deps-scan
      - iac-scan
      - malicious-deps
      - sbom
      - codeql
      - image-scan
      # THE REPORT IS NOT EXEMPT, AND THE EXEMPTION WAS NEVER DECIDED -- IT WAS AN OMISSION.
      #
      # `report` assembles the evidence artifact this gate NAMES in its own
      # `evidence_artifact` output. A gate that publishes the name of an artifact whose
      # assembling job it never waited for is asserting something it did not check. It is
      # also the one job whose failure is invisible from a scanner row, because it produces
      # no SARIF of its own. It is checked explicitly below rather than folded into the
      # scanner loop: it is not a scanner and must not acquire a scanner_state.
      - report
    if: always()
    runs-on: ubuntu-latest
    outputs:
      assurance_state: ${{ steps.gate.outputs.assurance_state }}
      enforcement_state: ${{ steps.gate.outputs.enforcement_state }}
      gate_decision: ${{ steps.gate.outputs.gate_decision }}
      secret_gate: ${{ steps.gate.outputs.secret_gate }}
      secret_exceptions_applied: ${{ steps.gate.outputs.secret_exceptions_applied }}
      kev_state: ${{ steps.gate.outputs.kev_state }}
      kev_verdict: ${{ steps.gate.outputs.kev_verdict }}
      known_exploited: ${{ steps.gate.outputs.known_exploited }}
      scanner_states: ${{ steps.gate.outputs.scanner_states }}
      undetermined: ${{ steps.gate.outputs.undetermined }}
      evidence_artifact: ${{ steps.gate.outputs.evidence_artifact }}
      discovery_state: ${{ needs.discover.outputs.state }}
      established: ${{ steps.gate.outputs.established }}
      unestablished: ${{ steps.gate.outputs.unestablished }}
      routing_result: ${{ steps.posture.outputs.routing_result }}
      advisory_causes: ${{ steps.posture.outputs.advisory_causes }}
      controls_required: ${{ steps.posture.outputs.controls_required }}
      controls_executed: ${{ steps.posture.outputs.controls_executed }}
      controls_unavailable: ${{ steps.posture.outputs.controls_unavailable }}
      controls_reduced: ${{ steps.posture.outputs.controls_reduced }}
      controls_skipped: ${{ steps.posture.outputs.controls_skipped }}
      weakenings: ${{ steps.posture.outputs.weakenings }}
      weakening_attribution: ${{ steps.posture.outputs.weakening_attribution }}
      weakening_record: ${{ steps.posture.outputs.weakening_record }}
      policy_resolution: ${{ steps.posture.outputs.policy_resolution }}
      policy_source: ${{ steps.posture.outputs.policy_source }}
      policy_chain: ${{ steps.posture.outputs.policy_chain }}
      rung_declared: ${{ steps.posture.outputs.rung_declared }}
      rung_effective: ${{ steps.posture.outputs.rung_effective }}
      rung_divergence: ${{ steps.posture.outputs.rung_divergence }}
      policy_mode: ${{ steps.posture.outputs.policy_mode }}
      effective_minimum: ${{ steps.posture.outputs.effective_minimum }}
      policy_divergences: ${{ steps.posture.outputs.policy_divergences }}
      environment_tier: ${{ steps.posture.outputs.environment_tier }}
      team_pattern: ${{ steps.posture.outputs.team_pattern }}
      unvalidated_human_workflow_paths: ${{ steps.posture.outputs.unvalidated_human_workflow_paths }}
      deploy_approval: ${{ steps.posture.outputs.deploy_approval }}
      max_exception_renewals: ${{ steps.policy.outputs.policy_max_exception_renewals }}
      run_record: ${{ steps.record.outputs.run_record }}
      assurance_result: ${{ steps.record.outputs.assurance_result }}
    # Bounded so a stalled dependency cannot bill six hours (LM-001: unbounded execution
    # converts a dependency failure into uncontrolled cost).
    # NOT YET: a timeout still surfaces as a plain job failure. It SHOULD classify as
    # UNAVAILABLE / EXECUTION_TIMEOUT — cost is bounded here, semantics are not. See
    # docs/roadmap/FUTURE_WORK.md. Do not let this comment imply the mapping exists.
    timeout-minutes: 10
    steps:
      - name: Resolve the enforcement policy from the register and the protected default branch
        id: policy
        # STAGE 1 RUNS BEFORE ANY RESULT IS READ. The rung, the per-control minimums and the tier
        # come from the policy register (the kit's central copy and the repository's own file on
        # its protected default branch, never this run's tree); policy_mode is DERIVED and never
        # received. No register anywhere is the kit default, crawl: only secrets block. A refusal
        # is named (policy_resolution), and an unreadable register is never the default.
        # scripts/policy_registration.py; tests/prove_gate_reads_rung.py.
        uses: $/.github/actions/resolve-policy
        with:
          default-branch: ${{ github.event.repository.default_branch }}
          environment: ${{ inputs.target_environment }}
          event: ${{ github.event_name }}
          supplied-inputs: ${{ toJSON(inputs) }}
      - name: Check every CVE found against the CISA KEV catalog
        id: kev
        # KNOWN EXPLOITED IN THE WILD BLOCKS AT EVERY RUNG (KDEC-022 item 3, owner 2026-10-23). The
        # catalog is read once per run (a date-keyed cache), pinned in the evidence, and matched
        # against every dependency/image CVE the report found and the register's ticketed,
        # finding-scoped exceptions. This step computes; the gate step below enforces. A feed that
        # cannot be read is kev_state UNAVAILABLE -- never a pass. tests/prove_known_exploited.py.
        if: always()
        uses: $/.github/actions/known-exploited
        with:
          cve-findings: ${{ needs.report.outputs.cve_findings }}
          exceptions: ${{ steps.policy.outputs.policy_known_exploited_exceptions }}
          policy-state: ${{ steps.policy.outputs.policy_state }}
      - name: Enforce required scans
        id: gate
        # Runs whatever the policy step did: a policy step that failed leaves P_STATE empty and the
        # gate strict, never skipped (tests/prove_scanners_survive_enforce.py).
        if: always()
        env:
          # CALLER INPUT ARRIVES AS DATA, NEVER AS SCRIPT TEXT (ledger L38).
          IN_ADVISORY_MODE: ${{ inputs.advisory_mode }}
          # The resolved policy (stage 1, above): whether it resolved, and each scanner job's
          # weakest permitted route. Empty = no policy step ran, and the gate is strict.
          P_STATE: ${{ steps.policy.outputs.policy_state }}
          P_JOB_MINIMUMS: ${{ steps.policy.outputs.policy_job_minimums }}
          # EVERY VALUE ARRIVES THROUGH env:, NOT A $-DOUBLE-BRACE EXPRESSION IN THE SCRIPT. A script that holds an
          # expression is a template, and GitHub refuses the WHOLE workflow when a template passes
          # 21,000 characters -- which this one did (first hosted run, 2026-10-15). Without an
          # expression the script is plain text with no limit. tests/check_expression_length.py.
          G_GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          G_NEEDS_CODEQL_RESULT: ${{ needs.codeql.result }}
          G_NEEDS_CODE_QUALITY_RESULT: ${{ needs.code-quality.result }}
          G_NEEDS_DEPS_SCAN_RESULT: ${{ needs.deps-scan.result }}
          G_NEEDS_DISCOVER_OUTPUTS_COVERAGE_GAPS: ${{ needs.discover.outputs.coverage_gaps }}
          G_NEEDS_DISCOVER_OUTPUTS_COVERAGE_GAP_COUNT: ${{ needs.discover.outputs.coverage_gap_count }}
          G_NEEDS_DISCOVER_OUTPUTS_STATE: ${{ needs.discover.outputs.state }}
          G_NEEDS_DISCOVER_RESULT: ${{ needs.discover.result }}
          G_NEEDS_IAC_SCAN_RESULT: ${{ needs.iac-scan.result }}
          G_NEEDS_IMAGE_SCAN_OUTPUTS_SECRET_STATE: ${{ needs.image-scan.outputs.secret_state }}
          G_NEEDS_IMAGE_SCAN_RESULT: ${{ needs.image-scan.result }}
          G_NEEDS_KIT_SCRIPTS_RESULT: ${{ needs.kit-scripts.result }}
          G_NEEDS_MALICIOUS_DEPS_OUTPUTS_MALICIOUS_STATE: ${{ needs.malicious-deps.outputs.malicious_state }}
          G_NEEDS_MALICIOUS_DEPS_RESULT: ${{ needs.malicious-deps.result }}
          G_NEEDS_REPORT_OUTPUTS_BLOCKING_FINDINGS: ${{ needs.report.outputs.blocking_findings }}
          G_NEEDS_REPORT_OUTPUTS_JOBS_WITH_FINDINGS: ${{ needs.report.outputs.jobs_with_findings }}
          G_NEEDS_REPORT_RESULT: ${{ needs.report.result }}
          G_NEEDS_SAST_BANDIT_RESULT: ${{ needs.sast-bandit.result }}
          G_NEEDS_SAST_CPP_RESULT: ${{ needs.sast-cpp.result }}
          G_NEEDS_SAST_CPP_OUTPUTS_SCAN_STATE: ${{ needs.sast-cpp.outputs.scan_state }}
          G_NEEDS_SAST_CPP_OUTPUTS_SCAN_REASON: ${{ needs.sast-cpp.outputs.scan_reason }}
          G_NEEDS_SAST_DOTNET_RESULT: ${{ needs.sast-dotnet.result }}
          G_NEEDS_SAST_GO_RESULT: ${{ needs.sast-go.result }}
          G_NEEDS_SAST_JAVA_RESULT: ${{ needs.sast-java.result }}
          G_NEEDS_SAST_MOBILE_RESULT: ${{ needs.sast-mobile.result }}
          G_NEEDS_SAST_SEMGREP_RESULT: ${{ needs.sast-semgrep.result }}
          G_NEEDS_SAST_SEMGREP_OUTPUTS_SCAN_STATE: ${{ needs.sast-semgrep.outputs.scan_state }}
          G_NEEDS_SAST_SEMGREP_OUTPUTS_PARSE_PARTIAL_FILES: ${{ needs.sast-semgrep.outputs.parse_partial_files }}
          G_NEEDS_SBOM_OUTPUTS_LICENCE_DENIED: ${{ needs.sbom.outputs.licence_denied }}
          G_NEEDS_SBOM_OUTPUTS_LICENCE_STATE: ${{ needs.sbom.outputs.licence_state }}
          G_NEEDS_SBOM_RESULT: ${{ needs.sbom.result }}
          G_NEEDS_SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          G_NEEDS_RESOLVE_OUTPUTS_VERSION_GAPS: ${{ needs.resolve.outputs.version_gaps }}
          G_NEEDS_RESOLVE_OUTPUTS_VERSION_GAP_COUNT: ${{ needs.resolve.outputs.version_gap_count }}
          # KDEC-010: the capability selection, consumed here (see the loop below).
          G_NEEDS_RESOLVE_OUTPUTS_CAPPED_JOBS: ${{ needs.resolve.outputs.capped_jobs }}
          G_NEEDS_RESOLVE_OUTPUTS_PROVEN_GAP_JOBS: ${{ needs.resolve.outputs.proven_gap_jobs }}
          G_NEEDS_RESOLVE_OUTPUTS_NOT_SELECTED_JOBS: ${{ needs.resolve.outputs.not_selected_jobs }}
          G_NEEDS_RESOLVE_OUTPUTS_SUBSTITUTIONS: ${{ needs.resolve.outputs.substitutions }}
          G_NEEDS_RESOLVE_OUTPUTS_CAPABILITY_GAPS: ${{ needs.resolve.outputs.capability_gaps }}
          G_NEEDS_RESOLVE_OUTPUTS_CAPABILITY_GAP_COUNT: ${{ needs.resolve.outputs.capability_gap_count }}
          G_NEEDS_RESOLVE_OUTPUTS_FITNESS_NOTES: ${{ needs.resolve.outputs.fitness_notes }}
          G_NEEDS_RESOLVE_RESULT: ${{ needs.resolve.result }}
          # THE FINDINGS EACH SCANNER JOB HANDS THIS GATE (lane L-S, O-24): FINDINGS when the job's
          # own threshold fired and no caller input softened it. The jobs no longer fail on it --
          # this gate is the single enforcement point -- so it is read here, not from a conclusion.
          G_FS_CODE_QUALITY: ${{ needs.code-quality.outputs.findings_state }}
          G_FS_SAST_SEMGREP: ${{ needs.sast-semgrep.outputs.findings_state }}
          G_FS_SAST_BANDIT: ${{ needs.sast-bandit.outputs.findings_state }}
          G_FS_SAST_DOTNET: ${{ needs.sast-dotnet.outputs.findings_state }}
          G_FS_SAST_JAVA: ${{ needs.sast-java.outputs.findings_state }}
          G_FS_SAST_GO: ${{ needs.sast-go.outputs.findings_state }}
          G_FS_SAST_CPP: ${{ needs.sast-cpp.outputs.findings_state }}
          G_FS_SAST_MOBILE: ${{ needs.sast-mobile.outputs.findings_state }}
          G_FS_DEPS_SCAN: ${{ needs.deps-scan.outputs.findings_state }}
          G_FS_IAC_SCAN: ${{ needs.iac-scan.outputs.findings_state }}
          G_FS_IMAGE_SCAN: ${{ needs.image-scan.outputs.findings_state }}
          # SECRETS ARE HANDED OVER TOO (owner ruling 2026-10-22): the secret scan's count, the
          # report's fingerprint of each secret, and the register's secret exceptions -- in force
          # and refused. A secret blocks at every tier unless each one is excepted by fingerprint.
          G_FS_SECRET_SCAN: ${{ needs.secret-scan.outputs.findings_state }}
          G_SECRET_COUNT: ${{ needs.secret-scan.outputs.secret_count }}
          G_REPORT_SECRET_FINDINGS: ${{ needs.report.outputs.secret_findings }}
          P_SECRET_EXCEPTIONS: ${{ steps.policy.outputs.policy_secret_exceptions }}
          P_SECRET_EXCEPTION_REFUSALS: ${{ steps.policy.outputs.policy_secret_exception_refusals }}
          # KNOWN EXPLOITED IN THE WILD (KDEC-022 item 3): the kev step's verdict over the report's
          # CVEs, the CISA KEV catalog it read, and the register's refused exceptions.
          K_STATE: ${{ steps.kev.outputs.kev_state }}
          K_VERDICT: ${{ steps.kev.outputs.kev_verdict }}
          K_BLOCKING: ${{ steps.kev.outputs.kev_blocking }}
          K_EXCEPTED: ${{ steps.kev.outputs.kev_excepted }}
          K_CATALOG: ${{ steps.kev.outputs.kev_catalog_version }}
          K_RELEASED: ${{ steps.kev.outputs.kev_date_released }}
          K_WHY: ${{ steps.kev.outputs.kev_why }}
          K_KNOWN_EXPLOITED: ${{ steps.kev.outputs.known_exploited }}
          P_KEV_EXCEPTION_REFUSALS: ${{ steps.policy.outputs.policy_known_exploited_exception_refusals }}
        run: |
          set -u
          fail=0
          secret_fail=0
          # WHAT SET secret_fail. Three things share the "blocks in every mode" class -- a
          # secret, a known-malicious package, and a malicious-package check that produced no
          # evidence -- and the failure message must name the one that fired. Space-separated
          # causes: secret-scan | image-secret | malicious-package | malicious-no-evidence.
          secret_cause=""
          undetermined=0
          # KDEC-010: THE CAPABILITY SELECTED THE SCANNER, AND THIS GATE HONOURS THE SELECTION.
          #
          # resolve declared, per (capability, root), which carried scanner CAN read the target.
          # Two lists reach this loop as data. CAPPED_JOBS: jobs pointed at a VERSION_GAP -- no
          # carried scanner can read it -- whose PASS is capped at scanner_state.PARTIAL ("MUST
          # NOT be projected, summarised or rounded into PASS"; warns, does not block): the claim
          # is unestablished and the aggregate is PARTIAL. NOT_SELECTED_JOBS: jobs that cannot
          # read a target ANOTHER carried scanner was selected for -- their PASS for it is
          # PARTIAL too, but the SELECTED scanner carries the claim, so the aggregate stands and
          # the substitution is named below, never presented as equivalence (PO 6).
          # Findings from a capped or not-selected job are still findings: only PASS is capped.
          # tests/prove_bootstrap_failure.py capability_gap_* and substitution_not_selected.
          CAPPED_JOBS=" ${G_NEEDS_RESOLVE_OUTPUTS_CAPPED_JOBS} "
          NOT_SELECTED_JOBS=" ${G_NEEDS_RESOLVE_OUTPUTS_NOT_SELECTED_JOBS} "
          not_selected=""    # name(PARTIAL) for every not-selected job; the claim lives elsewhere
          # KDEC-014: the jobs capped BECAUSE of a VERSION_GAP, by name, split by whether resolve
          # found the gap established by READ ranges (enforced at uat/prod) or resting on an
          # UNVERIFIED range (recorded, not enforced), so the posture step can name the cause.
          PROVEN_GAP_JOBS=" ${G_NEEDS_RESOLVE_OUTPUTS_PROVEN_GAP_JOBS} "
          version_gapped=""; version_gapped_unverified=""
          # THE TOOLCHAIN IS NOT A FINDING, SO advisory_mode HAS NO AUTHORITY OVER IT.
          #
          # `advisory_mode` exists so a team can see an inherited BACKLOG without being blocked by
          # it. A bootstrap job that did not run produced no backlog: it produced thirteen skipped
          # scanners, which the loop below projects into NOT_APPLICABLE. Under advisory_mode that
          # combination previously exited 0 -- a green gate over code nobody scanned, which is the
          # precise collapse this kit exists to refuse, reached through the one switch a new
          # adopter is most likely to have on.
          #
          # Tracked separately, exactly as secret_fail is, and for the same reason: a mode that
          # softens enforcement must never be able to soften the question of whether the run
          # HAPPENED. tests/prove_bootstrap_failure.py runs this script with kit-scripts=failure
          # under both modes and fails the build if either one comes back green.
          tooling_fail=0
          # THE FINDINGS EVIDENCE (C3). assurance_state was derived from job conclusions alone,
          # and a scanner job SUCCEEDS with findings whenever enforcement is softened
          # (soft_fail_sast, advisory_mode) -- so recorded findings read as PASS, and a job that
          # FAILED because it found something read as UNAVAILABLE, so FINDINGS was unreachable.
          # The report counts blocking findings per job from the SARIF, after dispositions, over
          # established rows only. Environment, not interpolation into logic.
          BLOCKING_FINDINGS="${G_NEEDS_REPORT_OUTPUTS_BLOCKING_FINDINGS}"
          FINDINGS_JOBS=" ${G_NEEDS_REPORT_OUTPUTS_JOBS_WITH_FINDINGS} "
          # A CREDENTIAL INSIDE THE IMAGE IS A SECRET, NOT A SCANNER FAILURE. image-scan runs its
          # secrets step separately and publishes that step's outcome; `failure` here sets
          # secret_fail exactly as the secret-scan job does, so advisory_mode cannot soften it.
          # Proven by tests/prove_bootstrap_failure.py scenario image_secret_advisory.
          IMAGE_SECRET_STATE="${G_NEEDS_IMAGE_SCAN_OUTPUTS_SECRET_STATE}"
          # A KNOWN-MALICIOUS PACKAGE IS LIVE COMPROMISE, NOT INHERITED DEBT (ledger L15). The
          # malicious-deps job publishes its typed state; FINDINGS sets secret_fail exactly as a
          # secret does, and COLLECTION_FAILED does too -- the secret scan's own collection failure
          # blocks in every mode, and "could not tell whether a dependency is malware" is the same
          # class of unknown. Proven by tests/prove_gate_reads_findings.py (malicious_*).
          MALICIOUS_STATE="${G_NEEDS_MALICIOUS_DEPS_OUTPUTS_MALICIOUS_STATE}"
          # A DENIED LICENCE IS A POLICY FINDING THE GATE OWNS (ledger L16). The sbom job succeeds
          # and publishes its verdict; FINDINGS here is a finding like any other (fail=1), which
          # advisory_mode may soften -- a licence is inherited debt, not live compromise.
          # Proven by tests/prove_gate_reads_findings.py (licence_*).
          LICENCE_STATE="${G_NEEDS_SBOM_OUTPUTS_LICENCE_STATE}"
          LICENCE_DENIED="${G_NEEDS_SBOM_OUTPUTS_LICENCE_DENIED}"
          softened=0       # findings established by a job that nonetheless succeeded
          findings_named=""  # every job whose state is FINDINGS, for the policy below
          nonfinding_fail=0  # a job failed with no findings on record: crashed, not scanned
          coverage_partial=""  # jobs that scanned only part of their scope (e.g. PHP Semgrep could not parse)
          states=""          # scanner:state pairs, emitted as JSON below
          established=""     # capabilities that DID establish something
          unestablished=""   # capabilities that could not
          # A job that did not run because its language/toggle was off is SKIPPED and
          # acceptable. A job that FAILED, was CANCELLED, or reports an unexpected
          # state is not. "skipped" is never silently treated as "passed" in the
          # summary — it is printed as skipped so coverage stays visible.
          #
          # image-scan WAS IN `needs` AND NOT IN THIS LIST, WHICH IS THE WORST OF BOTH.
          # The gate waited for the container scan and then never read its result, so a
          # failed image scan could not block and did not appear in scanner_states at all.
          # tests/check_gate.py compares `needs` against the job list and cannot see this,
          # because enumerating a dependency is not the same as enforcing on it.
          for r in "secret-scan=${G_NEEDS_SECRET_SCAN_RESULT}" \
                   "code-quality=${G_NEEDS_CODE_QUALITY_RESULT}" \
                   "sast-semgrep=${G_NEEDS_SAST_SEMGREP_RESULT}" \
                   "sast-bandit=${G_NEEDS_SAST_BANDIT_RESULT}" \
                   "sast-dotnet=${G_NEEDS_SAST_DOTNET_RESULT}" \
                   "sast-java=${G_NEEDS_SAST_JAVA_RESULT}" \
                   "sast-go=${G_NEEDS_SAST_GO_RESULT}" \
                   "sast-cpp=${G_NEEDS_SAST_CPP_RESULT}" \
                   "sast-mobile=${G_NEEDS_SAST_MOBILE_RESULT}" \
                   "deps-scan=${G_NEEDS_DEPS_SCAN_RESULT}" \
                   "iac-scan=${G_NEEDS_IAC_SCAN_RESULT}" \
                   "malicious-deps=${G_NEEDS_MALICIOUS_DEPS_RESULT}" \
                   "sbom=${G_NEEDS_SBOM_RESULT}" \
                   "codeql=${G_NEEDS_CODEQL_RESULT}" \
                   "image-scan=${G_NEEDS_IMAGE_SCAN_RESULT}"; do
            name="${r%%=*}"; res="${r##*=}"
            # Reset per iteration. `st` is set by one of two case blocks below, and a value left
            # over from the previous scanner would silently attach that scanner's verdict to this
            # one -- a wrong state that still looks like a state.
            st=""
            printf '  %-16s %s\n' "$name" "$res"
            # THE SINGLE ENFORCEMENT POINT (lane L-S; owner ruling O-24). A scanner job REPORTS: it
            # succeeds with findings and hands them over as findings_state=FINDINGS, failing only
            # when it could not scan or trust its own count. Findings the job's own threshold fired
            # on, unsoftened by a caller input, are read exactly as a job that failed on them was
            # read before -- the control fired -- and the resolved policy below decides whether
            # they block. tests/prove_gate_policy_enforcement.py (sep_*).
            fs=""; shown="$res"; handed=0
            case "$name" in
              secret-scan)  fs="${G_FS_SECRET_SCAN:-}" ;;
              code-quality) fs="${G_FS_CODE_QUALITY:-}" ;;
              sast-semgrep) fs="${G_FS_SAST_SEMGREP:-}" ;;
              sast-bandit)  fs="${G_FS_SAST_BANDIT:-}" ;;
              sast-dotnet)  fs="${G_FS_SAST_DOTNET:-}" ;;
              sast-java)    fs="${G_FS_SAST_JAVA:-}" ;;
              sast-go)      fs="${G_FS_SAST_GO:-}" ;;
              sast-cpp)     fs="${G_FS_SAST_CPP:-}" ;;
              sast-mobile)  fs="${G_FS_SAST_MOBILE:-}" ;;
              deps-scan)    fs="${G_FS_DEPS_SCAN:-}" ;;
              iac-scan)     fs="${G_FS_IAC_SCAN:-}" ;;
              image-scan)   fs="${G_FS_IMAGE_SCAN:-}" ;;
            esac
            if [ "$res" = "success" ] && [ "$fs" = "FINDINGS" ]; then
              res=failure; st=FINDINGS; handed=1
              shown="success — findings handed to this gate (findings_state=FINDINGS)"
            fi
            # FINDINGS ON RECORD EXPLAIN THE CONCLUSION. Handed (above) or failed with findings = the
            # control fired (a FAILED non-secret job is re-read below as one that could not finish).
            # Succeeded with findings and nothing handed = enforcement was softened by a caller
            # input (or the scanner has no threshold of its own, CodeQL), and the findings exist.
            case "$FINDINGS_JOBS" in
              *" $name "*)
                case "$res" in
                  success) st=FINDINGS; softened=1 ;;
                  failure) st=FINDINGS ;;
                esac ;;
            esac
            echo "| $name | $shown |" >> "$GITHUB_STEP_SUMMARY"
            # Accumulate the per-scanner verdict so the CONSUMER receives vocabulary, not a
            # boolean. A job result of success/skipped is projected into scanner_state terms.
            case "$name:$res" in
              # A scanner skipped by DISCOVERY is genuinely not applicable -- no Go code, no
              # gosec. A capability skipped because nobody supplied a token, a licence or a
              # target is UNESTABLISHED, and collapsing the two would let "this capability was never
              # configured" read exactly like "it ran and found nothing to report".
              codeql:skipped)
                        st=UNAVAILABLE ;;
            esac
            # The job's own typed state, where it published one, outranks the projection of its
            # conclusion: a job that failed BECAUSE it found malware is FINDINGS, not UNAVAILABLE.
            if [ "$name" = "malicious-deps" ] && [ "$res" != "skipped" ]; then
              case "$MALICIOUS_STATE" in
                FINDINGS|COLLECTION_FAILED) st="$MALICIOUS_STATE" ;;
              esac
            fi
            # PHP SEMGREP COULD NOT FULLY PARSE (KDEC-016, 2026-10-22: scan what parses, flag the
            # rest). The job succeeded and its findings are kept; its scan is PARTIAL, never PASS.
            # Findings outrank it (st is already FINDINGS); the files are named either way.
            if [ "$name" = "sast-semgrep" ] && [ "$res" != "skipped" ] && [ "${G_NEEDS_SAST_SEMGREP_OUTPUTS_SCAN_STATE:-}" = "PARTIAL" ]; then
              [ "$res" = "success" ] && [ -z "${st:-}" ] && st=PARTIAL
              # Named for the posture step even when findings outrank the PARTIAL here, so a
              # softened finding beside an unparsed file carries both causes (lane L-A).
              coverage_partial="${coverage_partial}${coverage_partial:+ }${name}"
              echo "::warning title=sast-semgrep PARTIAL (PARSE_PARTIAL_PHP_SYNTAX)::PHP file(s) Semgrep could not fully parse: ${G_NEEDS_SAST_SEMGREP_OUTPUTS_PARSE_PARTIAL_FILES:-unnamed}. Everything else was scanned; these were not, fully."
              echo "| (coverage) | PARTIAL — PARSE_PARTIAL_PHP_SYNTAX | sast-semgrep could not fully parse ${G_NEEDS_SAST_SEMGREP_OUTPUTS_PARSE_PARTIAL_FILES:-unnamed files}; every other file was scanned and its findings stand (COVERAGE_PARTIAL) |" >> "$GITHUB_STEP_SUMMARY"
            fi
            # C/C++ ANALYSED WITHOUT ITS BUILD (KDEC-026): sources no compilation database covered were
            # scanned source-only. The job succeeded and its findings stand; the scan is PARTIAL.
            if [ "$name" = "sast-cpp" ] && [ "$res" != "skipped" ] && [ "${G_NEEDS_SAST_CPP_OUTPUTS_SCAN_STATE:-}" = "PARTIAL" ]; then
              [ "$res" = "success" ] && [ -z "${st:-}" ] && st=PARTIAL
              coverage_partial="${coverage_partial}${coverage_partial:+ }${name}"
              echo "::warning title=sast-cpp PARTIAL (${G_NEEDS_SAST_CPP_OUTPUTS_SCAN_REASON:-CPP_ANALYSIS_PARTIAL})::C/C++ source without build metadata was analysed source-only. Its findings stand; it is not a complete analysis."
              echo "| (coverage) | PARTIAL — ${G_NEEDS_SAST_CPP_OUTPUTS_SCAN_REASON:-CPP_ANALYSIS_PARTIAL} | sast-cpp analysed some C/C++ without a compilation database (COVERAGE_PARTIAL) |" >> "$GITHUB_STEP_SUMMARY"
            fi
            if [ "$name" = "sbom" ] && [ "$res" = "success" ] && [ "$LICENCE_STATE" = "FINDINGS" ]; then
              st=FINDINGS
              fail=1
              echo "::error title=Denied licence::${LICENCE_DENIED:-?} component(s) carry a licence on the caller's denylist (licences.json in the sbom artifact)."
            fi
            [ -n "${st:-}" ] || case "$res" in
              success)  st=PASS ;;
              skipped)  st=NOT_APPLICABLE ;;
              PASS|FINDINGS|PARTIAL|NOT_APPLICABLE|FAILED|UNAVAILABLE|COLLECTION_FAILED) st="$res" ;;
              cancelled) st=UNAVAILABLE ;;
              *)        st=UNAVAILABLE ;;
            esac
            # KDEC-010: A PASS OVER A TARGET THIS SCANNER CANNOT READ IS PARTIAL. Only PASS is
            # capped -- FINDINGS stay findings, and a job that never ran stays what it is.
            fitness=""
            if [ "$st" = "PASS" ]; then
              case "$CAPPED_JOBS" in *" $name "*) st=PARTIAL; fitness=VERSION_GAP ;; esac
              [ -n "$fitness" ] || case "$NOT_SELECTED_JOBS" in *" $name "*) st=PARTIAL; fitness=NOT_SELECTED ;; esac
            fi
            if [ "$fitness" = "VERSION_GAP" ]; then
              case "$PROVEN_GAP_JOBS" in
                *" $name "*) version_gapped="${version_gapped}${version_gapped:+ }${name}" ;;
                *) version_gapped_unverified="${version_gapped_unverified}${version_gapped_unverified:+ }${name}" ;;
              esac
            fi
            # PARTIAL FAILURE IS NOT TOTAL IGNORANCE. Track what WAS established separately from
            # what was not, because collapsing them discards valid evidence exactly as badly as
            # inventing it. A failed Bandit does not erase a Trivy finding; a passing Semgrep does
            # not fill Bandit's hole.
            case "$st" in
              UNAVAILABLE|COLLECTION_FAILED)
                undetermined=1
                unestablished="${unestablished}${unestablished:+ }${name}(${st})"
                ;;
              PARTIAL)
                # Executed, and the security CLAIM is not established. NOT_SELECTED: another
                # scanner was selected for the target and carries the claim, so this one is
                # recorded beside it rather than counted against the run. Anything else PARTIAL
                # (a VERSION_GAP, or a job publishing PARTIAL itself) is unestablished, and the
                # aggregate below may not read PASS over it.
                if [ "$fitness" = "NOT_SELECTED" ]; then
                  not_selected="${not_selected}${not_selected:+ }${name}(${st})"
                else
                  undetermined=1
                  unestablished="${unestablished}${unestablished:+ }${name}(${st})"
                fi
                ;;
              *)
                established="${established}${established:+ }${name}(${st})"
                ;;
            esac
            states="${states}${states:+,}\"$name\":\"$st\""
            [ "$st" = "FINDINGS" ] && findings_named="${findings_named} ${name}"

            case "$res" in
              success|skipped) ;;
              *)
                fail=1
                # A job that failed WITHOUT findings on record did not establish anything: O-24
                # (owner, 2026-10-22) -- the policy never makes that advisory.
                [ "$st" = "FINDINGS" ] || nonfinding_fail=1
                # NOR DID ONE THAT FAILED BESIDE ITS FINDINGS (lane L-S). A scanner job hands its
                # findings over (findings_state) and never fails on them, so a FAILED job with
                # findings on record found some and then could not finish or trust the rest (gosec
                # with one module unanalysed, a count refused mid-run). Its findings stay findings;
                # the run is untrusted, at every rung. An image secret and a known-malicious package
                # still fail their own job and are read as that below; the secret scan hands its
                # secrets over, so a FAILED secret scan is read as a secret too -- fail-safe.
                if [ "$st" = "FINDINGS" ] && [ "$handed" = "0" ]; then
                  crashed=1
                  case "$name" in
                    secret-scan|malicious-deps) crashed=0 ;;
                    image-scan) [ "$IMAGE_SECRET_STATE" = "failure" ] && crashed=0 ;;
                  esac
                  if [ "$crashed" = "1" ]; then
                    nonfinding_fail=1; undetermined=1
                    unestablished="${unestablished}${unestablished:+ }${name}(FAILED)"
                    echo "::error title=${name} FAILED beside its findings::the job failed, and a scanner job never fails on findings -- it could not finish or trust its scan. Its findings stand; the run is untrusted."
                  fi
                fi
                # SECRETS ARE NOT SUBJECT TO ADVISORY MODE. A leaked credential is live
                # exposure, not inherited technical debt, and the remediation is
                # unambiguous: rotate it. Everything else may crawl while a team works
                # down an inherited baseline; this does not.
                if [ "$name" = "secret-scan" ]; then
                  secret_fail=1; secret_cause="${secret_cause}${secret_cause:+ }secret-scan"
                fi
                if [ "$name" = "image-scan" ] && [ "$IMAGE_SECRET_STATE" = "failure" ]; then
                  secret_fail=1; secret_cause="${secret_cause}${secret_cause:+ }image-secret"
                fi
                if [ "$name" = "malicious-deps" ]; then
                  case "$MALICIOUS_STATE" in
                    FINDINGS)
                      secret_fail=1; secret_cause="${secret_cause}${secret_cause:+ }malicious-package"
                      echo "::error title=Known-malicious package::malicious-deps found a MAL- advisory. Blocks in every mode." ;;
                    COLLECTION_FAILED)
                      secret_fail=1; secret_cause="${secret_cause}${secret_cause:+ }malicious-no-evidence"
                      echo "::error title=Malicious-package check produced no evidence::COLLECTION_FAILED blocks in every mode." ;;
                  esac
                fi
                ;;
            esac
          done
          # EXTERNAL EVIDENCE (KDEC-028): findings from a caller's own scanner that the report
          # ADOPTED (state-ext-* rows) and counted under job `external` are findings handed to this
          # gate, routed by the resolved policy like any scanner job's -- advisory at crawl. Their
          # secret / KEV / malicious class arrives as `external-floor` and blocks at every rung, as
          # a secret does; it is not exceptable here. A crashed external scanner counts nothing, so
          # it never reaches this point: the report shows it, and it never blocks (KDEC-019 item 3).
          case "$FINDINGS_JOBS" in
            *" external "*)
              fail=1; findings_named="${findings_named} external"
              established="${established}${established:+ }external(FINDINGS)"
              states="${states}${states:+,}\"external\":\"FINDINGS\""
              echo "| external (adopted evidence) | findings handed to this gate |" >> "$GITHUB_STEP_SUMMARY" ;;
          esac
          case "$FINDINGS_JOBS" in
            *" external-floor "*)
              fail=1; secret_fail=1; secret_cause="${secret_cause}${secret_cause:+ }external-floor"
              established="${established}${established:+ }external-floor(FINDINGS)"
              states="${states}${states:+,}\"external-floor\":\"FINDINGS\""
              echo "| external-floor (adopted evidence) | secret / KEV / malicious class — blocks at every rung |" >> "$GITHUB_STEP_SUMMARY" ;;
          esac
          # SECRET EXCEPTIONS (owner ruling 2026-10-22, lane L-S): "There must be the possibility of
          # exceptions ... but they must be requested and logged with tickets that have explanations."
          # The secret scan's findings are excepted ONLY when the resolved policy (a protected-branch
          # register, never a run input) holds an exception in force for EVERY one of them, by the
          # report's fingerprint, one exception per finding, and the report accounts for exactly the
          # scan's own count. Anything less and the secret BLOCKS, at every tier. An exception the
          # register refused (unticketed, unattributed, expired, not one finding) was never in force.
          # An image secret and a known-malicious package are not exceptable here.
          secret_excepted=0; sx_used=""; sx_uncovered=""
          words_have() { case " $(printf '%s' "$1" | tr '\r\n' '  ') " in *" $2 "*) return 0 ;; esac; return 1; }
          case "${P_STATE:-}" in POLICY_RESOLVED|POLICY_DECISION_EXPIRED|EXCEPTION_RENEWAL_LIMIT|EXCEPTION_HISTORY_UNVERIFIED) sx_policy=1 ;; *) sx_policy=0 ;; esac
          if [ "${G_FS_SECRET_SCAN:-}" = "FINDINGS" ] && words_have "$secret_cause" secret-scan; then
            sx_in_force=""
            if [ "$sx_policy" = "1" ]; then
              sx_in_force=$(printf '%s' "${P_SECRET_EXCEPTIONS:-[]}" | jq -r '.[].finding' 2>/dev/null) || sx_in_force=""
            fi
            sx_total=0; sx_covered=1
            for fp in ${G_REPORT_SECRET_FINDINGS:-}; do
              sx_total=$((sx_total + 1))
              if [ -n "$sx_in_force" ] && words_have "$sx_in_force" "$fp" && ! words_have "$sx_used" "$fp"; then
                sx_used="${sx_used}${sx_used:+ }${fp}"
              else
                sx_covered=0; sx_uncovered="${sx_uncovered}${sx_uncovered:+ }${fp}"
              fi
            done
            # The report must account for exactly what the scan counted, or a secret it could not
            # fingerprint would ride through on another's exception.
            [ "$sx_total" -gt 0 ] && [ "$sx_total" = "${G_SECRET_COUNT:-unknown}" ] || sx_covered=0
            if [ "$sx_covered" = "1" ]; then
              secret_excepted=1
              secret_cause=$(printf '%s' " $secret_cause " | sed 's/ secret-scan / /' | tr -s ' ' | sed 's/^ //; s/ $//')
              [ -n "$secret_cause" ] || secret_fail=0
              findings_named=$(printf '%s' " $findings_named " | sed 's/ secret-scan / /')
              echo "::warning title=SECRET EXCEPTED (ticketed)::${sx_total} secret finding(s) excepted by the policy register, each by fingerprint, ticket and named approver: ${sx_used}. The secret is NOT clean; the exception is logged in the run record and the summary."
            elif [ "$sx_policy" = "1" ] && [ -n "$sx_in_force" ]; then
              echo "::error title=Secret not excepted::the policy register holds secret exceptions, and they do not cover every secret this run found (not covered: ${sx_uncovered:-none}; the scan counted ${G_SECRET_COUNT:-?}, the report fingerprinted ${sx_total}). The secret blocks."
            fi
          fi
          sx_applied_json='[]'
          if [ "$secret_excepted" = "1" ]; then
            sx_applied_json=$(printf '%s' "${P_SECRET_EXCEPTIONS:-[]}" | jq -c --arg used " $sx_used " \
              '[.[] | select(.finding as $f | $used | contains(" " + $f + " "))]' 2>/dev/null) || sx_applied_json='[]'
          fi
          {
            if [ "$secret_excepted" = "1" ]; then
              echo ""
              echo "### Secret exceptions applied (ticketed, attributed, unexpired)"
              echo ""
              echo "| finding (fp) | ticket | approver | expires | register entry | history (KDEC-018) |"
              echo "|---|---|---|---|---|---|"
              printf '%s' "$sx_applied_json" | jq -r '.[] | "| `\(.finding)` | \(.ticket) | \(.approver) | \(.expires) | \(.entry) | \(.history // "first exception") |"' 2>/dev/null
              echo ""
              echo "> **An excepted secret is not a clean result.** Rotate it; the exception expires, and renewals are capped."
              echo ""
            fi
            sx_refused=$(printf '%s' "${P_SECRET_EXCEPTION_REFUSALS:-[]}" | jq -r 'length' 2>/dev/null) || sx_refused=0
            if [ "${sx_refused:-0}" != "0" ]; then
              echo ""
              echo "### Secret exceptions REFUSED by the register (never in force)"
              echo ""
              echo "| finding | ticket | refusal | register entry | history |"
              echo "|---|---|---|---|---|"
              printf '%s' "${P_SECRET_EXCEPTION_REFUSALS:-[]}" | jq -r '.[] | "| `\(.finding)` | \(.ticket) | \(.code) | \(.entry) | \(.history // "") |"' 2>/dev/null
              echo ""
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # KNOWN EXPLOITED IN THE WILD (KDEC-022 item 3, owner 2026-10-23). The kev step matched every
          # dependency/image CVE the report found against the CISA KEV catalog and the register's
          # known_exploited_exceptions. A catalogued CVE not excepted joins the every-mode class, like
          # a known-malicious package: BLOCKED at every rung, advisory_mode included. A check that did
          # not report is UNAVAILABLE -- never CLEAR -- and is visible (the posture step makes it
          # advisory, never PROCEED).
          if [ -z "${K_STATE:-}" ]; then kev_state=UNAVAILABLE; else kev_state="$K_STATE"; fi
          if [ -z "${K_VERDICT:-}" ]; then kev_verdict=UNAVAILABLE; else kev_verdict="$K_VERDICT"; fi
          case "$kev_verdict" in
            BLOCKED)
              secret_fail=1; secret_cause="${secret_cause}${secret_cause:+ }known-exploited" ;;
            EXCEPTED)
              echo "::warning title=KNOWN EXPLOITED, EXCEPTED (ticketed)::${K_EXCEPTED:-?}: on the KEV catalog and excepted by the policy register, each by fingerprint, CVE, ticket and named approver. Not a clean result." ;;
          esac
          if [ "$kev_state" != "AVAILABLE" ]; then
            echo "::warning title=kev_state UNAVAILABLE::the CISA KEV catalog could not be read (${K_WHY:-no reason recorded}). No CVE here has been shown not to be exploited in the wild; this run is not a pass."
          fi
          {
            echo ""
            echo "### Known exploited in the wild (CISA KEV, KDEC-022)"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| kev_state | **${kev_state}** |"
            echo "| catalog | ${K_CATALOG:-not read} released ${K_RELEASED:-?} |"
            echo "| verdict | **${kev_verdict}** |"
            [ -n "${K_BLOCKING:-}" ] && echo "| FINDING_KNOWN_EXPLOITED | ${K_BLOCKING} -- blocks at every rung |"
            if [ "$kev_verdict" = "EXCEPTED" ] || [ -n "${K_EXCEPTED:-}" ]; then
              printf '%s' "${K_KNOWN_EXPLOITED:-[]}" | jq -r '.[] | select(.excepted) | "| excepted \(.cve) | `\(.finding)` ticket \(.ticket), approved by \(.approver) until \(.expires) (\(.history // "first exception")) |"' 2>/dev/null
            fi
            [ "$kev_state" = "AVAILABLE" ] || echo "| why | ${K_WHY:-no reason recorded} -- not a pass |"
            kx_refused=$(printf '%s' "${P_KEV_EXCEPTION_REFUSALS:-[]}" | jq -r 'length' 2>/dev/null) || kx_refused=0
            if [ "${kx_refused:-0}" != "0" ]; then
              printf '%s' "${P_KEV_EXCEPTION_REFUSALS:-[]}" | jq -r '.[] | "| exception REFUSED | \(.cve) `\(.finding)` \(.ticket) -- \(.code) (entry \(.entry)) |"' 2>/dev/null
            fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          # THE EVIDENCE JOB, CHECKED AS ITSELF AND NOT AS A SCANNER.
          #
          # `report` produces no SARIF, so it has no scanner_state and belongs in no row
          # above. It does produce the evidence artifact this gate names in its own output,
          # and it is where correlation, severity and disposition are decided. If it did not
          # run, the gate can still say what each scanner did; it cannot say the run was
          # documented. That is a degraded claim, and a degraded claim must be visible.
          REPORT_RESULT="${G_NEEDS_REPORT_RESULT}"
          echo "| report | $REPORT_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          printf '  %-16s %s\n' "report" "$REPORT_RESULT"
          case "$REPORT_RESULT" in
            success|skipped) ;;
            *)
              echo "::error title=Security report NOT produced::The consolidated report job"
              echo "was '$REPORT_RESULT'. Per-scanner results above stand, but correlation,"
              echo "severity, disposition and the evidence artifact were not assembled. The"
              echo "run is not documented and must not be read as one that was."
              fail=1
              undetermined=1
              # NOT a finding, so advisory_mode does not cover it. See tooling_fail above.
              tooling_fail=1
              ;;
          esac
          # NO COUNT IS NOT A COUNT OF ZERO. If the report ran but published no findings count,
          # nothing here can say the code is clean -- only that the scanners' jobs ended.
          if [ "$REPORT_RESULT" = "success" ] && [ -z "$BLOCKING_FINDINGS" ]; then
            echo "::warning title=Findings evidence absent::The report job succeeded but published"
            echo "no blocking_findings count. A green job is not a clean result; PASS is unavailable."
            undetermined=1
            unestablished="${unestablished}${unestablished:+ }report(NO_FINDINGS_COUNT)"
          fi
          # THE TOOLCHAIN JOB, CHECKED AS ITSELF AND NOT THROUGH ITS DEPENDANTS.
          #
          # `kit-scripts` writes the five canonical scripts and publishes them as a run-scoped
          # artifact. It produces no SARIF, so it has no scanner_state and belongs in no row
          # above. It is also the one job whose failure is INVISIBLE from a scanner row: every
          # scanner `needs` it, a failure skips them all, and `skipped` is projected into
          # NOT_APPLICABLE by the loop above. Thirteen scanners reading NOT_APPLICABLE because
          # a bootstrap job failed is a green-looking run over code nobody scanned.
          #
          # `skipped` is NOT accepted here, unlike `report`. This job has no `if:` -- it cannot
          # legitimately skip, so a skip means the run was cancelled or torn down, and neither
          # establishes anything.
          TOOLING_RESULT="${G_NEEDS_KIT_SCRIPTS_RESULT}"
          echo "| kit-scripts | $TOOLING_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          printf '  %-16s %s\n' "kit-scripts" "$TOOLING_RESULT"
          case "$TOOLING_RESULT" in
            success) ;;
            *)
              echo "::error title=Kit scripts NOT materialised::The job that writes the kit's"
              echo "own scripts was '$TOOLING_RESULT', so redaction, path normalisation, the"
              echo "per-job summaries and the consolidated report had nothing to run. Scanners"
              echo "downstream were SKIPPED, which is NOT evidence that they were inapplicable."
              echo "advisory_mode does NOT cover this: it softens enforcement on FINDINGS, and a"
              echo "bootstrap failure produced no findings to be lenient about."
              fail=1
              undetermined=1
              tooling_fail=1
              ;;
          esac
          # THE DISCOVER JOB, CHECKED AS ITSELF -- NOT ONLY THROUGH THE STATE IT WRITES.
          #
          # DISCOVERY_UNAVAILABLE below is an OUTPUT the discover job sets when its own probing
          # fails. A discover job that DIES sets no outputs at all, so `state` reads '' and that
          # check never fires; scanners gated on its outputs skip into NOT_APPLICABLE, and this
          # gate went green over a run in which applicability was never established.
          # tests/prove_bootstrap_failure.py forces it (discover_failed, both modes).
          DISCOVER_RESULT="${G_NEEDS_DISCOVER_RESULT}"
          echo "| discover | $DISCOVER_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          printf '  %-16s %s\n' "discover" "$DISCOVER_RESULT"
          discover_dead=0
          case "$DISCOVER_RESULT" in
            success) ;;
            *)
              echo "::error title=Discovery job did not complete::The discover job was"
              echo "'$DISCOVER_RESULT', so it emitted no applicability outputs. Scanners gated on"
              echo "those outputs were SKIPPED for want of an answer, not because nothing applied."
              echo "advisory_mode does NOT cover this: not knowing what should have been scanned"
              echo "is not a finding."
              {
                echo ""
                echo "## GATE = FAIL — the run did not happen as specified"
                echo ""
                echo "> The discover job did not complete, so **which scanners should have run is"
                echo "> unknown**. NOT_APPLICABLE rows above are not evidence of absence."
              } >> "$GITHUB_STEP_SUMMARY"
              fail=1
              undetermined=1
              tooling_fail=1
              discover_dead=1
              ;;
          esac
          # THE RESOLVE JOB, CHECKED AS ITSELF -- the same shape as discover, one position later
          # (SINGLE_PIPELINE_TARGET §5.1). It declares, BEFORE the scan, which scanners' declared
          # version ranges cover the code. A resolve job that DIES writes no outputs, so
          # `version_gap_count` below reads '' and the coverage rows never fire. No scanner waits
          # for it to START, so nothing was skipped on its account; what is missing is the
          # capability selection (KDEC-010) a PASS is scoped by. `skipped` is NOT accepted:
          # the job has no `if:`, so a skip means discover died or the run was torn down, and
          # neither is NOT_APPLICABLE. advisory_mode does NOT cover this: an unestablished
          # capability is not a finding. tests/prove_bootstrap_failure.py forces it
          # (resolve_failed, resolve_skipped, both modes).
          RESOLVE_RESULT="${G_NEEDS_RESOLVE_RESULT}"
          echo "| resolve | $RESOLVE_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          printf '  %-16s %s\n' "resolve" "$RESOLVE_RESULT"
          case "$RESOLVE_RESULT" in
            success) ;;
            *)
              echo "::error title=Resolve job did not complete::The resolve job was"
              echo "'$RESOLVE_RESULT', so no version, capability or coverage answer exists for"
              echo "this run. The scanners ran over code whose versions nobody matched against"
              echo "their declared ranges; their silence cannot be read as coverage."
              echo "advisory_mode does NOT cover this: an unestablished capability is not a"
              echo "finding."
              {
                echo ""
                echo "## GATE = FAIL — the run did not happen as specified"
                echo ""
                echo "> The resolve job did not complete, so **which scanners could read the code"
                echo "> at its version is unknown**. Scanner rows above are results over an"
                echo "> unestablished capability, never coverage."
              } >> "$GITHUB_STEP_SUMMARY"
              fail=1
              undetermined=1
              tooling_fail=1
              ;;
          esac
          # A GREEN GATE MUST NOT BE READ AS FULL COVERAGE.
          #
          # Every row above answers "did this scanner block". None of them answers "was there
          # something here nothing scanned". Discovery established that separately; repeating it
          # HERE is the point, because the gate summary is what a reviewer actually reads before
          # approving a promotion, and a COVERAGE_GAP buried three jobs upstream is functionally
          # silent. Environment, not interpolation, so a class name can never be read as shell.
          COVERAGE_GAPS="${G_NEEDS_DISCOVER_OUTPUTS_COVERAGE_GAPS}"
          COVERAGE_GAP_COUNT="${G_NEEDS_DISCOVER_OUTPUTS_COVERAGE_GAP_COUNT}"
          if [ -n "$COVERAGE_GAPS" ]; then
            echo "::warning title=COVERAGE_GAP x${COVERAGE_GAP_COUNT}::${COVERAGE_GAPS} are present"
            echo "in this repository and NO scanner in this kit can read them. Not blocked, and"
            echo "not clean -- nothing looked. A PASS below is scoped to what WAS scanned."
            {
              echo "| (coverage) | COVERAGE_GAP x${COVERAGE_GAP_COUNT} | ${COVERAGE_GAPS} — present, no capable scanner |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          # THE SAME, FOR THE GAPS RESOLVE DECLARED BEFORE THE SCAN (PIPELINE_ORDERING §2.4).
          # A VERSION_UNSUPPORTED answer is a cause of COVERAGE_GAP, not a peer of it: the scanner
          # ran, its findings are findings, and its silence is not coverage. Surfaced beside the
          # class gaps for the same reason they are: a gap declared four jobs upstream is
          # functionally silent to the reviewer who reads this summary. What it DOES to the verdict
          # is decided by the capability selection (KDEC-010) consumed in the loop above: a
          # per-tool gap with a selected substitute changes nothing here; a gap no carried scanner
          # can close is a VERSION_GAP below. UNDETERMINED is the resolver's own fail-safe -- it
          # exited 0 with every answer unknown -- and is printed as such, because a count nobody
          # could take is not a count of zero; and a PASS over an unmatched capability is not a
          # PASS, so the aggregate is PARTIAL. Environment, not interpolation.
          VERSION_GAPS="${G_NEEDS_RESOLVE_OUTPUTS_VERSION_GAPS}"
          VERSION_GAP_COUNT="${G_NEEDS_RESOLVE_OUTPUTS_VERSION_GAP_COUNT}"
          if [ -n "$VERSION_GAPS" ]; then
            echo "::warning title=COVERAGE_GAP x${VERSION_GAP_COUNT} (version)::${VERSION_GAPS}:"
            echo "the target version is outside the scanner's declared range, declared BEFORE the"
            echo "scan. The scanner still ran; its silence is not coverage. A PASS below is scoped"
            echo "to what WAS readable."
            {
              echo "| (coverage) | VERSION_UNSUPPORTED x${VERSION_GAP_COUNT} | ${VERSION_GAPS} — declared before the scan; the scanner ran, its silence is not coverage |"
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$VERSION_GAP_COUNT" = "UNDETERMINED" ]; then
            echo "::warning title=Version gaps UNDETERMINED::The resolver itself failed (fail-safe,"
            echo "exit 0): every version answer is VERSION_SUPPORT_UNDETERMINED, which is a gap,"
            echo "and no count exists. No capability was matched, so no PASS below is scoped by"
            echo "version: the run is PARTIAL."
            {
              echo "| (coverage) | VERSION_GAP_COUNT UNDETERMINED | the resolver failed; every version answer is undetermined, and no count exists |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          # KDEC-010: THE CAPABILITY SELECTION, NAMED WHERE THE REVIEWER READS. Substitutions as
          # substitutions (which tool, why -- never equivalence); gaps as gaps, with the row that
          # would close each one. The states were already capped in the loop; this is the account.
          SUBSTITUTIONS="${G_NEEDS_RESOLVE_OUTPUTS_SUBSTITUTIONS}"
          CAPABILITY_GAPS="${G_NEEDS_RESOLVE_OUTPUTS_CAPABILITY_GAPS}"
          CAPABILITY_GAP_COUNT="${G_NEEDS_RESOLVE_OUTPUTS_CAPABILITY_GAP_COUNT}"
          FITNESS_NOTES="${G_NEEDS_RESOLVE_OUTPUTS_FITNESS_NOTES}"
          if [ -n "$SUBSTITUTIONS" ]; then
            echo "::notice title=SUBSTITUTION::${SUBSTITUTIONS}: the default scanner cannot read the"
            echo "target version and another carried scanner can, so the claim is carried by that"
            echo "one. A substitution, not equivalence: the default still ran, its findings are"
            echo "findings, and its PASS for that target is PARTIAL (${not_selected:-none})."
            {
              echo "| (capability) | SUBSTITUTION | ${SUBSTITUTIONS} — the default cannot read the target; the selected scanner carries the claim. Substitution is not equivalence. Not selected: ${not_selected:-none} |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$CAPABILITY_GAPS" ]; then
            echo "::warning title=VERSION_GAP x${CAPABILITY_GAP_COUNT}::${CAPABILITY_GAPS}: no carried"
            echo "scanner can read the target version. The scan ran where it could; every job"
            echo "pointed at the gap is PARTIAL, never PASS, and the registry row that would close"
            echo "it is named: ${FITNESS_NOTES:-see the resolve job summary}"
            {
              echo "| (capability) | VERSION_GAP x${CAPABILITY_GAP_COUNT} | ${CAPABILITY_GAPS} — no carried scanner can read the target version; capped at PARTIAL, never PASS. ${FITNESS_NOTES:-see the resolve job summary} |"
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$CAPABILITY_GAP_COUNT" = "UNDETERMINED" ]; then
            # No selection exists. Nothing is capped by a count nobody took -- and nothing is
            # PASS over a capability nobody matched. The cause is named as the resolver's own.
            undetermined=1
            unestablished="${unestablished}${unestablished:+ }resolve(VERSION_SUPPORT_UNDETERMINED)"
            {
              echo "| (capability) | SELECTION UNDETERMINED | the resolver failed; no capability was matched to a scanner, so no PASS above is scoped by version |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          # KNOWN GAPS, PRINTED ON EVERY RUN, GREEN ONES INCLUDED.
          #
          # A green gate answers "did anything block". It does not answer "what was this run
          # incapable of seeing", and a reader who cannot see the second will read the first as
          # the whole answer. These are not findings and they are not failures: they are the
          # named edges of what a PASS below actually covers. Each one is also reflected in a
          # ROW of the scan report, as COVERAGE_GAP or as NOT ESTABLISHED -- a caveat printed
          # under a row that still says CLEAN is the same false statement with better manners,
          # so the row changes, and this list only says so out loud.
          #
          # docs/assurance/KNOWN_GAPS.md carries the same list with the detail.
          {
            echo ""
            echo "### Known gaps — what a PASS above does NOT cover"
            echo ""
            echo "| Gap | State | What is not established |"
            echo "|---|---|---|"
            echo "| Container image findings | RETAINED | \`trivy-image.sarif\` (every severity; \`fail_on_severity\` decides only the block) and \`trivy-image-secret.sarif\` are redacted, kept as artifacts and published, and the consolidated report renders each as its own row (\`trivy-image\`, \`trivy-image-secret\`). |"
            echo "| detect-secrets, ruff, mypy, the NuGet audit, SBOM | NOT ESTABLISHED | These emit no SARIF, so their results are visible in the log only and nothing downstream can read them. |"
            echo "| CodeQL matrix cost | (waste, not coverage) | Six legs start whenever ANY language is found; five boot a runner and skip. Coverage is unaffected; the bill is not. |"
            echo "| Build provenance | ABSENT | This kit stamps its own metadata. It issues NO signed attestation — no \`attest-build-provenance\`, no in-toto, no SLSA. Nothing here proves what produced an artifact. |"
            echo "| Detection itself | NOT ESTABLISHED HERE | Every row above says a scanner RAN. None of them says it would have found anything. Only a seeded run establishes that. |"
            echo ""
            echo "> **A green gate is scoped to the rows above it.** These gaps are stated, not"
            echo "> fixed. An annotated gap is honest; a silent one is a lie."
          } >> "$GITHUB_STEP_SUMMARY"
          # THE RESOLVED POLICY DECIDES WHICH FINDINGS BLOCK (stage 1; owner requirement 2026-10-22).
          # Each job with findings contributes its registered minimum (policy_job_minimums); the
          # strictest of them is the findings route. Below BLOCKED the findings are ADVISORY here --
          # the crawl default, only secrets block -- and the posture step routes that minimum
          # (PROCEED_WITH_ADVISORY, or DECISION_REQUIRED at walk). Secrets, a malicious package and
          # a toolchain failure are decided above and below this and never consult it. NO RESOLVED
          # POLICY IS NOT CRAWL: an empty or refused policy leaves the gate strict, as it was.
          # tests/prove_gate_policy_enforcement.py.
          policy_on=0
          case "${P_STATE:-}" in POLICY_RESOLVED|POLICY_DECISION_EXPIRED|EXCEPTION_RENEWAL_LIMIT|EXCEPTION_HISTORY_UNVERIFIED) policy_on=1 ;; esac
          route_rank() { case "$1" in BLOCKED) echo 5;; EVIDENCE_UNTRUSTED) echo 4;; DECISION_REQUIRED) echo 3;; PROCEED_WITH_ADVISORY) echo 2;; PROCEED) echo 1;; *) echo 0;; esac; }
          policy_findings_route=""
          if [ "$policy_on" = "1" ]; then
            for j in $findings_named; do
              jm=""
              for kv in ${P_JOB_MINIMUMS:-}; do
                case "$kv" in "${j}="*) jm="${kv#*=}" ;; esac
              done
              # A job the policy does not name is read at its strictest, never its weakest.
              [ -n "$jm" ] || jm=BLOCKED
              if [ "$(route_rank "$jm")" -gt "$(route_rank "$policy_findings_route")" ]; then
                policy_findings_route="$jm"
              fi
            done
          fi
          # OWNER RULING O-24 (2026-10-22): the policy softens FINDINGS only. A job that crashed or
          # could not collect -- the kit unable to run its own scan -- is never made advisory by it.
          findings_advisory="${IN_ADVISORY_MODE}"
          if [ "$policy_on" = "1" ] && [ "$policy_findings_route" != "BLOCKED" ] && [ "$nonfinding_fail" = "0" ]; then
            findings_advisory=true
          fi
          # NOR DOES advisory_mode (lane L-S): it softens findings, and a scanner job that failed
          # with no findings on record could not scan. That stays a refusal in every mode.
          [ "$nonfinding_fail" = "1" ] && findings_advisory=false
          # EMIT THE CONTRACT BEFORE ANY exit. A gate that blocks and tells the caller nothing
          # about WHY forces every consumer to re-derive state from logs -- which is how a
          # vocabulary dies at an integration boundary.
          emit() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          emit scanner_states "{${states}}"
          emit undetermined "$([ "$undetermined" = "1" ] && echo true || echo false)"
          # THE NAME THE REPORT JOB ACTUALLY UPLOADS (H5). This was the literal "security-sarif",
          # which no job has ever produced, so every consumer following the pointer found nothing.
          # tests/prove_evidence_artifact_named.py compares the two.
          emit evidence_artifact "security-report-${G_GITHUB_RUN_ATTEMPT}"
          # EXCEPTED: secrets were found and every one is excepted, ticketed, in the register -- never PASS.
          if [ "$secret_fail" = "1" ]; then emit secret_gate FAIL
          elif [ "$secret_excepted" = "1" ]; then emit secret_gate EXCEPTED
          else emit secret_gate PASS; fi
          emit secret_exceptions_applied "$sx_applied_json"
          # KDEC-022 item 3: the KEV check's state and verdict, and every catalogued finding.
          emit kev_state "$kev_state"
          emit kev_verdict "$kev_verdict"
          emit known_exploited "${K_KNOWN_EXPLOITED:-[]}"
          # TWO SEPARATE QUESTIONS, answered separately on purpose.
          #
          #   assurance_state   what this run ESTABLISHED about the code
          #   enforcement_state what the gate DID about it
          #
          # Collapsing them is how "did not block" becomes "safe". A run can establish FINDINGS
          # while enforcement is ADVISORY, and UNDETERMINED must never present as PASS.
          # DISCOVERY FAILURE POISONS THE RESULT. If applicability could not be established, no
          # amount of green scanners establishes posture: we do not know what was not scanned.
          if [ "${G_NEEDS_DISCOVER_OUTPUTS_STATE}" = "DISCOVERY_UNAVAILABLE" ]; then
            echo "::warning title=Discovery unavailable::Applicability was not established."
            echo "Scanner results cannot be read as coverage. Every capability was force-enabled."
            undetermined=1
          fi
          # DEGRADATION MAY REDUCE THE SCOPE OR CONFIDENCE OF A CLAIM.
          # IT MUST NEVER INCREASE ITS AUTHORITY.
          #
          # An earlier version projected ANY unavailable scanner into a blanket UNDETERMINED, which
          # discards everything that WAS established -- as destructive as inventing a PASS, just in
          # the other direction. Preserve what is known; annotate what became unknown.
          #
          # UNDETERMINED is reserved for the case where the AGGREGATE claim genuinely cannot be
          # made: discovery failed, so we do not know which capabilities should have run, and
          # therefore cannot know what we did not scan.
          emit established "$established"
          emit unestablished "$unestablished"
          # KDEC-010: jobs whose PASS was PARTIAL for a target a selected scanner carries. Beside
          # the two lists above, never inside either: not evidence, and not missing evidence.
          emit not_selected "$not_selected"
          emit version_gapped "$version_gapped"
          emit version_gapped_unverified "$version_gapped_unverified"
          emit policy_findings_route "$policy_findings_route"
          emit coverage_partial "$coverage_partial"

          if [ "${G_NEEDS_DISCOVER_OUTPUTS_STATE}" = "DISCOVERY_UNAVAILABLE" ] || [ "$discover_dead" = "1" ]; then
            echo "::error title=UNDETERMINED::Discovery failed, so the set of capabilities that"
            echo "SHOULD have run is unknown. Individual scanner results cannot be read as coverage"
            echo "because we cannot know what was never attempted."
            emit assurance_state UNDETERMINED
          elif [ "$undetermined" = "1" ]; then
            echo "::warning title=PARTIAL assurance::Some capabilities could not establish a result."
            echo "  established:   ${established:-none}"
            echo "  UNESTABLISHED: ${unestablished}"
            echo "What was established REMAINS established. What was not is named above, and stays"
            echo "unknown until new evidence resolves it -- nothing downstream may default it away."
            emit assurance_state PARTIAL
          elif [ "$fail" = "1" ] || [ "$secret_fail" = "1" ] || [ "$softened" = "1" ]; then
            emit assurance_state FINDINGS
          else
            emit assurance_state PASS
          fi

          if [ "$secret_fail" = "1" ] || [ "$tooling_fail" = "1" ]; then
            emit enforcement_state BLOCKED; emit gate_decision FAIL
          elif [ "$fail" = "1" ] && [ "$findings_advisory" = "true" ]; then
            emit enforcement_state ADVISORY; emit gate_decision ADVISORY
          elif [ "$fail" = "1" ]; then
            emit enforcement_state BLOCKED; emit gate_decision FAIL
          elif [ "$softened" = "1" ]; then
            emit enforcement_state ADVISORY; emit gate_decision ADVISORY
          else
            emit enforcement_state ALLOWED; emit gate_decision PASS
          fi

          # CHECKED BEFORE advisory_mode, deliberately. advisory_mode was built as a blanket
          # switch and suppressed this too, which directly contradicted the policy that secrets
          # block from day one. Ordering the secret verdict first is what makes the policy real
          # rather than aspirational.
          if [ "$secret_fail" = "1" ]; then
            # NAME THE ACTUAL CAUSE. This block printed "A secret finding blocks regardless of
            # mode" for every cause, so a lockfile the malicious-package scanner could not parse sent a reader
            # hunting for a credential that was never there. One message per recorded cause;
            # a cause nobody recorded is said to be unrecorded, never dressed as a secret.
            # Proven by tests/prove_gate_reads_findings.py (scenarios secret_scan_failed,
            # malicious_*).
            for cause in ${secret_cause:-unrecorded}; do
              case "$cause" in
                secret-scan|image-secret)
                  echo "::error title=GATE=FAIL (secrets)::A secret finding blocks regardless of mode."
                  echo "advisory_mode does NOT cover secrets. Rotate the credential, then remove it."
                  echo "If this is a documented test fixture or generated dummy, it needs an APPROVED"
                  echo "disposition scoped to that exact finding — not a mode change, and not a"
                  echo "developer-side suppression."
                  {
                    echo "## GATE = FAIL — secret finding"
                    echo ""
                    echo "> **Secrets are outside advisory mode.** A leaked credential is live exposure,"
                    echo "> not inherited debt. Rotate first, then remove from history."
                  } >> "$GITHUB_STEP_SUMMARY" ;;
                malicious-package)
                  echo "::error title=GATE=FAIL (malicious package)::A known-malicious package blocks regardless of mode."
                  echo "advisory_mode does NOT cover a compromised dependency: it is live exposure, not"
                  echo "inherited debt. Remove it, rotate anything the build environment could reach,"
                  echo "and pin a clean version (the malicious-deps job log names the MAL- advisory)."
                  {
                    echo "## GATE = FAIL — known-malicious package"
                    echo ""
                    echo "> **A compromised dependency is outside advisory mode.** Remove it and rotate"
                    echo "> what the build environment could reach."
                  } >> "$GITHUB_STEP_SUMMARY" ;;
                known-exploited)
                  echo "::error title=GATE=FAIL (FINDING_KNOWN_EXPLOITED)::A CVE on the CISA KEV catalog blocks at every rung: ${K_BLOCKING:-unnamed}."
                  echo "advisory_mode and crawl do NOT cover it: attackers are using it now (KDEC-022). Upgrade"
                  echo "or remove the component; only a ticketed known_exploited_exceptions entry for that one"
                  echo "finding excepts it."
                  {
                    echo "## GATE = FAIL — FINDING_KNOWN_EXPLOITED"
                    echo ""
                    echo "> **Exploited in the wild blocks at every rung.** ${K_BLOCKING:-unnamed} -- on the KEV catalog ${K_CATALOG:-?}."
                  } >> "$GITHUB_STEP_SUMMARY" ;;
                malicious-no-evidence)
                  echo "::error title=GATE=FAIL (malicious-package evidence absent)::The malicious-package check produced no evidence, and no evidence blocks regardless of mode."
                  echo "advisory_mode does NOT cover this: absence of a match is not proof of a clean"
                  echo "supply chain. Fix what stopped the malicious-package scanner reading every"
                  echo "lockfile (the malicious-deps job log names it), then re-run."
                  {
                    echo "## GATE = FAIL — malicious-package evidence absent"
                    echo ""
                    echo "> **No evidence is not a clean supply chain.** The check could not read every"
                    echo "> lockfile; nothing here says the dependencies are clean."
                  } >> "$GITHUB_STEP_SUMMARY" ;;
                external-floor)
                  echo "::error title=GATE=FAIL (external evidence, floor class)::A caller-delivered scanner reported a secret, known-exploited (KEV) or malicious finding. It blocks regardless of mode."
                  echo "## GATE = FAIL — external evidence of the secret / KEV / malicious class" >> "$GITHUB_STEP_SUMMARY" ;;
                *)
                  echo "::error title=GATE=FAIL (every-mode block)::A finding of the class that blocks in every mode was recorded without its cause ($cause)."
                  echo "## GATE = FAIL — every-mode block, cause $cause" >> "$GITHUB_STEP_SUMMARY" ;;
              esac
            done
            exit 1
          fi
          # CHECKED BEFORE advisory_mode, for the same reason secrets are.
          #
          # A toolchain or report failure is not a finding, so there is nothing for a findings
          # mode to be lenient about. Left inside the advisory branch, `kit-scripts: failure`
          # plus thirteen skipped scanners exited 0 and published a row of NOT_APPLICABLE --
          # the strongest-looking green this workflow can produce, over a run in which nothing
          # was scanned at all.
          if [ "$tooling_fail" = "1" ]; then
            echo "::error title=GATE=FAIL (toolchain)::The run did not HAPPEN as specified."
            echo "advisory_mode does not cover this. NOT_APPLICABLE rows above describe scanners"
            echo "that were skipped because a job they all depend on failed -- they are not"
            echo "evidence that those scanners had nothing to find."
            {
              echo "## GATE = FAIL — the run did not happen"
              echo ""
              echo "> A job every scanner depends on failed, so the scanners were **skipped**."
              echo "> **A skipped scanner is not a clean scanner.** advisory_mode softens"
              echo "> enforcement on findings; it has no authority over whether a run occurred."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$fail" = "1" ]; then
            if [ "$findings_advisory" = "true" ] && [ "${IN_ADVISORY_MODE}" != "true" ]; then
              echo "::warning title=GATE=ADVISORY (registered policy)::Non-secret findings are reported and not blocked: the resolved policy (${P_STATE}) sets them at ${policy_findings_route:-PROCEED_WITH_ADVISORY}. Secrets still block unless each one is excepted, by fingerprint and ticket, in the register (see secret_gate). The posture record carries the rung and the route."
              {
                echo "## GATE = ADVISORY (registered policy)"
                echo ""
                echo "> Findings are reported and persisted; the registered rung does not block them."
                echo "> **Secrets are always enforced.** The route is \`${policy_findings_route:-PROCEED_WITH_ADVISORY}\`."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$findings_advisory" = "true" ]; then
              echo "::warning title=GATE=ADVISORY — non-secret findings not blocked::Scanners ran"
              echo "and findings were reported and persisted, but enforcement is OFF for them."
              echo "SECRETS STILL BLOCK — advisory mode never covered them."
              echo "ADVISORY MODE IS A BASELINE TOOL, NOT A RESTING STATE. Left on, it is"
              echo "indistinguishable from having no gate at all for everything except secrets."
              {
                echo "## GATE = ADVISORY (non-secret findings)"
                echo ""
                echo "> Every scanner ran and every finding is reported and persisted."
                echo "> **Non-secret findings were not blocked. Secrets are always enforced.**"
                echo "> Turn \`advisory_mode\` off once the baseline is understood — a permanent"
                echo "> advisory mode is not a gate."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::error::One or more required security scans failed."
            exit 1
          fi
          if [ "$softened" = "1" ]; then
            echo "::warning title=GATE=ADVISORY — findings recorded, enforcement softened::"
            echo "Blocking findings were established (${BLOCKING_FINDINGS}) in:${FINDINGS_JOBS}-- and"
            echo "their jobs handed none of them to this gate (softened by soft_fail_sast or"
            echo "advisory_mode, or a scanner with no threshold of its own). This is NOT a clean result."
            {
              echo "## GATE = ADVISORY — findings recorded, not blocked"
              echo ""
              echo "> ${BLOCKING_FINDINGS} blocking finding(s) in:${FINDINGS_JOBS}"
              echo "> Enforcement was softened for these jobs. **Not a clean result.**"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "All required security scans passed or were not applicable."

      # ── CONTROL POSTURE RECORD AND THE VERDICT DEPLOY READS (ledger L30, L31) ──────────────
      #
      # THE GATE SAID WHAT HAPPENED. THIS SAYS WHAT SHOULD HAPPEN NEXT, AND WHO DECIDED.
      #
      # The three other reusable workflows already emit this contract (routing_result, the
      # required/executed/unavailable/reduced/skipped rows, and the weakening record), and
      # deployment reads `routing_result` -- never a job conclusion (SINGLE_PIPELINE_TARGET
      # section 5.2). The flagship emitted none of it and was exempt from
      # tests/check_weakening_record.py on a reason ("623 KB, cannot start") that stopped being true.
      # A caller could set soft_fail_sast or advisory_mode and nothing a consumer could read said
      # so.
      #
      # THE ENUMERATION IS TOTAL OVER THIS WORKFLOW'S INPUTS (W1). Vocabulary:
      # assurance-taxonomy.yaml :: control_weakening, routing_result.
      - name: Control posture — required, executed, unavailable, reduced, skipped, and who decided
        id: posture
        if: always()
        env:
          # CALLER INPUT ARRIVES AS DATA, NEVER AS SCRIPT TEXT (tests/lint_injection.py).
          W_LANGUAGE: ${{ inputs.language }}
          W_PATHS: ${{ inputs.paths }}
          W_IAC_MODE: ${{ inputs.iac_mode }}
          W_ENABLE_IAC: ${{ inputs.enable_iac }}
          W_CODEQL_QUERIES: ${{ inputs.codeql_queries }}
          W_LICENSE_DENY: ${{ inputs.license_deny }}
          W_IMAGE_REF: ${{ inputs.image_ref }}
          W_SEMGREP_CONFIG: ${{ inputs.semgrep_config }}
          W_FAIL_ON_SEVERITY: ${{ inputs.fail_on_severity }}
          W_ENABLE_SBOM: ${{ inputs.enable_sbom }}
          W_ENABLE_MALICIOUS_PKG_SCAN: ${{ inputs.enable_malicious_pkg_scan }}
          W_ADVISORY_MODE: ${{ inputs.advisory_mode }}
          W_SCAN_GIT_HISTORY: ${{ inputs.scan_git_history }}
          W_ENFORCE_LINT: ${{ inputs.enforce_lint }}
          W_ENVIRONMENT: ${{ inputs.environment }}
          W_SOFT_FAIL_SAST: ${{ inputs.soft_fail_sast }}
          W_WEAKENING_REASON: ${{ inputs.weakening_reason }}
          W_WEAKENING_AUTHORITY: ${{ inputs.weakening_authority }}
          W_WEAKENING_EXCEPTION_REF: ${{ inputs.weakening_exception_ref }}
          W_WEAKENING_EXPIRES: ${{ inputs.weakening_expires }}
          # What the gate established, as data.
          G_ASSURANCE: ${{ steps.gate.outputs.assurance_state }}
          G_ENFORCEMENT: ${{ steps.gate.outputs.enforcement_state }}
          G_SECRET_GATE: ${{ steps.gate.outputs.secret_gate }}
          G_UNESTABLISHED: ${{ steps.gate.outputs.unestablished }}
          G_VERSION_GAPPED: ${{ steps.gate.outputs.version_gapped }}
          G_VERSION_GAPPED_UNVERIFIED: ${{ steps.gate.outputs.version_gapped_unverified }}
          G_POLICY_FINDINGS_ROUTE: ${{ steps.gate.outputs.policy_findings_route }}
          G_COVERAGE_PARTIAL: ${{ steps.gate.outputs.coverage_partial }}
          G_kev_state: ${{ steps.gate.outputs.kev_state }}
          G_KEV_VERDICT: ${{ steps.gate.outputs.kev_verdict }}
          W_TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          # What stage 1 resolved, as data (wiring/gate-rung.patch.md section 4.1).
          P_RESOLUTION: ${{ steps.policy.outputs.policy_state }}
          P_ROUTES: ${{ steps.policy.outputs.policy_routes_to }}
          P_RUNG_DECLARED: ${{ steps.policy.outputs.policy_rung_declared }}
          P_RUNG_EFFECTIVE: ${{ steps.policy.outputs.policy_rung_effective }}
          P_RUNG_DIVERGENCE: ${{ steps.policy.outputs.policy_rung_divergence }}
          P_POLICY_MODE: ${{ steps.policy.outputs.policy_policy_mode }}
          P_ENVIRONMENT: ${{ steps.policy.outputs.policy_environment }}
          P_TIER: ${{ steps.policy.outputs.policy_environment_tier }}
          P_TEAM: ${{ steps.policy.outputs.policy_team_pattern }}
          P_EFFECTIVE_MINIMUM: ${{ steps.policy.outputs.policy_effective_minimum }}
          P_DIVERGENCES: ${{ steps.policy.outputs.policy_divergences }}
          P_WEAKENINGS: ${{ steps.policy.outputs.policy_weakenings }}
          P_UNVALIDATED: ${{ steps.policy.outputs.policy_unvalidated_human_workflow_paths }}
          P_STOPS_ON_UNTRUSTED: ${{ steps.policy.outputs.policy_stops_on_evidence_untrusted }}
          P_SOURCE: ${{ steps.policy.outputs.policy_source }}
          P_CHAIN: ${{ steps.policy.outputs.policy_chain }}
          P_REFUSALS: ${{ steps.policy.outputs.policy_refusals }}
          P_DEPLOY_APPROVAL: ${{ steps.policy.outputs.policy_deploy_approval }}
          P_NOTICES: ${{ steps.policy.outputs.policy_notices }}
        run: |
          set -u
          req=""; exe=""; skp=""; red=""; wk=""; dead=""; inforce=0; badclass=0

          # AT BASELINE MEANS "AS STRONG AS THIS KIT SHIPS IT".
          #   NONEMPTY        at baseline when any value was supplied
          #   oneof:a,b       at baseline on any of the listed values
          #   not:v           at baseline on anything except v
          #   ordeeper:v      at baseline on v, and on `true` -- a boolean whose only other value
          #                   runs MORE of the control, so turning it on is never a weakening
          #   literal         at baseline on exact equality
          at_baseline() {
            case "$2" in
              NONEMPTY)   [ -n "$1" ] ;;
              oneof:*)    case ",${2#oneof:}," in *",$1,"*) true ;; *) false ;; esac ;;
              not:*)      [ "$1" != "${2#not:}" ] ;;
              ordeeper:*) [ "$1" = "${2#ordeeper:}" ] || [ "$1" = "true" ] ;;
              *)          [ "$1" = "$2" ] ;;
            esac
          }

          # posture <input> <control_weakening class> <baseline> <control> "<value>"
          posture() {
            n="$1"; cls="$2"; base="$3"; ctl="$4"; val="${5-}"; st=WEAKENING_AT_BASELINE
            case "$cls" in
              NOT_A_CONTROL_SURFACE|EXCEPTION_ATTRIBUTION)
                return 0 ;;
              CONTROL_SURFACE_DEAD)
                at_baseline "$val" "$base" || dead="$dead,$n" ;;
              TARGET_NOT_SUPPLIED)
                # Skipped because the caller supplied no target or policy, which the kit cannot
                # invent. Distinct from CONTROL_DISABLED and deliberately NOT a weakening.
                req="$req,$ctl"
                if at_baseline "$val" "$base"; then exe="$exe,$ctl"; else skp="$skp,$ctl"; fi ;;
              CONTROL_DISABLED)
                req="$req,$ctl"
                if at_baseline "$val" "$base"; then exe="$exe,$ctl"
                else st=WEAKENING_IN_FORCE; skp="$skp,$ctl"; inforce=$((inforce+1)); fi ;;
              GATE_SOFTENED)
                # The control runs and reports; only the block is withheld -- reduced, not skipped.
                req="$req,$ctl"; exe="$exe,$ctl"
                at_baseline "$val" "$base" || {
                  st=WEAKENING_IN_FORCE; red="$red,$ctl"; inforce=$((inforce+1)); } ;;
              SCOPE_NARROWED|SEVERITY_RAISED|DEPTH_REDUCED)
                # Different is not provably weaker, and calling it baseline would be the silence
                # this record exists to end -- so it owes a decision.
                req="$req,$ctl"; exe="$exe,$ctl"
                at_baseline "$val" "$base" || {
                  st=CONTROL_RECONFIGURED; red="$red,$ctl"; inforce=$((inforce+1)); } ;;
              *)
                echo "::error title=Unregistered control_weakening class::$cls on input $n is not"
                echo "a term in assurance-taxonomy.yaml. The posture record cannot be trusted."
                badclass=1; return 0 ;;
            esac
            wk="$wk,{\"input\":\"$n\",\"class\":\"$cls\",\"control\":\"$ctl\",\"baseline\":\"$base\",\"value\":\"$val\",\"state\":\"$st\"}"
          }

          posture python_version            NOT_A_CONTROL_SURFACE - -
          posture node_version              NOT_A_CONTROL_SURFACE - -
          posture dotnet_version            NOT_A_CONTROL_SURFACE - -
          posture go_version                NOT_A_CONTROL_SURFACE - -
          posture java_version              NOT_A_CONTROL_SURFACE - -
          # Lint style is declared NOT a security control by this kit, so its shipped baseline is
          # enforcement OFF -- and turning it on only strengthens it, so neither setting is a
          # weakening. Still a control surface (W7 refused it as inert: its own text says
          # advisory). tests/prove_code_quality_enforces.py proves both settings behave.
          posture enforce_lint              GATE_SOFTENED         "ordeeper:false"    code-quality       "$W_ENFORCE_LINT"
          # Discovery decides applicability; `language` can only EXCLUDE ecosystems it found.
          posture language                  SCOPE_NARROWED        "oneof:auto,multi"  all-languages      "$W_LANGUAGE"
          # Narrows every scanner but the secret scan, which always covers the root (KDEC-018).
          posture paths                     SCOPE_NARROWED        "."                 all-scanners       "$W_PATHS"
          posture iac_mode                  CONTROL_DISABLED      "not:disabled"      iac-scan           "$W_IAC_MODE"
          posture enable_iac                CONTROL_SURFACE_DEAD  "false"             iac-scan           "$W_ENABLE_IAC"
          posture codeql_queries            DEPTH_REDUCED         "security-extended" codeql             "$W_CODEQL_QUERIES"
          posture license_deny              TARGET_NOT_SUPPLIED   NONEMPTY            sbom-licence-gate  "$W_LICENSE_DENY"
          posture image_ref                 TARGET_NOT_SUPPLIED   NONEMPTY            image-scan         "$W_IMAGE_REF"
          posture semgrep_config            SCOPE_NARROWED        "p/default p/owasp-top-ten p/xss" sast-semgrep "$W_SEMGREP_CONFIG"
          posture fail_on_severity          SEVERITY_RAISED       "CRITICAL,HIGH"     deps-scan          "$W_FAIL_ON_SEVERITY"
          posture enable_sbom               CONTROL_DISABLED      "true"              sbom               "$W_ENABLE_SBOM"
          posture enable_malicious_pkg_scan CONTROL_DISABLED      "true"              malicious-deps     "$W_ENABLE_MALICIOUS_PKG_SCAN"
          posture advisory_mode             GATE_SOFTENED         "false"             security-gate      "$W_ADVISORY_MODE"
          posture scan_git_history          DEPTH_REDUCED         "ordeeper:false"    secret-scan        "$W_SCAN_GIT_HISTORY"
          # TEST-ONLY (KDEC-011). Governs no control: it can only ADD files to the scanned tree,
          # every added file is scanned by the same rules, an existing file is never overwritten,
          # and hidden files or scanner configuration (the add-only way to silence a finding) are
          # refused -- tests/prove_test_only_seeds_add_only.py runs each refusal. The secret-scan
          # job warns and writes a summary row whenever it is in force.
          posture test_only_seed_artifact   NOT_A_CONTROL_SURFACE - -
          # Selects a policy-register cell, and never one weaker than a merge already reaches: the
          # resolver evaluates a pull request at the merge reach whatever is named. Not a control's
          # strength, scope, depth or enforcement by itself (wiring/gate-rung.patch.md section 2).
          posture target_environment        NOT_A_CONTROL_SURFACE - -
          # THE SHIPPED DEFAULT IS THE BASELINE (KDEC-008 OD-7: soft_fail_sast false), so a caller
          # who changes nothing records no weakening, and setting it true is one -- a softening the
          # caller chose, recorded against the registered policy beside it.
          posture soft_fail_sast           GATE_SOFTENED         "false"             sast               "$W_SOFT_FAIL_SAST"
          # No environment named = the baseline control is skipped (identity claim EVIDENCE_UNTRUSTED,
          # nothing grandfathered); a target not supplied, deliberately not a weakening.
          posture environment               TARGET_NOT_SUPPLIED   NONEMPTY            baseline-ledger    "$W_ENVIRONMENT"
          posture weakening_reason          EXCEPTION_ATTRIBUTION - -
          posture weakening_authority       EXCEPTION_ATTRIBUTION - -
          posture weakening_exception_ref   EXCEPTION_ATTRIBUTION - -
          posture weakening_expires         EXCEPTION_ATTRIBUTION - -

          # UNAVAILABLE IS NOT CLEAN. The gate names every capability that could not establish a
          # result, as name(STATE); those are the controls that were required and not observed.
          unav=""
          for u in ${G_UNESTABLISHED:-}; do unav="$unav,${u%%(*}"; done

          dedupe() {
            printf '%s' "${1#,}" | tr ',' '\n' | sed '/^$/d' | sort -u | tr '\n' ',' | sed 's/,$//'
          }
          REQ="$(dedupe "$req")"; EXE="$(dedupe "$exe")"
          SKP="$(dedupe "$skp")"; RED="$(dedupe "$red")"; UNAV="$(dedupe "$unav")"
          for c in $(printf '%s' "$SKP" | tr ',' ' '); do
            EXE="$(printf '%s' "$EXE" | tr ',' '\n' | grep -vx "$c" | tr '\n' ',' | sed 's/,$//')"
          done

          # WHO DECIDED. A reason without an authority is an explanation, not a decision; a past
          # expiry reverts to owing one, because silence never renews a weakening.
          auth=WEAKENING_AT_BASELINE
          if [ "$inforce" -gt 0 ]; then
            if [ -n "$W_WEAKENING_REASON" ] && [ -n "$W_WEAKENING_AUTHORITY" ]; then
              auth=WEAKENING_ATTRIBUTED
              # AN EXPIRY NOBODY CAN READ HAS NOT "NOT ARRIVED". Dates compare as strings below, which
              # is correct only for a real YYYY-MM-DD: `never` or `31/12/1999` sorted after every ISO
              # date and read as unexpired forever. Anything that is not a valid calendar date reverts
              # to owing a decision, and says why. tests/prove_gate_routing.py, expiry_* scenarios.
              if [ -n "$W_WEAKENING_EXPIRES" ]; then
                if ! printf '%s' "$W_WEAKENING_EXPIRES" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' ||
                   [ "$(date -u -d "$W_WEAKENING_EXPIRES" +%Y-%m-%d 2>/dev/null)" != "$W_WEAKENING_EXPIRES" ]; then
                  echo "::warning title=Unreadable weakening expiry::'$W_WEAKENING_EXPIRES' is not a"
                  echo "YYYY-MM-DD calendar date, so the exception cannot be shown to be in force."
                  auth=WEAKENING_EXCEPTION_EXPIRED
                elif [ "$(date -u +%Y-%m-%d)" ">" "$W_WEAKENING_EXPIRES" ]; then
                  auth=WEAKENING_EXCEPTION_EXPIRED
                fi
              fi
            else
              auth=WEAKENING_UNATTRIBUTED
            fi
          fi

          # THE POLICY (wiring/gate-rung.patch.md section 4.2). Stage 1 resolved the register, or
          # refused by name. A refusal is not the default: a policy DEFECT (a supplied policy_mode,
          # a conflict, an unattributed decision, a softened secret, non-monotone tiers) routes
          # BLOCKED, a missing input (unreadable register, unknown environment) routes
          # EVIDENCE_UNTRUSTED, an expired decision DECISION_REQUIRED -- folded by precedence below.
          # A register softening in force arrives as attributed weakening rows and joins the record.
          case "${P_RESOLUTION:-}" in
            POLICY_RESOLVED) : ;;
            "") P_ROUTES=EVIDENCE_UNTRUSTED
                echo "::error title=Policy not resolved::the resolve-policy step emitted nothing; this run has no rung." ;;
            *)  echo "::error title=Policy ${P_RESOLUTION}::see the resolve-policy step. An unreadable or defective register is never the kit default." ;;
          esac
          if [ -n "${P_WEAKENINGS:-}" ] && [ "${P_WEAKENINGS}" != "[]" ]; then
            pw="${P_WEAKENINGS#[}"; wk="$wk,${pw%]}"
            inforce=$((inforce+1))
            if printf '%s' "$P_WEAKENINGS" | grep -Eq 'WEAKENING_UNATTRIBUTED|WEAKENING_EXCEPTION_EXPIRED'; then
              auth=WEAKENING_UNATTRIBUTED
            elif [ "$auth" = WEAKENING_AT_BASELINE ]; then
              auth=WEAKENING_ATTRIBUTED
            fi
          fi

          # KDEC-010: A VERSION GAP IS WARN-CLASS. scanner_state.PARTIAL "warns; does not block",
          # so an assurance PARTIAL whose EVERY unestablished entry is a (PARTIAL) -- a capability
          # no carried scanner could read, run and annotated -- is advisory, not missing evidence.
          # One UNAVAILABLE or COLLECTION_FAILED beside it and the evidence is missing again.
          # tests/prove_gate_routing.py version_gap_*.
          partial_only=0
          if [ -n "${G_UNESTABLISHED:-}" ]; then
            partial_only=1
            for u in ${G_UNESTABLISHED}; do
              case "$u" in *"(PARTIAL)") ;; *) partial_only=0 ;; esac
            done
          fi

          # ROUTING, by the registered precedence:
          #   BLOCKED > EVIDENCE_UNTRUSTED > DECISION_REQUIRED > PROCEED_WITH_ADVISORY > PROCEED
          # BLOCKED ONLY ON AN OBSERVED REFUSAL: a secret, or established findings the gate
          # enforced. A block because evidence is missing (toolchain, report, discovery) is
          # EVIDENCE_UNTRUSTED -- deploy refuses both, and the difference tells a person which
          # problem they have.
          route=PROCEED
          if [ "${G_SECRET_GATE:-}" = "FAIL" ] ||
             { [ "${G_ENFORCEMENT:-}" = "BLOCKED" ] && [ "${G_ASSURANCE:-}" = "FINDINGS" ]; }; then
            route=BLOCKED
          elif [ "$badclass" = "1" ] || [ -z "${G_ASSURANCE:-}" ] ||
               [ "${G_ASSURANCE:-}" = "UNDETERMINED" ] ||
               { [ "${G_ASSURANCE:-}" = "PARTIAL" ] && [ "$partial_only" != "1" ]; } ||
               [ "${G_ENFORCEMENT:-}" = "BLOCKED" ]; then
            route=EVIDENCE_UNTRUSTED
          elif [ "$auth" = "WEAKENING_UNATTRIBUTED" ] || [ "$auth" = "WEAKENING_EXCEPTION_EXPIRED" ]; then
            route=DECISION_REQUIRED
          elif [ "$inforce" -gt 0 ] || [ "${G_ENFORCEMENT:-}" = "ADVISORY" ] ||
               [ "${G_ASSURANCE:-}" = "FINDINGS" ] || [ "${G_ASSURANCE:-}" = "PARTIAL" ]; then
            route=PROCEED_WITH_ADVISORY
          fi
          # FOLD THE POLICY BY THE REGISTERED PRECEDENCE (patch section 4.3): the resolution's own
          # route (a refusal, an expired decision, an attributed softening) and the route the
          # registered minimums give the findings the gate did not block (DECISION_REQUIRED at
          # walk). A policy can only raise the route here, never lower it.
          rank() { case "$1" in BLOCKED) echo 5;; EVIDENCE_UNTRUSTED) echo 4;; DECISION_REQUIRED) echo 3;; PROCEED_WITH_ADVISORY) echo 2;; PROCEED) echo 1;; *) echo 0;; esac; }
          for pr_route in "${P_ROUTES:-}" "${G_POLICY_FINDINGS_ROUTE:-}"; do
            if [ "$(rank "$pr_route")" -gt "$(rank "$route")" ]; then route="$pr_route"; fi
          done
          # KNOWN EXPLOITED (KDEC-022 item 3). A catalogued CVE not excepted is already BLOCKED (the
          # gate's every-mode class). An excepted one, or a catalog nobody could read, is never a pass:
          # at least PROCEED_WITH_ADVISORY, with its own cause below.
          if [ "$route" = "PROCEED" ] &&
             { [ "${G_kev_state:-}" = "UNAVAILABLE" ] || [ "${G_KEV_VERDICT:-}" = "EXCEPTED" ]; }; then
            route=PROCEED_WITH_ADVISORY
          fi

          # WHY IT IS ADVISORY (KDEC-014; vocabulary :: advisory_cause). A deploy refuses a
          # VERSION_GAP (established by READ ranges) at uat/prod without an attributed exception,
          # records a VERSION_GAP_UNVERIFIED (resting on an UNVERIFIED range) prominently, and
          # must not mistake the other causes for either. A PARTIAL the gate did not cap for a
          # version gap is COVERAGE_PARTIAL. tests/prove_version_gap_production.py.
          causes=""
          inlist() { case " $1 " in *" $2 "*) return 0 ;; esac; return 1; }
          if [ "$route" = "PROCEED_WITH_ADVISORY" ]; then
            if [ "${G_ASSURANCE:-}" = "PARTIAL" ]; then
              for u in ${G_UNESTABLISHED:-}; do
                if inlist "${G_VERSION_GAPPED:-}" "${u%%(*}"; then
                  causes="$causes,VERSION_GAP"
                elif inlist "${G_VERSION_GAPPED_UNVERIFIED:-}" "${u%%(*}"; then
                  causes="$causes,VERSION_GAP_UNVERIFIED"
                else
                  causes="$causes,COVERAGE_PARTIAL"
                fi
              done
            fi
            [ "$inforce" -gt 0 ] && causes="$causes,WEAKENING_ATTRIBUTED"
            # A secret found and excepted -- by fingerprint, ticket, named approver, unexpired
            # (owner ruling 2026-10-22). Its own cause, so no reader takes it for a clean secret scan.
            [ "${G_SECRET_GATE:-}" = "EXCEPTED" ] && causes="$causes,SECRET_EXCEPTION_ATTRIBUTED"
            { [ "${G_ENFORCEMENT:-}" = "ADVISORY" ] || [ "${G_ASSURANCE:-}" = "FINDINGS" ]; } &&
              causes="$causes,FINDINGS_NOT_BLOCKED"
            # A job that scanned only part of its scope while its findings outranked the PARTIAL
            # (lane L-P85: PHP Semgrep could not fully parse) is still a coverage gap: both causes.
            [ -n "${G_COVERAGE_PARTIAL:-}" ] && causes="$causes,COVERAGE_PARTIAL"
            # KDEC-022 item 3: a KEV CVE excepted by the register; a KEV catalog nobody could read.
            [ "${G_KEV_VERDICT:-}" = "EXCEPTED" ] && causes="$causes,KNOWN_EXPLOITED_EXCEPTION_ATTRIBUTED"
            [ "${G_kev_state:-}" = "UNAVAILABLE" ] && causes="$causes,KEV_UNAVAILABLE"
          fi
          CAUSES="$(dedupe "$causes")"

          emit() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          emit routing_result "$route"
          emit advisory_causes "$CAUSES"
          emit controls_required "$REQ"
          emit controls_executed "$EXE"
          emit controls_unavailable "$UNAV"
          emit controls_reduced "$RED"
          emit controls_skipped "$SKP"
          emit weakenings "[${wk#,}]"
          emit weakening_attribution "$auth"
          emit weakening_record "{\"reason\":\"$W_WEAKENING_REASON\",\"authority\":\"$W_WEAKENING_AUTHORITY\",\"exception_ref\":\"$W_WEAKENING_EXCEPTION_REF\",\"expires\":\"$W_WEAKENING_EXPIRES\"}"
          # The policy the verdict was reached under (ETFB 2.2: a rung label with no emitted
          # effective set is soft_fail_sast again).
          emit policy_resolution "${P_RESOLUTION:-}"
          emit policy_source "${P_SOURCE:-}"
          emit policy_chain "${P_CHAIN:-}"
          emit rung_declared "${P_RUNG_DECLARED:-}"
          emit rung_effective "${P_RUNG_EFFECTIVE:-}"
          emit rung_divergence "${P_RUNG_DIVERGENCE:-}"
          emit policy_mode "${P_POLICY_MODE:-}"
          emit effective_minimum "${P_EFFECTIVE_MINIMUM:-}"
          emit policy_divergences "${P_DIVERGENCES:-[]}"
          emit environment_tier "${P_TIER:-}"
          emit team_pattern "${P_TEAM:-}"
          emit unvalidated_human_workflow_paths "${P_UNVALIDATED:-}"
          emit deploy_approval "${P_DEPLOY_APPROVAL:-}"

          {
            echo "### Control posture — security scan"
            echo ""
            echo "| Row | Value |"
            echo "|---|---|"
            echo "| controls required | \`${REQ:-none}\` |"
            echo "| controls executed | \`${EXE:-none}\` |"
            echo "| controls unavailable | \`${UNAV:-none}\` — NOT the same as clean |"
            echo "| controls reduced | \`${RED:-none}\` |"
            echo "| controls skipped | \`${SKP:-none}\` |"
            echo "| reason | ${W_WEAKENING_REASON:-_(none recorded)_} |"
            echo "| authority | ${W_WEAKENING_AUTHORITY:-_(none recorded)_} |"
            echo "| exception / deferral id | ${W_WEAKENING_EXCEPTION_REF:-_(none recorded)_} |"
            echo "| expiry | ${W_WEAKENING_EXPIRES:-_(no expiry set)_} |"
            echo "| attribution | \`$auth\` |"
            echo "| **routing result** | **\`$route\`** — what deployment reads |"
            echo "| advisory causes | \`${CAUSES:-none}\` — at uat/prod a VERSION_GAP is refused without an attributed exception; a VERSION_GAP_UNVERIFIED is recorded (KDEC-014) |"
            echo ""
            if [ -n "$dead" ]; then
              echo "> **Dead input(s) set:** \`${dead#,}\` — declared and read by nothing."
              echo ""
            fi
            if [ "$route" = "DECISION_REQUIRED" ]; then
              echo "> **A weakening is in force and nobody has said why.** Not a failure and not a"
              echo "> pass. Record \`weakening_reason\` and \`weakening_authority\` (and an expiry),"
              echo "> or restore the control to baseline."
              echo ""
            fi
            if [ "$route" = "EVIDENCE_UNTRUSTED" ]; then
              echo "> **This result cannot be relied on.** Evidence was missing for: \`${UNAV:-the run itself}\`."
              echo "> Do not read the absence of a block as the absence of risk."
              echo ""
            fi
            # PER CAUSE: a version gap and a scanner that read the version but not every file are
            # different gaps with different remedies (lane L-P85 follow-up).
            if inlist "$(printf '%s' "$CAUSES" | tr ',' ' ')" VERSION_GAP ||
               inlist "$(printf '%s' "$CAUSES" | tr ',' ' ')" VERSION_GAP_UNVERIFIED; then
              echo "> **PARTIAL, not clean:** no carried scanner can read the target version for"
              echo "> \`${G_VERSION_GAPPED:-}${G_VERSION_GAPPED_UNVERIFIED:+ $G_VERSION_GAPPED_UNVERIFIED}\` (KDEC-010). The scan ran where it could and the gap is"
              echo "> annotated; it warns and does not block. Closing it is a registry row or a repository"
              echo "> file, named in the gate and resolve summaries."
              echo ""
            fi
            if inlist "$(printf '%s' "$CAUSES" | tr ',' ' ')" COVERAGE_PARTIAL; then
              echo "> **COVERAGE_PARTIAL, not clean:** a scanner read the target version but not all of its"
              echo "> scope -- for example PHP files Semgrep could not fully parse (named in the gate summary,"
              echo "> \`${G_COVERAGE_PARTIAL:-${UNAV}}\`). Everything else was scanned and its findings stand;"
              echo "> the unparsed parts were not. Advisory, not untrusted evidence."
              echo ""
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # THE GOVERNANCE POSITION, NOT ONLY THE RESULT (ETFB section 10; patch section 4.5).
          {
            echo "### Enforcement policy (stage 1)"
            echo ""
            echo "| | |"; echo "|---|---|"
            echo "| resolution | \`${P_RESOLUTION:-none}\` ${P_REFUSALS:+(refusals: \`$P_REFUSALS\`)} |"
            echo "| source | \`${P_SOURCE:-none}\` -- KIT_DEFAULT is crawl: only secrets block |"
            echo "| entries applied | \`${P_CHAIN:-none}\` |"
            echo "| environment / tier / team | \`${P_ENVIRONMENT:-}\` / \`${P_TIER:-}\` / \`${P_TEAM:-unregistered}\` |"
            echo "| rung declared / effective | \`${P_RUNG_DECLARED:-}\` / \`${P_RUNG_EFFECTIVE:-}\` |"
            echo "| policy_mode (derived) | \`${P_POLICY_MODE:-}\` |"
            echo "| effective minimum per control | \`${P_EFFECTIVE_MINIMUM:-}\` |"
            echo "| findings route under the policy | \`${G_POLICY_FINDINGS_ROUTE:-no findings}\` |"
            # KDEC-018 item 4: every register exception in force shows that it was excepted before.
            if [ -n "${P_WEAKENINGS:-}" ] && [ "${P_WEAKENINGS}" != "[]" ]; then
              printf '%s' "$P_WEAKENINGS" | jq -r '.[] | "| exception: \(.input) (\(.control)) | by \(.authority), expires \(.expires); \(.history // "first exception") |"' 2>/dev/null
            fi
            [ -n "${P_UNVALIDATED:-}" ] && echo "| unvalidated human-workflow paths | \`${P_UNVALIDATED}\` -- reported, never passing |"
            # Notices are not refusals and never silent (policy_notice; KDEC-020).
            if [ -n "${P_NOTICES:-}" ] && [ "${P_NOTICES}" != "[]" ]; then
              printf '%s' "$P_NOTICES" | jq -r '.[] | "| notice: \(.code) | org \(.org) ran at enterprise \(.enterprise) (rung \(.rung), tier \(.tier)) -- add it to the orgs map |"' 2>/dev/null
            fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Emit the run record (schemas/assurance-result.schema.json)
        id: record
        # LEDGER L36. The machine contract for this run, built from the gate's own outputs and
        # validated against the schema before it is emitted; an invalid record is named and not
        # emitted. Recorded before the verdict, so a refused run still has its record.
        if: always()
        uses: $/.github/actions/run-record
        with:
          assurance-state: ${{ steps.gate.outputs.assurance_state }}
          enforcement-state: ${{ steps.gate.outputs.enforcement_state }}
          secret-gate: ${{ steps.gate.outputs.secret_gate }}
          discovery-state: ${{ needs.discover.outputs.state }}
          scanner-states: ${{ steps.gate.outputs.scanner_states }}
          report-result: ${{ needs.report.result }}
          blocking-findings: ${{ needs.report.outputs.blocking_findings }}
          evidence-artifact: ${{ steps.gate.outputs.evidence_artifact }}
          # Every applied secret exception: finding, ticket, approver, expiry, entry (lane L-S), and
          # its history (KDEC-018 item 4); and every register softening in force, with its history.
          secret-exceptions: ${{ steps.gate.outputs.secret_exceptions_applied }}
          policy-exceptions: ${{ steps.policy.outputs.policy_weakenings }}

      - name: Exit on the verdict
        id: verdict
        if: always()
        env:
          ROUTE: ${{ steps.posture.outputs.routing_result }}
          STOPS_ON_UNTRUSTED: ${{ steps.policy.outputs.policy_stops_on_evidence_untrusted }}
          RESOLUTION: ${{ steps.policy.outputs.policy_state }}
        run: |
          # THE GATE EXITS ON A VERDICT, NOT A JOB RESULT (SINGLE_PIPELINE_TARGET.md section 5.2;
          # patch section 5). BLOCKED stops at every tier. EVIDENCE_UNTRUSTED stops at EVERY tier
          # too -- OWNER RULING O-24 (2026-10-22): even at crawl, the kit being unable to run or
          # trust its own scan (a crash, COLLECTION_FAILED, a hollow or unreadable scan, a
          # bootstrap failure, an unresolved policy) blocks, because a pipeline that silently did
          # not scan cannot count as "scanned, advisory". This is stricter than the tier rule of
          # enforcement_axes.gate_stops (ETFB section 3), and the ruling supersedes it for the gate.
          # A coverage gap is not untrusted evidence: it routes PROCEED_WITH_ADVISORY. Neither
          # DECISION_REQUIRED nor the advisories stop the gate: the deploy refuses
          # DECISION_REQUIRED, and a decision owed is not a refusal observed.
          # An absent resolution is not a resolved one: it is named, and it stops on untrusted evidence.
          resolved=0
          if [ -z "${RESOLUTION:-}" ]; then
            echo "::warning title=No policy resolution::the policy step emitted nothing"
          elif [ "$RESOLUTION" = "POLICY_RESOLVED" ] || [ "$RESOLUTION" = "POLICY_DECISION_EXPIRED" ] ||
               [ "$RESOLUTION" = "EXCEPTION_RENEWAL_LIMIT" ] || [ "$RESOLUTION" = "EXCEPTION_HISTORY_UNVERIFIED" ]; then
            resolved=1
          fi
          case "${ROUTE:-}" in
            '') echo "::error title=No verdict::the posture step emitted no routing_result"; exit 1 ;;
            BLOCKED) echo "::error title=BLOCKED::a control refused this run (see the posture record)"; exit 1 ;;
            EVIDENCE_UNTRUSTED)
              why="the kit could not run or trust its own scan"
              [ "$resolved" = "1" ] || why="the enforcement policy did not resolve"
              [ "${STOPS_ON_UNTRUSTED:-true}" = "true" ] && why="${why}; this tier is a production tier"
              echo "::error title=EVIDENCE_UNTRUSTED::${why}. A run that did not scan is not a run that scanned clean, at any rung or tier (O-24)."
              exit 1 ;;
            PROCEED|PROCEED_WITH_ADVISORY|DECISION_REQUIRED) echo "verdict: ${ROUTE}" ;;
            *) echo "::error title=No verdict::the posture step emitted an unregistered routing_result"; exit 1 ;;
          esac
