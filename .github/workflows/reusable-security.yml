              3  NO readable SBOM, or one supplied SBOM unreadable -- licence state NOT ESTABLISHED, which
                 is not an empty licence set (ledger L16: this used to exit 0, so a syft failure read as
                 "nothing denied")

          THE VERDICT BELONGS TO THE GATE (ledger L16). `--out` writes it as JSON -- `state` (FINDINGS |
          PASS | NOT_APPLICABLE when no denylist was supplied), the deduplicated component count, the
          inventory, the undeclared and the denied -- and the sbom job publishes `state` and the denied
          count as job outputs the gate reads.
          """
          import argparse
          import io
          import json
          import os
          import re
          import sys


          def described_roots(doc):
              """SPDX ids the DOCUMENT describes -- the scan root (syft: a `.` package of purpose FILE),
              not a dependency. Measured on syft 1.52.0; counting it reported the directory itself as an
              unlicensed component."""
              roots = set(doc.get('documentDescribes') or [])
              for r in (doc.get('relationships') or []):
                  if (r.get('relationshipType') == 'DESCRIBES'
                          and r.get('spdxElementId') == 'SPDXRef-DOCUMENT'):
                      roots.add(r.get('relatedSpdxElement'))
              return roots


          def components(doc):
              """CycloneDX and SPDX carry the same facts under different names. Handle both rather than
              silently reading one and reporting a total that means 'the half I understood'."""
              out = []
              roots = described_roots(doc)
              for c in (doc.get('components') or []):                      # CycloneDX
                  if c.get('type') == 'file':
                      # A manifest syft read, not a dependency (see the self-test).
                      continue
                  lic = []
                  for entry in (c.get('licenses') or []):
                      node = entry.get('license') or {}
                      v = node.get('id') or node.get('name') or entry.get('expression')
                      if v:
                          lic.append(str(v))
                  out.append({'name': c.get('name') or '?', 'version': c.get('version') or '',
                              'licenses': sorted(set(lic)), 'purl': c.get('purl') or ''})
              for p in (doc.get('packages') or []):                        # SPDX
                  if p.get('SPDXID') in roots:
                      continue
                  lic = []
                  for k in ('licenseConcluded', 'licenseDeclared'):
                      v = p.get(k)
                      if v and v not in ('NOASSERTION', 'NONE'):
                          lic.append(str(v))
                  out.append({'name': p.get('name') or '?',
                              'version': p.get('versionInfo') or '',
                              'licenses': sorted(set(lic)),
                              'purl': ''})
              return out


          def dedupe(comps):
              """ONE COMPONENT, ONE ROW. The job reads CycloneDX AND SPDX, which describe the same packages;
              counting both counted every component twice. Merge on (name, version), uniting licences."""
              merged, order = {}, []
              for c in comps:
                  k = (c['name'], c['version'])
                  if k not in merged:
                      merged[k] = dict(c, licenses=list(c['licenses']))
                      order.append(k)
                  else:
                      merged[k]['licenses'] = sorted(set(merged[k]['licenses']) | set(c['licenses']))
                      merged[k]['purl'] = merged[k]['purl'] or c['purl']
              return [merged[k] for k in order]


          TOKEN = re.compile(r'[A-Za-z0-9.+\-:]+')
          OPERATORS = {'AND', 'OR', 'WITH'}


          def tokens(expr):
              """The licence identifiers in an SPDX expression: `(MIT OR GPL-3.0-only)` -> MIT, GPL-3.0-only."""
              return [t for t in TOKEN.findall(expr) if t.upper() not in OPERATORS]


          def denies(entry, token):
              """TOKEN-LEVEL, NOT SUBSTRING (ledger L16). `GPL-3.0` must catch `GPL-3.0-only`,
              `GPL-3.0-or-later` and `GPL-3.0+`, and must NOT catch `LGPL-3.0-only` -- which the substring
              match did, reporting an LGPL library as a GPL denial."""
              t, d = token.upper(), entry.upper()
              return t == d or t == d + '+' or t.startswith(d + '-')


          def assess(comps, deny):
              denied, undeclared, inventory = [], [], {}
              dl = [d.strip() for d in deny if d.strip()]
              for c in comps:
                  if not c['licenses']:
                      undeclared.append(c)
                      continue
                  hit = None
                  for lic in c['licenses']:
                      inventory[lic] = inventory.get(lic, 0) + 1
                      if hit is None and any(denies(d, t) for d in dl for t in tokens(lic)):
                          hit = lic
                  # One denial per component, whichever of its licences carried it.
                  if hit is not None:
                      denied.append((c, hit))
              return denied, undeclared, inventory


          def self_test():
              fails = []
              cdx = {'components': [
                  {'name': 'a', 'version': '1.0', 'licenses': [{'license': {'id': 'MIT'}}]},
                  {'name': 'b', 'version': '2.0', 'licenses': [{'license': {'name': 'GPL-3.0-only'}}]},
                  {'name': 'c', 'version': '3.0'},
              ]}
              spdx = {'packages': [
                  {'name': 'd', 'versionInfo': '1', 'licenseDeclared': 'Apache-2.0'},
                  {'name': 'e', 'versionInfo': '2', 'licenseDeclared': 'NOASSERTION'},
              ]}
              c1 = components(cdx)
              if len(c1) != 3:
                  fails.append('CycloneDX components lost (%d of 3)' % len(c1))
              c2 = components(spdx)
              if len(c2) != 2:
                  fails.append('SPDX packages lost (%d of 2)' % len(c2))
              # NOASSERTION is not a licence. Treating it as one would report a component as licensed.
              if [c for c in c2 if c['name'] == 'e'][0]['licenses']:
                  fails.append('NOASSERTION was read as a declared licence')

              denied, undeclared, inv = assess(c1, ['GPL-3.0'])
              if len(denied) != 1:
                  fails.append('denylist did not match GPL-3.0-only from a GPL-3.0 entry')
              if len(undeclared) != 1:
                  fails.append('a component with no licence was not reported separately')
              if inv.get('MIT') != 1:
                  fails.append('inventory count wrong')
              # An empty denylist must deny nothing -- and must NOT match everything via empty substring.
              d2, _u, _i = assess(c1, [''])
              if d2:
                  fails.append('an empty denylist denied something -- empty substring matches everything')
              # TOKEN-LEVEL: LGPL is not GPL; an expression is read per identifier; `+` is a GPL spelling.
              lg = [{'name': 'l', 'version': '1', 'licenses': ['LGPL-3.0-only'], 'purl': ''},
                    {'name': 'x', 'version': '1', 'licenses': ['MIT OR GPL-3.0-only'], 'purl': ''},
                    {'name': 'p', 'version': '1', 'licenses': ['GPL-3.0+'], 'purl': ''}]
              d3, _u, _i = assess(lg, ['GPL-3.0'])
              if sorted(c['name'] for c, _l in d3) != ['p', 'x']:
                  fails.append('token match wrong: denied %s, expected p and x (never the LGPL one)'
                               % sorted(c['name'] for c, _l in d3))
              # DEDUPE: the same package from CycloneDX and SPDX is one component.
              both = dedupe(components({'components': [{'name': 'd', 'version': '1',
                                                        'licenses': [{'license': {'id': 'Apache-2.0'}}]}]})
                            + components(spdx))
              if len([c for c in both if c['name'] == 'd']) != 1:
                  fails.append('a package present in CycloneDX and SPDX was counted twice')
              # THE DESCRIBED ROOT IS NOT A DEPENDENCY.
              rooted = {'packages': [{'SPDXID': 'SPDXRef-Root', 'name': '.'},
                                     {'SPDXID': 'SPDXRef-P', 'name': 'q', 'versionInfo': '1'}],
                        'relationships': [{'spdxElementId': 'SPDXRef-DOCUMENT', 'relationshipType':
                                           'DESCRIBES', 'relatedSpdxElement': 'SPDXRef-Root'}]}
              if [c['name'] for c in components(rooted)] != ['q']:
                  fails.append('the SPDX document root was counted as a component')
              # A FILE IS NOT A PACKAGE. syft on Linux lists every manifest it read as a CycloneDX
              # component of type `file`, named by absolute path (measured: syft 1.52.0 and 1.54.1 on a
              # hosted runner; Windows emitted none). Counting them reported each lockfile as an
              # unlicensed dependency, and the component count depended on the host.
              filed = {'components': [{'type': 'library', 'name': 'r', 'version': '1'},
                                      {'type': 'file', 'name': '/w/src/package-lock.json'}]}
              if [c['name'] for c in components(filed)] != ['r']:
                  fails.append('a CycloneDX `file` component was counted as a package')
              if fails:
                  print('SELF-TEST FAILED:')
                  for f in fails:
                      print('  - %s' % f)
                  return False
              print('self-test ok: reads CycloneDX and SPDX, NOASSERTION is not a licence, undeclared is '
                    'its own state, empty denylist denies nothing')
              return True


          def main():
              ap = argparse.ArgumentParser()
              ap.add_argument('sbom', nargs='*')
              ap.add_argument('--deny', default='')
              ap.add_argument('--out', default='')
              ap.add_argument('--self-test', action='store_true')
              a = ap.parse_args()
              if a.self_test:
                  return 0 if self_test() else 2
              if not self_test():
                  return 2

              comps = []
              read, unreadable = [], []
              for p in a.sbom:
                  if not os.path.exists(p) or os.path.getsize(p) == 0:
                      unreadable.append(p)
                      continue
                  try:
                      comps += components(json.load(io.open(p, encoding='utf-8', errors='replace')))
                      read.append(os.path.basename(p))
                  except (ValueError, IOError, AttributeError) as e:
                      unreadable.append(p)
                      print('::warning title=Unreadable SBOM::%s (%s) -- its components are NOT included '
                            'in the counts below.' % (p, type(e).__name__))
              if not read or unreadable:
                  # NOT ESTABLISHED IS NOT EMPTY. Exit 3, so the caller cannot read it as "nothing denied".
                  print('::error title=Licence state NOT ESTABLISHED::%s' % (
                      'no readable SBOM supplied' if not read else
                      'SBOM(s) absent or unreadable: %s' % ', '.join(unreadable)))
                  if a.out:
                      json.dump({'state': 'COLLECTION_FAILED', 'read': read, 'unreadable': unreadable},
                                io.open(a.out, 'w', encoding='utf-8'), indent=1)
                  return 3

              comps = dedupe(comps)
              denied, undeclared, inv = assess(comps, a.deny.split(','))
              out = os.environ.get('GITHUB_STEP_SUMMARY', '')
              L = ['### Dependency licences', '',
                   'Read from: %s' % ', '.join(read), '',
                   '| | |', '|---|---|',
                   '| Components | %d |' % len(comps),
                   '| Distinct licences | %d |' % len(inv),
                   '| No licence declared | %d |' % len(undeclared),
                   '| Denied by policy | %d |' % len(denied), '']
              if inv:
                  L += ['| Licence | Components |', '|---|---|']
                  for k in sorted(inv, key=lambda x: -inv[x])[:15]:
                      L.append('| %s | %d |' % (k, inv[k]))
                  L.append('')
              if denied:
                  L += ['**DENIED BY POLICY**', '']
                  for c, lic in denied[:20]:
                      L.append('- `%s@%s` — %s' % (c['name'], c['version'], lic))
                  L.append('')
              if undeclared:
                  L += ['**NO LICENCE DECLARED — %d component(s)**' % len(undeclared), '',
                        'Not "permissive by default". The licence is UNESTABLISHED, and an unlicensed',
                        'dependency is usually the more restrictive case rather than the less.', '']
                  for c in undeclared[:15]:
                      L.append('- `%s@%s`' % (c['name'], c['version']))
                  L.append('')
              L += ['This reports what the SBOM SAYS. It does not audit compliance and cannot tell you',
                    'whether a declared licence is correct.']
              text = '\n'.join(L)
              print(text)
              if out:
                  with io.open(out, 'a', encoding='utf-8') as fh:
                      fh.write(text + '\n\n')
              if a.out:
                  policy = any(d.strip() for d in a.deny.split(','))
                  json.dump({'state': 'FINDINGS' if denied else ('PASS' if policy else 'NOT_APPLICABLE'),
                             'components': len(comps), 'inventory': inv,
                             'undeclared': [c['name'] for c in undeclared],
                             'denied': [{'name': c['name'], 'version': c['version'], 'licence': l}
                                        for c, l in denied]},
                            io.open(a.out, 'w', encoding='utf-8'), indent=1)
              return 1 if denied else 0


          if __name__ == '__main__':
              sys.exit(main())

          SBOM_LICENSES_PY
          # END SBOM_LICENSES
          # BEGIN REDACT_ALL — generated from scripts/redact_all.sh. DO NOT EDIT HERE.
          cat > /tmp/redact_all.sh <<'REDACT_ALL_SH'
          #!/usr/bin/env bash
          # CANONICAL pre-upload redaction sweep. Scrub every SARIF in the workspace, then let the job
          # publish. Sourced by nothing; invoked as `bash /tmp/redact_all.sh` from the generated
          # "Redact credential material before upload" step in every job that uploads scanner output.
          #
          # WHY THIS IS A FILE AND NOT SHELL IN THE WORKFLOW
          #   It used to be shell in the workflow -- fourteen byte-identical copies of it, 47 KB of one
          #   wrapper repeated per job, sitting inside the file that had just been rescued from GitHub's
          #   500 KB limit for exactly that reason. Duplicated prose drifts the same way duplicated code
          #   does; the kit has already lost a flawfinder fix and 14 Azure gitleaks rules that way. One
          #   canonical copy, generated into the bootstrap job, fetched everywhere, checked by
          #   scripts/inline_normalizer.py --check.
          #
          # ORDER IS THE WHOLE CONTROL. This runs BEFORE the first upload step of its job. A redactor that
          # runs after the upload protects nothing while looking exactly like protection, and
          # tests/check_redaction_parity.py fails the build if any job publishes before it redacts.
          #
          # EXIT
          #   0  nothing to redact, or everything at risk was redacted or withheld
          #   1  a report could be neither redacted nor withheld -- credential material may reach an
          #      artifact, which is the only redaction outcome worth a red job

          set -uo pipefail

          if [ ! -s /tmp/redact_sarif.py ]; then
            echo "::error title=Redaction could not be guaranteed::/tmp/redact_sarif.py is absent, so the"
            echo "kit-scripts artifact did not reach this job and no SARIF can be scrubbed. A MISSING TOOL"
            echo "IS NOT A CLEAN RESULT -- publication must not proceed on the strength of a tool that was"
            echo "never acquired. That conflation is this kit's founding defect."
            exit 1
          fi

          shopt -s nullglob globstar

          # A PATH ENDING .sarif IS NOT ALWAYS A SARIF FILE.
          #
          # checkov-action treats `output_file_path` as a DIRECTORY and writes
          # checkov.sarif/results_sarif.sarif inside it. `*.sarif` therefore matched the DIRECTORY, the
          # redactor raised IsADirectoryError and exited 1, and a job whose scan had SUCCEEDED went red --
          # taking the second IaC scanner behind it with it, because that step had no if: always(). A
          # housekeeping step decided a security verdict. Keep regular files only; **/*.sarif still finds
          # the real report inside.
          files=()
          for _f in *.sarif **/*.sarif; do
            if [ -f "$_f" ]; then files+=( "$_f" ); fi
          done

          if [ ${#files[@]} -eq 0 ]; then
            echo "no SARIF produced by this job -- nothing to redact"
            exit 0
          fi

          # READABLE IS NOT WRITABLE.
          #
          # checkov-action is a CONTAINER action: it runs as root, so checkov.sarif/results_sarif.sarif
          # arrives owned by root at 0644. The redactor could read and scrub it and then died on the write
          # back with PermissionError -- a job whose scan had SUCCEEDED went red in its housekeeping for
          # the second time. Take ownership where the runner is allowed to. Never fatal: the redactor
          # defends itself if this cannot help.
          for _f in "${files[@]}"; do
            if [ ! -w "$_f" ]; then
              chmod u+w "$_f" 2>/dev/null \
                || sudo -n chown "$(id -u):$(id -g)" "$_f" 2>/dev/null \
                || true
            fi
          done

          _rc=0
          python3 /tmp/redact_sarif.py "${files[@]}" || _rc=$?

          # 4 alone means a report could be neither redacted nor moved off the upload path, so credential
          # material may reach an artifact. That is the only redaction outcome worth a red job. 1, 2 and 3
          # mean the reports at risk are already withheld, the scan's verdict stands, and nothing leaks.
          if [ "$_rc" -eq 4 ]; then
            echo "::error title=Redaction could not be guaranteed::A SARIF could not be redacted and could not be withheld. See above."
            exit 1
          fi
          exit 0

          REDACT_ALL_SH
          # END REDACT_ALL
          # BEGIN SARIF_VALIDITY — generated from scripts/sarif_validity.py. DO NOT EDIT HERE.
          cat > /tmp/sarif_validity.py <<'SARIF_VALIDITY_PY'
          #!/usr/bin/env python3
          """Validity rows 1-6 of PIPELINE_ORDERING_AND_SCAN_VALIDITY section 4.5, on the runner, on the
          local file, BEFORE any publication (ledger L02).

          WHY THIS EXISTS
              The count sites checked two of the six things a SARIF must show before its zero means
              anything: that the file exists and that it parses. Rows 3-6 lived only in the report job,
              AFTER upload-sarif -- and GitHub does not ingest `executionSuccessful` or the tool
              notifications at all (section 4.6), so a failed run uploads cleanly and presents as a
              successful scan with zero alerts. A validity check after publication validates nothing
              while looking exactly like validation; it belongs here, beside the redactor, for the same
              reason the redactor does.

          THE ROWS (any one => COLLECTION_FAILED; none => VALID, and the result count is printed)
              1  file absent or empty
              2  does not parse, or is not a SARIF object with `runs`
              3  `runs` null, not an array, or empty -- no run is recorded
              4  any run's `results` absent or null   -- SARIF 3.14.23: "did not attempt". The single
                                                         highest-value row: today it counts as zero.
              5  any `toolExecutionNotifications` or `toolConfigurationNotifications` entry at level
                 `error`                               -- SARIF 3.20.21: "SHALL mean that the run failed"
              6  any `invocations[].executionSuccessful` false -- SARIF 3.20.14

          PER-TOOL PROFILE, NOT A UNIVERSAL HOLLOW RULE (KDEC-008 OD-2)
              `rules: []` and `artifacts: []` are NOT witnesses of an empty scan: a clean bandit run emits
              exactly `results: [] rules: []` (measured, bandit 1.9.4), and no tool in the suite lists
              examined artifacts (PIPELINE_ORDERING 4.4.1). PROFILES records, per tool, what this file may
              rely on; `rules_witness` is False for every one, and rows 8-10 (the sidecar channels) are not
              built here -- the design forbids shipping them before a channel exists.

          USAGE
              python3 sarif_validity.py [--tool NAME] FILE...
              python3 sarif_validity.py --self-test

          EXIT
              0  every FILE is VALID            3  a FILE is COLLECTION_FAILED (row and reason printed)
              2  self-test failed / bad usage
          """
          import io
          import json
          import os
          import sys

          # What each producer's SARIF can be relied on for (measured where stated; PO 4.4 / 3.6).
          #   invocations     does it write runs[].invocations at all
          #   disclosure      where it reports a file it could not analyse ('' = it does not)
          #   rules_witness   may an empty rules[] be read as "examined nothing" -- never, per OD-2
          PROFILES = {
              'bandit':     dict(invocations=True, disclosure='toolConfigurationNotifications (error)',
                                 rules_witness=False),
              'semgrep':    dict(invocations=True, disclosure='', rules_witness=False),   # 1.178: silent
              'gitleaks':   dict(invocations=False, disclosure='', rules_witness=False),
              'gosec':      dict(invocations=False, disclosure='', rules_witness=False),
              'trivy':      dict(invocations=False, disclosure='', rules_witness=False),
              'checkov':    dict(invocations=False, disclosure='', rules_witness=False),
              'cppcheck':   dict(invocations=False, disclosure='', rules_witness=False),  # kit-converted
              'flawfinder': dict(invocations=False, disclosure='', rules_witness=False),
              # The two added with the last four count sites (flagship lane report row 10). UNMEASURED:
              # nothing here relies on a tool-specific channel for either; rows 1-6 apply and no more.
              'codeql':      dict(invocations=True, disclosure='', rules_witness=False),
              'osv-scanner': dict(invocations=False, disclosure='', rules_witness=False),
          }
          NOTIFICATIONS = ('toolExecutionNotifications', 'toolConfigurationNotifications')


          def verdict(path):
              """-> ('VALID', None, results) or ('COLLECTION_FAILED', 'row N: reason', None)."""
              if not os.path.isfile(path) or os.path.getsize(path) == 0:
                  return 'COLLECTION_FAILED', 'row 1: %s is absent or empty' % path, None
              try:
                  doc = json.load(io.open(path, encoding='utf-8-sig'))
              except (ValueError, OSError) as exc:
                  return 'COLLECTION_FAILED', 'row 2: %s does not parse (%s)' % (path, exc), None
              if not isinstance(doc, dict) or 'runs' not in doc:
                  return 'COLLECTION_FAILED', 'row 2: %s is not a SARIF object with runs' % path, None
              runs = doc.get('runs')
              if not isinstance(runs, list) or not runs:
                  return 'COLLECTION_FAILED', 'row 3: %s records no run (runs is %s)' % (
                      path, 'empty' if isinstance(runs, list) else 'null'), None
              n = 0
              for i, run in enumerate(runs):
                  if not isinstance(run, dict) or not isinstance(run.get('results'), list):
                      return 'COLLECTION_FAILED', ('row 4: %s run %d has no results array -- the tool did '
                                                   'not attempt (SARIF 3.14.23)' % (path, i)), None
                  n += len(run['results'])
