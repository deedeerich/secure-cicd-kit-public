                      # this kit gets from file+rule instead.
                      if res.pop('partialFingerprints', None) is not None:
                          snips += 1
                      for cf in (res.get('codeFlows') or []):
                          for tf in (cf.get('threadFlows') or []):
                              for lo in (tf.get('locations') or []):
                                  pl = ((lo.get('location') or {}).get('physicalLocation') or {})
                                  for key in ('region', 'contextRegion'):
                                      reg = pl.get(key) or {}
                                      if 'snippet' in reg:
                                          reg.pop('snippet', None)
                                          snips += 1
              return (snips, masked)


          def self_test():
              fails = []
              doc = {'version': '2.1.0', 'runs': [{'tool': {'driver': {'name': 'bandit'}}, 'results': [
                  {'ruleId': 'B105', 'level': 'error',
                   'message': {'text': 'Possible hardcoded password: AKIAIOSFODNN7EXAMPLE'},
                   'partialFingerprints': {'x': 'deadbeef'},
                   'locations': [{'physicalLocation': {
                       'artifactLocation': {'uri': 'app/config.py'},
                       'region': {'startLine': 12,
                                  'snippet': {'text': 'PASSWORD = "AKIAIOSFODNN7EXAMPLE"'}},
                       'contextRegion': {'snippet': {'text': 'ctx AKIAIOSFODNN7EXAMPLE'}}}}]}]}]}
              snips, masked = scrub(doc)
              blob = json.dumps(doc)
              if 'AKIAIOSFODNN7EXAMPLE' in blob:
                  fails.append('a credential survived scrub()')
              if 'app/config.py' not in blob or '12' not in blob:
                  fails.append('scrub() destroyed the file/line needed to fix it')
              if 'AKIA' not in blob:
                  fails.append('scrub() removed the prefix identifying WHICH credential')
              if snips < 3:
                  fails.append('snippet/contextRegion/partialFingerprints not all removed (%d)' % snips)
              if masked != 1:
                  fails.append('message was not masked')
              # Idempotent: running twice must not double-mask or crash.
              s2, m2 = scrub(doc)
              if (s2, m2) != (0, 0):
                  fails.append('scrub() is not idempotent (%d,%d on second pass)' % (s2, m2))
              # A clean report must come through untouched.
              clean = {'runs': [{'results': [{'ruleId': 'X', 'message': {'text': 'unused import os'},
                                              'locations': [{'physicalLocation': {
                                                  'artifactLocation': {'uri': 'a.py'},
                                                  'region': {'startLine': 1}}}]}]}]}
              before = json.dumps(clean)
              scrub(clean)
              if json.dumps(clean) != before:
                  fails.append('a clean finding was altered')
              if fails:
                  print('SELF-TEST FAILED:')
                  for f in fails:
                      print('  - %s' % f)
                  return False
              print('self-test ok: credential masked, snippet/contextRegion/partialFingerprints removed, '
                    'file and line preserved, idempotent, clean findings untouched')
              return True


          def main():
              argv = [a for a in sys.argv[1:] if not a.startswith('-')]
              if '--self-test' in sys.argv:
                  return 0 if self_test() else 2
              if not self_test():
                  print('ABORTING -- a redactor that cannot prove it redacts is worse than none.')
                  return 2
              rc = 0
              for p in argv:
                  if not os.path.exists(p) or os.path.getsize(p) == 0:
                      print('  %s: absent or empty, nothing to redact' % p)
                      continue
                  try:
                      doc = json.load(io.open(p, encoding='utf-8', errors='replace'))
                  except (ValueError, IOError) as e:
                      # A SARIF that cannot be parsed cannot be redacted, and must NOT be uploaded on the
                      # assumption that it is probably fine. Emptying it loses nothing a reader could
                      # have used -- an unparseable report establishes nothing either way -- and it
                      # cannot leak what it was carrying.
                      print('::warning title=Unredactable SARIF::%s could not be parsed (%s); it is '
                            'replaced with an empty report rather than uploaded unexamined.'
                            % (p, type(e).__name__))
                      io.open(p, 'w', encoding='utf-8').write(
                          json.dumps({'version': '2.1.0', 'runs': [],
                                      '_redaction': 'ORIGINAL UNPARSEABLE - WITHHELD'}))
                      rc = 1
                      continue
                  snips, masked = scrub(doc)
                  json.dump(doc, io.open(p, 'w', encoding='utf-8'))
                  print('  %s: %d snippet/fingerprint field(s) removed, %d message(s) masked'
                        % (os.path.basename(p), snips, masked))
              return rc


          if __name__ == '__main__':
              sys.exit(main())

          REDACT_SARIF_PY
          shopt -s nullglob globstar
          files=( *.sarif **/*.sarif )
          if [ ${#files[@]} -eq 0 ]; then
            echo "no SARIF produced by this job -- nothing to redact"
          else
            python3 /tmp/redact_sarif.py "${files[@]}"
          fi
      # END REDACT_SARIF
      - name: CodeQL — keep SARIF as an artifact
        if: always() && matrix.gate == 'true' && steps.cq_analyze.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: sarif-codeql-${{ matrix.lang }}-${{ github.run_attempt }}
          path: codeql-results
          retention-days: 30
          if-no-files-found: warn

      # The state this job reports is the whole point. A scanner that did not run must not be
      # indistinguishable from a scanner that ran and found nothing.
      - name: CodeQL — declare state
        id: cq_state
        if: always() && matrix.gate == 'true'
        run: |
          if [ "${{ steps.cq_init.outcome }}" != "success" ]; then
            # Almost always: GHAS is not enabled on this private repository.
            echo "state=UNAVAILABLE" >> "$GITHUB_OUTPUT"
            echo "reason=CodeQL could not initialise. On a private repository this means GitHub" >> "$GITHUB_OUTPUT"
            echo "::warning title=CodeQL: UNAVAILABLE::CodeQL did NOT run for ${{ matrix.lang }}."
            echo "On a private repository this normally means GitHub Advanced Security is not"
            echo "enabled. The build is NOT failed for that -- but this is unestablished scope,"
            echo "not a clean result. Nothing here proves the absence of what CodeQL would find."
          elif [ "${{ steps.cq_analyze.outcome }}" != "success" ]; then
            echo "state=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
            echo "::warning title=CodeQL: COLLECTION_FAILED::CodeQL initialised for ${{ matrix.lang }}"
            echo "but analysis did not complete. Treat as unestablished, not as zero findings."
          else
            echo "state=COMPLETE" >> "$GITHUB_OUTPUT"
            echo "::notice title=CodeQL: analysed ${{ matrix.lang }}::Results are in the Security tab"
            echo "and in the sarif-codeql-${{ matrix.lang }} artifact."
          fi
          # WHICH QUERIES RAN IS PART OF THE RESULT. "CodeQL: 0 findings" means something
          # different under the precision-tuned default suite than under security-extended,
          # and a reader who cannot see which one ran cannot tell those apart.
          {
            echo ""
            echo "### CodeQL — ${{ matrix.lang }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Query suite | \`${{ inputs.codeql_queries }}\` |"
            echo "| Taint tracking | included in security-extended and security-and-quality |"
            echo "| State | ${state:-see above} |"
            echo ""
            echo "A finding count is only meaningful alongside the suite that produced it."
          } >> "$GITHUB_STEP_SUMMARY"

  deps-scan:
    needs: [discover]
    # Ecosystem-agnostic: every repository can leak a secret and resolve a dependency.
    # Gated only by discovery being able to run at all.
    if: always()
    name: Dependency scan (Trivy fs)
    runs-on: ubuntu-latest
    # Bounded so a stalled dependency cannot bill six hours (LM-001: unbounded execution
    # converts a dependency failure into uncontrolled cost).
    # NOT YET: a timeout still surfaces as a plain job failure. It SHOULD classify as
    # UNAVAILABLE / EXECUTION_TIMEOUT — cost is bounded here, semantics are not. See
    # docs/roadmap/FUTURE_WORK.md. Do not let this comment imply the mapping exists.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Trivy filesystem (vuln + secret)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.paths }}
          # ALL OF TRIVY, not a third of it. `license` was available the whole time and simply
          # never requested -- the same shape as CodeQL's twelve upload-sarif calls: the tool
          # was present, one capability of it was wired, and "we run Trivy" read as all of them.
          scanners: vuln,secret,license
          severity: ${{ inputs.fail_on_severity }}
          # 0 in advisory mode: findings are still produced, published and persisted — only
          # the block is withheld. Detection is never what gets turned off.
          exit-code: ${{ inputs.advisory_mode && '0' || '1' }}
          format: sarif
          output: trivy-deps.sarif
      # Findings must survive whether or not this repo has code scanning. Uploading to the
      # Security tab is a PUBLICATION channel, not the finding itself — free on public repos,
      # otherwise Advanced Security. Treating it as mandatory turned successful scans into
      # failed jobs on every private repo without GHAS.
      # SECOND IMPLEMENTATION OF THE CAPTURE CONTRACT. Trivy roots its URIs at the SCAN SCOPE it
      # was handed, while Checkov and Semgrep report repo-relative -- so the same file arrived with
      # two identities inside one repository. The expected-signal contract missed it because the IaC
      # signals are not tool-pinned, which is the same blind spot the Go pin exposed one layer over.
      #
      # gosec exposed the abstraction; this proves it generalizes. Verified against the real Trivy
      # SARIF from run 32151293153: `infra/main.tf` -> `tests/consumer-fixture/full/infra/main.tf`,
      # identical in form to what Checkov and Semgrep already produced.
      - name: Normalize Trivy dependency paths onto the repository
        if: always()
        run: |
          set -uo pipefail
          if [ ! -s trivy-deps.sarif ]; then
            echo "::notice title=Nothing to normalize::no trivy-deps.sarif; scanner produced no report."
            exit 0
          fi
          # BEGIN NORMALIZE_SARIF — generated from scripts/normalize_sarif.py. DO NOT EDIT HERE.
          cat > /tmp/normalize_sarif.py <<'NORMALIZE_PY'
          #!/usr/bin/env python3
          """CANONICAL SARIF path normalizer. Re-root scanner paths onto the repository.

          THIS FILE IS THE SINGLE SOURCE OF TRUTH.

          It is INLINED into the reusable workflows rather than called as `uses: ./...`, because a reusable
          workflow resolves local paths against the CALLER's checkout — so anything under `scripts/` simply
          does not exist at consumer runtime. That is the same failure that left 14 Azure gitleaks rules
          silently unloaded for every consumer while the kit's own CI stayed green.

          Inlining three copies would reintroduce drift, which is the defect family this kit exists to catch
          (a fix applied to the probe and not the workflow; a tag bumped in one place and not another). So the
          copies are CHECKED: `self-test` asserts every inlined block is byte-identical to this file. Drift
          becomes a build failure instead of a silent divergence.

          WHY NORMALIZATION IS NEEDED AT ALL
          ----------------------------------
          A scanner invoked with a subdirectory as its working directory reports URIs relative to THAT
          directory, not the repository:

            gosec  runs per Go module   -> `go/vuln.go` and `services/worker/vuln.go` BOTH arrive as `vuln.go`
            Trivy  roots at the scan scope -> `infra/main.tf` where Checkov reports the full repo-relative path

          Two files acquire one identity, or one file acquires two. Everything downstream inherits it:
          annotations point at paths that do not exist, finding history cannot separate components across
          runs, one scanner silently "covers for" another in a tool-pinned assertion, and correlation later
          merges findings from different components as though they were the same finding.

          The component root CANNOT be recovered afterwards — merged filenames use `tr '/' '_'`, which is
          lossy. So normalization happens at the POINT OF CAPTURE, while the root is still known.

          INVARIANT: normalize only after source identity is bound. Never merge first and reconstruct
          provenance later.

          USAGE
              python3 normalize_sarif.py <src.sarif> <dst.sarif> <prefix>

          `<prefix>` is the component root relative to the repository. `.` or empty is a no-op, so callers
          need no special case for a root-level project. Idempotent: a URI already carrying the prefix is left
          alone, so re-running cannot double-root.

          Reads SRC and writes DST — never rewrites in place. Containerized scanners produce ROOT-OWNED files;
          opening one for writing fails with EACCES, which turned a misreported finding into an absent one.
          """

          import io
          import json
          import sys


          def reroot(uri, prefix):
              if not uri or not isinstance(uri, str):
                  return uri
              u = uri.replace("\\", "/")
              if u.startswith("file://"):
                  u = u[7:]
              while u.startswith("./"):
                  u = u[2:]
              # An absolute path inside a CONTAINER says nothing about the repository.
              if u.startswith("/src/"):
                  u = u[5:]
              u = u.lstrip("/")
              if prefix in ("", "."):
                  return u
              if u == prefix or u.startswith(prefix + "/"):
                  return u          # idempotent: never double-root
              return prefix + "/" + u


          def fix_locs(locs, prefix):
              for loc in locs or []:
                  if not isinstance(loc, dict):
                      continue
                  phys = loc.get("physicalLocation")
                  if isinstance(phys, dict):
                      art = phys.get("artifactLocation")
                      if isinstance(art, dict) and "uri" in art:
                          art["uri"] = reroot(art["uri"], prefix)


          def normalize(doc, prefix):
              for run in doc.get("runs", []) or []:
                  for art in run.get("artifacts", []) or []:      # what viewers resolve against
                      al = (art or {}).get("location")
                      if isinstance(al, dict) and "uri" in al:
                          al["uri"] = reroot(al["uri"], prefix)
                  for res in run.get("results", []) or []:
                      fix_locs(res.get("locations"), prefix)
                      fix_locs(res.get("relatedLocations"), prefix)
                      at = res.get("analysisTarget")
                      if isinstance(at, dict) and "uri" in at:
                          at["uri"] = reroot(at["uri"], prefix)
                      # A partially re-rooted code flow is worse than none — it still looks authoritative.
                      for flow in res.get("codeFlows", []) or []:
                          for tf in (flow or {}).get("threadFlows", []) or []:
                              for step in (tf or {}).get("locations", []) or []:
                                  if isinstance(step, dict):
                                      fix_locs([step.get("location")], prefix)
              return doc


          def main(argv):
              if len(argv) != 4:
                  print("usage: normalize_sarif.py <src> <dst> <prefix>", file=sys.stderr)
                  return 2
              src, dst = argv[1], argv[2]
              prefix = argv[3].replace("\\", "/").strip("/")
              doc = json.load(io.open(src, encoding="utf-8"))
              json.dump(normalize(doc, prefix), io.open(dst, "w", encoding="utf-8"))
              n = sum(len(r.get("results", []) or []) for r in doc.get("runs", []) or [])
              print("normalize_sarif: %s -> %s rooted at '%s' (%d result(s))" % (src, dst, prefix or ".", n))
              return 0


          if __name__ == "__main__":
              sys.exit(main(sys.argv))

          NORMALIZE_PY
          # END NORMALIZE_SARIF
          # Read source, write destination -- never rewrite in place. Containerized scanners emit
          # root-owned files, and opening one for writing turned a misreported finding into an
          # absent one once already.
          python3 /tmp/normalize_sarif.py trivy-deps.sarif trivy-deps.sarif.norm "${{ inputs.paths }}"
          mv trivy-deps.sarif.norm trivy-deps.sarif

      - name: Trivy (deps) — is there anything to publish?
        if: always()
        id: sarif_trivy_deps
        run: |
          # No SARIF usually means no applicable source (gosec on a repo with no Go). That is
          # a legitimate outcome, not a failure, and previously crashed the upload step.
          if [ -s "trivy-deps.sarif" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Trivy (deps): nothing to publish::No SARIF at 'trivy-deps.sarif' — no applicable source files. Not a failure."
          fi
      # BEGIN REDACT_SARIF — generated from scripts/redact_sarif.py. DO NOT EDIT HERE.
      - name: Redact credential material before upload
        if: always()
        shell: bash
        run: |
          cat > /tmp/redact_sarif.py <<'REDACT_SARIF_PY'
          #!/usr/bin/env python3
          """Strip credential material from a SARIF file IN PLACE, before it becomes an artifact.

          WHY THIS EXISTS
              The kit redacted exactly one scanner. gitleaks ran with --redact and had `snippet` and
              `partialFingerprints` stripped before upload. Thirteen other jobs uploaded raw SARIF, and
              several of those scanners embed matched source by design:

                  bandit    B105 hardcoded_password_string -- the snippet IS the password
                  semgrep   snippet carries the matched source line
                  trivy     secret mode reports the match
                  checkov   includes the offending code block
                  gosec     includes the offending line

              An artifact is downloadable by anyone with repository read access and is retained for
              weeks. Redacting the rendered summary while shipping the raw value in a downloadable file
              is theatre -- it moves the credential from a page someone reads to a file someone opens.

              The consolidated report job made it worse by copying every SARIF into one artifact.

          WHAT SURVIVES, WHICH IS EVERYTHING NEEDED TO FIX THE FINDING
              rule id, severity, FILE, LINE, message with credential-shaped substrings masked to a short
              prefix. What is removed: `snippet`, `contextRegion.snippet`, and `partialFingerprints`
              (which for a secret scanner can be a hash of the secret itself).

          IT IS NOT A SUBSTITUTE FOR --redact AT THE SCANNER
              Defence in depth. A scanner that can be told not to emit the value should be told. This
              catches the ones that cannot, and the ones a consumer adds later.

          USAGE
              python3 redact_sarif.py <file.sarif> [more.sarif ...]
              python3 redact_sarif.py --self-test

          EXIT
              0 rewritten (or nothing to do)      1 a file was unreadable      2 self-test failed
          """
          import io
          import json
          import os
          import re
          import sys

          # BEGIN SECRET_PATTERNS -- must stay identical to scripts/scan_report.py.
          # Two copies exist because each file is inlined into the workflow separately and neither can
          # import the other at consumer runtime. tests/check_redaction_parity.py fails the build if they
          # diverge, so the duplication is an enforced invariant rather than a hope -- the same treatment
          # the SARIF normalizer gets for the same reason.
          SECRET_PATTERNS = [
              (re.compile(r'-----BEGIN[A-Z ]*PRIVATE KEY-----'), 'private-key'),
              (re.compile(r'\bAKIA[0-9A-Z]{16}\b'), 'aws-access-key-id'),
              (re.compile(r'\bgh[pousr]_[A-Za-z0-9]{16,}'), 'github-token'),
              (re.compile(r'\bxox[baprs]-[A-Za-z0-9-]{10,}'), 'slack-token'),
              (re.compile(r'\beyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}'), 'jwt'),
              (re.compile(r'\b[A-Za-z0-9~._-]{3}8Q~[A-Za-z0-9~._-]{31,34}\b'), 'entra-client-secret'),
              (re.compile(r'(?i)\b(?:AccountKey|SharedAccessKey|password|pwd|secret|token|api[_-]?key)'
                          r'\s*[:=]\s*["\']?([^\s;,"\'&]{8,})'), 'keyed-value'),
              (re.compile(r'\b[A-Za-z0-9+/]{32,}={0,2}(?![A-Za-z0-9+/=])'), 'high-entropy'),
              (re.compile(r'\b[0-9a-fA-F]{32,}\b'), 'hex-or-digest'),
          ]


          def _mask(value, label):
              keep = value[:4]
              return '%s%s [redacted: %s, %d chars]' % (keep, '*' * min(len(value) - len(keep), 18),
                                                        label, len(value))


          REDACTED_MARK = '[redacted: '


          def redact(text):
              """Mask anything that looks like credential material. Returns the safe string.

              IDEMPOTENT, which is not free. Masking `password: AKIAIOSFODNN7EXAMPLE` produces
              `password: AKIA**************** [redacted: ...]`, and that output STILL matches the
              keyed-value pattern -- so a second pass masked the mask, and a third masked that. It
              matters because a SARIF can legitimately be redacted twice: once in the scanner job before
              upload, once in the consolidated report after download. Non-idempotent redaction would
              corrupt the text on the second pass and make the finding unreadable.
              """
              if not text:
                  return text
              out = text
              for pat, label in SECRET_PATTERNS:
                  def _sub(m, _l=label):
                      whole = m.group(0)
                      v = m.group(1) if m.groups() and m.group(1) else whole
                      if len(v) < 8 or REDACTED_MARK in whole or '****' in v:
                          return whole
                      return whole.replace(v, _mask(v, _l))
                  out = pat.sub(_sub, out)
              return out
          # END SECRET_PATTERNS


          def scrub(doc):
              """-> (snippets_removed, messages_masked). Mutates doc."""
              snips = masked = 0
              for run in (doc.get('runs') or []):
                  for res in (run.get('results') or []):
                      msg = ((res.get('message') or {}).get('text'))
                      if msg:
                          r = redact(msg)
                          if r != msg:
                              res['message']['text'] = r
                              masked += 1
                      for loc in (res.get('locations') or []) + (res.get('relatedLocations') or []):
                          pl = (loc.get('physicalLocation') or {})
                          for key in ('region', 'contextRegion'):
                              reg = pl.get(key) or {}
                              if 'snippet' in reg:
                                  reg.pop('snippet', None)
                                  snips += 1
                      # A partial fingerprint from a secret scanner can be a hash OF THE SECRET, which is
                      # an offline-guessable artifact for anything low-entropy. It buys correlation that
                      # this kit gets from file+rule instead.
                      if res.pop('partialFingerprints', None) is not None:
                          snips += 1
                      for cf in (res.get('codeFlows') or []):
                          for tf in (cf.get('threadFlows') or []):
                              for lo in (tf.get('locations') or []):
                                  pl = ((lo.get('location') or {}).get('physicalLocation') or {})
                                  for key in ('region', 'contextRegion'):
                                      reg = pl.get(key) or {}
                                      if 'snippet' in reg:
                                          reg.pop('snippet', None)
                                          snips += 1
              return (snips, masked)


          def self_test():
              fails = []
              doc = {'version': '2.1.0', 'runs': [{'tool': {'driver': {'name': 'bandit'}}, 'results': [
                  {'ruleId': 'B105', 'level': 'error',
                   'message': {'text': 'Possible hardcoded password: AKIAIOSFODNN7EXAMPLE'},
                   'partialFingerprints': {'x': 'deadbeef'},
                   'locations': [{'physicalLocation': {
                       'artifactLocation': {'uri': 'app/config.py'},
                       'region': {'startLine': 12,
                                  'snippet': {'text': 'PASSWORD = "AKIAIOSFODNN7EXAMPLE"'}},
                       'contextRegion': {'snippet': {'text': 'ctx AKIAIOSFODNN7EXAMPLE'}}}}]}]}]}
              snips, masked = scrub(doc)
              blob = json.dumps(doc)
              if 'AKIAIOSFODNN7EXAMPLE' in blob:
                  fails.append('a credential survived scrub()')
              if 'app/config.py' not in blob or '12' not in blob:
                  fails.append('scrub() destroyed the file/line needed to fix it')
              if 'AKIA' not in blob:
                  fails.append('scrub() removed the prefix identifying WHICH credential')
              if snips < 3:
                  fails.append('snippet/contextRegion/partialFingerprints not all removed (%d)' % snips)
              if masked != 1:
                  fails.append('message was not masked')
              # Idempotent: running twice must not double-mask or crash.
              s2, m2 = scrub(doc)
              if (s2, m2) != (0, 0):
                  fails.append('scrub() is not idempotent (%d,%d on second pass)' % (s2, m2))
              # A clean report must come through untouched.
              clean = {'runs': [{'results': [{'ruleId': 'X', 'message': {'text': 'unused import os'},
                                              'locations': [{'physicalLocation': {
                                                  'artifactLocation': {'uri': 'a.py'},
                                                  'region': {'startLine': 1}}}]}]}]}
              before = json.dumps(clean)
              scrub(clean)
              if json.dumps(clean) != before:
                  fails.append('a clean finding was altered')
              if fails:
                  print('SELF-TEST FAILED:')
                  for f in fails:
                      print('  - %s' % f)
                  return False
              print('self-test ok: credential masked, snippet/contextRegion/partialFingerprints removed, '
                    'file and line preserved, idempotent, clean findings untouched')
              return True


          def main():
              argv = [a for a in sys.argv[1:] if not a.startswith('-')]
              if '--self-test' in sys.argv:
                  return 0 if self_test() else 2
              if not self_test():
                  print('ABORTING -- a redactor that cannot prove it redacts is worse than none.')
                  return 2
              rc = 0
              for p in argv:
                  if not os.path.exists(p) or os.path.getsize(p) == 0:
                      print('  %s: absent or empty, nothing to redact' % p)
                      continue
                  try:
                      doc = json.load(io.open(p, encoding='utf-8', errors='replace'))
                  except (ValueError, IOError) as e:
                      # A SARIF that cannot be parsed cannot be redacted, and must NOT be uploaded on the
                      # assumption that it is probably fine. Emptying it loses nothing a reader could
                      # have used -- an unparseable report establishes nothing either way -- and it
                      # cannot leak what it was carrying.
                      print('::warning title=Unredactable SARIF::%s could not be parsed (%s); it is '
                            'replaced with an empty report rather than uploaded unexamined.'
                            % (p, type(e).__name__))
                      io.open(p, 'w', encoding='utf-8').write(
                          json.dumps({'version': '2.1.0', 'runs': [],
                                      '_redaction': 'ORIGINAL UNPARSEABLE - WITHHELD'}))
                      rc = 1
                      continue
                  snips, masked = scrub(doc)
                  json.dump(doc, io.open(p, 'w', encoding='utf-8'))
                  print('  %s: %d snippet/fingerprint field(s) removed, %d message(s) masked'
                        % (os.path.basename(p), snips, masked))
              return rc


          if __name__ == '__main__':
              sys.exit(main())

          REDACT_SARIF_PY
          shopt -s nullglob globstar
          files=( *.sarif **/*.sarif )
          if [ ${#files[@]} -eq 0 ]; then
            echo "no SARIF produced by this job -- nothing to redact"
          else
            python3 /tmp/redact_sarif.py "${files[@]}"
          fi
      # END REDACT_SARIF
      - name: Trivy (deps) — keep SARIF as an artifact
        if: always() && steps.sarif_trivy_deps.outputs.exists == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: sarif-trivy-deps-${{ github.run_attempt }}
          path: trivy-deps.sarif
          retention-days: 30
          if-no-files-found: warn
      - name: Trivy (deps) — publish to the Security tab where available
        id: cs_trivy_deps
        if: always() && steps.sarif_trivy_deps.outputs.exists == 'true'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-deps.sarif
          category: trivy-deps
      - name: Trivy (deps) — state plainly if publication degraded
        if: always() && steps.sarif_trivy_deps.outputs.exists == 'true' && steps.cs_trivy_deps.outcome != 'success'
        run: |
          # Loud, never silent. An empty Security tab is indistinguishable from a clean
          # codebase, and that ambiguity is how a control becomes false assurance.
          echo "::warning title=Trivy (deps): NOT published to the Security tab::Code scanning is"
          echo "unavailable here (free on public repos, otherwise GitHub Advanced Security)."
          echo "The scan SUCCEEDED and the gate still enforces on these findings."
          echo "Retrieve them from the 'sarif-trivy-deps' artifact."

  # ─── IaC ────────────────────────────────────────────────────

      # BEGIN SCAN_STATUS — generated from scripts/scan_status.sh. DO NOT EDIT HERE.
      - name: Result summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          cat > /tmp/scan_status.sh <<'SCAN_STATUS_SH'
          #!/usr/bin/env bash
          # Short per-job result block. Runs at the end of every scanner job.
          #
          # WHY THIS EXISTS ALONGSIDE THE CONSOLIDATED REPORT
          #     The consolidated `report` job owns normalisation, cross-scanner dedupe, correlation,
          #     remediation detail and disposition, because those are only possible where every finding is
          #     visible at once. That is not a reason for a scanner job to stay silent.
          #
          #     Someone debugging Semgrep is IN the Semgrep job. Making them leave it to discover whether it
          #     found anything is how "the pipeline is noise" becomes true. So the scanner prints what it
          #     alone knows -- did it run, how many findings, was SARIF produced -- and points at the
          #     consolidated job for what it cannot know.
          #
          # DELIBERATELY NOT A SECOND COPY OF THE CONTRACT
          #     No severity interpretation, no remediation, no gate verdict, no disposition. Those live in
          #     exactly one place. A contract implemented twice drifts twice, and this kit has the scars:
          #     fourteen Azure gitleaks rules and a flawfinder fix both lost to a second copy.
          #
          # THE ZERO RULE APPLIES HERE TOO
          #     A job that did not run, or produced no parseable SARIF, prints NOT ESTABLISHED. It never
          #     prints 0. Zero says someone looked.
          #
          # USAGE   scan_status <name> <execution> <sarif-or-empty> [scope]
          scan_status() {
            _name="$1"; _exec="$2"; _sarif="${3:-}"; _scope="${4:-}"
            _out="${GITHUB_STEP_SUMMARY:-/dev/stdout}"

            _n="NOT ESTABLISHED"; _sar="NOT GENERATED"
            if [ -n "$_sarif" ] && [ -s "$_sarif" ]; then
              # suppression: FAILURE_ISOLATION_WITH_STATE_CAPTURE -- jq's failure IS the signal here, and
              # it is captured rather than swallowed: a non-zero exit takes the else branch and reports
              # INVALID plus "count unavailable from current parser". stderr is silenced because the parse
              # error text is not useful in a summary block; the STATE survives and is published. If this
              # fails in a way other than "not valid SARIF" -- jq missing, file unreadable -- the result is
              # the same and is still not a clean zero, which is the outcome that matters.
              if _c=$(jq '[.runs[].results[]] | length' "$_sarif" 2>/dev/null); then
                _sar="GENERATED"
                # Only a scanner that actually completed may report a count. A crashed run that happens to
                # have left a partial report behind must not publish a number from it.
                case "$_exec" in
                  COMPLETE) _n="$_c" ;;
                  *)        _n="NOT ESTABLISHED" ;;
                esac
              else
                # A file that is not valid SARIF is a collection failure wearing a report's clothes.
                _sar="INVALID"
                _n="PRESENT -- count unavailable from current parser"
              fi
            fi

            {
              printf '### %s\n\n' "$_name"
              printf '| | |\n|---|---|\n'
              printf '| Execution | %s |\n' "$_exec"
              [ -n "$_scope" ] && printf '| Scope | %s |\n' "$_scope"
              printf '| Findings | %s |\n' "$_n"
              printf '| SARIF | %s |\n' "$_sar"
              printf '\n'
              if [ "$_n" = "NOT ESTABLISHED" ]; then
                printf 'This is not zero. Nothing usable was collected for this scope in this run.\n\n'
              fi
              printf 'Severity breakdown, remediation, gate impact and disposition are in the\n'
              printf '**Security scan report** job, which sees every scanner at once and can tell\n'
              printf 'when two tools are describing the same condition.\n\n'
            } >> "$_out"

            printf '%s: execution=%s findings=%s sarif=%s\n' "$_name" "$_exec" "$_n" "$_sar"
          }

          SCAN_STATUS_SH
          . /tmp/scan_status.sh
          if [ "$JOB_STATUS" = "success" ]; then _e=COMPLETE; else _e=FAILED; fi
          scan_status "Dependencies" "$_e" "trivy-deps.sarif" "dependencies + CVE feeds"
      # END SCAN_STATUS

  iac-scan:
    needs: [discover]
    # DISCOVERED, NOT DECLARED. Runs because roots for this ecosystem were actually
    # found in the caller's scope -- not because a selector named it. On failure
    # discovery turns everything on rather than producing a tidy row of NOT_APPLICABLE.
    if: needs.discover.outputs.iac == 'true'
    name: IaC scan (Checkov + Trivy config)
    runs-on: ubuntu-latest
    # Bounded so a stalled dependency cannot bill six hours (LM-001: unbounded execution
    # converts a dependency failure into uncontrolled cost).
    # NOT YET: a timeout still surfaces as a plain job failure. It SHOULD classify as
    # UNAVAILABLE / EXECUTION_TIMEOUT — cost is bounded here, semantics are not. See
    # docs/roadmap/FUTURE_WORK.md. Do not let this comment imply the mapping exists.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ inputs.paths }}
          output_format: sarif
          output_file_path: checkov.sarif
          soft_fail: true
      # Findings must survive whether or not this repo has code scanning. Uploading to the
      # Security tab is a PUBLICATION channel, not the finding itself — free on public repos,
      # otherwise Advanced Security. Treating it as mandatory turned successful scans into
      # failed jobs on every private repo without GHAS.
      - name: Checkov — is there anything to publish?
        if: always()
        id: sarif_checkov
        run: |
          # No SARIF usually means no applicable source (gosec on a repo with no Go). That is
          # a legitimate outcome, not a failure, and previously crashed the upload step.
          if [ -s "checkov.sarif/results_sarif.sarif" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Checkov: nothing to publish::No SARIF at 'checkov.sarif/results_sarif.sarif' — no applicable source files. Not a failure."
          fi
      # BEGIN REDACT_SARIF — generated from scripts/redact_sarif.py. DO NOT EDIT HERE.
      - name: Redact credential material before upload
        if: always()
        shell: bash
        run: |
          cat > /tmp/redact_sarif.py <<'REDACT_SARIF_PY'
          #!/usr/bin/env python3
          """Strip credential material from a SARIF file IN PLACE, before it becomes an artifact.

          WHY THIS EXISTS
              The kit redacted exactly one scanner. gitleaks ran with --redact and had `snippet` and
              `partialFingerprints` stripped before upload. Thirteen other jobs uploaded raw SARIF, and
              several of those scanners embed matched source by design:

                  bandit    B105 hardcoded_password_string -- the snippet IS the password
                  semgrep   snippet carries the matched source line
                  trivy     secret mode reports the match
                  checkov   includes the offending code block
                  gosec     includes the offending line

              An artifact is downloadable by anyone with repository read access and is retained for
              weeks. Redacting the rendered summary while shipping the raw value in a downloadable file
              is theatre -- it moves the credential from a page someone reads to a file someone opens.

              The consolidated report job made it worse by copying every SARIF into one artifact.

          WHAT SURVIVES, WHICH IS EVERYTHING NEEDED TO FIX THE FINDING
              rule id, severity, FILE, LINE, message with credential-shaped substrings masked to a short
              prefix. What is removed: `snippet`, `contextRegion.snippet`, and `partialFingerprints`
              (which for a secret scanner can be a hash of the secret itself).

          IT IS NOT A SUBSTITUTE FOR --redact AT THE SCANNER
              Defence in depth. A scanner that can be told not to emit the value should be told. This
              catches the ones that cannot, and the ones a consumer adds later.

          USAGE
              python3 redact_sarif.py <file.sarif> [more.sarif ...]
              python3 redact_sarif.py --self-test

          EXIT
              0 rewritten (or nothing to do)      1 a file was unreadable      2 self-test failed
          """
          import io
          import json
          import os
          import re
          import sys

          # BEGIN SECRET_PATTERNS -- must stay identical to scripts/scan_report.py.
          # Two copies exist because each file is inlined into the workflow separately and neither can
          # import the other at consumer runtime. tests/check_redaction_parity.py fails the build if they
          # diverge, so the duplication is an enforced invariant rather than a hope -- the same treatment
          # the SARIF normalizer gets for the same reason.
          SECRET_PATTERNS = [
              (re.compile(r'-----BEGIN[A-Z ]*PRIVATE KEY-----'), 'private-key'),
              (re.compile(r'\bAKIA[0-9A-Z]{16}\b'), 'aws-access-key-id'),
              (re.compile(r'\bgh[pousr]_[A-Za-z0-9]{16,}'), 'github-token'),
              (re.compile(r'\bxox[baprs]-[A-Za-z0-9-]{10,}'), 'slack-token'),
              (re.compile(r'\beyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}'), 'jwt'),
              (re.compile(r'\b[A-Za-z0-9~._-]{3}8Q~[A-Za-z0-9~._-]{31,34}\b'), 'entra-client-secret'),
              (re.compile(r'(?i)\b(?:AccountKey|SharedAccessKey|password|pwd|secret|token|api[_-]?key)'
                          r'\s*[:=]\s*["\']?([^\s;,"\'&]{8,})'), 'keyed-value'),
              (re.compile(r'\b[A-Za-z0-9+/]{32,}={0,2}(?![A-Za-z0-9+/=])'), 'high-entropy'),
              (re.compile(r'\b[0-9a-fA-F]{32,}\b'), 'hex-or-digest'),
          ]


          def _mask(value, label):
              keep = value[:4]
              return '%s%s [redacted: %s, %d chars]' % (keep, '*' * min(len(value) - len(keep), 18),
                                                        label, len(value))


          REDACTED_MARK = '[redacted: '


          def redact(text):
              """Mask anything that looks like credential material. Returns the safe string.

              IDEMPOTENT, which is not free. Masking `password: AKIAIOSFODNN7EXAMPLE` produces
              `password: AKIA**************** [redacted: ...]`, and that output STILL matches the
              keyed-value pattern -- so a second pass masked the mask, and a third masked that. It
              matters because a SARIF can legitimately be redacted twice: once in the scanner job before
              upload, once in the consolidated report after download. Non-idempotent redaction would
              corrupt the text on the second pass and make the finding unreadable.
              """
              if not text:
                  return text
              out = text
              for pat, label in SECRET_PATTERNS:
                  def _sub(m, _l=label):
                      whole = m.group(0)
                      v = m.group(1) if m.groups() and m.group(1) else whole
                      if len(v) < 8 or REDACTED_MARK in whole or '****' in v:
                          return whole
                      return whole.replace(v, _mask(v, _l))
                  out = pat.sub(_sub, out)
              return out
          # END SECRET_PATTERNS


          def scrub(doc):
              """-> (snippets_removed, messages_masked). Mutates doc."""
              snips = masked = 0
              for run in (doc.get('runs') or []):
                  for res in (run.get('results') or []):
                      msg = ((res.get('message') or {}).get('text'))
                      if msg:
                          r = redact(msg)
                          if r != msg:
                              res['message']['text'] = r
                              masked += 1
                      for loc in (res.get('locations') or []) + (res.get('relatedLocations') or []):
                          pl = (loc.get('physicalLocation') or {})
                          for key in ('region', 'contextRegion'):
                              reg = pl.get(key) or {}
                              if 'snippet' in reg:
                                  reg.pop('snippet', None)
                                  snips += 1
                      # A partial fingerprint from a secret scanner can be a hash OF THE SECRET, which is
                      # an offline-guessable artifact for anything low-entropy. It buys correlation that
                      # this kit gets from file+rule instead.
                      if res.pop('partialFingerprints', None) is not None:
                          snips += 1
                      for cf in (res.get('codeFlows') or []):
                          for tf in (cf.get('threadFlows') or []):
                              for lo in (tf.get('locations') or []):
                                  pl = ((lo.get('location') or {}).get('physicalLocation') or {})
                                  for key in ('region', 'contextRegion'):
                                      reg = pl.get(key) or {}
                                      if 'snippet' in reg:
                                          reg.pop('snippet', None)
                                          snips += 1
              return (snips, masked)


          def self_test():
              fails = []
              doc = {'version': '2.1.0', 'runs': [{'tool': {'driver': {'name': 'bandit'}}, 'results': [
                  {'ruleId': 'B105', 'level': 'error',
                   'message': {'text': 'Possible hardcoded password: AKIAIOSFODNN7EXAMPLE'},
                   'partialFingerprints': {'x': 'deadbeef'},
                   'locations': [{'physicalLocation': {
                       'artifactLocation': {'uri': 'app/config.py'},
                       'region': {'startLine': 12,
                                  'snippet': {'text': 'PASSWORD = "AKIAIOSFODNN7EXAMPLE"'}},
                       'contextRegion': {'snippet': {'text': 'ctx AKIAIOSFODNN7EXAMPLE'}}}}]}]}]}
              snips, masked = scrub(doc)
              blob = json.dumps(doc)
              if 'AKIAIOSFODNN7EXAMPLE' in blob:
                  fails.append('a credential survived scrub()')
              if 'app/config.py' not in blob or '12' not in blob:
                  fails.append('scrub() destroyed the file/line needed to fix it')
              if 'AKIA' not in blob:
                  fails.append('scrub() removed the prefix identifying WHICH credential')
              if snips < 3:
                  fails.append('snippet/contextRegion/partialFingerprints not all removed (%d)' % snips)
              if masked != 1:
                  fails.append('message was not masked')
              # Idempotent: running twice must not double-mask or crash.
              s2, m2 = scrub(doc)
              if (s2, m2) != (0, 0):
                  fails.append('scrub() is not idempotent (%d,%d on second pass)' % (s2, m2))
              # A clean report must come through untouched.
              clean = {'runs': [{'results': [{'ruleId': 'X', 'message': {'text': 'unused import os'},
                                              'locations': [{'physicalLocation': {
                                                  'artifactLocation': {'uri': 'a.py'},
                                                  'region': {'startLine': 1}}}]}]}]}
              before = json.dumps(clean)
              scrub(clean)
              if json.dumps(clean) != before:
                  fails.append('a clean finding was altered')
              if fails:
                  print('SELF-TEST FAILED:')
                  for f in fails:
                      print('  - %s' % f)
                  return False
              print('self-test ok: credential masked, snippet/contextRegion/partialFingerprints removed, '
                    'file and line preserved, idempotent, clean findings untouched')
              return True


          def main():
              argv = [a for a in sys.argv[1:] if not a.startswith('-')]
              if '--self-test' in sys.argv:
                  return 0 if self_test() else 2
              if not self_test():
                  print('ABORTING -- a redactor that cannot prove it redacts is worse than none.')
                  return 2
              rc = 0
              for p in argv:
                  if not os.path.exists(p) or os.path.getsize(p) == 0:
                      print('  %s: absent or empty, nothing to redact' % p)
                      continue
                  try:
                      doc = json.load(io.open(p, encoding='utf-8', errors='replace'))
                  except (ValueError, IOError) as e:
                      # A SARIF that cannot be parsed cannot be redacted, and must NOT be uploaded on the
                      # assumption that it is probably fine. Emptying it loses nothing a reader could
                      # have used -- an unparseable report establishes nothing either way -- and it
                      # cannot leak what it was carrying.
                      print('::warning title=Unredactable SARIF::%s could not be parsed (%s); it is '
                            'replaced with an empty report rather than uploaded unexamined.'
                            % (p, type(e).__name__))
                      io.open(p, 'w', encoding='utf-8').write(
                          json.dumps({'version': '2.1.0', 'runs': [],
                                      '_redaction': 'ORIGINAL UNPARSEABLE - WITHHELD'}))
                      rc = 1
                      continue
                  snips, masked = scrub(doc)
                  json.dump(doc, io.open(p, 'w', encoding='utf-8'))
                  print('  %s: %d snippet/fingerprint field(s) removed, %d message(s) masked'
                        % (os.path.basename(p), snips, masked))
              return rc


          if __name__ == '__main__':
              sys.exit(main())

          REDACT_SARIF_PY
          shopt -s nullglob globstar
          files=( *.sarif **/*.sarif )
          if [ ${#files[@]} -eq 0 ]; then
            echo "no SARIF produced by this job -- nothing to redact"
          else
            python3 /tmp/redact_sarif.py "${files[@]}"
          fi
      # END REDACT_SARIF
      - name: Checkov — keep SARIF as an artifact
        if: always() && steps.sarif_checkov.outputs.exists == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: sarif-checkov-${{ github.run_attempt }}
          path: checkov.sarif/results_sarif.sarif
          retention-days: 30
          if-no-files-found: warn
      - name: Checkov — publish to the Security tab where available
        id: cs_checkov
        if: always() && steps.sarif_checkov.outputs.exists == 'true'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: checkov.sarif/results_sarif.sarif
          category: checkov
      - name: Checkov — state plainly if publication degraded
        if: always() && steps.sarif_checkov.outputs.exists == 'true' && steps.cs_checkov.outcome != 'success'
        run: |
          # Loud, never silent. An empty Security tab is indistinguishable from a clean
          # codebase, and that ambiguity is how a control becomes false assurance.
          echo "::warning title=Checkov: NOT published to the Security tab::Code scanning is"
          echo "unavailable here (free on public repos, otherwise GitHub Advanced Security)."
          echo "The scan SUCCEEDED and the gate still enforces on these findings."
          echo "Retrieve them from the 'sarif-checkov' artifact."
      - name: Trivy IaC misconfig
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ inputs.paths }}
          severity: ${{ inputs.fail_on_severity }}
          format: sarif
          output: trivy-iac.sarif
      # Findings must survive whether or not this repo has code scanning. Uploading to the
      # Security tab is a PUBLICATION channel, not the finding itself — free on public repos,
      # otherwise Advanced Security. Treating it as mandatory turned successful scans into
      # failed jobs on every private repo without GHAS.
      # SECOND IMPLEMENTATION OF THE CAPTURE CONTRACT. Trivy roots its URIs at the SCAN SCOPE it
      # was handed, while Checkov and Semgrep report repo-relative -- so the same file arrived with
      # two identities inside one repository. The expected-signal contract missed it because the IaC
      # signals are not tool-pinned, which is the same blind spot the Go pin exposed one layer over.
      #
      # gosec exposed the abstraction; this proves it generalizes. Verified against the real Trivy
      # SARIF from run 32151293153: `infra/main.tf` -> `tests/consumer-fixture/full/infra/main.tf`,
      # identical in form to what Checkov and Semgrep already produced.
      - name: Normalize Trivy IaC paths onto the repository
        if: always()
        run: |
          set -uo pipefail
          if [ ! -s trivy-iac.sarif ]; then
            echo "::notice title=Nothing to normalize::no trivy-iac.sarif; scanner produced no report."
            exit 0
          fi
          # BEGIN NORMALIZE_SARIF — generated from scripts/normalize_sarif.py. DO NOT EDIT HERE.
          cat > /tmp/normalize_sarif.py <<'NORMALIZE_PY'
          #!/usr/bin/env python3
          """CANONICAL SARIF path normalizer. Re-root scanner paths onto the repository.

          THIS FILE IS THE SINGLE SOURCE OF TRUTH.

          It is INLINED into the reusable workflows rather than called as `uses: ./...`, because a reusable
          workflow resolves local paths against the CALLER's checkout — so anything under `scripts/` simply
          does not exist at consumer runtime. That is the same failure that left 14 Azure gitleaks rules
          silently unloaded for every consumer while the kit's own CI stayed green.

          Inlining three copies would reintroduce drift, which is the defect family this kit exists to catch
          (a fix applied to the probe and not the workflow; a tag bumped in one place and not another). So the
          copies are CHECKED: `self-test` asserts every inlined block is byte-identical to this file. Drift
          becomes a build failure instead of a silent divergence.

          WHY NORMALIZATION IS NEEDED AT ALL
          ----------------------------------
          A scanner invoked with a subdirectory as its working directory reports URIs relative to THAT
          directory, not the repository:

            gosec  runs per Go module   -> `go/vuln.go` and `services/worker/vuln.go` BOTH arrive as `vuln.go`
            Trivy  roots at the scan scope -> `infra/main.tf` where Checkov reports the full repo-relative path

          Two files acquire one identity, or one file acquires two. Everything downstream inherits it:
          annotations point at paths that do not exist, finding history cannot separate components across
          runs, one scanner silently "covers for" another in a tool-pinned assertion, and correlation later
          merges findings from different components as though they were the same finding.

          The component root CANNOT be recovered afterwards — merged filenames use `tr '/' '_'`, which is
          lossy. So normalization happens at the POINT OF CAPTURE, while the root is still known.

          INVARIANT: normalize only after source identity is bound. Never merge first and reconstruct
          provenance later.

          USAGE
              python3 normalize_sarif.py <src.sarif> <dst.sarif> <prefix>

          `<prefix>` is the component root relative to the repository. `.` or empty is a no-op, so callers
          need no special case for a root-level project. Idempotent: a URI already carrying the prefix is left
          alone, so re-running cannot double-root.

          Reads SRC and writes DST — never rewrites in place. Containerized scanners produce ROOT-OWNED files;
          opening one for writing fails with EACCES, which turned a misreported finding into an absent one.
          """

          import io
          import json
          import sys


          def reroot(uri, prefix):
              if not uri or not isinstance(uri, str):
                  return uri
              u = uri.replace("\\", "/")
              if u.startswith("file://"):
                  u = u[7:]
              while u.startswith("./"):
                  u = u[2:]
              # An absolute path inside a CONTAINER says nothing about the repository.
              if u.startswith("/src/"):
                  u = u[5:]
              u = u.lstrip("/")
              if prefix in ("", "."):
                  return u
              if u == prefix or u.startswith(prefix + "/"):
                  return u          # idempotent: never double-root
              return prefix + "/" + u


          def fix_locs(locs, prefix):
              for loc in locs or []:
                  if not isinstance(loc, dict):
                      continue
                  phys = loc.get("physicalLocation")
                  if isinstance(phys, dict):
                      art = phys.get("artifactLocation")
                      if isinstance(art, dict) and "uri" in art:
                          art["uri"] = reroot(art["uri"], prefix)


          def normalize(doc, prefix):
              for run in doc.get("runs", []) or []:
                  for art in run.get("artifacts", []) or []:      # what viewers resolve against
                      al = (art or {}).get("location")
                      if isinstance(al, dict) and "uri" in al:
                          al["uri"] = reroot(al["uri"], prefix)
                  for res in run.get("results", []) or []:
                      fix_locs(res.get("locations"), prefix)
                      fix_locs(res.get("relatedLocations"), prefix)
                      at = res.get("analysisTarget")
                      if isinstance(at, dict) and "uri" in at:
                          at["uri"] = reroot(at["uri"], prefix)
                      # A partially re-rooted code flow is worse than none — it still looks authoritative.
                      for flow in res.get("codeFlows", []) or []:
                          for tf in (flow or {}).get("threadFlows", []) or []:
                              for step in (tf or {}).get("locations", []) or []:
                                  if isinstance(step, dict):
                                      fix_locs([step.get("location")], prefix)
              return doc


          def main(argv):
              if len(argv) != 4:
                  print("usage: normalize_sarif.py <src> <dst> <prefix>", file=sys.stderr)
                  return 2
              src, dst = argv[1], argv[2]
              prefix = argv[3].replace("\\", "/").strip("/")
              doc = json.load(io.open(src, encoding="utf-8"))
              json.dump(normalize(doc, prefix), io.open(dst, "w", encoding="utf-8"))
              n = sum(len(r.get("results", []) or []) for r in doc.get("runs", []) or [])
              print("normalize_sarif: %s -> %s rooted at '%s' (%d result(s))" % (src, dst, prefix or ".", n))
              return 0


          if __name__ == "__main__":
              sys.exit(main(sys.argv))

          NORMALIZE_PY
          # END NORMALIZE_SARIF
          # Read source, write destination -- never rewrite in place. Containerized scanners emit
          # root-owned files, and opening one for writing turned a misreported finding into an
          # absent one once already.
          python3 /tmp/normalize_sarif.py trivy-iac.sarif trivy-iac.sarif.norm "${{ inputs.paths }}"
          mv trivy-iac.sarif.norm trivy-iac.sarif

      - name: Trivy (IaC) — is there anything to publish?
        if: always()
        id: sarif_trivy_iac
        run: |
          # No SARIF usually means no applicable source (gosec on a repo with no Go). That is
          # a legitimate outcome, not a failure, and previously crashed the upload step.
          if [ -s "trivy-iac.sarif" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Trivy (IaC): nothing to publish::No SARIF at 'trivy-iac.sarif' — no applicable source files. Not a failure."
          fi
      - name: Trivy (IaC) — keep SARIF as an artifact
        if: always() && steps.sarif_trivy_iac.outputs.exists == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: sarif-trivy-iac-${{ github.run_attempt }}
          path: trivy-iac.sarif
          retention-days: 30
          if-no-files-found: warn
      - name: Trivy (IaC) — publish to the Security tab where available
        id: cs_trivy_iac
        if: always() && steps.sarif_trivy_iac.outputs.exists == 'true'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-iac.sarif
          category: trivy-iac
      - name: Trivy (IaC) — state plainly if publication degraded
        if: always() && steps.sarif_trivy_iac.outputs.exists == 'true' && steps.cs_trivy_iac.outcome != 'success'
        run: |
          # Loud, never silent. An empty Security tab is indistinguishable from a clean
          # codebase, and that ambiguity is how a control becomes false assurance.
          echo "::warning title=Trivy (IaC): NOT published to the Security tab::Code scanning is"
          echo "unavailable here (free on public repos, otherwise GitHub Advanced Security)."
          echo "The scan SUCCEEDED and the gate still enforces on these findings."
          echo "Retrieve them from the 'sarif-trivy-iac' artifact."

  # ─── Gate ───────────────────────────────────────────────────
  # --------------------------------------------------------------- native SAST
  # Semgrep covers these languages via rulesets; these jobs add the language-native
  # analyzers that Semgrep does not replace.

      # BEGIN SCAN_STATUS — generated from scripts/scan_status.sh. DO NOT EDIT HERE.
      - name: Result summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          cat > /tmp/scan_status.sh <<'SCAN_STATUS_SH'
          #!/usr/bin/env bash
          # Short per-job result block. Runs at the end of every scanner job.
          #
          # WHY THIS EXISTS ALONGSIDE THE CONSOLIDATED REPORT
          #     The consolidated `report` job owns normalisation, cross-scanner dedupe, correlation,
          #     remediation detail and disposition, because those are only possible where every finding is
          #     visible at once. That is not a reason for a scanner job to stay silent.
          #
          #     Someone debugging Semgrep is IN the Semgrep job. Making them leave it to discover whether it
          #     found anything is how "the pipeline is noise" becomes true. So the scanner prints what it
          #     alone knows -- did it run, how many findings, was SARIF produced -- and points at the
          #     consolidated job for what it cannot know.
          #
          # DELIBERATELY NOT A SECOND COPY OF THE CONTRACT
          #     No severity interpretation, no remediation, no gate verdict, no disposition. Those live in
          #     exactly one place. A contract implemented twice drifts twice, and this kit has the scars:
          #     fourteen Azure gitleaks rules and a flawfinder fix both lost to a second copy.
          #
          # THE ZERO RULE APPLIES HERE TOO
          #     A job that did not run, or produced no parseable SARIF, prints NOT ESTABLISHED. It never
          #     prints 0. Zero says someone looked.
          #
          # USAGE   scan_status <name> <execution> <sarif-or-empty> [scope]
          scan_status() {
            _name="$1"; _exec="$2"; _sarif="${3:-}"; _scope="${4:-}"
            _out="${GITHUB_STEP_SUMMARY:-/dev/stdout}"

            _n="NOT ESTABLISHED"; _sar="NOT GENERATED"
            if [ -n "$_sarif" ] && [ -s "$_sarif" ]; then
              # suppression: FAILURE_ISOLATION_WITH_STATE_CAPTURE -- jq's failure IS the signal here, and
              # it is captured rather than swallowed: a non-zero exit takes the else branch and reports
              # INVALID plus "count unavailable from current parser". stderr is silenced because the parse
              # error text is not useful in a summary block; the STATE survives and is published. If this
              # fails in a way other than "not valid SARIF" -- jq missing, file unreadable -- the result is
              # the same and is still not a clean zero, which is the outcome that matters.
              if _c=$(jq '[.runs[].results[]] | length' "$_sarif" 2>/dev/null); then
                _sar="GENERATED"
                # Only a scanner that actually completed may report a count. A crashed run that happens to
                # have left a partial report behind must not publish a number from it.
                case "$_exec" in
                  COMPLETE) _n="$_c" ;;
                  *)        _n="NOT ESTABLISHED" ;;
                esac
              else
                # A file that is not valid SARIF is a collection failure wearing a report's clothes.
                _sar="INVALID"
                _n="PRESENT -- count unavailable from current parser"
              fi
            fi

            {
              printf '### %s\n\n' "$_name"
              printf '| | |\n|---|---|\n'
              printf '| Execution | %s |\n' "$_exec"
              [ -n "$_scope" ] && printf '| Scope | %s |\n' "$_scope"
              printf '| Findings | %s |\n' "$_n"
              printf '| SARIF | %s |\n' "$_sar"
              printf '\n'
              if [ "$_n" = "NOT ESTABLISHED" ]; then
                printf 'This is not zero. Nothing usable was collected for this scope in this run.\n\n'
              fi
              printf 'Severity breakdown, remediation, gate impact and disposition are in the\n'
              printf '**Security scan report** job, which sees every scanner at once and can tell\n'
              printf 'when two tools are describing the same condition.\n\n'
            } >> "$_out"

            printf '%s: execution=%s findings=%s sarif=%s\n' "$_name" "$_exec" "$_n" "$_sar"
          }

          SCAN_STATUS_SH
          . /tmp/scan_status.sh
          if [ "$JOB_STATUS" = "success" ]; then _e=COMPLETE; else _e=FAILED; fi
          scan_status "Infrastructure" "$_e" "" "terraform / bicep / docker"
      # END SCAN_STATUS

  sast-dotnet:
    needs: [discover]
    # DISCOVERED, NOT DECLARED. Runs because roots for this ecosystem were actually
    # found in the caller's scope -- not because a selector named it. On failure
    # discovery turns everything on rather than producing a tidy row of NOT_APPLICABLE.
    if: needs.discover.outputs.dotnet == 'true'
    name: SAST + deps (.NET)
    runs-on: ubuntu-latest
    # Bounded so a stalled dependency cannot bill six hours (LM-001: unbounded execution
    # converts a dependency failure into uncontrolled cost).
    # NOT YET: a timeout still surfaces as a plain job failure. It SHOULD classify as
    # UNAVAILABLE / EXECUTION_TIMEOUT — cost is bounded here, semantics are not. See
    # docs/roadmap/FUTURE_WORK.md. Do not let this comment imply the mapping exists.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ inputs.dotnet_version }}
      - name: Restore
        run: |
          set -uo pipefail
          # ROOT ASSUMPTION, same class as Node and Go. The glob ran from the repository root
          # and ignored `paths`, so a nested solution was never restored and the dependency
          # audit below then had nothing to resolve — reporting success having checked nothing.
          scope="${{ inputs.paths }}"; [ -d "$scope" ] || scope="."
          find "$scope" -maxdepth 6 \( -name '*.sln' -o -name '*.csproj' \) | sort > .dotnet-roots.txt
          n=$(wc -l < .dotnet-roots.txt)
          if [ "$n" -eq 0 ]; then
            echo "::notice title=No .NET projects::No .sln or .csproj under '$scope'."
            echo "COVERAGE=NOT_APPLICABLE"
            exit 0
          fi
          echo "### .NET projects discovered ($n)" >> "$GITHUB_STEP_SUMMARY"
          while read -r proj; do
            echo "- \`$proj\`" >> "$GITHUB_STEP_SUMMARY"
            echo "restoring $proj"
            dotnet restore "$proj" || true
          done < .dotnet-roots.txt
      - name: Vulnerable + deprecated NuGet packages
        run: |
          set -uo pipefail
          echo "## .NET dependency audit" >> "$GITHUB_STEP_SUMMARY"
          dotnet list package --vulnerable --include-transitive 2>&1 | tee dotnet-vuln.txt || true
          dotnet list package --deprecated 2>&1 | tee -a dotnet-vuln.txt || true
          if grep -qiE ">\s*(Critical|High)" dotnet-vuln.txt; then
            echo "::error::Critical/High vulnerable NuGet package(s) found."
            [ "${{ inputs.soft_fail_sast }}" = "true" ] || exit 1
          fi
      # Findings must survive whether or not this repo has code scanning. Uploading to the
      # Security tab is a PUBLICATION channel, not the finding itself — free on public repos,
      # otherwise Advanced Security. Treating it as mandatory turned successful scans into
      # failed jobs on every private repo without GHAS.
      - name: Semgrep (C#)
        id: dotnet_semgrep
        run: |
          set -uo pipefail
          # THIS STEP DID NOT EXIST. The job installed .NET, audited NuGet packages, then
          # published `dotnet-semgrep.sarif` — a file nothing ever wrote. .NET had dependency
          # scanning and ZERO static analysis, while the job reported success every time.
          scope="${{ inputs.paths }}"; [ -d "$scope" ] || scope="."
          # "NONE FOUND" AND "COULD NOT LOOK" ARE DIFFERENT ANSWERS. A find that ERRORS produces
          # empty output, which read as "this language is not here", which skipped the job, which
          # reported green over code nobody scanned. Same defect discovery had; same fix.
          # suppression: PRESENTATION_ONLY -- find's stderr is noise on unreadable subtrees; the EXIT
          # STATUS is checked on the next line and a failure raises COLLECTION_FAILED rather than reading
          # as 'nothing found'.
          # discards: find's stderr, which is noise on unreadable or permission-denied subtrees
          # preserved_by: the EXIT STATUS is captured on the next line and a non-zero rc raises
          # preserved_by: COLLECTION_FAILED, so 'could not look' never reads as 'found nothing'
          if ! _hits=$(find "$scope" -name '*.cs' 2>/dev/null); then
            echo "::error title=COLLECTION_FAILED::Applicability survey failed; cannot establish scope."
            echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ -z "$_hits" ]; then
            echo "::notice title=No C# sources::None under '$scope'. Skipping."
            exit 0
          fi
          python3 -m pip install --quiet semgrep
          # SEMGREP SKIPS test/ and fixture/ DIRECTORIES BY DEFAULT.
          # That default is why every semgrep job reported success with zero findings while
          # bandit — which has no such default — found the seeded flaw in the same tree. Any
          # consumer whose code sits under a path matching semgrep's built-in ignore list gets
          # a silent, confident, empty result. Writing our own .semgrepignore replaces the
          # default entirely; the caller's scope decides what is scanned, not semgrep's guess.
          printf 'node_modules/\n.git/\n' > .semgrepignore
          # A LINE CONTINUATION FOLLOWED BY A COMMENT IS NOT A CONTINUATION.
          #
          # The `\` escapes the newline and joins the COMMENT line, so everything after `#` is
          # discarded -- taking the output flags AND "$scope" with it. The scanner then ran
          # unscoped over the whole checkout and wrote no report, while the orphaned flag line
          # became a bogus command that `|| true` swallowed. Exit 0. Job green. Nothing detected.
          # Four sites carried this; found 2026-09-02 by sibling search after the seeded Go
          # signal came back WRONG-TOOL. Comments now sit ABOVE the command, never inside it.
          #
          # suppression: EXPECTED_NEGATIVE_RESULT -- this scanner exits nonzero when it FINDS something,
          # which is not an error. Detection is separated from enforcement here; the count step downstream
          # distinguishes 'found nothing' from 'produced no report' and emits COLLECTION_FAILED for the
          # latter.
          # discards: this scanner's non-zero exit, which means FINDINGS rather than malfunction
          # preserved_by: the count step distinguishes an absent report from an empty one and emits
          # preserved_by: COLLECTION_FAILED for the former; the enforce step refuses an absent count
          semgrep scan --config p/csharp --config p/security-audit \
            --sarif --output dotnet-semgrep.sarif --metrics=off "$scope" || true
          # A PARSE FAILURE IS NOT ZERO FINDINGS.
          #
          # This was `jq ... 2>/dev/null || echo 0`, so a missing, truncated or malformed report
          # produced n=0 -- which the gate reads as CLEAN. The taxonomy already had a word for
          # exactly this (COLLECTION_FAILED: "an empty but well-formed result is indistinguishable
          # from a clean scan") while the code did the opposite. Found by auditing the class after
          # the same defect turned up in discovery, not by reading this line.
          if [ ! -s dotnet-semgrep.sarif ]; then
            echo "::error title=COLLECTION_FAILED::dotnet-semgrep.sarif was not produced."
            echo "An ABSENT report is not zero findings. Posture cannot be established from this run."
            echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if ! n=$(jq '[.runs[].results[]] | length' dotnet-semgrep.sarif 2>&1); then
            echo "::error title=COLLECTION_FAILED::dotnet-semgrep.sarif is not valid SARIF."
            echo "jq said: $n"
            echo "A PARSE FAILURE is not zero findings."
            echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "C# SAST findings: $n"

      - name: Semgrep (C#) — enforce
        if: always()
        run: |
          n='${{ steps.dotnet_semgrep.outputs.count }}'
          # COLLECTION_FAILED IS NOT ZERO FINDINGS -- AND THIS STEP RUNS ON always().
          #
          # The counting step above correctly refuses to turn a missing or malformed report
          # into n=0, and exits non-zero. But `if: always()` means THIS step still runs, reads
          # an output that was never written, and ${n:-0} quietly supplies the very zero the
          # step above refused to invent -- announcing GATE=PASS one line after the failure was
          # detected. Each side assumed the other had handled it. Check explicitly.
          collection='${{ steps.dotnet_semgrep.outputs.collection }}'
          if [ "$collection" = "COLLECTION_FAILED" ]; then
            echo "::error title=COLLECTION_FAILED::Evidence could not be collected."
            echo "Posture CANNOT be established from this run. This is not a clean result."
            exit 1
          fi
          if [ -z "${n:-}" ]; then
            echo "::error title=COLLECTION_FAILED::No count was produced by the scan step."
            echo "An ABSENT measurement is not a measurement of zero."
            exit 1
          fi
          if [ "${n:-0}" -gt 0 ] && [ "${{ inputs.soft_fail_sast }}" != "true" ] && [ "${{ inputs.advisory_mode }}" != "true" ]; then
            echo "::error title=Semgrep (C#)::${n} finding(s). ANALYSIS=COMPLETE GATE=FAIL"; exit 1
          fi
          echo "ANALYSIS=COMPLETE GATE=PASS (${n:-0} finding(s))"

      - name: Semgrep (C#) — is there anything to publish?
        if: always()
        id: sarif_semgrep_csharp
        run: |
          # No SARIF usually means no applicable source (gosec on a repo with no Go). That is
          # a legitimate outcome, not a failure, and previously crashed the upload step.
          if [ -s "dotnet-semgrep.sarif" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Semgrep (C#): nothing to publish::No SARIF at 'dotnet-semgrep.sarif' — no applicable source files. Not a failure."
          fi
      # BEGIN REDACT_SARIF — generated from scripts/redact_sarif.py. DO NOT EDIT HERE.
      - name: Redact credential material before upload
        if: always()
        shell: bash
        run: |
          cat > /tmp/redact_sarif.py <<'REDACT_SARIF_PY'
          #!/usr/bin/env python3
          """Strip credential material from a SARIF file IN PLACE, before it becomes an artifact.

          WHY THIS EXISTS
              The kit redacted exactly one scanner. gitleaks ran with --redact and had `snippet` and
              `partialFingerprints` stripped before upload. Thirteen other jobs uploaded raw SARIF, and
              several of those scanners embed matched source by design:

                  bandit    B105 hardcoded_password_string -- the snippet IS the password
                  semgrep   snippet carries the matched source line
                  trivy     secret mode reports the match
                  checkov   includes the offending code block
                  gosec     includes the offending line

              An artifact is downloadable by anyone with repository read access and is retained for
              weeks. Redacting the rendered summary while shipping the raw value in a downloadable file
              is theatre -- it moves the credential from a page someone reads to a file someone opens.

              The consolidated report job made it worse by copying every SARIF into one artifact.

          WHAT SURVIVES, WHICH IS EVERYTHING NEEDED TO FIX THE FINDING
              rule id, severity, FILE, LINE, message with credential-shaped substrings masked to a short
              prefix. What is removed: `snippet`, `contextRegion.snippet`, and `partialFingerprints`
              (which for a secret scanner can be a hash of the secret itself).

          IT IS NOT A SUBSTITUTE FOR --redact AT THE SCANNER
              Defence in depth. A scanner that can be told not to emit the value should be told. This
              catches the ones that cannot, and the ones a consumer adds later.

          USAGE
              python3 redact_sarif.py <file.sarif> [more.sarif ...]
              python3 redact_sarif.py --self-test

          EXIT
              0 rewritten (or nothing to do)      1 a file was unreadable      2 self-test failed
          """
          import io
          import json
          import os
          import re
          import sys

          # BEGIN SECRET_PATTERNS -- must stay identical to scripts/scan_report.py.
          # Two copies exist because each file is inlined into the workflow separately and neither can
          # import the other at consumer runtime. tests/check_redaction_parity.py fails the build if they
          # diverge, so the duplication is an enforced invariant rather than a hope -- the same treatment
          # the SARIF normalizer gets for the same reason.
          SECRET_PATTERNS = [
              (re.compile(r'-----BEGIN[A-Z ]*PRIVATE KEY-----'), 'private-key'),
              (re.compile(r'\bAKIA[0-9A-Z]{16}\b'), 'aws-access-key-id'),
              (re.compile(r'\bgh[pousr]_[A-Za-z0-9]{16,}'), 'github-token'),
              (re.compile(r'\bxox[baprs]-[A-Za-z0-9-]{10,}'), 'slack-token'),
              (re.compile(r'\beyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}'), 'jwt'),
              (re.compile(r'\b[A-Za-z0-9~._-]{3}8Q~[A-Za-z0-9~._-]{31,34}\b'), 'entra-client-secret'),
              (re.compile(r'(?i)\b(?:AccountKey|SharedAccessKey|password|pwd|secret|token|api[_-]?key)'
                          r'\s*[:=]\s*["\']?([^\s;,"\'&]{8,})'), 'keyed-value'),
              (re.compile(r'\b[A-Za-z0-9+/]{32,}={0,2}(?![A-Za-z0-9+/=])'), 'high-entropy'),
              (re.compile(r'\b[0-9a-fA-F]{32,}\b'), 'hex-or-digest'),
          ]


          def _mask(value, label):
              keep = value[:4]
              return '%s%s [redacted: %s, %d chars]' % (keep, '*' * min(len(value) - len(keep), 18),
                                                        label, len(value))


          REDACTED_MARK = '[redacted: '


          def redact(text):
              """Mask anything that looks like credential material. Returns the safe string.

              IDEMPOTENT, which is not free. Masking `password: AKIAIOSFODNN7EXAMPLE` produces
              `password: AKIA**************** [redacted: ...]`, and that output STILL matches the
              keyed-value pattern -- so a second pass masked the mask, and a third masked that. It
              matters because a SARIF can legitimately be redacted twice: once in the scanner job before
              upload, once in the consolidated report after download. Non-idempotent redaction would
              corrupt the text on the second pass and make the finding unreadable.
              """
              if not text:
                  return text
              out = text
              for pat, label in SECRET_PATTERNS:
                  def _sub(m, _l=label):
                      whole = m.group(0)
                      v = m.group(1) if m.groups() and m.group(1) else whole
                      if len(v) < 8 or REDACTED_MARK in whole or '****' in v:
                          return whole
                      return whole.replace(v, _mask(v, _l))
                  out = pat.sub(_sub, out)
              return out
          # END SECRET_PATTERNS


          def scrub(doc):
              """-> (snippets_removed, messages_masked). Mutates doc."""
              snips = masked = 0
              for run in (doc.get('runs') or []):
                  for res in (run.get('results') or []):
                      msg = ((res.get('message') or {}).get('text'))
                      if msg:
                          r = redact(msg)
                          if r != msg:
                              res['message']['text'] = r
                              masked += 1
                      for loc in (res.get('locations') or []) + (res.get('relatedLocations') or []):
                          pl = (loc.get('physicalLocation') or {})
                          for key in ('region', 'contextRegion'):
                              reg = pl.get(key) or {}
                              if 'snippet' in reg:
                                  reg.pop('snippet', None)
                                  snips += 1
                      # A partial fingerprint from a secret scanner can be a hash OF THE SECRET, which is
                      # an offline-guessable artifact for anything low-entropy. It buys correlation that
                      # this kit gets from file+rule instead.
                      if res.pop('partialFingerprints', None) is not None:
                          snips += 1
                      for cf in (res.get('codeFlows') or []):
                          for tf in (cf.get('threadFlows') or []):
                              for lo in (tf.get('locations') or []):
                                  pl = ((lo.get('location') or {}).get('physicalLocation') or {})
                                  for key in ('region', 'contextRegion'):
                                      reg = pl.get(key) or {}
                                      if 'snippet' in reg:
                                          reg.pop('snippet', None)
                                          snips += 1
              return (snips, masked)


          def self_test():
              fails = []
              doc = {'version': '2.1.0', 'runs': [{'tool': {'driver': {'name': 'bandit'}}, 'results': [
                  {'ruleId': 'B105', 'level': 'error',
                   'message': {'text': 'Possible hardcoded password: AKIAIOSFODNN7EXAMPLE'},
                   'partialFingerprints': {'x': 'deadbeef'},
                   'locations': [{'physicalLocation': {
                       'artifactLocation': {'uri': 'app/config.py'},
                       'region': {'startLine': 12,
                                  'snippet': {'text': 'PASSWORD = "AKIAIOSFODNN7EXAMPLE"'}},
                       'contextRegion': {'snippet': {'text': 'ctx AKIAIOSFODNN7EXAMPLE'}}}}]}]}]}
              snips, masked = scrub(doc)
              blob = json.dumps(doc)
              if 'AKIAIOSFODNN7EXAMPLE' in blob:
                  fails.append('a credential survived scrub()')
              if 'app/config.py' not in blob or '12' not in blob:
                  fails.append('scrub() destroyed the file/line needed to fix it')
              if 'AKIA' not in blob:
                  fails.append('scrub() removed the prefix identifying WHICH credential')
              if snips < 3:
                  fails.append('snippet/contextRegion/partialFingerprints not all removed (%d)' % snips)
              if masked != 1:
                  fails.append('message was not masked')
              # Idempotent: running twice must not double-mask or crash.
              s2, m2 = scrub(doc)
              if (s2, m2) != (0, 0):
                  fails.append('scrub() is not idempotent (%d,%d on second pass)' % (s2, m2))
              # A clean report must come through untouched.
              clean = {'runs': [{'results': [{'ruleId': 'X', 'message': {'text': 'unused import os'},
                                              'locations': [{'physicalLocation': {
                                                  'artifactLocation': {'uri': 'a.py'},
                                                  'region': {'startLine': 1}}}]}]}]}
              before = json.dumps(clean)
              scrub(clean)
              if json.dumps(clean) != before:
                  fails.append('a clean finding was altered')
              if fails:
                  print('SELF-TEST FAILED:')
                  for f in fails:
                      print('  - %s' % f)
                  return False
              print('self-test ok: credential masked, snippet/contextRegion/partialFingerprints removed, '
                    'file and line preserved, idempotent, clean findings untouched')
              return True


          def main():
              argv = [a for a in sys.argv[1:] if not a.startswith('-')]
              if '--self-test' in sys.argv:
                  return 0 if self_test() else 2
              if not self_test():
                  print('ABORTING -- a redactor that cannot prove it redacts is worse than none.')
                  return 2
              rc = 0
              for p in argv:
                  if not os.path.exists(p) or os.path.getsize(p) == 0:
                      print('  %s: absent or empty, nothing to redact' % p)
                      continue
                  try:
                      doc = json.load(io.open(p, encoding='utf-8', errors='replace'))
                  except (ValueError, IOError) as e:
                      # A SARIF that cannot be parsed cannot be redacted, and must NOT be uploaded on the
                      # assumption that it is probably fine. Emptying it loses nothing a reader could
                      # have used -- an unparseable report establishes nothing either way -- and it
                      # cannot leak what it was carrying.
                      print('::warning title=Unredactable SARIF::%s could not be parsed (%s); it is '
                            'replaced with an empty report rather than uploaded unexamined.'
                            % (p, type(e).__name__))
                      io.open(p, 'w', encoding='utf-8').write(
                          json.dumps({'version': '2.1.0', 'runs': [],
                                      '_redaction': 'ORIGINAL UNPARSEABLE - WITHHELD'}))
                      rc = 1
                      continue
                  snips, masked = scrub(doc)
                  json.dump(doc, io.open(p, 'w', encoding='utf-8'))
                  print('  %s: %d snippet/fingerprint field(s) removed, %d message(s) masked'
                        % (os.path.basename(p), snips, masked))
              return rc


          if __name__ == '__main__':
              sys.exit(main())

          REDACT_SARIF_PY
          shopt -s nullglob globstar
          files=( *.sarif **/*.sarif )
          if [ ${#files[@]} -eq 0 ]; then
            echo "no SARIF produced by this job -- nothing to redact"
          else
            python3 /tmp/redact_sarif.py "${files[@]}"
          fi
      # END REDACT_SARIF
      - name: Semgrep (C#) — keep SARIF as an artifact
        if: always() && steps.sarif_semgrep_csharp.outputs.exists == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: sarif-semgrep-csharp-${{ github.run_attempt }}
          path: dotnet-semgrep.sarif
          retention-days: 30
          if-no-files-found: warn
      - name: Semgrep (C#) — publish to the Security tab where available
        id: cs_semgrep_csharp
        if: always() && steps.sarif_semgrep_csharp.outputs.exists == 'true'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: dotnet-semgrep.sarif
          category: semgrep-csharp
      - name: Semgrep (C#) — state plainly if publication degraded
        if: always() && steps.sarif_semgrep_csharp.outputs.exists == 'true' && steps.cs_semgrep_csharp.outcome != 'success'
        run: |
          # Loud, never silent. An empty Security tab is indistinguishable from a clean
          # codebase, and that ambiguity is how a control becomes false assurance.
          echo "::warning title=Semgrep (C#): NOT published to the Security tab::Code scanning is"
          echo "unavailable here (free on public repos, otherwise GitHub Advanced Security)."
          echo "The scan SUCCEEDED and the gate still enforces on these findings."
          echo "Retrieve them from the 'sarif-semgrep-csharp' artifact."

      # BEGIN SCAN_STATUS — generated from scripts/scan_status.sh. DO NOT EDIT HERE.
      - name: Result summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          cat > /tmp/scan_status.sh <<'SCAN_STATUS_SH'
          #!/usr/bin/env bash
          # Short per-job result block. Runs at the end of every scanner job.
          #
          # WHY THIS EXISTS ALONGSIDE THE CONSOLIDATED REPORT
          #     The consolidated `report` job owns normalisation, cross-scanner dedupe, correlation,
          #     remediation detail and disposition, because those are only possible where every finding is
          #     visible at once. That is not a reason for a scanner job to stay silent.
          #
          #     Someone debugging Semgrep is IN the Semgrep job. Making them leave it to discover whether it
          #     found anything is how "the pipeline is noise" becomes true. So the scanner prints what it
          #     alone knows -- did it run, how many findings, was SARIF produced -- and points at the
          #     consolidated job for what it cannot know.
          #
          # DELIBERATELY NOT A SECOND COPY OF THE CONTRACT
          #     No severity interpretation, no remediation, no gate verdict, no disposition. Those live in
          #     exactly one place. A contract implemented twice drifts twice, and this kit has the scars:
          #     fourteen Azure gitleaks rules and a flawfinder fix both lost to a second copy.
          #
          # THE ZERO RULE APPLIES HERE TOO
          #     A job that did not run, or produced no parseable SARIF, prints NOT ESTABLISHED. It never
          #     prints 0. Zero says someone looked.
          #
          # USAGE   scan_status <name> <execution> <sarif-or-empty> [scope]
          scan_status() {
            _name="$1"; _exec="$2"; _sarif="${3:-}"; _scope="${4:-}"
            _out="${GITHUB_STEP_SUMMARY:-/dev/stdout}"

            _n="NOT ESTABLISHED"; _sar="NOT GENERATED"
            if [ -n "$_sarif" ] && [ -s "$_sarif" ]; then
              # suppression: FAILURE_ISOLATION_WITH_STATE_CAPTURE -- jq's failure IS the signal here, and
              # it is captured rather than swallowed: a non-zero exit takes the else branch and reports
              # INVALID plus "count unavailable from current parser". stderr is silenced because the parse
              # error text is not useful in a summary block; the STATE survives and is published. If this
              # fails in a way other than "not valid SARIF" -- jq missing, file unreadable -- the result is
              # the same and is still not a clean zero, which is the outcome that matters.
              if _c=$(jq '[.runs[].results[]] | length' "$_sarif" 2>/dev/null); then
                _sar="GENERATED"
                # Only a scanner that actually completed may report a count. A crashed run that happens to
                # have left a partial report behind must not publish a number from it.
                case "$_exec" in
                  COMPLETE) _n="$_c" ;;
                  *)        _n="NOT ESTABLISHED" ;;
                esac
              else
                # A file that is not valid SARIF is a collection failure wearing a report's clothes.
                _sar="INVALID"
                _n="PRESENT -- count unavailable from current parser"
              fi
            fi

            {
              printf '### %s\n\n' "$_name"
              printf '| | |\n|---|---|\n'
              printf '| Execution | %s |\n' "$_exec"
              [ -n "$_scope" ] && printf '| Scope | %s |\n' "$_scope"
              printf '| Findings | %s |\n' "$_n"
              printf '| SARIF | %s |\n' "$_sar"
              printf '\n'
              if [ "$_n" = "NOT ESTABLISHED" ]; then
                printf 'This is not zero. Nothing usable was collected for this scope in this run.\n\n'
              fi
              printf 'Severity breakdown, remediation, gate impact and disposition are in the\n'
              printf '**Security scan report** job, which sees every scanner at once and can tell\n'
              printf 'when two tools are describing the same condition.\n\n'
            } >> "$_out"

            printf '%s: execution=%s findings=%s sarif=%s\n' "$_name" "$_exec" "$_n" "$_sar"
          }

          SCAN_STATUS_SH
          . /tmp/scan_status.sh
          if [ "$JOB_STATUS" = "success" ]; then _e=COMPLETE; else _e=FAILED; fi
          scan_status "SAST (.NET)" "$_e" "" "dotnet"
      # END SCAN_STATUS

  sast-java:
    needs: [discover]
    # DISCOVERED, NOT DECLARED. Runs because roots for this ecosystem were actually
    # found in the caller's scope -- not because a selector named it. On failure
    # discovery turns everything on rather than producing a tidy row of NOT_APPLICABLE.
    if: needs.discover.outputs.java == 'true'
    name: SAST (Java)
    runs-on: ubuntu-latest
    # Bounded so a stalled dependency cannot bill six hours (LM-001: unbounded execution
    # converts a dependency failure into uncontrolled cost).
    # NOT YET: a timeout still surfaces as a plain job failure. It SHOULD classify as
    # UNAVAILABLE / EXECUTION_TIMEOUT — cost is bounded here, semantics are not. See
    # docs/roadmap/FUTURE_WORK.md. Do not let this comment imply the mapping exists.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
      # Findings must survive whether or not this repo has code scanning. Uploading to the
      # Security tab is a PUBLICATION channel, not the finding itself — free on public repos,
      # otherwise Advanced Security. Treating it as mandatory turned successful scans into
      # failed jobs on every private repo without GHAS.
      - name: Semgrep (Java)
        id: java_semgrep
        run: |
          set -uo pipefail
          # THIS JOB RAN NO SCANNER AT ALL. checkout, setup-java, then upload a SARIF that
          # nothing generated. It has reported success on every run while analysing nothing —
          # the purest form of the illusion this kit exists to prevent, inside the kit itself.
          scope="${{ inputs.paths }}"; [ -d "$scope" ] || scope="."
          # "NONE FOUND" AND "COULD NOT LOOK" ARE DIFFERENT ANSWERS. A find that ERRORS produces
          # empty output, which read as "this language is not here", which skipped the job, which
          # reported green over code nobody scanned. Same defect discovery had; same fix.
          # suppression: PRESENTATION_ONLY -- find's stderr is noise on unreadable subtrees; the EXIT
          # STATUS is checked on the next line and a failure raises COLLECTION_FAILED rather than reading
          # as 'nothing found'.
          # discards: find's stderr, which is noise on unreadable or permission-denied subtrees
          # preserved_by: the EXIT STATUS is captured on the next line and a non-zero rc raises
          # preserved_by: COLLECTION_FAILED, so 'could not look' never reads as 'found nothing'
          if ! _hits=$(find "$scope" -name '*.java' 2>/dev/null); then
            echo "::error title=COLLECTION_FAILED::Applicability survey failed; cannot establish scope."
            echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ -z "$_hits" ]; then
            echo "::notice title=No Java sources::None under '$scope'. Skipping."
            exit 0
          fi
          python3 -m pip install --quiet semgrep
          # SEMGREP SKIPS test/ and fixture/ DIRECTORIES BY DEFAULT.
          # That default is why every semgrep job reported success with zero findings while
          # bandit — which has no such default — found the seeded flaw in the same tree. Any
          # consumer whose code sits under a path matching semgrep's built-in ignore list gets
          # a silent, confident, empty result. Writing our own .semgrepignore replaces the
          # default entirely; the caller's scope decides what is scanned, not semgrep's guess.
          printf 'node_modules/\n.git/\n' > .semgrepignore
          # Continuation-then-comment defect -- see the note at the C# scanner. The flags and
          # "$scope" were being discarded, so this ran unscoped and produced no report.
          #
          # suppression: EXPECTED_NEGATIVE_RESULT -- this scanner exits nonzero when it FINDS something,
          # which is not an error. Detection is separated from enforcement here; the count step downstream
          # distinguishes 'found nothing' from 'produced no report' and emits COLLECTION_FAILED for the
          # latter.
          # discards: this scanner's non-zero exit, which means FINDINGS rather than malfunction
          # preserved_by: the count step distinguishes an absent report from an empty one and emits
          # preserved_by: COLLECTION_FAILED for the former; the enforce step refuses an absent count
          semgrep scan --config p/java --config p/security-audit \
            --sarif --output java-semgrep.sarif --metrics=off "$scope" || true
          # A PARSE FAILURE IS NOT ZERO FINDINGS.
          #
          # This was `jq ... 2>/dev/null || echo 0`, so a missing, truncated or malformed report
          # produced n=0 -- which the gate reads as CLEAN. The taxonomy already had a word for
          # exactly this (COLLECTION_FAILED: "an empty but well-formed result is indistinguishable
          # from a clean scan") while the code did the opposite. Found by auditing the class after
          # the same defect turned up in discovery, not by reading this line.
          if [ ! -s java-semgrep.sarif ]; then
            echo "::error title=COLLECTION_FAILED::java-semgrep.sarif was not produced."
            echo "An ABSENT report is not zero findings. Posture cannot be established from this run."
            echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if ! n=$(jq '[.runs[].results[]] | length' java-semgrep.sarif 2>&1); then
            echo "::error title=COLLECTION_FAILED::java-semgrep.sarif is not valid SARIF."
            echo "jq said: $n"
            echo "A PARSE FAILURE is not zero findings."
            echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "Java SAST findings: $n"

      - name: Semgrep (Java) — enforce
        if: always()
        run: |
          n='${{ steps.java_semgrep.outputs.count }}'
          # COLLECTION_FAILED IS NOT ZERO FINDINGS -- AND THIS STEP RUNS ON always().
          #
          # The counting step above correctly refuses to turn a missing or malformed report
          # into n=0, and exits non-zero. But `if: always()` means THIS step still runs, reads
          # an output that was never written, and ${n:-0} quietly supplies the very zero the
          # step above refused to invent -- announcing GATE=PASS one line after the failure was
          # detected. Each side assumed the other had handled it. Check explicitly.
          collection='${{ steps.java_semgrep.outputs.collection }}'
          if [ "$collection" = "COLLECTION_FAILED" ]; then
            echo "::error title=COLLECTION_FAILED::Evidence could not be collected."
            echo "Posture CANNOT be established from this run. This is not a clean result."
            exit 1
          fi
          if [ -z "${n:-}" ]; then
            echo "::error title=COLLECTION_FAILED::No count was produced by the scan step."
            echo "An ABSENT measurement is not a measurement of zero."
            exit 1
          fi
          if [ "${n:-0}" -gt 0 ] && [ "${{ inputs.soft_fail_sast }}" != "true" ] && [ "${{ inputs.advisory_mode }}" != "true" ]; then
            echo "::error title=Semgrep (Java)::${n} finding(s). ANALYSIS=COMPLETE GATE=FAIL"; exit 1
          fi
          echo "ANALYSIS=COMPLETE GATE=PASS (${n:-0} finding(s))"

      - name: Semgrep (Java) — is there anything to publish?
        if: always()
        id: sarif_semgrep_java
        run: |
          # No SARIF usually means no applicable source (gosec on a repo with no Go). That is
          # a legitimate outcome, not a failure, and previously crashed the upload step.
          if [ -s "java-semgrep.sarif" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Semgrep (Java): nothing to publish::No SARIF at 'java-semgrep.sarif' — no applicable source files. Not a failure."
          fi
      # BEGIN REDACT_SARIF — generated from scripts/redact_sarif.py. DO NOT EDIT HERE.
      - name: Redact credential material before upload
        if: always()
        shell: bash
        run: |
          cat > /tmp/redact_sarif.py <<'REDACT_SARIF_PY'
          #!/usr/bin/env python3
          """Strip credential material from a SARIF file IN PLACE, before it becomes an artifact.

          WHY THIS EXISTS
              The kit redacted exactly one scanner. gitleaks ran with --redact and had `snippet` and
              `partialFingerprints` stripped before upload. Thirteen other jobs uploaded raw SARIF, and
              several of those scanners embed matched source by design:

                  bandit    B105 hardcoded_password_string -- the snippet IS the password
                  semgrep   snippet carries the matched source line
                  trivy     secret mode reports the match
                  checkov   includes the offending code block
                  gosec     includes the offending line

              An artifact is downloadable by anyone with repository read access and is retained for
              weeks. Redacting the rendered summary while shipping the raw value in a downloadable file
              is theatre -- it moves the credential from a page someone reads to a file someone opens.

              The consolidated report job made it worse by copying every SARIF into one artifact.

          WHAT SURVIVES, WHICH IS EVERYTHING NEEDED TO FIX THE FINDING
              rule id, severity, FILE, LINE, message with credential-shaped substrings masked to a short
              prefix. What is removed: `snippet`, `contextRegion.snippet`, and `partialFingerprints`
              (which for a secret scanner can be a hash of the secret itself).

          IT IS NOT A SUBSTITUTE FOR --redact AT THE SCANNER
              Defence in depth. A scanner that can be told not to emit the value should be told. This
              catches the ones that cannot, and the ones a consumer adds later.

          USAGE
              python3 redact_sarif.py <file.sarif> [more.sarif ...]
              python3 redact_sarif.py --self-test

          EXIT
              0 rewritten (or nothing to do)      1 a file was unreadable      2 self-test failed
          """
          import io
          import json
          import os
          import re
          import sys

          # BEGIN SECRET_PATTERNS -- must stay identical to scripts/scan_report.py.
          # Two copies exist because each file is inlined into the workflow separately and neither can
          # import the other at consumer runtime. tests/check_redaction_parity.py fails the build if they
          # diverge, so the duplication is an enforced invariant rather than a hope -- the same treatment
          # the SARIF normalizer gets for the same reason.
          SECRET_PATTERNS = [
              (re.compile(r'-----BEGIN[A-Z ]*PRIVATE KEY-----'), 'private-key'),
              (re.compile(r'\bAKIA[0-9A-Z]{16}\b'), 'aws-access-key-id'),
              (re.compile(r'\bgh[pousr]_[A-Za-z0-9]{16,}'), 'github-token'),
              (re.compile(r'\bxox[baprs]-[A-Za-z0-9-]{10,}'), 'slack-token'),
              (re.compile(r'\beyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}'), 'jwt'),
              (re.compile(r'\b[A-Za-z0-9~._-]{3}8Q~[A-Za-z0-9~._-]{31,34}\b'), 'entra-client-secret'),
              (re.compile(r'(?i)\b(?:AccountKey|SharedAccessKey|password|pwd|secret|token|api[_-]?key)'
                          r'\s*[:=]\s*["\']?([^\s;,"\'&]{8,})'), 'keyed-value'),
              (re.compile(r'\b[A-Za-z0-9+/]{32,}={0,2}(?![A-Za-z0-9+/=])'), 'high-entropy'),
              (re.compile(r'\b[0-9a-fA-F]{32,}\b'), 'hex-or-digest'),
          ]


          def _mask(value, label):
              keep = value[:4]
              return '%s%s [redacted: %s, %d chars]' % (keep, '*' * min(len(value) - len(keep), 18),
                                                        label, len(value))


          REDACTED_MARK = '[redacted: '


          def redact(text):
              """Mask anything that looks like credential material. Returns the safe string.

              IDEMPOTENT, which is not free. Masking `password: AKIAIOSFODNN7EXAMPLE` produces
              `password: AKIA**************** [redacted: ...]`, and that output STILL matches the
              keyed-value pattern -- so a second pass masked the mask, and a third masked that. It
              matters because a SARIF can legitimately be redacted twice: once in the scanner job before
              upload, once in the consolidated report after download. Non-idempotent redaction would
              corrupt the text on the second pass and make the finding unreadable.
              """
              if not text:
                  return text
              out = text
              for pat, label in SECRET_PATTERNS:
                  def _sub(m, _l=label):
                      whole = m.group(0)
                      v = m.group(1) if m.groups() and m.group(1) else whole
                      if len(v) < 8 or REDACTED_MARK in whole or '****' in v:
                          return whole
                      return whole.replace(v, _mask(v, _l))
                  out = pat.sub(_sub, out)
              return out
          # END SECRET_PATTERNS


          def scrub(doc):
              """-> (snippets_removed, messages_masked). Mutates doc."""
              snips = masked = 0
              for run in (doc.get('runs') or []):
                  for res in (run.get('results') or []):
                      msg = ((res.get('message') or {}).get('text'))
                      if msg:
                          r = redact(msg)
                          if r != msg:
                              res['message']['text'] = r
                              masked += 1
                      for loc in (res.get('locations') or []) + (res.get('relatedLocations') or []):
                          pl = (loc.get('physicalLocation') or {})
                          for key in ('region', 'contextRegion'):
                              reg = pl.get(key) or {}
                              if 'snippet' in reg:
                                  reg.pop('snippet', None)
                                  snips += 1
                      # A partial fingerprint from a secret scanner can be a hash OF THE SECRET, which is
                      # an offline-guessable artifact for anything low-entropy. It buys correlation that
                      # this kit gets from file+rule instead.
                      if res.pop('partialFingerprints', None) is not None:
                          snips += 1
                      for cf in (res.get('codeFlows') or []):
                          for tf in (cf.get('threadFlows') or []):
                              for lo in (tf.get('locations') or []):
                                  pl = ((lo.get('location') or {}).get('physicalLocation') or {})
                                  for key in ('region', 'contextRegion'):
                                      reg = pl.get(key) or {}
                                      if 'snippet' in reg:
                                          reg.pop('snippet', None)
                                          snips += 1
              return (snips, masked)


          def self_test():
              fails = []
              doc = {'version': '2.1.0', 'runs': [{'tool': {'driver': {'name': 'bandit'}}, 'results': [
                  {'ruleId': 'B105', 'level': 'error',
                   'message': {'text': 'Possible hardcoded password: AKIAIOSFODNN7EXAMPLE'},
                   'partialFingerprints': {'x': 'deadbeef'},
                   'locations': [{'physicalLocation': {
                       'artifactLocation': {'uri': 'app/config.py'},
                       'region': {'startLine': 12,
                                  'snippet': {'text': 'PASSWORD = "AKIAIOSFODNN7EXAMPLE"'}},
                       'contextRegion': {'snippet': {'text': 'ctx AKIAIOSFODNN7EXAMPLE'}}}}]}]}]}
              snips, masked = scrub(doc)
              blob = json.dumps(doc)
              if 'AKIAIOSFODNN7EXAMPLE' in blob:
                  fails.append('a credential survived scrub()')
              if 'app/config.py' not in blob or '12' not in blob:
                  fails.append('scrub() destroyed the file/line needed to fix it')
              if 'AKIA' not in blob:
                  fails.append('scrub() removed the prefix identifying WHICH credential')
              if snips < 3:
                  fails.append('snippet/contextRegion/partialFingerprints not all removed (%d)' % snips)
              if masked != 1:
                  fails.append('message was not masked')
              # Idempotent: running twice must not double-mask or crash.
              s2, m2 = scrub(doc)
              if (s2, m2) != (0, 0):
                  fails.append('scrub() is not idempotent (%d,%d on second pass)' % (s2, m2))
              # A clean report must come through untouched.
              clean = {'runs': [{'results': [{'ruleId': 'X', 'message': {'text': 'unused import os'},
                                              'locations': [{'physicalLocation': {
                                                  'artifactLocation': {'uri': 'a.py'},
                                                  'region': {'startLine': 1}}}]}]}]}
              before = json.dumps(clean)
              scrub(clean)
              if json.dumps(clean) != before:
                  fails.append('a clean finding was altered')
              if fails:
                  print('SELF-TEST FAILED:')
                  for f in fails:
                      print('  - %s' % f)
                  return False
              print('self-test ok: credential masked, snippet/contextRegion/partialFingerprints removed, '
                    'file and line preserved, idempotent, clean findings untouched')
              return True


          def main():
              argv = [a for a in sys.argv[1:] if not a.startswith('-')]
              if '--self-test' in sys.argv:
                  return 0 if self_test() else 2
              if not self_test():
                  print('ABORTING -- a redactor that cannot prove it redacts is worse than none.')
                  return 2
              rc = 0
              for p in argv:
                  if not os.path.exists(p) or os.path.getsize(p) == 0:
                      print('  %s: absent or empty, nothing to redact' % p)
                      continue
                  try:
                      doc = json.load(io.open(p, encoding='utf-8', errors='replace'))
                  except (ValueError, IOError) as e:
                      # A SARIF that cannot be parsed cannot be redacted, and must NOT be uploaded on the
                      # assumption that it is probably fine. Emptying it loses nothing a reader could
                      # have used -- an unparseable report establishes nothing either way -- and it
                      # cannot leak what it was carrying.
                      print('::warning title=Unredactable SARIF::%s could not be parsed (%s); it is '
                            'replaced with an empty report rather than uploaded unexamined.'
                            % (p, type(e).__name__))
                      io.open(p, 'w', encoding='utf-8').write(
                          json.dumps({'version': '2.1.0', 'runs': [],
                                      '_redaction': 'ORIGINAL UNPARSEABLE - WITHHELD'}))
                      rc = 1
                      continue
                  snips, masked = scrub(doc)
                  json.dump(doc, io.open(p, 'w', encoding='utf-8'))
                  print('  %s: %d snippet/fingerprint field(s) removed, %d message(s) masked'
                        % (os.path.basename(p), snips, masked))
              return rc


          if __name__ == '__main__':
              sys.exit(main())

          REDACT_SARIF_PY
          shopt -s nullglob globstar
          files=( *.sarif **/*.sarif )
          if [ ${#files[@]} -eq 0 ]; then
            echo "no SARIF produced by this job -- nothing to redact"
          else
            python3 /tmp/redact_sarif.py "${files[@]}"
          fi
      # END REDACT_SARIF
      - name: Semgrep (Java) — keep SARIF as an artifact
        if: always() && steps.sarif_semgrep_java.outputs.exists == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: sarif-semgrep-java-${{ github.run_attempt }}
          path: java-semgrep.sarif
          retention-days: 30
          if-no-files-found: warn
      - name: Semgrep (Java) — publish to the Security tab where available
        id: cs_semgrep_java
        if: always() && steps.sarif_semgrep_java.outputs.exists == 'true'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: java-semgrep.sarif
          category: semgrep-java
      - name: Semgrep (Java) — state plainly if publication degraded
        if: always() && steps.sarif_semgrep_java.outputs.exists == 'true' && steps.cs_semgrep_java.outcome != 'success'
        run: |
          # Loud, never silent. An empty Security tab is indistinguishable from a clean
          # codebase, and that ambiguity is how a control becomes false assurance.
          echo "::warning title=Semgrep (Java): NOT published to the Security tab::Code scanning is"
          echo "unavailable here (free on public repos, otherwise GitHub Advanced Security)."
          echo "The scan SUCCEEDED and the gate still enforces on these findings."
          echo "Retrieve them from the 'sarif-semgrep-java' artifact."

      # BEGIN SCAN_STATUS — generated from scripts/scan_status.sh. DO NOT EDIT HERE.
      - name: Result summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          cat > /tmp/scan_status.sh <<'SCAN_STATUS_SH'
          #!/usr/bin/env bash
          # Short per-job result block. Runs at the end of every scanner job.
          #
          # WHY THIS EXISTS ALONGSIDE THE CONSOLIDATED REPORT
          #     The consolidated `report` job owns normalisation, cross-scanner dedupe, correlation,
          #     remediation detail and disposition, because those are only possible where every finding is
          #     visible at once. That is not a reason for a scanner job to stay silent.
          #
          #     Someone debugging Semgrep is IN the Semgrep job. Making them leave it to discover whether it
          #     found anything is how "the pipeline is noise" becomes true. So the scanner prints what it
          #     alone knows -- did it run, how many findings, was SARIF produced -- and points at the
          #     consolidated job for what it cannot know.
          #
          # DELIBERATELY NOT A SECOND COPY OF THE CONTRACT
          #     No severity interpretation, no remediation, no gate verdict, no disposition. Those live in
          #     exactly one place. A contract implemented twice drifts twice, and this kit has the scars:
          #     fourteen Azure gitleaks rules and a flawfinder fix both lost to a second copy.
          #
          # THE ZERO RULE APPLIES HERE TOO
          #     A job that did not run, or produced no parseable SARIF, prints NOT ESTABLISHED. It never
          #     prints 0. Zero says someone looked.
          #
          # USAGE   scan_status <name> <execution> <sarif-or-empty> [scope]
          scan_status() {
            _name="$1"; _exec="$2"; _sarif="${3:-}"; _scope="${4:-}"
            _out="${GITHUB_STEP_SUMMARY:-/dev/stdout}"

            _n="NOT ESTABLISHED"; _sar="NOT GENERATED"
            if [ -n "$_sarif" ] && [ -s "$_sarif" ]; then
              # suppression: FAILURE_ISOLATION_WITH_STATE_CAPTURE -- jq's failure IS the signal here, and
              # it is captured rather than swallowed: a non-zero exit takes the else branch and reports
              # INVALID plus "count unavailable from current parser". stderr is silenced because the parse
              # error text is not useful in a summary block; the STATE survives and is published. If this
              # fails in a way other than "not valid SARIF" -- jq missing, file unreadable -- the result is
              # the same and is still not a clean zero, which is the outcome that matters.
              if _c=$(jq '[.runs[].results[]] | length' "$_sarif" 2>/dev/null); then
                _sar="GENERATED"
                # Only a scanner that actually completed may report a count. A crashed run that happens to
                # have left a partial report behind must not publish a number from it.
                case "$_exec" in
                  COMPLETE) _n="$_c" ;;
                  *)        _n="NOT ESTABLISHED" ;;
                esac
              else
                # A file that is not valid SARIF is a collection failure wearing a report's clothes.
                _sar="INVALID"
                _n="PRESENT -- count unavailable from current parser"
              fi
            fi

            {
              printf '### %s\n\n' "$_name"
              printf '| | |\n|---|---|\n'
              printf '| Execution | %s |\n' "$_exec"
              [ -n "$_scope" ] && printf '| Scope | %s |\n' "$_scope"
              printf '| Findings | %s |\n' "$_n"
              printf '| SARIF | %s |\n' "$_sar"
              printf '\n'
              if [ "$_n" = "NOT ESTABLISHED" ]; then
                printf 'This is not zero. Nothing usable was collected for this scope in this run.\n\n'
              fi
              printf 'Severity breakdown, remediation, gate impact and disposition are in the\n'
              printf '**Security scan report** job, which sees every scanner at once and can tell\n'
              printf 'when two tools are describing the same condition.\n\n'
            } >> "$_out"

            printf '%s: execution=%s findings=%s sarif=%s\n' "$_name" "$_exec" "$_n" "$_sar"
          }

          SCAN_STATUS_SH
          . /tmp/scan_status.sh
          if [ "$JOB_STATUS" = "success" ]; then _e=COMPLETE; else _e=FAILED; fi
          scan_status "SAST (Java)" "$_e" "" "java / kotlin"
      # END SCAN_STATUS

  sast-go:
    needs: [discover]
    # DISCOVERED, NOT DECLARED. Runs because roots for this ecosystem were actually
    # found in the caller's scope -- not because a selector named it. On failure
    # discovery turns everything on rather than producing a tidy row of NOT_APPLICABLE.
    if: needs.discover.outputs.go == 'true'
    name: SAST (Go)
    runs-on: ubuntu-latest
    # Bounded so a stalled dependency cannot bill six hours (LM-001: unbounded execution
    # converts a dependency failure into uncontrolled cost).
    # NOT YET: a timeout still surfaces as a plain job failure. It SHOULD classify as
    # UNAVAILABLE / EXECUTION_TIMEOUT — cost is bounded here, semantics are not. See
    # docs/roadmap/FUTURE_WORK.md. Do not let this comment imply the mapping exists.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ inputs.go_version }}
      - name: gosec
        id: gosec
        run: |
          set -uo pipefail
          # NEVER ASSUME go.mod IS AT THE REPOSITORY ROOT. setup-go's cache looked only at the
          # root and failed the job outright on a nested module. gosec then ran ./... from the
          # root, ignoring `paths` entirely.
          scope="${{ inputs.paths }}"; [ -d "$scope" ] || scope="."
          # A repository can contain several Go modules. Scanning only the first is coverage
          # that stops wherever the sort order happens to land, while still reporting success.
          find "$scope" -maxdepth 6 -name go.mod -not -path '*/vendor/*' | sort > .go-mods.txt
          n=$(wc -l < .go-mods.txt)
          if [ "$n" -eq 0 ]; then
            echo "::notice title=No Go module::No go.mod under '$scope'."
            echo "COVERAGE=NOT_APPLICABLE — absence of a language is reported, never inferred."
            exit 0
          fi
          echo "Go modules discovered: $n"

          # ACQUISITION FAILURE IS NOT ZERO FINDINGS.
          #
          # This step pinned securego/gosec:2.28.0 -- A TAG THAT HAS NEVER EXISTED. Upstream stops
          # at 2.24.x. Every `docker run` failed at manifest lookup, `|| true` swallowed it, and
          # "the scanner could not be acquired" was recorded as "the scanner found nothing." The
          # job went green with no SARIF while a seeded G401/G204 fixture sat unscanned.
          #
          # The bitter part: that pin was introduced BY a staleness fix. Reaching forward for a
          # current version landed on a version that does not exist, and nothing checked, because
          # acquisition had no failure path -- only execution did. The kit already names this state
          # DEPENDENCY_ACQUISITION_UNAVAILABLE and enforces it for cppcheck; gosec was exempt by
          # omission, which is how exemptions usually happen.
          #
          # Acquire ONCE, before the loop, and let the failure land somewhere.
          GOSEC_IMAGE='securego/gosec:2.24.6'
          if ! docker image inspect "$GOSEC_IMAGE" >/dev/null 2>&1; then
            if ! timeout 300 docker pull -q "$GOSEC_IMAGE"; then
              echo "::error title=DEPENDENCY_ACQUISITION_UNAVAILABLE::Could not acquire $GOSEC_IMAGE."
              echo "The scanner was never obtained, so nothing was analysed. This is NOT zero findings,"
              echo "and posture for Go cannot be established from this run."
              echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          fi
          echo "gosec image acquired: $GOSEC_IMAGE"
          echo "### Go modules scanned ($n)" >> "$GITHUB_STEP_SUMMARY"
          # `go install gosec@latest` couples the SCANNER to the CONSUMER's Go version:
          # gosec now requires Go >= 1.25.8, this kit defaults go_version 1.22, and the install
          # failed outright. Nobody should have to upgrade their toolchain to run a security
          # scanner. Run it from its own container, pinned, exactly as gitleaks is handled.
          # -no-fail keeps DETECTION separate from ENFORCEMENT; the gate decides below.
          while read -r mod; do
            dir=$(dirname "$mod")
            echo "::group::gosec $dir"
            echo "- \`$dir\`" >> "$GITHUB_STEP_SUMMARY"
            # KEEP CURRENT. This was pinned at 2.21.4 -- seven minor versions behind upstream
            # when audited 2026-08-19. A stale scanner is not a neutral choice: it silently
            # stops detecting whatever was added since. This kit already learned the
            # expensive version of that lesson, when a three-major drift in Dependency-Check
            # meant calling a retired NVD endpoint. Nothing here checks drift yet.
            # Continuation-then-comment defect -- see the note at the C# scanner. `docker run`
            # was executing with NO gosec arguments at all: no -fmt, no -out, no ./... . The
            # container started, did nothing useful, wrote no SARIF, and exited 0. This is the
            # defect the seeded `sast:go-gosec` signal caught as WRONG-TOOL on 2026-09-02.
            #
            # suppression: EXPECTED_NEGATIVE_RESULT -- this scanner exits nonzero when it FINDS something,
            # which is not an error. Detection is separated from enforcement here; the count step downstream
            # distinguishes 'found nothing' from 'produced no report' and emits COLLECTION_FAILED for the
            # latter.
            # discards: this scanner's non-zero exit, which means FINDINGS rather than malfunction
            # preserved_by: the count step distinguishes an absent report from an empty one and emits
            # preserved_by: COLLECTION_FAILED for the former; the enforce step refuses an absent count
            docker run --rm -v "$PWD/$dir":/src -w /src "$GOSEC_IMAGE" \
              -no-fail -fmt sarif -out /src/gosec.sarif ./... || true
            # gosec's working directory is the MODULE, so every URI it emits is module-relative:
            # `go/vuln.go` and `services/worker/vuln.go` both arrive as `vuln.go`. Two different
            # files then share one identity, which breaks annotation, finding history, and any
            # later correlation — two modules would merge as one finding. Re-root HERE, while
            # $dir is still known: the merged filename cannot carry it back, because `/` -> `_`
            # is lossy. A scanner that reports the wrong path is a scanner you cannot act on.
            # INLINE ON PURPOSE. A reusable workflow runs against the CALLER's checkout, so a
            # helper under scripts/ does not exist at consumer runtime — the same way the Azure
            # gitleaks rules silently never loaded. Referencing the kit's own repo to fetch it
            # would hardcode an owner, which is its own portability defect.
            if [ -f "$dir/gosec.sarif" ]; then
              out="gosec-$(echo "$dir" | tr '/' '_').sarif"
              # One canonical normalizer, written to disk then invoked. The block below is
              # GENERATED -- self-test fails if it drifts from scripts/normalize_sarif.py.
          # BEGIN NORMALIZE_SARIF — generated from scripts/normalize_sarif.py. DO NOT EDIT HERE.
          cat > /tmp/normalize_sarif.py <<'NORMALIZE_PY'
          #!/usr/bin/env python3
          """CANONICAL SARIF path normalizer. Re-root scanner paths onto the repository.

          THIS FILE IS THE SINGLE SOURCE OF TRUTH.

          It is INLINED into the reusable workflows rather than called as `uses: ./...`, because a reusable
          workflow resolves local paths against the CALLER's checkout — so anything under `scripts/` simply
          does not exist at consumer runtime. That is the same failure that left 14 Azure gitleaks rules
          silently unloaded for every consumer while the kit's own CI stayed green.

          Inlining three copies would reintroduce drift, which is the defect family this kit exists to catch
          (a fix applied to the probe and not the workflow; a tag bumped in one place and not another). So the
          copies are CHECKED: `self-test` asserts every inlined block is byte-identical to this file. Drift
          becomes a build failure instead of a silent divergence.

          WHY NORMALIZATION IS NEEDED AT ALL
          ----------------------------------
          A scanner invoked with a subdirectory as its working directory reports URIs relative to THAT
          directory, not the repository:

            gosec  runs per Go module   -> `go/vuln.go` and `services/worker/vuln.go` BOTH arrive as `vuln.go`
            Trivy  roots at the scan scope -> `infra/main.tf` where Checkov reports the full repo-relative path

          Two files acquire one identity, or one file acquires two. Everything downstream inherits it:
          annotations point at paths that do not exist, finding history cannot separate components across
          runs, one scanner silently "covers for" another in a tool-pinned assertion, and correlation later
          merges findings from different components as though they were the same finding.

          The component root CANNOT be recovered afterwards — merged filenames use `tr '/' '_'`, which is
          lossy. So normalization happens at the POINT OF CAPTURE, while the root is still known.

          INVARIANT: normalize only after source identity is bound. Never merge first and reconstruct
          provenance later.

          USAGE
              python3 normalize_sarif.py <src.sarif> <dst.sarif> <prefix>

          `<prefix>` is the component root relative to the repository. `.` or empty is a no-op, so callers
          need no special case for a root-level project. Idempotent: a URI already carrying the prefix is left
          alone, so re-running cannot double-root.

          Reads SRC and writes DST — never rewrites in place. Containerized scanners produce ROOT-OWNED files;
          opening one for writing fails with EACCES, which turned a misreported finding into an absent one.
          """

          import io
          import json
          import sys


          def reroot(uri, prefix):
              if not uri or not isinstance(uri, str):
                  return uri
              u = uri.replace("\\", "/")
              if u.startswith("file://"):
                  u = u[7:]
              while u.startswith("./"):
                  u = u[2:]
              # An absolute path inside a CONTAINER says nothing about the repository.
              if u.startswith("/src/"):
                  u = u[5:]
              u = u.lstrip("/")
              if prefix in ("", "."):
                  return u
              if u == prefix or u.startswith(prefix + "/"):
                  return u          # idempotent: never double-root
              return prefix + "/" + u


          def fix_locs(locs, prefix):
              for loc in locs or []:
                  if not isinstance(loc, dict):
                      continue
                  phys = loc.get("physicalLocation")
                  if isinstance(phys, dict):
                      art = phys.get("artifactLocation")
                      if isinstance(art, dict) and "uri" in art:
                          art["uri"] = reroot(art["uri"], prefix)


          def normalize(doc, prefix):
              for run in doc.get("runs", []) or []:
                  for art in run.get("artifacts", []) or []:      # what viewers resolve against
                      al = (art or {}).get("location")
                      if isinstance(al, dict) and "uri" in al:
                          al["uri"] = reroot(al["uri"], prefix)
                  for res in run.get("results", []) or []:
                      fix_locs(res.get("locations"), prefix)
                      fix_locs(res.get("relatedLocations"), prefix)
                      at = res.get("analysisTarget")
                      if isinstance(at, dict) and "uri" in at:
                          at["uri"] = reroot(at["uri"], prefix)
                      # A partially re-rooted code flow is worse than none — it still looks authoritative.
                      for flow in res.get("codeFlows", []) or []:
                          for tf in (flow or {}).get("threadFlows", []) or []:
                              for step in (tf or {}).get("locations", []) or []:
                                  if isinstance(step, dict):
                                      fix_locs([step.get("location")], prefix)
              return doc


          def main(argv):
              if len(argv) != 4:
                  print("usage: normalize_sarif.py <src> <dst> <prefix>", file=sys.stderr)
                  return 2
              src, dst = argv[1], argv[2]
              prefix = argv[3].replace("\\", "/").strip("/")
              doc = json.load(io.open(src, encoding="utf-8"))
              json.dump(normalize(doc, prefix), io.open(dst, "w", encoding="utf-8"))
              n = sum(len(r.get("results", []) or []) for r in doc.get("runs", []) or [])
              print("normalize_sarif: %s -> %s rooted at '%s' (%d result(s))" % (src, dst, prefix or ".", n))
              return 0


          if __name__ == "__main__":
              sys.exit(main(sys.argv))

          NORMALIZE_PY
          # END NORMALIZE_SARIF
              python3 /tmp/normalize_sarif.py "$dir/gosec.sarif" "$out" "$dir"
              # suppression: EXPECTED_NEGATIVE_RESULT -- this scanner exits nonzero when it FINDS something,
              # which is not an error. Detection is separated from enforcement here; the count step downstream
              # distinguishes 'found nothing' from 'produced no report' and emits COLLECTION_FAILED for the
              # latter.
              # discards: this scanner's non-zero exit, which means FINDINGS rather than malfunction
              # preserved_by: the count step distinguishes an absent report from an empty one and emits
              # preserved_by: COLLECTION_FAILED for the former; the enforce step refuses an absent count
              rm -f "$dir/gosec.sarif" || true   # root-owned; rm needs the dir, not the file
            fi
            echo "::endgroup::"
          done < .go-mods.txt

          # Merge every module's SARIF into one report. Merging RUNS preserves each module's
          # provenance — findings are never collapsed together, which matters for correlation.
          python3 - <<'MERGE_PY'
          import glob, json
          runs = []
          for f in sorted(glob.glob("gosec-*.sarif")):
              try:
                  runs += json.load(open(f, encoding="utf-8")).get("runs", [])
              except Exception as e:
                  print(f"  !! {f}: {e}")
          if runs:
              json.dump({"version": "2.1.0",
                         "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
                         "runs": runs},
                        open("gosec.sarif", "w", encoding="utf-8"))
              print(f"merged {len(runs)} gosec run(s) into gosec.sarif")
          MERGE_PY
          # A PARSE FAILURE IS NOT ZERO FINDINGS.
          #
          # This was `jq ... 2>/dev/null || echo 0`, so a missing, truncated or malformed report
          # produced n=0 -- which the gate reads as CLEAN. The taxonomy already had a word for
          # exactly this (COLLECTION_FAILED: "an empty but well-formed result is indistinguishable
          # from a clean scan") while the code did the opposite. Found by auditing the class after
          # the same defect turned up in discovery, not by reading this line.
          if [ ! -s gosec.sarif ]; then
            echo "::error title=COLLECTION_FAILED::gosec.sarif was not produced."
            echo "An ABSENT report is not zero findings. Posture cannot be established from this run."
            echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if ! n=$(jq '[.runs[].results[]] | length' gosec.sarif 2>&1); then
            echo "::error title=COLLECTION_FAILED::gosec.sarif is not valid SARIF."
            echo "jq said: $n"
            echo "A PARSE FAILURE is not zero findings."
            echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "gosec findings: $n"

      - name: gosec — enforce
        if: always()
        run: |
          n='${{ steps.gosec.outputs.count }}'
          # COLLECTION_FAILED IS NOT ZERO FINDINGS -- AND THIS STEP RUNS ON always().
          #
          # The counting step above correctly refuses to turn a missing or malformed report
          # into n=0, and exits non-zero. But `if: always()` means THIS step still runs, reads
          # an output that was never written, and ${n:-0} quietly supplies the very zero the
          # step above refused to invent -- announcing GATE=PASS one line after the failure was
          # detected. Each side assumed the other had handled it. Check explicitly.
          collection='${{ steps.gosec.outputs.collection }}'
          if [ "$collection" = "COLLECTION_FAILED" ]; then
            echo "::error title=COLLECTION_FAILED::Evidence could not be collected."
            echo "Posture CANNOT be established from this run. This is not a clean result."
            exit 1
          fi
          if [ -z "${n:-}" ]; then
            echo "::error title=COLLECTION_FAILED::No count was produced by the scan step."
            echo "An ABSENT measurement is not a measurement of zero."
            exit 1
          fi
          if [ "${n:-0}" -gt 0 ] && [ "${{ inputs.soft_fail_sast }}" != "true" ] && [ "${{ inputs.advisory_mode }}" != "true" ]; then
            echo "::error title=gosec::${n} finding(s). ANALYSIS=COMPLETE GATE=FAIL"
            exit 1
          fi
          echo "ANALYSIS=COMPLETE GATE=PASS (${n:-0} finding(s))"
      # Findings must survive whether or not this repo has code scanning. Uploading to the
      # Security tab is a PUBLICATION channel, not the finding itself — free on public repos,
      # otherwise Advanced Security. Treating it as mandatory turned successful scans into
      # failed jobs on every private repo without GHAS.
      - name: gosec — is there anything to publish?
        if: always()
        id: sarif_gosec
        run: |
          # No SARIF usually means no applicable source (gosec on a repo with no Go). That is
          # a legitimate outcome, not a failure, and previously crashed the upload step.
          if [ -s "gosec.sarif" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=gosec: nothing to publish::No SARIF at 'gosec.sarif' — no applicable source files. Not a failure."
          fi
      # BEGIN REDACT_SARIF — generated from scripts/redact_sarif.py. DO NOT EDIT HERE.
      - name: Redact credential material before upload
        if: always()
        shell: bash
        run: |
          cat > /tmp/redact_sarif.py <<'REDACT_SARIF_PY'
          #!/usr/bin/env python3
          """Strip credential material from a SARIF file IN PLACE, before it becomes an artifact.

          WHY THIS EXISTS
              The kit redacted exactly one scanner. gitleaks ran with --redact and had `snippet` and
              `partialFingerprints` stripped before upload. Thirteen other jobs uploaded raw SARIF, and
              several of those scanners embed matched source by design:

                  bandit    B105 hardcoded_password_string -- the snippet IS the password
                  semgrep   snippet carries the matched source line
                  trivy     secret mode reports the match
                  checkov   includes the offending code block
                  gosec     includes the offending line

              An artifact is downloadable by anyone with repository read access and is retained for
              weeks. Redacting the rendered summary while shipping the raw value in a downloadable file
              is theatre -- it moves the credential from a page someone reads to a file someone opens.

              The consolidated report job made it worse by copying every SARIF into one artifact.

          WHAT SURVIVES, WHICH IS EVERYTHING NEEDED TO FIX THE FINDING
              rule id, severity, FILE, LINE, message with credential-shaped substrings masked to a short
              prefix. What is removed: `snippet`, `contextRegion.snippet`, and `partialFingerprints`
              (which for a secret scanner can be a hash of the secret itself).

          IT IS NOT A SUBSTITUTE FOR --redact AT THE SCANNER
              Defence in depth. A scanner that can be told not to emit the value should be told. This
              catches the ones that cannot, and the ones a consumer adds later.

          USAGE
              python3 redact_sarif.py <file.sarif> [more.sarif ...]
              python3 redact_sarif.py --self-test

          EXIT
              0 rewritten (or nothing to do)      1 a file was unreadable      2 self-test failed
          """
          import io
          import json
          import os
          import re
          import sys

          # BEGIN SECRET_PATTERNS -- must stay identical to scripts/scan_report.py.
          # Two copies exist because each file is inlined into the workflow separately and neither can
          # import the other at consumer runtime. tests/check_redaction_parity.py fails the build if they
          # diverge, so the duplication is an enforced invariant rather than a hope -- the same treatment
          # the SARIF normalizer gets for the same reason.
          SECRET_PATTERNS = [
              (re.compile(r'-----BEGIN[A-Z ]*PRIVATE KEY-----'), 'private-key'),
              (re.compile(r'\bAKIA[0-9A-Z]{16}\b'), 'aws-access-key-id'),
              (re.compile(r'\bgh[pousr]_[A-Za-z0-9]{16,}'), 'github-token'),
              (re.compile(r'\bxox[baprs]-[A-Za-z0-9-]{10,}'), 'slack-token'),
              (re.compile(r'\beyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}'), 'jwt'),
              (re.compile(r'\b[A-Za-z0-9~._-]{3}8Q~[A-Za-z0-9~._-]{31,34}\b'), 'entra-client-secret'),
              (re.compile(r'(?i)\b(?:AccountKey|SharedAccessKey|password|pwd|secret|token|api[_-]?key)'
                          r'\s*[:=]\s*["\']?([^\s;,"\'&]{8,})'), 'keyed-value'),
              (re.compile(r'\b[A-Za-z0-9+/]{32,}={0,2}(?![A-Za-z0-9+/=])'), 'high-entropy'),
              (re.compile(r'\b[0-9a-fA-F]{32,}\b'), 'hex-or-digest'),
          ]


          def _mask(value, label):
              keep = value[:4]
              return '%s%s [redacted: %s, %d chars]' % (keep, '*' * min(len(value) - len(keep), 18),
                                                        label, len(value))


          REDACTED_MARK = '[redacted: '


          def redact(text):
              """Mask anything that looks like credential material. Returns the safe string.

              IDEMPOTENT, which is not free. Masking `password: AKIAIOSFODNN7EXAMPLE` produces
              `password: AKIA**************** [redacted: ...]`, and that output STILL matches the
              keyed-value pattern -- so a second pass masked the mask, and a third masked that. It
              matters because a SARIF can legitimately be redacted twice: once in the scanner job before
              upload, once in the consolidated report after download. Non-idempotent redaction would
              corrupt the text on the second pass and make the finding unreadable.
              """
              if not text:
                  return text
              out = text
              for pat, label in SECRET_PATTERNS:
                  def _sub(m, _l=label):
                      whole = m.group(0)
                      v = m.group(1) if m.groups() and m.group(1) else whole
                      if len(v) < 8 or REDACTED_MARK in whole or '****' in v:
                          return whole
                      return whole.replace(v, _mask(v, _l))
                  out = pat.sub(_sub, out)
              return out
          # END SECRET_PATTERNS


          def scrub(doc):
              """-> (snippets_removed, messages_masked). Mutates doc."""
              snips = masked = 0
              for run in (doc.get('runs') or []):
                  for res in (run.get('results') or []):
                      msg = ((res.get('message') or {}).get('text'))
                      if msg:
                          r = redact(msg)
                          if r != msg:
                              res['message']['text'] = r
                              masked += 1
                      for loc in (res.get('locations') or []) + (res.get('relatedLocations') or []):
                          pl = (loc.get('physicalLocation') or {})
                          for key in ('region', 'contextRegion'):
                              reg = pl.get(key) or {}
                              if 'snippet' in reg:
                                  reg.pop('snippet', None)
                                  snips += 1
                      # A partial fingerprint from a secret scanner can be a hash OF THE SECRET, which is
                      # an offline-guessable artifact for anything low-entropy. It buys correlation that
                      # this kit gets from file+rule instead.
                      if res.pop('partialFingerprints', None) is not None:
                          snips += 1
                      for cf in (res.get('codeFlows') or []):
                          for tf in (cf.get('threadFlows') or []):
                              for lo in (tf.get('locations') or []):
                                  pl = ((lo.get('location') or {}).get('physicalLocation') or {})
                                  for key in ('region', 'contextRegion'):
                                      reg = pl.get(key) or {}
                                      if 'snippet' in reg:
                                          reg.pop('snippet', None)
                                          snips += 1
              return (snips, masked)


          def self_test():
              fails = []
              doc = {'version': '2.1.0', 'runs': [{'tool': {'driver': {'name': 'bandit'}}, 'results': [
                  {'ruleId': 'B105', 'level': 'error',
                   'message': {'text': 'Possible hardcoded password: AKIAIOSFODNN7EXAMPLE'},
                   'partialFingerprints': {'x': 'deadbeef'},
                   'locations': [{'physicalLocation': {
                       'artifactLocation': {'uri': 'app/config.py'},
                       'region': {'startLine': 12,
                                  'snippet': {'text': 'PASSWORD = "AKIAIOSFODNN7EXAMPLE"'}},
                       'contextRegion': {'snippet': {'text': 'ctx AKIAIOSFODNN7EXAMPLE'}}}}]}]}]}
              snips, masked = scrub(doc)
              blob = json.dumps(doc)
              if 'AKIAIOSFODNN7EXAMPLE' in blob:
                  fails.append('a credential survived scrub()')
              if 'app/config.py' not in blob or '12' not in blob:
                  fails.append('scrub() destroyed the file/line needed to fix it')
              if 'AKIA' not in blob:
                  fails.append('scrub() removed the prefix identifying WHICH credential')
              if snips < 3:
                  fails.append('snippet/contextRegion/partialFingerprints not all removed (%d)' % snips)
              if masked != 1:
                  fails.append('message was not masked')
              # Idempotent: running twice must not double-mask or crash.
              s2, m2 = scrub(doc)
              if (s2, m2) != (0, 0):
                  fails.append('scrub() is not idempotent (%d,%d on second pass)' % (s2, m2))
              # A clean report must come through untouched.
              clean = {'runs': [{'results': [{'ruleId': 'X', 'message': {'text': 'unused import os'},
                                              'locations': [{'physicalLocation': {
                                                  'artifactLocation': {'uri': 'a.py'},
                                                  'region': {'startLine': 1}}}]}]}]}
              before = json.dumps(clean)
              scrub(clean)
              if json.dumps(clean) != before:
                  fails.append('a clean finding was altered')
              if fails:
                  print('SELF-TEST FAILED:')
                  for f in fails:
                      print('  - %s' % f)
                  return False
              print('self-test ok: credential masked, snippet/contextRegion/partialFingerprints removed, '
                    'file and line preserved, idempotent, clean findings untouched')
              return True


          def main():
              argv = [a for a in sys.argv[1:] if not a.startswith('-')]
              if '--self-test' in sys.argv:
                  return 0 if self_test() else 2
              if not self_test():
                  print('ABORTING -- a redactor that cannot prove it redacts is worse than none.')
                  return 2
              rc = 0
              for p in argv:
                  if not os.path.exists(p) or os.path.getsize(p) == 0:
                      print('  %s: absent or empty, nothing to redact' % p)
                      continue
                  try:
                      doc = json.load(io.open(p, encoding='utf-8', errors='replace'))
                  except (ValueError, IOError) as e:
                      # A SARIF that cannot be parsed cannot be redacted, and must NOT be uploaded on the
                      # assumption that it is probably fine. Emptying it loses nothing a reader could
                      # have used -- an unparseable report establishes nothing either way -- and it
                      # cannot leak what it was carrying.
                      print('::warning title=Unredactable SARIF::%s could not be parsed (%s); it is '
                            'replaced with an empty report rather than uploaded unexamined.'
                            % (p, type(e).__name__))
                      io.open(p, 'w', encoding='utf-8').write(
                          json.dumps({'version': '2.1.0', 'runs': [],
                                      '_redaction': 'ORIGINAL UNPARSEABLE - WITHHELD'}))
                      rc = 1
                      continue
                  snips, masked = scrub(doc)
                  json.dump(doc, io.open(p, 'w', encoding='utf-8'))
                  print('  %s: %d snippet/fingerprint field(s) removed, %d message(s) masked'
                        % (os.path.basename(p), snips, masked))
              return rc


          if __name__ == '__main__':
              sys.exit(main())

          REDACT_SARIF_PY
          shopt -s nullglob globstar
          files=( *.sarif **/*.sarif )
          if [ ${#files[@]} -eq 0 ]; then
            echo "no SARIF produced by this job -- nothing to redact"
          else
            python3 /tmp/redact_sarif.py "${files[@]}"
          fi
      # END REDACT_SARIF
      - name: gosec — keep SARIF as an artifact
        if: always() && steps.sarif_gosec.outputs.exists == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: sarif-gosec-${{ github.run_attempt }}
          path: gosec.sarif
          retention-days: 30
          if-no-files-found: warn
      - name: gosec — publish to the Security tab where available
        id: cs_gosec
        if: always() && steps.sarif_gosec.outputs.exists == 'true'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gosec.sarif
          category: gosec
      - name: gosec — state plainly if publication degraded
        if: always() && steps.sarif_gosec.outputs.exists == 'true' && steps.cs_gosec.outcome != 'success'
        run: |
          # Loud, never silent. An empty Security tab is indistinguishable from a clean
          # codebase, and that ambiguity is how a control becomes false assurance.
          echo "::warning title=gosec: NOT published to the Security tab::Code scanning is"
          echo "unavailable here (free on public repos, otherwise GitHub Advanced Security)."
          echo "The scan SUCCEEDED and the gate still enforces on these findings."
          echo "Retrieve them from the 'sarif-gosec' artifact."

      # BEGIN SCAN_STATUS — generated from scripts/scan_status.sh. DO NOT EDIT HERE.
      - name: Result summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          cat > /tmp/scan_status.sh <<'SCAN_STATUS_SH'
          #!/usr/bin/env bash
          # Short per-job result block. Runs at the end of every scanner job.
          #
          # WHY THIS EXISTS ALONGSIDE THE CONSOLIDATED REPORT
          #     The consolidated `report` job owns normalisation, cross-scanner dedupe, correlation,
          #     remediation detail and disposition, because those are only possible where every finding is
          #     visible at once. That is not a reason for a scanner job to stay silent.
          #
          #     Someone debugging Semgrep is IN the Semgrep job. Making them leave it to discover whether it
          #     found anything is how "the pipeline is noise" becomes true. So the scanner prints what it
          #     alone knows -- did it run, how many findings, was SARIF produced -- and points at the
          #     consolidated job for what it cannot know.
          #
          # DELIBERATELY NOT A SECOND COPY OF THE CONTRACT
          #     No severity interpretation, no remediation, no gate verdict, no disposition. Those live in
          #     exactly one place. A contract implemented twice drifts twice, and this kit has the scars:
          #     fourteen Azure gitleaks rules and a flawfinder fix both lost to a second copy.
          #
          # THE ZERO RULE APPLIES HERE TOO
          #     A job that did not run, or produced no parseable SARIF, prints NOT ESTABLISHED. It never
          #     prints 0. Zero says someone looked.
          #
          # USAGE   scan_status <name> <execution> <sarif-or-empty> [scope]
          scan_status() {
            _name="$1"; _exec="$2"; _sarif="${3:-}"; _scope="${4:-}"
            _out="${GITHUB_STEP_SUMMARY:-/dev/stdout}"

            _n="NOT ESTABLISHED"; _sar="NOT GENERATED"
            if [ -n "$_sarif" ] && [ -s "$_sarif" ]; then
              # suppression: FAILURE_ISOLATION_WITH_STATE_CAPTURE -- jq's failure IS the signal here, and
              # it is captured rather than swallowed: a non-zero exit takes the else branch and reports
              # INVALID plus "count unavailable from current parser". stderr is silenced because the parse
              # error text is not useful in a summary block; the STATE survives and is published. If this
              # fails in a way other than "not valid SARIF" -- jq missing, file unreadable -- the result is
              # the same and is still not a clean zero, which is the outcome that matters.
              if _c=$(jq '[.runs[].results[]] | length' "$_sarif" 2>/dev/null); then
                _sar="GENERATED"
                # Only a scanner that actually completed may report a count. A crashed run that happens to
                # have left a partial report behind must not publish a number from it.
                case "$_exec" in
                  COMPLETE) _n="$_c" ;;
                  *)        _n="NOT ESTABLISHED" ;;
                esac
              else
                # A file that is not valid SARIF is a collection failure wearing a report's clothes.
                _sar="INVALID"
                _n="PRESENT -- count unavailable from current parser"
              fi
            fi

            {
              printf '### %s\n\n' "$_name"
              printf '| | |\n|---|---|\n'
              printf '| Execution | %s |\n' "$_exec"
              [ -n "$_scope" ] && printf '| Scope | %s |\n' "$_scope"
              printf '| Findings | %s |\n' "$_n"
              printf '| SARIF | %s |\n' "$_sar"
              printf '\n'
              if [ "$_n" = "NOT ESTABLISHED" ]; then
                printf 'This is not zero. Nothing usable was collected for this scope in this run.\n\n'
              fi
              printf 'Severity breakdown, remediation, gate impact and disposition are in the\n'
              printf '**Security scan report** job, which sees every scanner at once and can tell\n'
              printf 'when two tools are describing the same condition.\n\n'
            } >> "$_out"

            printf '%s: execution=%s findings=%s sarif=%s\n' "$_name" "$_exec" "$_n" "$_sar"
          }

          SCAN_STATUS_SH
          . /tmp/scan_status.sh
          if [ "$JOB_STATUS" = "success" ]; then _e=COMPLETE; else _e=FAILED; fi
          scan_status "SAST (Go)" "$_e" "" "go"
      # END SCAN_STATUS

  sast-cpp:
    needs: [discover]
    # DISCOVERED, NOT DECLARED. Runs because roots for this ecosystem were actually
    # found in the caller's scope -- not because a selector named it. On failure
    # discovery turns everything on rather than producing a tidy row of NOT_APPLICABLE.
    if: needs.discover.outputs.cpp == 'true'
    name: SAST (C / C++)
    runs-on: ubuntu-latest
    # Bounded so a stalled dependency cannot bill six hours (LM-001: unbounded execution
    # converts a dependency failure into uncontrolled cost).
    # NOT YET: a timeout still surfaces as a plain job failure. It SHOULD classify as
    # UNAVAILABLE / EXECUTION_TIMEOUT — cost is bounded here, semantics are not. See
    # docs/roadmap/FUTURE_WORK.md. Do not let this comment imply the mapping exists.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # THIS STEP HUNG FOR THREE HOURS on 2026-08-18 with ZERO output and billed ~193 minutes
      # before anything stopped it. A slow mirror still prints "Get:" lines; silence means apt is
      # BLOCKING ON THE DPKG LOCK, which GitHub's Ubuntu images hold at boot via
      # unattended-upgrades. Under -qq it waits silently and forever. DPkg::Lock::Timeout makes it
      # FAIL instead of blocking -- without it there is no bound except the job timeout.
      - name: Install analyzers
        run: |
          set -euo pipefail
          # PRESENCE IS NOT FITNESS, and an install that "succeeded" is not a tool that runs.
          # Skip the call that hangs when the tools are already usable; otherwise install with
          # the dpkg-lock bound; then PROVE both execute before claiming any coverage.
          need_apt=false
          for tool in cppcheck flawfinder; do
            command -v "$tool" >/dev/null 2>&1 || need_apt=true
          done

          if [ "$need_apt" = "true" ]; then
            for i in 1 2 3; do
              if timeout 180 sudo apt-get -o DPkg::Lock::Timeout=60 update -qq; then break; fi
              echo "::warning title=apt update blocked::attempt $i (likely dpkg lock); retrying"
              sleep $(( i * 10 ))
            done
            timeout 300 sudo apt-get -o DPkg::Lock::Timeout=60 install -y --no-install-recommends cppcheck flawfinder || {
              echo "::error title=DEPENDENCY_ACQUISITION_UNAVAILABLE::cppcheck/flawfinder not installed."
              echo "The C/C++ scanners never ran. This is NOT evidence of no vulnerabilities."
              exit 1; }
          else
            echo "cppcheck and flawfinder already present -- no package installation attempted."
          fi

          # USABILITY BY RUNNING THE REAL TOOL, not a proxy for it. `command -v` only proves a
          # name resolves; a version string only proves something self-reported. Invoking the
          # actual binary proves the whole chain. Do not 'simplify' this back to `command -v`.
          # A tool on PATH that cannot execute is an absent tool
          # wearing a convincing costume.
          for tool in cppcheck flawfinder; do
            if ! "$tool" --version >/dev/null 2>&1; then
              echo "::error title=DEPENDENCY_ACQUISITION_UNAVAILABLE::$tool present but not runnable."
              echo "The C/C++ scanners never ran. This is NOT evidence of no vulnerabilities."
              exit 1
            fi
            echo "  $tool: $("$tool" --version 2>&1 | head -1)"
          done

          # RECORD the SARIF capability rather than discovering it by failure. flawfinder gained
          # --sarif in 2.0.11; older distro builds lack it and the kit falls back to CSV.
          # Establishing it up front makes the fallback a DECISION with evidence instead of an
          # exception handler that happens to catch it.
          if flawfinder --help 2>&1 | grep -q -- "--sarif"; then
            echo "FLAWFINDER_SARIF=true" >> "$GITHUB_ENV"
            echo "  flawfinder: SARIF supported"
          else
            echo "FLAWFINDER_SARIF=false" >> "$GITHUB_ENV"
            echo "::notice title=flawfinder SARIF unsupported::This build predates --sarif; the"
            echo "CSV path will be used and converted. Coverage is unaffected."
          fi
      - name: cppcheck
        run: |
          scope="${{ inputs.paths }}"; [ -d "$scope" ] || scope="."
          # Continuation-then-comment defect -- see the note at the C# scanner. `--xml`,
          # `--output-file` and "$scope" were all being discarded, so cppcheck ran unscoped and
          # wrote no XML for the converter downstream.
          #
          # suppression: EXPECTED_NEGATIVE_RESULT -- this scanner exits nonzero when it FINDS something,
          # which is not an error. Detection is separated from enforcement here; the count step downstream
          # distinguishes 'found nothing' from 'produced no report' and emits COLLECTION_FAILED for the
          # latter.
          # discards: this scanner's non-zero exit, which means FINDINGS rather than malfunction
          # preserved_by: the count step distinguishes an absent report from an empty one and emits
          # preserved_by: COLLECTION_FAILED for the former; the enforce step refuses an absent count
          cppcheck --enable=warning,style,performance,portability --inline-suppr \
            --xml --output-file=cppcheck.xml "$scope" 2>/dev/null || true
          # suppression: EXPECTED_NEGATIVE_RESULT -- this scanner exits nonzero when it FINDS something,
          # which is not an error. Detection is separated from enforcement here; the count step downstream
          # distinguishes 'found nothing' from 'produced no report' and emits COLLECTION_FAILED for the
          # latter.
          cppcheck --enable=warning --template=gcc "$scope" 2>&1 | tee cppcheck.txt || true
          echo "cppcheck lines: $(wc -l < cppcheck.txt)"

          # cppcheck's findings were produced and then thrown away. The XML was written, never
          # converted, never published, never gated — 159 real defects on the first legacy C++
          # consumer (uninitialised members across several classes) were invisible to everything
          # downstream. A scanner whose output nothing consumes is not a control.
          python3 - <<'CC_PY'
          import os, xml.etree.ElementTree as ET, json
          SEV = {"error": "error", "warning": "warning", "portability": "warning",
                 "performance": "note", "style": "note", "information": "note"}
          rows = []
          if os.path.exists("cppcheck.xml"):
              try:
                  root = ET.parse("cppcheck.xml").getroot()
              except ET.ParseError as e:
                  print(f"::warning title=cppcheck XML unparseable::{e}")
                  root = None
              for err in (root.iter("error") if root is not None else []):
                  loc = err.find("location")
                  rows.append({
                      "ruleId": f"cppcheck.{err.get('id','unknown')}",
                      "level": SEV.get(err.get("severity", ""), "note"),
                      "message": {"text": (err.get("msg") or "").strip()},
                      "locations": [{"physicalLocation": {
                          "artifactLocation": {"uri": (loc.get("file") if loc is not None else "unknown").lstrip("./")},
                          "region": {"startLine": max(1, int((loc.get("line") if loc is not None else 1) or 1))}}}],
                  })
          json.dump({"version": "2.1.0",
                     "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
                     "runs": [{"tool": {"driver": {"name": "cppcheck"}}, "results": rows}]},
                    open("cppcheck.sarif", "w", encoding="utf-8"))
          print(f"cppcheck findings converted to SARIF: {len(rows)}")
          CC_PY

      # BEGIN REDACT_SARIF — generated from scripts/redact_sarif.py. DO NOT EDIT HERE.
      - name: Redact credential material before upload
        if: always()
        shell: bash
        run: |
          cat > /tmp/redact_sarif.py <<'REDACT_SARIF_PY'
          #!/usr/bin/env python3
          """Strip credential material from a SARIF file IN PLACE, before it becomes an artifact.

          WHY THIS EXISTS
              The kit redacted exactly one scanner. gitleaks ran with --redact and had `snippet` and
              `partialFingerprints` stripped before upload. Thirteen other jobs uploaded raw SARIF, and
              several of those scanners embed matched source by design:

                  bandit    B105 hardcoded_password_string -- the snippet IS the password
                  semgrep   snippet carries the matched source line
                  trivy     secret mode reports the match
                  checkov   includes the offending code block
                  gosec     includes the offending line

              An artifact is downloadable by anyone with repository read access and is retained for
              weeks. Redacting the rendered summary while shipping the raw value in a downloadable file
              is theatre -- it moves the credential from a page someone reads to a file someone opens.

              The consolidated report job made it worse by copying every SARIF into one artifact.

          WHAT SURVIVES, WHICH IS EVERYTHING NEEDED TO FIX THE FINDING
              rule id, severity, FILE, LINE, message with credential-shaped substrings masked to a short
              prefix. What is removed: `snippet`, `contextRegion.snippet`, and `partialFingerprints`
              (which for a secret scanner can be a hash of the secret itself).

          IT IS NOT A SUBSTITUTE FOR --redact AT THE SCANNER
              Defence in depth. A scanner that can be told not to emit the value should be told. This
              catches the ones that cannot, and the ones a consumer adds later.

          USAGE
              python3 redact_sarif.py <file.sarif> [more.sarif ...]
              python3 redact_sarif.py --self-test

          EXIT
              0 rewritten (or nothing to do)      1 a file was unreadable      2 self-test failed
          """
          import io
          import json
          import os
          import re
          import sys

          # BEGIN SECRET_PATTERNS -- must stay identical to scripts/scan_report.py.
          # Two copies exist because each file is inlined into the workflow separately and neither can
          # import the other at consumer runtime. tests/check_redaction_parity.py fails the build if they
          # diverge, so the duplication is an enforced invariant rather than a hope -- the same treatment
          # the SARIF normalizer gets for the same reason.
          SECRET_PATTERNS = [
              (re.compile(r'-----BEGIN[A-Z ]*PRIVATE KEY-----'), 'private-key'),
              (re.compile(r'\bAKIA[0-9A-Z]{16}\b'), 'aws-access-key-id'),
              (re.compile(r'\bgh[pousr]_[A-Za-z0-9]{16,}'), 'github-token'),
              (re.compile(r'\bxox[baprs]-[A-Za-z0-9-]{10,}'), 'slack-token'),
              (re.compile(r'\beyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}'), 'jwt'),
              (re.compile(r'\b[A-Za-z0-9~._-]{3}8Q~[A-Za-z0-9~._-]{31,34}\b'), 'entra-client-secret'),
              (re.compile(r'(?i)\b(?:AccountKey|SharedAccessKey|password|pwd|secret|token|api[_-]?key)'
                          r'\s*[:=]\s*["\']?([^\s;,"\'&]{8,})'), 'keyed-value'),
              (re.compile(r'\b[A-Za-z0-9+/]{32,}={0,2}(?![A-Za-z0-9+/=])'), 'high-entropy'),
              (re.compile(r'\b[0-9a-fA-F]{32,}\b'), 'hex-or-digest'),
          ]


          def _mask(value, label):
              keep = value[:4]
              return '%s%s [redacted: %s, %d chars]' % (keep, '*' * min(len(value) - len(keep), 18),
                                                        label, len(value))


          REDACTED_MARK = '[redacted: '


          def redact(text):
              """Mask anything that looks like credential material. Returns the safe string.

              IDEMPOTENT, which is not free. Masking `password: AKIAIOSFODNN7EXAMPLE` produces
              `password: AKIA**************** [redacted: ...]`, and that output STILL matches the
              keyed-value pattern -- so a second pass masked the mask, and a third masked that. It
              matters because a SARIF can legitimately be redacted twice: once in the scanner job before
              upload, once in the consolidated report after download. Non-idempotent redaction would
              corrupt the text on the second pass and make the finding unreadable.
              """
              if not text:
                  return text
              out = text
              for pat, label in SECRET_PATTERNS:
                  def _sub(m, _l=label):
                      whole = m.group(0)
                      v = m.group(1) if m.groups() and m.group(1) else whole
                      if len(v) < 8 or REDACTED_MARK in whole or '****' in v:
                          return whole
                      return whole.replace(v, _mask(v, _l))
                  out = pat.sub(_sub, out)
              return out
          # END SECRET_PATTERNS


          def scrub(doc):
              """-> (snippets_removed, messages_masked). Mutates doc."""
              snips = masked = 0
              for run in (doc.get('runs') or []):
                  for res in (run.get('results') or []):
                      msg = ((res.get('message') or {}).get('text'))
                      if msg:
                          r = redact(msg)
                          if r != msg:
                              res['message']['text'] = r
                              masked += 1
                      for loc in (res.get('locations') or []) + (res.get('relatedLocations') or []):
                          pl = (loc.get('physicalLocation') or {})
                          for key in ('region', 'contextRegion'):
                              reg = pl.get(key) or {}
                              if 'snippet' in reg:
                                  reg.pop('snippet', None)
                                  snips += 1
                      # A partial fingerprint from a secret scanner can be a hash OF THE SECRET, which is
                      # an offline-guessable artifact for anything low-entropy. It buys correlation that
                      # this kit gets from file+rule instead.
                      if res.pop('partialFingerprints', None) is not None:
                          snips += 1
                      for cf in (res.get('codeFlows') or []):
                          for tf in (cf.get('threadFlows') or []):
                              for lo in (tf.get('locations') or []):
                                  pl = ((lo.get('location') or {}).get('physicalLocation') or {})
                                  for key in ('region', 'contextRegion'):
                                      reg = pl.get(key) or {}
                                      if 'snippet' in reg:
                                          reg.pop('snippet', None)
                                          snips += 1
              return (snips, masked)


          def self_test():
              fails = []
              doc = {'version': '2.1.0', 'runs': [{'tool': {'driver': {'name': 'bandit'}}, 'results': [
                  {'ruleId': 'B105', 'level': 'error',
                   'message': {'text': 'Possible hardcoded password: AKIAIOSFODNN7EXAMPLE'},
                   'partialFingerprints': {'x': 'deadbeef'},
                   'locations': [{'physicalLocation': {
                       'artifactLocation': {'uri': 'app/config.py'},
                       'region': {'startLine': 12,
                                  'snippet': {'text': 'PASSWORD = "AKIAIOSFODNN7EXAMPLE"'}},
                       'contextRegion': {'snippet': {'text': 'ctx AKIAIOSFODNN7EXAMPLE'}}}}]}]}]}
              snips, masked = scrub(doc)
              blob = json.dumps(doc)
              if 'AKIAIOSFODNN7EXAMPLE' in blob:
                  fails.append('a credential survived scrub()')
              if 'app/config.py' not in blob or '12' not in blob:
                  fails.append('scrub() destroyed the file/line needed to fix it')
              if 'AKIA' not in blob:
                  fails.append('scrub() removed the prefix identifying WHICH credential')
              if snips < 3:
                  fails.append('snippet/contextRegion/partialFingerprints not all removed (%d)' % snips)
              if masked != 1:
                  fails.append('message was not masked')
              # Idempotent: running twice must not double-mask or crash.
              s2, m2 = scrub(doc)
              if (s2, m2) != (0, 0):
                  fails.append('scrub() is not idempotent (%d,%d on second pass)' % (s2, m2))
              # A clean report must come through untouched.
              clean = {'runs': [{'results': [{'ruleId': 'X', 'message': {'text': 'unused import os'},
                                              'locations': [{'physicalLocation': {
                                                  'artifactLocation': {'uri': 'a.py'},
                                                  'region': {'startLine': 1}}}]}]}]}
              before = json.dumps(clean)
              scrub(clean)
              if json.dumps(clean) != before:
                  fails.append('a clean finding was altered')
              if fails:
                  print('SELF-TEST FAILED:')
                  for f in fails:
                      print('  - %s' % f)
                  return False
              print('self-test ok: credential masked, snippet/contextRegion/partialFingerprints removed, '
                    'file and line preserved, idempotent, clean findings untouched')
              return True


          def main():
              argv = [a for a in sys.argv[1:] if not a.startswith('-')]
              if '--self-test' in sys.argv:
                  return 0 if self_test() else 2
              if not self_test():
                  print('ABORTING -- a redactor that cannot prove it redacts is worse than none.')
                  return 2
              rc = 0
              for p in argv:
                  if not os.path.exists(p) or os.path.getsize(p) == 0:
                      print('  %s: absent or empty, nothing to redact' % p)
                      continue
                  try:
                      doc = json.load(io.open(p, encoding='utf-8', errors='replace'))
                  except (ValueError, IOError) as e:
                      # A SARIF that cannot be parsed cannot be redacted, and must NOT be uploaded on the
                      # assumption that it is probably fine. Emptying it loses nothing a reader could
                      # have used -- an unparseable report establishes nothing either way -- and it
                      # cannot leak what it was carrying.
                      print('::warning title=Unredactable SARIF::%s could not be parsed (%s); it is '
                            'replaced with an empty report rather than uploaded unexamined.'
                            % (p, type(e).__name__))
                      io.open(p, 'w', encoding='utf-8').write(
                          json.dumps({'version': '2.1.0', 'runs': [],
                                      '_redaction': 'ORIGINAL UNPARSEABLE - WITHHELD'}))
                      rc = 1
                      continue
                  snips, masked = scrub(doc)
                  json.dump(doc, io.open(p, 'w', encoding='utf-8'))
                  print('  %s: %d snippet/fingerprint field(s) removed, %d message(s) masked'
                        % (os.path.basename(p), snips, masked))
              return rc


          if __name__ == '__main__':
              sys.exit(main())

          REDACT_SARIF_PY
          shopt -s nullglob globstar
          files=( *.sarif **/*.sarif )
          if [ ${#files[@]} -eq 0 ]; then
            echo "no SARIF produced by this job -- nothing to redact"
          else
            python3 /tmp/redact_sarif.py "${files[@]}"
          fi
      # END REDACT_SARIF
      - name: cppcheck — keep SARIF as an artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sarif-cppcheck-${{ github.run_attempt }}
          path: cppcheck.sarif
          retention-days: 30
          if-no-files-found: warn
      - name: cppcheck — publish to the Security tab where available
        id: cs_cppcheck
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: cppcheck.sarif
          category: cppcheck
      # Findings must survive whether or not this repo has code scanning. Uploading to the
      # Security tab is a PUBLICATION channel, not the finding itself — free on public repos,
      # otherwise Advanced Security. Treating it as mandatory turned successful scans into
      # failed jobs on every private repo without GHAS.
      - name: flawfinder
        id: flawfinder
        run: |
          set -uo pipefail
          # flawfinder WAS NEVER INVOKED. The job installed it, ran cppcheck instead, then
          # published `flawfinder.sarif` — which nothing wrote. cppcheck's own findings were
          # never converted to SARIF either, so they never reached the gate.
          scope="${{ inputs.paths }}"; [ -d "$scope" ] || scope="."
          # "NONE FOUND" AND "COULD NOT LOOK" ARE DIFFERENT ANSWERS. A find that ERRORS produces
          # empty output, which read as "this language is not here", which skipped the job, which
          # reported green over code nobody scanned. Same defect discovery had; same fix.
          # suppression: PRESENTATION_ONLY -- find's stderr is noise on unreadable subtrees; the EXIT
          # STATUS is checked on the next line and a failure raises COLLECTION_FAILED rather than reading
          # as 'nothing found'.
          # discards: find's stderr, which is noise on unreadable or permission-denied subtrees
          # preserved_by: the EXIT STATUS is captured on the next line and a non-zero rc raises
          # preserved_by: COLLECTION_FAILED, so 'could not look' never reads as 'found nothing'
          if ! _hits=$(find "$scope" \( -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.h' \) 2>/dev/null); then
            echo "::error title=COLLECTION_FAILED::Applicability survey failed; cannot establish scope."
            echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ -z "$_hits" ]; then
            echo "::notice title=No C/C++ sources::None under '$scope'. Skipping."
            exit 0
          fi
          # NEVER SUPPRESS THE HARNESS'S OWN DIAGNOSTICS. This step used to end in
          # `2>/dev/null || true`, so when flawfinder failed it produced no SARIF, no error,
          # and a green job — indistinguishable from "scanned and found nothing". A real C++
          # repository with 29 files reported zero findings and nobody could tell why.
          # CAPABILITY_MATRIX records this exact defect costing two debug cycles; it recurred
          # here because the fix was applied to the probes and not to the workflow.
          flawfinder --version || echo "::warning::flawfinder --version failed"

          # REAL LEGACY CODE IS NOT ALWAYS UTF-8. flawfinder is a Python tool and aborts
          # outright on the first undecodable byte:
          #     'utf-8' codec can't decode byte 0xf1 ... invalid continuation byte
          # A 2019 C++ project with one Latin-1 character in one file produced ZERO findings
          # and a green job. Worse, flawfinder wrote that error to STDOUT, so the redirect
          # captured it AS the report — a non-empty file that is not JSON. Checking only that
          # the file exists is not enough; a malformed report is not a clean report.
          #
          # Transcode a COPY. The consumer's repository is never modified — mutating source to
          # make a scanner happy is the same failure as generating a lockfile to silence SCA.
          work=$(mktemp -d)
          python3 - "$scope" "$work" <<'TX_PY'
          import os, shutil, sys
          src, dst = sys.argv[1], sys.argv[2]
          exts = (".c", ".cc", ".cpp", ".cxx", ".h", ".hpp", ".hh")
          copied = transcoded = 0
          for root, _d, files in os.walk(src):
              for fn in files:
                  if not fn.lower().endswith(exts):
                      continue
                  sp = os.path.join(root, fn)
                  dp = os.path.join(dst, os.path.relpath(sp, src))
                  os.makedirs(os.path.dirname(dp), exist_ok=True)
                  raw = open(sp, "rb").read()
                  try:
                      raw.decode("utf-8")
                      shutil.copyfile(sp, dp)
                  except UnicodeDecodeError:
                      # latin-1 never fails and preserves byte values; the goal is analysability,
                      # not a faithful re-encoding.
                      open(dp, "w", encoding="utf-8").write(raw.decode("latin-1"))
                      transcoded += 1
                      print(f"::notice title=Transcoded for analysis::{os.path.relpath(sp, src)}"
                            f" is not valid UTF-8. A COPY was transcoded; your file is untouched.")
                  copied += 1
          print(f"prepared {copied} source file(s); {transcoded} transcoded")
          TX_PY

          rc=0
          flawfinder --sarif "$work" > flawfinder.sarif 2>flawfinder.err || rc=$?
          if [ -s flawfinder.err ]; then
            echo "::group::flawfinder stderr"; cat flawfinder.err; echo "::endgroup::"
          fi
          # A non-empty file is NOT proof of a valid report. Validate it parses.
          if ! python3 -c "import json,sys; json.load(open('flawfinder.sarif'))" 2>/dev/null; then
            echo "::warning title=flawfinder SARIF invalid (rc=$rc)::Output was not JSON — most"
            echo "likely an error message captured as the report. First 200 bytes:"
            # suppression: EXPECTED_NEGATIVE_RESULT -- this scanner exits nonzero when it FINDS something,
            # which is not an error. Detection is separated from enforcement here; the count step downstream
            # distinguishes 'found nothing' from 'produced no report' and emits COLLECTION_FAILED for the
            # latter.
            # discards: this scanner's non-zero exit, which means FINDINGS rather than malfunction
            # preserved_by: the count step distinguishes an absent report from an empty one and emits
            # preserved_by: COLLECTION_FAILED for the former; the enforce step refuses an absent count
            head -c 200 flawfinder.sarif || true; echo
            # suppression: EXPECTED_NEGATIVE_RESULT -- this scanner exits nonzero when it FINDS something,
            # which is not an error. Detection is separated from enforcement here; the count step downstream
            # distinguishes 'found nothing' from 'produced no report' and emits COLLECTION_FAILED for the
            # latter.
            flawfinder --csv "$work" > flawfinder.csv 2>>flawfinder.err || true
            python3 - "$work" <<'FF_PY'
          import csv, json, os, sys
          base = sys.argv[1]
          rows = []
          if os.path.exists("flawfinder.csv"):
              with open("flawfinder.csv", newline="", encoding="utf-8", errors="replace") as fh:
                  for r in csv.DictReader(fh):
                      if not r.get("File"):
                          continue
                      lvl = int(r.get("Level") or 0)
                      uri = os.path.relpath(r["File"], base).replace("\\", "/")
                      rows.append({
                          "ruleId": f"flawfinder.{r.get('Category','')}.{r.get('Name','')}".strip("."),
                          "level": "error" if lvl >= 4 else "warning" if lvl >= 2 else "note",
                          "message": {"text": f"[level {lvl}] {r.get('Warning','')}".strip()},
                          "locations": [{"physicalLocation": {
                              "artifactLocation": {"uri": uri},
                              "region": {"startLine": max(1, int(r.get("Line") or 1))}}}],
                      })
          json.dump({"version": "2.1.0",
                     "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
                     "runs": [{"tool": {"driver": {"name": "flawfinder"}}, "results": rows}]},
                    open("flawfinder.sarif", "w", encoding="utf-8"))
          print(f"converted {len(rows)} flawfinder finding(s) from CSV")
          FF_PY
          fi
          # A PARSE FAILURE IS NOT ZERO FINDINGS.
          #
          # This was `jq ... 2>/dev/null || echo 0`, so a missing, truncated or malformed report
          # produced n=0 -- which the gate reads as CLEAN. The taxonomy already had a word for
          # exactly this (COLLECTION_FAILED: "an empty but well-formed result is indistinguishable
          # from a clean scan") while the code did the opposite. Found by auditing the class after
          # the same defect turned up in discovery, not by reading this line.
          if [ ! -s flawfinder.sarif ]; then
            echo "::error title=COLLECTION_FAILED::flawfinder.sarif was not produced."
            echo "An ABSENT report is not zero findings. Posture cannot be established from this run."
            echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if ! n=$(jq '[.runs[].results[]] | length' flawfinder.sarif 2>&1); then
            echo "::error title=COLLECTION_FAILED::flawfinder.sarif is not valid SARIF."
            echo "jq said: $n"
            echo "A PARSE FAILURE is not zero findings."
            echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "flawfinder findings: $n"

      - name: flawfinder — enforce
        if: always()
        run: |
          n='${{ steps.flawfinder.outputs.count }}'
          # COLLECTION_FAILED IS NOT ZERO FINDINGS -- AND THIS STEP RUNS ON always().
          #
          # The counting step above correctly refuses to turn a missing or malformed report
          # into n=0, and exits non-zero. But `if: always()` means THIS step still runs, reads
          # an output that was never written, and ${n:-0} quietly supplies the very zero the
          # step above refused to invent -- announcing GATE=PASS one line after the failure was
          # detected. Each side assumed the other had handled it. Check explicitly.
          collection='${{ steps.flawfinder.outputs.collection }}'
          if [ "$collection" = "COLLECTION_FAILED" ]; then
            echo "::error title=COLLECTION_FAILED::Evidence could not be collected."
            echo "Posture CANNOT be established from this run. This is not a clean result."
            exit 1
          fi
          if [ -z "${n:-}" ]; then
            echo "::error title=COLLECTION_FAILED::No count was produced by the scan step."
            echo "An ABSENT measurement is not a measurement of zero."
            exit 1
          fi
          if [ "${n:-0}" -gt 0 ] && [ "${{ inputs.soft_fail_sast }}" != "true" ] && [ "${{ inputs.advisory_mode }}" != "true" ]; then
            echo "::error title=flawfinder::${n} finding(s). ANALYSIS=COMPLETE GATE=FAIL"; exit 1
          fi
          echo "ANALYSIS=COMPLETE GATE=PASS (${n:-0} finding(s))"

      - name: flawfinder — is there anything to publish?
        if: always()
        id: sarif_flawfinder
        run: |
          # No SARIF usually means no applicable source (gosec on a repo with no Go). That is
          # a legitimate outcome, not a failure, and previously crashed the upload step.
          if [ -s "flawfinder.sarif" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=flawfinder: nothing to publish::No SARIF at 'flawfinder.sarif' — no applicable source files. Not a failure."
          fi
      - name: flawfinder — keep SARIF as an artifact
        if: always() && steps.sarif_flawfinder.outputs.exists == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: sarif-flawfinder-${{ github.run_attempt }}
          path: flawfinder.sarif
          retention-days: 30
          if-no-files-found: warn
      - name: flawfinder — publish to the Security tab where available
        id: cs_flawfinder
        if: always() && steps.sarif_flawfinder.outputs.exists == 'true'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: flawfinder.sarif
          category: flawfinder
      - name: flawfinder — state plainly if publication degraded
        if: always() && steps.sarif_flawfinder.outputs.exists == 'true' && steps.cs_flawfinder.outcome != 'success'
        run: |
          # Loud, never silent. An empty Security tab is indistinguishable from a clean
          # codebase, and that ambiguity is how a control becomes false assurance.
          echo "::warning title=flawfinder: NOT published to the Security tab::Code scanning is"
          echo "unavailable here (free on public repos, otherwise GitHub Advanced Security)."
          echo "The scan SUCCEEDED and the gate still enforces on these findings."
          echo "Retrieve them from the 'sarif-flawfinder' artifact."
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cpp-analysis
          path: |
            cppcheck.xml
            cppcheck.txt

  # ------------------------------------------------- known-malicious packages
  # CVE scanning finds VULNERABLE packages. This finds COMPROMISED ones —
  # typosquats, hijacked maintainer accounts, backdoored releases. OSV carries
  # OpenSSF Malicious Packages advisories (MAL-*), which CVE feeds do not.

      # BEGIN SCAN_STATUS — generated from scripts/scan_status.sh. DO NOT EDIT HERE.
      - name: Result summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          cat > /tmp/scan_status.sh <<'SCAN_STATUS_SH'
          #!/usr/bin/env bash
          # Short per-job result block. Runs at the end of every scanner job.
          #
          # WHY THIS EXISTS ALONGSIDE THE CONSOLIDATED REPORT
          #     The consolidated `report` job owns normalisation, cross-scanner dedupe, correlation,
          #     remediation detail and disposition, because those are only possible where every finding is
          #     visible at once. That is not a reason for a scanner job to stay silent.
          #
          #     Someone debugging Semgrep is IN the Semgrep job. Making them leave it to discover whether it
          #     found anything is how "the pipeline is noise" becomes true. So the scanner prints what it
          #     alone knows -- did it run, how many findings, was SARIF produced -- and points at the
          #     consolidated job for what it cannot know.
          #
          # DELIBERATELY NOT A SECOND COPY OF THE CONTRACT
          #     No severity interpretation, no remediation, no gate verdict, no disposition. Those live in
          #     exactly one place. A contract implemented twice drifts twice, and this kit has the scars:
          #     fourteen Azure gitleaks rules and a flawfinder fix both lost to a second copy.
          #
          # THE ZERO RULE APPLIES HERE TOO
          #     A job that did not run, or produced no parseable SARIF, prints NOT ESTABLISHED. It never
          #     prints 0. Zero says someone looked.
          #
          # USAGE   scan_status <name> <execution> <sarif-or-empty> [scope]
          scan_status() {
            _name="$1"; _exec="$2"; _sarif="${3:-}"; _scope="${4:-}"
            _out="${GITHUB_STEP_SUMMARY:-/dev/stdout}"

            _n="NOT ESTABLISHED"; _sar="NOT GENERATED"
            if [ -n "$_sarif" ] && [ -s "$_sarif" ]; then
              # suppression: FAILURE_ISOLATION_WITH_STATE_CAPTURE -- jq's failure IS the signal here, and
              # it is captured rather than swallowed: a non-zero exit takes the else branch and reports
              # INVALID plus "count unavailable from current parser". stderr is silenced because the parse
              # error text is not useful in a summary block; the STATE survives and is published. If this
              # fails in a way other than "not valid SARIF" -- jq missing, file unreadable -- the result is
              # the same and is still not a clean zero, which is the outcome that matters.
              if _c=$(jq '[.runs[].results[]] | length' "$_sarif" 2>/dev/null); then
                _sar="GENERATED"
                # Only a scanner that actually completed may report a count. A crashed run that happens to
                # have left a partial report behind must not publish a number from it.
                case "$_exec" in
                  COMPLETE) _n="$_c" ;;
                  *)        _n="NOT ESTABLISHED" ;;
                esac
              else
                # A file that is not valid SARIF is a collection failure wearing a report's clothes.
                _sar="INVALID"
                _n="PRESENT -- count unavailable from current parser"
              fi
            fi

            {
              printf '### %s\n\n' "$_name"
              printf '| | |\n|---|---|\n'
              printf '| Execution | %s |\n' "$_exec"
              [ -n "$_scope" ] && printf '| Scope | %s |\n' "$_scope"
              printf '| Findings | %s |\n' "$_n"
              printf '| SARIF | %s |\n' "$_sar"
              printf '\n'
              if [ "$_n" = "NOT ESTABLISHED" ]; then
                printf 'This is not zero. Nothing usable was collected for this scope in this run.\n\n'
              fi
              printf 'Severity breakdown, remediation, gate impact and disposition are in the\n'
              printf '**Security scan report** job, which sees every scanner at once and can tell\n'
              printf 'when two tools are describing the same condition.\n\n'
            } >> "$_out"

            printf '%s: execution=%s findings=%s sarif=%s\n' "$_name" "$_exec" "$_n" "$_sar"
          }

          SCAN_STATUS_SH
          . /tmp/scan_status.sh
          if [ "$JOB_STATUS" = "success" ]; then _e=COMPLETE; else _e=FAILED; fi
          scan_status "SAST (C/C++)" "$_e" "" "c / c++"
      # END SCAN_STATUS

  image-scan:
    needs: [discover]
    # Only when an image is supplied. Nothing to infer: either a caller names an artifact to
    # scan or there is no artifact, and "no image configured" is NOT_APPLICABLE rather than a
    # scan that found nothing.
    if: inputs.image_ref != ''
    name: Container image (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Trivy image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ inputs.image_ref }}
          scanners: vuln,secret
          severity: ${{ inputs.fail_on_severity }}
          # --ignore-unfixed is deliberately NOT set. A vulnerability with no fix available is
          # still a vulnerability in the thing you are about to run; hiding it turns a risk
          # decision into a silent one. Suppression belongs in the disposition register where
          # it is attributable and expires, not in a scanner flag.
          exit-code: ${{ inputs.advisory_mode && '0' || '1' }}
          format: sarif
          output: trivy-image.sarif

  malicious-deps:
    needs: [discover]
    name: Malicious / compromised packages (OSV)
    if: inputs.enable_malicious_pkg_scan
    runs-on: ubuntu-latest
    # Bounded so a stalled dependency cannot bill six hours (LM-001: unbounded execution
    # converts a dependency failure into uncontrolled cost).
    # NOT YET: a timeout still surfaces as a plain job failure. It SHOULD classify as
    # UNAVAILABLE / EXECUTION_TIMEOUT — cost is bounded here, semantics are not. See
    # docs/roadmap/FUTURE_WORK.md. Do not let this comment imply the mapping exists.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install OSV-Scanner
        run: |
          curl -sSfL -o /usr/local/bin/osv-scanner \
            https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64
          chmod +x /usr/local/bin/osv-scanner
      - name: Scan lockfiles
        run: |
          set -uo pipefail
          osv-scanner scan source --recursive --format json --output osv.json . || true
          osv-scanner scan source --recursive --format sarif --output osv.sarif . || true
      # Findings must survive whether or not this repo has code scanning. Uploading to the
      # Security tab is a PUBLICATION channel, not the finding itself — free on public repos,
      # otherwise Advanced Security. Treating it as mandatory turned successful scans into
      # failed jobs on every private repo without GHAS.
      - name: OSV — is there anything to publish?
        id: sarif_osv
        run: |
          # No SARIF usually means no applicable source (gosec on a repo with no Go). That is
          # a legitimate outcome, not a failure, and previously crashed the upload step.
          if [ -s "osv.sarif" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=OSV: nothing to publish::No SARIF at 'osv.sarif' — no applicable source files. Not a failure."
          fi
      # BEGIN REDACT_SARIF — generated from scripts/redact_sarif.py. DO NOT EDIT HERE.
      - name: Redact credential material before upload
        if: always()
        shell: bash
        run: |
          cat > /tmp/redact_sarif.py <<'REDACT_SARIF_PY'
          #!/usr/bin/env python3
          """Strip credential material from a SARIF file IN PLACE, before it becomes an artifact.

          WHY THIS EXISTS
              The kit redacted exactly one scanner. gitleaks ran with --redact and had `snippet` and
              `partialFingerprints` stripped before upload. Thirteen other jobs uploaded raw SARIF, and
              several of those scanners embed matched source by design:

                  bandit    B105 hardcoded_password_string -- the snippet IS the password
                  semgrep   snippet carries the matched source line
                  trivy     secret mode reports the match
                  checkov   includes the offending code block
                  gosec     includes the offending line

              An artifact is downloadable by anyone with repository read access and is retained for
              weeks. Redacting the rendered summary while shipping the raw value in a downloadable file
              is theatre -- it moves the credential from a page someone reads to a file someone opens.

              The consolidated report job made it worse by copying every SARIF into one artifact.

          WHAT SURVIVES, WHICH IS EVERYTHING NEEDED TO FIX THE FINDING
              rule id, severity, FILE, LINE, message with credential-shaped substrings masked to a short
              prefix. What is removed: `snippet`, `contextRegion.snippet`, and `partialFingerprints`
              (which for a secret scanner can be a hash of the secret itself).

          IT IS NOT A SUBSTITUTE FOR --redact AT THE SCANNER
              Defence in depth. A scanner that can be told not to emit the value should be told. This
              catches the ones that cannot, and the ones a consumer adds later.

          USAGE
              python3 redact_sarif.py <file.sarif> [more.sarif ...]
              python3 redact_sarif.py --self-test

          EXIT
              0 rewritten (or nothing to do)      1 a file was unreadable      2 self-test failed
          """
          import io
          import json
          import os
          import re
          import sys

          # BEGIN SECRET_PATTERNS -- must stay identical to scripts/scan_report.py.
          # Two copies exist because each file is inlined into the workflow separately and neither can
          # import the other at consumer runtime. tests/check_redaction_parity.py fails the build if they
          # diverge, so the duplication is an enforced invariant rather than a hope -- the same treatment
          # the SARIF normalizer gets for the same reason.
          SECRET_PATTERNS = [
              (re.compile(r'-----BEGIN[A-Z ]*PRIVATE KEY-----'), 'private-key'),
              (re.compile(r'\bAKIA[0-9A-Z]{16}\b'), 'aws-access-key-id'),
              (re.compile(r'\bgh[pousr]_[A-Za-z0-9]{16,}'), 'github-token'),
              (re.compile(r'\bxox[baprs]-[A-Za-z0-9-]{10,}'), 'slack-token'),
              (re.compile(r'\beyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}'), 'jwt'),
              (re.compile(r'\b[A-Za-z0-9~._-]{3}8Q~[A-Za-z0-9~._-]{31,34}\b'), 'entra-client-secret'),
              (re.compile(r'(?i)\b(?:AccountKey|SharedAccessKey|password|pwd|secret|token|api[_-]?key)'
                          r'\s*[:=]\s*["\']?([^\s;,"\'&]{8,})'), 'keyed-value'),
              (re.compile(r'\b[A-Za-z0-9+/]{32,}={0,2}(?![A-Za-z0-9+/=])'), 'high-entropy'),
              (re.compile(r'\b[0-9a-fA-F]{32,}\b'), 'hex-or-digest'),
          ]


          def _mask(value, label):
              keep = value[:4]
              return '%s%s [redacted: %s, %d chars]' % (keep, '*' * min(len(value) - len(keep), 18),
                                                        label, len(value))


          REDACTED_MARK = '[redacted: '


          def redact(text):
              """Mask anything that looks like credential material. Returns the safe string.

              IDEMPOTENT, which is not free. Masking `password: AKIAIOSFODNN7EXAMPLE` produces
              `password: AKIA**************** [redacted: ...]`, and that output STILL matches the
              keyed-value pattern -- so a second pass masked the mask, and a third masked that. It
              matters because a SARIF can legitimately be redacted twice: once in the scanner job before
              upload, once in the consolidated report after download. Non-idempotent redaction would
              corrupt the text on the second pass and make the finding unreadable.
              """
              if not text:
                  return text
              out = text
              for pat, label in SECRET_PATTERNS:
                  def _sub(m, _l=label):
                      whole = m.group(0)
                      v = m.group(1) if m.groups() and m.group(1) else whole
                      if len(v) < 8 or REDACTED_MARK in whole or '****' in v:
                          return whole
                      return whole.replace(v, _mask(v, _l))
                  out = pat.sub(_sub, out)
              return out
          # END SECRET_PATTERNS


          def scrub(doc):
              """-> (snippets_removed, messages_masked). Mutates doc."""
              snips = masked = 0
              for run in (doc.get('runs') or []):
                  for res in (run.get('results') or []):
                      msg = ((res.get('message') or {}).get('text'))
                      if msg:
                          r = redact(msg)
                          if r != msg:
                              res['message']['text'] = r
                              masked += 1
                      for loc in (res.get('locations') or []) + (res.get('relatedLocations') or []):
                          pl = (loc.get('physicalLocation') or {})
                          for key in ('region', 'contextRegion'):
                              reg = pl.get(key) or {}
                              if 'snippet' in reg:
                                  reg.pop('snippet', None)
                                  snips += 1
                      # A partial fingerprint from a secret scanner can be a hash OF THE SECRET, which is
                      # an offline-guessable artifact for anything low-entropy. It buys correlation that
                      # this kit gets from file+rule instead.
                      if res.pop('partialFingerprints', None) is not None:
                          snips += 1
                      for cf in (res.get('codeFlows') or []):
                          for tf in (cf.get('threadFlows') or []):
                              for lo in (tf.get('locations') or []):
                                  pl = ((lo.get('location') or {}).get('physicalLocation') or {})
                                  for key in ('region', 'contextRegion'):
                                      reg = pl.get(key) or {}
                                      if 'snippet' in reg:
                                          reg.pop('snippet', None)
                                          snips += 1
              return (snips, masked)


          def self_test():
              fails = []
              doc = {'version': '2.1.0', 'runs': [{'tool': {'driver': {'name': 'bandit'}}, 'results': [
                  {'ruleId': 'B105', 'level': 'error',
                   'message': {'text': 'Possible hardcoded password: AKIAIOSFODNN7EXAMPLE'},
                   'partialFingerprints': {'x': 'deadbeef'},
                   'locations': [{'physicalLocation': {
                       'artifactLocation': {'uri': 'app/config.py'},
                       'region': {'startLine': 12,
                                  'snippet': {'text': 'PASSWORD = "AKIAIOSFODNN7EXAMPLE"'}},
                       'contextRegion': {'snippet': {'text': 'ctx AKIAIOSFODNN7EXAMPLE'}}}}]}]}]}
              snips, masked = scrub(doc)
              blob = json.dumps(doc)
              if 'AKIAIOSFODNN7EXAMPLE' in blob:
                  fails.append('a credential survived scrub()')
              if 'app/config.py' not in blob or '12' not in blob:
                  fails.append('scrub() destroyed the file/line needed to fix it')
              if 'AKIA' not in blob:
                  fails.append('scrub() removed the prefix identifying WHICH credential')
              if snips < 3:
                  fails.append('snippet/contextRegion/partialFingerprints not all removed (%d)' % snips)
              if masked != 1:
                  fails.append('message was not masked')
              # Idempotent: running twice must not double-mask or crash.
              s2, m2 = scrub(doc)
              if (s2, m2) != (0, 0):
                  fails.append('scrub() is not idempotent (%d,%d on second pass)' % (s2, m2))
              # A clean report must come through untouched.
              clean = {'runs': [{'results': [{'ruleId': 'X', 'message': {'text': 'unused import os'},
                                              'locations': [{'physicalLocation': {
                                                  'artifactLocation': {'uri': 'a.py'},
                                                  'region': {'startLine': 1}}}]}]}]}
              before = json.dumps(clean)
              scrub(clean)
              if json.dumps(clean) != before:
                  fails.append('a clean finding was altered')
              if fails:
                  print('SELF-TEST FAILED:')
                  for f in fails:
                      print('  - %s' % f)
                  return False
              print('self-test ok: credential masked, snippet/contextRegion/partialFingerprints removed, '
                    'file and line preserved, idempotent, clean findings untouched')
              return True


          def main():
              argv = [a for a in sys.argv[1:] if not a.startswith('-')]
              if '--self-test' in sys.argv:
                  return 0 if self_test() else 2
              if not self_test():
                  print('ABORTING -- a redactor that cannot prove it redacts is worse than none.')
                  return 2
              rc = 0
              for p in argv:
                  if not os.path.exists(p) or os.path.getsize(p) == 0:
                      print('  %s: absent or empty, nothing to redact' % p)
                      continue
                  try:
                      doc = json.load(io.open(p, encoding='utf-8', errors='replace'))
                  except (ValueError, IOError) as e:
                      # A SARIF that cannot be parsed cannot be redacted, and must NOT be uploaded on the
                      # assumption that it is probably fine. Emptying it loses nothing a reader could
                      # have used -- an unparseable report establishes nothing either way -- and it
                      # cannot leak what it was carrying.
                      print('::warning title=Unredactable SARIF::%s could not be parsed (%s); it is '
                            'replaced with an empty report rather than uploaded unexamined.'
                            % (p, type(e).__name__))
                      io.open(p, 'w', encoding='utf-8').write(
                          json.dumps({'version': '2.1.0', 'runs': [],
                                      '_redaction': 'ORIGINAL UNPARSEABLE - WITHHELD'}))
                      rc = 1
                      continue
                  snips, masked = scrub(doc)
                  json.dump(doc, io.open(p, 'w', encoding='utf-8'))
                  print('  %s: %d snippet/fingerprint field(s) removed, %d message(s) masked'
                        % (os.path.basename(p), snips, masked))
              return rc


          if __name__ == '__main__':
              sys.exit(main())

          REDACT_SARIF_PY
          shopt -s nullglob globstar
          files=( *.sarif **/*.sarif )
          if [ ${#files[@]} -eq 0 ]; then
            echo "no SARIF produced by this job -- nothing to redact"
          else
            python3 /tmp/redact_sarif.py "${files[@]}"
          fi
      # END REDACT_SARIF
      - name: OSV — keep SARIF as an artifact
        if: always() && steps.sarif_osv.outputs.exists == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: sarif-osv-${{ github.run_attempt }}
          path: osv.sarif
          retention-days: 30
          if-no-files-found: warn
      - name: OSV — publish to the Security tab where available
        id: cs_osv
        if: always() && steps.sarif_osv.outputs.exists == 'true'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: osv.sarif
          category: osv
      - name: OSV — state plainly if publication degraded
        if: always() && steps.sarif_osv.outputs.exists == 'true' && steps.cs_osv.outcome != 'success'
        run: |
          # Loud, never silent. An empty Security tab is indistinguishable from a clean
          # codebase, and that ambiguity is how a control becomes false assurance.
          echo "::warning title=OSV: NOT published to the Security tab::Code scanning is"
          echo "unavailable here (free on public repos, otherwise GitHub Advanced Security)."
          echo "The scan SUCCEEDED and the gate still enforces on these findings."
          echo "Retrieve them from the 'sarif-osv' artifact."

  # ------------------------------------------------------------------- SBOM

      # BEGIN SCAN_STATUS — generated from scripts/scan_status.sh. DO NOT EDIT HERE.
      - name: Result summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          cat > /tmp/scan_status.sh <<'SCAN_STATUS_SH'
          #!/usr/bin/env bash
          # Short per-job result block. Runs at the end of every scanner job.
          #
          # WHY THIS EXISTS ALONGSIDE THE CONSOLIDATED REPORT
          #     The consolidated `report` job owns normalisation, cross-scanner dedupe, correlation,
          #     remediation detail and disposition, because those are only possible where every finding is
          #     visible at once. That is not a reason for a scanner job to stay silent.
          #
          #     Someone debugging Semgrep is IN the Semgrep job. Making them leave it to discover whether it
          #     found anything is how "the pipeline is noise" becomes true. So the scanner prints what it
          #     alone knows -- did it run, how many findings, was SARIF produced -- and points at the
          #     consolidated job for what it cannot know.
          #
          # DELIBERATELY NOT A SECOND COPY OF THE CONTRACT
          #     No severity interpretation, no remediation, no gate verdict, no disposition. Those live in
          #     exactly one place. A contract implemented twice drifts twice, and this kit has the scars:
          #     fourteen Azure gitleaks rules and a flawfinder fix both lost to a second copy.
          #
          # THE ZERO RULE APPLIES HERE TOO
          #     A job that did not run, or produced no parseable SARIF, prints NOT ESTABLISHED. It never
          #     prints 0. Zero says someone looked.
          #
          # USAGE   scan_status <name> <execution> <sarif-or-empty> [scope]
          scan_status() {
            _name="$1"; _exec="$2"; _sarif="${3:-}"; _scope="${4:-}"
            _out="${GITHUB_STEP_SUMMARY:-/dev/stdout}"

            _n="NOT ESTABLISHED"; _sar="NOT GENERATED"
            if [ -n "$_sarif" ] && [ -s "$_sarif" ]; then
              # suppression: FAILURE_ISOLATION_WITH_STATE_CAPTURE -- jq's failure IS the signal here, and
              # it is captured rather than swallowed: a non-zero exit takes the else branch and reports
              # INVALID plus "count unavailable from current parser". stderr is silenced because the parse
              # error text is not useful in a summary block; the STATE survives and is published. If this
              # fails in a way other than "not valid SARIF" -- jq missing, file unreadable -- the result is
              # the same and is still not a clean zero, which is the outcome that matters.
              if _c=$(jq '[.runs[].results[]] | length' "$_sarif" 2>/dev/null); then
                _sar="GENERATED"
                # Only a scanner that actually completed may report a count. A crashed run that happens to
                # have left a partial report behind must not publish a number from it.
                case "$_exec" in
                  COMPLETE) _n="$_c" ;;
                  *)        _n="NOT ESTABLISHED" ;;
                esac
              else
                # A file that is not valid SARIF is a collection failure wearing a report's clothes.
                _sar="INVALID"
                _n="PRESENT -- count unavailable from current parser"
              fi
            fi

            {
              printf '### %s\n\n' "$_name"
              printf '| | |\n|---|---|\n'
              printf '| Execution | %s |\n' "$_exec"
              [ -n "$_scope" ] && printf '| Scope | %s |\n' "$_scope"
              printf '| Findings | %s |\n' "$_n"
              printf '| SARIF | %s |\n' "$_sar"
              printf '\n'
              if [ "$_n" = "NOT ESTABLISHED" ]; then
                printf 'This is not zero. Nothing usable was collected for this scope in this run.\n\n'
              fi
              printf 'Severity breakdown, remediation, gate impact and disposition are in the\n'
              printf '**Security scan report** job, which sees every scanner at once and can tell\n'
              printf 'when two tools are describing the same condition.\n\n'
            } >> "$_out"

            printf '%s: execution=%s findings=%s sarif=%s\n' "$_name" "$_exec" "$_n" "$_sar"
          }

          SCAN_STATUS_SH
          . /tmp/scan_status.sh
          if [ "$JOB_STATUS" = "success" ]; then _e=COMPLETE; else _e=FAILED; fi
          scan_status "Malicious packages" "$_e" "" "dependency provenance"
      # END SCAN_STATUS

  sbom:
    needs: [discover]
    name: SBOM (CycloneDX)
    if: inputs.enable_sbom
    runs-on: ubuntu-latest
    # Bounded so a stalled dependency cannot bill six hours (LM-001: unbounded execution
    # converts a dependency failure into uncontrolled cost).
    # NOT YET: a timeout still surfaces as a plain job failure. It SHOULD classify as
    # UNAVAILABLE / EXECUTION_TIMEOUT — cost is bounded here, semantics are not. See
    # docs/roadmap/FUTURE_WORK.md. Do not let this comment imply the mapping exists.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Generate SBOM with Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          syft dir:. -o cyclonedx-json=sbom.cyclonedx.json -o spdx-json=sbom.spdx.json
      - name: Summarize
        run: |
          python - <<'PY'
          import json
          d=json.load(open('sbom.cyclonedx.json'))
          c=d.get('components',[])
          print(f"components: {len(c)}")
          with open('sbom-summary.txt','w') as f: f.write(f"components: {len(c)}\n")
          PY
          cat sbom-summary.txt >> "$GITHUB_STEP_SUMMARY"

      # THE SBOM ALREADY KNEW. CycloneDX and SPDX both carry per-component licence data; the
      # kit generated both, uploaded both, and read neither. "We produce an SBOM" was true and
      # answered nothing -- the licence question, the one an SBOM is most often asked, went to
      # an artifact nobody opened. Producer with no consumer, third instance in one day.
      - name: Dependency licences
        if: always()
        shell: bash
        env:
          DENY: ${{ inputs.license_deny }}
        run: |
          # BEGIN SBOM_LICENSES — generated from scripts/sbom_licenses.py. DO NOT EDIT HERE.
          cat > /tmp/sbom_licenses.py <<'SBOM_LICENSES_PY'
          #!/usr/bin/env python3
          """Read the licences the SBOM already recorded. Free, local, no network.

          WHY THIS EXISTS
              syft emits CycloneDX and SPDX, and BOTH carry per-component licence data. The kit generated
              them, uploaded them, and read neither. "We produce an SBOM" was true and answered nothing:
              the licence question, the one an SBOM is most often asked to answer, went to an artifact
              nobody opened.

              That is the producer-with-no-consumer shape, three times in one day -- collection time with
              no requirement consumer, worksheet dataset identity with no family consumer, and this.
              Generating an artifact is not a capability. Reading it is.

          WHAT IT ESTABLISHES, AND WHAT IT DOES NOT
              It reports what the SBOM SAYS. It does not audit licence compliance, it cannot tell you
              whether a declared licence is correct, and it has no opinion about which licences are
              acceptable -- that is a policy decision belonging to the consumer, supplied as a denylist.

              NO LICENCE DECLARED is reported separately and deliberately. It is not "permissive by
              default"; it is unestablished, and in most jurisdictions an unlicensed dependency is the
              MORE restrictive case rather than the less.

          USAGE
              python3 sbom_licenses.py sbom.cyclonedx.json [--deny GPL-3.0,AGPL-3.0] [--out licences.json]
              python3 sbom_licenses.py --self-test

          EXIT
              0  inventory written      1  denied licence present      2  self-test failed
          """
          import argparse
          import io
          import json
          import os
          import sys


          def components(doc):
              """CycloneDX and SPDX carry the same facts under different names. Handle both rather than
              silently reading one and reporting a total that means 'the half I understood'."""
              out = []
              for c in (doc.get('components') or []):                      # CycloneDX
                  lic = []
                  for entry in (c.get('licenses') or []):
                      node = entry.get('license') or {}
                      v = node.get('id') or node.get('name') or entry.get('expression')
                      if v:
                          lic.append(str(v))
                  out.append({'name': c.get('name') or '?', 'version': c.get('version') or '',
                              'licenses': sorted(set(lic)), 'purl': c.get('purl') or ''})
              for p in (doc.get('packages') or []):                        # SPDX
                  lic = []
                  for k in ('licenseConcluded', 'licenseDeclared'):
                      v = p.get(k)
                      if v and v not in ('NOASSERTION', 'NONE'):
                          lic.append(str(v))
                  out.append({'name': p.get('name') or '?',
                              'version': p.get('versionInfo') or '',
                              'licenses': sorted(set(lic)),
                              'purl': ''})
              return out


          def assess(comps, deny):
              denied, undeclared, inventory = [], [], {}
              dl = [d.strip().upper() for d in deny if d.strip()]
              for c in comps:
                  if not c['licenses']:
                      undeclared.append(c)
                      continue
                  for lic in c['licenses']:
                      inventory[lic] = inventory.get(lic, 0) + 1
                      # Substring match, deliberately: a denylist entry of GPL-3.0 should catch
                      # "GPL-3.0-only" and "GPL-3.0-or-later" rather than requiring every spelling.
                      if any(d in lic.upper() for d in dl):
                          denied.append((c, lic))
              return denied, undeclared, inventory


          def self_test():
              fails = []
              cdx = {'components': [
                  {'name': 'a', 'version': '1.0', 'licenses': [{'license': {'id': 'MIT'}}]},
                  {'name': 'b', 'version': '2.0', 'licenses': [{'license': {'name': 'GPL-3.0-only'}}]},
                  {'name': 'c', 'version': '3.0'},
              ]}
              spdx = {'packages': [
                  {'name': 'd', 'versionInfo': '1', 'licenseDeclared': 'Apache-2.0'},
                  {'name': 'e', 'versionInfo': '2', 'licenseDeclared': 'NOASSERTION'},
              ]}
              c1 = components(cdx)
              if len(c1) != 3:
                  fails.append('CycloneDX components lost (%d of 3)' % len(c1))
              c2 = components(spdx)
              if len(c2) != 2:
                  fails.append('SPDX packages lost (%d of 2)' % len(c2))
              # NOASSERTION is not a licence. Treating it as one would report a component as licensed.
              if [c for c in c2 if c['name'] == 'e'][0]['licenses']:
                  fails.append('NOASSERTION was read as a declared licence')

              denied, undeclared, inv = assess(c1, ['GPL-3.0'])
              if len(denied) != 1:
                  fails.append('denylist did not match GPL-3.0-only from a GPL-3.0 entry')
              if len(undeclared) != 1:
                  fails.append('a component with no licence was not reported separately')
              if inv.get('MIT') != 1:
                  fails.append('inventory count wrong')
              # An empty denylist must deny nothing -- and must NOT match everything via empty substring.
              d2, _u, _i = assess(c1, [''])
              if d2:
                  fails.append('an empty denylist denied something -- empty substring matches everything')
              if fails:
                  print('SELF-TEST FAILED:')
                  for f in fails:
                      print('  - %s' % f)
                  return False
              print('self-test ok: reads CycloneDX and SPDX, NOASSERTION is not a licence, undeclared is '
                    'its own state, empty denylist denies nothing')
              return True


          def main():
              ap = argparse.ArgumentParser()
              ap.add_argument('sbom', nargs='*')
              ap.add_argument('--deny', default='')
              ap.add_argument('--out', default='')
              ap.add_argument('--self-test', action='store_true')
              a = ap.parse_args()
              if a.self_test:
                  return 0 if self_test() else 2
              if not self_test():
                  return 2

              comps = []
              read = []
              for p in a.sbom:
                  if not os.path.exists(p) or os.path.getsize(p) == 0:
                      continue
                  try:
                      comps += components(json.load(io.open(p, encoding='utf-8', errors='replace')))
                      read.append(os.path.basename(p))
                  except (ValueError, IOError) as e:
                      print('::warning title=Unreadable SBOM::%s (%s) -- its components are NOT included '
                            'in the counts below.' % (p, type(e).__name__))
              if not read:
                  print('no readable SBOM supplied; licence state NOT ESTABLISHED')
                  return 0

              denied, undeclared, inv = assess(comps, a.deny.split(','))
              out = os.environ.get('GITHUB_STEP_SUMMARY', '')
              L = ['### Dependency licences', '',
                   'Read from: %s' % ', '.join(read), '',
                   '| | |', '|---|---|',
                   '| Components | %d |' % len(comps),
                   '| Distinct licences | %d |' % len(inv),
                   '| No licence declared | %d |' % len(undeclared),
                   '| Denied by policy | %d |' % len(denied), '']
              if inv:
                  L += ['| Licence | Components |', '|---|---|']
                  for k in sorted(inv, key=lambda x: -inv[x])[:15]:
                      L.append('| %s | %d |' % (k, inv[k]))
                  L.append('')
              if denied:
                  L += ['**DENIED BY POLICY**', '']
                  for c, lic in denied[:20]:
                      L.append('- `%s@%s` — %s' % (c['name'], c['version'], lic))
                  L.append('')
              if undeclared:
                  L += ['**NO LICENCE DECLARED — %d component(s)**' % len(undeclared), '',
                        'Not "permissive by default". The licence is UNESTABLISHED, and an unlicensed',
                        'dependency is usually the more restrictive case rather than the less.', '']
                  for c in undeclared[:15]:
                      L.append('- `%s@%s`' % (c['name'], c['version']))
                  L.append('')
              L += ['This reports what the SBOM SAYS. It does not audit compliance and cannot tell you',
                    'whether a declared licence is correct.']
              text = '\n'.join(L)
              print(text)
              if out:
                  with io.open(out, 'a', encoding='utf-8') as fh:
                      fh.write(text + '\n\n')
              if a.out:
                  json.dump({'components': len(comps), 'inventory': inv,
                             'undeclared': [c['name'] for c in undeclared],
                             'denied': [{'name': c['name'], 'licence': l} for c, l in denied]},
                            io.open(a.out, 'w', encoding='utf-8'), indent=1)
              return 1 if denied else 0


          if __name__ == '__main__':
              sys.exit(main())

          SBOM_LICENSES_PY
          # END SBOM_LICENSES
          # suppression: FAILURE_ISOLATION_WITH_STATE_CAPTURE -- a denied licence exits 1 and
          # that verdict belongs to the gate, not to this step. The finding is printed and
          # published either way; only the block is withheld here. Detection is never what
          # gets turned off.
          python3 /tmp/sbom_licenses.py sbom.cyclonedx.json sbom.spdx.json \
            ${DENY:+--deny "$DENY"} || true

      # BEGIN REDACT_SARIF — generated from scripts/redact_sarif.py. DO NOT EDIT HERE.
      - name: Redact credential material before upload
        if: always()
        shell: bash
        run: |
          cat > /tmp/redact_sarif.py <<'REDACT_SARIF_PY'
          #!/usr/bin/env python3
          """Strip credential material from a SARIF file IN PLACE, before it becomes an artifact.

          WHY THIS EXISTS
              The kit redacted exactly one scanner. gitleaks ran with --redact and had `snippet` and
              `partialFingerprints` stripped before upload. Thirteen other jobs uploaded raw SARIF, and
              several of those scanners embed matched source by design:

                  bandit    B105 hardcoded_password_string -- the snippet IS the password
                  semgrep   snippet carries the matched source line
                  trivy     secret mode reports the match
                  checkov   includes the offending code block
                  gosec     includes the offending line

              An artifact is downloadable by anyone with repository read access and is retained for
              weeks. Redacting the rendered summary while shipping the raw value in a downloadable file
              is theatre -- it moves the credential from a page someone reads to a file someone opens.

              The consolidated report job made it worse by copying every SARIF into one artifact.

          WHAT SURVIVES, WHICH IS EVERYTHING NEEDED TO FIX THE FINDING
              rule id, severity, FILE, LINE, message with credential-shaped substrings masked to a short
              prefix. What is removed: `snippet`, `contextRegion.snippet`, and `partialFingerprints`
              (which for a secret scanner can be a hash of the secret itself).

          IT IS NOT A SUBSTITUTE FOR --redact AT THE SCANNER
              Defence in depth. A scanner that can be told not to emit the value should be told. This
              catches the ones that cannot, and the ones a consumer adds later.

          USAGE
              python3 redact_sarif.py <file.sarif> [more.sarif ...]
              python3 redact_sarif.py --self-test

          EXIT
              0 rewritten (or nothing to do)      1 a file was unreadable      2 self-test failed
          """
          import io
          import json
          import os
          import re
          import sys

          # BEGIN SECRET_PATTERNS -- must stay identical to scripts/scan_report.py.
          # Two copies exist because each file is inlined into the workflow separately and neither can
          # import the other at consumer runtime. tests/check_redaction_parity.py fails the build if they
          # diverge, so the duplication is an enforced invariant rather than a hope -- the same treatment
          # the SARIF normalizer gets for the same reason.
          SECRET_PATTERNS = [
              (re.compile(r'-----BEGIN[A-Z ]*PRIVATE KEY-----'), 'private-key'),
              (re.compile(r'\bAKIA[0-9A-Z]{16}\b'), 'aws-access-key-id'),
              (re.compile(r'\bgh[pousr]_[A-Za-z0-9]{16,}'), 'github-token'),
              (re.compile(r'\bxox[baprs]-[A-Za-z0-9-]{10,}'), 'slack-token'),
              (re.compile(r'\beyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}'), 'jwt'),
              (re.compile(r'\b[A-Za-z0-9~._-]{3}8Q~[A-Za-z0-9~._-]{31,34}\b'), 'entra-client-secret'),
              (re.compile(r'(?i)\b(?:AccountKey|SharedAccessKey|password|pwd|secret|token|api[_-]?key)'
                          r'\s*[:=]\s*["\']?([^\s;,"\'&]{8,})'), 'keyed-value'),
              (re.compile(r'\b[A-Za-z0-9+/]{32,}={0,2}(?![A-Za-z0-9+/=])'), 'high-entropy'),
              (re.compile(r'\b[0-9a-fA-F]{32,}\b'), 'hex-or-digest'),
          ]


          def _mask(value, label):
              keep = value[:4]
              return '%s%s [redacted: %s, %d chars]' % (keep, '*' * min(len(value) - len(keep), 18),
                                                        label, len(value))


          REDACTED_MARK = '[redacted: '


          def redact(text):
              """Mask anything that looks like credential material. Returns the safe string.

              IDEMPOTENT, which is not free. Masking `password: AKIAIOSFODNN7EXAMPLE` produces
              `password: AKIA**************** [redacted: ...]`, and that output STILL matches the
              keyed-value pattern -- so a second pass masked the mask, and a third masked that. It
              matters because a SARIF can legitimately be redacted twice: once in the scanner job before
              upload, once in the consolidated report after download. Non-idempotent redaction would
              corrupt the text on the second pass and make the finding unreadable.
              """
              if not text:
                  return text
              out = text
              for pat, label in SECRET_PATTERNS:
                  def _sub(m, _l=label):
                      whole = m.group(0)
                      v = m.group(1) if m.groups() and m.group(1) else whole
                      if len(v) < 8 or REDACTED_MARK in whole or '****' in v:
                          return whole
                      return whole.replace(v, _mask(v, _l))
                  out = pat.sub(_sub, out)
              return out
          # END SECRET_PATTERNS


          def scrub(doc):
              """-> (snippets_removed, messages_masked). Mutates doc."""
              snips = masked = 0
              for run in (doc.get('runs') or []):
                  for res in (run.get('results') or []):
                      msg = ((res.get('message') or {}).get('text'))
                      if msg:
                          r = redact(msg)
                          if r != msg:
                              res['message']['text'] = r
                              masked += 1
                      for loc in (res.get('locations') or []) + (res.get('relatedLocations') or []):
                          pl = (loc.get('physicalLocation') or {})
                          for key in ('region', 'contextRegion'):
                              reg = pl.get(key) or {}
                              if 'snippet' in reg:
                                  reg.pop('snippet', None)
                                  snips += 1
                      # A partial fingerprint from a secret scanner can be a hash OF THE SECRET, which is
                      # an offline-guessable artifact for anything low-entropy. It buys correlation that
                      # this kit gets from file+rule instead.
                      if res.pop('partialFingerprints', None) is not None:
                          snips += 1
                      for cf in (res.get('codeFlows') or []):
                          for tf in (cf.get('threadFlows') or []):
                              for lo in (tf.get('locations') or []):
                                  pl = ((lo.get('location') or {}).get('physicalLocation') or {})
                                  for key in ('region', 'contextRegion'):
                                      reg = pl.get(key) or {}
                                      if 'snippet' in reg:
                                          reg.pop('snippet', None)
                                          snips += 1
              return (snips, masked)


          def self_test():
              fails = []
              doc = {'version': '2.1.0', 'runs': [{'tool': {'driver': {'name': 'bandit'}}, 'results': [
                  {'ruleId': 'B105', 'level': 'error',
                   'message': {'text': 'Possible hardcoded password: AKIAIOSFODNN7EXAMPLE'},
                   'partialFingerprints': {'x': 'deadbeef'},
                   'locations': [{'physicalLocation': {
                       'artifactLocation': {'uri': 'app/config.py'},
                       'region': {'startLine': 12,
                                  'snippet': {'text': 'PASSWORD = "AKIAIOSFODNN7EXAMPLE"'}},
                       'contextRegion': {'snippet': {'text': 'ctx AKIAIOSFODNN7EXAMPLE'}}}}]}]}]}
              snips, masked = scrub(doc)
              blob = json.dumps(doc)
              if 'AKIAIOSFODNN7EXAMPLE' in blob:
                  fails.append('a credential survived scrub()')
              if 'app/config.py' not in blob or '12' not in blob:
                  fails.append('scrub() destroyed the file/line needed to fix it')
              if 'AKIA' not in blob:
                  fails.append('scrub() removed the prefix identifying WHICH credential')
              if snips < 3:
                  fails.append('snippet/contextRegion/partialFingerprints not all removed (%d)' % snips)
              if masked != 1:
                  fails.append('message was not masked')
              # Idempotent: running twice must not double-mask or crash.
              s2, m2 = scrub(doc)
              if (s2, m2) != (0, 0):
                  fails.append('scrub() is not idempotent (%d,%d on second pass)' % (s2, m2))
              # A clean report must come through untouched.
              clean = {'runs': [{'results': [{'ruleId': 'X', 'message': {'text': 'unused import os'},
                                              'locations': [{'physicalLocation': {
                                                  'artifactLocation': {'uri': 'a.py'},
                                                  'region': {'startLine': 1}}}]}]}]}
              before = json.dumps(clean)
              scrub(clean)
              if json.dumps(clean) != before:
                  fails.append('a clean finding was altered')
              if fails:
                  print('SELF-TEST FAILED:')
                  for f in fails:
                      print('  - %s' % f)
                  return False
              print('self-test ok: credential masked, snippet/contextRegion/partialFingerprints removed, '
                    'file and line preserved, idempotent, clean findings untouched')
              return True


          def main():
              argv = [a for a in sys.argv[1:] if not a.startswith('-')]
              if '--self-test' in sys.argv:
                  return 0 if self_test() else 2
              if not self_test():
                  print('ABORTING -- a redactor that cannot prove it redacts is worse than none.')
                  return 2
              rc = 0
              for p in argv:
                  if not os.path.exists(p) or os.path.getsize(p) == 0:
                      print('  %s: absent or empty, nothing to redact' % p)
                      continue
                  try:
                      doc = json.load(io.open(p, encoding='utf-8', errors='replace'))
                  except (ValueError, IOError) as e:
                      # A SARIF that cannot be parsed cannot be redacted, and must NOT be uploaded on the
                      # assumption that it is probably fine. Emptying it loses nothing a reader could
                      # have used -- an unparseable report establishes nothing either way -- and it
                      # cannot leak what it was carrying.
                      print('::warning title=Unredactable SARIF::%s could not be parsed (%s); it is '
                            'replaced with an empty report rather than uploaded unexamined.'
                            % (p, type(e).__name__))
                      io.open(p, 'w', encoding='utf-8').write(
                          json.dumps({'version': '2.1.0', 'runs': [],
                                      '_redaction': 'ORIGINAL UNPARSEABLE - WITHHELD'}))
                      rc = 1
                      continue
                  snips, masked = scrub(doc)
                  json.dump(doc, io.open(p, 'w', encoding='utf-8'))
                  print('  %s: %d snippet/fingerprint field(s) removed, %d message(s) masked'
                        % (os.path.basename(p), snips, masked))
              return rc


          if __name__ == '__main__':
              sys.exit(main())

          REDACT_SARIF_PY
          shopt -s nullglob globstar
          files=( *.sarif **/*.sarif )
          if [ ${#files[@]} -eq 0 ]; then
            echo "no SARIF produced by this job -- nothing to redact"
          else
            python3 /tmp/redact_sarif.py "${files[@]}"
          fi
      # END REDACT_SARIF
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: |
            sbom.cyclonedx.json
            sbom.spdx.json
          retention-days: 90

  # ─────────────────────────────────────────────────────────────────────────
  # REPORT — the run's work surface, for security and engineering at once
  # ─────────────────────────────────────────────────────────────────────────
  #
  # Before this job existed, of sixteen scanner jobs six wrote a step-summary block, nine emitted
  # only a log annotation, one printed nothing, and THREE reported a findings count. A reviewer
  # could not tell a clean scan from a scan that never happened without opening the job, and an
  # engineer could not act without downloading artifacts.
  #
  # WHY ONE JOB AND NOT SIXTEEN REPORTING STEPS
  #
  #   (1) A contract implemented in sixteen places drifts in sixteen places. This kit has already
  #       lost fourteen Azure gitleaks rules and a flawfinder fix to exactly that, and carries
  #       "one truth in three places" in its LANDMINES register. Each scanner establishes only
  #       what it alone can know; interpretation happens once.
  #
  #   (2) Deduplication and correlation are only possible where every finding is visible at once.
  #       Trivy, Checkov and CodeQL will each report the same exposed storage account. Sixteen
  #       reporters holding one SARIF each cannot see that, and will raise three tickets and three
  #       risk acceptances for one condition.
  #
  # STATE IS DERIVED FROM `needs.<job>.result`, NOT FROM SIXTEEN NEW STEPS. That is already the
  # gate's source of truth, so the report and the gate cannot disagree about what ran.
  #
  # `if: always()` is essential. A report that only runs when the scanners succeeded is a report
  # that disappears exactly when someone needs to know what happened.

      # BEGIN SCAN_STATUS — generated from scripts/scan_status.sh. DO NOT EDIT HERE.
      - name: Result summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          cat > /tmp/scan_status.sh <<'SCAN_STATUS_SH'
          #!/usr/bin/env bash
          # Short per-job result block. Runs at the end of every scanner job.
          #
          # WHY THIS EXISTS ALONGSIDE THE CONSOLIDATED REPORT
          #     The consolidated `report` job owns normalisation, cross-scanner dedupe, correlation,
          #     remediation detail and disposition, because those are only possible where every finding is
          #     visible at once. That is not a reason for a scanner job to stay silent.
          #
          #     Someone debugging Semgrep is IN the Semgrep job. Making them leave it to discover whether it
          #     found anything is how "the pipeline is noise" becomes true. So the scanner prints what it
          #     alone knows -- did it run, how many findings, was SARIF produced -- and points at the
          #     consolidated job for what it cannot know.
          #
          # DELIBERATELY NOT A SECOND COPY OF THE CONTRACT
          #     No severity interpretation, no remediation, no gate verdict, no disposition. Those live in
          #     exactly one place. A contract implemented twice drifts twice, and this kit has the scars:
          #     fourteen Azure gitleaks rules and a flawfinder fix both lost to a second copy.
          #
          # THE ZERO RULE APPLIES HERE TOO
          #     A job that did not run, or produced no parseable SARIF, prints NOT ESTABLISHED. It never
          #     prints 0. Zero says someone looked.
          #
          # USAGE   scan_status <name> <execution> <sarif-or-empty> [scope]
          scan_status() {
            _name="$1"; _exec="$2"; _sarif="${3:-}"; _scope="${4:-}"
            _out="${GITHUB_STEP_SUMMARY:-/dev/stdout}"

            _n="NOT ESTABLISHED"; _sar="NOT GENERATED"
            if [ -n "$_sarif" ] && [ -s "$_sarif" ]; then
              # suppression: FAILURE_ISOLATION_WITH_STATE_CAPTURE -- jq's failure IS the signal here, and
              # it is captured rather than swallowed: a non-zero exit takes the else branch and reports
              # INVALID plus "count unavailable from current parser". stderr is silenced because the parse
              # error text is not useful in a summary block; the STATE survives and is published. If this
              # fails in a way other than "not valid SARIF" -- jq missing, file unreadable -- the result is
              # the same and is still not a clean zero, which is the outcome that matters.
              if _c=$(jq '[.runs[].results[]] | length' "$_sarif" 2>/dev/null); then
                _sar="GENERATED"
                # Only a scanner that actually completed may report a count. A crashed run that happens to
                # have left a partial report behind must not publish a number from it.
                case "$_exec" in
                  COMPLETE) _n="$_c" ;;
                  *)        _n="NOT ESTABLISHED" ;;
                esac
              else
                # A file that is not valid SARIF is a collection failure wearing a report's clothes.
                _sar="INVALID"
                _n="PRESENT -- count unavailable from current parser"
              fi
            fi

            {
              printf '### %s\n\n' "$_name"
              printf '| | |\n|---|---|\n'
              printf '| Execution | %s |\n' "$_exec"
              [ -n "$_scope" ] && printf '| Scope | %s |\n' "$_scope"
              printf '| Findings | %s |\n' "$_n"
              printf '| SARIF | %s |\n' "$_sar"
              printf '\n'
              if [ "$_n" = "NOT ESTABLISHED" ]; then
                printf 'This is not zero. Nothing usable was collected for this scope in this run.\n\n'
              fi
              printf 'Severity breakdown, remediation, gate impact and disposition are in the\n'
              printf '**Security scan report** job, which sees every scanner at once and can tell\n'
              printf 'when two tools are describing the same condition.\n\n'
            } >> "$_out"

            printf '%s: execution=%s findings=%s sarif=%s\n' "$_name" "$_exec" "$_n" "$_sar"
          }

          SCAN_STATUS_SH
          . /tmp/scan_status.sh
          if [ "$JOB_STATUS" = "success" ]; then _e=COMPLETE; else _e=FAILED; fi
          scan_status "SBOM" "$_e" "" "components"
      # END SCAN_STATUS

  report:
    name: Security scan report
    needs: [discover, secret-scan, code-quality, sast-semgrep, sast-bandit, codeql,
            deps-scan, iac-scan, sast-dotnet, sast-java, sast-go, sast-cpp, malicious-deps, sbom]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Collect every SARIF this run produced
        uses: actions/download-artifact@v8
        # suppression: FAILURE_ISOLATION_WITH_STATE_CAPTURE -- with `if: always()` this job
        # runs even when every scanner was skipped, and
        # download-artifact fails when no artifact matches the pattern. Failing here would delete
        # the report in precisely the case it is needed -- a run that collected nothing. What was
        # and was not collected is established per scanner from `needs.*.result` below, so a
        # missing download degrades the report to NOT ESTABLISHED rather than to silence.
        continue-on-error: true
        with:
          pattern: sarif-*
          path: _sarif
          merge-multiple: true

      - name: Build per-scanner state
        env:
          # EVERY VALUE ARRIVES AS DATA, NEVER AS SCRIPT TEXT.
          #
          # These are workflow-controlled strings and most could not plausibly carry shell syntax.
          # They go through `env:` regardless, because a ticket-reference gate reviewed during this
          # kit's development was interpolating a PR body straight into a `run:` block -- executable
          # by anyone who could open a pull request, and silently truncating at the first double
          # quote, so it reported a reference absent from text it had never received. Deciding case
          # by case which inputs are "safe enough" is how that happens. The rule is the whole control.
          R_SECRET: ${{ needs.secret-scan.result }}
          R_QUALITY: ${{ needs.code-quality.result }}
          R_SEMGREP: ${{ needs.sast-semgrep.result }}
          R_BANDIT: ${{ needs.sast-bandit.result }}
          R_CODEQL: ${{ needs.codeql.result }}
          R_DEPS: ${{ needs.deps-scan.result }}
          R_IAC: ${{ needs.iac-scan.result }}
          R_DOTNET: ${{ needs.sast-dotnet.result }}
          R_JAVA: ${{ needs.sast-java.result }}
          R_GO: ${{ needs.sast-go.result }}
          R_CPP: ${{ needs.sast-cpp.result }}
          R_MALDEPS: ${{ needs.malicious-deps.result }}
          R_SBOM: ${{ needs.sbom.result }}
          R_IMAGE: ${{ needs.image-scan.result }}
          IMAGE_REF: ${{ inputs.image_ref }}
          D_PYTHON: ${{ needs.discover.outputs.python }}
          D_NODE: ${{ needs.discover.outputs.node }}
          D_GO: ${{ needs.discover.outputs.go }}
          D_DOTNET: ${{ needs.discover.outputs.dotnet }}
          D_JAVA: ${{ needs.discover.outputs.java }}
          D_CPP: ${{ needs.discover.outputs.cpp }}
          D_IAC: ${{ needs.discover.outputs.iac }}
          D_STATE: ${{ needs.discover.outputs.state }}
          P_CODESCAN: ${{ needs.discover.outputs.code_scanning }}
          P_SOURCE: ${{ needs.discover.outputs.platform_source }}
        run: |
          set -uo pipefail
          mkdir -p _states
          # suppression: FAILURE_ISOLATION_WITH_STATE_CAPTURE -- a run where NO scanner
          # produced SARIF is a legitimate state -- every
          # ecosystem absent, or every scanner unlicensed. The copy failing here must not abort
          # the report, because a run with nothing collected is exactly the run whose report
          # matters most. Absence is carried forward as NOT ESTABLISHED per scanner below, which
          # is louder than a failed job would have been.
          cp -f _sarif/*.sarif _states/ 2>/dev/null || true
          # suppression: PRESENTATION_ONLY -- listing is diagnostic output for the log. An empty directory is
          # information, not an error, and is reported properly by the renderer.
          ls -1 _states/ || true

          # applicability(<language-gate>) -> APPLICABLE | NOT_APPLICABLE | UNKNOWN
          #
          # DISCOVERY FAILURE MUST NOT BECOME "NOT APPLICABLE". If the survey could not run, the
          # honest answer is that nobody knows whether this ecosystem is present -- which is
          # UNKNOWN, and downstream is reported as unestablished scope. Turning a failure to
          # observe into a confident negative is the inversion this pipeline exists to prevent.
          appl() {
            if [ "$D_STATE" = "DISCOVERY_UNAVAILABLE" ]; then printf 'UNKNOWN'; return; fi
            [ "$1" = "true" ] && printf 'APPLICABLE' || printf 'NOT_APPLICABLE'
          }

          # A job conclusion is not an execution state. `skipped` in particular collapses
          # "not licensed", "switched off", "nothing to scan" and "an earlier job failed" into
          # one word, which is why applicability is established separately above.
          exec_of() {
            case "$1" in
              success)   printf 'COMPLETE' ;;
              failure)   printf 'FAILED' ;;
              cancelled) printf 'NOT_RUN' ;;
              skipped)   printf 'NOT_RUN' ;;
              *)         printf 'NOT_RUN' ;;
            esac
          }

          # sarif_for <basename-glob> -- the first matching report, or empty.
          sarif_for() {
            for f in _states/$1; do [ -f "$f" ] && { printf '%s' "${f#_states/}"; return; }; done
            printf ''
          }

          add() {
            # add <scanner> <applicability> <job-result> <scope> <sarif-glob>
            _s=$(sarif_for "$5")
            _up=UNKNOWN
            [ -n "$_s" ] && _up=COMPLETE
            [ -z "$_s" ] && _up=NONE
            _art=RETAINED
            [ -z "$_s" ] && _art=NONE
            jq -n --arg sc "$1" --arg ap "$2" --arg ex "$(exec_of "$3")" \
                  --arg sp "$4" --arg sa "$_s" --arg ar "$_art" --arg up "$_up" \
                  --arg gt "$(exec_of "$3")" \
              '{scanner:$sc, applicability:$ap, execution:$ex, scope:$sp,
                sarif:$sa, artifact:$ar, upload:$up,
                gate:(if $gt=="COMPLETE" then "PASS" else "UNDETERMINED" end)}' \
              > "_states/state-$1.json"
          }

          add "gitleaks"     APPLICABLE          "$R_SECRET"  "whole repository"        'gitleaks*.sarif'
          add "code-quality" APPLICABLE          "$R_QUALITY" "linters"                 'quality*.sarif'
          add "semgrep"      APPLICABLE          "$R_SEMGREP" "source"                  'semgrep*.sarif'
          add "bandit"       "$(appl "$D_PYTHON")" "$R_BANDIT" "python"                 'bandit*.sarif'
          add "trivy"        APPLICABLE          "$R_DEPS"    "dependencies"            'trivy*.sarif'
          add "checkov"      "$(appl "$D_IAC")"  "$R_IAC"     "infrastructure as code"  'checkov*.sarif'
          add "dotnet-vuln"  "$(appl "$D_DOTNET")" "$R_DOTNET" "dotnet"                 'dotnet*.sarif'
          add "java-sast"    "$(appl "$D_JAVA")" "$R_JAVA"    "java"                    'java*.sarif'
          add "gosec"        "$(appl "$D_GO")"   "$R_GO"      "go"                      'go*.sarif'
          add "flawfinder"   "$(appl "$D_CPP")"  "$R_CPP"     "c / c++"                 'flawfinder*.sarif'
          add "malicious-deps" APPLICABLE        "$R_MALDEPS" "dependency provenance"   'maldeps*.sarif'
          add "sbom"         APPLICABLE          "$R_SBOM"    "components"              'sbom*.sarif'
          # NOT_APPLICABLE when no image was supplied -- never a clean result. "We did not scan
          # an image because nobody named one" and "we scanned the image and it was fine" are
          # different statements, and only one of them is evidence.
          add "trivy-image" "$([ -n "$IMAGE_REF" ] && echo APPLICABLE || echo NOT_APPLICABLE)" \
                             "$R_IMAGE" "${IMAGE_REF:-no image configured}" 'trivy-image*.sarif'

          # CodeQL's applicability is a PLATFORM fact, established once in discovery, not a
          # language fact and not a guess made here. UNAVAILABLE and NOT_CONFIGURED send a
          # platform owner after a licence; NOT_APPLICABLE sends nobody anywhere; UNKNOWN says
          # plainly that the token could not see the answer. All four render as `skipped` in the
          # Actions UI, which is why none of them is inferred from the job conclusion.
          cq_appl="$P_CODESCAN"
          case "$cq_appl" in
            ENABLED) cq_appl=APPLICABLE ;;
            UNAVAILABLE|NOT_CONFIGURED) : ;;
            *) cq_appl=APPLICABLE ;;
          esac
          if [ "$D_PYTHON$D_NODE$D_GO$D_DOTNET$D_JAVA$D_CPP" = "falsefalsefalsefalsefalsefalse" ]; then
            cq_appl=NOT_APPLICABLE
          fi
          add "codeql" "$cq_appl" "$R_CODEQL" "compiled and interpreted source" 'codeql*.sarif'

          echo "built $(ls -1 _states/state-*.json | wc -l) scanner state file(s)"

      - name: Render the report
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -uo pipefail

          # BEGIN SCAN_REPORT — generated from scripts/scan_report.py. DO NOT EDIT HERE.
          cat > /tmp/scan_report.py <<'SCAN_REPORT_PY'
          #!/usr/bin/env python3
          """Turn scanner output into a work surface. Five sections, two audiences, no fabricated zeros.

          WHY THIS EXISTS
              Of sixteen scanner jobs in this kit, six wrote a step-summary block, nine emitted only a log
              annotation, one printed nothing, and THREE reported a findings count. A pipeline whose scanners
              say "completed" is a scoreboard. Security cannot tell whether collection can be trusted;
              engineering cannot tell what to fix without downloading five artifacts.

              Both audiences are served by one contract, because they need different halves of the same run:

                Security needs   what ran - whether collection is trustworthy - severity - gate result
                                 - where the evidence went - disposition state
                Engineering needs the exact thing that failed - file, component, line - fix version
                                 - recommended remediation - whether a ticket already exists
                                 - fix it, or request an exception

          THE SECTION THAT MATTERS MOST IS `ACTION REQUIRED`, AND IT IS SPLIT BY WHO CAN ACT
              A developer cannot enable GitHub Code Security. Telling them to "fix the pipeline" when the
              missing capability is an organisation-level licensing decision wastes their afternoon and
              teaches them the gate is noise. So developer action and platform action are separate fields and
              either may be NONE.

          THE MOST DANGEROUS NUMBER IN THIS FILE IS ZERO
              `Findings: 0` and `Findings: NOT ESTABLISHED` render almost identically to a tired reader at
              5pm, and mean opposite things. Zero says the scanner looked and the scope is clean. NOT
              ESTABLISHED says nobody looked. A scanner that was unlicensed, skipped, crashed or produced no
              parseable output must NEVER report 0 -- that is the CodeQL failure with a number attached, and
              it is the one thing this file's self-test refuses to let pass.

              Likewise a scanner whose output cannot be parsed reports
                  PRESENT -- count unavailable from current parser
              and never 0.

          WHAT IT CANNOT ESTABLISH
              It reads reports. It proves what the report says, never what is true of the environment. A
              clean SARIF from a scanner pointed at an empty directory is a clean SARIF. Applicability and
              scope are inputs here precisely so that a reader can see the denominator rather than infer it.

          USAGE
              python3 scan_report.py --scanner trivy --sarif trivy.sarif \\
                  --applicability APPLICABLE --execution COMPLETE --scope "filesystem + IaC" \\
                  [--dispositions .security/dispositions.json] [--gate FAIL] [--max-detail 20]

              python3 scan_report.py --self-test

          EXIT
              0 always for the report itself -- reporting is not gating. The gate reads job results.
              2 self-test failed
          """
          import argparse
          import datetime
          import hashlib
          import io
          import json
          import os
          import re
          import sys

          SEV_ORDER = ['CRITICAL', 'HIGH', 'MEDIUM', 'LOW', 'INFORMATIONAL']
          BLOCKING = ('CRITICAL', 'HIGH')

          # A scanner that did not produce a trustworthy result must not be able to report a count.
          # These are the states where "0 findings" would be a lie, not a measurement.
          NO_COUNT_STATES = ('NOT_RUN', 'FAILED', 'COLLECTION_FAILED')
          NO_COUNT_APPLIC = ('UNAVAILABLE', 'NOT_CONFIGURED', 'NOT_APPLICABLE')


          # ─────────────────────────────────────────────────────────────────────────────
          # REDACTION. Applied to every string this file prints, without exception.
          # ─────────────────────────────────────────────────────────────────────────────
          #
          # WHY THIS IS NOT ALREADY HANDLED UPSTREAM
          #     The kit runs gitleaks with --redact and then strips `snippet` and `partialFingerprints`
          #     from gitleaks.sarif. That is correct and it covers ONE scanner. This reporter prints
          #     messages from all sixteen. Semgrep can put matched source in a message; Trivy's secret
          #     mode, detect-secrets and anything a consumer adds have their own conventions. A reporter
          #     that faithfully echoes whatever a scanner wrote will eventually echo a live credential
          #     into a step summary and a run log -- both readable by anyone with repo read access, and
          #     both retained.
          #
          # WHAT A READER STILL GETS, WHICH IS EVERYTHING THEY NEED TO ACT
          #     the rule, the FILE, the LINE, the severity, the remediation, and a short prefix of the
          #     value so they can tell WHICH credential it is. Never the whole value.
          #
          #         Issue: AWS key AKIA****************** [redacted: aws-access-key-id, 20 chars]
          #
          #     Four characters identifies a secret to the person who owns it and is useless to anyone
          #     else. Length is kept because it distinguishes a token from a password.
          #
          # IT ERRS TOWARD OVER-REDACTING
          #     A 40-character git SHA or a package checksum will be masked. That costs a little
          #     readability. The opposite error publishes a credential. When the two are not symmetric,
          #     the guard does not sit in the middle.
          SECRET_PATTERNS = [
              (re.compile(r'-----BEGIN[A-Z ]*PRIVATE KEY-----'), 'private-key'),
              (re.compile(r'\bAKIA[0-9A-Z]{16}\b'), 'aws-access-key-id'),
              (re.compile(r'\bgh[pousr]_[A-Za-z0-9]{16,}'), 'github-token'),
              (re.compile(r'\bxox[baprs]-[A-Za-z0-9-]{10,}'), 'slack-token'),
              (re.compile(r'\beyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}'), 'jwt'),
              (re.compile(r'\b[A-Za-z0-9~._-]{3}8Q~[A-Za-z0-9~._-]{31,34}\b'), 'entra-client-secret'),
              (re.compile(r'(?i)\b(?:AccountKey|SharedAccessKey|password|pwd|secret|token|api[_-]?key)'
                          r'\s*[:=]\s*["\']?([^\s;,"\'&]{8,})'), 'keyed-value'),
              (re.compile(r'\b[A-Za-z0-9+/]{32,}={0,2}(?![A-Za-z0-9+/=])'), 'high-entropy'),
              (re.compile(r'\b[0-9a-fA-F]{32,}\b'), 'hex-or-digest'),
          ]


          def _mask(value, label):
              keep = value[:4]
              return '%s%s [redacted: %s, %d chars]' % (keep, '*' * min(len(value) - len(keep), 18),
                                                        label, len(value))


          REDACTED_MARK = '[redacted: '


          def redact(text):
              """Mask anything that looks like credential material. Returns the safe string.

              IDEMPOTENT, which is not free. Masking `password: AKIAIOSFODNN7EXAMPLE` produces
              `password: AKIA**************** [redacted: ...]`, and that output STILL matches the
              keyed-value pattern -- so a second pass masked the mask, and a third masked that. It
              matters because a SARIF can legitimately be redacted twice: once in the scanner job before
              upload, once in the consolidated report after download. Non-idempotent redaction would
              corrupt the text on the second pass and make the finding unreadable.
              """
              if not text:
                  return text
              out = text
              for pat, label in SECRET_PATTERNS:
                  def _sub(m, _l=label):
                      whole = m.group(0)
                      v = m.group(1) if m.groups() and m.group(1) else whole
                      if len(v) < 8 or REDACTED_MARK in whole or '****' in v:
                          return whole
                      return whole.replace(v, _mask(v, _l))
                  out = pat.sub(_sub, out)
              return out


          def severity_of(result, rules):
              """SARIF says almost nothing about severity directly. Derive it the way GitHub does.

              `properties.security-severity` is a CVSS-style number and is authoritative when present.
              Otherwise fall back to `level`, which only distinguishes error/warning/note. A scanner that
              supplies neither lands in INFORMATIONAL rather than being silently dropped -- an unclassified
              finding that disappears is worse than one filed too low.
              """
              props = (result.get('properties') or {})
              rid = result.get('ruleId') or ''
              rule = rules.get(rid) or {}
              ss = props.get('security-severity')
              if ss is None:
                  ss = ((rule.get('properties') or {}).get('security-severity'))
              if ss is not None:
                  try:
                      v = float(ss)
                      if v >= 9.0:
                          return 'CRITICAL'
                      if v >= 7.0:
                          return 'HIGH'
                      if v >= 4.0:
                          return 'MEDIUM'
                      if v > 0:
                          return 'LOW'
                      return 'INFORMATIONAL'
                  except (TypeError, ValueError):
                      pass
              lvl = (result.get('level') or (rule.get('defaultConfiguration') or {}).get('level') or '')
              return {'error': 'HIGH', 'warning': 'MEDIUM', 'note': 'LOW',
                      'none': 'INFORMATIONAL'}.get(str(lvl).lower(), 'MEDIUM')


          def location_of(result):
              locs = result.get('locations') or []
              if not locs:
                  return ('', 0)
              pl = (locs[0].get('physicalLocation') or {})
              uri = ((pl.get('artifactLocation') or {}).get('uri') or '')
              line = ((pl.get('region') or {}).get('startLine') or 0)
              return (uri, line)


          def fingerprint(scanner, rule_id, uri, message):
              """Stable identity for a finding across runs.

              Deliberately EXCLUDES the line number. Code moves; a finding that shifts down three lines
              because someone added an import is the same finding, and a fingerprint that changed would
              orphan its tracking item and its risk acceptance on every unrelated edit. That is how disposition
              systems quietly stop working: not by failing, but by losing track of what was already decided.
              """
              norm = re.sub(r'\d+', '#', (message or ''))[:200]
              raw = '|'.join([scanner, rule_id or '', uri or '', norm])
              return hashlib.sha256(raw.encode('utf-8', 'replace')).hexdigest()[:12]


          def remediation_of(result, rules):
              """A recommended action, or an honest absence. Never invented."""
              props = (result.get('properties') or {})
              rid = result.get('ruleId') or ''
              rule = rules.get(rid) or {}
              fixed = props.get('fixed_version') or props.get('fixedVersion')
              pkg = props.get('package') or props.get('pkgName')
              if fixed and pkg:
                  return 'Upgrade %s -> %s' % (pkg, fixed)
              if fixed:
                  return 'Upgrade to %s' % fixed
              fixes = result.get('fixes') or []
              if fixes:
                  d = ((fixes[0].get('description') or {}).get('text') or '').strip()
                  if d:
                      return d.split('\n')[0][:200]
              for src in (rule.get('help') or {}, rule.get('fullDescription') or {}):
                  t = (src.get('text') or '').strip()
                  if t:
                      return t.split('\n')[0][:200]
              return ''


          def parse_sarif(path, scanner):
              """-> (findings, parse_state). parse_state is COMPLETE, ABSENT or UNPARSEABLE.

              UNPARSEABLE is not zero findings. It is a collection failure wearing a report's clothes.
              """
              if not path or not os.path.exists(path) or os.path.getsize(path) == 0:
                  return ([], 'ABSENT')
              try:
                  doc = json.load(io.open(path, encoding='utf-8', errors='replace'))
              except (ValueError, IOError):
                  return ([], 'UNPARSEABLE')
              out = []
              for run in (doc.get('runs') or []):
                  driver = ((run.get('tool') or {}).get('driver') or {})
                  rules = {}
                  for r in (driver.get('rules') or []):
                      if r.get('id'):
                          rules[r['id']] = r
                  for ext in (run.get('tool') or {}).get('extensions') or []:
                      for r in (ext.get('rules') or []):
                          if r.get('id'):
                              rules.setdefault(r['id'], r)
                  tool = driver.get('name') or scanner
                  for res in (run.get('results') or []):
                      rid = res.get('ruleId') or ''
                      msg = ((res.get('message') or {}).get('text') or '').strip()
                      uri, line = location_of(res)
                      # REDACTED AT CONSTRUCTION, NOT AT PRINT TIME. There are four places a finding's
                      # text reaches output; guarding each one is how one of them eventually gets missed.
                      # The fingerprint is computed from the RAW message so identity survives redaction --
                      # it is a hash, and it never reaches a reader.
                      out.append({
                          'scanner': scanner, 'tool': tool, 'rule': redact(rid),
                          'severity': severity_of(res, rules),
                          'message': redact(msg), 'uri': uri, 'line': line,
                          'remediation': redact(remediation_of(res, rules)),
                          'fp': fingerprint(scanner, rid, uri, msg),
                      })
              return (out, 'COMPLETE')


          def load_dispositions(path):
              """Approved exceptions, keyed by fingerprint. Absent file is not an error -- it means the
              governance layer is not yet in place, which is a state to report, not to crash on."""
              if not path or not os.path.exists(path):
                  return ({}, 'NOT CONFIGURED')
              try:
                  d = json.load(io.open(path, encoding='utf-8', errors='replace'))
              except (ValueError, IOError):
                  return ({}, 'PRESENT BUT UNREADABLE')
              if isinstance(d, dict) and 'dispositions' in d:
                  d = d['dispositions']
              if isinstance(d, list):
                  d = dict((x.get('fingerprint'), x) for x in d if isinstance(x, dict))
              return (d if isinstance(d, dict) else {}, 'LOADED')


          # THE REGISTERED disposition_type VOCABULARY, not a paraphrase of it.
          #
          # This said RISK_ACCEPTED. assurance-taxonomy.yaml says ACCEPTED_RISK. Same concept, reversed,
          # and the reporter suppressed only on ITS spelling -- so a disposition written to the registered
          # schema would have suppressed nothing and the gate would have blocked an approved exception
          # forever, with no error anywhere. A third spelling (RISK_ACCEPTANCE) was in circulation in
          # conversation. One truth, three names.
          SUPPRESSING = ('FALSE_POSITIVE', 'ACCEPTED_RISK', 'MITIGATED', 'REMEDIATED')


          def not_suppressed_because(d, today=None):
              """-> the reason this disposition does NOT suppress, or '' when it DOES.

              Named for what it returns. `suppressed_by()` returning a reason it is NOT suppressed reads
              exactly backwards at the call site, which is how an inverted condition survives review.

              EXPIRY IS ENFORCED, NOT DISPLAYED. The registered model says
              `approved -> expired (automatic; silence NEVER renews)`. Showing an expiry date while still
              honouring a lapsed acceptance is how a 90-day risk acceptance becomes permanent: nobody
              revisits it, because nothing ever went red again.
              """
              state = (d or {}).get('state')
              if state not in SUPPRESSING:
                  return 'state %s is not an approved disposition' % (state or 'NONE')
              exp = (d or {}).get('expires')
              if exp:
                  try:
                      when = datetime.date(*[int(x) for x in str(exp)[:10].split('-')])
                  except (ValueError, TypeError):
                      return 'expiry %r is unparseable -- an unreadable expiry is not an open-ended one' % exp
                  if when < (today or datetime.date.today()):
                      return 'EXPIRED %s' % exp
              return ''


          def blocking_of(findings, disp):
              """THE definition of a blocking finding. Called by both the summary table and the detail
              section, because computing it twice is how a report comes to disagree with itself -- the
              table saying 2 while the list beneath it shows 1, and a reader trusting whichever they read
              first. One truth, one function."""
              return [f for f in findings
                      if f['severity'] in BLOCKING and not_suppressed_because(disp.get(f['fp']))]


          def counts_of(findings):
              c = dict((s, 0) for s in SEV_ORDER)
              for f in findings:
                  c[f['severity']] = c.get(f['severity'], 0) + 1
              return c


          def render(cfg, findings, parse_state, disp, disp_state):
              """The five sections. Written once so sixteen scanners cannot invent sixteen dialects."""
              L = []
              add = L.append
              scanner = cfg['scanner']
              applic = cfg['applicability']
              execu = cfg['execution']

              established = (parse_state == 'COMPLETE'
                             and execu not in NO_COUNT_STATES
                             and applic not in NO_COUNT_APPLIC)

              add('### %s' % scanner)
              add('')
              add('| | |')
              add('|---|---|')
              add('| Applicability | %s |' % applic)
              add('| Execution | %s |' % execu)
              add('| Scope | %s |' % (cfg['scope'] or 'NOT DECLARED'))
              add('')

              # ---- RESULT -------------------------------------------------------------
              add('**RESULT**')
              add('')
              if not established:
                  why = {'UNAVAILABLE': 'the capability is not licensed or not available to this repository',
                         'NOT_CONFIGURED': 'the capability is available but not enabled',
                         'NOT_APPLICABLE': 'no files in scope for this scanner',
                         }.get(applic, '')
                  if not why:
                      why = {'COLLECTION_FAILED': 'the scanner ran and produced no usable report',
                             'FAILED': 'the scanner did not complete',
                             'NOT_RUN': 'the scanner did not run',
                             }.get(execu, 'the report could not be parsed')
                  add('Findings: **NOT ESTABLISHED** -- %s.' % why)
                  add('')
                  add('This is not zero. Nothing looked at this scope, so no statement about it is')
                  add('supported by this run.')
              elif not findings:
                  add('Findings: **NONE** in the scanned scope.')
              else:
                  c = counts_of(findings)
                  add('| Severity | Count |')
                  add('|---|---|')
                  for s in SEV_ORDER:
                      if c.get(s):
                          add('| %s | %d |' % (s.title(), c[s]))
                  add('| **Total** | **%d** |' % len(findings))
              add('')

              # ---- ASSURANCE ----------------------------------------------------------
              add('**ASSURANCE**')
              add('')
              add('| | |')
              add('|---|---|')
              add('| Machine output | %s |' % {'COMPLETE': 'COMPLETE', 'ABSENT': 'ABSENT',
                                               'UNPARSEABLE': 'UNPARSEABLE'}[parse_state])
              add('| SARIF | %s |' % ('GENERATED' if parse_state == 'COMPLETE' else
                                      'NOT GENERATED' if parse_state == 'ABSENT' else 'INVALID'))
              add('| Artifact | %s |' % cfg['artifact'])
              add('| GitHub Security upload | %s |' % cfg['upload'])
              add('| Gate state | %s |' % cfg['gate'])
              add('| Disposition register | %s |' % disp_state)
              add('')

              # ---- ACTION REQUIRED ----------------------------------------------------
              blocking = blocking_of(findings, disp)
              add('**ACTION REQUIRED**')
              add('')
              if not established:
                  # The distinction that stops a developer being sent after a licensing decision.
                  add('Platform or security action required. Developer action: **NONE**.')
                  add('')
                  if applic == 'UNAVAILABLE':
                      add('`%s` did not run because the capability is not available to this repository.' % scanner)
                      add('')
                      add('Platform action:')
                      add('- Confirm licensing covers this repository')
                      add('- Enable the capability if this repository is in scope')
                      add('- Re-run validation')
                  elif applic == 'NOT_CONFIGURED':
                      add('`%s` is available but not enabled for this repository.' % scanner)
                      add('')
                      add('Platform action:')
                      add('- Enable it in repository or organisation settings')
                      add('- Re-run validation')
                  elif applic == 'NOT_APPLICABLE':
                      add('No files in scope for `%s`. Nothing to do.' % scanner)
                      add('')
                      add('Confirm the scope is what you expect -- a scanner reporting no applicable files')
                      add('because it was pointed at the wrong path looks identical to one on a clean repo.')
                  else:
                      add('`%s` failed to produce a usable result (%s).' % (scanner, execu))
                      add('')
                      add('Platform action:')
                      add('- Inspect the job log for the collection failure')
                      add('- This is a pipeline defect, not a code defect -- do not chase it as a finding')
                  add('')
                  add('Finding state: **NOT ESTABLISHED**')
              elif not blocking:
                  add('None.')
                  add('')
                  info = len(findings)
                  if info:
                      add('No blocking findings were identified in the scanned scope.')
                      add('Informational and low findings: %d -- review recommended; no merge block.' % info)
                  else:
                      add('No findings were identified in the scanned scope.')
              else:
                  add('Blocking findings: **%d**' % len(blocking))
                  add('')
                  for i, f in enumerate(blocking[:cfg['max_detail']], 1):
                      d = disp.get(f['fp']) or {}
                      add('%d. `%s`' % (i, f['rule'] or '(no rule id)'))
                      add('   - Severity: %s' % f['severity'])
                      if f['uri']:
                          add('   - Location: `%s%s`' % (f['uri'], (':%d' % f['line']) if f['line'] else ''))
                      if f['message']:
                          add('   - Issue: %s' % f['message'].split('\n')[0][:300])
                      if f['remediation']:
                          add('   - Recommended action: %s' % f['remediation'])
                      else:
                          add('   - Recommended action: NOT SUPPLIED by the scanner -- needs triage')
                      add('   - Tracking: %s' % (d.get('ticket') or 'NOT CREATED'))
                      why = not_suppressed_because(d) if d else 'no disposition recorded'
                      add('   - Disposition: %s%s' % ((d.get('state') or 'NONE'),
                                                      '' if not d else ('  (%s)' % why if why else
                                                                        '  -- honoured')))
                      if d.get('expires'):
                          add('   - Expires: %s%s' % (d['expires'],
                                                      '  -- LAPSED, no longer suppressing'
                                                      if why.startswith('EXPIRED') else
                                                      '  -- revalidate before expiry'))
                      add('   - Fingerprint: `%s`' % f['fp'])
                  if len(blocking) > cfg['max_detail']:
                      add('')
                      add('_%d further blocking findings not listed here; all %d are in the artifact._'
                          % (len(blocking) - cfg['max_detail'], len(blocking)))
                  add('')
                  add('**NEXT STEP** -- resolve the %d blocking finding(s), or submit an approved disposition'
                      % len(blocking))
                  add('(false positive, mitigation, risk acceptance, deferral) referencing the fingerprint.')
              add('')

              # ---- TRACKING / DISPOSITION --------------------------------------------
              if established and findings:
                  held = [f for f in findings if f['fp'] in disp]
                  add('**TRACKING / DISPOSITION**')
                  add('')
                  if disp_state == 'NOT CONFIGURED':
                      add('No disposition register configured. Every finding above is untriaged by')
                      add('definition -- an accepted risk that is not recorded is indistinguishable from')
                      add('one nobody noticed.')
                  elif not held:
                      add('%d finding(s), none carrying a recorded disposition.' % len(findings))
                  else:
                      add('| Fingerprint | Disposition | Approved by | Expires |')
                      add('|---|---|---|---|')
                      for f in held[:cfg['max_detail']]:
                          d = disp[f['fp']]
                          add('| `%s` | %s | %s | %s |'
                              % (f['fp'], d.get('state', '?'), d.get('approved_by', '--'),
                                 d.get('expires', '--')))
                  add('')

              # ---- DETAILS / EVIDENCE -------------------------------------------------
              add('**DETAILS / EVIDENCE**')
              add('')
              add('- Artifact: %s' % (cfg['sarif'] or 'none'))
              add('- GitHub Security: %s' % cfg['upload'])
              if cfg['run_url']:
                  add('- Run: %s' % cfg['run_url'])
              return '\n'.join(L)


          def batch(state_dir, disp_path, max_detail, run_url, expect=()):
              """Render every scanner from the state files they each dropped. One contract, N inputs.

              WHY BATCH RATHER THAN SIXTEEN PER-JOB REPORTERS
                  Two reasons, and the second is the load-bearing one.

                  (1) A contract implemented in sixteen places is a contract that drifts in sixteen places.
                      This kit already lost fourteen Azure gitleaks rules and a flawfinder fix to exactly
                      that, and its own LANDMINES register carries "one truth in three places" as a named
                      hazard. Each job establishes only what it alone can know -- did the tool run, was the
                      artifact kept, did the upload succeed -- and writes it down. Interpretation happens
                      once, here.

                  (2) DEDUPLICATION AND CORRELATION ARE ONLY POSSIBLE WHERE EVERY FINDING IS VISIBLE AT
                      ONCE. Trivy, Checkov and CodeQL will each report the same exposed storage account.
                      Sixteen reporters each holding one scanner's SARIF cannot tell that; they will file
                      three tickets and three risk acceptances for one condition, and a later revalidation
                      will settle one of them and leave two stale. Cross-scanner identity has to be
                      established before anything is routed anywhere.

              A scanner that ran and dropped no state file is reported as MISSING, never omitted. An absent
              row in a report reads as "not applicable" to every human who has ever read one.
              """
              states = []
              for fn in sorted(os.listdir(state_dir)) if os.path.isdir(state_dir) else []:
                  if not fn.endswith('.json') or fn.startswith('.'):
                      continue
                  try:
                      d = json.load(io.open(os.path.join(state_dir, fn), encoding='utf-8',
                                            errors='replace'))
                  except (ValueError, IOError):
                      states.append({'scanner': fn[:-5], 'applicability': 'APPLICABLE',
                                     'execution': 'COLLECTION_FAILED', 'scope': '',
                                     'artifact': 'UNKNOWN', 'upload': 'UNKNOWN', 'gate': 'UNDETERMINED',
                                     'sarif': '', '_bad_state': True})
                      continue
                  for item in (d if isinstance(d, list) else [d]):
                      if isinstance(item, dict) and item.get('scanner'):
                          states.append(item)

              # A SCANNER THAT WAS EXPECTED AND DROPPED NO STATE FILE MUST APPEAR AS A ROW.
              # An absent row reads as "not applicable" to every human who has ever read a report, so a
              # job that died before writing its state would silently shrink the denominator -- the same
              # defect as a coverage figure whose denominator quietly excludes a modality (LM-015).
              present = set(st.get('scanner') for st in states)
              for name in expect:
                  if name and name not in present:
                      states.append({'scanner': name, 'applicability': 'APPLICABLE',
                                     'execution': 'NOT_RUN', 'scope': '', 'artifact': 'NONE',
                                     'upload': 'NONE', 'gate': 'UNDETERMINED', 'sarif': '',
                                     '_missing': True})

              disp, disp_state = load_dispositions(disp_path)
              blocks, index, seen = [], [], {}
              for st in states:
                  sarif = st.get('sarif') or ''
                  if sarif and not os.path.isabs(sarif):
                      cand = os.path.join(state_dir, sarif)
                      sarif = cand if os.path.exists(cand) else sarif
                  findings, parse_state = parse_sarif(sarif, st['scanner'])
                  if st.get('_bad_state'):
                      parse_state = 'UNPARSEABLE'
                  cfg = dict(scanner=st['scanner'],
                             applicability=st.get('applicability', 'APPLICABLE'),
                             execution=st.get('execution', 'COMPLETE'),
                             scope=st.get('scope', ''), artifact=st.get('artifact', 'UNKNOWN'),
                             upload=st.get('upload', 'UNKNOWN'), gate=st.get('gate', 'UNDETERMINED'),
                             sarif=sarif, run_url=run_url, max_detail=max_detail)
                  blocks.append(render(cfg, findings, parse_state, disp, disp_state))

                  established = (parse_state == 'COMPLETE'
                                 and cfg['execution'] not in NO_COUNT_STATES
                                 and cfg['applicability'] not in NO_COUNT_APPLIC)
                  blk = blocking_of(findings, disp)
                  held = len([f for f in findings
                              if f['fp'] in disp and not not_suppressed_because(disp[f['fp']])])
                  index.append((cfg['scanner'], cfg['applicability'], cfg['execution'],
                                ('%d' % len(blk)) if established else 'NOT ESTABLISHED',
                                ('%d' % len(findings)) if established else '--',
                                ('%d' % held) if established else '--',
                                cfg['gate']))
                  for f in findings:
                      key = (f['uri'], f['rule'])
                      seen.setdefault(key, []).append(f['scanner'])

              L = ['## Security scan report', '',
                   '| Scanner | Applicability | Execution | Blocking | Total | Dispositioned | Gate |',
                   '|---|---|---|---|---|---|---|']
              for row in index:
                  L.append('| %s |' % ' | '.join(row))
              unest = [r[0] for r in index if r[3] == 'NOT ESTABLISHED']
              L.append('')
              if unest:
                  L.append('**%d scanner(s) established nothing:** %s' % (len(unest), ', '.join(unest)))
                  L.append('')
                  L.append('Those rows are not zero. The scope they would have covered is unmeasured, and')
                  L.append('the overall result below is only as strong as the scope that was actually read.')
                  L.append('')
              # Cross-scanner correlation: the same location and rule seen by more than one tool.
              dupes = dict((k, v) for k, v in seen.items() if len(set(v)) > 1)
              if dupes:
                  L.append('**Correlated across scanners:** %d finding(s) reported by more than one tool.'
                           % len(dupes))
                  L.append('One condition, several detectors -- triage once, not once per scanner.')
                  L.append('')
              L.append('')
              return '\n'.join(L) + '\n' + '\n\n'.join(blocks)


          def self_test():
              """Every assertion here is a defect this kit has actually shipped at least once."""
              fails = []

              # 1. A scanner that did not run must NEVER report 0 findings.
              for applic, execu in (('UNAVAILABLE', 'NOT_RUN'), ('NOT_CONFIGURED', 'NOT_RUN'),
                                    ('APPLICABLE', 'COLLECTION_FAILED'), ('APPLICABLE', 'FAILED')):
                  cfg = dict(scanner='codeql', applicability=applic, execution=execu, scope='x',
                             artifact='-', upload='-', gate='-', sarif='', run_url='', max_detail=5)
                  txt = render(cfg, [], 'ABSENT', {}, 'NOT CONFIGURED')
                  if 'NOT ESTABLISHED' not in txt:
                      fails.append('%s/%s did not report NOT ESTABLISHED' % (applic, execu))
                  if re.search(r'Findings:\s+\*\*0', txt) or '| Total | 0 |' in txt:
                      fails.append('%s/%s reported a zero count' % (applic, execu))

              # 2. Unlicensed capability must not send a developer after it.
              cfg = dict(scanner='codeql', applicability='UNAVAILABLE', execution='NOT_RUN', scope='x',
                         artifact='-', upload='-', gate='-', sarif='', run_url='', max_detail=5)
              txt = render(cfg, [], 'ABSENT', {}, 'NOT CONFIGURED')
              if 'Developer action: **NONE**' not in txt or 'Platform action' not in txt:
                  fails.append('unlicensed capability did not separate platform from developer action')

              # 3. A genuinely clean run MAY say none.
              cfg = dict(scanner='trivy', applicability='APPLICABLE', execution='COMPLETE', scope='fs',
                         artifact='RETAINED', upload='COMPLETE', gate='PASS', sarif='t.sarif',
                         run_url='', max_detail=5)
              txt = render(cfg, [], 'COMPLETE', {}, 'LOADED')
              if '**NONE** in the scanned scope' not in txt:
                  fails.append('clean run did not report NONE')
              if 'NOT ESTABLISHED' in txt:
                  fails.append('clean run wrongly reported NOT ESTABLISHED')

              # 4. Severity derives from security-severity when present, level otherwise.
              rules = {'R1': {'properties': {'security-severity': '9.8'}}}
              if severity_of({'ruleId': 'R1'}, rules) != 'CRITICAL':
                  fails.append('security-severity 9.8 not CRITICAL')
              if severity_of({'ruleId': 'R2', 'level': 'error'}, {}) != 'HIGH':
                  fails.append('level=error not HIGH')
              if severity_of({'ruleId': 'R3'}, {}) != 'MEDIUM':
                  fails.append('unclassified finding was dropped rather than defaulted')

              # 5. Fingerprint is stable across line movement and unstable across real change.
              a = fingerprint('trivy', 'CVE-1', 'a/b.py', 'thing at line 42')
              b = fingerprint('trivy', 'CVE-1', 'a/b.py', 'thing at line 87')
              c = fingerprint('trivy', 'CVE-2', 'a/b.py', 'thing at line 42')
              if a != b:
                  fails.append('fingerprint changed when only a line number changed')
              if a == c:
                  fails.append('fingerprint collided across different rules')

              # 6. An approved disposition suppresses the block; an expired-but-unrecorded one does not.
              fs = [{'scanner': 't', 'tool': 't', 'rule': 'CVE-1', 'severity': 'CRITICAL',
                     'message': 'm', 'uri': 'a.py', 'line': 1, 'remediation': '', 'fp': 'ff00'}]
              txt = render(cfg, fs, 'COMPLETE', {'ff00': {'state': 'ACCEPTED_RISK'}}, 'LOADED')
              if 'Blocking findings' in txt:
                  fails.append('accepted risk still counted as blocking')
              txt = render(cfg, fs, 'COMPLETE', {}, 'LOADED')
              if 'Blocking findings: **1**' not in txt:
                  fails.append('undispositioned critical was not blocking')
              if 'Disposition: NONE' not in txt:
                  fails.append('untriaged finding did not say so')

              # 6b. AN EXPIRED ACCEPTANCE MUST BLOCK AGAIN. Silence never renews.
              past = {'state': 'ACCEPTED_RISK', 'expires': '2020-01-01', 'approved_by': 'x'}
              if not not_suppressed_because(past):
                  fails.append('an expired risk acceptance still suppressed')
              if 'EXPIRED' not in not_suppressed_because(past):
                  fails.append('expiry was not the stated reason')
              future = {'state': 'ACCEPTED_RISK', 'expires': '2099-01-01'}
              if not_suppressed_because(future):
                  fails.append('an unexpired acceptance failed to suppress')
              if not not_suppressed_because({'state': 'ACCEPTED_RISK', 'expires': 'soon'}):
                  fails.append('an unparseable expiry was treated as open-ended')
              # 6c. AN UNREGISTERED SYNONYM MUST NOT SUPPRESS. The taxonomy says ACCEPTED_RISK; this file
              # once said RISK_ACCEPTED, and a third spelling (RISK_ACCEPTANCE) was in circulation.
              for synonym in ('RISK_ACCEPTED', 'RISK_ACCEPTANCE', 'accepted_risk'):
                  if not not_suppressed_because({'state': synonym}):
                      fails.append('unregistered disposition spelling %s suppressed a finding' % synonym)

              # 7. Unparseable output is not a clean result.
              txt = render(cfg, [], 'UNPARSEABLE', {}, 'LOADED')
              if 'NOT ESTABLISHED' not in txt or 'INVALID' not in txt:
                  fails.append('unparseable SARIF read as a clean result')

              # 8. Batch: an expected scanner that dropped no state file must still appear, as NOT_RUN.
              import tempfile
              td = tempfile.mkdtemp()
              io.open(os.path.join(td, 'trivy.json'), 'w', encoding='utf-8').write(json.dumps(
                  {'scanner': 'trivy', 'applicability': 'APPLICABLE', 'execution': 'COMPLETE',
                   'sarif': '', 'gate': 'PASS'}))
              txt = batch(td, '', 5, '', ['trivy', 'codeql'])
              if '| codeql |' not in txt:
                  fails.append('an expected scanner that wrote no state file vanished from the report')
              if 'NOT_RUN' not in txt:
                  fails.append('a missing scanner was not reported as NOT_RUN')
              # and it must not be able to claim zero findings
              codeql_block = txt.split('### codeql')[-1] if '### codeql' in txt else ''
              if 'NOT ESTABLISHED' not in codeql_block:
                  fails.append('a scanner that never ran did not report NOT ESTABLISHED in batch mode')

              # 8a. NO CREDENTIAL MAY REACH RENDERED OUTPUT. Fake values, real shapes.
              SECRETS = [
                  ('AKIAIOSFODNN7EXAMPLE', 'aws-access-key-id'),
                  ('ghp_16CharsAndMoreHere0123456789abcd', 'github-token'),
                  ('eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxMjM0NTY3ODkwIn0.dBjftJeZ4CVPmB92K27uhbUJU1p1r',
                   'jwt'),
                  ('abc8Q~xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx', 'entra-client-secret'),
                  ('-----BEGIN RSA PRIVATE KEY-----', 'private-key'),
                  ('AccountKey=aGVsbG93b3JsZGhlbGxvd29ybGRoZWxsb3dvcmxkaGVsbG93b3JsZA==',
                   'keyed-value'),
                  ('password=SuperSecret123!', 'keyed-value'),
              ]
              for raw, _label in SECRETS:
                  r = redact(raw)
                  if raw in r:
                      fails.append('redact() left %s... intact' % raw[:8])
                  if not raw.startswith('-----') and raw[:4] not in r:
                      fails.append('redact() dropped the identifying prefix of %s...' % raw[:8])

              # and end to end, through a real SARIF into the rendered report
              io.open(os.path.join(td, 'sec.sarif'), 'w', encoding='utf-8').write(json.dumps(
                  {'version': '2.1.0', 'runs': [{'tool': {'driver': {'name': 'secretscan'}}, 'results': [
                      {'ruleId': 'leaked-key', 'level': 'error',
                       'message': {'text': 'Found AWS key AKIAIOSFODNN7EXAMPLE in config'},
                       'locations': [{'physicalLocation': {
                           'artifactLocation': {'uri': 'infra/main.tf'},
                           'region': {'startLine': 42,
                                      'snippet': {'text': 'key = AKIAIOSFODNN7EXAMPLE'}}}}]}]}]}))
              io.open(os.path.join(td, 'sec.json'), 'w', encoding='utf-8').write(json.dumps(
                  {'scanner': 'secretscan', 'applicability': 'APPLICABLE', 'execution': 'COMPLETE',
                   'sarif': 'sec.sarif', 'gate': 'FAIL'}))
              rep = batch(td, '', 5, '', [])
              if 'AKIAIOSFODNN7EXAMPLE' in rep:
                  fails.append('a live-shaped credential reached the rendered report')
              if 'infra/main.tf' not in rep or '42' not in rep:
                  fails.append('redaction destroyed the file/line a reader needs to act')
              if 'AKIA' not in rep:
                  fails.append('redaction removed the prefix that identifies WHICH credential')

              # 8b. The summary table and the detail section must report the SAME blocking count.
              io.open(os.path.join(td, 'acc.sarif'), 'w', encoding='utf-8').write(json.dumps(
                  {'version': '2.1.0', 'runs': [{'tool': {'driver': {'name': 'T'}}, 'results': [
                      {'ruleId': 'X1', 'level': 'error', 'message': {'text': 'one'},
                       'locations': [{'physicalLocation': {'artifactLocation': {'uri': 'a.py'}}}]},
                      {'ruleId': 'X2', 'level': 'error', 'message': {'text': 'two'},
                       'locations': [{'physicalLocation': {'artifactLocation': {'uri': 'b.py'}}}]}]}]}))
              io.open(os.path.join(td, 'acc.json'), 'w', encoding='utf-8').write(json.dumps(
                  {'scanner': 'acc', 'applicability': 'APPLICABLE', 'execution': 'COMPLETE',
                   'sarif': 'acc.sarif', 'gate': 'FAIL'}))
              fp1 = fingerprint('acc', 'X1', 'a.py', 'one')
              io.open(os.path.join(td, 'd.json'), 'w', encoding='utf-8').write(json.dumps(
                  {'dispositions': {fp1: {'state': 'ACCEPTED_RISK', 'approved_by': 'x'}}}))
              txt = batch(td, os.path.join(td, 'd.json'), 5, '', [])
              row = [ln for ln in txt.splitlines() if ln.startswith('| acc |')]
              detail = txt.split('### acc')[-1]
              if not row:
                  fails.append('batch summary lost a scanner row')
              elif '| 1 | 2 | 1 |' not in row[0]:
                  fails.append('summary row did not report 1 blocking / 2 total / 1 dispositioned: %s'
                               % row[0])
              if 'Blocking findings: **1**' not in detail:
                  fails.append('detail section disagreed with the summary table on blocking count')

              # 9. Batch: a corrupt state file is a collection failure, not an omission.
              io.open(os.path.join(td, 'semgrep.json'), 'w', encoding='utf-8').write('{ not json')
              txt = batch(td, '', 5, '', [])
              if '### semgrep' not in txt or 'NOT ESTABLISHED' not in txt.split('### semgrep')[-1]:
                  fails.append('a corrupt state file was dropped instead of reported')

              if fails:
                  print('SELF-TEST FAILED:')
                  for f in fails:
                      print('  - %s' % f)
                  return False
              print('self-test ok: a scanner that did not run reports NOT ESTABLISHED and can never report 0;')
              print('              platform action is separated from developer action;')
              print('              fingerprints survive line movement; unparseable output is not clean')
              return True


          def main():
              ap = argparse.ArgumentParser()
              ap.add_argument('--scanner')
              ap.add_argument('--sarif', default='')
              ap.add_argument('--applicability', default='APPLICABLE',
                              choices=['APPLICABLE', 'NOT_APPLICABLE', 'UNAVAILABLE', 'NOT_CONFIGURED'])
              ap.add_argument('--execution', default='COMPLETE',
                              choices=['COMPLETE', 'FAILED', 'COLLECTION_FAILED', 'NOT_RUN'])
              ap.add_argument('--scope', default='')
              ap.add_argument('--artifact', default='UNKNOWN')
              ap.add_argument('--upload', default='UNKNOWN')
              ap.add_argument('--gate', default='UNDETERMINED')
              ap.add_argument('--dispositions', default='')
              ap.add_argument('--max-detail', type=int, default=20)
              ap.add_argument('--run-url', default=os.environ.get('RUN_URL', ''))
              ap.add_argument('--out', default=os.environ.get('GITHUB_STEP_SUMMARY', ''))
              ap.add_argument('--batch', default='',
                              help='directory of per-scanner state JSON files; render all of them')
              ap.add_argument('--expect', default='',
                              help='comma-separated scanners that MUST appear; any that dropped no state '
                                   'file is rendered as NOT_RUN rather than silently omitted')
              ap.add_argument('--self-test', action='store_true')
              a = ap.parse_args()

              if a.self_test:
                  return 0 if self_test() else 2
              if not self_test():
                  print('ABORTING -- a reporter that can fabricate a zero is worse than no reporter.')
                  return 2

              if a.batch:
                  text = batch(a.batch, a.dispositions, a.max_detail, a.run_url,
                               [x.strip() for x in a.expect.split(',') if x.strip()])
                  print(text)
                  if a.out:
                      with io.open(a.out, 'a', encoding='utf-8') as fh:
                          fh.write(text + '\n\n')
                  return 0

              if not a.scanner:
                  print('--scanner or --batch is required')
                  return 2

              findings, parse_state = parse_sarif(a.sarif, a.scanner)
              disp, disp_state = load_dispositions(a.dispositions)
              cfg = dict(scanner=a.scanner, applicability=a.applicability, execution=a.execution,
                         scope=a.scope, artifact=a.artifact, upload=a.upload, gate=a.gate,
                         sarif=a.sarif, run_url=a.run_url, max_detail=a.max_detail)
              text = render(cfg, findings, parse_state, disp, disp_state)

              # Both destinations, deliberately. The step summary is where a reviewer looks; the run log is
              # where an engineer already is when the job goes red.
              print(text)
              if a.out:
                  with io.open(a.out, 'a', encoding='utf-8') as fh:
                      fh.write(text + '\n\n')
              return 0


          if __name__ == '__main__':
              sys.exit(main())

          SCAN_REPORT_PY
          # END SCAN_REPORT

          # DISPOSITIONS COME FROM THE PROTECTED DEFAULT BRANCH, NEVER FROM THIS CHECKOUT.
          #
          # On a pull_request run the workspace IS the PR's tree. Reading the register from there
          # lets a pull request approve its own exceptions -- add a secret and, in the same PR,
          # add an ACCEPTED_RISK entry for its fingerprint, and the gate goes green. The
          # registered model says so outright: "consumed from the PROTECTED DEFAULT BRANCH, never
          # from the PR under evaluation".
          #
          # So the register is fetched from the default branch by ref. If that fetch fails the
          # register is treated as ABSENT rather than falling back to the local file -- a
          # fallback would restore exactly the hole this closes, and silently.
          disp=""
          def_branch="${DEFAULT_BRANCH:-main}"
          if git rev-parse --git-dir >/dev/null 2>&1; then
            # suppression: FAILURE_ISOLATION_WITH_STATE_CAPTURE -- a repository with no register,
            # no default-branch ref, or a shallow clone that cannot reach it are all legitimate
            # states. Each leaves $disp empty, which the reporter renders as "no disposition
            # register configured" -- louder than a failed job and, unlike a local-file fallback,
            # incapable of honouring an unapproved exemption.
            git fetch --depth=1 origin "$def_branch" >/dev/null 2>&1 || true
            for c in .security/dispositions.json .github/security/dispositions.json; do
              if git show "FETCH_HEAD:$c" > /tmp/dispositions.json 2>/dev/null; then
                disp=/tmp/dispositions.json
                echo "disposition register read from origin/$def_branch:$c"
                break
              fi
            done
          fi
          if [ -z "$disp" ]; then
            echo "::notice title=No disposition register::None found on origin/${def_branch}."
            echo "Every finding below is untriaged by definition. A local file in this checkout"
            echo "is deliberately NOT used -- a PR must not be able to approve its own exceptions."
          fi

          python3 /tmp/scan_report.py --batch _states \
            ${disp:+--dispositions "$disp"} \
            --expect gitleaks,code-quality,semgrep,bandit,codeql,trivy,trivy-image,checkov,dotnet-vuln,java-sast,gosec,flawfinder,malicious-deps,sbom \
            --max-detail 20

      # BEGIN REDACT_SARIF — generated from scripts/redact_sarif.py. DO NOT EDIT HERE.
      - name: Redact credential material before upload
        if: always()
        shell: bash
        run: |
          cat > /tmp/redact_sarif.py <<'REDACT_SARIF_PY'
          #!/usr/bin/env python3
          """Strip credential material from a SARIF file IN PLACE, before it becomes an artifact.

          WHY THIS EXISTS
              The kit redacted exactly one scanner. gitleaks ran with --redact and had `snippet` and
              `partialFingerprints` stripped before upload. Thirteen other jobs uploaded raw SARIF, and
              several of those scanners embed matched source by design:

                  bandit    B105 hardcoded_password_string -- the snippet IS the password
                  semgrep   snippet carries the matched source line
                  trivy     secret mode reports the match
                  checkov   includes the offending code block
                  gosec     includes the offending line

              An artifact is downloadable by anyone with repository read access and is retained for
              weeks. Redacting the rendered summary while shipping the raw value in a downloadable file
              is theatre -- it moves the credential from a page someone reads to a file someone opens.

              The consolidated report job made it worse by copying every SARIF into one artifact.

          WHAT SURVIVES, WHICH IS EVERYTHING NEEDED TO FIX THE FINDING
              rule id, severity, FILE, LINE, message with credential-shaped substrings masked to a short
              prefix. What is removed: `snippet`, `contextRegion.snippet`, and `partialFingerprints`
              (which for a secret scanner can be a hash of the secret itself).

          IT IS NOT A SUBSTITUTE FOR --redact AT THE SCANNER
              Defence in depth. A scanner that can be told not to emit the value should be told. This
              catches the ones that cannot, and the ones a consumer adds later.

          USAGE
              python3 redact_sarif.py <file.sarif> [more.sarif ...]
              python3 redact_sarif.py --self-test

          EXIT
              0 rewritten (or nothing to do)      1 a file was unreadable      2 self-test failed
          """
          import io
          import json
          import os
          import re
          import sys

          # BEGIN SECRET_PATTERNS -- must stay identical to scripts/scan_report.py.
          # Two copies exist because each file is inlined into the workflow separately and neither can
          # import the other at consumer runtime. tests/check_redaction_parity.py fails the build if they
          # diverge, so the duplication is an enforced invariant rather than a hope -- the same treatment
          # the SARIF normalizer gets for the same reason.
          SECRET_PATTERNS = [
              (re.compile(r'-----BEGIN[A-Z ]*PRIVATE KEY-----'), 'private-key'),
              (re.compile(r'\bAKIA[0-9A-Z]{16}\b'), 'aws-access-key-id'),
              (re.compile(r'\bgh[pousr]_[A-Za-z0-9]{16,}'), 'github-token'),
              (re.compile(r'\bxox[baprs]-[A-Za-z0-9-]{10,}'), 'slack-token'),
              (re.compile(r'\beyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}'), 'jwt'),
              (re.compile(r'\b[A-Za-z0-9~._-]{3}8Q~[A-Za-z0-9~._-]{31,34}\b'), 'entra-client-secret'),
              (re.compile(r'(?i)\b(?:AccountKey|SharedAccessKey|password|pwd|secret|token|api[_-]?key)'
                          r'\s*[:=]\s*["\']?([^\s;,"\'&]{8,})'), 'keyed-value'),
              (re.compile(r'\b[A-Za-z0-9+/]{32,}={0,2}(?![A-Za-z0-9+/=])'), 'high-entropy'),
              (re.compile(r'\b[0-9a-fA-F]{32,}\b'), 'hex-or-digest'),
          ]


          def _mask(value, label):
              keep = value[:4]
              return '%s%s [redacted: %s, %d chars]' % (keep, '*' * min(len(value) - len(keep), 18),
                                                        label, len(value))


          REDACTED_MARK = '[redacted: '


          def redact(text):
              """Mask anything that looks like credential material. Returns the safe string.

              IDEMPOTENT, which is not free. Masking `password: AKIAIOSFODNN7EXAMPLE` produces
              `password: AKIA**************** [redacted: ...]`, and that output STILL matches the
              keyed-value pattern -- so a second pass masked the mask, and a third masked that. It
              matters because a SARIF can legitimately be redacted twice: once in the scanner job before
              upload, once in the consolidated report after download. Non-idempotent redaction would
              corrupt the text on the second pass and make the finding unreadable.
              """
              if not text:
                  return text
              out = text
              for pat, label in SECRET_PATTERNS:
                  def _sub(m, _l=label):
                      whole = m.group(0)
                      v = m.group(1) if m.groups() and m.group(1) else whole
                      if len(v) < 8 or REDACTED_MARK in whole or '****' in v:
                          return whole
                      return whole.replace(v, _mask(v, _l))
                  out = pat.sub(_sub, out)
              return out
          # END SECRET_PATTERNS


          def scrub(doc):
              """-> (snippets_removed, messages_masked). Mutates doc."""
              snips = masked = 0
              for run in (doc.get('runs') or []):
                  for res in (run.get('results') or []):
                      msg = ((res.get('message') or {}).get('text'))
                      if msg:
                          r = redact(msg)
                          if r != msg:
                              res['message']['text'] = r
                              masked += 1
                      for loc in (res.get('locations') or []) + (res.get('relatedLocations') or []):
                          pl = (loc.get('physicalLocation') or {})
                          for key in ('region', 'contextRegion'):
                              reg = pl.get(key) or {}
                              if 'snippet' in reg:
                                  reg.pop('snippet', None)
                                  snips += 1
                      # A partial fingerprint from a secret scanner can be a hash OF THE SECRET, which is
                      # an offline-guessable artifact for anything low-entropy. It buys correlation that
                      # this kit gets from file+rule instead.
                      if res.pop('partialFingerprints', None) is not None:
                          snips += 1
                      for cf in (res.get('codeFlows') or []):
                          for tf in (cf.get('threadFlows') or []):
                              for lo in (tf.get('locations') or []):
                                  pl = ((lo.get('location') or {}).get('physicalLocation') or {})
                                  for key in ('region', 'contextRegion'):
                                      reg = pl.get(key) or {}
                                      if 'snippet' in reg:
                                          reg.pop('snippet', None)
                                          snips += 1
              return (snips, masked)


          def self_test():
              fails = []
              doc = {'version': '2.1.0', 'runs': [{'tool': {'driver': {'name': 'bandit'}}, 'results': [
                  {'ruleId': 'B105', 'level': 'error',
                   'message': {'text': 'Possible hardcoded password: AKIAIOSFODNN7EXAMPLE'},
                   'partialFingerprints': {'x': 'deadbeef'},
                   'locations': [{'physicalLocation': {
                       'artifactLocation': {'uri': 'app/config.py'},
                       'region': {'startLine': 12,
                                  'snippet': {'text': 'PASSWORD = "AKIAIOSFODNN7EXAMPLE"'}},
                       'contextRegion': {'snippet': {'text': 'ctx AKIAIOSFODNN7EXAMPLE'}}}}]}]}]}
              snips, masked = scrub(doc)
              blob = json.dumps(doc)
              if 'AKIAIOSFODNN7EXAMPLE' in blob:
                  fails.append('a credential survived scrub()')
              if 'app/config.py' not in blob or '12' not in blob:
                  fails.append('scrub() destroyed the file/line needed to fix it')
              if 'AKIA' not in blob:
                  fails.append('scrub() removed the prefix identifying WHICH credential')
              if snips < 3:
                  fails.append('snippet/contextRegion/partialFingerprints not all removed (%d)' % snips)
              if masked != 1:
                  fails.append('message was not masked')
              # Idempotent: running twice must not double-mask or crash.
              s2, m2 = scrub(doc)
              if (s2, m2) != (0, 0):
                  fails.append('scrub() is not idempotent (%d,%d on second pass)' % (s2, m2))
              # A clean report must come through untouched.
              clean = {'runs': [{'results': [{'ruleId': 'X', 'message': {'text': 'unused import os'},
                                              'locations': [{'physicalLocation': {
                                                  'artifactLocation': {'uri': 'a.py'},
                                                  'region': {'startLine': 1}}}]}]}]}
              before = json.dumps(clean)
              scrub(clean)
              if json.dumps(clean) != before:
                  fails.append('a clean finding was altered')
              if fails:
                  print('SELF-TEST FAILED:')
                  for f in fails:
                      print('  - %s' % f)
                  return False
              print('self-test ok: credential masked, snippet/contextRegion/partialFingerprints removed, '
                    'file and line preserved, idempotent, clean findings untouched')
              return True


          def main():
              argv = [a for a in sys.argv[1:] if not a.startswith('-')]
              if '--self-test' in sys.argv:
                  return 0 if self_test() else 2
              if not self_test():
                  print('ABORTING -- a redactor that cannot prove it redacts is worse than none.')
                  return 2
              rc = 0
              for p in argv:
                  if not os.path.exists(p) or os.path.getsize(p) == 0:
                      print('  %s: absent or empty, nothing to redact' % p)
                      continue
                  try:
                      doc = json.load(io.open(p, encoding='utf-8', errors='replace'))
                  except (ValueError, IOError) as e:
                      # A SARIF that cannot be parsed cannot be redacted, and must NOT be uploaded on the
                      # assumption that it is probably fine. Emptying it loses nothing a reader could
                      # have used -- an unparseable report establishes nothing either way -- and it
                      # cannot leak what it was carrying.
                      print('::warning title=Unredactable SARIF::%s could not be parsed (%s); it is '
                            'replaced with an empty report rather than uploaded unexamined.'
                            % (p, type(e).__name__))
                      io.open(p, 'w', encoding='utf-8').write(
                          json.dumps({'version': '2.1.0', 'runs': [],
                                      '_redaction': 'ORIGINAL UNPARSEABLE - WITHHELD'}))
                      rc = 1
                      continue
                  snips, masked = scrub(doc)
                  json.dump(doc, io.open(p, 'w', encoding='utf-8'))
                  print('  %s: %d snippet/fingerprint field(s) removed, %d message(s) masked'
                        % (os.path.basename(p), snips, masked))
              return rc


          if __name__ == '__main__':
              sys.exit(main())

          REDACT_SARIF_PY
          shopt -s nullglob globstar
          files=( *.sarif **/*.sarif )
          if [ ${#files[@]} -eq 0 ]; then
            echo "no SARIF produced by this job -- nothing to redact"
          else
            python3 /tmp/redact_sarif.py "${files[@]}"
          fi
      # END REDACT_SARIF
      - name: Keep the report as evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-report-${{ github.run_attempt }}
          path: _states
          retention-days: 30
          if-no-files-found: warn

  security-gate:
    name: Security gate
    needs:
      - discover
      - secret-scan
      - code-quality
      - sast-semgrep
      - sast-bandit
      - sast-dotnet
      - sast-java
      - sast-go
      - sast-cpp
      - deps-scan
      - iac-scan
      - malicious-deps
      - sbom
      - codeql
      - image-scan
    if: always()
    runs-on: ubuntu-latest
    outputs:
      assurance_state:   ${{ steps.gate.outputs.assurance_state }}
      enforcement_state: ${{ steps.gate.outputs.enforcement_state }}
      gate_decision:     ${{ steps.gate.outputs.gate_decision }}
      secret_gate:       ${{ steps.gate.outputs.secret_gate }}
      scanner_states:    ${{ steps.gate.outputs.scanner_states }}
      undetermined:      ${{ steps.gate.outputs.undetermined }}
      evidence_artifact: ${{ steps.gate.outputs.evidence_artifact }}
      discovery_state:   ${{ needs.discover.outputs.state }}
      established:       ${{ steps.gate.outputs.established }}
      unestablished:     ${{ steps.gate.outputs.unestablished }}
    # Bounded so a stalled dependency cannot bill six hours (LM-001: unbounded execution
    # converts a dependency failure into uncontrolled cost).
    # NOT YET: a timeout still surfaces as a plain job failure. It SHOULD classify as
    # UNAVAILABLE / EXECUTION_TIMEOUT — cost is bounded here, semantics are not. See
    # docs/roadmap/FUTURE_WORK.md. Do not let this comment imply the mapping exists.
    timeout-minutes: 10
    steps:
      - name: Enforce required scans
        id: gate
        run: |
          set -u
          fail=0
          secret_fail=0
          undetermined=0
          states=""          # scanner:state pairs, emitted as JSON below
          established=""     # capabilities that DID establish something
          unestablished=""   # capabilities that could not
          # A job that did not run because its language/toggle was off is SKIPPED and
          # acceptable. A job that FAILED, was CANCELLED, or reports an unexpected
          # state is not. "skipped" is never silently treated as "passed" in the
          # summary — it is printed as skipped so coverage stays visible.
          for r in "secret-scan=${{ needs.secret-scan.result }}" \
                   "code-quality=${{ needs.code-quality.result }}" \
                   "sast-semgrep=${{ needs.sast-semgrep.result }}" \
                   "sast-bandit=${{ needs.sast-bandit.result }}" \
                   "sast-dotnet=${{ needs.sast-dotnet.result }}" \
                   "sast-java=${{ needs.sast-java.result }}" \
                   "sast-go=${{ needs.sast-go.result }}" \
                   "sast-cpp=${{ needs.sast-cpp.result }}" \
                   "deps-scan=${{ needs.deps-scan.result }}" \
                   "iac-scan=${{ needs.iac-scan.result }}" \
                   "malicious-deps=${{ needs.malicious-deps.result }}" \
                   "sbom=${{ needs.sbom.result }}" \
                   "codeql=${{ needs.codeql.result }}"; do
            name="${r%%=*}"; res="${r##*=}"
            # Reset per iteration. `st` is set by one of two case blocks below, and a value left
            # over from the previous scanner would silently attach that scanner's verdict to this
            # one -- a wrong state that still looks like a state.
            st=""
            printf '  %-16s %s\n' "$name" "$res"
            echo "| $name | $res |" >> "$GITHUB_STEP_SUMMARY"
            # Accumulate the per-scanner verdict so the CONSUMER receives vocabulary, not a
            # boolean. A job result of success/skipped is projected into scanner_state terms.
            case "$name:$res" in
              # A scanner skipped by DISCOVERY is genuinely not applicable -- no Go code, no
              # gosec. A capability skipped because nobody supplied a token, a licence or a
              # target is UNESTABLISHED, and collapsing the two would let "this capability was never
              # configured" read exactly like "it ran and found nothing to report".
              codeql:skipped)
                        st=UNAVAILABLE ;;
            esac
            [ -n "${st:-}" ] || case "$res" in
              success)  st=PASS ;;
              skipped)  st=NOT_APPLICABLE ;;
              PASS|FINDINGS|PARTIAL|NOT_APPLICABLE|FAILED|UNAVAILABLE|COLLECTION_FAILED) st="$res" ;;
              cancelled) st=UNAVAILABLE ;;
              *)        st=UNAVAILABLE ;;
            esac
            # PARTIAL FAILURE IS NOT TOTAL IGNORANCE. Track what WAS established separately from
            # what was not, because collapsing them discards valid evidence exactly as badly as
            # inventing it. A failed Bandit does not erase a Trivy finding; a passing Semgrep does
            # not fill Bandit's hole.
            case "$st" in
              UNAVAILABLE|COLLECTION_FAILED)
                undetermined=1
                unestablished="${unestablished}${unestablished:+ }${name}(${st})"
                ;;
              *)
                established="${established}${established:+ }${name}(${st})"
                ;;
            esac
            states="${states}${states:+,}\"$name\":\"$st\""

            case "$res" in
              success|skipped) ;;
              *)
                fail=1
                # SECRETS ARE NOT SUBJECT TO ADVISORY MODE. A leaked credential is live
                # exposure, not inherited technical debt, and the remediation is
                # unambiguous: rotate it. Everything else may crawl while a team works
                # down an inherited baseline; this does not.
                [ "$name" = "secret-scan" ] && secret_fail=1
                ;;
            esac
          done
          # EMIT THE CONTRACT BEFORE ANY exit. A gate that blocks and tells the caller nothing
          # about WHY forces every consumer to re-derive state from logs -- which is how a
          # vocabulary dies at an integration boundary.
          emit() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          emit scanner_states "{${states}}"
          emit undetermined "$([ "$undetermined" = "1" ] && echo true || echo false)"
          emit evidence_artifact "security-sarif"
          emit secret_gate "$([ "$secret_fail" = "1" ] && echo FAIL || echo PASS)"
          # TWO SEPARATE QUESTIONS, answered separately on purpose.
          #
          #   assurance_state   what this run ESTABLISHED about the code
          #   enforcement_state what the gate DID about it
          #
          # Collapsing them is how "did not block" becomes "safe". A run can establish FINDINGS
          # while enforcement is ADVISORY, and UNDETERMINED must never present as PASS.
          # DISCOVERY FAILURE POISONS THE RESULT. If applicability could not be established, no
          # amount of green scanners establishes posture: we do not know what was not scanned.
          if [ "${{ needs.discover.outputs.state }}" = "DISCOVERY_UNAVAILABLE" ]; then
            echo "::warning title=Discovery unavailable::Applicability was not established."
            echo "Scanner results cannot be read as coverage. Every capability was force-enabled."
            undetermined=1
          fi
          # DEGRADATION MAY REDUCE THE SCOPE OR CONFIDENCE OF A CLAIM.
          # IT MUST NEVER INCREASE ITS AUTHORITY.
          #
          # An earlier version projected ANY unavailable scanner into a blanket UNDETERMINED, which
          # discards everything that WAS established -- as destructive as inventing a PASS, just in
          # the other direction. Preserve what is known; annotate what became unknown.
          #
          # UNDETERMINED is reserved for the case where the AGGREGATE claim genuinely cannot be
          # made: discovery failed, so we do not know which capabilities should have run, and
          # therefore cannot know what we did not scan.
          emit established "$established"
          emit unestablished "$unestablished"

          if [ "${{ needs.discover.outputs.state }}" = "DISCOVERY_UNAVAILABLE" ]; then
            echo "::error title=UNDETERMINED::Discovery failed, so the set of capabilities that"
            echo "SHOULD have run is unknown. Individual scanner results cannot be read as coverage"
            echo "because we cannot know what was never attempted."
            emit assurance_state UNDETERMINED
          elif [ "$undetermined" = "1" ]; then
            echo "::warning title=PARTIAL assurance::Some capabilities could not establish a result."
            echo "  established:   ${established:-none}"
            echo "  UNESTABLISHED: ${unestablished}"
            echo "What was established REMAINS established. What was not is named above, and stays"
            echo "unknown until new evidence resolves it -- nothing downstream may default it away."
            emit assurance_state PARTIAL
          elif [ "$fail" = "1" ] || [ "$secret_fail" = "1" ]; then
            emit assurance_state FINDINGS
          else
            emit assurance_state PASS
          fi

          if [ "$secret_fail" = "1" ]; then
            emit enforcement_state BLOCKED; emit gate_decision FAIL
          elif [ "$fail" = "1" ] && [ "${{ inputs.advisory_mode }}" = "true" ]; then
            emit enforcement_state ADVISORY; emit gate_decision ADVISORY
          elif [ "$fail" = "1" ]; then
            emit enforcement_state BLOCKED; emit gate_decision FAIL
          else
            emit enforcement_state ALLOWED; emit gate_decision PASS
          fi

          # CHECKED BEFORE advisory_mode, deliberately. advisory_mode was built as a blanket
          # switch and suppressed this too, which directly contradicted the policy that secrets
          # block from day one. Ordering the secret verdict first is what makes the policy real
          # rather than aspirational.
          if [ "$secret_fail" = "1" ]; then
            echo "::error title=GATE=FAIL (secrets)::A secret finding blocks regardless of mode."
            echo "advisory_mode does NOT cover secrets. Rotate the credential, then remove it."
            echo "If this is a documented test fixture or generated dummy, it needs an APPROVED"
            echo "disposition scoped to that exact finding — not a mode change, and not a"
            echo "developer-side suppression."
            {
              echo "## GATE = FAIL — secret finding"
              echo ""
              echo "> **Secrets are outside advisory mode.** A leaked credential is live exposure,"
              echo "> not inherited debt. Rotate first, then remove from history."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$fail" = "1" ]; then
            if [ "${{ inputs.advisory_mode }}" = "true" ]; then
              echo "::warning title=GATE=ADVISORY — non-secret findings not blocked::Scanners ran"
              echo "and findings were reported and persisted, but enforcement is OFF for them."
              echo "SECRETS STILL BLOCK — advisory mode never covered them."
              echo "ADVISORY MODE IS A BASELINE TOOL, NOT A RESTING STATE. Left on, it is"
              echo "indistinguishable from having no gate at all for everything except secrets."
              {
                echo "## GATE = ADVISORY (non-secret findings)"
                echo ""
                echo "> Every scanner ran and every finding is reported and persisted."
                echo "> **Non-secret findings were not blocked. Secrets are always enforced.**"
                echo "> Turn \`advisory_mode\` off once the baseline is understood — a permanent"
                echo "> advisory mode is not a gate."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::error::One or more required security scans failed."
            exit 1
          fi
          echo "All required security scans passed or were not applicable."
