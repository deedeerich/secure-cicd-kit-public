    needs: [discover]
    # DISCOVERED, NOT DECLARED -- same rule as every other scanner here. Runs when roots for a
    # CodeQL-supported ecosystem were actually found, not because a selector named one.
    if: >-
      needs.discover.outputs.python == 'true' || needs.discover.outputs.node == 'true' ||
      needs.discover.outputs.go == 'true' || needs.discover.outputs.dotnet == 'true' ||
