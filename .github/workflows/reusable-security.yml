      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - lang: python
            gate: ${{ needs.discover.outputs.python }}
          - lang: javascript-typescript
            gate: ${{ needs.discover.outputs.node }}
          - lang: go
            gate: ${{ needs.discover.outputs.go }}
          - lang: csharp
            gate: ${{ needs.discover.outputs.dotnet }}
          - lang: java-kotlin
            gate: ${{ needs.discover.outputs.java }}
          - lang: c-cpp
