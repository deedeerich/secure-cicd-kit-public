name: "Kit: Security Suite"
# Employer-neutral umbrella security workflow. Runs secret, code-quality, SAST, dependency,
# and IaC scans as parallel jobs. Uploads SARIF to GitHub code scanning where supported.
# Zero cloud dependencies — a calling repo needs only to grant permissions and (optionally)
# provide a Semgrep token. Reference via workflow_call.

on:
  workflow_call:
    inputs:
      language:
        description: "python | node | dotnet | java | go | cpp | multi. 'multi' runs every language path."
        type: string
        required: false
        default: "python"
      paths:
        description: "Path to scan (repo-relative)"
        type: string
        required: false
        default: "."
      iac_mode:
        description: >-
          auto     - discover Terraform/Bicep/ARM/Kubernetes/Helm/Dockerfiles in scope and scan what
                     is found. NOT_APPLICABLE then means "we looked and there is none", with evidence.
          disabled - deliberately skip IaC. Reported loudly. An exception, never a default.
          required - absence is itself a finding, because this repo is declared to contain IaC.
          Replaces `enable_iac`, whose false-by-default meant Terraform sitting in plain sight was
          nobody's business until somebody remembered a toggle.
        type: string
        required: false
        default: auto
      enable_iac:
        description: >-
          DEPRECATED AND IGNORED. Superseded by `iac_mode`; nothing reads this value.

          It was left declared after `iac_mode` replaced it, so a caller could pass
          `enable_iac: true`, see it accepted, and get no IaC scanning — which is exactly what
          happened on the first live run of this kit. A declared input nothing consumes is worse
          than an absent one: an absent input fails loudly at the call site, while a dead one
          reads as configuration and silently means nothing.

          Kept only so existing callers do not break. It is reported as ignored at run time,
          and it will be removed. Use `iac_mode` instead.
        type: boolean
        required: false
        default: false
      codeql_queries:
        description: >-
          CodeQL query suite. Defaults to `security-extended` rather than the built-in default.

          PRECISION VERSUS RECALL, NOT PRESENCE VERSUS ABSENCE.

            default               high-precision security baseline. Taint tracking IS included.
            security-extended     the default suite PLUS additional queries that trade precision
                                  for broader coverage -- lower severity and lower confidence
                                  included, so more recall and more to triage.
            security-and-quality  security-extended plus maintainability and reliability.

          An earlier version of this comment said the default suite "omits taint-tracking
          queries". That was wrong and is corrected here rather than quietly deleted: the
          default runs dataflow analysis, and what `security-extended` adds is breadth. Choosing
          it is a recall decision, not the difference between having dataflow and not.

          WHAT REMAINS TRUE is the distinction between pattern matching and dataflow. A pattern
          scanner finds `dangerouslySetInnerHTML` because the NAME is there; taint tracking
          answers whether attacker-controlled input REACHES it through three components and a
          helper. Both belong in a pipeline -- semgrep for the sink, CodeQL for the flow.

          `security-and-quality` adds maintainability queries on top; use it when the noise is
          affordable. `default` restores the built-in suite and should be a deliberate choice,
          recorded as one.
        type: string
        default: security-extended
      license_deny:
        description: >-
          Comma-separated licence identifiers that must not appear, e.g. `GPL-3.0,AGPL-3.0`.
          Empty denies nothing and reports the inventory only.

          POLICY BELONGS TO THE CONSUMER. The kit reads what the SBOM says; which licences are
          acceptable is a legal and commercial decision that no scanner can make. Components
          with NO declared licence are reported separately either way -- that is unestablished,
          not permissive-by-default, and an unlicensed dependency is usually the more
          restrictive case.
        type: string
        default: ""
      image_ref:
        description: >-
          Container image to scan, e.g. `myregistry.azurecr.io/app@sha256:...`. Empty skips it
          and the report says NOT_APPLICABLE, never a clean result.

          SCANNING THE SOURCE IS NOT SCANNING THE IMAGE. The filesystem scan sees declared
          dependencies; the image carries a base OS, its packages, anything a Dockerfile
          installed, and whatever the build pulled in. A repository can be clean while the image
          it produces ships a vulnerable libc.

          PREFER A DIGEST OVER A TAG. A tag is a moving pointer -- scanning `:latest` proves
          something about whatever `:latest` meant at that moment and cannot be reproduced. A
          digest is the artifact, and it is what deployment provenance and later revalidation
          have to match against.
        type: string
        default: ""
      semgrep_config:
        description: "Semgrep rulesets"
        type: string
        required: false
        # p/xss added 2026-09-14. OWASP Top Ten covers the category; the dedicated ruleset
        # carries the framework-specific sinks -- dangerouslySetInnerHTML, javascript: URLs in
        # href/src, innerHTML through a ref, and the prop spread that can smuggle in an unsafe
        # key.
        #
        # SEMGREP FINDS THE SINK; CODEQL FOLLOWS THE FLOW. Pattern matching says the dangerous
        # call is present. Only taint tracking says attacker-controlled input REACHES it.
        # Both, or the answer is half of one.
        default: "p/default p/owasp-top-ten p/xss"
      fail_on_severity:
        description: "Trivy/dependency severities that FAIL the build"
        type: string
        required: false
        default: "CRITICAL,HIGH"
      python_version:
        description: "Python version for python/multi scans"
        type: string
        required: false
        default: "3.12"
      node_version:
        description: "Node version for node/multi scans"
        type: string
        required: false
        default: "20"
      enable_sbom:
        description: "Generate a CycloneDX SBOM and attach it as an artifact."
        type: boolean
        required: false
        default: true
      enable_malicious_pkg_scan:
        description: "Scan for KNOWN-MALICIOUS / compromised packages via OSV (MAL- advisories), not just CVEs."
        type: boolean
        required: false
        default: true
      dotnet_version:
        description: "SDK version for dotnet/multi scans."
        type: string
        required: false
        default: "8.0.x"
      go_version:
        description: "Go version for go/multi scans."
        type: string
        required: false
        default: "1.22"
      java_version:
        description: "JDK version for java/multi scans."
        type: string
        required: false
        default: "17"
      advisory_mode:
        description: >-
          Report everything, block nothing. For establishing a baseline on a repository that has
          never been scanned this way.

          Dropping a hard gate onto an unknown backlog freezes development and gets the control
          bypassed, which costs more coverage than it buys. Detection immediately, enforcement
          deliberately. This is adoption sequencing — it is NOT softened security, because
          nothing is disabled, scoped away or hidden: every scanner still runs and every finding
          is still reported and persisted.

          It is reported loudly on every job and in the gate for exactly one reason: a silent
          permanent advisory mode is indistinguishable from having no gate at all.
        type: boolean
        required: false
        default: false
      enforce_lint:
        description: >-
          Fail the build on ruff lint findings. Default false, deliberately: `ruff check` used to
          hard-fail while `mypy` was advisory, so a consumer adopting this SECURITY workflow was
          blocked on code STYLE on day one. Lint quality is worth having and is not a security
          control; enforce it when the team has chosen to.
        type: boolean
        required: false
        default: false
      scan_git_history:
        description: >-
          Also scan full git HISTORY for secrets. Default false, deliberately: history scanning
          ignores `paths` and walks every commit in the repository, so a monorepo consumer asking
          to scan one service would get everything anyone ever committed. Slow, and repo-wide.
        type: boolean
        required: false
        default: false
      soft_fail_sast:
        description: "If true, SAST findings report (SARIF) but do not fail the build"
        type: boolean
        required: false
        default: true
    outputs:
      # THE CONTRACT A CONSUMER BINDS TO.
      #
      # Without these a caller sees only red or green, and cannot distinguish "clean" from "we
      # could not determine" from "advisory mode suppressed it". That is the exact collapse this
      # kit exists to prevent, reappearing at the seam where other people integrate with us.
      # Every value here is a term from assurance-taxonomy.yaml -- consumers get the vocabulary,
      # not a boolean.
      assurance_state:
        description: >-
          PASS | FINDINGS | PARTIAL | UNDETERMINED — what this run ESTABLISHED about the code.
          Deliberately separate from what the gate DID about it: a run can establish FINDINGS while
          enforcement is ADVISORY, and UNDETERMINED is never PASS.
        value: ${{ jobs.security-gate.outputs.assurance_state }}
      enforcement_state:
        description: >-
          BLOCKED | ALLOWED | ADVISORY — what the gate did. ADVISORY means findings existed and were
          not blocked; it is not a clean result.
        value: ${{ jobs.security-gate.outputs.enforcement_state }}
      gate_decision:
        description: "DEPRECATED alias of enforcement_state, kept so no consumer breaks. Prefer the pair above."
        value: ${{ jobs.security-gate.outputs.gate_decision }}
      secret_gate:
        description: >-
          PASS | FAIL — evaluated SEPARATELY and never suppressed by advisory_mode. A consumer that
          only checks gate_decision would miss that secrets are enforced unconditionally.
        value: ${{ jobs.security-gate.outputs.secret_gate }}
      scanner_states:
        description: >-
          Compact JSON map of scanner -> state, using scanner_state vocabulary
          (PASS/FINDINGS/PARTIAL/NOT_APPLICABLE/FAILED/UNAVAILABLE/COLLECTION_FAILED).
          PARTIAL and NOT_APPLICABLE are DIFFERENT and must not be merged downstream.
        value: ${{ jobs.security-gate.outputs.scanner_states }}
      undetermined:
        description: >-
          true when ANY scanner reported UNAVAILABLE or COLLECTION_FAILED — i.e. posture could not
          be established. A consumer must not read `gate_decision != FAIL` as "safe" while this is
          true. Absence of a block is not evidence of absence of risk.
        value: ${{ jobs.security-gate.outputs.undetermined }}
      evidence_artifact:
        description: "Name of the run artifact holding the persisted SARIF/evidence."
        value: ${{ jobs.security-gate.outputs.evidence_artifact }}
      established:
        description: >-
          Capabilities that DID establish a result, with their states. Degradation elsewhere does
          not erase these -- a failed scanner does not un-find another scanner's finding.
        value: ${{ jobs.security-gate.outputs.established }}
      unestablished:
        description: >-
          Capabilities that could NOT establish a result, with the reason. These stay unknown until
          new evidence resolves them. A consumer may not default them away, and no downstream stage
          may convert them into a successful state without new collection.
        value: ${{ jobs.security-gate.outputs.unestablished }}
      discovery_state:
        description: >-
          COMPLETE | DISCOVERY_PARTIAL | DISCOVERY_UNAVAILABLE — whether applicability could be
          established at all. A consumer seeing DISCOVERY_UNAVAILABLE must not treat any
          NOT_APPLICABLE in scanner_states as evidence of absence.
        value: ${{ jobs.security-gate.outputs.discovery_state }}
    secrets:
      SEMGREP_APP_TOKEN:
        description: "Optional Semgrep managed-rules/dashboard token"
        required: false

permissions:
  contents: read
  security-events: write   # upload SARIF to code scanning

jobs:
  # ─── Secrets ────────────────────────────────────────────────
  # ─── DISCOVERY ────────────────────────────────────────────────────────────────
  # Establish what is ACTUALLY in the caller's scope before anything else starts.
  #
  # Previously every language job booted on a DECLARED selector: `language: multi` started six SAST
  # jobs whether or not that language existed, each paying checkout plus toolchain setup to discover
  # nothing and exit. That is a correctness defect and a cost defect wearing one hat.
  #
  # SELECTOR INTERSECT DISCOVERY, and disagreement is REPORTED, never silent:
  #   discovered + selected      -> RUN
  #   discovered + not selected  -> EXCLUDED_BY_SELECTOR, printed. Narrowing scope must never
  #                                 silently reduce VISIBILITY of what was not scanned.
  #   selected + not discovered  -> NOT_APPLICABLE, backed by a search that found nothing
  #
  # FAIL-SAFE. This job is now control-plane input for every scanner, which makes it the highest
  # leverage place in the kit for a lie. If discovery fails it must NEVER resolve to a tidy row of
  # NOT_APPLICABLE. It sets state=DISCOVERY_UNAVAILABLE and turns EVERYTHING ON: over-scanning is a
  # cost problem, under-scanning while reporting green is an assurance failure.
  discover:
    name: Discover what is actually here
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # LEAST PRIVILEGE, DECLARED RATHER THAN INHERITED.
    #
    # Without this block the job inherits the workflow-level `security-events: write`, which it
    # does not need: the platform probe only READS the code-scanning endpoint to establish
    # whether the capability is available. A discovery job holding a write token to the Security
    # tab is a larger blast radius than the job's purpose justifies, and nothing about inheriting
    # it is visible when reading this job.
    permissions:
      contents: read
      security-events: read
    outputs:
      python: ${{ steps.d.outputs.python }}
      node:   ${{ steps.d.outputs.node }}
      go:     ${{ steps.d.outputs.go }}
      dotnet: ${{ steps.d.outputs.dotnet }}
      java:   ${{ steps.d.outputs.java }}
      cpp:    ${{ steps.d.outputs.cpp }}
      iac:    ${{ steps.d.outputs.iac }}
      state:  ${{ steps.d.outputs.state }}
      # Coverage, not applicability. Empty = nothing unsupported was seen. A comma list = code this
      # platform cannot scan is present. UNDETERMINED = the coverage probe itself could not run.
      unsupported: ${{ steps.d.outputs.unsupported }}
      # Platform applicability. Established ONCE so sixteen jobs cannot hold sixteen beliefs
      # about the same organisation setting. UNKNOWN is a real value, never coerced to false.
      ghas_available:      ${{ steps.platform.outputs.ghas_available }}
      code_scanning:       ${{ steps.platform.outputs.code_scanning }}
      secret_scanning:     ${{ steps.platform.outputs.secret_scanning }}
      push_protection:     ${{ steps.platform.outputs.push_protection }}
      dependabot_alerts:   ${{ steps.platform.outputs.dependabot_alerts }}
      dependabot_updates:  ${{ steps.platform.outputs.dependabot_updates }}
      dependabot_config:   ${{ steps.platform.outputs.dependabot_config }}
      visibility:          ${{ steps.platform.outputs.visibility }}
      platform_source:     ${{ steps.platform.outputs.platform_source }}
    steps:
      - uses: actions/checkout@v7
      - id: d
        env:
          # CALLER-CONTROLLED INPUT ARRIVES AS DATA, NOT AS SCRIPT TEXT.
          #
          # These were interpolated straight into the script, and `scope` then fed
          # `find "$scope"`. A caller passing  x"; rm -rf /; #  as `paths` would have executed
          # it inside the shared workflow every consumer runs.
          #
          # Lower exposure than the PR-body case -- setting these needs write access to the
          # CALLING repository, not merely the ability to open a pull request. It is not the
          # same class and it is not nothing: this kit is meant to be consumed by many repos,
          # and one misconfigured or compromised caller should not get code execution in the
          # workflow the others share. A trusted input can still be a malformed input.
          IN_PATHS: ${{ inputs.paths }}
          IN_LANGUAGE: ${{ inputs.language }}
          IN_IAC_MODE: ${{ inputs.iac_mode }}
          IN_ENABLE_IAC: ${{ inputs.enable_iac }}
        run: |
          set -uo pipefail
          state=COMPLETE
          scope="${IN_PATHS:-.}"
          [ -d "$scope" ] || scope="."
          sel="${IN_LANGUAGE:-auto}"
          iac_mode="${IN_IAC_MODE:-auto}"

          # A DEAD INPUT MUST SAY SO OUT LOUD. `enable_iac` was superseded by `iac_mode` and left
          # declared, so a caller could set it, watch it be accepted, and get nothing. Silence
          # here is what let a configured-looking run scan no infrastructure at all.
          if [ "${IN_ENABLE_IAC:-false}" = "true" ]; then
            echo "::warning title=enable_iac is ignored::This input is deprecated and nothing"
            echo "reads it. IaC applicability is decided by artifact presence; use iac_mode to"
            echo "force or disable. Your setting had NO effect on this run."
            echo "| (config) | enable_iac IGNORED | deprecated; use iac_mode |" >> "$GITHUB_STEP_SUMMARY"
          fi

          # FAIL-SAFE: if the survey itself cannot run, everything is enabled and the state says so.
          trap 'echo "::error title=Discovery failed::Applicability could not be established."; \
                for k in python node go dotnet java cpp iac; do echo "$k=true" >> "$GITHUB_OUTPUT"; done; \
                echo "state=DISCOVERY_UNAVAILABLE" >> "$GITHUB_OUTPUT"; exit 0' ERR

          # PER-PROBE SENTINEL FILES, NOT ONE GLOBAL FLAG, AND NOT VARIABLES.
          #
          # Two separate reasons, both learned the hard way:
          #
          # (1) SUBSHELL. probe is invoked inside $( ), so any variable it sets is discarded on
          #     the way out. An earlier version detected survey failure correctly and then threw
          #     the answer away, reporting COMPLETE. A survey that fails and reports success is
          #     precisely the defect this job exists to prevent.
          #
          # (2) PARTIAL IS NOT TOTAL. The version after THAT used a single shared flag, so one
          #     failing probe discarded six perfectly good answers and declared total ignorance.
          #     Discarding established evidence is as destructive as inventing it -- merely in
          #     the opposite direction. Each ecosystem's applicability is established, or not,
          #     ON ITS OWN.
          FAILDIR="$(mktemp -d)"
          probe() {
            # "FOUND NOTHING" AND "COULD NOT LOOK" ARE DIFFERENT ANSWERS.
            #
            # The obvious idiom -- [ -n "$(find ...)" ] && yes || no -- collapses them. A find
            # that ERRORS produces empty output, which reads as "this ecosystem is not present",
            # which becomes NOT_APPLICABLE, which becomes a green run over code nobody scanned.
            #
            # -print -quit, NOT `| head -1`. With `pipefail` set, head closing the pipe after one
            # line kills find with SIGPIPE and the pipeline reports 141 -- so the survey announced
            # FAILURE on any repository large enough to produce a second match. Measured: 5,000
            # files => rc=141, one file => rc=0. Discovery would therefore have reported
            # DISCOVERY_UNAVAILABLE on essentially every real repository, force-enabling every
            # scanner and rendering the alarm meaningless through constant false firing. It failed
            # SAFE, which is why nothing caught it: over-scanning is quiet. -print -quit is find's
            # OWN early exit -- no pipe, no signal, no lie.
            _k="$1"; shift
            _res="$(find "$scope" -maxdepth 8 \( "$@" \) \
              -not -path '*/node_modules/*' -not -path '*/vendor/*' -not -path '*/.git/*' \
              -print -quit 2>/dev/null)"
            _rc=$?
            if [ "$_rc" -ne 0 ]; then
              : > "$FAILDIR/$_k"
              echo "::warning title=Probe failed::find exited $_rc probing $_k; applicability for $_k is UNDETERMINED."
              printf 'no'
              return 0
            fi
            [ -n "$_res" ] && printf 'yes' || printf 'no'
          }

          selected() {
                    # A LIST IS THE OBVIOUS THING A CALLER WRITES, AND IT USED TO MEAN "NONE".
            #
            # The selector was an exact match against one ecosystem name, so `language: python,javascript`
            # -- the natural way to say "this repo is both" -- matched neither `auto`, `multi`, nor any
            # single name, and EXCLUDED_BY_SELECTOR fired for every ecosystem present. The first live run
            # of this kit against a seeded corpus scanned exactly the ecosystem-AGNOSTIC jobs and skipped
            # CodeQL, Bandit and IaC over a repository containing Python, JSX, Terraform and a Dockerfile.
            # The run went green.
            #
            # It was not silent -- each exclusion emitted a notice and a summary row, which is the only
            # reason it was diagnosable. But a config value that reads as "scan these two languages" and
            # means "scan no languages" is a footgun whichever way it is annotated, so the selector now
            # accepts a delimited list. Separators: comma, space, semicolon, plus.
            #
            # Aliases exist because the ecosystem keys are internal and the names callers reach for are
            # not: javascript/typescript/js/ts all mean `node`, csharp/c#/.net mean `dotnet`, c/c++/cpp
            # mean `cpp`, py means `python`, tf/terraform mean `iac`.
            case "$sel" in auto|multi) return 0 ;; esac
            _want="$(printf '%s' "$sel" | tr "A-Z" "a-z" | tr ",;+" "   ")"
            _unknown=""
            for _w in $_want; do
              case "$_w" in
                javascript|typescript|js|ts|node) ;;
                py|python) ;;
                "c#"|csharp|dotnet|.net) ;;
                c|c++|cpp) ;;
                tf|terraform|iac) ;;
                go|java|kotlin|scala) ;;
                *) _unknown="$_unknown $_w" ;;
              esac
            done
            if [ -n "$_unknown" ]; then
              # FAIL CLOSED, LOUDLY. An unrecognised selector used to mean "matches nothing", so a
              # typo or an unsupported name silently emptied the scan and the run went green. An
              # input this tool does not understand is an UNKNOWN, and an unknown must never resolve
              # to "scan less" -- that is the same inversion as treating a failed probe as absence.
              echo "::error title=Unrecognised language selector::language=\'$sel\' contains$_unknown,"
              echo "which this kit does not recognise. Refusing to silently scan less. Use auto, or"
              echo "a list of: python node go java dotnet cpp iac (aliases: js/ts, py, c#, c++, tf)."
              echo "| (selector) | UNRECOGNISED | $_unknown -- refused, see error |" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            for _w in $_want; do
              case "$_w" in
                javascript|typescript|js|ts|node) _w=node ;;
                py|python) _w=python ;;
                "c#"|csharp|dotnet|.net) _w=dotnet ;;
                c|c++|cpp) _w=cpp ;;
                tf|terraform|iac) _w=iac ;;
              esac
              [ "$_w" = "$1" ] && return 0
            done
            return 1
          }

          {
            echo "### Discovery"
            echo ""
            echo "| ecosystem | decision | evidence |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          emit() {
            n="$1"; found="$2"; label="$3"
            # UNDETERMINED IS ITS OWN ANSWER. This ecosystem's probe could not run, so we do not
            # know whether it is here. We do not get to call that NOT_APPLICABLE, and we do not
            # get to call it a finding either -- we enable it and say why. Note this deliberately
            # OVERRIDES the language selector: a selector narrows what we scan among things we
            # KNOW are present. It cannot narrow away something whose presence was never
            # established, because that would let a config value silently resolve an unknown.
            if [ -e "$FAILDIR/$n" ]; then
              echo "$n=true" >> "$GITHUB_OUTPUT"
              printf '  %-8s UNDETERMINED -> RUN   probe failed; presence unknown\n' "$n"
              echo "| $n | UNDETERMINED -> RUN | probe failed; presence unknown, so enabled |" >> "$GITHUB_STEP_SUMMARY"
              return 0
            fi
            if [ "$found" = "yes" ] && selected "$n"; then
              echo "$n=true" >> "$GITHUB_OUTPUT"
              printf '  %-8s RUN                   %s\n' "$n" "$label"
              echo "| $n | RUN | $label |" >> "$GITHUB_STEP_SUMMARY"
            elif [ "$found" = "yes" ]; then
              echo "$n=false" >> "$GITHUB_OUTPUT"
              printf '  %-8s EXCLUDED_BY_SELECTOR  present, language=%s excludes it\n' "$n" "$sel"
              echo "::notice title=$n excluded::Present in scope but language='$sel' excludes it."
              echo "| $n | EXCLUDED_BY_SELECTOR | present, excluded by language=$sel |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "$n=false" >> "$GITHUB_OUTPUT"
              printf '  %-8s NOT_APPLICABLE        searched, none found\n' "$n"
              echo "| $n | NOT_APPLICABLE | searched, none found |" >> "$GITHUB_STEP_SUMMARY"
            fi
          }

          py="$(probe python -name '*.py' -o -name requirements.txt -o -name pyproject.toml)"
          nd="$(probe node   -name package.json)"
          go="$(probe go     -name go.mod)"
          dn="$(probe dotnet -name '*.csproj' -o -name '*.sln')"
          jv="$(probe java   -name pom.xml -o -name build.gradle -o -name build.gradle.kts)"
          cp="$(probe cpp    -name '*.c' -o -name '*.cpp' -o -name '*.cc' -o -name '*.h' -o -name '*.hpp')"
          ia="$(probe iac    -name '*.tf' -o -name '*.bicep' -o -name 'Dockerfile*' -o -name Chart.yaml -o -name kustomization.yaml -o -name azuredeploy.json)"

          # WHAT IS HERE THAT WE CANNOT SCAN?
          #
          # Discovery previously asked seven CLOSED questions -- is Python here, is Go here -- and
          # never asked whether there was code it did not recognise. A repository of Rust, Ruby and
          # PHP therefore produced state=COMPLETE, every ecosystem false, and a green run over code
          # nothing had looked at. Discovery had not failed; it succeeded at answering the wrong
          # question, which is the more dangerous of the two.
          #
          # COMPLETE means "I asked all my questions", NOT "I understand this repository". Those
          # are different claims and the consumer needs both. This is the coverage claim, kept as
          # a SEPARATE output rather than folded into state: a scanner gap is not a survey failure,
          # and collapsing them would let a known limitation hide inside an error condition.
          #
          # It is a COVERAGE DECLARATION, NOT A FINDING. Unsupported code present is not a
          # vulnerability and must never be scored as one -- it is this platform telling an adopter
          # exactly where its assurance stops inside their specific repository, which is the single
          # most useful thing it can say to someone deciding whether to trust it.
          unsupported=""
          unsup_raw="$(find "$scope" -maxdepth 8 -type f \( \
              -name '*.rs' -o -name '*.rb' -o -name '*.php' -o -name '*.swift' -o -name '*.kt' \
              -o -name '*.scala' -o -name '*.ex' -o -name '*.exs' -o -name '*.erl' -o -name '*.hs' \
              -o -name '*.lua' -o -name '*.pl' -o -name '*.r' -o -name '*.jl' -o -name '*.dart' \
              -o -name '*.groovy' -o -name '*.clj' -o -name '*.zig' -o -name '*.nim' \
              -o -name '*.vb' -o -name '*.fs' -o -name '*.sh' -o -name '*.ps1' \) \
              -not -path '*/node_modules/*' -not -path '*/vendor/*' -not -path '*/.git/*' \
              -print 2>/dev/null)"
          unsup_rc=$?
          if [ "$unsup_rc" -ne 0 ]; then
            # Same rule as every other probe: could-not-look is not found-nothing.
            unsupported="UNDETERMINED"
            echo "::warning title=Coverage probe failed::Could not determine whether unsupported"
            echo "languages are present. This is unknown, not absent."
          elif [ -n "$unsup_raw" ]; then
            # sed takes the final dot, so a dotted directory name cannot masquerade as an
            # extension. sort -u after, never a pipe to an early-exiting reader.
            unsupported="$(printf '%s\n' "$unsup_raw" | sed 's/.*\.//' | sort -u | tr '\n' ',' | sed 's/,$//')"
            echo "::warning title=Unsupported languages present::This repository contains code this"
            echo "platform has no scanner for: $unsupported"
            echo "Those files were NOT scanned. This run establishes nothing about them."
            echo "| (coverage) | UNSUPPORTED_PRESENT | no scanner for: $unsupported |" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "unsupported=$unsupported" >> "$GITHUB_OUTPUT"

          # STATE IS COMPUTED FROM HOW MUCH WAS ESTABLISHED, NOT FROM WHETHER ANYTHING FAILED.
          # Every probe failing is genuinely total ignorance. SOME failing is not, and collapsing
          # the two throws away answers we actually have. Failed probes are force-enabled
          # individually by emit(), so DISCOVERY_UNAVAILABLE needs no special case -- it falls
          # out of every probe having failed.
          failed=0
          for k in python node go dotnet java cpp iac; do
            [ -e "$FAILDIR/$k" ] && failed=$((failed + 1))
          done
          if [ "$failed" -eq 7 ]; then
            state=DISCOVERY_UNAVAILABLE
            echo "::error title=Discovery unavailable::Every probe failed. Applicability could not"
            echo "be established at all, so every capability is force-enabled. Results from this"
            echo "run must NOT be read as coverage."
          elif [ "$failed" -gt 0 ]; then
            state=DISCOVERY_PARTIAL
            echo "::warning title=Discovery partial::$failed of 7 probes failed. What the other"
            echo "probes established still holds; the failed ones are enabled as UNDETERMINED."
          fi

          emit python "$py" "*.py / requirements.txt / pyproject.toml"
          emit node   "$nd" "package.json"
          emit go     "$go" "go.mod"
          emit dotnet "$dn" "*.csproj / *.sln"
          emit java   "$jv" "pom.xml / build.gradle"
          emit cpp    "$cp" "*.c / *.cpp / *.h"

          # IaC carries its own mode, because "off by default" was the wrong worldview.
          case "$iac_mode" in
            disabled)
              echo "iac=false" >> "$GITHUB_OUTPUT"
              echo "::warning title=IaC scanning DISABLED::Explicitly turned off for this run."
              echo "| iac | DISABLED | explicit exception, not a default |" >> "$GITHUB_STEP_SUMMARY"
              ;;
            required)
              if [ -e "$FAILDIR/iac" ]; then
                # "ABSENCE IS THE FINDING" REQUIRES THAT ABSENCE WAS ESTABLISHED. The probe did
                # not run, so nothing was discovered AND nothing was ruled out. Declaring it
                # missing here would turn a failure to observe into a confident negative finding
                # -- the exact inversion this job exists to prevent, just pointing the other way.
                echo "iac=true" >> "$GITHUB_OUTPUT"
                echo "::warning title=IaC required, presence UNDETERMINED::The IaC probe failed."
                echo "Absence was NOT established, so this is not a missing-IaC finding. Enabled."
                echo "| iac | UNDETERMINED -> RUN | required; probe failed, absence not established |" >> "$GITHUB_STEP_SUMMARY"
              elif [ "$ia" = "yes" ]; then
                echo "iac=true" >> "$GITHUB_OUTPUT"
                echo "| iac | RUN | required, and found |" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "iac=false" >> "$GITHUB_OUTPUT"
                echo "::error title=IaC REQUIRED but absent::This repository is declared to contain"
                echo "infrastructure-as-code and none was discovered. ABSENCE IS THE FINDING."
                # Only ever DEGRADE the state. If probes already established total ignorance,
                # this must not quietly upgrade it to merely partial.
                [ "$state" = "COMPLETE" ] && state=DISCOVERY_PARTIAL
                echo "| iac | MISSING_BUT_REQUIRED | declared by profile, none discovered |" >> "$GITHUB_STEP_SUMMARY"
              fi
              ;;
            # IaC APPLICABILITY IS DECIDED BY ARTIFACT PRESENCE, NEVER BY THE LANGUAGE SELECTOR.
            #
            # `emit` applies the language selector, so a caller who wrote `language: python` got no
            # IaC scan over a repository full of Terraform -- the scanner was switched off by an
            # input about APPLICATION LANGUAGE, which is a different axis entirely. AXES_AND_PHASES.md
            # says discovery decides applicability and names contamination between axes as the defect;
            # this was that, in the code, while the document described it as a principle.
            #
            # A .tf file is not written in Python or JavaScript. Its presence is the whole question.
            *)
              if [ -e "$FAILDIR/iac" ]; then
                echo "iac=true" >> "$GITHUB_OUTPUT"
                echo "| iac | UNDETERMINED -> RUN | probe failed; presence unknown, so enabled |" >> "$GITHUB_STEP_SUMMARY"
              elif [ "$ia" = "yes" ]; then
                echo "iac=true" >> "$GITHUB_OUTPUT"
                printf '  %-8s RUN                   %s\n' iac "*.tf / *.bicep / Dockerfile / Chart.yaml"
                echo "| iac | RUN | artifact present; applicability is not a language question |" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "iac=false" >> "$GITHUB_OUTPUT"
                echo "| iac | NOT_APPLICABLE | no IaC artifact discovered |" >> "$GITHUB_STEP_SUMMARY"
              fi
              ;;
          esac

          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "discovery state: $state"

      # ─────────────────────────────────────────────────────────────────────
      # PLATFORM APPLICABILITY — a different axis from language applicability
      # ─────────────────────────────────────────────────────────────────────
      #
      # "Is there Python here" and "is CodeQL available to us at all" are unrelated questions,
      # and conflating them is how a repository full of Python gets a green run with no semantic
      # analysis. Every downstream job previously answered this for itself, which meant sixteen
      # jobs could hold sixteen different beliefs about the same organisation setting.
      #
      # FOUR STATES, DELIBERATELY NOT COLLAPSED INTO `skipped`:
      #
      #   UNAVAILABLE      not licensed / not available to this repository   -> platform action
      #   NOT_CONFIGURED   available and switched off                        -> platform action
      #   NOT_APPLICABLE   no code of a supported kind in scope              -> nobody's action
      #   ENABLED          available and on                                  -> run it
      #   UNKNOWN          this token cannot see the answer                  -> run it, say so
      #
      # `skipped` renders all five identically in the Actions UI, so the run tells a reader
      # nothing about whether a decision, a licence or a defect produced the gap.
      #
      # UNKNOWN IS NOT FALSE. The security_and_analysis block is only returned to callers with
      # admin permission on the repository. A read-scoped GITHUB_TOKEN legitimately cannot see it.
      # Reporting `false` there would be a fabricated negative -- the same defect as a fabricated
      # zero, and it would silently disable scanners on repositories that are fully licensed.
      - id: platform
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail

          ghas=unknown; codescan=unknown; secret=unknown
          push=unknown; dep=unknown; depupd=unknown; vis=unknown
          how="none"

          if repo_json=$(gh api "repos/${GITHUB_REPOSITORY}" 2>/dev/null); then
            vis=$(printf '%s' "$repo_json" | jq -r '.visibility // "unknown"')
            sa=$(printf '%s' "$repo_json" | jq -r '.security_and_analysis // empty')
            if [ -n "$sa" ]; then
              how="security_and_analysis"
              g=$(printf '%s' "$sa" | jq -r '.advanced_security.status // "absent"')
              s=$(printf '%s' "$sa" | jq -r '.secret_scanning.status // "absent"')
              p=$(printf '%s' "$sa" | jq -r '.secret_scanning_push_protection.status // "absent"')
              d=$(printf '%s' "$sa" | jq -r '.dependabot_security_updates.status // "absent"')
              case "$g" in enabled) ghas=true ;; disabled) ghas=false ;; esac
              case "$s" in enabled) secret=ENABLED ;; disabled) secret=NOT_CONFIGURED ;; esac
              case "$p" in enabled) push=ENABLED ;; disabled) push=NOT_CONFIGURED ;; esac
              case "$d" in enabled) depupd=ENABLED ;; disabled) depupd=NOT_CONFIGURED ;; esac
            fi
          fi

          # PUBLIC REPOSITORIES GET CODE SCANNING AND SECRET SCANNING WITHOUT GHAS.
          # Deriving availability from the licence alone reports UNAVAILABLE on every public
          # repository in the estate, which is wrong in the direction that switches scanning off.
          if [ "$vis" = "public" ]; then
            [ "$ghas" = "unknown" ] && ghas=true
            [ "$secret" = "unknown" ] && secret=ENABLED
          fi

          # BEHAVIOURAL PROBE, when the settings object was not visible. Asking the code-scanning
          # API what it says is more reliable than inferring from a licence field we cannot read.
          # 403 with an advanced-security message is a definite UNAVAILABLE; 404 means enabled but
          # no analysis has ever been uploaded, which is NOT the same as unavailable.
          if [ "$ghas" = "unknown" ] || [ "$how" = "none" ]; then
            body=$(gh api "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?per_page=1" 2>&1) || true
            case "$body" in
              *"Advanced Security"*|*"advanced security"*|*"not enabled"*)
                        ghas=false; how="${how},code-scanning probe" ;;
              *"no analysis found"*|*"No analysis found"*)
                        ghas=true;  how="${how},code-scanning probe" ;;
              \[*|*'"number"'*)
                        ghas=true;  how="${how},code-scanning probe" ;;
            esac
          fi

          case "$ghas" in
            true)  codescan=ENABLED ;;
            false) codescan=UNAVAILABLE
                   [ "$secret" = "unknown" ] && secret=UNAVAILABLE
                   [ "$push"   = "unknown" ] && push=UNAVAILABLE ;;
            *)     codescan=UNKNOWN ;;
          esac

          # Dependabot ALERTS are on for public repos and licence-gated for private ones;
          # Dependabot UPDATES are a separate switch. Two different things, two outputs --
          # collapsing them is how "we have Dependabot" came to mean four different things.
          [ "$dep" = "unknown" ] && [ "$vis" = "public" ] && dep=ENABLED
          if [ -f .github/dependabot.yml ] || [ -f .github/dependabot.yaml ]; then
            cfg=PRESENT
          else
            cfg=ABSENT
          fi

          {
            echo "ghas_available=$ghas"
            echo "code_scanning=$codescan"
            echo "secret_scanning=$secret"
            echo "push_protection=$push"
            echo "dependabot_alerts=$dep"
            echo "dependabot_updates=$depupd"
            echo "dependabot_config=$cfg"
            echo "visibility=$vis"
            echo "platform_source=$how"
          } >> "$GITHUB_OUTPUT"

          {
            echo ""
            echo "### Platform capability discovery"
            echo ""
            echo "| capability | state | how established |"
            echo "|---|---|---|"
            echo "| GitHub Advanced Security | $ghas | $how |"
            echo "| Code scanning (CodeQL) | $codescan | derived from GHAS + visibility |"
            echo "| Secret scanning | $secret | $how |"
            echo "| Push protection | $push | $how |"
            echo "| Dependabot alerts | $dep | $how |"
            echo "| Dependabot updates | $depupd | $how |"
            echo "| dependabot.yml | $cfg | file presence |"
            echo "| Repository visibility | $vis | repos API |"
            echo ""
            if [ "$how" = "none" ]; then
              echo "**The settings object was not readable by this token.** That is expected for a"
              echo "read-scoped token without admin on the repository. UNKNOWN here means *nobody"
              echo "asked successfully*, not *the capability is absent* -- scanners run anyway and"
              echo "report their applicability as UNKNOWN rather than claiming a clean result."
            fi
            echo ""
            echo "UNAVAILABLE, NOT_CONFIGURED, NOT_APPLICABLE and UNKNOWN are four different"
            echo "situations with four different owners. The Actions UI renders all of them as"
            echo "\`skipped\`, which is why they are established here once and consumed everywhere"
            echo "rather than guessed independently by each job."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "platform: ghas=$ghas code-scanning=$codescan secret=$secret push=$push"
          echo "          dependabot alerts=$dep updates=$depupd config=$cfg via ${how}"

  secret-scan:
    needs: [discover]
    # Ecosystem-agnostic: every repository can leak a secret and resolve a dependency.
    # Gated only by discovery being able to run at all.
    if: always()
    name: Secret scan (gitleaks + detect-secrets)
    runs-on: ubuntu-latest
    # Bounded so a stalled dependency cannot bill six hours (LM-001: unbounded execution
    # converts a dependency failure into uncontrolled cost).
    # NOT YET: a timeout still surfaces as a plain job failure. It SHOULD classify as
    # UNAVAILABLE / EXECUTION_TIMEOUT — cost is bounded here, semantics are not. See
    # docs/roadmap/FUTURE_WORK.md. Do not let this comment imply the mapping exists.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history ONLY when explicitly requested. gitleaks-action previously forced
          # fetch-depth 0 and scanned every commit regardless of `paths` — a consumer asking
          # for one service got 33 commits of unrelated history scanned instead.
          fetch-depth: ${{ inputs.scan_git_history && 0 || 1 }}

      - name: Write the Azure/Entra rules
        run: |
          # INLINED ON PURPOSE. A reusable workflow runs against the CALLER's checkout, so
          # developer-safety/hooks/gitleaks-azure.toml does not exist at runtime. Referencing
          # it worked only inside this repo. Consumers were silently getting STOCK gitleaks
          # while the capability matrix claimed 14 custom Azure/Entra classes — detection the
          # caller never actually had.
          cat > gitleaks-azure.toml <<'GITLEAKS_TOML'
          # Gitleaks config — Azure / Entra credential classes.
          #
          # WHY THIS EXISTS: the baseline hook set carried `detect-aws-credentials` and nothing equivalent for
          # Azure. Generic high-entropy detection MAY catch some Azure secrets. "May catch" is not deliberate
          # coverage of the credential classes you actually use.
          #
          # SCOPE: this is a DEVELOPER GUARDRAIL. It is bypassable with --no-verify and is not the security
          # boundary. Repository/organization secret scanning in CI is the authoritative layer. Both should
          # exist; neither substitutes for the other.
          #
          # Usage:  gitleaks detect --config developer-safety/hooks/gitleaks-azure.toml --source .
          # Extend: [extend] useDefault = true  pulls in gitleaks' built-in rules as well.

          title = "Azure / Entra credential detection"

          [extend]
          useDefault = true

          # --- Storage ------------------------------------------------------------------

          [[rules]]
          id = "azure-storage-connection-string"
          description = "Azure Storage connection string containing an account key"
          regex = '''DefaultEndpointsProtocol=https?;.*AccountKey=[A-Za-z0-9+/=]{80,}'''
          tags = ["azure", "storage", "connection-string"]

          [[rules]]
          id = "azure-storage-account-key"
          description = "Azure Storage account key (88-char base64 ending in ==)"
          regex = '''(?i)(accountkey|storage[_-]?key|primary[_-]?key)\s*[:=]\s*['\"]?([A-Za-z0-9+/]{86}==)'''
          secretGroup = 2
          tags = ["azure", "storage"]

          [[rules]]
          id = "azure-sas-token"
          description = "Azure Shared Access Signature token"
          regex = '''[?&]sv=\d{4}-\d{2}-\d{2}&(?:[a-z]{2}=[^&\s'\"]*&){1,8}sig=[A-Za-z0-9%+/=]{20,}'''
          tags = ["azure", "sas"]

          # --- Messaging ----------------------------------------------------------------

          [[rules]]
          id = "azure-shared-access-key"
          description = "Service Bus / Event Hub / Relay / IoT Hub SharedAccessKey"
          regex = '''(?i)Endpoint=sb://[^;]+;SharedAccessKeyName=[^;]+;SharedAccessKey=[A-Za-z0-9+/=]{20,}'''
          tags = ["azure", "servicebus", "eventhub"]

          [[rules]]
          id = "azure-iothub-connection-string"
          description = "IoT Hub connection string"
          regex = '''HostName=[^;]+\.azure-devices\.net;.*SharedAccessKey=[A-Za-z0-9+/=]{20,}'''
          tags = ["azure", "iot"]

          # --- Data ---------------------------------------------------------------------

          [[rules]]
          id = "azure-cosmos-key"
          description = "Cosmos DB account key or connection string"
          regex = '''(?i)(AccountEndpoint=https://[^;]+\.documents\.azure\.com[^;]*;AccountKey=|cosmos[_-]?key\s*[:=]\s*['\"]?)([A-Za-z0-9+/]{86}==)'''
          secretGroup = 2
          tags = ["azure", "cosmos"]

          [[rules]]
          id = "azure-sql-connection-string"
          description = "Azure SQL connection string with an inline password"
          regex = '''(?i)Server=tcp:[^;]+\.database\.windows\.net.*(Password|Pwd)=[^;\s'\"]{6,}'''
          tags = ["azure", "sql"]

          [[rules]]
          id = "azure-redis-key"
          description = "Azure Cache for Redis connection string with a password"
          regex = '''(?i)[a-z0-9-]+\.redis\.cache\.windows\.net:\d+,password=[A-Za-z0-9+/=]{20,}'''
          tags = ["azure", "redis"]

          # --- Entra / identity ---------------------------------------------------------

          [[rules]]
          id = "entra-client-secret-value"
          description = "Entra app registration client secret (newer value format)"
          regex = '''\b[A-Za-z0-9~._-]{3}8Q~[A-Za-z0-9~._-]{31,34}\b'''
          tags = ["azure", "entra", "client-secret"]

          [[rules]]
          id = "entra-client-secret-assignment"
          description = "Client secret assigned to a variable or config key"
          regex = '''(?i)(client[_-]?secret|app[_-]?secret|azure[_-]?client[_-]?secret|arm[_-]?client[_-]?secret)\s*[:=]\s*['\"]([A-Za-z0-9~._@#$%^&*+/=-]{20,})['\"]'''
          secretGroup = 2
          tags = ["azure", "entra"]

          [[rules]]
          id = "azure-service-principal-password-cli"
          description = "Service principal credential printed or passed on a CLI"
          regex = '''(?i)az\s+(ad\s+sp|login).*--password\s+['\"]?[^\s'\"]{8,}'''
          tags = ["azure", "entra", "cli"]

          # --- DevOps / platform --------------------------------------------------------

          [[rules]]
          id = "azure-devops-pat"
          description = "Azure DevOps personal access token"
          regex = '''(?i)(azure[_-]?devops|ado|vsts|system[_-]?accesstoken)[_-]?(pat|token)?\s*[:=]\s*['\"]?([a-z2-7]{52})['\"]?'''
          secretGroup = 3
          tags = ["azure", "devops", "pat"]

          [[rules]]
          id = "azure-subscription-key"
          description = "API Management / Cognitive Services subscription key"
          regex = '''(?i)(ocp-apim-subscription-key|subscription[_-]?key|api[_-]?key)\s*[:=]\s*['\"]?([a-f0-9]{32})['\"]?'''
          secretGroup = 2
          tags = ["azure", "apim"]

          [[rules]]
          id = "azure-publish-settings"
          description = "App Service publish profile containing userPWD"
          regex = '''userPWD=['\"][^'\"]{8,}['\"]'''
          tags = ["azure", "appservice"]

          # --- Allowlist ----------------------------------------------------------------
          # Placeholders, docs and test fixtures. Extend locally — do not weaken the rules to silence noise.

          [allowlist]
          description = "Documentation placeholders and obvious non-secrets"
          regexes = [
            '''00000000-0000-0000-0000-000000000000''',
            '''(?i)(your|my|the|example|sample|dummy|placeholder|redacted|changeme|xxx+|<[^>]+>)[_-]?(secret|key|password|token)''',
            '''(?i)accountkey=[A-Za-z0-9+/]{0,20}(example|test|fake|dummy)''',
          ]
          paths = [
            # DO NOT allowlist .md / .rst / .txt wholesale. Secrets land in runbooks, notes and
            # READMEs constantly, and a doc-wide exemption makes every one of them invisible.
            # This was shipped once and the validation fixture caught it — three of four rules
            # silently stopped detecting because their fixture files ended in .txt.
            '''(^|/)docs/adr/.*\.md$''',              # ADRs quote config examples; narrow and deliberate
            '''(^|/)tests?/fixtures?/''',
            '''\.env\.example$''',
            '''\.env\.template$''',
            '''(^|/)CHANGELOG\.md$''',
          ]
          GITLEAKS_TOML
          echo "rules loaded: $(grep -c 'rules' gitleaks-azure.toml)"

      - name: Install gitleaks
        run: |
          set -euo pipefail
          # The release CDN returned 503 in a prior run. URL and asset name were correct; the
          # delivery path is not reliable. Extract from the vendor image instead.
          IMG=zricethezav/gitleaks:v8.21.2
          docker pull -q "$IMG"
          CID=$(docker create "$IMG")
          docker cp "$CID:/usr/bin/gitleaks" ./gitleaks || docker cp "$CID:/gitleaks" ./gitleaks
          docker rm -f "$CID" >/dev/null
          sudo mv gitleaks /usr/local/bin/ && sudo chmod +x /usr/local/bin/gitleaks
          gitleaks version

      - name: Gitleaks (path-scoped, redacted)
        id: gitleaks
        run: |
          set -uo pipefail
          # --redact is NOT optional. Without it the matched credential is written into the
          # SARIF, which then reaches job logs and a downloadable artifact — turning the secret
          # scanner into a secret DISCLOSURE channel. Findings carry rule, file and line only.
          if [ "${{ inputs.scan_git_history }}" = "true" ]; then
            echo "Scanning working tree AND git history (repository-wide; ignores paths)."
            gitleaks detect --redact --config gitleaks-azure.toml \
              --report-format sarif --report-path gitleaks.sarif --exit-code 0
          else
            echo "Scanning working tree at: ${{ inputs.paths }}"
            gitleaks detect --no-git --source "${{ inputs.paths }}" --redact \
              --config gitleaks-azure.toml \
              --report-format sarif --report-path gitleaks.sarif --exit-code 0
          fi
          # A PARSE FAILURE IS NOT ZERO FINDINGS.
          #
          # This was `jq ... 2>/dev/null || echo 0`, so a missing, truncated or malformed report
          # produced n=0 -- which the gate reads as CLEAN. The taxonomy already had a word for
          # exactly this (COLLECTION_FAILED: "an empty but well-formed result is indistinguishable
          # from a clean scan") while the code did the opposite. Found by auditing the class after
          # the same defect turned up in discovery, not by reading this line.
          if [ ! -s gitleaks.sarif ]; then
            echo "::error title=COLLECTION_FAILED::gitleaks.sarif was not produced."
            echo "An ABSENT report is not zero findings. Posture cannot be established from this run."
            echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if ! n=$(jq '[.runs[].results[]] | length' gitleaks.sarif 2>&1); then
            echo "::error title=COLLECTION_FAILED::gitleaks.sarif is not valid SARIF."
            echo "jq said: $n"
            echo "A PARSE FAILURE is not zero findings."
            echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "secret findings: $n"

      - name: Strip residual secret material before persisting
        if: always()
        run: |
          # Defence in depth behind --redact. The artifact is downloadable by anyone with repo
          # read access, so drop snippets and fingerprints; keep rule, file and line.
          [ -s gitleaks.sarif ] || exit 0
          python3 - <<'STRIP_PY'
          import json
          d = json.load(open("gitleaks.sarif", encoding="utf-8"))
          for run in d.get("runs", []):
              for res in run.get("results", []):
                  for loc in res.get("locations", []):
                      pl = loc.get("physicalLocation", {})
                      pl.get("region", {}).pop("snippet", None)
                      pl.get("contextRegion", {}).pop("snippet", None)
                  res.pop("partialFingerprints", None)
          json.dump(d, open("gitleaks.sarif", "w", encoding="utf-8"))
          print("snippets and fingerprints stripped from gitleaks.sarif")
          STRIP_PY

      - name: Enforce
        if: always()
        run: |
          # Detection and ENFORCEMENT complete here, BEFORE any publication is attempted.
          # Whether the Security tab accepts the report must never decide whether the scan
          # passed. Publication is a projection of the result, not the result.
          n='${{ steps.gitleaks.outputs.count }}'
          # COLLECTION_FAILED IS NOT ZERO FINDINGS -- AND THIS STEP RUNS ON always().
          #
          # The counting step above correctly refuses to turn a missing or malformed report
          # into n=0, and exits non-zero. But `if: always()` means THIS step still runs, reads
          # an output that was never written, and ${n:-0} quietly supplies the very zero the
          # step above refused to invent -- announcing GATE=PASS one line after the failure was
          # detected. Each side assumed the other had handled it. Check explicitly.
          collection='${{ steps.gitleaks.outputs.collection }}'
          if [ "$collection" = "COLLECTION_FAILED" ]; then
            echo "::error title=COLLECTION_FAILED::Evidence could not be collected."
            echo "Posture CANNOT be established from this run. This is not a clean result."
            exit 1
          fi
          if [ -z "${n:-}" ]; then
            echo "::error title=COLLECTION_FAILED::No count was produced by the scan step."
            echo "An ABSENT measurement is not a measurement of zero."
            exit 1
          fi
          if [ "${n:-0}" -gt 0 ] && [ "${{ inputs.advisory_mode }}" = "true" ]; then
            echo "::warning title=ADVISORY — ${n} secret finding(s) NOT blocking::Values are"
            echo "redacted by design; see the sarif-gitleaks artifact for rule, file and line."
            echo "ANALYSIS=COMPLETE  GATE=ADVISORY  ($n finding(s) reported, not enforced)"
            exit 0
          fi
          if [ "${n:-0}" -gt 0 ]; then
            echo "::error title=Secrets detected::${n} finding(s). Values redacted by design —"
            echo "see the sarif-gitleaks artifact for rule, file and line."
            exit 1
          fi
          echo "ANALYSIS=COMPLETE  GATE=PASS  (no secrets detected)"

      - name: gitleaks — is there anything to publish?
        if: always()
        id: sarif_gitleaks
        run: |
          if [ -s "gitleaks.sarif" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=gitleaks: nothing to publish::No SARIF produced. Not a failure."
          fi
      # BEGIN REDACT_SARIF — generated from scripts/redact_sarif.py. DO NOT EDIT HERE.
      - name: Redact credential material before upload
        if: always()
        shell: bash
        run: |
          cat > /tmp/redact_sarif.py <<'REDACT_SARIF_PY'
          #!/usr/bin/env python3
          """Strip credential material from a SARIF file IN PLACE, before it becomes an artifact.

          WHY THIS EXISTS
              The kit redacted exactly one scanner. gitleaks ran with --redact and had `snippet` and
              `partialFingerprints` stripped before upload. Thirteen other jobs uploaded raw SARIF, and
              several of those scanners embed matched source by design:

                  bandit    B105 hardcoded_password_string -- the snippet IS the password
                  semgrep   snippet carries the matched source line
                  trivy     secret mode reports the match
                  checkov   includes the offending code block
                  gosec     includes the offending line

              An artifact is downloadable by anyone with repository read access and is retained for
              weeks. Redacting the rendered summary while shipping the raw value in a downloadable file
              is theatre -- it moves the credential from a page someone reads to a file someone opens.

              The consolidated report job made it worse by copying every SARIF into one artifact.

          WHAT SURVIVES, WHICH IS EVERYTHING NEEDED TO FIX THE FINDING
              rule id, severity, FILE, LINE, message with credential-shaped substrings masked to a short
              prefix. What is removed: `snippet`, `contextRegion.snippet`, and `partialFingerprints`
              (which for a secret scanner can be a hash of the secret itself).

          IT IS NOT A SUBSTITUTE FOR --redact AT THE SCANNER
              Defence in depth. A scanner that can be told not to emit the value should be told. This
              catches the ones that cannot, and the ones a consumer adds later.

          USAGE
              python3 redact_sarif.py <file.sarif> [more.sarif ...]
              python3 redact_sarif.py --self-test

          EXIT
              0 rewritten (or nothing to do)      1 a file was unreadable      2 self-test failed
          """
          import io
          import json
          import os
          import re
          import sys

          # BEGIN SECRET_PATTERNS -- must stay identical to scripts/scan_report.py.
          # Two copies exist because each file is inlined into the workflow separately and neither can
          # import the other at consumer runtime. tests/check_redaction_parity.py fails the build if they
          # diverge, so the duplication is an enforced invariant rather than a hope -- the same treatment
          # the SARIF normalizer gets for the same reason.
          SECRET_PATTERNS = [
              (re.compile(r'-----BEGIN[A-Z ]*PRIVATE KEY-----'), 'private-key'),
              (re.compile(r'\bAKIA[0-9A-Z]{16}\b'), 'aws-access-key-id'),
              (re.compile(r'\bgh[pousr]_[A-Za-z0-9]{16,}'), 'github-token'),
              (re.compile(r'\bxox[baprs]-[A-Za-z0-9-]{10,}'), 'slack-token'),
              (re.compile(r'\beyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}'), 'jwt'),
              (re.compile(r'\b[A-Za-z0-9~._-]{3}8Q~[A-Za-z0-9~._-]{31,34}\b'), 'entra-client-secret'),
              (re.compile(r'(?i)\b(?:AccountKey|SharedAccessKey|password|pwd|secret|token|api[_-]?key)'
                          r'\s*[:=]\s*["\']?([^\s;,"\'&]{8,})'), 'keyed-value'),
              (re.compile(r'\b[A-Za-z0-9+/]{32,}={0,2}(?![A-Za-z0-9+/=])'), 'high-entropy'),
              (re.compile(r'\b[0-9a-fA-F]{32,}\b'), 'hex-or-digest'),
          ]


          def _mask(value, label):
              keep = value[:4]
              return '%s%s [redacted: %s, %d chars]' % (keep, '*' * min(len(value) - len(keep), 18),
                                                        label, len(value))


          REDACTED_MARK = '[redacted: '


          def redact(text):
              """Mask anything that looks like credential material. Returns the safe string.

              IDEMPOTENT, which is not free. Masking `password: AKIAIOSFODNN7EXAMPLE` produces
              `password: AKIA**************** [redacted: ...]`, and that output STILL matches the
              keyed-value pattern -- so a second pass masked the mask, and a third masked that. It
              matters because a SARIF can legitimately be redacted twice: once in the scanner job before
              upload, once in the consolidated report after download. Non-idempotent redaction would
              corrupt the text on the second pass and make the finding unreadable.
              """
              if not text:
                  return text
              out = text
              for pat, label in SECRET_PATTERNS:
                  def _sub(m, _l=label):
                      whole = m.group(0)
                      v = m.group(1) if m.groups() and m.group(1) else whole
                      if len(v) < 8 or REDACTED_MARK in whole or '****' in v:
                          return whole
                      return whole.replace(v, _mask(v, _l))
                  out = pat.sub(_sub, out)
              return out
          # END SECRET_PATTERNS


          def scrub(doc):
              """-> (snippets_removed, messages_masked). Mutates doc."""
              snips = masked = 0
              for run in (doc.get('runs') or []):
                  for res in (run.get('results') or []):
                      msg = ((res.get('message') or {}).get('text'))
                      if msg:
                          r = redact(msg)
                          if r != msg:
                              res['message']['text'] = r
                              masked += 1
                      for loc in (res.get('locations') or []) + (res.get('relatedLocations') or []):
                          pl = (loc.get('physicalLocation') or {})
                          for key in ('region', 'contextRegion'):
                              reg = pl.get(key) or {}
                              if 'snippet' in reg:
                                  reg.pop('snippet', None)
                                  snips += 1
                      # A partial fingerprint from a secret scanner can be a hash OF THE SECRET, which is
                      # an offline-guessable artifact for anything low-entropy. It buys correlation that
                      # this kit gets from file+rule instead.
                      if res.pop('partialFingerprints', None) is not None:
                          snips += 1
                      for cf in (res.get('codeFlows') or []):
                          for tf in (cf.get('threadFlows') or []):
                              for lo in (tf.get('locations') or []):
                                  pl = ((lo.get('location') or {}).get('physicalLocation') or {})
                                  for key in ('region', 'contextRegion'):
                                      reg = pl.get(key) or {}
                                      if 'snippet' in reg:
                                          reg.pop('snippet', None)
                                          snips += 1
              return (snips, masked)


          def self_test():
              fails = []
              doc = {'version': '2.1.0', 'runs': [{'tool': {'driver': {'name': 'bandit'}}, 'results': [
                  {'ruleId': 'B105', 'level': 'error',
                   'message': {'text': 'Possible hardcoded password: AKIAIOSFODNN7EXAMPLE'},
                   'partialFingerprints': {'x': 'deadbeef'},
                   'locations': [{'physicalLocation': {
                       'artifactLocation': {'uri': 'app/config.py'},
                       'region': {'startLine': 12,
                                  'snippet': {'text': 'PASSWORD = "AKIAIOSFODNN7EXAMPLE"'}},
                       'contextRegion': {'snippet': {'text': 'ctx AKIAIOSFODNN7EXAMPLE'}}}}]}]}]}
              snips, masked = scrub(doc)
              blob = json.dumps(doc)
              if 'AKIAIOSFODNN7EXAMPLE' in blob:
                  fails.append('a credential survived scrub()')
              if 'app/config.py' not in blob or '12' not in blob:
                  fails.append('scrub() destroyed the file/line needed to fix it')
              if 'AKIA' not in blob:
                  fails.append('scrub() removed the prefix identifying WHICH credential')
              if snips < 3:
                  fails.append('snippet/contextRegion/partialFingerprints not all removed (%d)' % snips)
              if masked != 1:
                  fails.append('message was not masked')
              # Idempotent: running twice must not double-mask or crash.
              s2, m2 = scrub(doc)
              if (s2, m2) != (0, 0):
                  fails.append('scrub() is not idempotent (%d,%d on second pass)' % (s2, m2))
              # A clean report must come through untouched.
              clean = {'runs': [{'results': [{'ruleId': 'X', 'message': {'text': 'unused import os'},
                                              'locations': [{'physicalLocation': {
                                                  'artifactLocation': {'uri': 'a.py'},
                                                  'region': {'startLine': 1}}}]}]}]}
              before = json.dumps(clean)
              scrub(clean)
              if json.dumps(clean) != before:
                  fails.append('a clean finding was altered')
              if fails:
                  print('SELF-TEST FAILED:')
                  for f in fails:
                      print('  - %s' % f)
                  return False
              print('self-test ok: credential masked, snippet/contextRegion/partialFingerprints removed, '
                    'file and line preserved, idempotent, clean findings untouched')
              return True


          def main():
              argv = [a for a in sys.argv[1:] if not a.startswith('-')]
              if '--self-test' in sys.argv:
                  return 0 if self_test() else 2
              if not self_test():
                  print('ABORTING -- a redactor that cannot prove it redacts is worse than none.')
                  return 2
              rc = 0
              for p in argv:
                  if not os.path.exists(p) or os.path.getsize(p) == 0:
                      print('  %s: absent or empty, nothing to redact' % p)
                      continue
                  try:
                      doc = json.load(io.open(p, encoding='utf-8', errors='replace'))
                  except (ValueError, IOError) as e:
                      # A SARIF that cannot be parsed cannot be redacted, and must NOT be uploaded on the
                      # assumption that it is probably fine. Emptying it loses nothing a reader could
                      # have used -- an unparseable report establishes nothing either way -- and it
                      # cannot leak what it was carrying.
                      print('::warning title=Unredactable SARIF::%s could not be parsed (%s); it is '
                            'replaced with an empty report rather than uploaded unexamined.'
                            % (p, type(e).__name__))
                      io.open(p, 'w', encoding='utf-8').write(
                          json.dumps({'version': '2.1.0', 'runs': [],
                                      '_redaction': 'ORIGINAL UNPARSEABLE - WITHHELD'}))
                      rc = 1
                      continue
                  snips, masked = scrub(doc)
                  json.dump(doc, io.open(p, 'w', encoding='utf-8'))
                  print('  %s: %d snippet/fingerprint field(s) removed, %d message(s) masked'
                        % (os.path.basename(p), snips, masked))
              return rc


          if __name__ == '__main__':
              sys.exit(main())

          REDACT_SARIF_PY
          shopt -s nullglob globstar
          files=( *.sarif **/*.sarif )
          if [ ${#files[@]} -eq 0 ]; then
            echo "no SARIF produced by this job -- nothing to redact"
          else
            python3 /tmp/redact_sarif.py "${files[@]}"
          fi
      # END REDACT_SARIF
      - name: gitleaks — keep SARIF as an artifact
        if: always() && steps.sarif_gitleaks.outputs.exists == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: sarif-gitleaks-${{ github.run_attempt }}
          path: gitleaks.sarif
          retention-days: 30
          if-no-files-found: warn
      - name: gitleaks — publish to the Security tab where available
        id: cs_gitleaks
        if: always() && steps.sarif_gitleaks.outputs.exists == 'true'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
      - name: gitleaks — state plainly if publication degraded
        if: always() && steps.sarif_gitleaks.outputs.exists == 'true' && steps.cs_gitleaks.outcome != 'success'
        run: |
          echo "::warning title=gitleaks: NOT published to the Security tab::Code scanning is"
          echo "unavailable for this repository. ANALYSIS=COMPLETE, enforcement already ran."
          echo "Retrieve redacted findings from the 'sarif-gitleaks' artifact."

      - name: detect-secrets (defense in depth)
        if: always()
        run: |
          python -m pip install --quiet detect-secrets
          # detect-secrets records hashes rather than values, so its report is safe to retain.
          detect-secrets scan "${{ inputs.paths }}" > .ds-scan.json
          if [ -f .secrets.baseline ]; then
            detect-secrets audit --report --baseline .secrets.baseline || true
          fi
          echo "detect-secrets scan written to .ds-scan.json"

  # ─── Code quality ───────────────────────────────────────────

      # BEGIN SCAN_STATUS — generated from scripts/scan_status.sh. DO NOT EDIT HERE.
      - name: Result summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          cat > /tmp/scan_status.sh <<'SCAN_STATUS_SH'
          #!/usr/bin/env bash
          # Short per-job result block. Runs at the end of every scanner job.
          #
          # WHY THIS EXISTS ALONGSIDE THE CONSOLIDATED REPORT
          #     The consolidated `report` job owns normalisation, cross-scanner dedupe, correlation,
          #     remediation detail and disposition, because those are only possible where every finding is
          #     visible at once. That is not a reason for a scanner job to stay silent.
          #
          #     Someone debugging Semgrep is IN the Semgrep job. Making them leave it to discover whether it
          #     found anything is how "the pipeline is noise" becomes true. So the scanner prints what it
          #     alone knows -- did it run, how many findings, was SARIF produced -- and points at the
          #     consolidated job for what it cannot know.
          #
          # DELIBERATELY NOT A SECOND COPY OF THE CONTRACT
          #     No severity interpretation, no remediation, no gate verdict, no disposition. Those live in
          #     exactly one place. A contract implemented twice drifts twice, and this kit has the scars:
          #     fourteen Azure gitleaks rules and a flawfinder fix both lost to a second copy.
          #
          # THE ZERO RULE APPLIES HERE TOO
          #     A job that did not run, or produced no parseable SARIF, prints NOT ESTABLISHED. It never
          #     prints 0. Zero says someone looked.
          #
          # USAGE   scan_status <name> <execution> <sarif-or-empty> [scope]
          scan_status() {
            _name="$1"; _exec="$2"; _sarif="${3:-}"; _scope="${4:-}"
            _out="${GITHUB_STEP_SUMMARY:-/dev/stdout}"

            _n="NOT ESTABLISHED"; _sar="NOT GENERATED"
            if [ -n "$_sarif" ] && [ -s "$_sarif" ]; then
              # suppression: FAILURE_ISOLATION_WITH_STATE_CAPTURE -- jq's failure IS the signal here, and
              # it is captured rather than swallowed: a non-zero exit takes the else branch and reports
              # INVALID plus "count unavailable from current parser". stderr is silenced because the parse
              # error text is not useful in a summary block; the STATE survives and is published. If this
              # fails in a way other than "not valid SARIF" -- jq missing, file unreadable -- the result is
              # the same and is still not a clean zero, which is the outcome that matters.
              if _c=$(jq '[.runs[].results[]] | length' "$_sarif" 2>/dev/null); then
                _sar="GENERATED"
                # Only a scanner that actually completed may report a count. A crashed run that happens to
                # have left a partial report behind must not publish a number from it.
                case "$_exec" in
                  COMPLETE) _n="$_c" ;;
                  *)        _n="NOT ESTABLISHED" ;;
                esac
              else
                # A file that is not valid SARIF is a collection failure wearing a report's clothes.
                _sar="INVALID"
                _n="PRESENT -- count unavailable from current parser"
              fi
            fi

            {
              printf '### %s\n\n' "$_name"
              printf '| | |\n|---|---|\n'
              printf '| Execution | %s |\n' "$_exec"
              [ -n "$_scope" ] && printf '| Scope | %s |\n' "$_scope"
              printf '| Findings | %s |\n' "$_n"
              printf '| SARIF | %s |\n' "$_sar"
              printf '\n'
              if [ "$_n" = "NOT ESTABLISHED" ]; then
                printf 'This is not zero. Nothing usable was collected for this scope in this run.\n\n'
              fi
              printf 'Severity breakdown, remediation, gate impact and disposition are in the\n'
              printf '**Security scan report** job, which sees every scanner at once and can tell\n'
              printf 'when two tools are describing the same condition.\n\n'
            } >> "$_out"

            printf '%s: execution=%s findings=%s sarif=%s\n' "$_name" "$_exec" "$_n" "$_sar"
          }

          SCAN_STATUS_SH
          . /tmp/scan_status.sh
          if [ "$JOB_STATUS" = "success" ]; then _e=COMPLETE; else _e=FAILED; fi
          scan_status "Secret scan" "$_e" "gitleaks.sarif" "whole repository"
      # END SCAN_STATUS

  code-quality:
    needs: [discover]
    # DISCOVERED, NOT DECLARED. Runs because roots for this ecosystem were actually
    # found in the caller's scope -- not because a selector named it. On failure
    # discovery turns everything on rather than producing a tidy row of NOT_APPLICABLE.
    if: needs.discover.outputs.python == 'true'
    name: Code quality
    runs-on: ubuntu-latest
    # Bounded so a stalled dependency cannot bill six hours (LM-001: unbounded execution
    # converts a dependency failure into uncontrolled cost).
    # NOT YET: a timeout still surfaces as a plain job failure. It SHOULD classify as
    # UNAVAILABLE / EXECUTION_TIMEOUT — cost is bounded here, semantics are not. See
    # docs/roadmap/FUTURE_WORK.md. Do not let this comment imply the mapping exists.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # NEVER ASSUME MANIFESTS LIVE AT THE REPOSITORY ROOT.
      # setup-node with `cache: npm` previously failed the whole job with "Dependencies lock
      # file is not found in /home/runner/work/<repo>/<repo>" — it looked only at the root and
      # ignored `paths` entirely. Any consumer whose package.json sits in a subdirectory (which
      # is most monorepos, and both of the real repos this was tested against) could not use
      # this workflow at all. Discover, then report what was actually scanned.
      - name: Locate the Node project
        id: node
        if: inputs.language == 'node' || inputs.language == 'multi'
        run: |
          set -uo pipefail
          scope="${{ inputs.paths }}"
          [ -d "$scope" ] || scope="."
          # A MONOREPO HAS MORE THAN ONE PROJECT ROOT. Taking the first match meant that a
          # consumer with services/a and services/b got service `a` linted, service `b` never
          # looked at, and a green job either way — coverage that silently stops at the first
          # directory it happens to sort to.
          find "$scope" -maxdepth 6 -name package.json -not -path '*/node_modules/*' \
            | sort > .node-roots.txt
          n=$(wc -l < .node-roots.txt)
          if [ "$n" -eq 0 ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=No Node project::No package.json under '$scope'."
            echo "COVERAGE=NOT_APPLICABLE — absence of a language is reported, never inferred."
            exit 0
          fi

          echo "### Node project roots discovered ($n)" >> "$GITHUB_STEP_SUMMARY"
          nolock=0; first=""; firstlock=""
          while read -r pkg; do
            dir=$(dirname "$pkg"); lock=""
            for c in package-lock.json npm-shrinkwrap.json yarn.lock; do
              [ -f "$dir/$c" ] && { lock="$dir/$c"; break; }
            done
            [ -z "$first" ] && { first="$dir"; firstlock="$lock"; }
            if [ -n "$lock" ]; then
              echo "- \`$dir\` — lockfile \`$(basename "$lock")\` — SCA covered" >> "$GITHUB_STEP_SUMMARY"
              echo "  root: $dir  lockfile: $(basename "$lock")"
            else
              nolock=$((nolock+1))
              # Explicit partial state. "Node job green" is not an acceptable summary when
              # dependency analysis could not run for a root.
              echo "- \`$dir\` — **NO LOCKFILE — NODE_SCA_PARTIAL**: source SAST runs, dependency" \
                   "vulnerability analysis NOT established for this root" >> "$GITHUB_STEP_SUMMARY"
              echo "::warning title=NODE_SCA_PARTIAL at $dir::package.json found, no supported"
              echo "lockfile (package-lock.json / npm-shrinkwrap.json / yarn.lock). Source SAST"
              echo "executed; dependency vulnerability analysis NOT established for this root."
              echo "Trivy cannot resolve npm dependencies without one — this is where the current"
              echo "wave of compromised-package attacks lands. Commit a lockfile."
            fi
          done < .node-roots.txt

          {
            echo "found=true"
            echo "roots=$n"
            echo "nolock=$nolock"
            echo "dir=$first"
            echo "lock=$firstlock"
            echo "cache=$([ -n "$firstlock" ] && echo npm || echo '')"
          } >> "$GITHUB_OUTPUT"
          echo "COVERAGE=$([ "$nolock" -eq 0 ] && echo FULL || echo NODE_SCA_PARTIAL) ($n root(s), $nolock without lockfile)"

      - name: Setup Node
        if: (inputs.language == 'node' || inputs.language == 'multi') && steps.node.outputs.found == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          # Empty disables caching. A missing lockfile must degrade to "no cache", never to a
          # hard failure — caching is an optimisation, not a security control.
          cache: ${{ steps.node.outputs.cache }}
          cache-dependency-path: ${{ steps.node.outputs.lock }}

      - name: ESLint
        if: (inputs.language == 'node' || inputs.language == 'multi') && steps.node.outputs.found == 'true'
        run: |
          set -uo pipefail
          # Every discovered root, not just the first.
          while read -r pkg; do
          dir=$(dirname "$pkg")
          echo "::group::ESLint $dir"
          cd "$GITHUB_WORKSPACE/$dir" || continue
          lock=""
          for c in package-lock.json npm-shrinkwrap.json yarn.lock; do
            [ -f "$c" ] && { lock="$c"; break; }
          done
          # npm ci REQUIRES a lockfile and fails without one; fall back deliberately.
          if [ -n "$lock" ]; then
            npm ci --no-audit --no-fund
          else
            echo "::warning title=No npm lockfile — DEPENDENCY SCANNING IS DEGRADED::Trivy cannot"
            echo "scan npm dependencies from package.json alone; it requires package-lock.json,"
            echo "npm-shrinkwrap.json or yarn.lock. Without one your Node dependencies are NOT being"
            echo "checked for known vulnerabilities or compromised packages — which is where the"
            echo "current wave of supply-chain attacks lands. Commit a lockfile."
            echo "Falling back to 'npm install'; builds are also not reproducible without one."
            npm install --no-audit --no-fund
          fi
          npx --no-install eslint . || npx eslint . || {
            echo "::notice title=ESLint not configured::No usable ESLint config in $dir."
            echo "Reported rather than failed — a missing linter config is a consumer choice."; }
          echo "::endgroup::"
          done < "$GITHUB_WORKSPACE/.node-roots.txt"

      - name: Setup Python
        if: inputs.language == 'python' || inputs.language == 'multi'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python_version }}

      - name: Ruff + mypy
        if: inputs.language == 'python' || inputs.language == 'multi'
        run: |
          set -uo pipefail
          scope="${{ inputs.paths }}"
          # "NONE FOUND" AND "COULD NOT LOOK" ARE DIFFERENT ANSWERS. A find that ERRORS produces
          # empty output, which read as "this language is not here", which skipped the job, which
          # reported green over code nobody scanned. Same defect discovery had; same fix.
          # suppression: PRESENTATION_ONLY -- find's stderr is noise on unreadable subtrees; the EXIT
          # STATUS is checked on the next line and a failure raises COLLECTION_FAILED rather than reading
          # as 'nothing found'.
          # discards: find's stderr, which is noise on unreadable or permission-denied subtrees
          # preserved_by: the EXIT STATUS is captured on the next line and a non-zero rc raises
          # preserved_by: COLLECTION_FAILED, so 'could not look' never reads as 'found nothing'
          if ! _hits=$(find "$scope" -name '*.py' -not -path '*/node_modules/*' 2>/dev/null); then
            echo "::error title=COLLECTION_FAILED::Applicability survey failed; cannot establish scope."
            echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ -z "$_hits" ]; then
            echo "::notice title=No Python sources::None found under '$scope'. Skipping."
            exit 0
          fi
          python -m pip install --quiet ruff mypy
          # Lint STYLE is not a security control. Hard-failing on it blocked adoption of a
          # security workflow on day one, which is how controls get bypassed wholesale.
          if [ "${{ inputs.enforce_lint }}" = "true" ] && [ "${{ inputs.advisory_mode }}" != "true" ]; then
            ruff check "$scope"
          else
            ruff check "$scope" || echo "::warning title=Lint findings (advisory)::ruff reported"\
              " findings. Not blocking — set enforce_lint: true to gate on them."
          fi
          mypy "$scope" --ignore-missing-imports || true   # types advisory by default

  # ─── SAST ───────────────────────────────────────────────────

      # BEGIN SCAN_STATUS — generated from scripts/scan_status.sh. DO NOT EDIT HERE.
      - name: Result summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          cat > /tmp/scan_status.sh <<'SCAN_STATUS_SH'
          #!/usr/bin/env bash
          # Short per-job result block. Runs at the end of every scanner job.
          #
          # WHY THIS EXISTS ALONGSIDE THE CONSOLIDATED REPORT
          #     The consolidated `report` job owns normalisation, cross-scanner dedupe, correlation,
          #     remediation detail and disposition, because those are only possible where every finding is
          #     visible at once. That is not a reason for a scanner job to stay silent.
          #
          #     Someone debugging Semgrep is IN the Semgrep job. Making them leave it to discover whether it
          #     found anything is how "the pipeline is noise" becomes true. So the scanner prints what it
          #     alone knows -- did it run, how many findings, was SARIF produced -- and points at the
          #     consolidated job for what it cannot know.
          #
          # DELIBERATELY NOT A SECOND COPY OF THE CONTRACT
          #     No severity interpretation, no remediation, no gate verdict, no disposition. Those live in
          #     exactly one place. A contract implemented twice drifts twice, and this kit has the scars:
          #     fourteen Azure gitleaks rules and a flawfinder fix both lost to a second copy.
          #
          # THE ZERO RULE APPLIES HERE TOO
          #     A job that did not run, or produced no parseable SARIF, prints NOT ESTABLISHED. It never
          #     prints 0. Zero says someone looked.
          #
          # USAGE   scan_status <name> <execution> <sarif-or-empty> [scope]
          scan_status() {
            _name="$1"; _exec="$2"; _sarif="${3:-}"; _scope="${4:-}"
            _out="${GITHUB_STEP_SUMMARY:-/dev/stdout}"

            _n="NOT ESTABLISHED"; _sar="NOT GENERATED"
            if [ -n "$_sarif" ] && [ -s "$_sarif" ]; then
              # suppression: FAILURE_ISOLATION_WITH_STATE_CAPTURE -- jq's failure IS the signal here, and
              # it is captured rather than swallowed: a non-zero exit takes the else branch and reports
              # INVALID plus "count unavailable from current parser". stderr is silenced because the parse
              # error text is not useful in a summary block; the STATE survives and is published. If this
              # fails in a way other than "not valid SARIF" -- jq missing, file unreadable -- the result is
              # the same and is still not a clean zero, which is the outcome that matters.
              if _c=$(jq '[.runs[].results[]] | length' "$_sarif" 2>/dev/null); then
                _sar="GENERATED"
                # Only a scanner that actually completed may report a count. A crashed run that happens to
                # have left a partial report behind must not publish a number from it.
                case "$_exec" in
                  COMPLETE) _n="$_c" ;;
                  *)        _n="NOT ESTABLISHED" ;;
                esac
              else
                # A file that is not valid SARIF is a collection failure wearing a report's clothes.
                _sar="INVALID"
                _n="PRESENT -- count unavailable from current parser"
              fi
            fi

            {
              printf '### %s\n\n' "$_name"
              printf '| | |\n|---|---|\n'
              printf '| Execution | %s |\n' "$_exec"
              [ -n "$_scope" ] && printf '| Scope | %s |\n' "$_scope"
              printf '| Findings | %s |\n' "$_n"
              printf '| SARIF | %s |\n' "$_sar"
              printf '\n'
              if [ "$_n" = "NOT ESTABLISHED" ]; then
                printf 'This is not zero. Nothing usable was collected for this scope in this run.\n\n'
              fi
              printf 'Severity breakdown, remediation, gate impact and disposition are in the\n'
              printf '**Security scan report** job, which sees every scanner at once and can tell\n'
              printf 'when two tools are describing the same condition.\n\n'
            } >> "$_out"

            printf '%s: execution=%s findings=%s sarif=%s\n' "$_name" "$_exec" "$_n" "$_sar"
          }

          SCAN_STATUS_SH
          . /tmp/scan_status.sh
          if [ "$JOB_STATUS" = "success" ]; then _e=COMPLETE; else _e=FAILED; fi
          scan_status "Code quality" "$_e" "" "linters"
      # END SCAN_STATUS

  sast-semgrep:
    needs: [discover]
    # Ecosystem-agnostic: every repository can leak a secret and resolve a dependency.
    # Gated only by discovery being able to run at all.
    if: always()
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    # Bounded so a stalled dependency cannot bill six hours (LM-001: unbounded execution
    # converts a dependency failure into uncontrolled cost).
    # NOT YET: a timeout still surfaces as a plain job failure. It SHOULD classify as
    # UNAVAILABLE / EXECUTION_TIMEOUT — cost is bounded here, semantics are not. See
    # docs/roadmap/FUTURE_WORK.md. Do not let this comment imply the mapping exists.
    timeout-minutes: 20
    container:
      image: semgrep/semgrep:1.90.0
    steps:
      - uses: actions/checkout@v7
      - name: Semgrep scan
        id: semgrep
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          set -uo pipefail
          # TWO bugs lived here.
          #
          # 1. `paths` was never passed, so semgrep scanned the whole repository. On a "clean"
          #    control that meant scanning the seeded fixture and failing — the clean baseline
          #    was never clean, which would have invalidated every conclusion drawn from it.
          # 2. --config was not repeated. semgrep takes targets POSITIONALLY, so
          #    `--config p/default p/owasp-top-ten` loaded ONE ruleset and treated the other as
          #    a path to scan. Half the intended rules never ran, silently.
          # SEMGREP SKIPS test/ and fixture/ DIRECTORIES BY DEFAULT.
          # That default is why every semgrep job reported success with zero findings while
          # bandit — which has no such default — found the seeded flaw in the same tree. Any
          # consumer whose code sits under a path matching semgrep's built-in ignore list gets
          # a silent, confident, empty result. Writing our own .semgrepignore replaces the
          # default entirely; the caller's scope decides what is scanned, not semgrep's guess.
          printf 'node_modules/\n.git/\n' > .semgrepignore
          cfg=""
          for c in ${{ inputs.semgrep_config }}; do cfg="$cfg --config $c"; done
          echo "rulesets:$cfg    target: ${{ inputs.paths }}"

          # Detection first. Enforcement is a SEPARATE decision below, so that a scanner's exit
          # code never doubles as the gate.
          semgrep scan $cfg --sarif --output semgrep.sarif --metrics=off \
            "${{ inputs.paths }}" || true

          # A PARSE FAILURE IS NOT ZERO FINDINGS. Semgrep is the highest-yield scanner in the
          # suite, so `|| echo 0` here meant a truncated report presented as a clean codebase by
          # the detector most likely to have found something.
          if [ ! -s semgrep.sarif ]; then
            echo "::error title=COLLECTION_FAILED::semgrep.sarif was not produced."
            echo "An ABSENT report is not zero findings."
            echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if ! n=$(jq '[.runs[].results[] | select((.level // "warning") == "error")] | length' semgrep.sarif 2>&1); then
            echo "::error title=COLLECTION_FAILED::semgrep.sarif is not valid SARIF."
            echo "jq said: $n"
            echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "semgrep ERROR-level findings: $n"

      - name: Semgrep — enforce
        if: always()
        run: |
          n='${{ steps.semgrep.outputs.count }}'
          # COLLECTION_FAILED IS NOT ZERO FINDINGS -- AND THIS STEP RUNS ON always().
          #
          # The counting step above correctly refuses to turn a missing or malformed report
          # into n=0, and exits non-zero. But `if: always()` means THIS step still runs, reads
          # an output that was never written, and ${n:-0} quietly supplies the very zero the
          # step above refused to invent -- announcing GATE=PASS one line after the failure was
          # detected. Each side assumed the other had handled it. Check explicitly.
          collection='${{ steps.semgrep.outputs.collection }}'
          if [ "$collection" = "COLLECTION_FAILED" ]; then
            echo "::error title=COLLECTION_FAILED::Evidence could not be collected."
            echo "Posture CANNOT be established from this run. This is not a clean result."
            exit 1
          fi
          if [ -z "${n:-}" ]; then
            echo "::error title=COLLECTION_FAILED::No count was produced by the scan step."
            echo "An ABSENT measurement is not a measurement of zero."
            exit 1
          fi
          if [ "${n:-0}" -gt 0 ] && [ "${{ inputs.soft_fail_sast }}" != "true" ] && [ "${{ inputs.advisory_mode }}" != "true" ]; then
            echo "::error title=Semgrep::${n} ERROR-level finding(s). ANALYSIS=COMPLETE GATE=FAIL"
            exit 1
          fi
          echo "ANALYSIS=COMPLETE GATE=PASS (${n:-0} error-level finding(s), soft_fail=${{ inputs.soft_fail_sast }})"
      # Findings must survive whether or not this repo has code scanning. Uploading to the
      # Security tab is a PUBLICATION channel, not the finding itself — free on public repos,
      # otherwise Advanced Security. Treating it as mandatory turned successful scans into
      # failed jobs on every private repo without GHAS.
      - name: Semgrep — is there anything to publish?
        if: always()
        id: sarif_semgrep
        run: |
          # No SARIF usually means no applicable source (gosec on a repo with no Go). That is
          # a legitimate outcome, not a failure, and previously crashed the upload step.
          if [ -s "semgrep.sarif" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Semgrep: nothing to publish::No SARIF at 'semgrep.sarif' — no applicable source files. Not a failure."
          fi
      # BEGIN REDACT_SARIF — generated from scripts/redact_sarif.py. DO NOT EDIT HERE.
      - name: Redact credential material before upload
        if: always()
        shell: bash
        run: |
          cat > /tmp/redact_sarif.py <<'REDACT_SARIF_PY'
          #!/usr/bin/env python3
          """Strip credential material from a SARIF file IN PLACE, before it becomes an artifact.

          WHY THIS EXISTS
              The kit redacted exactly one scanner. gitleaks ran with --redact and had `snippet` and
              `partialFingerprints` stripped before upload. Thirteen other jobs uploaded raw SARIF, and
              several of those scanners embed matched source by design:

                  bandit    B105 hardcoded_password_string -- the snippet IS the password
                  semgrep   snippet carries the matched source line
                  trivy     secret mode reports the match
                  checkov   includes the offending code block
                  gosec     includes the offending line

              An artifact is downloadable by anyone with repository read access and is retained for
              weeks. Redacting the rendered summary while shipping the raw value in a downloadable file
              is theatre -- it moves the credential from a page someone reads to a file someone opens.

              The consolidated report job made it worse by copying every SARIF into one artifact.

          WHAT SURVIVES, WHICH IS EVERYTHING NEEDED TO FIX THE FINDING
              rule id, severity, FILE, LINE, message with credential-shaped substrings masked to a short
              prefix. What is removed: `snippet`, `contextRegion.snippet`, and `partialFingerprints`
              (which for a secret scanner can be a hash of the secret itself).

          IT IS NOT A SUBSTITUTE FOR --redact AT THE SCANNER
              Defence in depth. A scanner that can be told not to emit the value should be told. This
              catches the ones that cannot, and the ones a consumer adds later.

          USAGE
              python3 redact_sarif.py <file.sarif> [more.sarif ...]
              python3 redact_sarif.py --self-test

          EXIT
              0 rewritten (or nothing to do)      1 a file was unreadable      2 self-test failed
          """
          import io
          import json
          import os
          import re
          import sys

          # BEGIN SECRET_PATTERNS -- must stay identical to scripts/scan_report.py.
          # Two copies exist because each file is inlined into the workflow separately and neither can
          # import the other at consumer runtime. tests/check_redaction_parity.py fails the build if they
          # diverge, so the duplication is an enforced invariant rather than a hope -- the same treatment
          # the SARIF normalizer gets for the same reason.
          SECRET_PATTERNS = [
              (re.compile(r'-----BEGIN[A-Z ]*PRIVATE KEY-----'), 'private-key'),
              (re.compile(r'\bAKIA[0-9A-Z]{16}\b'), 'aws-access-key-id'),
              (re.compile(r'\bgh[pousr]_[A-Za-z0-9]{16,}'), 'github-token'),
              (re.compile(r'\bxox[baprs]-[A-Za-z0-9-]{10,}'), 'slack-token'),
              (re.compile(r'\beyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}'), 'jwt'),
              (re.compile(r'\b[A-Za-z0-9~._-]{3}8Q~[A-Za-z0-9~._-]{31,34}\b'), 'entra-client-secret'),
              (re.compile(r'(?i)\b(?:AccountKey|SharedAccessKey|password|pwd|secret|token|api[_-]?key)'
                          r'\s*[:=]\s*["\']?([^\s;,"\'&]{8,})'), 'keyed-value'),
              (re.compile(r'\b[A-Za-z0-9+/]{32,}={0,2}(?![A-Za-z0-9+/=])'), 'high-entropy'),
              (re.compile(r'\b[0-9a-fA-F]{32,}\b'), 'hex-or-digest'),
          ]


          def _mask(value, label):
              keep = value[:4]
              return '%s%s [redacted: %s, %d chars]' % (keep, '*' * min(len(value) - len(keep), 18),
                                                        label, len(value))


          REDACTED_MARK = '[redacted: '


          def redact(text):
              """Mask anything that looks like credential material. Returns the safe string.

              IDEMPOTENT, which is not free. Masking `password: AKIAIOSFODNN7EXAMPLE` produces
              `password: AKIA**************** [redacted: ...]`, and that output STILL matches the
              keyed-value pattern -- so a second pass masked the mask, and a third masked that. It
              matters because a SARIF can legitimately be redacted twice: once in the scanner job before
              upload, once in the consolidated report after download. Non-idempotent redaction would
              corrupt the text on the second pass and make the finding unreadable.
              """
              if not text:
                  return text
              out = text
              for pat, label in SECRET_PATTERNS:
                  def _sub(m, _l=label):
                      whole = m.group(0)
                      v = m.group(1) if m.groups() and m.group(1) else whole
                      if len(v) < 8 or REDACTED_MARK in whole or '****' in v:
                          return whole
                      return whole.replace(v, _mask(v, _l))
                  out = pat.sub(_sub, out)
              return out
          # END SECRET_PATTERNS


          def scrub(doc):
              """-> (snippets_removed, messages_masked). Mutates doc."""
              snips = masked = 0
              for run in (doc.get('runs') or []):
                  for res in (run.get('results') or []):
                      msg = ((res.get('message') or {}).get('text'))
                      if msg:
                          r = redact(msg)
                          if r != msg:
                              res['message']['text'] = r
                              masked += 1
                      for loc in (res.get('locations') or []) + (res.get('relatedLocations') or []):
                          pl = (loc.get('physicalLocation') or {})
                          for key in ('region', 'contextRegion'):
                              reg = pl.get(key) or {}
                              if 'snippet' in reg:
                                  reg.pop('snippet', None)
                                  snips += 1
                      # A partial fingerprint from a secret scanner can be a hash OF THE SECRET, which is
                      # an offline-guessable artifact for anything low-entropy. It buys correlation that
                      # this kit gets from file+rule instead.
                      if res.pop('partialFingerprints', None) is not None:
                          snips += 1
                      for cf in (res.get('codeFlows') or []):
                          for tf in (cf.get('threadFlows') or []):
                              for lo in (tf.get('locations') or []):
                                  pl = ((lo.get('location') or {}).get('physicalLocation') or {})
                                  for key in ('region', 'contextRegion'):
                                      reg = pl.get(key) or {}
                                      if 'snippet' in reg:
                                          reg.pop('snippet', None)
                                          snips += 1
              return (snips, masked)


          def self_test():
              fails = []
              doc = {'version': '2.1.0', 'runs': [{'tool': {'driver': {'name': 'bandit'}}, 'results': [
                  {'ruleId': 'B105', 'level': 'error',
                   'message': {'text': 'Possible hardcoded password: AKIAIOSFODNN7EXAMPLE'},
                   'partialFingerprints': {'x': 'deadbeef'},
                   'locations': [{'physicalLocation': {
                       'artifactLocation': {'uri': 'app/config.py'},
                       'region': {'startLine': 12,
                                  'snippet': {'text': 'PASSWORD = "AKIAIOSFODNN7EXAMPLE"'}},
                       'contextRegion': {'snippet': {'text': 'ctx AKIAIOSFODNN7EXAMPLE'}}}}]}]}]}
              snips, masked = scrub(doc)
              blob = json.dumps(doc)
              if 'AKIAIOSFODNN7EXAMPLE' in blob:
                  fails.append('a credential survived scrub()')
              if 'app/config.py' not in blob or '12' not in blob:
                  fails.append('scrub() destroyed the file/line needed to fix it')
              if 'AKIA' not in blob:
                  fails.append('scrub() removed the prefix identifying WHICH credential')
              if snips < 3:
                  fails.append('snippet/contextRegion/partialFingerprints not all removed (%d)' % snips)
              if masked != 1:
                  fails.append('message was not masked')
              # Idempotent: running twice must not double-mask or crash.
              s2, m2 = scrub(doc)
              if (s2, m2) != (0, 0):
                  fails.append('scrub() is not idempotent (%d,%d on second pass)' % (s2, m2))
              # A clean report must come through untouched.
              clean = {'runs': [{'results': [{'ruleId': 'X', 'message': {'text': 'unused import os'},
                                              'locations': [{'physicalLocation': {
                                                  'artifactLocation': {'uri': 'a.py'},
                                                  'region': {'startLine': 1}}}]}]}]}
              before = json.dumps(clean)
              scrub(clean)
              if json.dumps(clean) != before:
                  fails.append('a clean finding was altered')
              if fails:
                  print('SELF-TEST FAILED:')
                  for f in fails:
                      print('  - %s' % f)
                  return False
              print('self-test ok: credential masked, snippet/contextRegion/partialFingerprints removed, '
                    'file and line preserved, idempotent, clean findings untouched')
              return True


          def main():
              argv = [a for a in sys.argv[1:] if not a.startswith('-')]
              if '--self-test' in sys.argv:
                  return 0 if self_test() else 2
              if not self_test():
                  print('ABORTING -- a redactor that cannot prove it redacts is worse than none.')
                  return 2
              rc = 0
              for p in argv:
                  if not os.path.exists(p) or os.path.getsize(p) == 0:
                      print('  %s: absent or empty, nothing to redact' % p)
                      continue
                  try:
                      doc = json.load(io.open(p, encoding='utf-8', errors='replace'))
                  except (ValueError, IOError) as e:
                      # A SARIF that cannot be parsed cannot be redacted, and must NOT be uploaded on the
                      # assumption that it is probably fine. Emptying it loses nothing a reader could
                      # have used -- an unparseable report establishes nothing either way -- and it
                      # cannot leak what it was carrying.
                      print('::warning title=Unredactable SARIF::%s could not be parsed (%s); it is '
                            'replaced with an empty report rather than uploaded unexamined.'
                            % (p, type(e).__name__))
                      io.open(p, 'w', encoding='utf-8').write(
                          json.dumps({'version': '2.1.0', 'runs': [],
                                      '_redaction': 'ORIGINAL UNPARSEABLE - WITHHELD'}))
                      rc = 1
                      continue
                  snips, masked = scrub(doc)
                  json.dump(doc, io.open(p, 'w', encoding='utf-8'))
                  print('  %s: %d snippet/fingerprint field(s) removed, %d message(s) masked'
                        % (os.path.basename(p), snips, masked))
              return rc


          if __name__ == '__main__':
              sys.exit(main())

          REDACT_SARIF_PY
          shopt -s nullglob globstar
          files=( *.sarif **/*.sarif )
          if [ ${#files[@]} -eq 0 ]; then
            echo "no SARIF produced by this job -- nothing to redact"
          else
            python3 /tmp/redact_sarif.py "${files[@]}"
          fi
      # END REDACT_SARIF
      - name: Semgrep — keep SARIF as an artifact
        if: always() && steps.sarif_semgrep.outputs.exists == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: sarif-semgrep-${{ github.run_attempt }}
          path: semgrep.sarif
          retention-days: 30
          if-no-files-found: warn
      - name: Semgrep — publish to the Security tab where available
        id: cs_semgrep
        if: always() && steps.sarif_semgrep.outputs.exists == 'true'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - name: Semgrep — state plainly if publication degraded
        if: always() && steps.sarif_semgrep.outputs.exists == 'true' && steps.cs_semgrep.outcome != 'success'
        run: |
          # Loud, never silent. An empty Security tab is indistinguishable from a clean
          # codebase, and that ambiguity is how a control becomes false assurance.
          echo "::warning title=Semgrep: NOT published to the Security tab::Code scanning is"
          echo "unavailable here (free on public repos, otherwise GitHub Advanced Security)."
          echo "The scan SUCCEEDED and the gate still enforces on these findings."
          echo "Retrieve them from the 'sarif-semgrep' artifact."

      # BEGIN SCAN_STATUS — generated from scripts/scan_status.sh. DO NOT EDIT HERE.
      - name: Result summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          cat > /tmp/scan_status.sh <<'SCAN_STATUS_SH'
          #!/usr/bin/env bash
          # Short per-job result block. Runs at the end of every scanner job.
          #
          # WHY THIS EXISTS ALONGSIDE THE CONSOLIDATED REPORT
          #     The consolidated `report` job owns normalisation, cross-scanner dedupe, correlation,
          #     remediation detail and disposition, because those are only possible where every finding is
          #     visible at once. That is not a reason for a scanner job to stay silent.
          #
          #     Someone debugging Semgrep is IN the Semgrep job. Making them leave it to discover whether it
          #     found anything is how "the pipeline is noise" becomes true. So the scanner prints what it
          #     alone knows -- did it run, how many findings, was SARIF produced -- and points at the
          #     consolidated job for what it cannot know.
          #
          # DELIBERATELY NOT A SECOND COPY OF THE CONTRACT
          #     No severity interpretation, no remediation, no gate verdict, no disposition. Those live in
          #     exactly one place. A contract implemented twice drifts twice, and this kit has the scars:
          #     fourteen Azure gitleaks rules and a flawfinder fix both lost to a second copy.
          #
          # THE ZERO RULE APPLIES HERE TOO
          #     A job that did not run, or produced no parseable SARIF, prints NOT ESTABLISHED. It never
          #     prints 0. Zero says someone looked.
          #
          # USAGE   scan_status <name> <execution> <sarif-or-empty> [scope]
          scan_status() {
            _name="$1"; _exec="$2"; _sarif="${3:-}"; _scope="${4:-}"
            _out="${GITHUB_STEP_SUMMARY:-/dev/stdout}"

            _n="NOT ESTABLISHED"; _sar="NOT GENERATED"
            if [ -n "$_sarif" ] && [ -s "$_sarif" ]; then
              # suppression: FAILURE_ISOLATION_WITH_STATE_CAPTURE -- jq's failure IS the signal here, and
              # it is captured rather than swallowed: a non-zero exit takes the else branch and reports
              # INVALID plus "count unavailable from current parser". stderr is silenced because the parse
              # error text is not useful in a summary block; the STATE survives and is published. If this
              # fails in a way other than "not valid SARIF" -- jq missing, file unreadable -- the result is
              # the same and is still not a clean zero, which is the outcome that matters.
              if _c=$(jq '[.runs[].results[]] | length' "$_sarif" 2>/dev/null); then
                _sar="GENERATED"
                # Only a scanner that actually completed may report a count. A crashed run that happens to
                # have left a partial report behind must not publish a number from it.
                case "$_exec" in
                  COMPLETE) _n="$_c" ;;
                  *)        _n="NOT ESTABLISHED" ;;
                esac
              else
                # A file that is not valid SARIF is a collection failure wearing a report's clothes.
                _sar="INVALID"
                _n="PRESENT -- count unavailable from current parser"
              fi
            fi

            {
              printf '### %s\n\n' "$_name"
              printf '| | |\n|---|---|\n'
              printf '| Execution | %s |\n' "$_exec"
              [ -n "$_scope" ] && printf '| Scope | %s |\n' "$_scope"
              printf '| Findings | %s |\n' "$_n"
              printf '| SARIF | %s |\n' "$_sar"
              printf '\n'
              if [ "$_n" = "NOT ESTABLISHED" ]; then
                printf 'This is not zero. Nothing usable was collected for this scope in this run.\n\n'
              fi
              printf 'Severity breakdown, remediation, gate impact and disposition are in the\n'
              printf '**Security scan report** job, which sees every scanner at once and can tell\n'
              printf 'when two tools are describing the same condition.\n\n'
            } >> "$_out"

            printf '%s: execution=%s findings=%s sarif=%s\n' "$_name" "$_exec" "$_n" "$_sar"
          }

          SCAN_STATUS_SH
          . /tmp/scan_status.sh
          if [ "$JOB_STATUS" = "success" ]; then _e=COMPLETE; else _e=FAILED; fi
          scan_status "SAST (Semgrep)" "$_e" "semgrep.sarif" "source"
      # END SCAN_STATUS

  sast-bandit:
    needs: [discover]
    # DISCOVERED, NOT DECLARED. Runs because roots for this ecosystem were actually
    # found in the caller's scope -- not because a selector named it. On failure
    # discovery turns everything on rather than producing a tidy row of NOT_APPLICABLE.
    if: needs.discover.outputs.python == 'true'
    name: SAST (Bandit, python)
    runs-on: ubuntu-latest
    # Bounded so a stalled dependency cannot bill six hours (LM-001: unbounded execution
    # converts a dependency failure into uncontrolled cost).
    # NOT YET: a timeout still surfaces as a plain job failure. It SHOULD classify as
    # UNAVAILABLE / EXECUTION_TIMEOUT — cost is bounded here, semantics are not. See
    # docs/roadmap/FUTURE_WORK.md. Do not let this comment imply the mapping exists.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python_version }}
      - name: Bandit → SARIF
        run: |
          python -m pip install --quiet "bandit[sarif]"
          # suppression: EXPECTED_NEGATIVE_RESULT -- this scanner exits nonzero when it FINDS something,
          # which is not an error. Detection is separated from enforcement here; the count step downstream
          # distinguishes 'found nothing' from 'produced no report' and emits COLLECTION_FAILED for the
          # latter.
