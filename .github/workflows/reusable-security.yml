          def main(argv):
              if '--self-test' in argv:
                  return 0 if self_test() else 2
              tool, files, i = '', [], 0
              while i < len(argv):
                  if argv[i] == '--tool' and i + 1 < len(argv):
                      tool, i = argv[i + 1], i + 2
                      continue
                  files.append(argv[i])
                  i += 1
              if not files:
                  print('usage: sarif_validity.py [--tool NAME] FILE...')
                  return 2
              if tool and tool not in PROFILES:
                  print('::warning title=No validity profile::%s has no declared profile; rows 1-6 apply, '
                        'nothing tool-specific is assumed.' % tool)
              worst = 0
              for f in files:
                  st, why, n = verdict(f)
                  if st == 'VALID':
                      print('VALID %s (%d result(s))' % (f, n))
                  else:
                      print('COLLECTION_FAILED %s' % why)
                      worst = 3
              return worst


          if __name__ == '__main__':
              sys.exit(main(sys.argv[1:]))

          SARIF_VALIDITY_PY
          # END SARIF_VALIDITY
          # ACQUISITION IS NOT ASSUMED. A script that was not written is a capability that does
          # not exist downstream, and the jobs needing it would each discover that separately.
          # Establish it once, here, where the cause is legible.
          for f in /tmp/normalize_sarif.py /tmp/scan_status.sh \
                   /tmp/redact_sarif.py /tmp/sbom_licenses.py /tmp/redact_all.sh \
                   /tmp/sarif_validity.py; do
            if [ ! -s "$f" ]; then
              echo "::error title=Kit script missing::$f was not written by this job."
              exit 1
            fi
            echo "  ok  $f  ($(wc -c < "$f") bytes)"
          done

      # BEGIN PIN_KIT_SCRIPTS — generated by scripts/inline_normalizer.py. DO NOT EDIT HERE.
      - name: Pin what was written, and assert it is what this file promises
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp
          sha256sum -t \
            normalize_sarif.py \
            scan_status.sh \
            redact_sarif.py \
            sbom_licenses.py \
            redact_all.sh \
            sarif_validity.py \
            > kit-scripts.sha256
          cat kit-scripts.sha256
          # THE ROUND TRIP, ASSERTED. The digest below is derived by
          # scripts/inline_normalizer.py from scripts/*, so a mismatch means the bytes
          # that reached this runner are not the bytes this repository holds. That is
          # not a warning: every downstream job is about to execute these files.
          if ! echo "77747346d57de23c8a301758499db36f89f41e3850a2495497d2983a6cb3916a  kit-scripts.sha256" | sha256sum -c -; then
            echo "::error title=Kit scripts do not match their pinned digest::What this"
            echo "job wrote to /tmp differs from what scripts/inline_normalizer.py"
            echo "derived from scripts/. Publishing it would hand every scanner a"
            echo "script this repository cannot vouch for. Re-run the generator."
            exit 1
          fi
      # END PIN_KIT_SCRIPTS
      # BEGIN REDACT_STEP — generated by scripts/inline_normalizer.py. DO NOT EDIT HERE.
      - name: Redact credential material before upload
        if: always()
        shell: bash
        run: |
          # ORDER IS THE WHOLE CONTROL: this runs immediately before an upload, and
          # again before every later upload that follows a step which may have written
          # output -- a redactor after the upload protects nothing while looking exactly
          # like protection (N24/WP19). The sweep itself is ONE canonical script --
          # scripts/redact_all.sh, written by the `kit-scripts` job and fetched into
          # /tmp by every other -- because fourteen copies of one wrapper are how this
          # file reached 608.8 KB and stopped starting.
          #
          # A MISSING TOOL IS NOT A CLEAN RESULT. If the bundle did not arrive,
          # publication must not proceed on the strength of a scrub that never ran.
          if [ ! -s /tmp/redact_all.sh ]; then
            echo "::error title=Redaction could not be guaranteed::/tmp/redact_all.sh is absent."
            echo "The kit-scripts artifact did not reach this job, so no SARIF was scrubbed"
            echo "and none may be published. A MISSING TOOL IS NOT A CLEAN RESULT."
            exit 1
          fi
          bash /tmp/redact_all.sh
      # END REDACT_STEP
      - name: Publish them for every other job in this run
        # THE MANIFEST TRAVELS WITH THE BUNDLE; THE DIGEST THAT VOUCHES FOR IT DOES NOT.
        # `kit-scripts.sha256` is listed below so every consumer can check the six scripts it
        # received. It is NOT the root of trust: each consumer re-derives the manifest's own
        # sha256 and compares it against a value pinned in THIS FILE, which GitHub resolved
        # from the ref before any job started. A manifest checked only against itself would
        # faithfully certify whatever arrived, which is an integrity check in name only.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kit-scripts-${{ github.run_attempt }}
          path: |
            /tmp/normalize_sarif.py
            /tmp/scan_status.sh
            /tmp/redact_sarif.py
            /tmp/sbom_licenses.py
            /tmp/redact_all.sh
            /tmp/sarif_validity.py
            /tmp/kit-scripts.sha256
          retention-days: 1
          # An ABSENT bundle is not an empty bundle. Without this, every consuming job would
          # fail separately on a missing file and the cause would be three logs away.
          if-no-files-found: error

  # ─── Secrets ────────────────────────────────────────────────
  # ─── DISCOVERY ────────────────────────────────────────────────────────────────
  # Establish what is ACTUALLY in the caller's scope before anything else starts.
  #
  # Previously every language job booted on a DECLARED selector: `language: multi` started six SAST
  # jobs whether or not that language existed, each paying checkout plus toolchain setup to discover
  # nothing and exit. That is a correctness defect and a cost defect wearing one hat.
  #
  # SELECTOR INTERSECT DISCOVERY, and disagreement is REPORTED, never silent:
  #   discovered + selected      -> RUN
  #   discovered + not selected  -> EXCLUDED_BY_SELECTOR, printed. Narrowing scope must never
  #                                 silently reduce VISIBILITY of what was not scanned.
  #   selected + not discovered  -> NOT_APPLICABLE, backed by a search that found nothing
  #
  # FAIL-SAFE. This job is now control-plane input for every scanner, which makes it the highest
  # leverage place in the kit for a lie. If discovery fails it must NEVER resolve to a tidy row of
  # NOT_APPLICABLE. It sets state=DISCOVERY_UNAVAILABLE and turns EVERYTHING ON: over-scanning is a
  # cost problem, under-scanning while reporting green is an assurance failure.
  discover:
    name: Discover what is actually here
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # LEAST PRIVILEGE, DECLARED RATHER THAN INHERITED.
    #
    # Without this block the job inherits the workflow-level `security-events: write`, which it
    # does not need: the platform probe only READS the code-scanning endpoint to establish
    # whether the capability is available. A discovery job holding a write token to the Security
    # tab is a larger blast radius than the job's purpose justifies, and nothing about inheriting
    # it is visible when reading this job.
    permissions:
      contents: read
      security-events: read
    outputs:
      python: ${{ steps.d.outputs.python }}
      node: ${{ steps.d.outputs.node }}
      go: ${{ steps.d.outputs.go }}
      dotnet: ${{ steps.d.outputs.dotnet }}
      java: ${{ steps.d.outputs.java }}
      cpp: ${{ steps.d.outputs.cpp }}
      php: ${{ steps.d.outputs.php }}
      # KDEC-026 (lane L-SCAN-B): Kotlin, Swift and the mobile platforms are classes, not gaps.
      kotlin: ${{ steps.d.outputs.kotlin }}
      swift: ${{ steps.d.outputs.swift }}
      mobile: ${{ steps.d.outputs.mobile }}
      iac: ${{ steps.d.outputs.iac }}
      # Artefact classes with a linter each, by presence (lane L-SCAN-A, KDEC-025): deps-scan runs
      # actionlint + zizmor, shellcheck and PSScriptAnalyzer, iac-scan runs hadolint, only on true.
      workflows: ${{ steps.d.outputs.workflows }}
      shell: ${{ steps.d.outputs.shell }}
      powershell: ${{ steps.d.outputs.powershell }}
      dockerfile: ${{ steps.d.outputs.dockerfile }}
      state: ${{ steps.d.outputs.state }}
      # Coverage, not applicability. Empty = nothing unsupported was seen. A comma list = code this
      # platform cannot scan is present. UNDETERMINED = the coverage probe itself could not run.
      unsupported: ${{ steps.d.outputs.unsupported }}
      # THE SAME FACT, NAMED RATHER THAN SPELLED IN FILE EXTENSIONS.
      #
      #   ARTIFACT_PRESENT + CAPABILITY_REQUIRED + SCANNER_UNAVAILABLE = COVERAGE_GAP
      #
      # A comma list of ARTIFACT CLASSES that are present in this repository and that no scanner
      # in this kit can look at. It is NOT_APPLICABLE's opposite: NOT_APPLICABLE says the artifact
      # is not here, CLEAN says a scanner ran and found nothing, COVERAGE_GAP says the artifact is
      # here and nothing looked. Absence of evidence, published as such.
      coverage_gaps: ${{ steps.d.outputs.coverage_gaps }}
      # How many classes. A consumer gating on "did this kit fully cover us" reads this, not a
      # string length. 0 means every discovered artifact class had a capable scanner.
      coverage_gap_count: ${{ steps.d.outputs.coverage_gap_count }}
      # Platform applicability. Established ONCE so sixteen jobs cannot hold sixteen beliefs
      # about the same organisation setting. UNKNOWN is a real value, never coerced to false.
      ghas_available: ${{ steps.platform.outputs.ghas_available }}
      code_scanning: ${{ steps.platform.outputs.code_scanning }}
      secret_scanning: ${{ steps.platform.outputs.secret_scanning }}
      push_protection: ${{ steps.platform.outputs.push_protection }}
      dependabot_alerts: ${{ steps.platform.outputs.dependabot_alerts }}
      dependabot_updates: ${{ steps.platform.outputs.dependabot_updates }}
      dependabot_config: ${{ steps.platform.outputs.dependabot_config }}
      visibility: ${{ steps.platform.outputs.visibility }}
      platform_source: ${{ steps.platform.outputs.platform_source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # THE STEP BODIES RUN FROM THE KIT, NOT FROM THIS FILE. Inline, the survey and the platform
      # probe were 37 KB and held the flagship over the 475 KB fail line (check_workflow_size.py).
      # `$/` delivers the whole kit at the caller's pinned commit; the composite is invoked once
      # per part, with the ids d and platform, so the outputs above read exactly what they read
      # inline. Caller input still crosses as DATA (with: -> env:), never as script text.
      # tests/test_discovery.py runs the survey from the composite, as shipped.
      - name: Survey what is in scope
        id: d
        uses: $/.github/actions/discover
        with:
          part: survey
          paths: ${{ inputs.paths }}
          language: ${{ inputs.language }}
          iac-mode: ${{ inputs.iac_mode }}
          enable-iac: ${{ inputs.enable_iac }}
      # Platform applicability: a different axis from language applicability. UNKNOWN is not
      # false -- the composite says why at length.
      - name: Establish platform capability
        id: platform
        uses: $/.github/actions/discover
        with:
          part: platform

  # ─────────────────────────────────────────────────────────────────────────────
  # RESOLVE — the position between discovery and the scanners
  # ─────────────────────────────────────────────────────────────────────────────
  #
  # PIPELINE_ORDERING_AND_SCAN_VALIDITY.md §1.6: "R2, R3 and R6 have nowhere to attach, because
  # there is no position between `discover` and the scanners and no position between the
  # scanners and the gate. The sequence has to exist before the checks can be put in it."
  # SINGLE_PIPELINE_TARGET.md §5.1 names this position `resolve` (stages 3-5: versions,
  # capability, plan). It is one job because it is metadata work -- reading manifests and a
  # table -- and splitting it would cost runner boots to save nothing.
  #
  # WHAT IT ESTABLISHES, AND IN WHAT ORDER
  #   R2  the version each discovered class is WRITTEN FOR, per root, with the strength of the
  #       evidence (a pin is a version; `>=3.9` is a floor, and a floor is not a target)
  #   R3  for each (class, root) and each scanner that claims the class, whether that scanner's
  #       DECLARED range covers the target: SCANNER_SUPPORTS, VERSION_UNSUPPORTED, or
  #       VERSION_SUPPORT_UNDETERMINED. The table is DATA (scanner-registry.yaml), per scanner,
  #       never kit-wide. A VERSION_UNSUPPORTED is a COVERAGE_GAP declared BEFORE the scan.
  #   R4  an advisory execution plan: which jobs this run would start and at what depth, as
  #       data a human can read before anything runs. Nothing enforces it yet.
  #
  # THE RULE THAT GOVERNS EVERY ANSWER HERE: there is no implicit default from unknown to known.
  # A version that cannot be read is VERSION_SUPPORT_UNDETERMINED, which is a gap. The scanner
  # STILL RUNS -- over-scanning is a cost problem, under-scanning reported green is not -- and
  # its silence is not allowed to mean coverage.
  #
  # WHAT CONSUMES THIS: the gate and the report (KDEC-010). The gate waits for this job, reads
  # `needs.resolve.result` as itself -- a failure or a skip is tooling, never NOT_APPLICABLE --
  # and honours the capability selection: a job pointed at a VERSION_GAP is PARTIAL, never
  # PASS; a default scanner substituted away is PARTIAL for that target while the selected one
  # carries the claim. The report renders the same per scanner row. The scanner jobs still
  # start on `needs.discover.outputs.*` alone: every scanner RUNS whatever the selection says
  # (findings are findings); what the selection decides is what each one's silence may mean.
  resolve:
    name: Resolve versions, capability and plan
    needs: [discover]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # LEAST PRIVILEGE, DECLARED. Reads manifests from the checkout and, for the Dependabot step,
    # the alerts endpoint. Writes nothing anywhere.
    permissions:
      contents: read
      security-events: read
    outputs:
      # COMPLETE / DISCOVERY_PARTIAL / DISCOVERY_UNAVAILABLE -- the same ladder discovery uses,
      # for the same reason: a manifest that could not be read is not a manifest that was absent.
      state: ${{ steps.resolve.outputs.state }}
      # R2. A JSON list, one record per (class, root, kind): the version the code is WRITTEN FOR
      # and the strength of the evidence -- exact | floor | constraint | moving | none |
      # unreadable. "A constraint is not a version": `>=3.9` is recorded as a floor with no
      # target, never rounded to 3.9. Multiple roots are multiple records, never an average.
      versions: ${{ steps.resolve.outputs.versions }}
      # R3. A JSON list, one row per (class, root, scanner job, tool): SCANNER_SUPPORTS,
      # VERSION_UNSUPPORTED or VERSION_SUPPORT_UNDETERMINED, with the declared range, the reason
      # and how the range was established. The scanner runs in every case.
      capability: ${{ steps.resolve.outputs.capability }}
      # The COVERAGE_GAPs this position declares BEFORE the scan: `class@root:job/tool` for every
      # VERSION_UNSUPPORTED answer, comma-separated, and their count. 0 is only ever printed when
      # every declared range covered its target.
      version_gaps: ${{ steps.resolve.outputs.version_gaps }}
      version_gap_count: ${{ steps.resolve.outputs.version_gap_count }}
      # Gaps of the other kind: could-not-establish. Each is a scanner whose result contributes
      # PARTIAL, never PASS. Counted separately because "unsupported" and "unknown" have
      # different owners and different remediations.
      version_undetermined_count: ${{ steps.resolve.outputs.version_undetermined_count }}
      # Class-and-count coverage (PO §5.3): per artefact class present in scope, files_in_scope,
      # enumeration (COMPLETE, or PARTIAL with the unreadable and unreached counts), covered_by
      # (tools whose version check passed at every root), not_covered_by with the reason, and
      # coverage_basis (scope-inference; named-in-output is reachable by no scanner here).
      # NEVER A PERCENTAGE. A percentage over a class denominator has units nobody can name.
      coverage: ${{ steps.resolve.outputs.coverage }}
      # R4, ADVISORY. The execution plan as data: depth from the trigger context, one row per
      # registered scanner job with decision run | skip | forced and the registered state behind
      # it, the capability states riding on each row, and the declared gaps. `advisory: true`,
      # `enforced_by: "nothing"`. docs/architecture/EXECUTION_PLANNING.md is the design and is
      # marked for owner review; §5 there is the exact change that would make scanners read this.
      plan: ${{ steps.resolve.outputs.plan }}
      # KDEC-010: THE CAPABILITY SELECTS THE SCANNER. Per (capability, root), from the ordered
      # candidates in scanner-registry.yaml capability_selection: SERVED by the default,
      # SUBSTITUTION (another carried scanner can read it -- labelled, never equivalence), or
      # VERSION_GAP (none can -- PARTIAL, never PASS). The gate and the report consume the
      # scalar lists; the scanners still run -- findings are findings, silence is not coverage.
      selection: ${{ steps.resolve.outputs.selection }}
      substitutions: ${{ steps.resolve.outputs.substitutions }}
      capability_gaps: ${{ steps.resolve.outputs.capability_gaps }}
      capability_gap_count: ${{ steps.resolve.outputs.capability_gap_count }}
      capped_jobs: ${{ steps.resolve.outputs.capped_jobs }}
      # KDEC-014: capped jobs whose gap every candidate's READ range establishes (enforced at uat/prod).
      proven_gap_jobs: ${{ steps.resolve.outputs.proven_gap_jobs }}
      not_selected_jobs: ${{ steps.resolve.outputs.not_selected_jobs }}
      fitness_notes: ${{ steps.resolve.outputs.fitness_notes }}
      # THE PLATFORM-PROBE VALUES, CONSUMED (PO §6). Dependabot alerts read as a scanner, in the
      # same words as every other scanner (FINDINGS / PASS / UNAVAILABLE / COLLECTION_FAILED),
      # with the basis recorded beside the state because an API answer has no SARIF behind it.
      dependabot_state: ${{ steps.resolve.outputs.dependabot_state }}
      dependabot_open_alerts: ${{ steps.resolve.outputs.dependabot_open_alerts }}
      dependabot_basis: ${{ steps.resolve.outputs.dependabot_basis }}
      dependabot_owner_role: ${{ steps.resolve.outputs.dependabot_owner_role }}
      # ordinary | COVERAGE_GAP | UNKNOWN. A private repository without Code Security has no
      # CodeQL and therefore no interprocedural dataflow; that is a declared gap, never
      # Semgrep presented as parity. Semgrep finds the sink; CodeQL follows the flow.
      dataflow_capability: ${{ steps.resolve.outputs.dataflow_capability }}
      # Every platform-owned state, each against a named OWNER ROLE and a named action. A role,
      # never a person: the kit stays portable and the summary stays honest about who can act.
      platform_owners: ${{ steps.resolve.outputs.platform_owners }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # THE STEP BODIES RUN FROM THE KIT, NOT FROM THIS FILE. Inline, the resolver and the
      # platform consumers were 85 KB and took the flagship to 518 KB -- over the 500 KB ceiling
      # at which GitHub stops STARTING a workflow (tests/check_workflow_size.py). `$/` delivers
      # the whole kit at the caller's pinned commit, so the composite runs the same two steps
      # beside the registry they are a copy of. tests/test_resolve.py runs them from the
      # composite, as shipped. Every value crosses as `with:` DATA; the composite's steps read
      # it through env:, and the job's outputs above keep their names.
      - name: Resolve versions, capability, coverage and the plan
        id: resolve
        uses: $/.github/actions/resolve
        with:
          paths: ${{ inputs.paths }}
          python-version: ${{ inputs.python_version }}
          node-version: ${{ inputs.node_version }}
          go-version: ${{ inputs.go_version }}
          dotnet-version: ${{ inputs.dotnet_version }}
          java-version: ${{ inputs.java_version }}
          image-ref: ${{ inputs.image_ref }}
          enable-sbom: ${{ inputs.enable_sbom }}
          enable-malicious-pkg-scan: ${{ inputs.enable_malicious_pkg_scan }}
          discovered-python: ${{ needs.discover.outputs.python }}
          discovered-node: ${{ needs.discover.outputs.node }}
          discovered-go: ${{ needs.discover.outputs.go }}
          discovered-dotnet: ${{ needs.discover.outputs.dotnet }}
          discovered-java: ${{ needs.discover.outputs.java }}
          discovered-cpp: ${{ needs.discover.outputs.cpp }}
          discovered-php: ${{ needs.discover.outputs.php }}
          discovered-kotlin: ${{ needs.discover.outputs.kotlin }}
          discovered-swift: ${{ needs.discover.outputs.swift }}
          discovered-mobile: ${{ needs.discover.outputs.mobile }}
          discovered-iac: ${{ needs.discover.outputs.iac }}
          discovery-state: ${{ needs.discover.outputs.state }}
          coverage-gaps: ${{ needs.discover.outputs.coverage_gaps }}
          unsupported: ${{ needs.discover.outputs.unsupported }}
          event-name: ${{ github.event_name }}
          ghas-available: ${{ needs.discover.outputs.ghas_available }}
          code-scanning: ${{ needs.discover.outputs.code_scanning }}
          secret-scanning: ${{ needs.discover.outputs.secret_scanning }}
          push-protection: ${{ needs.discover.outputs.push_protection }}
          dependabot-alerts: ${{ needs.discover.outputs.dependabot_alerts }}
          dependabot-updates: ${{ needs.discover.outputs.dependabot_updates }}
          dependabot-config: ${{ needs.discover.outputs.dependabot_config }}
          visibility: ${{ needs.discover.outputs.visibility }}
          platform-source: ${{ needs.discover.outputs.platform_source }}

  secret-scan:
    needs: [discover, kit-scripts]
    # Ecosystem-agnostic: every repository can leak a secret and resolve a dependency.
    # Gated only by discovery being able to run at all.
    if: always()
    name: Secret scan (gitleaks + detect-secrets)
    runs-on: ubuntu-latest
    outputs:
      # FINDINGS and the count when gitleaks found secrets (owner ruling 2026-10-22, lane L-S). The
      # job hands them to the gate, which blocks at every tier unless each one is excepted by
      # fingerprint in the policy register; the job still fails when it could not scan.
      findings_state: ${{ steps.scan.outputs.findings_state }}
      secret_count: ${{ steps.scan.outputs.secret_count }}
    # Bounded so a stalled dependency cannot bill six hours (LM-001: unbounded execution
    # converts a dependency failure into uncontrolled cost).
    # NOT YET: a timeout still surfaces as a plain job failure. It SHOULD classify as
    # UNAVAILABLE / EXECUTION_TIMEOUT — cost is bounded here, semantics are not. See
    # docs/roadmap/FUTURE_WORK.md. Do not let this comment imply the mapping exists.
    timeout-minutes: 20
    steps:
      # THE STEP BODIES RUN FROM THE KIT, NOT FROM THIS FILE (ledger L64; decomposition step 12).
      # `$/` delivers the whole kit at the caller's pinned commit. The composite is this job's
      # FIRST step and carries the fetch, the scan, the redaction and the uploads in their old
      # order, so every artefact name, annotation and SARIF category is what it was inline.
      # tests/prove_composite_move_equivalence.py holds that; the Result summary stays here
      # because it reads `job.status`, which is the job's fact, not the composite's.
      - name: Secret scan (gitleaks + detect-secrets)
        id: scan
        uses: $/.github/actions/secret-scan
        with:
          # CRAWL IS THE FLOOR (KDEC-018): the secret scan always covers the repository root.
          # `paths` narrows the OTHER scanners; a secret outside it must still block.
          # tests/prove_crawl_floor.py K1.
          paths: "."
          scan_git_history: ${{ inputs.scan_git_history }}
          test_only_seed_artifact: ${{ inputs.test_only_seed_artifact }}
          checkout_fetch_depth: ${{ inputs.scan_git_history && '0' || '1' }}
  # ─── Code quality ───────────────────────────────────────────

      # BEGIN STATUS_STEP — generated by scripts/inline_normalizer.py. DO NOT EDIT HERE.
      - name: Result summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          # A SUMMARY IS NOT A VERDICT. If the script did not arrive, say so and stop;
          # never fail the job for it. A housekeeping step deciding a security verdict
          # is how a scan that had SUCCEEDED went red twice in this file's history.
          if [ ! -s /tmp/scan_status.sh ]; then
            echo "::warning title=Result summary unavailable::/tmp/scan_status.sh did not reach this job."
            echo "No per-job summary was printed. The scan's own verdict stands."
            exit 0
          fi
          . /tmp/scan_status.sh
          if [ "$JOB_STATUS" = "success" ]; then _e=COMPLETE; else _e=FAILED; fi
          scan_status "Secret scan" "$_e" "gitleaks.sarif" "whole repository"
      # END STATUS_STEP

  code-quality:
    needs: [discover, kit-scripts]
    # DISCOVERED, NOT DECLARED. Runs because roots for this ecosystem were actually
    # found in the caller's scope -- not because a selector named it. On failure
    # discovery turns everything on rather than producing a tidy row of NOT_APPLICABLE.
    # PYTHON OR NODE. This was python only, so a Node-only repository was never linted and a
    # `multi` caller was linted only when it also happened to hold Python (KNOWN_GAPS section 2).
    # Proven by tests/prove_code_quality_enforces.py.
    if: needs.discover.outputs.python == 'true' || needs.discover.outputs.node == 'true'
    name: Code quality
    runs-on: ubuntu-latest
    outputs:
      # FINDINGS when enforce_lint is on, advisory_mode off, and ESLint or Ruff found violations;
      # '' otherwise. The job does not fail on it: the security gate enforces it (O-24).
      findings_state: ${{ steps.eslint.outputs.findings_state || steps.ruff.outputs.findings_state }}
    # Bounded so a stalled dependency cannot bill six hours (LM-001: unbounded execution
    # converts a dependency failure into uncontrolled cost).
    # NOT YET: a timeout still surfaces as a plain job failure. It SHOULD classify as
    # UNAVAILABLE / EXECUTION_TIMEOUT — cost is bounded here, semantics are not. See
    # docs/roadmap/FUTURE_WORK.md. Do not let this comment imply the mapping exists.
    timeout-minutes: 20
    steps:
      # BEGIN FETCH_KIT_SCRIPTS — generated by scripts/inline_normalizer.py. DO NOT EDIT HERE.
      - name: Fetch the kit's own scripts
        # A RUN-SCOPED ARTIFACT, NOT `uses: ./` and NOT a copy per call site. Why, at
        # length, in the `kit-scripts` job at the top of this file.
        if: always()
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kit-scripts-${{ github.run_attempt }}
          path: /tmp
      - name: Verify the kit scripts against their pinned digest
        # A DOWNLOADED SCRIPT NOBODY VERIFIED IS A SUPPLY CHAIN STEP WITH NO INTEGRITY
        # CHECK. Why this digest and not a manifest fetched beside it: `kit-scripts`.
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp
          echo "77747346d57de23c8a301758499db36f89f41e3850a2495497d2983a6cb3916a  kit-scripts.sha256" | sha256sum -c -
          sha256sum -c kit-scripts.sha256
      # END FETCH_KIT_SCRIPTS
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # NEVER ASSUME MANIFESTS LIVE AT THE REPOSITORY ROOT.
      # setup-node with `cache: npm` previously failed the whole job with "Dependencies lock
      # file is not found in /home/runner/work/<repo>/<repo>" — it looked only at the root and
      # ignored `paths` entirely. Any consumer whose package.json sits in a subdirectory (which
      # is most monorepos, and both of the real repos this was tested against) could not use
      # this workflow at all. Discover, then report what was actually scanned.
      - name: Locate the Node project
        id: node
        # Keyed on what discovery FOUND, never on the caller's `language` declaration: a caller
        # who declares `python` over a tree that also holds Node code still gets it linted.
        if: needs.discover.outputs.node == 'true'
        env:
          # CALLER INPUT ARRIVES AS DATA, NEVER AS SCRIPT TEXT (ledger L38).
          IN_PATHS: ${{ inputs.paths }}
        run: |
          set -uo pipefail
          scope="${IN_PATHS}"
          [ -d "$scope" ] || scope="."
          # A MONOREPO HAS MORE THAN ONE PROJECT ROOT. Taking the first match meant that a
          # consumer with services/a and services/b got service `a` linted, service `b` never
          # looked at, and a green job either way — coverage that silently stops at the first
          # directory it happens to sort to.
          # 8 LEVELS, THE SAME BOUND DISCOVERY SEARCHES (W4K-120). This was 6, so a root at depth
          # 7 or 8 enabled the job and was never enumerated or scanned. Deeper is declared.
          find "$scope" -maxdepth 8 -name package.json -not -path '*/node_modules/*' \
            | sort > .node-roots.txt
          n=$(wc -l < .node-roots.txt)
          if [ -n "$(find "$scope" -mindepth 9 -not -path '*/node_modules/*' -print -quit 2>/dev/null)" ]; then
            echo "::warning title=COVERAGE_GAP - beyond depth 8::package.json files deeper than 8 levels under '$scope' were not enumerated or scanned."
          fi
          if [ "$n" -eq 0 ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=No Node project::No package.json within 8 levels of '$scope'."
            echo "COVERAGE=NOT_APPLICABLE — absence of a language is reported, never inferred."
            exit 0
          fi

          echo "### Node project roots discovered ($n)" >> "$GITHUB_STEP_SUMMARY"
          nolock=0; first=""; firstlock=""
          while read -r pkg; do
            dir=$(dirname "$pkg"); lock=""
            for c in package-lock.json npm-shrinkwrap.json yarn.lock; do
              [ -f "$dir/$c" ] && { lock="$dir/$c"; break; }
            done
            [ -z "$first" ] && { first="$dir"; firstlock="$lock"; }
            if [ -n "$lock" ]; then
              echo "- \`$dir\` — lockfile \`$(basename "$lock")\` — SCA covered" >> "$GITHUB_STEP_SUMMARY"
              echo "  root: $dir  lockfile: $(basename "$lock")"
            else
              nolock=$((nolock+1))
              # Explicit partial state. "Node job green" is not an acceptable summary when
              # dependency analysis could not run for a root.
              echo "- \`$dir\` — **NO LOCKFILE — NODE_SCA_PARTIAL**: source SAST runs, dependency" \
                   "vulnerability analysis NOT established for this root" >> "$GITHUB_STEP_SUMMARY"
              echo "::warning title=NODE_SCA_PARTIAL at $dir::package.json found, no supported"
              echo "lockfile (package-lock.json / npm-shrinkwrap.json / yarn.lock). Source SAST"
              echo "executed; dependency vulnerability analysis NOT established for this root."
              echo "Trivy cannot resolve npm dependencies without one — this is where the current"
              echo "wave of compromised-package attacks lands. Commit a lockfile."
            fi
          done < .node-roots.txt

          {
            echo "found=true"
            echo "roots=$n"
            echo "nolock=$nolock"
            echo "dir=$first"
            echo "lock=$firstlock"
            echo "cache=$([ -n "$firstlock" ] && echo npm || echo '')"
          } >> "$GITHUB_OUTPUT"
          echo "COVERAGE=$([ "$nolock" -eq 0 ] && echo FULL || echo NODE_SCA_PARTIAL) ($n root(s), $nolock without lockfile)"

      - name: Setup Node
        if: needs.discover.outputs.node == 'true' && steps.node.outputs.found == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node_version }}
          # Empty disables caching. A missing lockfile must degrade to "no cache", never to a
          # hard failure — caching is an optimisation, not a security control.
          cache: ${{ steps.node.outputs.cache }}
          cache-dependency-path: ${{ steps.node.outputs.lock }}

      - name: ESLint
        id: eslint
        if: needs.discover.outputs.node == 'true' && steps.node.outputs.found == 'true'
        env:
          # CALLER INPUT ARRIVES AS DATA, NEVER AS SCRIPT TEXT (ledger L38).
          IN_ENFORCE_LINT: ${{ inputs.enforce_lint }}
          IN_ADVISORY_MODE: ${{ inputs.advisory_mode }}
        run: |
          set -uo pipefail
          # LINT FINDINGS MUST BE ABLE TO FAIL THIS STEP WHEN THE CALLER ASKED THEM TO.
          # This was `npx --no-install eslint . || npx eslint . || notice`, so a run that FOUND
          # violations (ESLint exit 1) fell through to a second run, then to "not configured" --
          # and the step exited 0 with enforce_lint on. ESLint's exit codes separate the cases:
          #   0 clean   1 lint errors   2 configuration problem or internal error
          # Only 1 is findings; only findings may block; and only when enforce_lint is on and
          # advisory_mode is off. A root with no local ESLint is reported, never fetched at
          # whatever version the registry serves today.
          fail=0
          # Every discovered root, not just the first.
          while read -r pkg; do
          dir=$(dirname "$pkg")
          echo "::group::ESLint $dir"
          cd "$GITHUB_WORKSPACE/$dir" || continue
          lock=""
          for c in package-lock.json npm-shrinkwrap.json yarn.lock; do
            [ -f "$c" ] && { lock="$c"; break; }
          done
          # npm ci REQUIRES a lockfile and fails without one; fall back deliberately.
          if [ -n "$lock" ]; then
            npm ci --no-audit --no-fund
          else
            echo "::warning title=No npm lockfile — DEPENDENCY SCANNING IS DEGRADED::Trivy cannot"
            echo "scan npm dependencies from package.json alone; it requires package-lock.json,"
            echo "npm-shrinkwrap.json or yarn.lock. Without one your Node dependencies are NOT being"
            echo "checked for known vulnerabilities or compromised packages — which is where the"
            echo "current wave of supply-chain attacks lands. Commit a lockfile."
            echo "Falling back to 'npm install'; builds are also not reproducible without one."
            npm install --no-audit --no-fund
          fi
          if [ ! -x node_modules/.bin/eslint ]; then
            echo "::notice title=ESLint not installed::$dir does not install ESLint. Not linted."
            echo "Reported rather than failed — whether to lint is a consumer choice."
            echo "::endgroup::"; cd "$GITHUB_WORKSPACE"; continue
          fi
          # `|| rc=$?`, not `; rc=$?`: this step runs under `bash -e`, where a bare ESLint exit 1
          # ended the step there -- red on any lint finding, enforce_lint on or off.
          rc=0
          node_modules/.bin/eslint . || rc=$?
          case "$rc" in
            0) echo "ESLint $dir: clean" ;;
            1) if [ "${IN_ENFORCE_LINT}" = "true" ] && [ "${IN_ADVISORY_MODE}" != "true" ]; then
                 echo "::error title=ESLint findings::$dir. enforce_lint is on."; fail=1
               else
                 echo "::warning title=Lint findings (advisory)::ESLint reported findings in $dir."\
                   " Not blocking — set enforce_lint: true to gate on them."
               fi ;;
            *) echo "::notice title=ESLint not configured::ESLint could not run in $dir (exit $rc):"\
                 " no usable configuration, or an internal error. Reported, not failed." ;;
          esac
          echo "::endgroup::"
          cd "$GITHUB_WORKSPACE"
          done < "$GITHUB_WORKSPACE/.node-roots.txt"
          # THE GATE IS THE SINGLE ENFORCEMENT POINT (lane L-S, O-24). Enforced lint findings are
          # handed to it as findings_state=FINDINGS (this job writes no SARIF, so the report cannot
          # see them; a job that failed with nothing on record read as a crash, EVIDENCE_UNTRUSTED).
          # The step fails only when the tooling did: npm, or an unreadable root list.
          [ "$fail" = "1" ] && echo "findings_state=FINDINGS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Setup Python
        if: needs.discover.outputs.python == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python_version }}

      - name: Ruff + mypy
        id: ruff
        if: needs.discover.outputs.python == 'true'
        env:
          # CALLER INPUT ARRIVES AS DATA, NEVER AS SCRIPT TEXT (ledger L38).
          IN_PATHS: ${{ inputs.paths }}
          IN_ENFORCE_LINT: ${{ inputs.enforce_lint }}
          IN_ADVISORY_MODE: ${{ inputs.advisory_mode }}
        run: |
          set -uo pipefail
          scope="${IN_PATHS}"
          # "NONE FOUND" AND "COULD NOT LOOK" ARE DIFFERENT ANSWERS. A find that ERRORS produces
          # empty output, which read as "this language is not here", which skipped the job, which
          # reported green over code nobody scanned. Same defect discovery had; same fix.
          # suppression: PRESENTATION_ONLY -- find's stderr is noise on unreadable subtrees; the EXIT
          # STATUS is checked on the next line and a failure raises COLLECTION_FAILED rather than reading
          # as 'nothing found'.
          # discards: find's stderr, which is noise on unreadable or permission-denied subtrees
          # preserved_by: the EXIT STATUS is captured on the next line and a non-zero rc raises
          # preserved_by: COLLECTION_FAILED, so 'could not look' never reads as 'found nothing'
          if ! _hits=$(find "$scope" -name '*.py' -not -path '*/node_modules/*' 2>/dev/null); then
            echo "::error title=COLLECTION_FAILED::Applicability survey failed; cannot establish scope."
            echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ -z "$_hits" ]; then
            echo "::notice title=No Python sources::None found under '$scope'. Skipping."
            exit 0
          fi
          python -m pip install --quiet ruff mypy
          # Lint STYLE is not a security control. Hard-failing on it blocked adoption of a
          # security workflow on day one, which is how controls get bypassed wholesale.
          # THE STEP'S EXIT WAS MYPY'S, NOT RUFF'S. Without `-e`, `ruff check` failing changed
          # nothing: the last command was `mypy ... || true`, so this step exited 0 on every
          # violation with enforce_lint on. Ruff's verdict is captured and is the step's exit.
          ruff_rc=0
          if [ "${IN_ENFORCE_LINT}" = "true" ] && [ "${IN_ADVISORY_MODE}" != "true" ]; then
            ruff check "$scope" || ruff_rc=$?
          else
            ruff check "$scope" || echo "::warning title=Lint findings (advisory)::ruff reported"\
              " findings. Not blocking — set enforce_lint: true to gate on them."
          fi
          mypy "$scope" --ignore-missing-imports || true   # types advisory by default
          # Ruff exits 1 on violations and 2 when it could not run. Violations are findings, handed
          # to the gate (findings_state); anything else is the tool failing, and fails the step.
          if [ "$ruff_rc" = "1" ]; then
            echo "findings_state=FINDINGS" >> "$GITHUB_OUTPUT"
            echo "::warning title=Ruff findings (enforce_lint)::handed to the security gate, which decides by the resolved policy."
            exit 0
          fi
          exit "$ruff_rc"

  # ─── SAST ───────────────────────────────────────────────────

      # BEGIN STATUS_STEP — generated by scripts/inline_normalizer.py. DO NOT EDIT HERE.
      - name: Result summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          # A SUMMARY IS NOT A VERDICT. If the script did not arrive, say so and stop;
          # never fail the job for it. A housekeeping step deciding a security verdict
          # is how a scan that had SUCCEEDED went red twice in this file's history.
          if [ ! -s /tmp/scan_status.sh ]; then
            echo "::warning title=Result summary unavailable::/tmp/scan_status.sh did not reach this job."
            echo "No per-job summary was printed. The scan's own verdict stands."
            exit 0
          fi
          . /tmp/scan_status.sh
          if [ "$JOB_STATUS" = "success" ]; then _e=COMPLETE; else _e=FAILED; fi
          scan_status "Code quality" "$_e" "" "linters"
      # END STATUS_STEP

  sast-semgrep:
    needs: [discover, kit-scripts]
    # Ecosystem-agnostic: every repository can leak a secret and resolve a dependency.
    # Gated only by discovery being able to run at all.
    if: always()
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    # THE SCAN'S OWN STATE, BESIDE THE JOB RESULT (KDEC-016, 2026-10-22). A job that succeeded
    # over PHP Semgrep could only partly parse is PARTIAL, not PASS: the gate reads scan_state as
    # the typed state, and the files are named for the summary. '' when the job did not run.
    outputs:
      scan_state: ${{ steps.semgrep.outputs.scan_state }}
      scan_reason: ${{ steps.semgrep.outputs.scan_reason }}
      parse_partial_files: ${{ steps.semgrep.outputs.parse_partial_files }}
      # FINDINGS when this job's own threshold fired and no caller input softened it; '' otherwise.
      # The job does not fail on it: the security gate enforces it by the resolved policy (O-24).
      findings_state: ${{ steps.semgrep_enforce.outputs.findings_state }}
    # Bounded so a stalled dependency cannot bill six hours (LM-001: unbounded execution
    # converts a dependency failure into uncontrolled cost).
    # NOT YET: a timeout still surfaces as a plain job failure. It SHOULD classify as
    # UNAVAILABLE / EXECUTION_TIMEOUT — cost is bounded here, semantics are not. See
    # docs/roadmap/FUTURE_WORK.md. Do not let this comment imply the mapping exists.
    timeout-minutes: 20
    # ONE SEMGREP VERSION, PINNED BY DIGEST (lane L-SG, ledger L03; KDEC-016). This was the
    # semgrep/semgrep 1.90.0 TAG, which reads PHP only 5.6..7.2: PHP 7.3+ syntax is PartialParsing,
    # exit 3 under --strict, COLLECTION_FAILED for the whole job. The 1.178.0 image reads PHP
    # 5.6..8.4 (tests/corpora/php_corpus.py) and is the release the C# and Java jobs pip-install.
    # The comment names the release the digest is; tests/_semgrep_pin.py reads both, and the
    # validate-scanners and probe-scanner-corpora probes run this exact digest.
    container:
      image: semgrep/semgrep@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b # 1.178.0
    steps:
      # BEGIN FETCH_KIT_SCRIPTS — generated by scripts/inline_normalizer.py. DO NOT EDIT HERE.
      - name: Fetch the kit's own scripts
        # A RUN-SCOPED ARTIFACT, NOT `uses: ./` and NOT a copy per call site. Why, at
        # length, in the `kit-scripts` job at the top of this file.
        if: always()
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kit-scripts-${{ github.run_attempt }}
          path: /tmp
      - name: Verify the kit scripts against their pinned digest
        # A DOWNLOADED SCRIPT NOBODY VERIFIED IS A SUPPLY CHAIN STEP WITH NO INTEGRITY
        # CHECK. Why this digest and not a manifest fetched beside it: `kit-scripts`.
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp
          echo "77747346d57de23c8a301758499db36f89f41e3850a2495497d2983a6cb3916a  kit-scripts.sha256" | sha256sum -c -
          sha256sum -c kit-scripts.sha256
      # END FETCH_KIT_SCRIPTS
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Semgrep scan
        id: semgrep
        env:
          IN_SEMGREP_CONFIG: ${{ inputs.semgrep_config }}
          IN_PATHS: ${{ inputs.paths }}
          # Discovery's answer for PHP, as DATA: true, false, or empty when it could not say.
          IN_DISCOVERED_PHP: ${{ needs.discover.outputs.php }}
          # And for Kotlin (KDEC-026), the same shape: true, false, or empty when it could not say.
          IN_DISCOVERED_KOTLIN: ${{ needs.discover.outputs.kotlin }}
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          set -uo pipefail
          # TWO bugs lived here.
          #
          # 1. `paths` was never passed, so semgrep scanned the whole repository. On a "clean"
          #    control that meant scanning the seeded fixture and failing — the clean baseline
          #    was never clean, which would have invalidated every conclusion drawn from it.
          # 2. --config was not repeated. semgrep takes targets POSITIONALLY, so
          #    `--config p/default p/owasp-top-ten` loaded ONE ruleset and treated the other as
          #    a path to scan. Half the intended rules never ran, silently.
          # SEMGREP SKIPS test/ and fixture/ DIRECTORIES BY DEFAULT.
          # That default is why every semgrep job reported success with zero findings while
          # bandit — which has no such default — found the seeded flaw in the same tree. Any
          # consumer whose code sits under a path matching semgrep's built-in ignore list gets
          # a silent, confident, empty result. Writing our own .semgrepignore replaces the
          # default entirely; the caller's scope decides what is scanned, not semgrep's guess.
          printf 'node_modules/\n.git/\n' > .semgrepignore
          cfg=""
          for c in ${IN_SEMGREP_CONFIG}; do cfg="$cfg --config $c"; done
          # PHP GETS A RULESET FLOOR THE CALLER CANNOT NARROW AWAY (lane L-PHP). Measured on 1.90.0
          # and 1.178.0 (this job's image since lane L-SG): p/php finds the seeded SQL injection,
          # XSS and command injection; p/python alone finds none of them; p/php adds no rule
          # beyond the shipped default. So whenever
          # discovery found PHP -- or could not say -- p/php is requested beside the caller's sets.
          # tests/prove_semgrep_php.py.
          if [ "${IN_DISCOVERED_PHP:-}" != "false" ]; then
            case " ${IN_SEMGREP_CONFIG} " in *" p/php "*) ;; *) cfg="$cfg --config p/php" ;; esac
          fi
          # KOTLIN GETS THE SAME FLOOR (KDEC-026). Measured 2026-10-23 on this job's image: the
          # default's Kotlin rules (18, incidental) and p/kotlin find the planted MD5 and ECB use;
          # a narrowed config (p/python) finds neither. tests/prove_semgrep_kotlin.py.
          if [ "${IN_DISCOVERED_KOTLIN:-}" != "false" ]; then
            case " ${IN_SEMGREP_CONFIG} " in *" p/kotlin "*) ;; *) cfg="$cfg --config p/kotlin" ;; esac
          fi
          echo "rulesets:$cfg    target: ${IN_PATHS}"

          # Detection first. Enforcement is a SEPARATE decision below, so that a scanner's exit
          # code never doubles as the gate.
          # --strict: A FILE SEMGREP COULD NOT PARSE IS EXIT 3, NOT A WARNING AND A ZERO
          # (PIPELINE_ORDERING 3.4). Without it a parse failure is a warning-level notification,
          # which SARIF does not count as a failed run, and the code it skipped is reported clean.
          # Measured with 1.178.0: an unparseable file is rc 0 + a warning, and rc 3 under
          # --strict, with the SARIF still written. Other non-zero codes keep their old handling.
          # --json-output: the same run's JSON beside the SARIF, read ONLY for `paths.scanned` --
          # the files Semgrep says it examined (the PHP witness below). Never uploaded.
          #
          # PHP: SCAN WHAT PARSES, FLAG THE REST (owner, 2026-10-22; KDEC-016 amended). Exit 3 is
          # NOT discarded when Semgrep's own JSON says every error is a PARSE error on a .php file
          # and it examined files: PHP 8.5's `(void)` cast and `final` promoted properties are
          # errors[].type ["PartialParsing", [spans]] (level "warn") naming the file, while every
          # other file -- and the parsed rest of that one -- is scanned (measured in this job's
          # image, by digest, 2026-10-22). The findings are kept, the files and lines are named,
          # and the scan is PARTIAL (scan_partial_reason PARSE_PARTIAL_PHP_SYNTAX) -- never PASS,
          # and never COLLECTION_FAILED for this case. ANY other error -- a non-PHP file that did
          # not parse, a rule that did not load, a timeout, a crash, nothing examined, a JSON
          # nobody can read -- keeps the strict refusal. The parse kinds are Semgrep's own
          # error_type tags (semgrep_output_v1 in the image). tests/prove_semgrep_php.py S7-S9.
          php_parse_only='["PartialParsing", "Syntax error", "Lexical error", "Other syntax error", "AST builder error"] as $kinds
            | (.errors // []) as $e
            | if ($e | length) == 0 or ((.paths.scanned // []) | length) == 0 then "no error named, or nothing examined"
              elif all($e[]; ((.type | if type == "array" then .[0] else . end) as $t | $kinds | index([$t]) != null)
                             and ((.path // "") | endswith(".php"))
                             and all((.spans // [])[]; ((.file // .path // "") | endswith(".php"))))
              then "php-parse-only" else "an error that is not a PHP parse error" end'
          scan_state=COMPLETE
          sg_rc=0
          semgrep scan $cfg --strict --sarif --output semgrep.sarif --json-output=semgrep-paths.json --metrics=off \
            "${IN_PATHS}" || sg_rc=$?
          if [ "$sg_rc" = "3" ]; then
            # suppression: FAILURE_ISOLATION_WITH_STATE_CAPTURE -- empty is COLLECTION_FAILED
            # discards: jq's stderr on an absent or unreadable JSON
            # preserved_by: the empty verdict, which the refusal names
            parse_only=$(jq -r "$php_parse_only" semgrep-paths.json 2>/dev/null || echo "")
            if [ "$parse_only" != "php-parse-only" ]; then
              echo "::error title=COLLECTION_FAILED::semgrep could not parse at least one file in scope (exit 3 under --strict), and not only PHP parse errors (${parse_only:-its JSON could not be read}). What it skipped was not scanned, so a zero here is not clean."
              echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            scan_state=PARTIAL
            partial_files=$(jq -c '[.errors[].path] | unique' semgrep-paths.json)
            echo "scan_reason=PARSE_PARTIAL_PHP_SYNTAX" >> "$GITHUB_OUTPUT"
            echo "parse_partial_files=${partial_files}" >> "$GITHUB_OUTPUT"
            echo "::warning title=PARTIAL (PARSE_PARTIAL_PHP_SYNTAX)::Semgrep could not fully parse $(jq -r '[.errors[].path] | unique | length' semgrep-paths.json) PHP file(s): ${partial_files}. Everything else was scanned and its findings are kept; the unparsed parts of these files were NOT scanned. PARTIAL, never PASS."
            {
              echo "### Semgrep — PARTIAL: PHP files it could not fully parse"
              echo ""
              echo "| file | lines Semgrep reported | Semgrep said |"
              echo "|---|---|---|"
              jq -r '.errors[] | "| `\(.path)` | \([(.spans // [])[] | "\(.start.line)-\(.end.line)"] | join(", ")) | \((.message // (.type | if type == "array" then .[0] else . end)) | gsub("\n"; " ") | gsub("[|]"; "/")) |"' semgrep-paths.json
              echo ""
              echo "> **Scan what parses, flag the rest** (KDEC-016, 2026-10-22). Every other file was scanned and"
              echo "> its findings stand. These FILES are partly unscanned -- Semgrep may report only the first"
              echo "> construct it could not read in a file (measured: \`final\` promotion hid a later \`(void)\`),"
              echo "> so a silence anywhere in them is not clean: the gate records COVERAGE_PARTIAL. A newer"
              echo "> Semgrep that reads them closes it."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # A PARSE FAILURE IS NOT ZERO FINDINGS. Semgrep is the highest-yield scanner in the
          # suite, so `|| echo 0` here meant a truncated report presented as a clean codebase by
          # the detector most likely to have found something.
          if [ ! -s semgrep.sarif ]; then
            echo "::error title=COLLECTION_FAILED::semgrep.sarif was not produced."
            echo "An ABSENT report is not zero findings."
            echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          # THE EFFECTIVE LEVEL, NOT THE RESULT'S OWN FIELD (SARIF 2.1.0 section 3.27.10): a result's level
          # is its own `level`, else its rule's `defaultConfiguration.level`, else "warning". This
          # counted `.level // "warning"` alone; Semgrep never writes `level` on a result, so every
          # ERROR-severity finding counted 0 and this scanner could never block -- while the report,
          # which reads the rule's level, listed them as errors. tests/prove_sarif_effective_level.py.
          # VALIDITY ROWS 1-6, ON THE RUNNER, BEFORE PUBLICATION (ledger L02; PIPELINE_ORDERING 4.5):
          # results absent (did not attempt), no run, an error-level tool notification or
          # executionSuccessful false is COLLECTION_FAILED -- never a count of zero, and never
          # published as a clean scan. Per-tool profile, not a hollow-rules rule (KDEC-008 OD-2).
          if ! _v=$(python3 /tmp/sarif_validity.py --tool semgrep semgrep.sarif 2>&1); then
            echo "::error title=COLLECTION_FAILED::$_v"
            echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if ! n=$(jq '[.runs[] | ((.tool.driver.rules // []) | map({key: .id, value: (.defaultConfiguration.level // "warning")}) | from_entries) as $lv | .results[] | select((.level // $lv[.ruleId] // "warning") == "error")] | length' semgrep.sarif 2>&1); then
            echo "::error title=COLLECTION_FAILED::semgrep.sarif is not valid SARIF."
            echo "jq said: $n"
            echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          # PHP: EXAMINED, OR REFUSED AS UNEXAMINED (lane L-PHP; KDEC-008, a per-tool witness, not a
          # universal hollow rule). Semgrep names the files it examined in `paths.scanned`; files
          # it skips (over its size limit) are not there. PHP source in scope of which it examined
          # NONE, or a PHP scan with no php.* rule loaded, analysed nothing -- COLLECTION_FAILED,
          # never a clean zero. Some skipped is said out loud. tests/prove_semgrep_php.py S4.
          if [ "${IN_DISCOVERED_PHP:-}" != "false" ]; then
            php_src=$(find "${IN_PATHS}" -type f -name '*.php' -not -path '*/node_modules/*' -not -path '*/.git/*' | wc -l | tr -d ' ')
            if [ "${php_src:-0}" -gt 0 ]; then
              # suppression: FAILURE_ISOLATION_WITH_STATE_CAPTURE -- an unreadable JSON or SARIF
              # leaves the count EMPTY, and empty is refused below as COLLECTION_FAILED.
              # discards: jq's stderr when a file is absent or does not parse
              # preserved_by: the empty value, which the refusal below names as unknown
              php_seen=$(jq '[.paths.scanned[]? | select(endswith(".php"))] | length' semgrep-paths.json 2>/dev/null || echo "")
              php_rules=$(jq '[.runs[].tool.driver.rules[]? | select(.id | startswith("php."))] | length' semgrep.sarif 2>/dev/null || echo "")
              echo "PHP: ${php_src} file(s) in scope; Semgrep examined ${php_seen:-UNKNOWN}; php rules loaded: ${php_rules:-UNKNOWN}"
              if [ -z "$php_seen" ] || [ "$php_seen" = "0" ] || [ -z "$php_rules" ] || [ "$php_rules" = "0" ]; then
                echo "::error title=COLLECTION_FAILED::PHP is in scope (${php_src} file(s)) and Semgrep examined ${php_seen:-an unknown number} of them with ${php_rules:-an unknown number of} PHP rule(s). A PHP scan that analysed nothing is not clean."
                echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
                exit 1
              fi
              if [ "$php_seen" -lt "$php_src" ]; then
                echo "::warning title=PHP partly examined::Semgrep examined ${php_seen} of ${php_src} PHP file(s) in scope; the rest were skipped (e.g. over its size limit) and were NOT scanned."
              fi
            fi
          fi
          # KOTLIN: EXAMINED, OR REFUSED AS UNEXAMINED (KDEC-026) -- the PHP witness, for .kt/.kts.
          if [ "${IN_DISCOVERED_KOTLIN:-}" != "false" ]; then
            kt_src=$(find "${IN_PATHS}" -type f \( -name '*.kt' -o -name '*.kts' \) -not -path '*/node_modules/*' -not -path '*/.git/*' | wc -l | tr -d ' ')
            if [ "${kt_src:-0}" -gt 0 ]; then
              # suppression: FAILURE_ISOLATION_WITH_STATE_CAPTURE -- empty is refused below
              # discards: jq's stderr when a file is absent or does not parse
              # preserved_by: the empty value, which the refusal below names as unknown
              kt_seen=$(jq '[.paths.scanned[]? | select(endswith(".kt") or endswith(".kts"))] | length' semgrep-paths.json 2>/dev/null || echo "")
              kt_rules=$(jq '[.runs[].tool.driver.rules[]? | select(.id | startswith("kotlin."))] | length' semgrep.sarif 2>/dev/null || echo "")
              echo "Kotlin: ${kt_src} file(s) in scope; Semgrep examined ${kt_seen:-UNKNOWN}; kotlin rules loaded: ${kt_rules:-UNKNOWN}"
              if [ -z "$kt_seen" ] || [ "$kt_seen" = "0" ] || [ -z "$kt_rules" ] || [ "$kt_rules" = "0" ]; then
                echo "::error title=COLLECTION_FAILED::Kotlin is in scope (${kt_src} file(s)) and Semgrep examined ${kt_seen:-an unknown number} of them with ${kt_rules:-an unknown number of} Kotlin rule(s). A Kotlin scan that analysed nothing is not clean."
                echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
                exit 1
              fi
            fi
          fi
          echo "count=${n//[$'\r\n']/ }" >> "$GITHUB_OUTPUT"
          # Written LAST: a scan refused above never publishes a state the gate could read.
          echo "scan_state=${scan_state}" >> "$GITHUB_OUTPUT"
          echo "semgrep ERROR-level findings: $n (scan ${scan_state})"

      - name: Semgrep — enforce
        id: semgrep_enforce
        if: always()
        env:
          # CALLER INPUT ARRIVES AS DATA, NEVER AS SCRIPT TEXT (ledger L38).
          IN_SOFT_FAIL_SAST: ${{ inputs.soft_fail_sast }}
          IN_ADVISORY_MODE: ${{ inputs.advisory_mode }}
          IN_SCAN_STATE: ${{ steps.semgrep.outputs.scan_state }}
        run: |
          n='${{ steps.semgrep.outputs.count }}'
          # COLLECTION_FAILED IS NOT ZERO FINDINGS -- AND THIS STEP RUNS ON always().
          #
          # The counting step above correctly refuses to turn a missing or malformed report
          # into n=0, and exits non-zero. But `if: always()` means THIS step still runs, reads
          # an output that was never written, and ${n:-0} quietly supplies the very zero the
          # step above refused to invent -- announcing GATE=PASS one line after the failure was
          # detected. Each side assumed the other had handled it. Check explicitly.
          collection='${{ steps.semgrep.outputs.collection }}'
          if [ "$collection" = "COLLECTION_FAILED" ]; then
            echo "::error title=COLLECTION_FAILED::Evidence could not be collected."
            echo "Posture CANNOT be established from this run. This is not a clean result."
            exit 1
          fi
          if [ -z "${n:-}" ]; then
            echo "::error title=COLLECTION_FAILED::No count was produced by the scan step."
            echo "An ABSENT measurement is not a measurement of zero."
            exit 1
          fi
          # PARTIAL (PHP files Semgrep could not fully parse) keeps its findings: they are handed to
          # the gate exactly as a complete scan's are. What it cannot do is read as complete.
          analysis=COMPLETE
          [ "${IN_SCAN_STATE:-}" = "PARTIAL" ] && analysis=PARTIAL
          # THE GATE IS THE SINGLE ENFORCEMENT POINT (lane L-S, O-24). Findings are REPORTED here
          # and handed to the gate as findings_state=FINDINGS; the gate enforces them by the
          # resolved policy. This job fails only when it could not scan or trust its own count
          # (above). tests/prove_gate_policy_enforcement.py (sep_*).
          if [ "${n:-0}" -gt 0 ] && [ "${IN_SOFT_FAIL_SAST}" != "true" ] && [ "${IN_ADVISORY_MODE}" != "true" ]; then
            echo "findings_state=FINDINGS" >> "$GITHUB_OUTPUT"
            echo "::warning title=Semgrep::${n} ERROR-level finding(s). ANALYSIS=${analysis} -- handed to the security gate, which decides by the resolved policy."
            exit 0
          fi
          if [ "$analysis" = "PARTIAL" ]; then
            echo "ANALYSIS=PARTIAL: this step does not block (${n:-0} error-level finding(s), soft_fail=${IN_SOFT_FAIL_SAST}), and the PHP Semgrep could not parse is NOT clean -- the gate records it."
            exit 0
          fi
          echo "ANALYSIS=${analysis} GATE=PASS (${n:-0} error-level finding(s), soft_fail=${IN_SOFT_FAIL_SAST})"
      # Findings must survive whether or not this repo has code scanning. Uploading to the
      # Security tab is a PUBLICATION channel, not the finding itself — free on public repos,
      # otherwise Advanced Security. Treating it as mandatory turned successful scans into
      # failed jobs on every private repo without GHAS.
      - name: Semgrep — is there anything to publish?
        if: always()
        id: sarif_semgrep
        run: |
          # No SARIF usually means no applicable source (gosec on a repo with no Go). That is
          # a legitimate outcome, not a failure, and previously crashed the upload step.
          if [ -s "semgrep.sarif" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Semgrep: nothing to publish::No SARIF at 'semgrep.sarif' — no applicable source files. Not a failure."
          fi
      # BEGIN REDACT_STEP — generated by scripts/inline_normalizer.py. DO NOT EDIT HERE.
      - name: Redact credential material before upload
        if: always()
        shell: bash
        run: |
          # ORDER IS THE WHOLE CONTROL: this runs immediately before an upload, and
          # again before every later upload that follows a step which may have written
          # output -- a redactor after the upload protects nothing while looking exactly
          # like protection (N24/WP19). The sweep itself is ONE canonical script --
          # scripts/redact_all.sh, written by the `kit-scripts` job and fetched into
          # /tmp by every other -- because fourteen copies of one wrapper are how this
          # file reached 608.8 KB and stopped starting.
          #
          # A MISSING TOOL IS NOT A CLEAN RESULT. If the bundle did not arrive,
          # publication must not proceed on the strength of a scrub that never ran.
          if [ ! -s /tmp/redact_all.sh ]; then
            echo "::error title=Redaction could not be guaranteed::/tmp/redact_all.sh is absent."
            echo "The kit-scripts artifact did not reach this job, so no SARIF was scrubbed"
            echo "and none may be published. A MISSING TOOL IS NOT A CLEAN RESULT."
            exit 1
          fi
          bash /tmp/redact_all.sh
      # END REDACT_STEP
      - name: Semgrep — keep SARIF as an artifact
        if: always() && steps.sarif_semgrep.outputs.exists == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-semgrep-${{ github.run_attempt }}
          path: semgrep.sarif
          retention-days: 30
          if-no-files-found: warn
      - name: Semgrep — publish to the Security tab where available
        id: cs_semgrep
        if: always() && steps.sarif_semgrep.outputs.exists == 'true'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - name: Semgrep — state plainly if publication degraded
        if: always() && steps.sarif_semgrep.outputs.exists == 'true' && steps.cs_semgrep.outcome != 'success'
        run: |
          # Loud, never silent. An empty Security tab is indistinguishable from a clean
          # codebase, and that ambiguity is how a control becomes false assurance.
          echo "::warning title=Semgrep: NOT published to the Security tab::Code scanning is"
          echo "unavailable here (free on public repos, otherwise GitHub Advanced Security)."
          echo "The scan SUCCEEDED and the gate still enforces on these findings."
          echo "Retrieve them from the 'sarif-semgrep' artifact."

      # BEGIN STATUS_STEP — generated by scripts/inline_normalizer.py. DO NOT EDIT HERE.
      - name: Result summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          # A SUMMARY IS NOT A VERDICT. If the script did not arrive, say so and stop;
          # never fail the job for it. A housekeeping step deciding a security verdict
          # is how a scan that had SUCCEEDED went red twice in this file's history.
          if [ ! -s /tmp/scan_status.sh ]; then
            echo "::warning title=Result summary unavailable::/tmp/scan_status.sh did not reach this job."
            echo "No per-job summary was printed. The scan's own verdict stands."
            exit 0
          fi
          . /tmp/scan_status.sh
          if [ "$JOB_STATUS" = "success" ]; then _e=COMPLETE; else _e=FAILED; fi
          scan_status "SAST (Semgrep)" "$_e" "semgrep.sarif" "source"
      # END STATUS_STEP

  sast-bandit:
    needs: [discover, kit-scripts]
    # DISCOVERED, NOT DECLARED. Runs because roots for this ecosystem were actually
    # found in the caller's scope -- not because a selector named it. On failure
    # discovery turns everything on rather than producing a tidy row of NOT_APPLICABLE.
    if: needs.discover.outputs.python == 'true'
    name: SAST (Bandit, python)
    runs-on: ubuntu-latest
    outputs:
      # FINDINGS when this job's own threshold fired and no caller input softened it; '' otherwise.
      # The job does not fail on it: the security gate enforces it by the resolved policy (O-24).
      findings_state: ${{ steps.bandit_enforce.outputs.findings_state }}
    # Bounded so a stalled dependency cannot bill six hours (LM-001: unbounded execution
    # converts a dependency failure into uncontrolled cost).
    # NOT YET: a timeout still surfaces as a plain job failure. It SHOULD classify as
    # UNAVAILABLE / EXECUTION_TIMEOUT — cost is bounded here, semantics are not. See
    # docs/roadmap/FUTURE_WORK.md. Do not let this comment imply the mapping exists.
    timeout-minutes: 20
    steps:
      # BEGIN FETCH_KIT_SCRIPTS — generated by scripts/inline_normalizer.py. DO NOT EDIT HERE.
      - name: Fetch the kit's own scripts
        # A RUN-SCOPED ARTIFACT, NOT `uses: ./` and NOT a copy per call site. Why, at
        # length, in the `kit-scripts` job at the top of this file.
        if: always()
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kit-scripts-${{ github.run_attempt }}
          path: /tmp
      - name: Verify the kit scripts against their pinned digest
        # A DOWNLOADED SCRIPT NOBODY VERIFIED IS A SUPPLY CHAIN STEP WITH NO INTEGRITY
        # CHECK. Why this digest and not a manifest fetched beside it: `kit-scripts`.
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp
          echo "77747346d57de23c8a301758499db36f89f41e3850a2495497d2983a6cb3916a  kit-scripts.sha256" | sha256sum -c -
          sha256sum -c kit-scripts.sha256
      # END FETCH_KIT_SCRIPTS
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python_version }}
      - name: Bandit → SARIF
        id: bandit
        env:
          IN_PATHS: ${{ inputs.paths }}
        run: |
          set -uo pipefail
          # PINNED (ledger L84): the version tests/prove_bandit_enforces.py measured.
          python -m pip install --quiet "bandit[sarif]==1.9.4"
          scope="${IN_PATHS:-.}"; [ -d "$scope" ] || scope="."
          # THE EXIT CODE IS RECORDED, NOT SWALLOWED, AND IT DECIDES NOTHING ON ITS OWN. This ended
          # in a soft_fail_sast-conditional `|| true`, citing a count step that did not exist.
          # Measured, bandit 1.9.4: exit 1 on ANY finding (a LOW `import subprocess` is enough),
          # exit 0 when a file fails to parse. So the count step reads the report, not the code.
          rm -f bandit.sarif
          rc=0
          bandit -r "$scope" -f sarif -o bandit.sarif || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - name: Bandit — count findings
        id: bandit_count
        if: always()
        env:
          BANDIT_RC: ${{ steps.bandit.outputs.rc }}
        run: |
          set -uo pipefail
          cf() {
            echo "::error title=COLLECTION_FAILED::$1"
            echo "An absent, unreadable or unattempted report is not zero findings."
            echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
            exit 1
          }
          case "${BANDIT_RC:-}" in
            0|1) ;;
            *) cf "bandit exited '${BANDIT_RC:-unset}', which is neither a clean scan (0) nor findings (1)." ;;
          esac
          [ -s bandit.sarif ] || cf "bandit.sarif was not produced."
          # `results` absent or null means the tool did not attempt (SARIF 2.1.0 section 3.14.23).
          jq -e '(.runs | type == "array") and (.runs | length > 0) and all(.runs[]; (.results | type) == "array")' \
            bandit.sarif >/dev/null 2>&1 || cf "bandit.sarif is not SARIF with a results array."
          # THE EFFECTIVE LEVEL (SARIF section 3.27.10), the same reading the Semgrep count uses.
          # Measured: bandit writes `error` for HIGH, `note` for LOW, and NOTHING for MEDIUM, with
          # no rule default -- so MEDIUM is `warning`. HIGH blocks; the rest is reported.
          # VALIDITY ROWS 1-6, ON THE RUNNER, BEFORE PUBLICATION (ledger L02; PIPELINE_ORDERING 4.5):
          # results absent (did not attempt), no run, an error-level tool notification or
          # executionSuccessful false is COLLECTION_FAILED -- never a count of zero, and never
          # published as a clean scan. Per-tool profile, not a hollow-rules rule (KDEC-008 OD-2).
          if ! _v=$(python3 /tmp/sarif_validity.py --tool bandit bandit.sarif 2>&1); then
            echo "::error title=COLLECTION_FAILED::$_v"
            echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if ! n=$(jq '[.runs[] | ((.tool.driver.rules // []) | map({key: .id, value: (.defaultConfiguration.level // "warning")}) | from_entries) as $lv | .results[] | select((.level // $lv[.ruleId] // "warning") == "error")] | length' bandit.sarif 2>&1); then
            cf "bandit.sarif could not be counted: $n"
          fi
          echo "count=${n//[$'\r\n']/ }" >> "$GITHUB_OUTPUT"
          echo "bandit ERROR-level (HIGH) findings: $n of $(jq '[.runs[].results[]] | length' bandit.sarif)"
      - name: Bandit — enforce
        id: bandit_enforce
        if: always()
        env:
          N: ${{ steps.bandit_count.outputs.count }}
          COLLECTION: ${{ steps.bandit_count.outputs.collection }}
          SOFT_FAIL_SAST: ${{ inputs.soft_fail_sast }}
          ADVISORY_MODE: ${{ inputs.advisory_mode }}
        run: |
          if [ "${COLLECTION:-}" = "COLLECTION_FAILED" ] || [ -z "${N:-}" ]; then
            echo "::error title=COLLECTION_FAILED::No bandit count. An ABSENT measurement is not a measurement of zero."
            exit 1
          fi
          # Findings go to the gate (findings_state), which enforces by the resolved policy (O-24).
          if [ "$N" -gt 0 ] && [ "$SOFT_FAIL_SAST" != "true" ] && [ "$ADVISORY_MODE" != "true" ]; then
            echo "findings_state=FINDINGS" >> "$GITHUB_OUTPUT"
            echo "::warning title=Bandit::${N} HIGH-severity finding(s). ANALYSIS=COMPLETE -- handed to the security gate, which decides by the resolved policy."
            exit 0
          fi
          echo "ANALYSIS=COMPLETE GATE=PASS (${N} HIGH-severity finding(s), soft_fail=${SOFT_FAIL_SAST})"
      # Findings must survive whether or not this repo has code scanning. Uploading to the
      # Security tab is a PUBLICATION channel, not the finding itself — free on public repos,
      # otherwise Advanced Security. Treating it as mandatory turned successful scans into
      # failed jobs on every private repo without GHAS.
      - name: Bandit — is there anything to publish?
        if: always()
        id: sarif_bandit
        run: |
          # No SARIF usually means no applicable source (gosec on a repo with no Go). That is
          # a legitimate outcome, not a failure, and previously crashed the upload step.
          if [ -s "bandit.sarif" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Bandit: nothing to publish::No SARIF at 'bandit.sarif' — no applicable source files. Not a failure."
          fi
      # BEGIN REDACT_STEP — generated by scripts/inline_normalizer.py. DO NOT EDIT HERE.
      - name: Redact credential material before upload
        if: always()
        shell: bash
        run: |
          # ORDER IS THE WHOLE CONTROL: this runs immediately before an upload, and
          # again before every later upload that follows a step which may have written
          # output -- a redactor after the upload protects nothing while looking exactly
          # like protection (N24/WP19). The sweep itself is ONE canonical script --
          # scripts/redact_all.sh, written by the `kit-scripts` job and fetched into
          # /tmp by every other -- because fourteen copies of one wrapper are how this
          # file reached 608.8 KB and stopped starting.
          #
          # A MISSING TOOL IS NOT A CLEAN RESULT. If the bundle did not arrive,
          # publication must not proceed on the strength of a scrub that never ran.
          if [ ! -s /tmp/redact_all.sh ]; then
            echo "::error title=Redaction could not be guaranteed::/tmp/redact_all.sh is absent."
            echo "The kit-scripts artifact did not reach this job, so no SARIF was scrubbed"
            echo "and none may be published. A MISSING TOOL IS NOT A CLEAN RESULT."
            exit 1
          fi
          bash /tmp/redact_all.sh
      # END REDACT_STEP
      - name: Bandit — keep SARIF as an artifact
        if: always() && steps.sarif_bandit.outputs.exists == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-bandit-${{ github.run_attempt }}
          path: bandit.sarif
          retention-days: 30
          if-no-files-found: warn
      - name: Bandit — publish to the Security tab where available
        id: cs_bandit
        if: always() && steps.sarif_bandit.outputs.exists == 'true'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: bandit.sarif
          category: bandit
      - name: Bandit — state plainly if publication degraded
        if: always() && steps.sarif_bandit.outputs.exists == 'true' && steps.cs_bandit.outcome != 'success'
        run: |
          # Loud, never silent. An empty Security tab is indistinguishable from a clean
          # codebase, and that ambiguity is how a control becomes false assurance.
          echo "::warning title=Bandit: NOT published to the Security tab::Code scanning is"
          echo "unavailable here (free on public repos, otherwise GitHub Advanced Security)."
          echo "The scan SUCCEEDED and the gate still enforces on these findings."
          echo "Retrieve them from the 'sarif-bandit' artifact."

  # ─── CodeQL ─────────────────────────────────────────────────

      # BEGIN STATUS_STEP — generated by scripts/inline_normalizer.py. DO NOT EDIT HERE.
      - name: Result summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          # A SUMMARY IS NOT A VERDICT. If the script did not arrive, say so and stop;
          # never fail the job for it. A housekeeping step deciding a security verdict
          # is how a scan that had SUCCEEDED went red twice in this file's history.
          if [ ! -s /tmp/scan_status.sh ]; then
            echo "::warning title=Result summary unavailable::/tmp/scan_status.sh did not reach this job."
            echo "No per-job summary was printed. The scan's own verdict stands."
            exit 0
          fi
          . /tmp/scan_status.sh
          if [ "$JOB_STATUS" = "success" ]; then _e=COMPLETE; else _e=FAILED; fi
          scan_status "SAST (Bandit)" "$_e" "bandit.sarif" "python"
      # END STATUS_STEP

  codeql:
    needs: [discover, kit-scripts]
    # DISCOVERED, NOT DECLARED -- same rule as every other scanner here. Runs when roots for a
    # CodeQL-supported ecosystem were actually found, not because a selector named one.
    if: >-
      needs.discover.outputs.python == 'true' || needs.discover.outputs.node == 'true' ||
      needs.discover.outputs.go == 'true' || needs.discover.outputs.dotnet == 'true' ||
      needs.discover.outputs.java == 'true' || needs.discover.outputs.cpp == 'true' ||
      needs.discover.outputs.kotlin == 'true'
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    # Bounded, LM-001. CodeQL is the slowest scanner here; 30 is generous for a single language
    # and still stops a stalled build from billing for hours.
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - lang: python
            gate: ${{ needs.discover.outputs.python }}
          - lang: javascript-typescript
            gate: ${{ needs.discover.outputs.node }}
          - lang: go
            gate: ${{ needs.discover.outputs.go }}
          - lang: csharp
            gate: ${{ needs.discover.outputs.dotnet }}
          # Kotlin with no pom.xml or Gradle file starts this leg too (KDEC-026): it was gated on
          # the java probe alone, so Kotlin-only code never reached CodeQL.
          - lang: java-kotlin
            gate: ${{ (needs.discover.outputs.java == 'true' || needs.discover.outputs.kotlin == 'true') && 'true' || 'false' }}
          - lang: c-cpp
            gate: ${{ needs.discover.outputs.cpp }}
    steps:
      # BEGIN FETCH_KIT_SCRIPTS — generated by scripts/inline_normalizer.py. DO NOT EDIT HERE.
      - name: Fetch the kit's own scripts
        # A RUN-SCOPED ARTIFACT, NOT `uses: ./` and NOT a copy per call site. Why, at
        # length, in the `kit-scripts` job at the top of this file.
        if: always()
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kit-scripts-${{ github.run_attempt }}
          path: /tmp
      - name: Verify the kit scripts against their pinned digest
        # A DOWNLOADED SCRIPT NOBODY VERIFIED IS A SUPPLY CHAIN STEP WITH NO INTEGRITY
        # CHECK. Why this digest and not a manifest fetched beside it: `kit-scripts`.
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp
          echo "77747346d57de23c8a301758499db36f89f41e3850a2495497d2983a6cb3916a  kit-scripts.sha256" | sha256sum -c -
          sha256sum -c kit-scripts.sha256
      # END FETCH_KIT_SCRIPTS
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: matrix.gate == 'true'

      # CodeQL requires GitHub Advanced Security on private repositories. It is free on public
      # ones. Attempting and reporting the outcome is the only way to establish which applies --
      # there is no pre-flight that answers it reliably from inside a job.
      - name: CodeQL — initialise
        id: cq_init
        if: matrix.gate == 'true'
        continue-on-error: true
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.lang }}
          # Without this, CodeQL runs its built-in `code-scanning` suite -- curated for
          # precision, and missing taint-tracking queries an assurance kit wants. The kit
          # reported "CodeQL ran" and a reader had no way to know WHICH queries ran.
          queries: ${{ inputs.codeql_queries }}

      - name: CodeQL — build
        id: cq_build
        if: matrix.gate == 'true' && steps.cq_init.outcome == 'success'
        continue-on-error: true
        uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

      - name: CodeQL — analyse
        id: cq_analyze
        if: matrix.gate == 'true' && steps.cq_init.outcome == 'success'
        continue-on-error: true
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.lang }}"
          # NEVER, AND PUBLISHED BELOW AFTER REDACTION. `upload: always` sent the SARIF to the
          # Security tab from inside this step -- before any redactor in this job had run, so
          # credential material in a result's snippet was published raw (N24/WP19). analyze now
          # only WRITES codeql-results; the redaction step scrubs it, and an explicit upload-sarif
          # publishes what was scrubbed.
          upload: never
          output: codeql-results

      # COUNTED AND VALIDATED BEFORE IT IS PUBLISHED (ledger L02; flagship lane report row 10).
      # analyze writes codeql-results/<language>.sarif and the directory went straight to
      # upload-sarif: a leg whose extractor produced a document with no results array, or a
      # failed invocation, was published as a clean analysis. Every SARIF in the directory is
      # held to validity rows 1-6 here, and the state step below reads this step's collection.
      - name: CodeQL — count findings
        id: cq_count
        if: always() && matrix.gate == 'true' && steps.cq_analyze.outcome == 'success'
        env:
          RESULTS_DIR: codeql-results
        run: |
          set -uo pipefail
          cf() {
            echo "::error title=COLLECTION_FAILED::$1 An absent or unreadable report is not zero findings."
            echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
            exit 1
          }
          files=""
          for f in "$RESULTS_DIR"/*.sarif; do
            [ -s "$f" ] && files="$files $f"
          done
          [ -n "$files" ] || cf "analyze succeeded and wrote no SARIF under $RESULTS_DIR/."
          # VALIDITY ROWS 1-6, ON THE RUNNER, BEFORE PUBLICATION (ledger L02; PIPELINE_ORDERING 4.5):
          # results absent (did not attempt), no run, an error-level tool notification or
          # executionSuccessful false is COLLECTION_FAILED -- never a count of zero, and never
          # published as a clean scan. Per-tool profile, not a hollow-rules rule (KDEC-008 OD-2).
          # shellcheck disable=SC2086
          if ! _v=$(python3 /tmp/sarif_validity.py --tool codeql $files 2>&1); then
            echo "::error title=COLLECTION_FAILED::$_v"
            echo "collection=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          n=0
          for f in $files; do
            if ! k=$(jq '[.runs[].results[]] | length' "$f" 2>&1); then
              cf "$f could not be counted: $k"
            fi
            n=$((n + k))
          done
          echo "collection=COMPLETE" >> "$GITHUB_OUTPUT"
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "CodeQL results: $n across$files"

      # BEGIN REDACT_STEP — generated by scripts/inline_normalizer.py. DO NOT EDIT HERE.
      - name: Redact credential material before upload
        if: always()
        shell: bash
        run: |
          # ORDER IS THE WHOLE CONTROL: this runs immediately before an upload, and
          # again before every later upload that follows a step which may have written
          # output -- a redactor after the upload protects nothing while looking exactly
          # like protection (N24/WP19). The sweep itself is ONE canonical script --
          # scripts/redact_all.sh, written by the `kit-scripts` job and fetched into
          # /tmp by every other -- because fourteen copies of one wrapper are how this
          # file reached 608.8 KB and stopped starting.
          #
          # A MISSING TOOL IS NOT A CLEAN RESULT. If the bundle did not arrive,
          # publication must not proceed on the strength of a scrub that never ran.
          if [ ! -s /tmp/redact_all.sh ]; then
            echo "::error title=Redaction could not be guaranteed::/tmp/redact_all.sh is absent."
            echo "The kit-scripts artifact did not reach this job, so no SARIF was scrubbed"
            echo "and none may be published. A MISSING TOOL IS NOT A CLEAN RESULT."
            exit 1
          fi
          bash /tmp/redact_all.sh
      # END REDACT_STEP
      - name: CodeQL — keep SARIF as an artifact
        if: always() && matrix.gate == 'true' && steps.cq_analyze.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-codeql-${{ matrix.lang }}-${{ github.run_attempt }}
          path: codeql-results
          retention-days: 30
          if-no-files-found: warn
      - name: CodeQL — publish to the Security tab where available
        id: cs_codeql
        if: always() && matrix.gate == 'true' && steps.cq_analyze.outcome == 'success'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: codeql-results
          category: "/language:${{ matrix.lang }}"
      - name: CodeQL — state plainly if publication degraded
        if: always() && matrix.gate == 'true' && steps.cq_analyze.outcome == 'success' && steps.cs_codeql.outcome != 'success'
        run: |
          # Loud, never silent. An empty Security tab is indistinguishable from a clean
          # codebase, and that ambiguity is how a control becomes false assurance.
          echo "::warning title=CodeQL: NOT published to the Security tab::The analysis SUCCEEDED."
          echo "Its redacted results are in the sarif-codeql-${{ matrix.lang }} artifact."

      # The state this job reports is the whole point. A scanner that did not run must not be
      # indistinguishable from a scanner that ran and found nothing.
      - name: CodeQL — declare state
        id: cq_state
        if: always() && matrix.gate == 'true'
        env:
          # CALLER INPUT ARRIVES AS DATA, NEVER AS SCRIPT TEXT (ledger L38).
          IN_CODEQL_QUERIES: ${{ inputs.codeql_queries }}
          # What the count step established about the SARIF analyze wrote (validity rows 1-6).
          CQ_COLLECTION: ${{ steps.cq_count.outputs.collection }}
          # The autobuild step's own outcome. It is continue-on-error, and until 2026-10-16 its
          # outcome was read nowhere (PIPELINE_ORDERING 3.5): a build that compiled some modules
          # and failed on others left a partial database, an analysis that succeeded, and COMPLETE.
          CQ_BUILD: ${{ steps.cq_build.outcome }}
        run: |
          if [ "${{ steps.cq_init.outcome }}" != "success" ]; then
            # Almost always: GHAS is not enabled on this private repository.
            echo "state=UNAVAILABLE" >> "$GITHUB_OUTPUT"
            echo "reason=CodeQL could not initialise. On a private repository this means GitHub" >> "$GITHUB_OUTPUT"
            echo "::warning title=CodeQL: UNAVAILABLE::CodeQL did NOT run for ${{ matrix.lang }}."
            echo "On a private repository this normally means GitHub Advanced Security is not"
            echo "enabled. The build is NOT failed for that -- but this is unestablished scope,"
            echo "not a clean result. Nothing here proves the absence of what CodeQL would find."
          elif [ "${{ steps.cq_analyze.outcome }}" != "success" ]; then
            echo "state=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
            echo "::warning title=CodeQL: COLLECTION_FAILED::CodeQL initialised for ${{ matrix.lang }}"
            echo "but analysis did not complete. Treat as unestablished, not as zero findings."
          elif [ "${CQ_COLLECTION:-}" != "COMPLETE" ]; then
            # analyze completed and the document it wrote records no run, no results array or a
            # failed invocation -- a hollow report, which is not an analysis of anything.
            echo "state=COLLECTION_FAILED" >> "$GITHUB_OUTPUT"
            echo "::warning title=CodeQL: COLLECTION_FAILED::CodeQL analysed ${{ matrix.lang }} but"
            echo "its SARIF failed validity rows 1-6 (collection '${CQ_COLLECTION:-none}'). Unestablished, not zero."
          elif [ "${CQ_BUILD:-NOT_RUN}" != "success" ]; then
            # The database holds what the build produced. A build that did not succeed may have
            # compiled part of the code, so the analysis covers an unknown part of it: PARTIAL,
            # never COMPLETE (scanner_state.PARTIAL: established for some of the scope).
            echo "state=PARTIAL" >> "$GITHUB_OUTPUT"
            echo "::warning title=CodeQL: PARTIAL::CodeQL analysed ${{ matrix.lang }}, but its autobuild"
            echo "step did not succeed (outcome '${CQ_BUILD:-none}'). Code the build did not compile is"
            echo "not in the database; zero findings here does not cover it."
          else
            echo "state=COMPLETE" >> "$GITHUB_OUTPUT"
            echo "::notice title=CodeQL: analysed ${{ matrix.lang }}::Results are in the Security tab"
            echo "and in the sarif-codeql-${{ matrix.lang }} artifact."
          fi
          # WHICH QUERIES RAN IS PART OF THE RESULT. "CodeQL: 0 findings" means something
          # different under the precision-tuned default suite than under security-extended,
          # and a reader who cannot see which one ran cannot tell those apart.
          {
            echo ""
            echo "### CodeQL — ${{ matrix.lang }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Query suite | \`${IN_CODEQL_QUERIES}\` |"
            echo "| Taint tracking | included in security-extended and security-and-quality |"
            echo "| State | ${state:-see above} |"
            echo ""
            echo "A finding count is only meaningful alongside the suite that produced it."
          } >> "$GITHUB_STEP_SUMMARY"

  deps-scan:
    needs: [discover, kit-scripts]
    # Ecosystem-agnostic: every repository can leak a secret and resolve a dependency.
    # Gated only by discovery being able to run at all.
    if: always()
    name: Dependency scan (Trivy fs)
    runs-on: ubuntu-latest
    outputs:
      # FINDINGS when this job's own threshold fired and no caller input softened it; '' otherwise.
      # The job does not fail on it: the security gate enforces it by the resolved policy (O-24).
      findings_state: ${{ steps.scan.outputs.findings_state }}
      # Files a pipeline linter could not read (VERSION_GAP), for the report (lane L-SCAN-A).
      lint_version_gaps: ${{ steps.scan.outputs.lint_version_gaps }}
    # Bounded so a stalled dependency cannot bill six hours (LM-001: unbounded execution
    # converts a dependency failure into uncontrolled cost).
    # NOT YET: a timeout still surfaces as a plain job failure. It SHOULD classify as
    # UNAVAILABLE / EXECUTION_TIMEOUT — cost is bounded here, semantics are not. See
    # docs/roadmap/FUTURE_WORK.md. Do not let this comment imply the mapping exists.
    timeout-minutes: 20
    steps:
      # THE STEP BODIES RUN FROM THE KIT, NOT FROM THIS FILE (ledger L64; decomposition step 12).
      # `$/` delivers the whole kit at the caller's pinned commit. The composite is this job's
      # FIRST step and carries every step in its old order, so every artefact name, annotation
      # and SARIF category is what it was inline (tests/prove_composite_move_equivalence.py).
      # The Result summary stays here: it reads `job.status`, the job's fact.
      - name: Dependency scan (Trivy fs)
        id: scan
        uses: $/.github/actions/deps-scan
        with:
          advisory_mode: ${{ inputs.advisory_mode }}
          fail_on_severity: ${{ inputs.fail_on_severity }}
          paths: ${{ inputs.paths }}
          # Pipeline lint rides in this always-on job (lane L-SCAN-A, KDEC-025): a job of its own
          # would bill a minimum minute on nearly every consumer, since nearly every one has a
          # workflow. Each linter runs only where discovery found its files.
          workflows: ${{ needs.discover.outputs.workflows }}
          shell: ${{ needs.discover.outputs.shell }}
          powershell: ${{ needs.discover.outputs.powershell }}
  # ─── IaC ────────────────────────────────────────────────────

      # BEGIN STATUS_STEP — generated by scripts/inline_normalizer.py. DO NOT EDIT HERE.
      - name: Result summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          # A SUMMARY IS NOT A VERDICT. If the script did not arrive, say so and stop;
          # never fail the job for it. A housekeeping step deciding a security verdict
          # is how a scan that had SUCCEEDED went red twice in this file's history.
          if [ ! -s /tmp/scan_status.sh ]; then
            echo "::warning title=Result summary unavailable::/tmp/scan_status.sh did not reach this job."
            echo "No per-job summary was printed. The scan's own verdict stands."
            exit 0
          fi
          . /tmp/scan_status.sh
          if [ "$JOB_STATUS" = "success" ]; then _e=COMPLETE; else _e=FAILED; fi
          scan_status "Dependencies" "$_e" "trivy-deps.sarif" "dependencies + CVE feeds"
      # END STATUS_STEP

