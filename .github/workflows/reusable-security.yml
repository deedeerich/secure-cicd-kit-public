        with:
          name: sarif-bandit-${{ github.run_attempt }}
          path: bandit.sarif
          retention-days: 30
          if-no-files-found: warn
      - name: Bandit — publish to the Security tab where available
        id: cs_bandit
        if: always() && steps.sarif_bandit.outputs.exists == 'true'
