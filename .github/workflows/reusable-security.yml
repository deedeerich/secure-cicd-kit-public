name: "Kit: Security Suite"
# Employer-neutral umbrella security workflow. Runs secret, code-quality, SAST, dependency,
# and IaC scans as parallel jobs. Uploads SARIF to GitHub code scanning where supported.
# Zero cloud dependencies — a calling repo needs only to grant permissions and (optionally)
# provide a Semgrep token. Reference via workflow_call.

on:
  workflow_call:
    inputs:
      language:
        description: >-
          auto (default) | multi | a list of python node dotnet java go cpp iac (aliases js/ts,
          py, c#, c++, tf). `auto` scans every ecosystem discovery FINDS; `multi` is its synonym.
          A list can only EXCLUDE ecosystems discovery found, never invent one, and the posture
          record reports that narrowing. The default was `python` until KDEC-008 OD-7: a caller
          who changed nothing got a Python-only selector and a weakening on the record.
        type: string
        required: false
        default: "auto"
      paths:
        description: "Path to scan (repo-relative). Narrows every scanner EXCEPT the secret scan, which always covers the repository root (crawl is the floor, KDEC-018)."
        type: string
        required: false
        default: "."
      iac_mode:
        description: >-
          auto     - discover Terraform/Bicep/ARM/Kubernetes/Helm/Dockerfiles in scope and scan what
                     is found. NOT_APPLICABLE then means "we looked and there is none", with evidence.
          disabled - deliberately skip IaC. Reported loudly. An exception, never a default.
          required - absence is itself a finding, because this repo is declared to contain IaC.
          Replaces `enable_iac`, whose false-by-default meant Terraform sitting in plain sight was
          nobody's business until somebody remembered a toggle.
        type: string
        required: false
        default: auto
      enable_iac:
        description: >-
          DEPRECATED AND IGNORED. Superseded by `iac_mode`; nothing reads this value.

          It was left declared after `iac_mode` replaced it, so a caller could pass
          `enable_iac: true`, see it accepted, and get no IaC scanning — which is exactly what
          happened on the first live run of this kit. A declared input nothing consumes is worse
          than an absent one: an absent input fails loudly at the call site, while a dead one
          reads as configuration and silently means nothing.

          Kept only so existing callers do not break. It is reported as ignored at run time,
          and it will be removed. Use `iac_mode` instead.
        type: boolean
        required: false
        default: false
      codeql_queries:
        description: >-
          CodeQL query suite. Defaults to `security-extended` rather than the built-in default.

          PRECISION VERSUS RECALL, NOT PRESENCE VERSUS ABSENCE.

            default               high-precision security baseline. Taint tracking IS included.
            security-extended     the default suite PLUS additional queries that trade precision
                                  for broader coverage -- lower severity and lower confidence
                                  included, so more recall and more to triage.
            security-and-quality  security-extended plus maintainability and reliability.

          An earlier version of this comment said the default suite "omits taint-tracking
          queries". That was wrong and is corrected here rather than quietly deleted: the
          default runs dataflow analysis, and what `security-extended` adds is breadth. Choosing
          it is a recall decision, not the difference between having dataflow and not.

          WHAT REMAINS TRUE is the distinction between pattern matching and dataflow. A pattern
          scanner finds `dangerouslySetInnerHTML` because the NAME is there; taint tracking
          answers whether attacker-controlled input REACHES it through three components and a
          helper. Both belong in a pipeline -- semgrep for the sink, CodeQL for the flow.

          `security-and-quality` adds maintainability queries on top; use it when the noise is
          affordable. `default` restores the built-in suite and should be a deliberate choice,
          recorded as one.
        type: string
        default: security-extended
      license_deny:
        description: >-
          Comma-separated licence identifiers that must not appear, e.g. `GPL-3.0,AGPL-3.0`.
          Empty denies nothing and reports the inventory only.

          POLICY BELONGS TO THE CONSUMER. The kit reads what the SBOM says; which licences are
          acceptable is a legal and commercial decision that no scanner can make. Components
          with NO declared licence are reported separately either way -- that is unestablished,
          not permissive-by-default, and an unlicensed dependency is usually the more
          restrictive case.
        type: string
        default: ""
      image_ref:
        description: >-
          Container image to scan, e.g. `myregistry.azurecr.io/app@sha256:...`. Empty skips it
          and the report says NOT_APPLICABLE, never a clean result.

          SCANNING THE SOURCE IS NOT SCANNING THE IMAGE. The filesystem scan sees declared
          dependencies; the image carries a base OS, its packages, anything a Dockerfile
          installed, and whatever the build pulled in. A repository can be clean while the image
          it produces ships a vulnerable libc.

          PREFER A DIGEST OVER A TAG. A tag is a moving pointer -- scanning `:latest` proves
          something about whatever `:latest` meant at that moment and cannot be reproduced. A
          digest is the artifact, and it is what deployment provenance and later revalidation
          have to match against.
        type: string
        default: ""
      semgrep_config:
        description: "Semgrep rulesets"
        type: string
        required: false
        # p/xss added 2026-09-14. OWASP Top Ten covers the category; the dedicated ruleset
        # carries the framework-specific sinks -- dangerouslySetInnerHTML, javascript: URLs in
        # href/src, innerHTML through a ref, and the prop spread that can smuggle in an unsafe
        # key.
        #
        # SEMGREP FINDS THE SINK; CODEQL FOLLOWS THE FLOW. Pattern matching says the dangerous
        # call is present. Only taint tracking says attacker-controlled input REACHES it.
        # Both, or the answer is half of one.
        default: "p/default p/owasp-top-ten p/xss"
      fail_on_severity:
        description: "Trivy/dependency severities that FAIL the build"
        type: string
        required: false
        default: "CRITICAL,HIGH"
      python_version:
        description: "Python version for python/multi scans"
        type: string
        required: false
        default: "3.12"
      node_version:
        description: "Node version for node/multi scans"
        type: string
        required: false
        default: "20"
      enable_sbom:
        description: "Generate a CycloneDX SBOM and attach it as an artifact."
        type: boolean
        required: false
        default: true
      enable_malicious_pkg_scan:
        description: "Scan for KNOWN-MALICIOUS / compromised packages via OSV (MAL- advisories), not just CVEs. Part of the crawl floor (KDEC-020): false is refused, CHERRY_PICK_BELOW_FLOOR."
        type: boolean
        required: false
        default: true
      dotnet_version:
        description: "SDK version for dotnet/multi scans."
        type: string
        required: false
        default: "8.0.x"
      go_version:
        description: "Go version for go/multi scans."
        type: string
        required: false
        default: "1.22"
      java_version:
        description: "JDK version for java/multi scans."
        type: string
        required: false
        default: "17"
      advisory_mode:
        description: >-
          Report everything, block nothing. For establishing a baseline on a repository that has
          never been scanned this way.

          Dropping a hard gate onto an unknown backlog freezes development and gets the control
          bypassed, which costs more coverage than it buys. Detection immediately, enforcement
          deliberately. This is adoption sequencing — it is NOT softened security, because
          nothing is disabled, scoped away or hidden: every scanner still runs and every finding
          is still reported and persisted.

          It is reported loudly on every job and in the gate for exactly one reason: a silent
          permanent advisory mode is indistinguishable from having no gate at all.
        type: boolean
        required: false
        default: false
      enforce_lint:
        description: >-
          Fail the build on ruff lint findings. Default false, deliberately: `ruff check` used to
          hard-fail while `mypy` was advisory, so a consumer adopting this SECURITY workflow was
          blocked on code STYLE on day one. Lint quality is worth having and is not a security
          control; enforce it when the team has chosen to.
        type: boolean
        required: false
        default: false
      scan_git_history:
        description: >-
          Also scan full git HISTORY for secrets. Default false, deliberately: history scanning
          ignores `paths` and walks every commit in the repository, so a monorepo consumer asking
          to scan one service would get everything anyone ever committed. Slow, and repo-wide.
        type: boolean
        required: false
        default: false
      soft_fail_sast:
        description: >-
          If true, SAST findings report (SARIF) but do not fail the build. Default false
          (KDEC-008 OD-7): the shipped default is the baseline, so a caller who changes nothing
          gets enforced SAST and PROCEED on a clean run. Setting it true is a GATE_SOFTENED
          weakening, recorded in the posture record; attribute it with weakening_reason and
          weakening_authority.
        type: boolean
        required: false
        default: false
      # ── GOVERNANCE OF WEAKENINGS ────────────────────────────────────────────────────────
      # A WEAKENING IS A GOVERNED EXCEPTION, NOT A BOOLEAN PREFERENCE. Optional, so no caller
      # breaks; a caller who supplies none gets identical scanning PLUS a record saying the
      # weakening in force is unattributed -- which is the truth and was previously invisible.
      weakening_reason:
        description: >-
          Why a control on this invocation is weaker than baseline. Free text. Empty means the
          record says WEAKENING_UNATTRIBUTED and routing_result becomes DECISION_REQUIRED --
          not a failure, and not a pass: a decision nobody has made yet.
        type: string
        required: false
        default: ""
      weakening_authority:
        description: >-
          WHO decided. A role, a team, a named approver. A reason without an authority is an
          explanation, not a decision, and both are required before a weakening is attributed.
        type: string
        required: false
        default: ""
      weakening_exception_ref:
        description: >-
          Where the exception or deferral is recorded -- a ticket, a disposition id, a register
          entry. Reported when present, and its ABSENCE is reported too.
        type: string
        required: false
        default: ""
      weakening_expires:
        description: >-
          ISO date (YYYY-MM-DD) on which the weakening lapses. Empty means no expiry was set,
          which is reported. A past date routes to DECISION_REQUIRED -- silence never renews a
          weakening.
        type: string
        required: false
        default: ""
      environment:
        description: >-
          The (repository, environment) cell the baseline ledger is keyed by -- `prod`, `staging`,
          whatever the consumer calls it. NO ENVIRONMENT IS NAMED BY DEFAULT, deliberately: a
          finding can only be grandfathered into an environment it was present in (ETFB section
          8.8 rule 4), so an unnamed environment makes the identity claim EVIDENCE_UNTRUSTED and
          grandfathers nothing. It never changes what blocks. The empty string is the declared
          absence, not a value.
        type: string
        required: false
        default: ""
      target_environment:
        description: >-
          The environment this run is evaluated for under the policy register (a tier name, or a
          name the register maps to one). Empty for a pull request or a post-merge push: the run is
          then evaluated at the tier a merge reaches without a human gate (prod when the register
          declares none). A pull request is always evaluated there. It selects a register cell, and
          never a weaker one than a merge already reaches; no rung or policy_mode input exists.
        type: string
        required: false
        default: ""
      test_only_seed_artifact:
        description: >-
          TEST-ONLY. Empty (the default) changes nothing and is read by nothing. When set, it
          names a run artifact of THIS run whose files are ADDED to the scanned tree before the
          secret scan, so the kit's own consumer-path test can deliver its generated,
          never-committed credential seeds (KDEC-011) and prove them detected end to end. It can
          only add: nothing is removed, excluded or narrowed; every added file is scanned by the
          same rules; an existing file is never overwritten; hidden files and scanner
          configuration are refused; a name outside [A-Za-z0-9._-] or an entry that would leave
          the scanned tree fails the job before anything is scanned. A consumer has no reason to
          set it, and the job says loudly when it is in force.
        type: string
        required: false
        default: ""
    outputs:
      # THE CONTRACT A CONSUMER BINDS TO.
      #
      # Without these a caller sees only red or green, and cannot distinguish "clean" from "we
      # could not determine" from "advisory mode suppressed it". That is the exact collapse this
      # kit exists to prevent, reappearing at the seam where other people integrate with us.
      # Every value here is a term from assurance-taxonomy.yaml -- consumers get the vocabulary,
      # not a boolean.
      assurance_state:
        description: >-
          PASS | FINDINGS | PARTIAL | UNDETERMINED — what this run ESTABLISHED about the code.
          Deliberately separate from what the gate DID about it: a run can establish FINDINGS while
          enforcement is ADVISORY, and UNDETERMINED is never PASS.
        value: ${{ jobs.security-gate.outputs.assurance_state }}
      enforcement_state:
        description: >-
          BLOCKED | ALLOWED | ADVISORY — what the gate did. ADVISORY means findings existed and were
          not blocked; it is not a clean result.
        value: ${{ jobs.security-gate.outputs.enforcement_state }}
      gate_decision:
        description: "DEPRECATED alias of enforcement_state, kept so no consumer breaks. Prefer the pair above."
        value: ${{ jobs.security-gate.outputs.gate_decision }}
      secret_gate:
        description: >-
          PASS | EXCEPTED | FAIL — EXCEPTED means every secret found is excepted by a ticketed register entry (never PASS); evaluated SEPARATELY and never suppressed by advisory_mode. A consumer that
          only checks gate_decision would miss that secrets are enforced unconditionally.
        value: ${{ jobs.security-gate.outputs.secret_gate }}
      kev_state:
        description: >-
          AVAILABLE | UNAVAILABLE — whether the CISA Known Exploited Vulnerabilities catalog was read
          this run (KDEC-022). UNAVAILABLE is never a pass: the run routes PROCEED_WITH_ADVISORY (KEV_UNAVAILABLE).
        value: ${{ jobs.security-gate.outputs.kev_state }}
      kev_verdict:
        description: >-
          BLOCKED | EXCEPTED | CLEAR | UNAVAILABLE — a dependency or image CVE on the KEV catalog blocks at
          every rung (FINDING_KNOWN_EXPLOITED) unless a ticketed register exception excepts that finding.
        value: ${{ jobs.security-gate.outputs.kev_verdict }}
      scanner_states:
        description: >-
          Compact JSON map of scanner -> state, using scanner_state vocabulary
          (PASS/FINDINGS/PARTIAL/NOT_APPLICABLE/FAILED/UNAVAILABLE/COLLECTION_FAILED).
          PARTIAL and NOT_APPLICABLE are DIFFERENT and must not be merged downstream.
        value: ${{ jobs.security-gate.outputs.scanner_states }}
      undetermined:
        description: >-
          true when ANY scanner reported UNAVAILABLE or COLLECTION_FAILED — i.e. posture could not
          be established. A consumer must not read `gate_decision != FAIL` as "safe" while this is
          true. Absence of a block is not evidence of absence of risk.
        value: ${{ jobs.security-gate.outputs.undetermined }}
      evidence_artifact:
        description: "Name of the run artifact holding the persisted SARIF/evidence."
        value: ${{ jobs.security-gate.outputs.evidence_artifact }}
      established:
        description: >-
          Capabilities that DID establish a result, with their states. Degradation elsewhere does
          not erase these -- a failed scanner does not un-find another scanner's finding.
        value: ${{ jobs.security-gate.outputs.established }}
      unestablished:
        description: >-
          Capabilities that could NOT establish a result, with the reason. These stay unknown until
          new evidence resolves them. A consumer may not default them away, and no downstream stage
          may convert them into a successful state without new collection.
        value: ${{ jobs.security-gate.outputs.unestablished }}
      discovery_state:
        description: >-
          COMPLETE | DISCOVERY_PARTIAL | DISCOVERY_UNAVAILABLE — whether applicability could be
          established at all. A consumer seeing DISCOVERY_UNAVAILABLE must not treat any
          NOT_APPLICABLE in scanner_states as evidence of absence.
        value: ${{ jobs.security-gate.outputs.discovery_state }}
      routing_result:
        description: "PROCEED | PROCEED_WITH_ADVISORY | DECISION_REQUIRED | BLOCKED | EVIDENCE_UNTRUSTED. What should happen next. Deployment reads THIS, never a job conclusion."
        value: ${{ jobs.security-gate.outputs.routing_result }}
      advisory_causes:
        description: >-
          Comma list, set only when routing_result is PROCEED_WITH_ADVISORY: VERSION_GAP |
          VERSION_GAP_UNVERIFIED | COVERAGE_PARTIAL | WEAKENING_ATTRIBUTED | FINDINGS_NOT_BLOCKED |
          SECRET_EXCEPTION_ATTRIBUTED | KNOWN_EXPLOITED_EXCEPTION_ATTRIBUTED | KEV_UNAVAILABLE
          (assurance-taxonomy.yaml advisory_cause). Pass it to the deploy reusables beside
          routing_result: at uat and prod they refuse a VERSION_GAP without an attributed
          exception, and record a VERSION_GAP_UNVERIFIED prominently (KDEC-014).
        value: ${{ jobs.security-gate.outputs.advisory_causes }}
      controls_required:
        description: "Comma list of the controls this invocation should have run."
        value: ${{ jobs.security-gate.outputs.controls_required }}
      controls_executed:
        description: "Comma list of the controls that ran. Never includes a skipped one."
        value: ${{ jobs.security-gate.outputs.controls_executed }}
      controls_unavailable:
        description: "Controls that could not establish a result. NOT the same as clean."
        value: ${{ jobs.security-gate.outputs.controls_unavailable }}
      controls_reduced:
        description: "Controls that ran with enforcement softened, severity raised, scope narrowed or depth reduced."
        value: ${{ jobs.security-gate.outputs.controls_reduced }}
      controls_skipped:
        description: "Controls that were not run at all."
        value: ${{ jobs.security-gate.outputs.controls_skipped }}
      weakenings:
        description: "JSON array, one object per input that governs a control: input, class, control, baseline, value and state."
        value: ${{ jobs.security-gate.outputs.weakenings }}
      weakening_attribution:
        description: "WEAKENING_AT_BASELINE | WEAKENING_ATTRIBUTED | WEAKENING_UNATTRIBUTED | WEAKENING_EXCEPTION_EXPIRED."
        value: ${{ jobs.security-gate.outputs.weakening_attribution }}
      weakening_record:
        description: "Reason, authority, exception reference and expiry as one JSON object."
        value: ${{ jobs.security-gate.outputs.weakening_record }}
      # THE POLICY THE VERDICT WAS REACHED UNDER (stage 1; scripts/policy_registration.py).
      policy_resolution:
        description: "POLICY_RESOLVED, or the refusal by name (assurance-taxonomy.yaml policy_resolution)."
        value: ${{ jobs.security-gate.outputs.policy_resolution }}
      policy_source:
        description: "KIT_DEFAULT (crawl: only secrets block) or REGISTER."
        value: ${{ jobs.security-gate.outputs.policy_source }}
      policy_chain:
        description: "The register entry ids applied, least specific first."
        value: ${{ jobs.security-gate.outputs.policy_chain }}
      rung_declared:
        description: "crawl | walk | run as registered for the evaluated tier."
        value: ${{ jobs.security-gate.outputs.rung_declared }}
      rung_effective:
        description: "The rung the gate obeyed."
        value: ${{ jobs.security-gate.outputs.rung_effective }}
      rung_divergence:
        description: "Empty when declared and effective agree."
        value: ${{ jobs.security-gate.outputs.rung_divergence }}
      policy_mode:
        description: "adoption | strict, DERIVED from the rung, never supplied."
        value: ${{ jobs.security-gate.outputs.policy_mode }}
      effective_minimum:
        description: "JSON: the weakest routing_result each control class may contribute."
        value: ${{ jobs.security-gate.outputs.effective_minimum }}
      policy_divergences:
        description: "JSON: every control whose minimum differs from the rung's floor."
        value: ${{ jobs.security-gate.outputs.policy_divergences }}
      environment_tier:
        description: "The tier this run was evaluated at."
        value: ${{ jobs.security-gate.outputs.environment_tier }}
      team_pattern:
        description: "solo_dev | pair_devs | small_team | full_team, or empty when unregistered."
        value: ${{ jobs.security-gate.outputs.team_pattern }}
      unvalidated_human_workflow_paths:
        description: "Human controls this team pattern cannot demonstrate -- reported, never passing."
        value: ${{ jobs.security-gate.outputs.unvalidated_human_workflow_paths }}
      deploy_approval:
        description: >-
          JSON per tier: approver_groups, approvers_required, self_review_prevented, ai_review.
          Pass it to the deploy reusables: at uat and prod they read the GitHub environment's
          protection rules and refuse a deploy the policy demands reviewers for and the
          environment does not have.
        value: ${{ jobs.security-gate.outputs.deploy_approval }}
      max_exception_renewals:
        description: >-
          The authority's exception renewal cap (KDEC-018; numbers.max_exception_renewals, kit
          default 2). Pass it to the deploy reusables' max_exception_renewals: a version-gap
          exception renewed more often is refused (EXCEPTION_RENEWAL_LIMIT).
        value: ${{ jobs.security-gate.outputs.max_exception_renewals }}
      assurance_result:
        description: >-
          The run record as compact JSON, valid against schemas/assurance-result.schema.json
          (ledger L36). Empty when it did not validate -- then run_record is invalid.
        value: ${{ jobs.security-gate.outputs.assurance_result }}
      run_record:
        description: "valid | invalid: whether the run record validated and was emitted."
        value: ${{ jobs.security-gate.outputs.run_record }}
    secrets:
      SEMGREP_APP_TOKEN:
        description: "Optional Semgrep managed-rules/dashboard token"
        required: false

permissions:
  contents: read
  security-events: write   # upload SARIF to code scanning

jobs:
  # ─── THE KIT'S OWN SCRIPTS, MATERIALISED ONCE ───────────────────────
  # A reusable workflow runs against the CALLER's checkout, so `uses: ./` and anything under
  # scripts/ does not exist at consumer runtime. The kit learned that the expensive way: 14
  # Azure/Entra gitleaks rules that silently never loaded while its own CI stayed green.
  #
  # THE FIRST ANSWER WAS TO INLINE EACH SCRIPT AT EVERY CALL SITE, AND THAT ANSWER KILLED THIS
  # WORKFLOW. Thirteen byte-identical copies of redact_sarif.py, twelve of scan_status.sh and
  # three of normalize_sarif.py took the file to 608.8 KB. GitHub does not FAIL a workflow over
  # 500 KB -- it never STARTS it. Zero jobs, a startup failure on every push, for six days, while
  # every check in this repository reported green, because they all READ the file and none of
  # them RAN it.
  #
  # Duplication was never the requirement. REACHABILITY was. The scripts are written out ONCE
  # here and published as a RUN-SCOPED ARTIFACT that every other job downloads into /tmp, which
  # is the path every call site already invoked. An artifact belongs to the RUN, not to a
  # repository, so a cross-repo consumer's runner receives exactly what this repository's runner
  # receives -- the property `uses: ./` never had.
  #
  # `$/` IS NOW USED, AND THIS ARTIFACT IS ITS PREDECESSOR. This paragraph used to say `$/` was
  # not used because its cross-repository resolution was unestablished. It was then proven from a
  # genuinely separate repository (decomposition plan step 8; Level 2 runs 38434823833,
  # 38468728084), and discover, resolve, the report and the scanner composites run through it
  # (ledger L64). It needs github.com and runner >= 2.336.0 -- no GitHub Enterprise Server, an
  # open owner decision (OD-8, ledger O-22). This job stays only while job bodies still call
  # /tmp/<script>; it is deleted when the last of them has moved (ledger L64, B-01).
  #
  # FAILURE HERE IS NOT SILENT. Every consuming job `needs` this one, so a failure would skip
  # them -- and a row of skipped scanners reads as NOT_APPLICABLE, which is the collapse this kit
  # exists to prevent. `security-gate` therefore reads this job's result explicitly and reports
  # UNDETERMINED, exactly as it does for `report`.
  kit-scripts:
    name: Materialise the kit's own scripts
    runs-on: ubuntu-latest
    # Bounded so a stalled dependency cannot bill six hours (LM-001: unbounded execution
    # converts a dependency failure into uncontrolled cost).
    timeout-minutes: 10
    # LEAST PRIVILEGE, DECLARED RATHER THAN INHERITED. This job writes six files and uploads
    # them. Without this block it would inherit the workflow-level `security-events: write`,
    # which is a larger blast radius than its purpose justifies and is invisible when reading it.
    permissions:
      contents: read
    steps:
      - name: Write the canonical scripts
        shell: bash
        run: |
          set -euo pipefail
          # EVERY BLOCK BELOW IS GENERATED from the file named in its own marker.
          # `scripts/inline_normalizer.py --check` fails the build if a copy has drifted from
          # its canonical source, if a block is missing, or if any script is inlined MORE THAN
          # ONCE -- the last of those being what put this file past GitHub's size limit.
          # BEGIN NORMALIZE_SARIF — generated from scripts/normalize_sarif.py. DO NOT EDIT HERE.
          cat > /tmp/normalize_sarif.py <<'NORMALIZE_PY'
          #!/usr/bin/env python3
          """CANONICAL SARIF path normalizer. Re-root scanner paths onto the repository.

          THIS FILE IS THE SINGLE SOURCE OF TRUTH.

          It is INLINED into the reusable workflows rather than called as `uses: ./...`, because a reusable
          workflow resolves local paths against the CALLER's checkout — so anything under `scripts/` simply
          does not exist at consumer runtime. That is the same failure that left 14 Azure gitleaks rules
          silently unloaded for every consumer while the kit's own CI stayed green.

          Inlining three copies would reintroduce drift, which is the defect family this kit exists to catch
          (a fix applied to the probe and not the workflow; a tag bumped in one place and not another). So the
          copies are CHECKED: `self-test` asserts every inlined block is byte-identical to this file. Drift
          becomes a build failure instead of a silent divergence.

          WHY NORMALIZATION IS NEEDED AT ALL
          ----------------------------------
          A scanner invoked with a subdirectory as its working directory reports URIs relative to THAT
          directory, not the repository:

            gosec  runs per Go module   -> `go/vuln.go` and `services/worker/vuln.go` BOTH arrive as `vuln.go`
            Trivy  roots at the scan scope -> `infra/main.tf` where Checkov reports the full repo-relative path

          Two files acquire one identity, or one file acquires two. Everything downstream inherits it:
          annotations point at paths that do not exist, finding history cannot separate components across
          runs, one scanner silently "covers for" another in a tool-pinned assertion, and correlation later
          merges findings from different components as though they were the same finding.

          The component root CANNOT be recovered afterwards — merged filenames use `tr '/' '_'`, which is
          lossy. So normalization happens at the POINT OF CAPTURE, while the root is still known.

          INVARIANT: normalize only after source identity is bound. Never merge first and reconstruct
          provenance later.

          USAGE
              python3 normalize_sarif.py <src.sarif> <dst.sarif> <prefix>

          `<prefix>` is the component root relative to the repository. `.` or empty is a no-op, so callers
          need no special case for a root-level project. Idempotent: a URI already carrying the prefix is left
          alone, so re-running cannot double-root.

          Reads SRC and writes DST — never rewrites in place. Containerized scanners produce ROOT-OWNED files;
          opening one for writing fails with EACCES, which turned a misreported finding into an absent one.
          """

          import io
          import json
          import sys


          def reroot(uri, prefix):
              if not uri or not isinstance(uri, str):
                  return uri
              u = uri.replace("\\", "/")
              if u.startswith("file://"):
                  u = u[7:]
              while u.startswith("./"):
                  u = u[2:]
              # An absolute path inside a CONTAINER says nothing about the repository.
              if u.startswith("/src/"):
                  u = u[5:]
              u = u.lstrip("/")
              if prefix in ("", "."):
                  return u
              if u == prefix or u.startswith(prefix + "/"):
                  return u          # idempotent: never double-root
              return prefix + "/" + u


          def fix_locs(locs, prefix):
              for loc in locs or []:
                  if not isinstance(loc, dict):
                      continue
                  phys = loc.get("physicalLocation")
                  if isinstance(phys, dict):
                      art = phys.get("artifactLocation")
                      if isinstance(art, dict) and "uri" in art:
                          art["uri"] = reroot(art["uri"], prefix)


          def normalize(doc, prefix):
              for run in doc.get("runs", []) or []:
                  for art in run.get("artifacts", []) or []:      # what viewers resolve against
                      al = (art or {}).get("location")
                      if isinstance(al, dict) and "uri" in al:
                          al["uri"] = reroot(al["uri"], prefix)
                  for res in run.get("results", []) or []:
                      fix_locs(res.get("locations"), prefix)
                      fix_locs(res.get("relatedLocations"), prefix)
                      at = res.get("analysisTarget")
                      if isinstance(at, dict) and "uri" in at:
                          at["uri"] = reroot(at["uri"], prefix)
                      # A partially re-rooted code flow is worse than none — it still looks authoritative.
                      for flow in res.get("codeFlows", []) or []:
                          for tf in (flow or {}).get("threadFlows", []) or []:
                              for step in (tf or {}).get("locations", []) or []:
                                  if isinstance(step, dict):
                                      fix_locs([step.get("location")], prefix)
              return doc


          def main(argv):
              if len(argv) != 4:
                  print("usage: normalize_sarif.py <src> <dst> <prefix>", file=sys.stderr)
                  return 2
              src, dst = argv[1], argv[2]
              prefix = argv[3].replace("\\", "/").strip("/")
              doc = json.load(io.open(src, encoding="utf-8"))
              json.dump(normalize(doc, prefix), io.open(dst, "w", encoding="utf-8"))
              n = sum(len(r.get("results", []) or []) for r in doc.get("runs", []) or [])
              print("normalize_sarif: %s -> %s rooted at '%s' (%d result(s))" % (src, dst, prefix or ".", n))
              return 0


          if __name__ == "__main__":
              sys.exit(main(sys.argv))

