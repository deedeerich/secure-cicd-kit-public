name: Ticket reconcile (reusable)

# TICKETING_BACKENDS.md section 5 and TICKETING_CONTRACT.md section 7, applied (W-1).
#
# WHERE THIS RUNS. A job of the CALLER'S run, after the scan, in a protected-branch context only
# (SINGLE_PIPELINE_TARGET.md section 2.4: the post-scan phase lives in the same run; stages that
# write to a governance surface are armed only when the ref is the protected default branch). It
# is NEVER armed by a pull request and never by a run chained off one. The `guard` job decides
# that WITHOUT holding anything; only then does the `reconcile` job request the protected
# environment that holds the tracker credential.
#
# WHAT IT READS. The findings JSON the report emits in the SAME run (an intra-run artifact, so the
# default run id is correct by construction), and the ledger from the checkout of the protected
# branch. Nothing crosses a run boundary but the merge commit.
#
# WHAT IT WRITES. Tickets, through ONE credential, in ONE job. Never the repository: the updated
# ledger is uploaded as a PROPOSAL for the propose-ledger path, which opens a reviewed pull request
# (ETFB section 5.4). This job never pushes.
#
# DATA, NEVER CODE. Every caller value reaches the script through `env:`; no `run:` block contains
# an expression (TC 7.4). Redaction already ran in the report before findings were written.
#
# THREE MODES (KDEC-024). `reconcile` (post-merge: findings -> tickets, close on verified
# clearance, RECURRED, merges, SLA escalation) runs behind the `guard` job. `sweep` (the
# credential-free deferral clock) and `resurface` (the scheduled clock WITH writes: reopen lapsed
# dispositions as REOPENED_BY_LAPSE, escalate overdue SLAs) are ONE job each: the guard is the
# job's own `if:` -- the same push/schedule/dispatch-on-the-default-branch rule, evaluated before
# the job starts or requests anything -- so a scheduled clock costs one small job, not two.
#
# EVERY BACKEND THE SCRIPT SUPPORTS IS WIRED: jira, azdo and github. Only the selected backend's
# values survive into the step (C-2 refuses two at once).
#
# STATUS: proven locally only (tests/prove_ticket_reconcile_workflow.py extracts and runs the guard,
# the reconcile, sweep and resurface steps; tests/prove_ticket_lifecycle.py proves the template
# caller). That GitHub honours the environment's branch policy, and that a real caller wires it,
# need a hosted run, which is owed.

on:
  workflow_call:
    inputs:
      backend:
        description: "jira, azdo or github (TICKETING_BACKENDS.md; KDEC-004, KDEC-024). Jira is the system of record."
        type: string
        required: true
      environment:
        description: "The protected deployment environment holding the tracker credential, with a branch policy refusing every ref but the default branch."
        type: string
        required: true
      test_environment:
        description: "KDEC-028: a SANDBOX environment (e.g. ticketing-test) used, automatically, by a push or dispatch on any branch but the default one: its JIRA_PROJECT is a sandbox project, its tickets carry the label kit-test and a [TEST] summary prefix, and a sandbox that is a real project (JIRA_REAL_PROJECTS, or the register's routing) is refused TICKETING_TEST_TARGETS_REAL_PROJECT. The REF chooses, never a variable. Empty: those runs are not armed, as before."
        type: string
        default: ""
      default_branch:
        description: "The protected default branch name. The guard refuses every other ref."
        type: string
        required: true
      mode:
        description: "reconcile (post-merge: findings -> tickets), sweep (schedule, no credential: the past-due deferral clock, read from the ledger) or resurface (schedule: the clock WITH writes -- REOPENED_BY_LAPSE and SLA escalation, no scan)."
        type: string
        default: reconcile
      findings_artifact:
        description: "Name of the same-run artifact holding the report's findings JSON (findings.json). Required for mode reconcile."
        type: string
        default: ""
      ledger_path:
        description: "Path of the baseline ledger in the checkout of the protected branch."
        type: string
        default: ".security/ticket-ledger.json"
      apply:
        description: "Perform the plan. false prints it and writes nothing to the tracker."
        type: boolean
        default: false
      kit_repository:
        description: "owner/repo of this kit, checked out for its scripts."
        type: string
        required: true
      kit_ref:
        description: "Full commit SHA of the kit to check out. A tag or branch can move."
        type: string
        required: true
      timeout_minutes:
        description: "Bound on the reconcile job. An unbounded job turns a tracker outage into billed minutes."
        type: number
        default: 15
      weakening_reason:
        description: "Why a control on this invocation is weaker than baseline (for example a plan-only run)."
        type: string
        default: ""
      weakening_authority:
        description: "The role that accepted the weakening. Never a person's name."
        type: string
        default: ""
      weakening_exception_ref:
        description: "Where the weakening decision is recorded."
        type: string
        default: ""
      weakening_expires:
        description: "ISO date after which the weakening is no longer attributed. Silence never renews it."
        type: string
        default: ""
    secrets:
      JIRA_EMAIL:
        description: "Jira: the account email (basic auth is email:token). From the protected environment. Not needed with vars.JIRA_AUTH_MODE=bearer (a service account token through the gateway, KDEC-028)."
        required: false
      JIRA_TOKEN:
        description: "Jira: API token. From the protected environment."
        required: false
      AZDO_PAT:
        description: "Azure DevOps: PAT, Work Items read & write, one organisation. From the protected environment."
        required: false
      GH_TICKET_TOKEN:
        description: "GitHub Issues: a token with issues read & write on the ONE repository vars.TICKET_REPO names. From the protected environment."
        required: false
    outputs:
      armed:
        description: "true only for push/schedule/dispatch on the protected default branch."
        value: ${{ jobs.guard.outputs.armed || jobs.sweep.outputs.armed || jobs.resurface.outputs.armed }}
      routing_result:
        description: "The ticketing claim as a registered routing_result. Empty when not armed."
        value: ${{ jobs.reconcile.outputs.routing_result || jobs.sweep.outputs.routing_result || jobs.resurface.outputs.routing_result }}
      ticketing_state:
        description: "TICKETING_AVAILABLE | TICKETING_UNAVAILABLE | TICKETING_NOT_CONFIGURED. Never a gate input."
        value: ${{ jobs.reconcile.outputs.ticketing_state || jobs.resurface.outputs.ticketing_state }}
      controls_unavailable:
        description: "Controls that could not be acquired this run. Never read as clean."
        value: ${{ jobs.reconcile.outputs.controls_unavailable || jobs.sweep.outputs.controls_unavailable || jobs.resurface.outputs.controls_unavailable }}

permissions:
  contents: read

jobs:
  guard:
    name: Ticketing armed only after the merge or on a schedule
    # Only mode reconcile needs a separate guard job; the clock modes carry the same rule in their
    # own `if:` (one job, not two).
    if: inputs.mode == 'reconcile'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      armed: ${{ steps.decide.outputs.armed }}
      ticketing_mode: ${{ steps.decide.outputs.ticketing_mode }}
    steps:
      - name: Decide from the trigger context, holding nothing
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ inputs.default_branch }}
          TEST_ENVIRONMENT: ${{ inputs.test_environment }}
        run: |
          set -euo pipefail
          armed=false
          mode=real
          why=""
          case "$EVENT_NAME" in
            push|schedule|workflow_dispatch) ;;
            *) why="event '$EVENT_NAME' is not post-merge or scheduled; ticketing is refused in it (TICKETING_CONTRACT.md 7.1)" ;;
          esac
          if [ -z "$why" ] && [ -z "$DEFAULT_BRANCH" ]; then
            why="no default branch was named, so the protected-branch context cannot be established"
          fi
          # KDEC-028: TEST TICKETING IS CHOSEN BY THE REF, NEVER BY A VARIABLE SOMEONE MUST PUT BACK.
          # Any branch but the default one is a TEST run, in the sandbox environment, when the
          # caller named one; the default branch is always the real one.
          if [ -z "$why" ] && [ "$REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            if [ -n "${TEST_ENVIRONMENT:-}" ] && [ "$EVENT_NAME" != "schedule" ]; then
              mode=test
            else
              why="ref '$REF' is not the protected default branch"
            fi
          fi
          if [ -z "$why" ]; then
            armed=true
            if [ "$mode" = test ]; then
              why="armed for TEST ticketing: $EVENT_NAME on '$REF' (not the default branch), in the sandbox environment '${TEST_ENVIRONMENT:-}'; tickets carry kit-test and [TEST]"
            else
              why="armed: $EVENT_NAME on the protected default branch"
            fi
          fi
          echo "armed=$armed" >> "$GITHUB_OUTPUT"
          echo "ticketing_mode=$mode" >> "$GITHUB_OUTPUT"
          {
            echo "### Ticket reconciliation: $([ "$armed" = true ] && echo ARMED || echo NOT ARMED)"
            echo ""
            echo "$why"
            if [ "$armed" != true ]; then
              echo ""
              echo "No credential was requested and nothing was written. This is the contract, not a failure."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # THE SCHEDULED DEFERRAL CLOCK, WITH NOTHING IN REACH (T-21, TC 7.2). The sweep reads the ledger
  # and a date and contacts no tracker, so it runs in its own job: no protected environment, no
  # secret, contents: read. It used to run inside the reconcile job, which requests the environment
  # holding the tracker credential -- a credential in reach of a job that needs none.
  sweep:
    name: Sweep the past-due deferral clock (no tracker, no credential)
    # THE GUARD, AS THIS JOB'S OWN CONDITION: push, schedule or dispatch on the named default
    # branch, nothing else -- evaluated before the job starts. One job for the clock (T-17).
    if: >-
      inputs.mode == 'sweep' && inputs.default_branch != '' &&
      (github.event_name == 'push' || github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', inputs.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: ${{ inputs.timeout_minutes }}
    outputs:
      armed: ${{ steps.sweep.outputs.armed }}
      routing_result: ${{ steps.sweep.outputs.routing_result }}
      controls_unavailable: ${{ steps.sweep.outputs.controls_unavailable }}
    steps:
      - name: Check out the protected branch (the ledger lives here)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the kit at a pinned commit (its scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.kit_repository }}
          ref: ${{ inputs.kit_ref }}
          path: .kit
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Sweep the ledger for elapsed deferrals
        id: sweep
        env:
          KIT_DIR: ${{ github.workspace }}/.kit
          LEDGER_PATH: ${{ inputs.ledger_path }}
        run: |
          set -uo pipefail
          today="${TODAY_OVERRIDE:-$(date -u +%F)}"
          # The runner's bash is `-e`: a non-zero exit would end the step before the route is
          # written, so the exit is captured rather than allowed to abort.
          rc=0
          python3 "$KIT_DIR/scripts/reconcile_tickets.py" --sweep-deferrals --ledger "$LEDGER_PATH" --today "$today" || rc=$?
          # 0 nothing elapsed, 1 a review is owed, 3 no ledger (nothing swept), else misuse. A
          # sweep that established nothing never reads as clean.
          case "$rc" in
            0) route=PROCEED; unav="" ;;
            1) route=DECISION_REQUIRED; unav="" ;;
            *) route=EVIDENCE_UNTRUSTED; unav="deferral-sweep" ;;
          esac
          echo "armed=true" >> "$GITHUB_OUTPUT"
          echo "routing_result=$route" >> "$GITHUB_OUTPUT"
          echo "controls_unavailable=$unav" >> "$GITHUB_OUTPUT"
          echo "| deferral sweep | exit $rc, routing_result **$route** |" >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

  # THE SCHEDULED CLOCK WITH WRITES (T-17, D5; KDEC-024). No findings and no scan: the ledger, the
  # date and ONE sweep of the tracker. A disposition that has expired reopens its ticket as
  # REOPENED_BY_LAPSE; an open ticket past its SLA is escalated (comment, priority, label) -- each
  # once. It holds the tracker credential, so it requests the protected environment, and it is
  # ONE job: the guard rule is its own `if:`.
  resurface:
    name: Resurface lapsed dispositions and SLA breaches (scheduled, no scan)
    if: >-
      inputs.mode == 'resurface' && inputs.default_branch != '' &&
      (github.event_name == 'push' || github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', inputs.default_branch)
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    timeout-minutes: ${{ inputs.timeout_minutes }}
    outputs:
      armed: ${{ steps.resurface.outputs.armed }}
      routing_result: ${{ steps.resurface.outputs.routing_result }}
      ticketing_state: ${{ steps.resurface.outputs.ticketing_state }}
      controls_unavailable: ${{ steps.resurface.outputs.controls_unavailable }}
    steps:
      - name: Check out the protected branch (the ledger and the register live here)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the kit at a pinned commit (its scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.kit_repository }}
          ref: ${{ inputs.kit_ref }}
          path: .kit
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Resurface (the clock, with writes)
        id: resurface
        env:
          KIT_DIR: ${{ github.workspace }}/.kit
          LEDGER_PATH: ${{ inputs.ledger_path }}
          APPLY: ${{ inputs.apply }}
          TICKET_BACKEND: ${{ inputs.backend }}
          JIRA_HOST: ${{ vars.JIRA_HOST }}
          JIRA_PROJECT: ${{ vars.JIRA_PROJECT }}
          JIRA_STAMP_FIELD: ${{ vars.JIRA_STAMP_FIELD }}
          JIRA_EPIC_ID: ${{ vars.JIRA_EPIC_ID }}
          JIRA_CALIBRATION_ISSUE: ${{ vars.JIRA_CALIBRATION_ISSUE }}
          JIRA_TYPE_CLUSTER: ${{ vars.JIRA_TYPE_CLUSTER }}
          JIRA_TYPE_INSTANCE: ${{ vars.JIRA_TYPE_INSTANCE }}
          JIRA_TRANSITION_REOPEN: ${{ vars.JIRA_TRANSITION_REOPEN }}
          JIRA_TRANSITION_DONE: ${{ vars.JIRA_TRANSITION_DONE }}
          JIRA_PRIORITY_LADDER: ${{ vars.JIRA_PRIORITY_LADDER }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          # KDEC-028: bearer auth for a service account (JIRA_TOKEN alone), and the cloud id.
          JIRA_AUTH_MODE: ${{ vars.JIRA_AUTH_MODE }}
          JIRA_CLOUD_ID: ${{ vars.JIRA_CLOUD_ID }}
          JIRA_REAL_PROJECTS: ${{ vars.JIRA_REAL_PROJECTS }}
          AZDO_ORG_URL: ${{ vars.AZDO_ORG_URL }}
          AZDO_PROJECT: ${{ vars.AZDO_PROJECT }}
          AZDO_STAMP_FIELD: ${{ vars.AZDO_STAMP_FIELD }}
          AZDO_EPIC_ID: ${{ vars.AZDO_EPIC_ID }}
          AZDO_CALIBRATION_ITEM: ${{ vars.AZDO_CALIBRATION_ITEM }}
          AZDO_TYPE_CLUSTER: ${{ vars.AZDO_TYPE_CLUSTER }}
          AZDO_TYPE_INSTANCE: ${{ vars.AZDO_TYPE_INSTANCE }}
          AZDO_STATE_REOPEN: ${{ vars.AZDO_STATE_REOPEN }}
          AZDO_STATE_DONE: ${{ vars.AZDO_STATE_DONE }}
          AZDO_PAT: ${{ secrets.AZDO_PAT }}
          TICKET_REPO: ${{ vars.TICKET_REPO }}
          TICKET_CALIBRATION_REF: ${{ vars.TICKET_CALIBRATION_REF }}
          GH_TOKEN: ${{ secrets.GH_TICKET_TOKEN }}
          TICKET_STAMP_LABEL: ${{ vars.TICKET_STAMP_LABEL }}
          TICKET_CREATE_CEILING: ${{ vars.TICKET_CREATE_CEILING }}
          TICKET_RETRY_CEILING: ${{ vars.TICKET_RETRY_CEILING }}
          TICKET_CALL_BUDGET: ${{ vars.TICKET_CALL_BUDGET }}
          # The clock runs on the default branch only: always real.
          TICKETING_MODE: real
        run: |
          set -uo pipefail
          # Only the selected backend's values survive (C-2 refuses two credentials at once).
          case "$TICKET_BACKEND" in
            jira) unset AZDO_PAT AZDO_ORG_URL AZDO_PROJECT GH_TOKEN TICKET_REPO ;;
            azdo) unset JIRA_TOKEN JIRA_EMAIL JIRA_HOST JIRA_PROJECT GH_TOKEN TICKET_REPO ;;
            github) unset JIRA_TOKEN JIRA_EMAIL JIRA_HOST JIRA_PROJECT AZDO_PAT AZDO_ORG_URL AZDO_PROJECT ;;
          esac
          today="${TODAY_OVERRIDE:-$(date -u +%F)}"
          record="${RUNNER_TEMP}/ticket-run-record.json"
          args=(--resurface --ledger "$LEDGER_PATH" --today "$today" --record "$record")
          if [ "$APPLY" = "true" ]; then args+=(--apply); fi
          if [ -f .security/policy-registration.json ]; then args+=(--registration .security/policy-registration.json); fi
          if [ -f "$KIT_DIR/policy/policy-registration.json" ]; then args+=(--central-registration "$KIT_DIR/policy/policy-registration.json"); fi
          rc=0
          python3 "$KIT_DIR/scripts/reconcile_tickets.py" "${args[@]}" || rc=$?
          case "$rc" in
            0) route=PROCEED; unav="" ;;
            1) route=DECISION_REQUIRED; unav="" ;;
            *) route=EVIDENCE_UNTRUSTED; unav="ticket-resurface" ;;
          esac
          state="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("ticketing_state") or "")' "$record" 2>/dev/null || true)"
          echo "armed=true" >> "$GITHUB_OUTPUT"
          echo "routing_result=$route" >> "$GITHUB_OUTPUT"
          echo "ticketing_state=$state" >> "$GITHUB_OUTPUT"
          echo "controls_unavailable=$unav" >> "$GITHUB_OUTPUT"
          echo "| ticket clock | exit $rc, routing_result **$route**, ${state:-no ticketing state} |" >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Keep the clock's run record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ticket-resurface-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ticket-run-record.json
          if-no-files-found: ignore
          retention-days: 30

  reconcile:
    name: Reconcile findings to the tracker
    needs: guard
    if: needs.guard.outputs.armed == 'true' && inputs.mode == 'reconcile'
    runs-on: ubuntu-latest
    # The tracker credential is held only here and in `resurface` -- one of them per mode, never
    # both in one run -- from a protected environment whose branch policy refuses every ref but
    # the default branch (TC 7.2). KDEC-028: a TEST run (any other branch, the guard decides from
    # the ref) uses the sandbox environment instead -- never the real one.
    environment: ${{ needs.guard.outputs.ticketing_mode == 'test' && inputs.test_environment || inputs.environment }}
    permissions:
      contents: read
    timeout-minutes: ${{ inputs.timeout_minutes }}
    outputs:
      routing_result: ${{ steps.posture.outputs.routing_result }}
      ticketing_state: ${{ steps.posture.outputs.ticketing_state }}
      controls_unavailable: ${{ steps.posture.outputs.controls_unavailable }}
    steps:
      - name: Check out the protected branch (the ledger lives here)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the kit at a pinned commit (its scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.kit_repository }}
          ref: ${{ inputs.kit_ref }}
          path: .kit
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Fetch the findings this run's report emitted
        id: findings
        if: inputs.mode == 'reconcile' && inputs.findings_artifact != ''
        # An absent artifact is handled as a TYPED state by the next step (exit 3,
        # EVIDENCE_UNTRUSTED), never as zero findings.
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.findings_artifact }}
          path: ${{ runner.temp }}/findings

      - name: Reconcile (or, on a schedule, sweep the deferral clock)
        id: reconcile
        env:
          KIT_DIR: ${{ github.workspace }}/.kit
          MODE: ${{ inputs.mode }}
          FINDINGS_FILE: ${{ runner.temp }}/findings/findings.json
          LEDGER_PATH: ${{ inputs.ledger_path }}
          APPLY: ${{ inputs.apply }}
          TICKET_BACKEND: ${{ inputs.backend }}
          # Tracker SETTINGS come from the environment's variables, credentials from its secrets.
          JIRA_HOST: ${{ vars.JIRA_HOST }}
          JIRA_PROJECT: ${{ vars.JIRA_PROJECT }}
          JIRA_STAMP_FIELD: ${{ vars.JIRA_STAMP_FIELD }}
          JIRA_EPIC_ID: ${{ vars.JIRA_EPIC_ID }}
          JIRA_CALIBRATION_ISSUE: ${{ vars.JIRA_CALIBRATION_ISSUE }}
          JIRA_TYPE_CLUSTER: ${{ vars.JIRA_TYPE_CLUSTER }}
          JIRA_TYPE_INSTANCE: ${{ vars.JIRA_TYPE_INSTANCE }}
          JIRA_TRANSITION_REOPEN: ${{ vars.JIRA_TRANSITION_REOPEN }}
          JIRA_TRANSITION_DONE: ${{ vars.JIRA_TRANSITION_DONE }}
          JIRA_PRIORITY_LADDER: ${{ vars.JIRA_PRIORITY_LADDER }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          # KDEC-028: bearer auth for a service account (JIRA_TOKEN alone), and the cloud id.
          JIRA_AUTH_MODE: ${{ vars.JIRA_AUTH_MODE }}
          JIRA_CLOUD_ID: ${{ vars.JIRA_CLOUD_ID }}
          JIRA_REAL_PROJECTS: ${{ vars.JIRA_REAL_PROJECTS }}
          AZDO_ORG_URL: ${{ vars.AZDO_ORG_URL }}
          AZDO_PROJECT: ${{ vars.AZDO_PROJECT }}
          AZDO_STAMP_FIELD: ${{ vars.AZDO_STAMP_FIELD }}
          AZDO_EPIC_ID: ${{ vars.AZDO_EPIC_ID }}
          AZDO_CALIBRATION_ITEM: ${{ vars.AZDO_CALIBRATION_ITEM }}
          AZDO_TYPE_CLUSTER: ${{ vars.AZDO_TYPE_CLUSTER }}
          AZDO_TYPE_INSTANCE: ${{ vars.AZDO_TYPE_INSTANCE }}
          AZDO_STATE_REOPEN: ${{ vars.AZDO_STATE_REOPEN }}
          AZDO_STATE_DONE: ${{ vars.AZDO_STATE_DONE }}
          AZDO_PAT: ${{ secrets.AZDO_PAT }}
          # GitHub Issues: one repository, one token (KDEC-024 wires every backend the script has).
          TICKET_REPO: ${{ vars.TICKET_REPO }}
          TICKET_CALIBRATION_REF: ${{ vars.TICKET_CALIBRATION_REF }}
          GH_TOKEN: ${{ secrets.GH_TICKET_TOKEN }}
          TICKET_STAMP_LABEL: ${{ vars.TICKET_STAMP_LABEL }}
          TICKET_CREATE_CEILING: ${{ vars.TICKET_CREATE_CEILING }}
          TICKET_RETRY_CEILING: ${{ vars.TICKET_RETRY_CEILING }}
          TICKET_CALL_BUDGET: ${{ vars.TICKET_CALL_BUDGET }}
          TICKET_INSTANCE_THRESHOLD: ${{ vars.TICKET_INSTANCE_THRESHOLD }}
          TICKET_DEGRADED_RUN_THRESHOLD: ${{ vars.TICKET_DEGRADED_RUN_THRESHOLD }}
          # KDEC-028: derived by the guard from the ref (default branch real, any other test).
          TICKETING_MODE: ${{ needs.guard.outputs.ticketing_mode }}
        run: |
          set -uo pipefail
          # Only the selected backend's credential may be present (C-2 refuses two at once), so
          # the other backends' values are cleared here rather than trusted to be empty.
          case "$TICKET_BACKEND" in
            jira) unset AZDO_PAT AZDO_ORG_URL AZDO_PROJECT GH_TOKEN TICKET_REPO ;;
            azdo) unset JIRA_TOKEN JIRA_EMAIL JIRA_HOST JIRA_PROJECT GH_TOKEN TICKET_REPO ;;
            github) unset JIRA_TOKEN JIRA_EMAIL JIRA_HOST JIRA_PROJECT AZDO_PAT AZDO_ORG_URL AZDO_PROJECT ;;
          esac
          today="${TODAY_OVERRIDE:-$(date -u +%F)}"
          record="${RUNNER_TEMP}/ticket-run-record.json"
          script="$KIT_DIR/scripts/reconcile_tickets.py"
          # The exit code is the posture record's input (0 proceed, 1 decision owed, 2 misuse,
          # 3 EVIDENCE_UNTRUSTED), so it is written as an output before the step ends.
          finish() { echo "rc=$1" >> "$GITHUB_OUTPUT"; exit "$1"; }
          case "$MODE" in
            reconcile)
              if [ ! -s "$FINDINGS_FILE" ]; then
                {
                  echo "### Ticket reconciliation: EVIDENCE_UNTRUSTED"
                  echo ""
                  echo "The findings this run's report should have emitted are ABSENT. Nothing was"
                  echo "reconciled. This is not zero findings: the input was never established."
                } | tee -a "$GITHUB_STEP_SUMMARY"
                python3 "$script" --sweep-deferrals --ledger "$LEDGER_PATH" --today "$today" || true
                finish 3
              fi
              args=(--findings "$FINDINGS_FILE" --ledger "$LEDGER_PATH" --today "$today" --record "$record")
              if [ "$APPLY" = "true" ]; then args+=(--apply); fi
              # KDEC-024. The report's coverage record (beside findings.json: a ticket closes on
              # absence only with it), the register (SLA numbers, secret-exception links), and
              # this run and commit (linked on every ticket, cited on every closure).
              cov="$(dirname "$FINDINGS_FILE")/findings-coverage.json"
              if [ -f "$cov" ]; then args+=(--coverage "$cov"); fi
              if [ -f .security/policy-registration.json ]; then args+=(--registration .security/policy-registration.json); fi
              if [ -f "$KIT_DIR/policy/policy-registration.json" ]; then args+=(--central-registration "$KIT_DIR/policy/policy-registration.json"); fi
              if [ -n "${GITHUB_RUN_ID:-}" ]; then args+=(--run-url "${GITHUB_SERVER_URL:-https://github.com}/${GITHUB_REPOSITORY:-}/actions/runs/${GITHUB_RUN_ID}"); fi
              if [ -n "${GITHUB_SHA:-}" ]; then args+=(--commit "$GITHUB_SHA"); fi
              # Captured, not allowed to abort: the runner's bash is `-e`, and an exit of 1 or 3
              # must still reach the posture step as rc (it used to end the step first).
              rc=0
              python3 "$script" "${args[@]}" || rc=$?
              # The ledger is a governance artifact: proposed, never pushed (ETFB 5.4). A TEST run's
              # ledger is never proposed: its bindings are sandbox tickets (KDEC-028).
              if [ -f "$LEDGER_PATH" ] && [ "${TICKETING_MODE:-real}" != "test" ]; then cp "$LEDGER_PATH" "${RUNNER_TEMP}/ticket-ledger-proposal.json"; fi
              finish $rc
              ;;
            *)
              # mode sweep and mode resurface run in their own jobs (T-21, T-17), never here.
              echo "::error title=Unknown mode::this job serves mode reconcile; sweep and resurface have their own jobs"
              finish 2
              ;;
          esac

      # Vocabulary: assurance-taxonomy.yaml :: control_weakening, routing_result. The enumeration
      # is TOTAL over this workflow's inputs (tests/check_weakening_record.py). The pattern is
      # workflow-policy-check.yml's, unchanged.
      - name: Control posture -- what ticketing did, what it could not, and who decided
        id: posture
        if: always()
        env:
          W_FINDINGS_ARTIFACT: ${{ inputs.findings_artifact }}
          W_APPLY: ${{ inputs.apply }}
          W_WEAKENING_REASON: ${{ inputs.weakening_reason }}
          W_WEAKENING_AUTHORITY: ${{ inputs.weakening_authority }}
          W_WEAKENING_EXCEPTION_REF: ${{ inputs.weakening_exception_ref }}
          W_WEAKENING_EXPIRES: ${{ inputs.weakening_expires }}
          RC: ${{ steps.reconcile.outputs.rc }}
          RECORD: ${{ runner.temp }}/ticket-run-record.json
        run: |
          set -u
          req=""; exe=""; skp=""; red=""; wk=""; inforce=0; badclass=0
          at_baseline() {
            case "$2" in
              NONEMPTY) [ -n "$1" ] ;;
              *)        [ "$1" = "$2" ] ;;
            esac
          }
          # posture <input> <control_weakening class> <baseline> <control> "<value>"
          posture() {
            n="$1"; cls="$2"; base="$3"; ctl="$4"; val="${5-}"; st=WEAKENING_AT_BASELINE
            case "$cls" in
              NOT_A_CONTROL_SURFACE|EXCEPTION_ATTRIBUTION)
                return 0 ;;
              TARGET_NOT_SUPPLIED)
                req="$req,$ctl"
                if at_baseline "$val" "$base"; then exe="$exe,$ctl"; else skp="$skp,$ctl"; fi ;;
              CONTROL_DISABLED)
                req="$req,$ctl"
                if at_baseline "$val" "$base"; then
                  exe="$exe,$ctl"
                else
                  st=WEAKENING_IN_FORCE; skp="$skp,$ctl"; inforce=$((inforce+1))
                fi ;;
              *)
                echo "::error title=Unregistered control_weakening class::$cls on input $n"
                badclass=1; return 0 ;;
            esac
            wk="$wk,{\"input\":\"$n\",\"class\":\"$cls\",\"control\":\"$ctl\",\"baseline\":\"$base\",\"value\":\"$val\",\"state\":\"$st\"}"
          }

          posture backend                 NOT_A_CONTROL_SURFACE - -
          posture environment             NOT_A_CONTROL_SURFACE - -
          posture test_environment        NOT_A_CONTROL_SURFACE - -
          posture default_branch          NOT_A_CONTROL_SURFACE - -
          posture mode                    NOT_A_CONTROL_SURFACE - -
          posture findings_artifact       TARGET_NOT_SUPPLIED NONEMPTY ticket-reconciliation "$W_FINDINGS_ARTIFACT"
          posture ledger_path             NOT_A_CONTROL_SURFACE - -
          posture apply                   CONTROL_DISABLED  true         ticket-writes  "$W_APPLY"
          posture kit_repository          NOT_A_CONTROL_SURFACE - -
          posture kit_ref                 NOT_A_CONTROL_SURFACE - -
          posture timeout_minutes         NOT_A_CONTROL_SURFACE - -
          posture weakening_reason        EXCEPTION_ATTRIBUTION - -
          posture weakening_authority     EXCEPTION_ATTRIBUTION - -
          posture weakening_exception_ref EXCEPTION_ATTRIBUTION - -
          posture weakening_expires       EXCEPTION_ATTRIBUTION - -

          # UNAVAILABLE IS NOT CLEAN: no exit code, misuse (2) or an untrusted claim (3) means the
          # ticketing control never reached a verdict it could stand behind.
          unav=""
          case "${RC:-}" in
            0|1) ;;
            '') unav="ticket-reconciliation" ;;   # no exit code recorded: stated, not left to *)
            *) unav="ticket-reconciliation" ;;
          esac
          # A POLICY DEFECT IS AN OBSERVED REFUSAL (TC 4.6): two backends configured at once
          # "fails the policy check, by name".
          defect=0
          if [ -f "$RECORD" ] && grep -q 'CONFIGURATION DEFECT' "$RECORD"; then defect=1; fi

          dedupe() {
            printf '%s' "${1#,}" | tr ',' '\n' | sed '/^$/d' | sort -u | tr '\n' ',' | sed 's/,$//'
          }
          REQ="$(dedupe "$req")"; EXE="$(dedupe "$exe")"
          SKP="$(dedupe "$skp")"; RED="$(dedupe "$red")"; UNAV="$(dedupe "$unav")"

          auth=WEAKENING_AT_BASELINE
          if [ "$inforce" -gt 0 ]; then
            if [ -n "$W_WEAKENING_REASON" ] && [ -n "$W_WEAKENING_AUTHORITY" ]; then
              auth=WEAKENING_ATTRIBUTED
              # AN EXPIRY NOBODY CAN READ HAS NOT "NOT ARRIVED". Dates compare as strings below, which
              # is correct only for a real YYYY-MM-DD: `never` or `31/12/1999` sorted after every ISO
              # date and read as unexpired forever. Anything that is not a valid calendar date reverts
              # to owing a decision, and says why. tests/prove_gate_routing.py, expiry_* scenarios.
              if [ -n "$W_WEAKENING_EXPIRES" ]; then
                if ! printf '%s' "$W_WEAKENING_EXPIRES" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' ||
                   [ "$(date -u -d "$W_WEAKENING_EXPIRES" +%Y-%m-%d 2>/dev/null)" != "$W_WEAKENING_EXPIRES" ]; then
                  echo "::warning title=Unreadable weakening expiry::'$W_WEAKENING_EXPIRES' is not a"
                  echo "YYYY-MM-DD calendar date, so the exception cannot be shown to be in force."
                  auth=WEAKENING_EXCEPTION_EXPIRED
                elif [ "$(date -u +%Y-%m-%d)" ">" "$W_WEAKENING_EXPIRES" ]; then
                  auth=WEAKENING_EXCEPTION_EXPIRED
                fi
              fi
            else
              auth=WEAKENING_UNATTRIBUTED
            fi
          fi

          # The TICKETING claim only. A ticketing result never softens, and never hardens, the
          # findings' own routing under the rung (TC 4.1).
          route=PROCEED
          if [ "$defect" = "1" ]; then
            route=BLOCKED
          elif [ -n "$UNAV" ] || [ "$badclass" = "1" ]; then
            route=EVIDENCE_UNTRUSTED
          elif [ "${RC:-}" = "1" ] || [ "$auth" = "WEAKENING_UNATTRIBUTED" ] || [ "$auth" = "WEAKENING_EXCEPTION_EXPIRED" ]; then
            route=DECISION_REQUIRED
          elif [ "$inforce" -gt 0 ]; then
            route=PROCEED_WITH_ADVISORY
          fi

          emit() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          # TICKETING_UNAVAILABLE is reported as itself (KDEC-024): visible, never a silent pass,
          # and never a gate input -- the security gate ran before this job and does not wait.
          tstate=""
          if [ -f "$RECORD" ]; then
            tstate="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("ticketing_state") or "")' "$RECORD" 2>/dev/null || true)"
          fi
          emit ticketing_state "$tstate"
          emit routing_result "$route"
          emit controls_required "$REQ"
          emit controls_executed "$EXE"
          emit controls_unavailable "$UNAV"
          emit controls_reduced "$RED"
          emit controls_skipped "$SKP"
          emit weakenings "[${wk#,}]"
          emit weakening_attribution "$auth"
          emit weakening_record "{\"reason\":\"$W_WEAKENING_REASON\",\"authority\":\"$W_WEAKENING_AUTHORITY\",\"exception_ref\":\"$W_WEAKENING_EXCEPTION_REF\",\"expires\":\"$W_WEAKENING_EXPIRES\"}"
          {
            echo "### Control posture -- ticket reconciliation"
            echo ""
            echo "| row | value |"
            echo "|---|---|"
            echo "| routing_result | **$route** |"
            echo "| ticketing | ${tstate:-not recorded} |"
            echo "| controls executed | ${EXE:-none} |"
            echo "| controls unavailable | ${UNAV:-none} |"
            echo "| controls skipped | ${SKP:-none} |"
            echo "| weakening attribution | $auth |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the run record and the ledger proposal
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ticket-reconcile-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ticket-run-record.json
            ${{ runner.temp }}/ticket-ledger-proposal.json
          if-no-files-found: ignore
          retention-days: 30
