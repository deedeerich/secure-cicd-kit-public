name: "Kit: Workflow Policy Check"
# Employer-neutral governance gate — PROMOTED from inline pipeline logic into a shared reusable.
# Lints the CALLING repo's own GitHub Actions workflows against supply-chain and deploy policy.
#
# Threat model: the CI supply-chain compromise class — a third-party Action that is compromised,
# or whose tag is repointed at malicious code, executing on a runner that holds repo secrets and
# a live OIDC token (the tj-actions/changed-files pattern). The durable controls are: pin
# third-party actions to a full commit SHA, keep GITHUB_TOKEN permissions minimal, never expose
# secrets to fork-controlled code, and never interpolate attacker-controlled text into a shell.
# Those are enforced below regardless of the specific TTP or campaign name.
#
# The checker is INLINED so it resolves correctly when called cross-repo.

on:
  workflow_call:
    inputs:
      workflows_path:
        description: "Directory holding the workflows to lint"
        type: string
        required: false
        default: ".github/workflows"
      trusted_orgs:
        description: "Comma-separated action owners permitted to use tag refs instead of SHA pins"
        type: string
        required: false
        default: "actions,github,azure,docker,hashicorp"
      require_sha_pinning:
        description: "Require full 40-char commit SHA pins for untrusted action owners"
        type: boolean
        required: false
        default: true
      allow_deploy_on_push:
        description: "Permit deploy-shaped jobs on bare push triggers (policy default: no)"
        type: boolean
        required: false
        default: false
      soft_fail:
        description: "Report violations without failing the build (use for first adoption only)"
        type: boolean
        required: false
        default: false
      # ── GOVERNANCE OF WEAKENINGS ────────────────────────────────────────────────────────
      # `soft_fail` and `require_sha_pinning: false` both weaken this gate, and until now
      # neither appeared in the summary, an output or an annotation. A weakening is a governed
      # exception, not a boolean preference. Optional inputs, so no existing caller breaks.
      weakening_reason:
        description: >-
          Why a control on this invocation is weaker than baseline. Empty means the record says
          WEAKENING_UNATTRIBUTED and routing_result becomes DECISION_REQUIRED.
        type: string
        required: false
        default: ""
      weakening_authority:
        description: >-
          WHO decided. A reason without an authority is an explanation, not a decision, and both
          are required before a weakening is attributed.
        type: string
        required: false
        default: ""
      weakening_exception_ref:
        description: >-
          Where the exception or deferral is recorded. Its ABSENCE is reported too: an exception
          nobody can find is one nobody can review or expire.
        type: string
        required: false
        default: ""
      weakening_expires:
        description: >-
          ISO date (YYYY-MM-DD) on which the weakening lapses. A past date routes to
          DECISION_REQUIRED — silence must never renew a weakening.
        type: string
        required: false
        default: ""
    outputs:
      # ── THE CONTROL POSTURE RECORD ──────────────────────────────────────────────────────
      # This workflow previously exposed NO outputs at all, so a consumer could not tell a clean
      # policy run from one whose gate had been softened to reporting. Vocabulary:
      # assurance-taxonomy.yaml :: control_weakening, routing_result.
      routing_result:
        description: >-
          PROCEED | PROCEED_WITH_ADVISORY | DECISION_REQUIRED | BLOCKED | EVIDENCE_UNTRUSTED.
        value: ${{ jobs.policy-check.outputs.routing_result }}
      controls_required:
        description: "Comma list of the controls this invocation should have run."
        value: ${{ jobs.policy-check.outputs.controls_required }}
      controls_executed:
        description: "Comma list of the controls that actually ran."
        value: ${{ jobs.policy-check.outputs.controls_executed }}
      controls_unavailable:
        description: "Controls whose evidence could not be collected. NOT the same as clean."
        value: ${{ jobs.policy-check.outputs.controls_unavailable }}
      controls_reduced:
        description: "Controls that ran with enforcement withheld or scope narrowed."
        value: ${{ jobs.policy-check.outputs.controls_reduced }}
      controls_skipped:
        description: "Controls that were not run at all."
        value: ${{ jobs.policy-check.outputs.controls_skipped }}
      weakenings:
        description: >-
          JSON array, one object per declared input that governs a control. TOTAL over this
          workflow's inputs.
        value: ${{ jobs.policy-check.outputs.weakenings }}
      weakening_attribution:
        description: >-
          WEAKENING_AT_BASELINE | WEAKENING_ATTRIBUTED | WEAKENING_UNATTRIBUTED |
          WEAKENING_EXCEPTION_EXPIRED.
        value: ${{ jobs.policy-check.outputs.weakening_attribution }}
      weakening_record:
        description: "Reason, authority, exception reference and expiry as one JSON object."
        value: ${{ jobs.policy-check.outputs.weakening_record }}

permissions:
  contents: read

jobs:
  policy-check:
    name: Workflow policy
    runs-on: ubuntu-latest
    outputs:
      routing_result: ${{ steps.posture.outputs.routing_result }}
      controls_required: ${{ steps.posture.outputs.controls_required }}
      controls_executed: ${{ steps.posture.outputs.controls_executed }}
      controls_unavailable: ${{ steps.posture.outputs.controls_unavailable }}
      controls_reduced: ${{ steps.posture.outputs.controls_reduced }}
      controls_skipped: ${{ steps.posture.outputs.controls_skipped }}
      weakenings: ${{ steps.posture.outputs.weakenings }}
      weakening_attribution: ${{ steps.posture.outputs.weakening_attribution }}
      weakening_record: ${{ steps.posture.outputs.weakening_record }}
    # Bounded so a stalled dependency cannot bill six hours (LM-001: unbounded execution
    # converts a dependency failure into uncontrolled cost).
    # NOT YET: a timeout still surfaces as a plain job failure. It SHOULD classify as
    # UNAVAILABLE / EXECUTION_TIMEOUT — cost is bounded here, semantics are not. See
    # docs/roadmap/FUTURE_WORK.md. Do not let this comment imply the mapping exists.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install parser
        run: python -m pip install --quiet PyYAML

      - name: Evaluate policy
        id: policy
        env:
          WORKFLOWS_PATH: ${{ inputs.workflows_path }}
          TRUSTED_ORGS: ${{ inputs.trusted_orgs }}
          REQUIRE_SHA: ${{ inputs.require_sha_pinning }}
          ALLOW_DEPLOY_ON_PUSH: ${{ inputs.allow_deploy_on_push }}
        run: |
          cat > /tmp/policy_check.py <<'PYEOF'
          import os, re, sys, glob
          import yaml

          WF_DIR   = os.environ.get("WORKFLOWS_PATH", ".github/workflows")
          TRUSTED  = {o.strip().lower() for o in os.environ.get("TRUSTED_ORGS", "").split(",") if o.strip()}
          NEED_SHA = os.environ.get("REQUIRE_SHA", "true").lower() == "true"
          ALLOW_DOP = os.environ.get("ALLOW_DEPLOY_ON_PUSH", "false").lower() == "true"

          # Built without literal Actions-expression syntax so this file is not self-interpolated.
          OPEN, CLOSE = "$" + "{{", "}" + "}"
          EXPR = re.compile(re.escape(OPEN) + r"\s*(.*?)\s*" + re.escape(CLOSE), re.S)
          SHA40 = re.compile(r"^[0-9a-f]{40}$")
          DEPLOYISH = re.compile(r"deploy|release|publish|promote", re.I)

          # Image-setting deploy commands, and the flag that carries the image reference.
          # Anchored on `az ` so this checker does not flag its own rule text.
          DEPLOY_CMD = re.compile(r"\baz\s+(?:containerapp\s+update|webapp\s+config\s+container\s+set)\b")
          IMG_FLAG   = re.compile(r"--(?:image|container-image-name)\s+('[^']*'|\"[^\"]*\"|\S+)")
          DIGEST_LIT = re.compile(r"@sha256:[a-f0-9]{64}")

          # Attacker-controllable expression contexts that must never reach a shell unquoted.
          # `inputs.*` and `github.event.inputs.*` are in it (ledger L83): a workflow_dispatch input
          # is typed by whoever can dispatch, and a reusable workflow's input by whatever caller
          # invokes it -- text either way, and the kit's own lint (tests/lint_injection.py) has
          # refused it in every reusable since the C-series fixes. Pass it through `env:`.
          INJECTABLE = re.compile(
              r"github\.event\.(issue|pull_request|comment|discussion|review)\.(title|body)"
              r"|github\.event\.head_commit\.message"
              r"|github\.event\.pull_request\.head\.(ref|label)"
              r"|github\.head_ref"
              r"|github\.event\.inputs\."
              r"|(?<![\w.])inputs\.",
          )
          IMAGE_DIGEST = re.compile(r"@sha256:[a-f0-9]{64}$")

          findings = []  # (severity, file, message)

          def add(sev, f, msg):
              findings.append((sev, f, msg))

          def walk_jobs(doc):
              jobs = doc.get("jobs") or {}
              if isinstance(jobs, dict):
                  for name, job in jobs.items():
                      if isinstance(job, dict):
                          yield name, job

          def steps_of(job):
              s = job.get("steps") or []
              return [x for x in s if isinstance(x, dict)]

          def triggers(doc):
              # PyYAML parses a bare `on:` key as boolean True.
              on = doc.get("on", doc.get(True))
              if isinstance(on, str):
                  return {on: None}
              if isinstance(on, list):
                  return {k: None for k in on}
              return on if isinstance(on, dict) else {}

          def check_ref(path, where, uses):
              """R1/R2 for any `uses:` -- a step's, or a JOB's call of a reusable workflow."""
              if "@" not in uses:
                  add("ERROR", path, f"{where}`uses: {uses}` has no ref — always pin a version")
                  return
              repo, ref = uses.rsplit("@", 1)
              owner = repo.split("/", 1)[0].lower()
              if ref in ("main", "master", "HEAD") or ref.startswith("refs/heads/"):
                  add("ERROR", path, f"{where}`{uses}` tracks a moving branch — a repoint silently ships new code into CI")
              elif NEED_SHA and owner not in TRUSTED and not SHA40.match(ref):
                  add("ERROR", path, f"{where}`{uses}` is untrusted-owner and not SHA-pinned — pin to a full 40-char commit SHA")

          def check_image(path, where, image):
              """Container and service images run with the job's authority, like an action does."""
              image = str(image or "").strip()
              if not image or OPEN in image:
                  return            # an expression: resolved at run time, not statically checkable
              name = image.split("@", 1)[0]
              tag = name.rsplit(":", 1)[1] if ":" in name.rsplit("/", 1)[-1] else ""
              if IMAGE_DIGEST.search(image):
                  return
              if not tag or tag == "latest":
                  add("ERROR", path, f"{where}image `{image}` is unpinned (no tag, or `latest`) — pin it by `@sha256:` digest")
              elif NEED_SHA:
                  add("ERROR", path, f"{where}image `{image}` is pinned by a mutable tag — pin it by `@sha256:` digest")

          files = sorted(glob.glob(os.path.join(WF_DIR, "*.yml")) + glob.glob(os.path.join(WF_DIR, "*.yaml")))
          # NOTHING INSPECTED IS NOT NOTHING WRONG (ledger L83). This exited 0, so a wrong
          # `workflows_path` -- a typo, a moved directory -- produced a green policy gate over zero
          # files. It now fails, and the posture record calls the gate UNAVAILABLE.
          with open("/tmp/policy_files_scanned", "w", encoding="utf-8") as fh:
              fh.write(str(len(files)))
          if not files:
              print(f"::error title=Nothing inspected::No workflow files found under {WF_DIR}. A gate "
                    "that read nothing has established nothing; check `workflows_path`.")
              sys.exit(2)

          for path in files:
              raw = open(path, encoding="utf-8").read()
              try:
                  doc = yaml.safe_load(raw) or {}
              except yaml.YAMLError as e:
                  add("ERROR", path, f"unparseable YAML: {e}")
                  continue
              if not isinstance(doc, dict):
                  add("ERROR", path, "workflow root is not a mapping")
                  continue

              trig = triggers(doc)
              top_perms = doc.get("permissions")

              # ── R1/R2: action reference pinning ────────────────────────────
              for job_name, job in walk_jobs(doc):
                  # A JOB-LEVEL `uses:` calls a reusable workflow, which runs with this caller's
                  # secrets and token. It was never checked (ledger L83); same rules as a step.
                  juses = job.get("uses")
                  if isinstance(juses, str) and not juses.startswith(("./", "$/")):
                      check_ref(path, f"{job_name}: (reusable workflow) ", juses)
                  # Container and service images (ledger L83).
                  cont = job.get("container")
                  check_image(path, f"{job_name}: container ", cont.get("image") if isinstance(cont, dict) else cont)
                  for svc_name, svc in (job.get("services") or {}).items():
                      if isinstance(svc, dict):
                          check_image(path, f"{job_name}: service {svc_name} ", svc.get("image"))
                  for step in steps_of(job):
                      uses = step.get("uses")
                      if isinstance(uses, str) and uses.startswith("docker://"):
                          check_image(path, f"{job_name}: step ", uses[len("docker://"):])
                          continue
                      # `./` and `$/` resolve to this repository at the running commit: no ref to pin.
                      if not isinstance(uses, str) or uses.startswith(("./", "$/")):
                          continue
                      check_ref(path, f"{job_name}: ", uses)
                      if "@" not in uses:
                          continue
                      repo, ref = uses.rsplit("@", 1)
                      owner = repo.split("/", 1)[0].lower()
                      if owner not in TRUSTED and SHA40.match(ref) and "#" not in raw.split(uses, 1)[-1][:80]:
                          add("NOTE", path, f"{job_name}: `{repo}` SHA-pinned (good) — add a trailing `# vX.Y.Z` comment so upgrades stay reviewable")

              # ── R3: GITHUB_TOKEN permissions ───────────────────────────────
              if top_perms is None and not any(
                  isinstance(j, dict) and "permissions" in j for _, j in walk_jobs(doc)
              ):
                  add("ERROR", path, "no `permissions:` declared — the job inherits the repo default token scope")
              if top_perms in ("write-all",) or (
                  isinstance(top_perms, dict) and top_perms.get("contents") == "write" and "workflow_call" not in trig
              ):
                  add("WARN", path, "broad top-level write permissions — scope them to the jobs that need them")
              if isinstance(top_perms, dict) and top_perms.get("id-token") == "write":
                  n_jobs = len(list(walk_jobs(doc)))
                  if n_jobs > 1 and "workflow_call" not in trig:
                      add("WARN", path, f"`id-token: write` granted workflow-wide across {n_jobs} jobs — every job gets a usable OIDC token; scope it to the deploying job")

              # ── R4: fork-controlled code with secrets ──────────────────────
              if "pull_request_target" in trig:
                  for job_name, job in walk_jobs(doc):
                      for step in steps_of(job):
                          if isinstance(step.get("uses"), str) and step["uses"].startswith("actions/checkout"):
                              ref = (step.get("with") or {}).get("ref", "")
                              if "head" in str(ref) or "pull_request" in str(ref):
                                  add("ERROR", path, f"{job_name}: `pull_request_target` checking out the PR head runs fork code with full secret access")
                  add("WARN", path, "`pull_request_target` grants secrets to PR-triggered runs — confirm no fork-controlled code executes")

              # ── R5: OIDC-only cloud auth ───────────────────────────────────
              for job_name, job in walk_jobs(doc):
                  for step in steps_of(job):
                      uses = step.get("uses") or ""
                      with_ = step.get("with") or {}
                      if isinstance(uses, str) and uses.startswith("azure/login") and "creds" in with_:
                          add("ERROR", path, f"{job_name}: `azure/login` with `creds:` uses a long-lived service-principal secret — federate with OIDC instead")
                      if isinstance(uses, str) and uses.startswith("docker/login-action") and "password" in with_:
                          pw = str(with_.get("password"))
                          if "PASSWORD" in pw.upper() or "TOKEN" in pw.upper():
                              add("WARN", path, f"{job_name}: registry login by static password — prefer federated/registry-token auth")

              # ── R6: no deploy-on-push ──────────────────────────────────────
              if not ALLOW_DOP and "push" in trig:
                  for job_name, job in walk_jobs(doc):
                      if not (DEPLOYISH.search(job_name) or DEPLOYISH.search(str(job.get("name", "")))):
                          continue
                      cond = str(job.get("if", ""))
                      # Three legitimate gates: a GitHub Environment on this job, an `if:`
                      # that confines the job to a manual dispatch, or delegation to a
                      # reusable workflow that carries the Environment itself.
                      has_env      = "environment" in job
                      dispatch_only = "workflow_dispatch" in cond
                      delegates_env = "github_environment" in (job.get("with") or {})
                      if not (has_env or dispatch_only or delegates_env):
                          add("ERROR", path, f"{job_name}: deploy-shaped job reachable from `push` with no gating `environment:` and no dispatch guard — deploys must be gated or dispatched")
                      elif not has_env and not delegates_env:
                          add("WARN", path, f"{job_name}: deploy-shaped job gated only by `if:` — add a GitHub Environment so the approval is enforced server-side")

              # ── R7: deploy by digest, not tag ──────────────────────────────
              for job_name, job in walk_jobs(doc):
                  for step in steps_of(job):
                      run = step.get("run") or ""
                      if not isinstance(run, str) or not DEPLOY_CMD.search(run):
                          continue
                      for raw_val in IMG_FLAG.findall(run):
                          val = raw_val.strip("'\"")
                          # Accept a literal digest, or an expression that resolves one
                          # (the deploy reusables validate the digest shape at runtime).
                          if DIGEST_LIT.search(val) or ("@" in val and "digest" in val.lower()):
                              continue
                          add("ERROR", path, f"{job_name}: deploy sets image `{val}` without an `@sha256:` digest — mutable tags break reproducibility and provenance")

              # ── R8: over-broad secret propagation ──────────────────────────
              for job_name, job in walk_jobs(doc):
                  if job.get("secrets") == "inherit":
                      add("WARN", path, f"{job_name}: `secrets: inherit` hands the callee every repo secret — pass only what it needs")

              # ── R9: script injection via untrusted expressions ─────────────
              for job_name, job in walk_jobs(doc):
                  for step in steps_of(job):
                      run = step.get("run")
                      if isinstance(run, str):
                          for expr in EXPR.findall(run):
                              if INJECTABLE.search(expr):
                                  add("ERROR", path, f"{job_name}: attacker-controlled `{expr}` interpolated into a `run:` block — pass it through `env:` and reference the variable instead")

          # ── R1/R2 again: composite actions ────────────────────────────────
          # A composite action is another place third-party actions execute with the
          # caller's authority, so the same pinning rules apply to its steps.
          actions_dir = os.path.join(os.path.dirname(WF_DIR.rstrip("/")) or ".github", "actions")
          action_files = sorted(glob.glob(os.path.join(actions_dir, "*", "action.yml")) +
                                glob.glob(os.path.join(actions_dir, "*", "action.yaml")))
          for path in action_files:
              try:
                  doc = yaml.safe_load(open(path, encoding="utf-8")) or {}
              except yaml.YAMLError as e:
                  add("ERROR", path, f"unparseable YAML: {e}")
                  continue
              for step in ((doc.get("runs") or {}).get("steps") or []):
                  if not isinstance(step, dict):
                      continue
                  uses = step.get("uses")
                  if isinstance(uses, str) and uses.startswith("docker://"):
                      check_image(path, "step ", uses[len("docker://"):])
                      continue
                  if not isinstance(uses, str) or uses.startswith(("./", "$/")):
                      continue
                  check_ref(path, "", uses)

          # ── Report ────────────────────────────────────────────────────────
          order = {"ERROR": 0, "WARN": 1, "NOTE": 2}
          findings.sort(key=lambda f: (order.get(f[0], 3), f[1]))
          errors = sum(1 for s, _, _ in findings if s == "ERROR")
          warns  = sum(1 for s, _, _ in findings if s == "WARN")

          lines = ["### Workflow policy check", "",
                   f"Scanned **{len(files)}** workflow file(s) under `{WF_DIR}` "
                   f"and **{len(action_files)}** composite action(s).", ""]
          if findings:
              lines += ["| Severity | File | Finding |", "|---|---|---|"]
              for sev, f, msg in findings:
                  icon = {"ERROR": "🔴", "WARN": "🟡", "NOTE": "🔵"}.get(sev, "")
                  lines.append(f"| {icon} {sev} | `{f.replace(os.sep, '/')}` | {msg} |")
          else:
              lines.append("✅ No policy violations found.")
          report = "\n".join(lines)
          print(report)
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write(report + "\n")

          print(f"\n{errors} error(s), {warns} warning(s).")
          sys.exit(1 if errors else 0)
          PYEOF
          rm -f /tmp/policy_files_scanned
          rc=0
          python /tmp/policy_check.py || rc=$?
          # The count of files the linter read, for the posture record (zero is UNAVAILABLE, L83).
          # A count the linter never wrote is UNKNOWN, never zero and never a number.
          files_scanned=UNKNOWN
          if [ -s /tmp/policy_files_scanned ]; then files_scanned="$(cat /tmp/policy_files_scanned)"; fi
          echo "files_scanned=$files_scanned" >> "$GITHUB_OUTPUT"
          exit "$rc"
        continue-on-error: ${{ inputs.soft_fail }}

      # ── CONTROL POSTURE RECORD ────────────────────────────────────────────────────────────
      #
      # A WEAKENING IS A GOVERNED EXCEPTION, NOT A BOOLEAN PREFERENCE.
      #
      # `soft_fail: true` turned this gate into a report and said so nowhere a machine could
      # read and nowhere a reviewer would look. `require_sha_pinning: false` removed the
      # supply-chain control this workflow's own threat model names first. Both were silent, and
      # a silent weakening is indistinguishable from a clean run — which is exactly the collapse
      # this kit refuses everywhere else.
      #
      # PLACED BEFORE THE VERDICT, deliberately. The verdict step exits non-zero on a hard fail,
      # and a record emitted after it would be missing from precisely the runs that most need
      # one. `steps.policy.outcome` is already decided here.
      #
      # The enumeration is TOTAL over this workflow's inputs; tests/check_weakening_record.py
      # fails the build when an input exists without a class.
      # Vocabulary: assurance-taxonomy.yaml :: control_weakening, routing_result.
      - name: Control posture — required, executed, unavailable, reduced, skipped, and who decided
        id: posture
        if: always()
        env:
          # CALLER INPUT ARRIVES AS DATA, NEVER AS SCRIPT TEXT (tests/lint_injection.py).
          W_WORKFLOWS_PATH: ${{ inputs.workflows_path }}
          W_TRUSTED_ORGS: ${{ inputs.trusted_orgs }}
          W_REQUIRE_SHA_PINNING: ${{ inputs.require_sha_pinning }}
          W_ALLOW_DEPLOY_ON_PUSH: ${{ inputs.allow_deploy_on_push }}
          W_SOFT_FAIL: ${{ inputs.soft_fail }}
          W_WEAKENING_REASON: ${{ inputs.weakening_reason }}
          W_WEAKENING_AUTHORITY: ${{ inputs.weakening_authority }}
          W_WEAKENING_EXCEPTION_REF: ${{ inputs.weakening_exception_ref }}
          W_WEAKENING_EXPIRES: ${{ inputs.weakening_expires }}
          POLICY_OUTCOME: ${{ steps.policy.outcome }}
          POLICY_FILES_SCANNED: ${{ steps.policy.outputs.files_scanned }}
        run: |
          set -u
          req=""; exe=""; skp=""; red=""; wk=""; dead=""; inforce=0; badclass=0

          # AT BASELINE MEANS "AS STRONG AS THIS KIT SHIPS IT", NOT "AS STRONG AS IT COULD BE".
          #   NONEMPTY  at baseline when any value was supplied
          #   max:N     at baseline when the number is N or below
          #   literal   at baseline on exact equality
          at_baseline() {
            case "$2" in
              NONEMPTY) [ -n "$1" ] ;;
              max:*)    [ -n "$1" ] && [ "$1" -le "${2#max:}" ] 2>/dev/null ;;
              *)        [ "$1" = "$2" ] ;;
            esac
          }

          # posture <input> <control_weakening class> <baseline> <control> "<value>"
          posture() {
            n="$1"; cls="$2"; base="$3"; ctl="$4"; val="${5-}"; st=WEAKENING_AT_BASELINE
            case "$cls" in
              NOT_A_CONTROL_SURFACE|EXCEPTION_ATTRIBUTION)
                return 0 ;;
              CONTROL_SURFACE_DEAD)
                at_baseline "$val" "$base" || dead="$dead,$n" ;;
              TARGET_NOT_SUPPLIED)
                req="$req,$ctl"
                if at_baseline "$val" "$base"; then exe="$exe,$ctl"; else skp="$skp,$ctl"; fi ;;
              CONTROL_DISABLED)
                req="$req,$ctl"
                if at_baseline "$val" "$base"; then
                  exe="$exe,$ctl"
                else
                  st=WEAKENING_IN_FORCE; skp="$skp,$ctl"; inforce=$((inforce+1))
                fi ;;
              GATE_SOFTENED)
                req="$req,$ctl"; exe="$exe,$ctl"
                at_baseline "$val" "$base" || {
                  st=WEAKENING_IN_FORCE; red="$red,$ctl"; inforce=$((inforce+1)); } ;;
              SCOPE_NARROWED|SEVERITY_RAISED|DEPTH_REDUCED)
                req="$req,$ctl"; exe="$exe,$ctl"
                at_baseline "$val" "$base" || {
                  st=CONTROL_RECONFIGURED; red="$red,$ctl"; inforce=$((inforce+1)); } ;;
              *)
                echo "::error title=Unregistered control_weakening class::$cls on input $n is not"
                echo "a term in assurance-taxonomy.yaml. The posture record cannot be trusted."
                badclass=1; return 0 ;;
            esac
            wk="$wk,{\"input\":\"$n\",\"class\":\"$cls\",\"control\":\"$ctl\",\"baseline\":\"$base\",\"value\":\"$val\",\"state\":\"$st\"}"
          }

          posture workflows_path          SCOPE_NARROWED   ".github/workflows"  workflow-policy        "$W_WORKFLOWS_PATH"
          posture trusted_orgs            SCOPE_NARROWED   "actions,github,azure,docker,hashicorp" action-pinning "$W_TRUSTED_ORGS"
          posture require_sha_pinning     CONTROL_DISABLED true                 action-pinning         "$W_REQUIRE_SHA_PINNING"
          posture allow_deploy_on_push    GATE_SOFTENED    false                deploy-trigger-policy  "$W_ALLOW_DEPLOY_ON_PUSH"
          posture soft_fail               GATE_SOFTENED    false                workflow-policy        "$W_SOFT_FAIL"
          posture weakening_reason        EXCEPTION_ATTRIBUTION - -
          posture weakening_authority     EXCEPTION_ATTRIBUTION - -
          posture weakening_exception_ref EXCEPTION_ATTRIBUTION - -
          posture weakening_expires       EXCEPTION_ATTRIBUTION - -

          # UNAVAILABLE IS NOT CLEAN. `skipped` or `cancelled` means the linter never reached a
          # verdict, so an empty finding list is a failure to observe rather than an observation.
          unav=""
          case "${POLICY_OUTCOME:-skipped}" in
            success|failure) ;;
            *) unav="$unav,workflow-policy,action-pinning,deploy-trigger-policy" ;;
          esac
          # A linter that found ZERO files reached no verdict either (ledger L83): unavailable,
          # not findings and not clean. So is a count nobody reported: absence is not a number.
          case "${POLICY_FILES_SCANNED:-}" in
            ''|0|UNKNOWN) unav="$unav,workflow-policy,action-pinning,deploy-trigger-policy" ;;
            *) ;;
          esac

          dedupe() {
            printf '%s' "${1#,}" | tr ',' '\n' | sed '/^$/d' | sort -u | tr '\n' ',' | sed 's/,$//'
          }
          REQ="$(dedupe "$req")"; EXE="$(dedupe "$exe")"
          SKP="$(dedupe "$skp")"; RED="$(dedupe "$red")"; UNAV="$(dedupe "$unav")"
          for c in $(printf '%s' "$SKP" | tr ',' ' '); do
            EXE="$(printf '%s' "$EXE" | tr ',' '\n' | grep -vx "$c" | tr '\n' ',' | sed 's/,$//')"
          done

          auth=WEAKENING_AT_BASELINE
          if [ "$inforce" -gt 0 ]; then
            if [ -n "$W_WEAKENING_REASON" ] && [ -n "$W_WEAKENING_AUTHORITY" ]; then
              auth=WEAKENING_ATTRIBUTED
              # AN EXPIRY NOBODY CAN READ HAS NOT "NOT ARRIVED". Dates compare as strings below, which
              # is correct only for a real YYYY-MM-DD: `never` or `31/12/1999` sorted after every ISO
              # date and read as unexpired forever. Anything that is not a valid calendar date reverts
              # to owing a decision, and says why. tests/prove_gate_routing.py, expiry_* scenarios.
              if [ -n "$W_WEAKENING_EXPIRES" ]; then
                if ! printf '%s' "$W_WEAKENING_EXPIRES" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' ||
                   [ "$(date -u -d "$W_WEAKENING_EXPIRES" +%Y-%m-%d 2>/dev/null)" != "$W_WEAKENING_EXPIRES" ]; then
                  echo "::warning title=Unreadable weakening expiry::'$W_WEAKENING_EXPIRES' is not a"
                  echo "YYYY-MM-DD calendar date, so the exception cannot be shown to be in force."
                  auth=WEAKENING_EXCEPTION_EXPIRED
                elif [ "$(date -u +%Y-%m-%d)" ">" "$W_WEAKENING_EXPIRES" ]; then
                  auth=WEAKENING_EXCEPTION_EXPIRED
                fi
              fi
            else
              auth=WEAKENING_UNATTRIBUTED
            fi
          fi

          # A REFUSAL IS OBSERVED HERE, not inferred: the linter reached a verdict and the gate
          # was not softened. Violations that exist while `soft_fail` is on are findings that
          # were recorded and not blocked, which is PROCEED_WITH_ADVISORY at best and
          # DECISION_REQUIRED while nobody has said why.
          findings=0
          [ "${POLICY_OUTCOME:-skipped}" = "failure" ] && findings=1
          route=PROCEED
          if [ -n "$UNAV" ] || [ "$badclass" = "1" ]; then
            route=EVIDENCE_UNTRUSTED
          elif [ "$findings" = "1" ] && [ "$W_SOFT_FAIL" != "true" ]; then
            route=BLOCKED
          elif [ "$auth" = "WEAKENING_UNATTRIBUTED" ] || [ "$auth" = "WEAKENING_EXCEPTION_EXPIRED" ]; then
            route=DECISION_REQUIRED
          elif [ "$inforce" -gt 0 ] || [ "$findings" = "1" ]; then
            route=PROCEED_WITH_ADVISORY
          fi

          emit() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          emit routing_result "$route"
          emit controls_required "$REQ"
          emit controls_executed "$EXE"
          emit controls_unavailable "$UNAV"
          emit controls_reduced "$RED"
          emit controls_skipped "$SKP"
          emit weakenings "[${wk#,}]"
          emit weakening_attribution "$auth"
          emit weakening_record "{\"reason\":\"$W_WEAKENING_REASON\",\"authority\":\"$W_WEAKENING_AUTHORITY\",\"exception_ref\":\"$W_WEAKENING_EXCEPTION_REF\",\"expires\":\"$W_WEAKENING_EXPIRES\"}"

          {
            echo "### Control posture — workflow policy gate"
            echo ""
            echo "| Row | Value |"
            echo "|---|---|"
            echo "| controls required | \`${REQ:-none}\` |"
            echo "| controls executed | \`${EXE:-none}\` |"
            echo "| controls unavailable | \`${UNAV:-none}\` — never reached a verdict; NOT the same as clean |"
            echo "| controls reduced | \`${RED:-none}\` |"
            echo "| controls skipped | \`${SKP:-none}\` |"
            echo "| reason | ${W_WEAKENING_REASON:-_(none recorded)_} |"
            echo "| authority | ${W_WEAKENING_AUTHORITY:-_(none recorded)_} |"
            echo "| exception / deferral id | ${W_WEAKENING_EXCEPTION_REF:-_(none recorded)_} |"
            echo "| expiry | ${W_WEAKENING_EXPIRES:-_(no expiry set)_} |"
            echo "| attribution | \`$auth\` |"
            echo "| **routing result** | **\`$route\`** |"
            echo ""
            if [ -n "$dead" ]; then
              echo "> **Dead input(s) set:** \`${dead#,}\` — declared and read by nothing."
              echo ""
            fi
            if [ "$route" = "DECISION_REQUIRED" ]; then
              echo "> **A weakening is in force and nobody has said why.** Record"
              echo "> \`weakening_reason\` and \`weakening_authority\`, or restore the baseline."
              echo ""
            fi
            if [ "$route" = "EVIDENCE_UNTRUSTED" ]; then
              echo "> **This result cannot be relied on.** The policy linter never reached a"
              echo "> verdict, so an empty finding list establishes nothing."
              echo ""
            fi
            echo "Vocabulary: \`assurance-taxonomy.yaml\` :: \`control_weakening\`, \`routing_result\`."
          } >> "$GITHUB_STEP_SUMMARY"

          printf 'routing_result=%s attribution=%s in_force=%s\n' "$route" "$auth" "$inforce"

      - name: Policy verdict
        env:
          # CALLER INPUT ARRIVES AS DATA, NEVER AS SCRIPT TEXT (tests/lint_injection.py).
          SOFT_FAIL: ${{ inputs.soft_fail }}
        run: |
          if [ "${{ steps.policy.outcome }}" = "failure" ]; then
            if [ "$SOFT_FAIL" = "true" ]; then
              echo "::warning::Workflow policy violations found (soft_fail enabled — not blocking)."
            else
              echo "::error::Workflow policy violations found. See the job summary."
              exit 1
            fi
          fi
          echo "Workflow policy check complete."
