# Rollback resource classes -- which Azure resource types a rollback may reverse ENTRY BY ENTRY,
# and which it must treat as one whole, stable thing. KDEC-023 (owner, 2026-10-23), lane L-RB3.
# Read by scripts/rollback_dependencies.py; proven by tests/prove_rollback_dependencies.py.
#
# Owner, 2026-10-23: "If it's a resource or service that is not shared and multi-configurable for
# each thing think frontdoor or NSGs or firewall rules and routing or WAF rules and routing that are
# shared but only the product's configs were changed those things can be rolled back but if a solid
# stable resource like an app service or a database or a container or something is changed by
# something else the dependency review and refusal to rollback fully and the partial or no rollback
# with reasons and dependency graph is provided to the user."
#
# THE TWO CLASSES (assurance-taxonomy.yaml :: rollback_resource_class)
#   SHARED_MULTI_CONFIG  many products keep their own config ENTRIES in one resource. A rollback
#                        reverses only the product's entries and reads back every other entry,
#                        byte-identical. An entry of the product changed by anyone else is a
#                        cross-edit: the dependency review decides, as for a stable resource.
#   STABLE               one product's whole resource. Changed by anything other than the release
#                        being rolled back -> dependency review; a full rollback is refused.
#
# HOW A TYPE IS MATCHED. Type names are compared case-insensitively. A resource id's type is read
# from the id (".../providers/Microsoft.Network/networkSecurityGroups/nsg/securityRules/r" is
# Microsoft.Network/networkSecurityGroups/securityRules), and the LONGEST registered type that
# prefixes it decides: a child of a SHARED type is one of its entries; a child of a STABLE type is
# part of that stable resource. A type registered nowhere is NOT GUESSED: the node is a human
# decision (ROLLBACK_REQUIRES_HUMAN_DECISION), and so is everything that depends on it.
#
# ENTRIES
#   child_collections   entries that are ARM child resources (their own id, GET/PUT/DELETE each).
#                       `*` expands to every child of the collection before it.
#   inline_collections  entries that live as named elements of an array in the parent's body
#                       (sub-resource ids <parent>/<name>/<entry>); reversed by one PUT of the
#                       parent that changes only the product's elements.
#   interacting         collections whose entries are evaluated TOGETHER (priority, longest prefix):
#                       a cross-edit of one of the product's entries there also holds the product's
#                       other entries in the same collection.
#   parent_excludes     body paths of the parent that ARM mirrors from its children; ignored when the
#                       parent is read back for "untouched".
# ENTRY OWNER (OF-5 K-5; KDEC-030 R4, "Rollback: what the generic ARM rollback must refuse")
#   entry_owner         WHO may reverse it, beside the class that says HOW. With the seam in force
#                       (rollback_sequence.py --seam-ownership, passed by the rollback reusable
#                       when the environment opts into the KDEC-030 lease):
#                       landing-zone        the platform and every shared entry: never reversed
#                                           by an application rollback; the landing zone's own
#                                           recovery is the reverser (ROLLBACK_REFUSED_PLATFORM_OWNED)
#                       kit-release-fields  a release target: the kit owns its release fields
#                                           and reverses them through the deploy adapters, never by
#                                           a whole-body ARM PUT (refused the same way)
#                       release             a workload the release itself creates in its own
#                                           resource group; the ARM rollback may reverse it
#                       Without the seam, the classes decide alone, as before: a deployer that is
#                       not a landing zone still owns its own entries.
# FLAGS
#   data: true          holds data: a resource the release CREATED is never deleted by a rollback
#                       (a human decides); a modification is restored like any other.
#   reversal: human     restoring the prior state has consequences a machine should not weigh
#                       (ROLLBACK_CONTRACT.md: RBAC) -- always a human decision.
#
# NOT LIVE: the API versions, the child/inline split and the mirrored paths are from the ARM REST
# reference; that each PUT of a prior body is accepted per type is owed to a live run (KDEC-023).
# THE BODY IS FLOW-STYLE YAML -- JSON with whole-line comments -- so the rollback engine reads it
# with the standard library alone (the rollback runner has no PyYAML); any YAML reader reads it too.
{
  "schema_version": 1,
  "classes": {
    "SHARED_MULTI_CONFIG": "many products' config entries in one resource; only the product's entries are reversed",
    "STABLE": "one product's whole resource; changed by anything else -> dependency review"
