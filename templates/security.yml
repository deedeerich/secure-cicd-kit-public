# Starter: drop this into a calling repo at .github/workflows/security.yml
# Replace YOUR_ORG and pin the kit by COMMIT SHA (a branch or moving tag means the verdict came from
# code nobody chose).
#
# ONE SECURITY CALLER PER REPOSITORY (owner ruling 2026-10-27, KDEC-033). templates/build-deploy.yml
# REPLACES this file: its `security` job calls the same reusable on the same push / pull_request /
# dispatch triggers under the same job id, so the required check is still `security / Security gate`.
# Installing both ran the whole suite twice per event (W5). When you wire a deploy, DELETE this file in
# the same change. tests/prove_security_caller_triggers.py proves the replacement keeps every trigger.
name: Security

# LONG-LIVED BRANCHES (lane L-LEAK, docs/adoption/LEAK_GATES.md): a secret pushed to `dev` or a release
# branch is scanned only when a PR from it targets main. Recommended: list every long-lived branch in
# BOTH triggers, e.g. `branches: [main, dev]` -- one more full scan per push to it is the cost.
on:
  push:
    branches: [main]          # recommended: [main, dev, <other long-lived branches>]
  pull_request:
    branches: [main]          # recommended: the same list
  workflow_dispatch:

# A SUPERSEDED PULL-REQUEST RUN IS CANCELLED; NOTHING ELSE IS (cost redesign step 2, KDEC-033). Only
# pull_request runs share a group (one per PR), so a new push to the PR cancels the run it replaced. Every
# other event is grouped by its own run id: a push to main is never cancelled and never queued.
# tests/prove_security_caller_triggers.py holds both expressions.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Everything the kit's jobs request must be granted here, or GitHub refuses the whole run before any
# job starts (startup_failure). tests/check_caller_permissions.py holds this template to that.
permissions:
  contents: read
  security-events: write
  actions: read          # the CodeQL job reads workflow metadata on private repositories

jobs:
  security:
    uses: YOUR_ORG/secure-cicd-kit/.github/workflows/reusable-security.yml@0000000000000000000000000000000000000000   # pin a commit SHA
    with:
      environment: prod       # the baseline-ledger environment this run is for
      # The defaults ARE the baseline (soft_fail_sast: false, language: auto): change nothing to get
      # PROCEED on a clean run. Softening any control is a weakening -- attribute it or it routes
      # DECISION_REQUIRED:
      # soft_fail_sast: true
      # weakening_reason: "first adoption on an inherited backlog"
      # weakening_authority: "security lead"
      # weakening_expires: "2026-12-31"
    secrets:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}   # optional; remove if unused
