# Starter: drop this into a calling repo at .github/workflows/build-deploy.yml
# Replace YOUR_ORG, and replace every 0000000000000000000000000000000000000000 below with the
# 40-hex commit SHA of the kit you chose: a branch or moving tag means the verdict came from code
# nobody chose (templates/security.yml pins the same way).
#
# Shape: security gates -> build (scan before push, SBOM) -> deploy BY DIGEST, gated by a
# GitHub Environment.
#
# BUILD ONCE, PROMOTE THE SAME DIGEST (KDEC-029, owner 2026-10-26). A merge to main passes the full
# gate, builds ONCE, signs, and deploys that digest to dev AND test IN PARALLEL (deploy-dev,
# deploy-test: two independent jobs, two independent promotion records). uat and prod are never
# built for: a dispatch with promote_from_run_id PROMOTES the digest a predecessor verified (the
# `promote` job; no build runs). The predecessor is product policy: vars.KIT_PROMOTION_PREDECESSOR
# (test or uat; default test; uat's own predecessor is always test). "Tested" = health, the e2e test
# period (vars.KIT_E2E_TEST_COMMAND), DAST where configured (vars.KIT_DAST_COMMAND, never at prod) and the
# security-settings posture. A hotfix is the same path with a shorter period; break-glass is a
# dispatch with release_path break-glass and an attributed exception, followed by the deployed scan
# that tickets the testing it still owes. templates/deployed-scan.yml scans what serves, daily.
#
# WHAT THE LANDING ZONE VENDS (docs/architecture/LZ_KIT_HANDOFF_CONTRACT.md). Per application and
# environment: AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, AZURE_CLIENT_ID (variables, not secrets: the
# identity is federated and holds no key) and KIT_RESOURCE_GROUP, KIT_APP_NAME,
# KIT_ACR_LOGIN_SERVER, KIT_IMAGE_REPOSITORY, KIT_ENVIRONMENT_TIER, KIT_CLOUD. A job that CALLS a
# reusable workflow cannot declare `environment:`, so the `vars.*` read in this file resolve
# REPOSITORY (or organisation) variables only. The deploy reusable runs in the deploy environment
# and binds itself to that environment's own KIT_* values: an empty value here is filled from the
# environment, and a value here that disagrees with the environment's is refused before login.
# The build reusable does not bind: set KIT_ACR_LOGIN_SERVER and KIT_IMAGE_REPOSITORY as
# repository variables (or vend them there too).
name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy the build produced by this run"
        type: boolean
        default: false
      environment:
        description: "GitHub Environment to deploy into (one per deployment environment, vended by the landing zone)"
        type: string
        default: "dev"
      promote_from_run_id:
        description: "PROMOTE (no build): the run whose deploy into promote_from_environment verified the digest"
        type: string
        default: ""
      promote_from_environment:
        description: "PROMOTE: the predecessor environment whose record is promoted"
        type: string
        default: "test"
      release_path:
        description: "normal | hotfix | rollback | break-glass"
        type: string
        default: "normal"
      exception_reason:
        description: "break-glass / rollback: why (the weakening record)"
        type: string
        default: ""
      exception_authority:
        description: "break-glass / rollback: who accepted it (a role or a named approver)"
        type: string
        default: ""
      exception_ref:
        description: "break-glass / rollback: the ticket or exception id"
        type: string
        default: ""
      exception_expires:
        description: "break-glass / rollback: YYYY-MM-DD, at most 7 days out for break-glass"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # ── Gate 1: security must pass before anything is built ──────────────
  security:
    if: inputs.promote_from_run_id == ''   # a promotion builds nothing; the source record carries the verdict
    uses: YOUR_ORG/secure-cicd-kit/.github/workflows/reusable-security.yml@0000000000000000000000000000000000000000   # pin a commit SHA
    permissions:
      contents: read
      security-events: write
      actions: read   # the CodeQL job reads workflow metadata on private repositories
    # The defaults ARE the baseline (language: auto, iac_mode: auto, soft_fail_sast: false): change
    # nothing to get PROCEED on a clean run. Softening any control is a weakening -- attribute it
    # (weakening_reason, weakening_authority, weakening_expires) or it routes DECISION_REQUIRED.
    with:
      environment: prod     # the baseline-ledger environment this run is for
    secrets:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  # ── Gate 2: the repo's own pipelines must satisfy supply-chain policy ─
  policy:
    if: inputs.promote_from_run_id == ''
    uses: YOUR_ORG/secure-cicd-kit/.github/workflows/workflow-policy-check.yml@0000000000000000000000000000000000000000   # pin a commit SHA
    permissions:
      contents: read

  # ── Build: Trivy gate runs BEFORE the push; emits digest + SBOM hash ──
  #
  # The BUILD IDENTITY IS NOT THE DEPLOY IDENTITY (hand-off contract): it holds AcrPush on the
  # application's repository and nothing else, and lives in its own GitHub Environment (`build`
  # here) whose federated credential is the build's. The deploy identity lives in each deploy
  # environment and holds no registry role.
  #
  # `github_environment` is REQUIRED whenever push is true (it defaults to true). Pushing needs
  # Azure OIDC, and the federated credential subject is environment-scoped — so the environment
  # is what supplies both the matching subject and the target subscription. Omitting it fails
  # fast with an explanatory error rather than after the whole build.
  #
  # To build on feature branches too, add them to `on.push.branches` and pass:
  #     github_environment: ""      # no Azure auth, no credential needed
  #     push: false                 # build + scan + SBOM only
  # Keep `push: true` on main only. Do NOT restrict this with a Branch-form federated credential —
  # use the Environment's deployment branch policy (see docs/adoption/SETUP.md §1.2).
  #
  # `needs: security` IS THE VERDICT, NOT A SCANNER'S MOOD. The security gate is the single
  # enforcement point: scanner jobs report findings and fail only when they could not scan, so the
  # security workflow fails exactly when its routing_result is BLOCKED or EVIDENCE_UNTRUSTED (a
  # secret, a broken scan). At crawl, ordinary findings build here as PROCEED_WITH_ADVISORY; the
  # verdict job below still refuses a deploy on DECISION_REQUIRED (which passes the gate) or worse.
  build:
    needs: [security, policy]
    if: github.event_name != 'pull_request' && inputs.promote_from_run_id == ''
    uses: YOUR_ORG/secure-cicd-kit/.github/workflows/reusable-build-docker.yml@0000000000000000000000000000000000000000   # pin a commit SHA
    permissions:
      contents: read
      id-token: write
      attestations: write   # the attest job (PROV section 8.2) signs build provenance
    with:
      github_environment: build             # the build identity's own Environment, never a deploy one
      acr_login_server: ${{ vars.KIT_ACR_LOGIN_SERVER }}
      image_repository: ${{ vars.KIT_IMAGE_REPOSITORY }}
      cloud: ${{ vars.KIT_CLOUD || 'commercial' }}
    secrets:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID }}

  # ── Verdict: BRANCH on identity and on the security verdict; render the stamp ──
  #
  # `needs: [build]` alone stops a bad identity only as a side effect of the build job failing.
  # Add `continue-on-error` to the build, or consume a failed job's outputs, and that protection
  # is gone without a sign (PROVENANCE_AND_ATTESTATION.md section 7). So the decision is made
  # here, from the outputs the kit emits for exactly this purpose:
  #   artifact_identity must be REGISTRY_IDENTITY_PROVEN, and
  #   the precedence-maximum of the security and build routing_result must be PROCEED or
  #   PROCEED_WITH_ADVISORY (BLOCKED > EVIDENCE_UNTRUSTED > DECISION_REQUIRED > ...).
  # An absent or unrecognised verdict is EVIDENCE_UNTRUSTED, never a pass. A REQUESTED deploy that
  # is refused FAILS this job -- a refusal must be visible, not a silently skipped deploy.
  #
  # TWO VERDICTS LEAVE THIS JOB. `routing_result` folds in the V1 attestation check and decides
  # `deploy_allowed`. `deploy_routing_result` is the release verdict the deploy is HANDED: security,
  # build and identity, without V1 -- because the deploy reusable runs V1 itself before login, and
  # a plan-held V1 (PROCEED_WITH_ADVISORY) has no registered advisory cause: folded in, it would
  # reach a uat/prod deploy as an advisory whose cause is absent, which KDEC-014 refuses.
  #
  # reusable-security.yml emits `routing_result` (ledger L30/L31). A kit version that predates it
  # renders the verdict absent, and this job then refuses every deploy: no verdict is not a PROCEED.
  verdict:
    needs: [security, build]
    if: github.event_name != 'pull_request' && inputs.promote_from_run_id == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read     # V1 reads; nothing here writes (PROVENANCE_AND_ATTESTATION.md §8.2)
    outputs:
      deploy_allowed: ${{ steps.decide.outputs.deploy_allowed }}
      routing_result: ${{ steps.decide.outputs.routing_result }}
      deploy_routing_result: ${{ steps.decide.outputs.deploy_routing_result }}
      version_metadata: ${{ steps.stamp.outputs.metadata }}
      attestation_outcome: ${{ steps.attestation.outputs.outcome }}
    steps:
      # V1 — verification BEFORE any mutation (PROVENANCE_AND_ATTESTATION.md §6.1): the last point
      # at which refusing costs nothing. Five outcomes routed by rung (§6.3). On a private
      # repository whose plan offers no attestations it is HELD (IMPLEMENTATION_HELD, trigger: the
      # plan), not wired red forever (§6.4). Set vars.ATTESTATIONS_AVAILABLE to 'true' on
      # Enterprise Cloud; a public repository arms regardless.
      - name: Verify the build-provenance attestation (V1)
        id: attestation
        if: needs.build.outputs.artifact_identity == 'REGISTRY_IDENTITY_PROVEN'
        uses: YOUR_ORG/secure-cicd-kit/.github/actions/verify-attestation@0000000000000000000000000000000000000000   # pin a commit SHA
        with:
          image-digest: ${{ needs.build.outputs.image_digest }}
          subject-name: ${{ vars.KIT_ACR_LOGIN_SERVER }}/${{ vars.KIT_IMAGE_REPOSITORY }}
          repository: ${{ github.repository }}
          signer-workflow: YOUR_ORG/secure-cicd-kit/.github/workflows/reusable-build-docker.yml
          rung: run
          attestations-available: ${{ vars.ATTESTATIONS_AVAILABLE == 'true' }}

      - name: Decide — proven identity and a PROCEED-class verdict, or no deploy
        id: decide
        env:
          SECURITY_ROUTING: ${{ needs.security.outputs.routing_result }}
          BUILD_ROUTING: ${{ needs.build.outputs.routing_result }}
          VERIFY_ROUTING: ${{ steps.attestation.outputs.routing_result }}
          ARTIFACT_IDENTITY: ${{ needs.build.outputs.artifact_identity }}
          DEPLOY_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy }}
          # KDEC-029: a merge to main deploys dev and test, so a refusal there is a requested deploy too.
          MERGE_DEPLOYS: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          rank() {
            case "$1" in
              PROCEED) echo 0 ;; PROCEED_WITH_ADVISORY) echo 1 ;; DECISION_REQUIRED) echo 2 ;;
              EVIDENCE_UNTRUSTED) echo 3 ;; BLOCKED) echo 4 ;;
              *) echo 3 ;;   # absent or unregistered: the input to a decision is missing
            esac
          }
          names=(PROCEED PROCEED_WITH_ADVISORY DECISION_REQUIRED EVIDENCE_UNTRUSTED BLOCKED)
          s="$(rank "$SECURITY_ROUTING")"; b="$(rank "$BUILD_ROUTING")"
          release=$(( s > b ? s : b ))
          # An identity that is not proven means the evidence describes an artifact nobody can
          # name: EVIDENCE_UNTRUSTED at least, whatever the scanners said.
          if [ "$ARTIFACT_IDENTITY" != REGISTRY_IDENTITY_PROVEN ] && [ "$release" -lt 3 ]; then
            release=3
          fi
          v="$(rank "$VERIFY_ROUTING")"   # absent (step skipped) ranks as EVIDENCE_UNTRUSTED
          worst=$(( v > release ? v : release ))
          route="${names[$worst]}"
          handed="${names[$release]}"
          allowed=false
          if [ "$worst" -le 1 ]; then allowed=true; fi
          echo "routing_result=$route" >> "$GITHUB_OUTPUT"
          echo "deploy_routing_result=$handed" >> "$GITHUB_OUTPUT"
          echo "deploy_allowed=$allowed" >> "$GITHUB_OUTPUT"
          {
            echo "### Deploy verdict"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| security routing_result | \`${SECURITY_ROUTING:-absent}\` |"
            echo "| build routing_result | \`${BUILD_ROUTING:-absent}\` |"
            echo "| artifact_identity | \`${ARTIFACT_IDENTITY:-absent}\` |"
            echo "| **release verdict handed to the deploy** | **\`$handed\`** |"
            echo "| attestation (V1) routing_result | \`${VERIFY_ROUTING:-absent}\` (the deploy re-runs V1 before login) |"
            echo "| **combined, with V1** | **\`$route\`** |"
            echo "| deploy allowed | $allowed |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$allowed" != true ] && { [ "$DEPLOY_REQUESTED" = true ] || [ "${MERGE_DEPLOYS:-}" = true ]; }; then
            echo "::error title=Deploy refused::routing_result=$route, artifact_identity=${ARTIFACT_IDENTITY:-absent}. A deploy needs REGISTRY_IDENTITY_PROVEN and PROCEED or PROCEED_WITH_ADVISORY."
            exit 1
          fi

      # The stamp the deploy writes. Without this the deploy knows WHICH artifact and nothing about
      # what was established about it (PROVENANCE_AND_ATTESTATION.md section 2.3).
      - name: Render version metadata (the identity chain and the build inputs)
        id: stamp
        uses: YOUR_ORG/secure-cicd-kit/.github/actions/render-version-metadata@0000000000000000000000000000000000000000   # pin a commit SHA
        with:
          image-digest: ${{ needs.build.outputs.image_digest }}
          sbom-sha256: ${{ needs.build.outputs.sbom_sha256 }}
          config-digest: ${{ needs.build.outputs.image_config_digest }}
          artifact-identity: ${{ needs.build.outputs.artifact_identity }}
          build-inputs: ${{ needs.build.outputs.build_inputs }}

  # ── Deploy: dispatch-only and Environment-gated. Never on bare push. ──
  #
  # The deploy reads the release VERDICT (routing_result), not a job result, and refuses before
  # Azure login unless the verdict is PROCEED or PROCEED_WITH_ADVISORY. A kit version whose
  # security reusable does not emit routing_result yet hands an absent verdict here, and the deploy
  # refuses -- the honest state: there is no verdict to read. controls_unavailable is recorded in
  # the deploy's outcome report.
  #
  # THE TIER IS THE LANDING ZONE'S, NOT A STRING TYPED HERE. environment_tier decides the
  # production rules (uat/prod: no irreversible deploy, KDEC-014's version-gap refusal); the deploy
  # binds it to its environment's KIT_ENVIRONMENT_TIER and refuses a mismatch.
  deploy:
    needs: [security, build, verdict]
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.deploy && inputs.promote_from_run_id == '' &&
      needs.verdict.outputs.deploy_allowed == 'true'
    uses: YOUR_ORG/secure-cicd-kit/.github/workflows/reusable-deploy-containerapp.yml@0000000000000000000000000000000000000000   # pin a commit SHA
    permissions:
      contents: read
      id-token: write
      attestations: read   # the deploy runs V1 itself, before login (P-02)
      actions: read        # the deploy reads its target's rollback marker, before login (KDEC-023)
    with:
      github_environment: ${{ inputs.environment }}       # approvals live on the Environment
      # V1 inside the deploy: the build workflow that must have signed this digest. On a private
      # repository whose plan offers no attestations it is HELD, recorded, and the deploy proceeds.
      attestation_signer_workflow: YOUR_ORG/secure-cicd-kit/.github/workflows/reusable-build-docker.yml
      attestations_available: ${{ vars.ATTESTATIONS_AVAILABLE == 'true' }}
      environment_tier: ${{ vars.KIT_ENVIRONMENT_TIER }}  # bound to the environment's own value
      routing_result: ${{ needs.verdict.outputs.deploy_routing_result }}
      controls_unavailable: ${{ needs.security.outputs.controls_unavailable }}
      # WHY the verdict is advisory. At uat/prod a VERSION_GAP established by READ ranges is
      # refused unless a named person accepts it (KDEC-014) through the weakening record --
      # weakening_authority (the accepter), weakening_reason, weakening_expires (YYYY-MM-DD) --
      # and this job's GitHub environment requires reviewers. A gap on an UNVERIFIED range is
      # recorded and proceeds until a seeded corpus proves the range.
      advisory_causes: ${{ needs.security.outputs.advisory_causes }}
      # What the policy register demands of this environment's reviewers (named groups, self-review
      # prevented). The deploy reads the environment's protection rules back and, at uat/prod,
      # refuses before login when they fall short; empty still demands one reviewer there.
      deploy_approval: ${{ needs.security.outputs.deploy_approval }}
      # KDEC-018: the authority's renewal cap. A version-gap exception carries its prior grants in
      # weakening_renews ([{ticket, approver, from, expires}]); renewed more often, it is refused.
      max_exception_renewals: ${{ needs.security.outputs.max_exception_renewals }}
      resource_group: ${{ vars.KIT_RESOURCE_GROUP }}
      containerapp_name: ${{ vars.KIT_APP_NAME }}
      acr_login_server: ${{ vars.KIT_ACR_LOGIN_SERVER }}
      image_repository: ${{ vars.KIT_IMAGE_REPOSITORY }}
      image_digest: ${{ needs.build.outputs.image_digest }}   # immutable reference
      version_metadata: ${{ needs.verdict.outputs.version_metadata }}   # the stamp, not just the digest
      cloud: ${{ vars.KIT_CLOUD || 'commercial' }}
      health_path: /health
      rollback_on_failure: true
      # KDEC-029: what makes this deploy "tested", and the identity the build proved.
      artifact_identity: ${{ needs.build.outputs.artifact_identity }}
      e2e_test_command: ${{ vars.KIT_E2E_TEST_COMMAND }}
      dast_command: ${{ vars.KIT_DAST_COMMAND }}
      release_path: ${{ inputs.release_path || 'normal' }}
    secrets:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID }}

  # ── dev and test, IN PARALLEL, from the ONE build of a merge to main (KDEC-029) ──
  # Two independent jobs: each needs only the build and the verdict, never the other, and each
  # writes its own promotion record (kit-promotion-record-<environment>). Promotion later checks
  # the specific predecessor's record for this exact digest; a dev success never satisfies it.
  deploy-dev:
    needs: [security, build, verdict]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.verdict.outputs.deploy_allowed == 'true'
    uses: YOUR_ORG/secure-cicd-kit/.github/workflows/reusable-deploy-containerapp.yml@0000000000000000000000000000000000000000   # pin a commit SHA
    permissions:
      contents: read
      id-token: write
      attestations: read
      actions: read
    with:
      github_environment: dev
      attestation_signer_workflow: YOUR_ORG/secure-cicd-kit/.github/workflows/reusable-build-docker.yml
      attestations_available: ${{ vars.ATTESTATIONS_AVAILABLE == 'true' }}
      environment_tier: ${{ vars.KIT_ENVIRONMENT_TIER }}  # empty here: filled from the dev environment
      routing_result: ${{ needs.verdict.outputs.deploy_routing_result }}
      controls_unavailable: ${{ needs.security.outputs.controls_unavailable }}
      advisory_causes: ${{ needs.security.outputs.advisory_causes }}
      deploy_approval: ${{ needs.security.outputs.deploy_approval }}
      max_exception_renewals: ${{ needs.security.outputs.max_exception_renewals }}
      resource_group: ${{ vars.KIT_RESOURCE_GROUP }}
      containerapp_name: ${{ vars.KIT_APP_NAME }}
      acr_login_server: ${{ vars.KIT_ACR_LOGIN_SERVER }}
      image_repository: ${{ vars.KIT_IMAGE_REPOSITORY }}
      image_digest: ${{ needs.build.outputs.image_digest }}
      version_metadata: ${{ needs.verdict.outputs.version_metadata }}
      cloud: ${{ vars.KIT_CLOUD || 'commercial' }}
      health_path: /health
      rollback_on_failure: true
      artifact_identity: ${{ needs.build.outputs.artifact_identity }}
      e2e_test_command: ${{ vars.KIT_E2E_TEST_COMMAND }}
      dast_command: ${{ vars.KIT_DAST_COMMAND }}
    secrets:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID }}

  deploy-test:
    needs: [security, build, verdict]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.verdict.outputs.deploy_allowed == 'true'
    uses: YOUR_ORG/secure-cicd-kit/.github/workflows/reusable-deploy-containerapp.yml@0000000000000000000000000000000000000000   # pin a commit SHA
    permissions:
      contents: read
      id-token: write
      attestations: read
      actions: read
    with:
      github_environment: test
      attestation_signer_workflow: YOUR_ORG/secure-cicd-kit/.github/workflows/reusable-build-docker.yml
      attestations_available: ${{ vars.ATTESTATIONS_AVAILABLE == 'true' }}
      environment_tier: ${{ vars.KIT_ENVIRONMENT_TIER }}  # empty here: filled from the test environment
      routing_result: ${{ needs.verdict.outputs.deploy_routing_result }}
      controls_unavailable: ${{ needs.security.outputs.controls_unavailable }}
      advisory_causes: ${{ needs.security.outputs.advisory_causes }}
      deploy_approval: ${{ needs.security.outputs.deploy_approval }}
      max_exception_renewals: ${{ needs.security.outputs.max_exception_renewals }}
      resource_group: ${{ vars.KIT_RESOURCE_GROUP }}
      containerapp_name: ${{ vars.KIT_APP_NAME }}
      acr_login_server: ${{ vars.KIT_ACR_LOGIN_SERVER }}
      image_repository: ${{ vars.KIT_IMAGE_REPOSITORY }}
      image_digest: ${{ needs.build.outputs.image_digest }}
      version_metadata: ${{ needs.verdict.outputs.version_metadata }}
      cloud: ${{ vars.KIT_CLOUD || 'commercial' }}
      health_path: /health
      rollback_on_failure: true
      artifact_identity: ${{ needs.build.outputs.artifact_identity }}
      e2e_test_command: ${{ vars.KIT_E2E_TEST_COMMAND }}
      dast_command: ${{ vars.KIT_DAST_COMMAND }}
    secrets:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID }}

  # ── PROMOTE digest X from run Y / environment Y into uat or prod. No build. ──
  # The source job only READS the predecessor's record (actions: read, no identity) to hand the
  # deploy the digest, the verdict and the stamp the record carries. The deploy reusable's own
  # promotion gate then re-reads that record and refuses, naming the reason, unless it holds.
  promotion-source:
    if: github.event_name == 'workflow_dispatch' && inputs.promote_from_run_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      image_digest: ${{ steps.read.outputs.image_digest }}
      routing_result: ${{ steps.read.outputs.routing_result }}
      version_metadata: ${{ steps.read.outputs.version_metadata }}
      artifact_identity: ${{ steps.read.outputs.artifact_identity }}
      controls_unavailable: ${{ steps.read.outputs.controls_unavailable }}
      advisory_causes: ${{ steps.read.outputs.advisory_causes }}
    steps:
      - name: Read the predecessor's promotion record
        id: read
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.promote_from_run_id }}
          SRC: ${{ inputs.promote_from_environment }}
        run: |
          set -euo pipefail
          # KDEC-027: gh's token goes to this run's host only (gh run download defaults to github.com).
          GH_HOST="${GITHUB_SERVER_URL:-https://github.com}"; export GH_HOST="${GH_HOST#*://}"
          name="kit-promotion-record-$(printf '%s' "$SRC" | tr -c 'A-Za-z0-9._-' '-' | cut -c1-40)"
          gh run download "$RUN" -R "$GITHUB_REPOSITORY" -n "$name" -D rec
          r=rec/promotion-record.json
          {
            echo "image_digest=$(jq -r '.artifact.digest // ""' "$r")"
            echo "routing_result=$(jq -r '.provenance.gate_routing_result // ""' "$r")"
            echo "version_metadata=$(jq -c -r '.artifact.version_metadata // ""' "$r")"
            echo "artifact_identity=$(jq -r '.artifact.artifact_identity // ""' "$r")"
            echo "controls_unavailable=$(jq -r '(.provenance.controls_unavailable // []) | join(",")' "$r")"
            echo "advisory_causes=$(jq -r '(.provenance.advisory_causes // []) | join(",")' "$r")"
          } >> "$GITHUB_OUTPUT"

  promote:
    needs: [promotion-source]
    if: github.event_name == 'workflow_dispatch' && inputs.promote_from_run_id != ''
    uses: YOUR_ORG/secure-cicd-kit/.github/workflows/reusable-deploy-containerapp.yml@0000000000000000000000000000000000000000   # pin a commit SHA
    permissions:
      contents: read
      id-token: write
      attestations: read
      actions: read
    with:
      github_environment: ${{ inputs.environment }}      # uat or prod; approvals live on the Environment
      promote_from_run_id: ${{ inputs.promote_from_run_id }}
      promote_from_environment: ${{ inputs.promote_from_environment }}
      # Product policy: prod's predecessor is test or uat (default test); uat's is always test.
      promotion_predecessor: ${{ inputs.environment == 'uat' && 'test' || vars.KIT_PROMOTION_PREDECESSOR || 'test' }}
      release_path: ${{ inputs.release_path || 'normal' }}
      weakening_reason: ${{ inputs.exception_reason }}
      weakening_authority: ${{ inputs.exception_authority }}
      weakening_exception_ref: ${{ inputs.exception_ref }}
      weakening_expires: ${{ inputs.exception_expires }}
      attestation_signer_workflow: YOUR_ORG/secure-cicd-kit/.github/workflows/reusable-build-docker.yml
      attestations_available: ${{ vars.ATTESTATIONS_AVAILABLE == 'true' }}
      environment_tier: ${{ vars.KIT_ENVIRONMENT_TIER }}
      routing_result: ${{ needs.promotion-source.outputs.routing_result }}
      controls_unavailable: ${{ needs.promotion-source.outputs.controls_unavailable }}
      advisory_causes: ${{ needs.promotion-source.outputs.advisory_causes }}
      artifact_identity: ${{ needs.promotion-source.outputs.artifact_identity }}
      resource_group: ${{ vars.KIT_RESOURCE_GROUP }}
      containerapp_name: ${{ vars.KIT_APP_NAME }}
      acr_login_server: ${{ vars.KIT_ACR_LOGIN_SERVER }}
      image_repository: ${{ vars.KIT_IMAGE_REPOSITORY }}
      image_digest: ${{ needs.promotion-source.outputs.image_digest }}   # the SAME digest, never rebuilt
      version_metadata: ${{ needs.promotion-source.outputs.version_metadata }}
      cloud: ${{ vars.KIT_CLOUD || 'commercial' }}
      health_path: /health
      rollback_on_failure: true
      # uat (a possible prod predecessor) runs the active checks; prod runs passive checks only and
      # refuses DAST before login.
      e2e_test_command: ${{ inputs.environment != 'prod' && vars.KIT_E2E_TEST_COMMAND || '' }}
      dast_command: ${{ inputs.environment != 'prod' && vars.KIT_DAST_COMMAND || '' }}
    secrets:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID }}

  # ── BREAK-GLASS: the testing it owes is scanned for and ticketed at once, then daily ──
  break-glass-scan:
    needs: [promote]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.release_path == 'break-glass' && needs.promote.result == 'success'
    uses: YOUR_ORG/secure-cicd-kit/.github/workflows/reusable-deployed-scan.yml@0000000000000000000000000000000000000000   # pin a commit SHA
    permissions:
      contents: read
      id-token: write
      actions: read
    with:
      environments: ${{ format('["{0}"]', inputs.environment) }}
    secrets:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID }}

  break-glass-tickets:
    needs: [break-glass-scan]
    if: always() && needs.break-glass-scan.result == 'success'
    permissions:
      contents: read
    uses: YOUR_ORG/secure-cicd-kit/.github/workflows/reusable-ticket-reconcile.yml@0000000000000000000000000000000000000000   # pin a commit SHA
    with:
      backend: jira
      environment: ticketing
      default_branch: main
      mode: reconcile
      findings_artifact: ${{ needs.break-glass-scan.outputs.findings_artifact }}
      apply: true
      kit_repository: YOUR_ORG/secure-cicd-kit
      kit_ref: "0000000000000000000000000000000000000000"   # the same commit as the pin above
    secrets:
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
