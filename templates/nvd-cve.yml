# Consumer template — NVD CVE scanning.
# Copy to .github/workflows/nvd-cve.yml in the consuming repo, replace YOUR_ORG, and pin the kit by
# its 40-hex commit SHA (a branch or moving tag means the result came from code nobody chose).
#
# NVD data: by default the NVD database is built from the Dependency-Check project's public
#   datafeed (https://dependency-check.github.io/DependencyCheck_Builder/nvd_cache/). Unless the
#   organisation's Release 4 mirror is configured (vars.KIT_FEED_MIRROR_URL, docs/adoption/FEED_MIRRORS.md),
#   the runner needs egress to that third-party host.
# NVD_API_KEY is used only if you set nvd_datafeed_url to "" (the NVD API directly; without a key
#   that update is rate-limited, 20-40 minutes). Free: https://nvd.nist.gov/developers/request-an-api-key
#   A repository or organisation secret is passed as below. If the key is an ENVIRONMENT secret,
#   also pass `github_environment: <env>` -- a caller job cannot declare an environment, and
#   `secrets: inherit` does not carry environment secrets on its own.
#
# fail_on_cvss defaults to 9.0: a Dependency-Check finding at CVSS 9.0 or above fails the scan.
# Raising it is a softened gate the posture record names; above 10 nothing can block. Read the
# verdict from the `routing_result` output.

name: NVD CVE Scan

on:
  pull_request:
  schedule:
    - cron: "0 5 * * *"   # daily, after NVD publishes
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  cve:
    uses: YOUR_ORG/secure-cicd-kit/.github/workflows/reusable-nvd-cve.yml@0000000000000000000000000000000000000000   # pin a commit SHA
    with:
      scan_paths: "."
      # Dependency-Check is slow on a cold cache. Common pattern: full scan on the
      # schedule, Trivy-only on PRs.
      enable_dependency_check: ${{ github.event_name != 'pull_request' }}
      trivy_fail_severities: ""     # start report-only; tighten when the backlog is triaged
      fail_on_cvss: 9.0             # the shipped default (O-12); a higher value softens the gate
    secrets:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
