# ASSURANCE TAXONOMY — the authoritative controlled vocabulary for this kit.
#
# WHY THIS FILE EXISTS
#
# These words drive enforcement. `UNAVAILABLE` decides whether a build blocks; `PARTIAL` decides
# whether a claim was established; `ACCEPTED_RISK` decides whether a real secret finding is allowed
# to pass. They were being used across fourteen files with no definition anywhere, and two disposition
# classes existed only in conversation.
#
# The failure this prevents is specific and has already happened here: the same decisions were
# recorded in two places, one went stale, and the stale one looked authoritative. A vocabulary
# scattered across prose has exactly that shape.
#
# THE RULE THAT MATTERS MOST — `consumers`:
#   A term is violated not only by misuse but by SILENT RE-INTERPRETATION downstream. If `PARTIAL`
#   means "claim not established" in a scanner and a dashboard later rounds it into `PASS`, the
#   taxonomy has been broken even though every word used was valid. Each term therefore names who is
#   allowed to consume it and what they may conclude.
#
# Reconciled by `scripts/reconcile_taxonomy.py`, run in self-test: a taxonomy-shaped token used in
# the kit but absent here is drift and fails the build.

meta:
  version: 1
  introduced: 2026-08-21
  owner: kit-maintainer
  supersedes: >-
    Scattered definitions in FINDING_CLASSIFICATION.md, VALIDATION_DEBT.md, LANDMINES.md,
    CAPABILITY_MATRIX.md, workflow comments and commit messages. Those remain as EXPLANATION;
    this file is the AUTHORITY. Where they disagree, this wins and the other is a defect.

# ─────────────────────────────────────────────────────────────────────────────
# THE EPISTEMIC INTEGRITY CONTRACT
#
# Every invariant below is a consequence of one commitment:
#
#   THE THING REMAINS WHAT IT CLAIMS TO BE.
#
#   Evidence does not become a conclusion it does not support. A degraded system does not
#   acquire authority it did not have. A failure does not disguise itself as absence. A decision
#   does not quietly lose its rationale. An exception does not rewrite history. Documentation does
#   not claim implementation. A control does not claim coverage it could not observe. And when new
#   evidence proves the model wrong, THE MODEL CHANGES rather than being defended.
#
#   Degradation may reduce available information, confidence, or authority. It must NEVER rewrite
#   what remains known, erase relevant distinctions, or represent lost knowledge as knowledge.
#
# WHICH DISTINCTIONS MUST SURVIVE
#
# The test is NOT "does this distinction change whether the gate blocks". Enforcement is one
# consumer among many. The test is:
#
#   Would collapsing this distinction change the TRUTH, the MEANING, the INTERPRETATION, the
#   OPERATIONAL RESPONSE, the CONTINUITY, the TRUST, or the CONFIDENCE in what the system knows?
#
# If yes to ANY of those, the distinction is preserved at the canonical boundary. An individual
# consumer may then say "I do not need that distinction for my decision". It does not get to erase
# it for everyone else.
#
#   DECISION CARDINALITY DOES NOT DETERMINE EVIDENCE CARDINALITY.
#
# Two enforcement outcomes (BLOCK / ALLOW) do not mean the evidence model contains two states.
# `grep` returning 0/1/2 matters to operations (did the tool break), to assurance (did observation
# succeed), to logging, to continuity (why was the last run classified differently), to a human
# (fix code or fix infrastructure), and to a machine (is retry sensible) -- even where the final
# policy projects all of it onto two actions.
#
# ─────────────────────────────────────────────────────────────────────────────
# GOVERNING INVARIANTS — these bind every namespace below.
#
# They exist because the states alone were not enough: a correct producer still
# participated in a false result when its consumer assigned semantics to missing output.
invariants:

  authority_never_grows_from_loss:
    statement: >-
      Degradation may reduce the SCOPE or CONFIDENCE of a claim. It must NEVER increase its
      AUTHORITY. Loss of evidence must not accidentally expand what the system is entitled to
      assert.
    consequence: >-
      A downstream stage may PRESERVE or REDUCE the certainty established upstream. It may not
      INCREASE certainty without new evidence. Plumbing cannot manufacture certainty.
    illegal_without_new_evidence:
      - "COLLECTION_FAILED -> PASS"
      - "PARTIAL -> COMPLETE"
      - "UNDETERMINED -> PASS"
      - "UNAVAILABLE -> NOT_APPLICABLE"
    note: >-
      Broader than this kit. It applies to agents, identity, continuity and governance: authority
      must degrade with certainty, never grow because certainty disappeared.

  a_node_is_not_a_path:
    statement: >-
      A CAPABILITY IS NOT ESTABLISHED UNTIL EVERY REQUIRED EDGE IN ITS CHAIN HAS A CONSUMER.
      A producer that emits an artifact nobody reads is a node, not a path. In graph terms:
      NODE EXISTS != PATH EXISTS.
    consequence: >-
      "We produce an SBOM" is true and answers nothing if no stage reads the licence data it
      carries. The capability exists only across the whole chain --
      produce -> consume -> interpret -> surface -> govern -- and is absent if any edge is
      missing, however complete the nodes look individually.
    observed:
      - "collection_time.py emitted freshness and coverage; build_requirement_matrix did not read it, so COLLECTED_STALE was in the vocabulary with nothing able to reach it"
      - "chunk_evidence.py emitted a record-set fingerprint per worksheet; build_evidence_families grouped per file and never opened SCHEMA_INDEX.csv"
      - "syft emitted CycloneDX and SPDX, both carrying licence data; nothing in the kit read either"
      - "three scanner jobs existed and were absent from the gate's needs -- they could not fail anything"
      - "a roadmap marked a ladder rung BUILT on the strength of its producer alone"
    why_checks_miss_it: >-
      A tool-presence check passes through every one of these. verify_env's roadmap-vs-tree gate
      verifies that TOOLS EXIST, not that CAPABILITIES ARE WIRED -- a gate that checks the wrong
      noun is worse than none, because it gets quoted as coverage.
    test: >-
      Before marking a capability built, NAME ITS CONSUMER and show the consumer reading it.
      Generating an artifact is not using it.
    note: >-
      Broader than this kit. The same shape applies to agent governance -- a rule an agent loads
      and does not act on, a landmine register nothing checks before the danger zone, a handoff
      written and never read on resume.

  absence_is_not_a_negative_observation:
    statement: >-
      Failure to determine a value MUST NOT be represented as a successfully determined negative
      value.
    distinguish:
      - "executed, valid report, zero findings   -> EVIDENCE"
      - "did not execute, no report              -> ABSENCE OF EVIDENCE"
      - "executed, malformed report              -> FAILED COLLECTION"
      - "could not inspect scope                 -> FAILED APPLICABILITY DETERMINATION"
    note: >-
      These are not variations of zero. Seventeen sites collapsed them into `0`, and the fix for
      those sites was itself defeated one boundary later by `${n:-0}`.

  partial_is_not_total_ignorance:
    statement: >-
      A capability failing does not erase what other capabilities established. Preserve everything
      still established and NAME what became unknown.
    rule: >-
      UNDETERMINED is reserved for failure of the AGGREGATE claim -- e.g. discovery failed, so the
      set of capabilities that should have run is unknown, and therefore what was NOT scanned cannot
      be known. Individual capability failure yields PARTIAL, with `established` and `unestablished`
      both reported.
    counter_examples:
      - "A failed Bandit does not un-find a Trivy finding."
      - "A passing Semgrep does not fill Bandit's hole."

  correctness_is_not_local:
    statement: >-
      A claim is not correct because its producer is correct. It is correct when it survives every
      downstream boundary that consumes it.
    consequence: >-
      A fix is COMPLETE only when the resulting claim remains correct through every consumer. Not
      when the defective component behaves correctly.
    evidence: >-
      The producer was fixed to refuse inventing a zero and to exit non-zero. The consumer, running
      on always(), read the absent output and defaulted it to zero -- reconstructing the exact lie
      the producer had just refused to tell, and announcing GATE=PASS one line later.

  defaults_are_suspicious_at_assurance_boundaries:
    statement: >-
      There is NO implicit default from unknown to known. A missing count is not 0. A missing state
      is not PASS. A missing applicability result is not NOT_APPLICABLE.
    rule: >-
      Every assurance-bearing value must be traced producer -> consumer: who emits it, when it can
      be absent, who reads it, what the reader does when it is absent or invalid, and what final
      state results.

namespaces:

  # ─────────────────────────────────────────────────────────────────────────
  projection:
    description: >-
      Consumers legitimately reduce rich evidence into smaller state spaces. A policy gate may
      project a dozen evidence states onto BLOCK | ALLOW. An operator needs PASS | FINDINGS |
      COLLECTION_FAILED | UNAVAILABLE | EXECUTION_TIMEOUT. An orchestrator needs enough to choose
      retry | continue-degraded | stop | escalate. A reviewer needs provenance and disposition
      history. A continuity mechanism needs enough to reconstruct why the previous state was
      believed.
    rule: >-
      NONE of those projections is dishonest. THE INTEGRITY VIOLATION IS A LOSSY PROJECTION
      MASQUERADING AS THE RICHER STATE IT CAME FROM.
    generalizes:
      - "COLLECTION_FAILED -> count=0 was not wrong because projection is forbidden. It was wrong
         because UNKNOWN OBSERVATION became KNOWN ABSENCE."
      - "PARTIAL -> PASS was not bad terminology. REDUCED EVIDENCE became INCREASED EPISTEMIC
         AUTHORITY."
      - "continue-on-error is not inherently dangerous. It is dangerous when EXECUTION POLICY
         consumes the failure while EVIDENCE SEMANTICS forget it happened."
    falsification_question: >-
      For every boundary: what distinctions existed BEFORE it, which disappear AFTER it, and is
      every lost distinction intentionally irrelevant to EVERY downstream claim -- or preserved
      elsewhere? That is a considerably nastier test than "does the output look right".

  # ─────────────────────────────────────────────────────────────────────────
  epistemic_property:
    description: >-
      Three properties routinely conflated, two of which are usually expressed as percentages.
      Keeping them apart matters before anyone builds a dashboard reading "Trust: 94%".
    consumers: [reporting, future dashboards, audit, any consumer deciding how much to rely on us]
    values:
      INTEGRITY:
        definition: >-
          Does the system preserve truth and meaning faithfully -- including inconvenient truth
          about its own limitations?
        compositional: >-
          NOT a percentage, and NOT merely "upheld or violated at each boundary" -- an earlier
          version of this entry said exactly that and was wrong. Individual integrity OBLIGATIONS
          are testable. SYSTEM integrity is the continuing property that claims, evidence, meaning,
          authority and provenance remain faithful ACROSS COMPOSITION.
        proof_it_is_compositional: >-
          The counting step upheld its local contract perfectly -- it refused to invent a zero and
          exited non-zero. The consuming step then defaulted the absent output to zero and announced
          PASS. Every boundary honoured its own contract; the composed claim was false, because the
          contract itself was insufficient.
        forbidden: >-
          "47 of 50 integrity checks passed = 94% INTEGRITY". Integrity does not average. A system
          that preserves truth at 94% of its boundaries can still emit an entirely false claim
          through the other three.
        note: >-
          Integrity comes BEFORE trust. Trust is an accumulated consequence of repeatedly preserving
          truth, including truth about limitations.
      CONFIDENCE:
        definition: How strongly does available evidence support THIS PARTICULAR claim?
        requires: >-
          A confidence figure without provenance is numerology with an API. It must be answerable:
          confidence in WHAT claim, based on WHICH evidence, diminished by WHICH missing
          observations, computed under WHICH model, at WHAT time.
      TRUST:
        definition: >-
          Based on accumulated experience, how willing should a consumer be to rely on this system
          and its claims?
        note: >-
          High confidence in one observation from a system you do not trust is coherent. So is
          trusting a system while holding low confidence in one result because half its sensors
          fell over. Repeated INTEGRITY failures must erode trust even when individual outputs
          happen to be correct.

  # ─────────────────────────────────────────────────────────────────────────
  suppression_reason:
    description: >-
      Why an error-suppressing idiom exists. Recorded per site, because "acceptable" without a
      reason is how someone later "cleans up" a continue-on-error and publication starts killing
      detection again.
    consumers: [the suppression linter, reviewers, anyone tempted to tidy]
    rule: >-
      Legitimate suppression must be ANNOTATED, not outlawed. A lint that forbids syntax becomes a
      chore; a lint that requires a stated reason becomes a record.
    permissibility_test: >-
      Suppression is permissible ONLY when the suppressed signal is either NON-SEMANTIC for every
      relevant consumer, or its semantic information is PRESERVED THROUGH ANOTHER EXPLICIT CHANNEL.
      Stating a reason is not sufficient. The annotation must identify WHAT DISTINCTION IS BEING
      DISCARDED and WHERE IT SURVIVES.
    required_annotation_fields:
      reason: one of the values below
      discards: what information can disappear at this point
      preserved_by: >-
        where that information still survives -- an exit-status check, a captured outcome, a state
        output, an artifact -- or the explicit statement that it is non-semantic for every consumer
    relevant_consumers: >-
      enforcement, operations, humans, downstream machines, evidence and provenance, continuity and
      recovery, confidence, and future audit or reconstruction. Not every distinction needs every
      consumer -- but somebody must ESTABLISH that before the information is thrown away.
    worked_example: >-
      `2>/dev/null` is fine when stderr is noisy presentation and exit status is captured. It is NOT
      fine when stderr is the only place we would learn the scanner could not authenticate.
    values:
      PRESENTATION_ONLY:
        definition: Suppresses noisy output. Exit status and failure state survive intact.
      EXPECTED_NEGATIVE_RESULT:
        definition: >-
          A nonzero exit that means "nothing found", not "something broke" -- and the DISTINCTION
          between them is handled explicitly.
        warning: >-
          This is where `grep -c` went wrong: exit 1 means no-match, exit 2 means the tool failed,
          and `|| echo 0` collapsed both. A multi-state dependency was projected into a boolean
          before its states were understood.
      FAILURE_ISOLATION_WITH_STATE_CAPTURE:
        definition: >-
          Execution continues so siblings can still produce evidence, AND the failure is captured
          as explicit state that propagates.
        rule: >-
          `continue-on-error` is only correct when THE ERROR BECOMES DATA. If nobody captures the
          outcome and maps it into the taxonomy, it is `|| true` wearing YAML.
      CLEANUP_AFTER_FAILURE:
        definition: >-
          Must run after failure to preserve evidence or release resources. Makes no new assurance
          claim.
        rule: >-
          A step running under always() may preserve evidence, record failure state, run an
          independent scanner, or summarise known states. It may NEVER turn missing upstream output
          into a successful state.
      UNSAFE:
        definition: The signal that determines truth is destroyed. Not acceptable; fix it.

  # ─────────────────────────────────────────────────────────────────────────
  observation_quality:
    description: >-
      What a CONTROL knows about the thing it inspected. Added after the assurance dataflow tracer
      reported a handoff as a defect purely because it could not see inside a third-party action --
      the control hallucinating certainty from incomplete observability, which is the same sin the
      control existed to detect, in a more sophisticated costume.
    consumers: [every analysis or control layer, now and future]
    rule: >-
      UNVERIFIABLE is not ABSENT and neither is WRONG. A control must distinguish what it observed,
      what it observed to be missing, and what it could not observe at all -- and must never
      silently downgrade the third into either of the other two.
    values:
      VERIFIED:
        definition: The control observed the thing and it holds.
      VERIFIED_ABSENT:
        definition: The control observed that the thing is genuinely not there. A real negative.
      WRONG:
        definition: The control observed the thing and it violates the contract. A real defect.
      RUNTIME_VERIFIED:
        definition: >-
          Established by evidence from an actual run rather than by static inspection.
        rule: >-
          STATICALLY_UNVERIFIABLE is not GLOBALLY UNVERIFIABLE. Observability has SCOPE, and a
          control must not let its own mechanism's limit masquerade as a property of the world.
          A handoff a parser cannot see may still be proven by a runtime assertion or a contract
          fixture.
      PRODUCER_UNVERIFIED_EXTERNALLY_DECLARED:
        definition: >-
          The control could not observe this because the producing component declares its own
          interface elsewhere -- e.g. a third-party action whose outputs are not visible to a
          workflow parser.
        rule: >-
          MUST be reported as a declared observability limit. Reporting it as a defect trains people
          to ignore the control; reporting it as a pass makes the control lie. Neither is available.
        closing_options:
          - action metadata inspection
          - runtime assertion at the boundary
          - contract fixture exercising the real handoff
          - explicitly accepted external dependency assumption
        note: >-
          Choose one deliberately. Do not let silence choose.
      DISTINCTION_OBSERVABLE:
        definition: >-
          The control established that its OWN CHANNEL can tell two adjacent outcomes apart,
          proven by a calibration probe whose answer is known in advance rather than assumed
          from the channel's documentation.
        rule: >-
          Only a control that has DEMONSTRATED the distinction may report either side of it at
          full strength.
      DISTINCTION_NOT_OBSERVABLE:
        definition: >-
          The control established that its channel COLLAPSES two outcomes it is required to keep
          apart. Azure returns 403 for a resource group that does not exist whenever the caller
          holds no subscription-level read, so "denied" and "absent" arrive identically.
        rule: >-
          The result STILL HOLDS, at the reduced strength it actually has. It must be neither
          reported at full strength nor discarded. A refusal observed through a collapsed channel
          proves the name is unreachable; it does not prove the name denotes a real thing.
          Restoring the distinction needs a SECOND observer with different authority, so this
          value is a routing instruction to correlate, not a licence to stop reporting.

  # ─────────────────────────────────────────────────────────────────────────
  scanner_state:
    description: What a single scanner established about the code it was pointed at.
    consumers: [security-gate, capability-matrix, future findings model]
    rule: >-
      Every scanner reports its OWN state. After job consolidation job != scanner, so a job-level
      result must never stand in for one of these.
    values:
      PASS:
        definition: Executed, completed, found nothing.
        enforcement: does not block
      FINDINGS:
        definition: Executed, completed, found something. The control WORKED.
        enforcement: blocks unless policy says otherwise; secrets block regardless
        note: A true finding is a pipeline SUCCESS and a repository failure. Different events.
      PARTIAL:
        definition: Executed, but a prerequisite was missing so the security CLAIM is NOT established.
        enforcement: warns; does not block
        forbidden: >-
          MUST NOT be projected, summarised or rounded into PASS by any downstream consumer.
          "Not established" is not "clean".
      NOT_APPLICABLE:
        definition: Nothing of this kind exists in scope. MUST be backed by a search that found nothing.
        enforcement: does not block
        forbidden: >-
          MUST NOT be produced by a toggle being off, by a selector excluding it, or by discovery
          failing. Those are EXCLUDED_BY_SELECTOR, disabled, and DISCOVERY_UNAVAILABLE.
      FAILED:
        definition: The scanner ran and MALFUNCTIONED.
        enforcement: blocks
      COLLECTION_FAILED:
        definition: >-
          The scanner ran, but gathering its results failed -- producing an EMPTY BUT WELL-FORMED
          output that is indistinguishable from a clean scan.
        enforcement: blocks
        rule: >-
          Emit COLLECTION_FAILED or UNKNOWN. NEVER an empty success. Found missing from this
          registry by the reconciler; it was already enforced in validate-scanners and defined
          nowhere -- an empty result that reads as clean is the whole failure family in one line.
      UNAVAILABLE:
        definition: The scanner never ran. Posture cannot be determined from this run.
        enforcement: blocks
        requires: [execution_unavailable_reason]
        note: Not a finding, not clean, not a scanner defect. A fourth thing.

  # ─────────────────────────────────────────────────────────────────────────
  # ─────────────────────────────────────────────────────────────────────────────
  # ─────────────────────────────────────────────────────────────────────────────
  version_applicability:
    description: >-
      Whether a control can meaningfully inspect the version of the thing in front of it. Emitted
      by the resolve composite (.github/actions/resolve) since 2026-10-15; this entry said "NOT
      implemented" until 2026-10-16. See D6.
    consumers: [discover, resolve, security-gate]
    rule: >-
      A SCANNER THAT RAN IS NOT A SCANNER THAT COULD READ THE INPUT. Version support is established
      or it is a gap; it is never assumed from the scanner having exited zero.
    values:
      VERSION_DISCOVERED:
        definition: The version the REPOSITORY targets was established -- from a pin file, a manifest or a declared requirement.
        rule: >-
          Distinct from the version the runner installed. A repo can target 3.13 while the workflow
          sets up 3.11, and then every scanner is reading code written for a version it was never
          handed.
      SCANNER_SUPPORTS:
        definition: This scanner declares it can process the discovered target version.
        rule: >-
          Declared PER SCANNER, never kit-wide. bandit, semgrep, CodeQL, gosec and trivy each have
          their own range, and a single shared table would be a convenient fiction whose first
          exception is silently wrong.
      VERSION_UNSUPPORTED:
        definition: The target version is outside what this scanner can process. A COVERAGE_GAP, not a clean result.
        rule: >-
          The code is here, a control is owed, THE CONTROL RAN, and it could not see. The state a
          green run hides best -- the scanner exits zero having skipped or mis-parsed the file, and
          zero findings is indistinguishable from clean unless the version question was asked first.
      VERSION_SUPPORT_UNDETERMINED:
        definition: A scanner exists and its compatibility with the target version could not be established.
        rule: >-
          Treated as a gap, never as support. Could-not-establish is not established-absent and is
          certainly not established-present -- the same rule as a failed discovery probe.
      VERSION_GAP:
        definition: >-
          No scanner the kit carries for this capability can read the root at its target version
          (every candidate is VERSION_UNSUPPORTED or VERSION_SUPPORT_UNDETERMINED). KDEC-010.
        rule: >-
          The scan still runs where it can, the result is annotated with the gap and the registry row
          that would close it, and the job is capped at PARTIAL -- never PASS. Its findings still
          count. Closed by data (a READ range from a seeded corpus), never by relabelling.
      PLATFORM_UNAVAILABLE:
        definition: >-
          A candidate scanner declares a range that could read the target, but the platform
          withdrew the job on this repository (e.g. code scanning UNAVAILABLE for CodeQL), so it
          cannot be selected. Emitted by the resolve composite per (capability, root).
        rule: >-
          A declared range is not a scanner that can be reached: never capable, never selected.
          It describes the PRE-FLIGHT only; a job that ran and retained its analysis anyway is
          read from its own evidence (docs/KNOWN_DEFECTS.md D-10).
      NOT_SELECTED:
        definition: >-
          This scanner cannot read the root at its target version and another carried scanner that
          can was selected instead (a SUBSTITUTION). KDEC-010.
        rule: >-
          The not-selected scanner's own PASS renders PARTIAL for that root; the substitute's result
          is labelled a substitution and is never presented as equivalent coverage.

  # ─────────────────────────────────────────────────────────────────────────────
  corpus_family_outcome:
    description: >-
      What a seeded-corpus probe (tests/corpora/probe_php_corpus.py) observed for one version
      family's file: READ (the seed reported, no error), MISSED (no seed and no error -- a silent
      drop), COLLECTION_FAILED (no report it can be held to), or PARSE_ERROR, below. Only READ
      families extend a measured range; the range is contiguous from the oldest family.
    consumers: [tests/corpora/probe_php_corpus.py, tests/prove_php_corpus.py, scanner-registry.yaml version_support basis]
    rule: >-
      A FAMILY THE SCANNER SAID IT COULD NOT FULLY PARSE IS NOT READ, even when the seed came back
      through error recovery. Measured on Semgrep 1.90.0: such a file exits 3 under --strict, which
      the job reads as COLLECTION_FAILED, so counting it as read would claim a range the job fails on.
    values:
      PARSE_ERROR:
        definition: >-
          The scanner reported an error naming the family's file (a syntax error, or Semgrep's
          PartialParsing): by its own account it did not read all of the file.
        rule: >-
          Never READ and never MISSED: it is loud where MISSED is silent, and it caps the range at
          the family below it exactly as a silent drop does.

  # ─────────────────────────────────────────────────────────────────────────────
  toolchain_currency:
    description: >-
      Whether the tools the pipeline itself runs are current, supported and safe to keep running.
      NOT implemented; declared so the vocabulary exists before two implementations do. See D7.
    consumers: [toolchain inventory, release promotion]
    rule: >-
      "NEWER EXISTS" IS NOT "UPGRADE NOW". An upgrade changes detection, so it may not promote until
      the seeded corpus proves the new version still detects what the old one did.
    values:
      CURRENT:
        definition: Running a supported, reasonably recent version.
      UPDATE_AVAILABLE:
        definition: A newer release exists and nothing forces taking it.
        rule: A backlog item, not a finding. Distinguishing this from the next one is the whole point.
      SECURITY_UPDATE_REQUIRED:
        definition: The version gap is itself the vulnerability.
        rule: The only currency state that is a finding rather than a backlog item.
      DEPRECATED:
        definition: Still runs; no longer maintained.
      UNSUPPORTED:
        definition: Past end of support. Rule packs and advisories have stopped.
        rule: A scanner nobody maintains still exits zero. Age is invisible in a run log.
      VERSION_UNKNOWN:
        definition: The running version could not be established.
        rule: A gap, never a pass. A tool that cannot say what it is cannot be assessed for currency.
      UPDATE_BLOCKED_BY_COMPATIBILITY:
        definition: A newer version exists and breaks something NAMED.
        rule: >-
          The block must name what breaks. "We cannot upgrade" without a named incompatibility is a
          deferral wearing a technical costume.

  # ─────────────────────────────────────────────────────────────────────────────
  artifact_identity:
    description: >-
      Whether the artefact a control inspected is provably the artefact that was published. Emitted
      by the build workflow beside image_digest, because a bare digest reads as proven to every
      consumer that receives it.
    consumers: [reusable-build-docker.yml, render-version-metadata, tests/check_artifact_identity.py,
                scripts/static_site_contract.py, reusable-deploy-staticwebapp.yml]
    rule: >-
      THREE ANSWERS, NEVER A BOOLEAN. Proven, nothing-was-pushed and could-not-establish are
      different facts, and collapsing them is how an unverified digest inherits a verified reading.
    values:
      REGISTRY_IDENTITY_PROVEN:
        definition: The registry was asked and confirmed the pushed manifest's config digest is the one that was scanned.
        rule: The only value that licenses treating the digest as assurance-bearing.
      LOCAL_BUILD_ONLY:
        definition: Nothing was pushed, so there is no registry claim to agree or disagree with.
        rule: Not a weaker proof. A different question, correctly unanswered.
      IDENTITY_UNVERIFIED:
        definition: A push occurred and the link between scanned and published could not be established.
        rule: >-
          COULD-NOT-ESTABLISH IS NEVER ESTABLISHED. The SBOM is still published, under a name that
          says so -- withholding it loses triage value, mislabelling it manufactures provenance.
      NOT_ESTABLISHED:
        definition: The question was not reached at all — no artefact, or the run never got there.
        rule: Distinct from IDENTITY_UNVERIFIED, which means it was asked and failed.
      # OF-5 K-8 (KDEC-034 PROPOSED): a static site has no registry, so its identity is its CONTENT --
      # the tree digest over every file but the kit-release.json marker (scripts/static_site_contract.py).
      CONTENT_DIGEST_PROVEN:
        definition: >-
          The static-site artefact about to be released was fetched and every file re-hashed before login:
          its tree digest equals site_digest and the digest its marker carries. The static site's
          counterpart of REGISTRY_IDENTITY_PROVEN, and the identity basis its promotion record names.
        rule: Read from the files released, never from the marker alone (a marker is text anyone can write).
      SITE_DIGEST_MISMATCH:
        definition: >-
          The fetched artefact's files do not hash to site_digest, or its marker names another digest:
          the site about to be released is not the one the verdict was given for. Refused before login,
          nothing deployed.
        rule: Never "close enough" -- one changed byte, an added or a renamed file is a different artefact.

  # ─────────────────────────────────────────────────────────────────────────────
  # Registered 2026-10-14 when the mechanism landed (ledger L89), from the lowercase candidates
  # in PROVENANCE_AND_ATTESTATION.md section 10. The fifth value answers that section's open
  # question -- fifth value or reason field -- as a VALUE, because section 6.4 requires plan
  # unavailability to render differently from a missing attestation, and section 6.3 says
  # not-establishable is EVIDENCE_UNTRUSTED "and never anything else".
  attestation_verification:
    description: >-
      What checking a signed build-provenance attestation for a digest established, at deploy time
      (V1), before any mutation. Not artifact_identity: that asks whether two byte-streams inside
      one run are the same; this asks whether a signed third-party statement about a digest checks
      out, far downstream of the run that made it.
    consumers: [.github/actions/verify-attestation, templates/build-deploy.yml,
                tests/prove_attestation_verify.py]
    rule: >-
      FIVE ANSWERS, NEVER A BOOLEAN. absent and contradicted need OPPOSITE treatment (a hole vs an
      alarm); absent and not-establishable are a gap in production vs a control that could not be
      acquired; held-by-plan is a billing fact nobody in the estate can fix. Each maps onto
      routing_result per rung (PROVENANCE_AND_ATTESTATION.md section 6.3); none is a new routing value.
    values:
      ATTESTATION_VERIFIED:
        definition: >-
          Signature valid; subject digest equals the digest being deployed; the expected signer
          workflow signed it; predicate type is the expected one.
        rule: The only value that contributes PROCEED.
      ATTESTATION_ABSENT:
        definition: The lookup succeeded and returned no attestation for this digest.
        rule: >-
          A gap in PRODUCTION, never BLOCKED even at run: blocking it makes every pre-existing image
          undeployable the day the control is switched on. ADVISORY at crawl, DECISION_REQUIRED above.
      ATTESTATION_CONTRADICTED:
        definition: An attestation exists and does not check out (signature, subject, signer or predicate).
        rule: BLOCKED at every rung, crawl included -- an active disagreement, not a severity.
      ATTESTATION_NOT_ESTABLISHABLE:
        definition: The check could not be performed -- unreachable, unauthorised, verifier absent.
        rule: EVIDENCE_UNTRUSTED at every rung and never anything else. Never a pass.
      ATTESTATION_HELD_BY_PLAN:
        definition: >-
          The repository is private and its plan offers no attestations (Free/Pro/Team); the check
          was not armed and the API was not called.
        rule: >-
          NOT ABSENT and NOT NOT_ESTABLISHABLE. Carried as validation_debt_state IMPLEMENTATION_HELD
          whose trigger is the plan, not a date. Renders as advisory, never as a permanent stop and
          never as a clean pass.

  # ─────────────────────────────────────────────────────────────────────────────
  finding_subject:
    description: >-
      What a finding is ABOUT. A finding's subject is not always a digest, and a release is a
      relationship it may carry rather than the identity it is named by.
    consumers: [D5 finding lifecycle, correlation]
    rule: >-
      A FINDING WHOSE SUBJECT IS A RUNNING RESOURCE OUTLIVES EVERY RELEASE THAT TOUCHED IT. Naming
      it by release loses it at the next deploy. See DEPLOYMENT_CONTRACT_RECONCILIATION.md §7.2.
    forbidden: >-
      SOURCE AND SOURCE_DEPENDENCY MUST NOT BE COLLAPSED. They are the two values a tired
      implementation merges, because a dependency finding arrives from a file in the repository
      and so looks like repository state. It is not: the subject is the package coordinate, and
      the manifest that lists it is incidental. Collapsing them is defect D-3 -- SOURCE requires
      a matched construct, a package vulnerability has none, and every dependency finding in the
      estate was therefore unfingerprintable while carrying a perfect advisory id and purl.
    values:
      IMAGE:      {definition: A container image, identified by digest.}
      SOURCE:     {definition: Repository state, identified by commit.}
      SOURCE_DEPENDENCY:
        definition: >-
          A vulnerable PACKAGE COORDINATE declared by something in the repository -- a lockfile,
          a manifest, a project file. The subject is the ecosystem/name/version triple, not the
          file that lists it.
        rule: >-
          Its locus is the purl and NOT the manifest path: `requirements.txt` is the same string
          for every dependency finding in a repository, so including it adds nothing and loses
          every finding when the manifest moves. It has NO matched construct, so CONTENT is a
          declared CONTENT_NOT_APPLICABLE_FOR_SUBJECT read from the specification rather than
          inferred from an absent field -- the same shape as IMAGE, because it is the same kind
          of fact about a different artifact. A dependency finding with no purl REFUSES with
          WHERE_UNDERIVABLE; it does not fall back to the path.
        consumers: [scripts/finding_identity.py, scripts/finding_subject.py, scripts/scan_report.py]
      IAC_PLAN:   {definition: A proposed infrastructure change, identified by plan hash.}
      RESOURCE:   {definition: A deployed cloud resource, identified by resource id.}
      IDENTITY_ASSIGNMENT: {definition: An identity or RBAC grant.}
      RUNTIME_OBSERVATION: {definition: Something observed of a running system, not of an artefact.}
      POLICY:     {definition: A control or policy definition itself.}
      RELEASE:    {definition: The release as an aggregate — used when no narrower subject is the real one.}

  # ─────────────────────────────────────────────────────────────────────────────
  # THE THREE NAMESPACES BELOW ARE THE IDENTITY MODEL'S OWN WORDS.
  #
  # They were driving `scripts/finding_identity.py` and were defined nowhere, which is the exact
  # condition this registry exists to refuse -- and the one most worth refusing here, because a
  # consumer that cannot tell WHY an identity was not computed has no choice but to treat an
  # uncomputable identity as a new finding, which grandfathers nothing and re-raises everything.

  identity_refusal:
    description: >-
      WHY a durable finding identity could not be computed. Returned instead of a hash, never
      beside one.
    consumers: [scripts/finding_identity.py, scripts/scan_report.py, tests/prove_identity_durability.py]
    rule: >-
      REFUSE, NEVER DEGRADE. A component that cannot be derived produces UNFINGERPRINTABLE and
      one of these reasons -- never a hash of the fields that happened to be present. Hashing a
      partial record manufactures a stable-looking identity out of an incomplete one, and a hash
      is opaque: nobody downstream can tell a full identity from a shrug.
    forbidden: >-
      CONTENT_UNDERIVABLE AND CONTENT_NOT_APPLICABLE_FOR_SUBJECT MUST NOT COLLAPSE. "This finding
      has a matched construct and we could not read it" and "this subject has no matched
      construct" are different facts about different things. Collapsing them is defect D-3, and
      the permissive direction of that collapse lets two findings at one locus share one
      approval.
    values:
      SUBJECT_NOT_DECLARED:
        definition: >-
          No finding_subject was supplied. There is no default, because a default would apply one
          subject's locus rule to another subject's finding.
      SUBJECT_NOT_REGISTERED:
        definition: A finding_subject was supplied and is not a registered value.
        rule: >-
          A near-miss spelling is worse than a wild one: consumers read it as blank, and blank
          renders as unqualified.
      SUBJECT_NOT_ESTABLISHED:
        definition: >-
          Nothing could establish which subject the finding is about -- an unmapped scanner, or a
          multi-modal scanner whose locator does not settle its mode.
        rule: >-
          Produced by the reporter rather than by the identity model, and distinct from
          SUBJECT_NOT_DECLARED: there the caller said nothing, here the caller could not find out.
      WHAT_UNDERIVABLE:
        definition: >-
          No advisory id, no purl, and no CWE-plus-rule-family. The defect class cannot be named.
        rule: >-
          A bare rule_id is NOT an acceptable substitute -- it is the field a scanner upgrade
          renames, which is the event the identity exists to survive.
      WHERE_UNDERIVABLE:
        definition: A required field of the subject's locus is absent, or present and empty.
        rule: >-
          The refusal NAMES the missing fields. A refusal that does not say what is absent is a
          shrug, and nobody can close a gap they cannot name.
      CONTENT_UNDERIVABLE:
        definition: >-
          The subject requires a matched construct and the record does not carry one.
        rule: >-
          Says the record is INCOMPLETE. Never produced for a subject that structurally has no
          construct -- see CONTENT_NOT_APPLICABLE_FOR_SUBJECT.
      CONTENT_NOT_APPLICABLE_FOR_SUBJECT:
        definition: >-
          A DECLARED STRUCTURAL ABSENCE: this subject has no matched construct at all, so there
          is nothing to hash. Read from the subject's specification, never from the absence of
          data.
        rule: >-
          NOT A REFUSAL. An identity is still computed. It must not be reachable by accident,
          which is why it comes from the specification table rather than from an empty field.
      SYMBOL_REQUIRED_FOR_COARSE_WHAT:
        definition: >-
          The defect class is CWE-only, which is coarse enough that genuinely different findings
          share it, and no symbol-level locus was available to separate them.
        rule: >-
          Refuses rather than collapsing two findings into one identity, because the second would
          silently inherit the first's risk acceptance.
      SECRET_SUBJECT_NOT_BASELINEABLE:
        definition: >-
          The finding is credential material. It has no baseline identity by design.
        rule: >-
          The baseline has NO AUTHORITY over secrets: they block at every rung and are never
          grandfathered, so the remedy is rotation. Refusing here also means nothing in any
          ledger ever holds secret-derived material, which would otherwise be an
          offline-crackable oracle on a readable branch.

  identity_scope:
    description: >-
      How far a computed finding identity may be trusted. A SECOND AXIS -- it does not rank
      against identity_refusal, and a computable identity can still be undurable.
    consumers: [scripts/finding_identity.py]
    rule: >-
      A FINDING WHOSE SUBJECT IS A RUNNING RESOURCE OUTLIVES EVERY RELEASE THAT TOUCHED IT.
      Saying the scope out loud is the point: the alternative is a key that works in testing and
      quietly loses every finding at the next deploy.
    values:
      DURABLE_ACROSS_RUNS_AND_UPGRADES:
        definition: >-
          Valid as a baseline ledger key: it survives a rescan, a scanner swap, a version bump, a
          rule rename and a line move.
      VALID_WITHIN_ONE_RELEASE_ONLY:
        definition: >-
          Computable and NOT durable. Valid for comparisons inside one release and worthless
          across releases.
        rule: >-
          MUST NEVER be used as a baseline ledger key. Carried by RELEASE, whose own registered
          rule warns about exactly this misuse.

  content_normalisation_policy:
    description: >-
      How a matched construct is normalised before it is hashed. TWO policies, because a literal
      value is noise in one place and the entire finding in another.
    consumers: [scripts/finding_identity.py]
    rule: >-
      WHICH POLICY RAN GOES INTO THE HASH. Without that, the same construct normalised two ways
      produces two hashes with nothing recording the difference, which is a silent
      duplicate-finding generator.
    forbidden: >-
      LITERALS_PLACEHOLDERED MUST NOT BE APPLIED TO DECLARATIVE STATE. There the value IS the
      finding: `publicNetworkAccess = Enabled` and `= Disabled` are an open finding and a fixed
      one, and placeholdering them means a remediated finding keeps matching its ledger entry and
      reads as still open -- or an introduced one matches a closed entry and gets grandfathered.
    values:
      LITERALS_PLACEHOLDERED:
        definition: >-
          String and numeric literals are replaced before hashing. For source constructs, where
          `if (x == 41)` and `if (x == 42)` are the same defect.
        rule: >-
          Also what makes hashing a matched construct safe: a literal destroyed before it is
          hashed cannot be recovered from the hash.
      VALUES_VERBATIM:
        definition: >-
          The value is hashed as written. For declarative state -- IaC, resources, policy, RBAC
          -- where the value is the finding.
        rule: >-
          A remediation MUST change the identity here. That is the whole purpose of the policy
          and it is the opposite of the other one.

  # ─────────────────────────────────────────────────────────────────────────────
  # THE SEVEN NAMESPACES BELOW EXIST BECAUSE AN IDENTITY THAT IS DURABLE STILL SOMETIMES CHANGES.
  #
  # finding_subject above and the identity model under it answer "is this the same finding I saw
  # before". They cannot answer the question underneath it: a package is renamed upstream, a file
  # moves, an advisory gains an alias, a subject specification is corrected, or an extraction bug
  # is FIXED -- and at that moment every disposition, exception and ticket keyed on the old
  # identity is orphaned. Silently. The operator sees a resolved finding reappear as new, or an
  # exception stop applying, with nothing saying why.
  #
  # The silence is the defect. A finding whose identity moved and a finding that is genuinely new
  # are indistinguishable to every consumer unless something kept a record of the move.
  # See scripts/finding_lineage.py and tests/prove_lineage_durability.py.

  lineage_relation:
    description: >-
      How one set of finding identities relates to another across an identity change. The
      CARDINALITY is part of each definition and is enforced at write time.
    consumers: [scripts/finding_lineage.py, tests/prove_lineage_durability.py]
    rule: >-
      THERE IS NO GENERIC "CHANGED" RELATION. The relation is the word a reader trusts, so a
      relation whose cardinality does not match its name is refused rather than normalised.
    forbidden: >-
      A MERGE AND A SPLIT MUST NOT COLLAPSE INTO EACH OTHER. Two findings turning out to be one
      is not one finding becoming two, and the asymmetry is load-bearing: resolution of a merge
      source reaches the survivor, while resolution of a split source REFUSES. Recording a split
      as two SUPERSEDES events would collapse them and silently resolve to whichever was written
      first, so a second supersession for an identity that already has one is refused by name.
    values:
      SUPERSEDES:
        definition: One identity was replaced by exactly one other. Cardinality 1 -> 1.
        rule: >-
          Two sources is a merge wearing the wrong word; two targets is a split wearing the wrong
          word. Both are refused.
      MERGED_INTO:
        definition: >-
          Two or more identities were established to be one condition. Cardinality N -> 1, N >= 2.
        rule: >-
          Resolution of ANY source reaches the survivor, and a disposition on any source carries
          to it -- each was an approval of the same condition, so each still applies.
      SPLIT_INTO:
        definition: >-
          One identity was established to be several distinct conditions. Cardinality 1 -> N,
          N >= 2.
        rule: >-
          Resolution of the source is LINEAGE_SPLIT_UNRESOLVED and names the candidates. It MUST
          NOT pick one: that would transfer the finding's approval to a condition nobody approved
          and drop the others entirely.

  lineage_resolution:
    description: >-
      The answer to "what is this identity now". Five outcomes, and a consumer branches on these
      and on nothing else.
    consumers: [scripts/finding_lineage.py, tests/prove_lineage_durability.py]
    rule: >-
      ONLY LINEAGE_TERMINAL AND LINEAGE_RESOLVED CARRY A CURRENT IDENTITY. The other three carry
      none. A resolver that returned its input on failure would make "not known", "split" and
      "cycle" all read as "this identity is current", which is the collapse this namespace exists
      to prevent.
    forbidden: >-
      LINEAGE_UNKNOWN AND LINEAGE_TERMINAL ARE DIFFERENT ANSWERS. One says the finding is new to
      the estate; the other says it is the live form of something with a recorded history. They
      are the pair a one-line resolver merges, and merging them makes a tracked finding read
      exactly like untracked new work.
    values:
      LINEAGE_UNKNOWN:
        definition: The ledger has no record of this identity on either side of any event.
        rule: Not a failure. It is the normal answer for a genuinely new finding.
      LINEAGE_TERMINAL:
        definition: >-
          The ledger knows this identity and records no successor for it, so it is the current
          form.
      LINEAGE_RESOLVED:
        definition: >-
          One or more hops were followed to a current identity. The route is reported, because
          the route is the evidence.
        rule: >-
          Resolution follows the WHOLE chain. A one-hop resolver loses every identity that moved
          twice, which is the normal case after a scanner upgrade followed by a refactor.
      LINEAGE_CYCLE_REFUSED:
        definition: Following the chain returns to an identity already in it.
        rule: >-
          REFUSED, never followed and never silently truncated. A resolver that loops turns a
          data error into a hung job; one that returns the last identity it saw reports a guess
          as a resolution. Termination is structural -- the visited set cannot grow past the
          identities the ledger mentions -- rather than a hop budget, which would also report a
          long honest chain as a cycle.
      LINEAGE_SPLIT_UNRESOLVED:
        definition: >-
          The identity was split into several, so no single successor exists. The candidates are
          named.
        rule: Distinct from LINEAGE_CYCLE_REFUSED -- a different fault with a different remedy.

  lineage_cause:
    description: >-
      What moved the identity. Recorded on every event, and an event without one is refused.
    consumers: [scripts/finding_lineage.py]
    rule: >-
      THE CAUSE IS WHAT LETS A CARRY BE WEIGHED. An operator told "this is the finding you
      accepted in March" needs to know whether that is because a directory was renamed or
      because the kit changed its own mind about how it computes identity. Those warrant
      different amounts of trust in the same link.
    forbidden: >-
      There is deliberately no "unknown" or "other" value. The weak state is made UNWRITABLE
      instead of registered: an event with an unrecognised cause is refused, so nothing can
      accumulate links that assert a change with nothing behind them.
    values:
      SCANNER_VERSION_CHANGE:
        definition: A scanner upgrade changed what it reports about the same condition.
      RULE_RENAMED:
        definition: A rule was renamed or split, changing the rule family that composes WHAT.
      ADVISORY_ALIAS_ADDED:
        definition: >-
          An upstream feed added an alias to an advisory, so the alias SET that composes WHAT is
          no longer the same set.
        rule: >-
          Nothing in the repository and nothing in the scanner changed. This is the cause nobody
          sees coming, and the asserter is the FEED rather than this kit.
      PACKAGE_RENAMED:
        definition: A package was renamed or relocated upstream, so the purl moved.
      PATH_MOVED:
        definition: A file or directory moved, so the canonical path moved with it.
        rule: >-
          The most common cause and the least understood: nobody changed the code, and every
          finding under the directory became NEW.
      EXTRACTION_CORRECTED:
        definition: >-
          This kit fixed a defect in how it derives identity from scanner output, so findings
          acquired the identity they should always have had.
        rule: >-
          The cause with the widest blast radius, because it moves every affected finding in the
          estate at once. Defect D-2 was one of these.
      SUBJECT_SPEC_CHANGED:
        definition: A subject's locus or content specification changed, moving its identities.
      CORRELATION_ESTABLISHED:
        definition: >-
          Correlation established that findings from two tools are one condition. The input to a
          MERGED_INTO event.
        rule: >-
          Correlation and identity stack rather than merge -- correlation asks whether two TOOLS
          saw one thing in THIS run. Its conclusion ARRIVES here as an event; it is not computed
          here.

  lineage_attribution:
    description: >-
      What asserted a lineage link. An alias is an ASSERTION BY SOMETHING, and the class of
      asserter is recorded because the three are not interchangeable evidence.
    consumers: [scripts/finding_lineage.py]
    rule: >-
      AN UNATTRIBUTED ALIAS IS NOT EVIDENCE. It is a claim with nobody behind it, and a ledger of
      those would let a chain of anonymous links extend a human approval to a finding no human
      ever saw. An event with no asserter is refused at append time.
    values:
      OPERATOR:
        definition: A human decision, recorded as a ROLE rather than a person.
        rule: A role, never a person -- nothing orphans at handoff.
      TOOL:
        definition: A tool's output, naming the tool.
      ADVISORY_FEED:
        definition: An upstream advisory source re-aliasing or restating an advisory.
      ATTRIBUTION_ABSENT:
        definition: >-
          A link arrived with no asserter. READ, NEVER WRITTEN -- the writer refuses such an
          event.
        rule: >-
          Exists so a ledger produced elsewhere can be NAMED as unattributed rather than read as
          trusted. It must never be rendered as an asserter.

  lineage_ledger_integrity:
    description: >-
      Whether the append-only lineage record can be relied on. Established by re-deriving each
      event's id over its own content AND its link to the previous event. ALSO the readability
      states of the BASELINE ledger (scripts/baseline_ledger.py): absent, empty, intact and
      unparseable are the same four facts about any governance ledger, and a second spelling of
      them would be the drift this registry exists to stop. The baseline ledger has no hash chain
      -- its integrity is the protected branch's review -- so it never reports LEDGER_TAMPERED;
      it reports a malformed entry as LEDGER_LINE_UNPARSEABLE.
    consumers: [scripts/finding_lineage.py, tests/prove_lineage_durability.py,
                scripts/finding_match.py, scripts/baseline_ledger.py,
                tests/prove_ledger_read_authority.py]
    rule: >-
      APPEND-ONLY IS A CONTROL OR IT IS A COMMENT. Hashing each line independently detects edits
      and not deletions, which is the half the claim actually needs, so the link is inside the
      hash and a removed or reordered line is detectable.
    forbidden: >-
      LEDGER_ABSENT AND LEDGER_EMPTY MUST NOT COLLAPSE. They answer every question identically
      and mean opposite things: one says nobody is keeping a lineage record at all, which is a
      finding in itself; the other says somebody is and nothing has moved yet.
    values:
      LEDGER_ABSENT:
        definition: No ledger exists.
        rule: >-
          An orphaned approval is then indistinguishable from a new finding, by construction.
          Never a clean result.
      LEDGER_EMPTY:
        definition: A ledger exists and holds no events.
      LEDGER_INTACT:
        definition: >-
          Every event's id matches its content and its link to the preceding event, from the
          first event to the last, and the last is the one the head anchor records.
      LEDGER_TAMPERED:
        definition: >-
          An event was edited, removed, inserted or reordered after it was written: the chain does
          not re-derive, or it does not END at its recorded head anchor, or the head anchor is
          absent over a non-empty ledger, or the ledger was emptied or deleted under a head that
          records events, or an external head anchor disagrees.
        rule: >-
          The chain is anchored at its first event and so cannot see the LAST one removed; the head
          anchor is what makes tail truncation detectable. A ledger that cannot exclude truncation
          is not intact. Appending to such a ledger is REFUSED: a new event must not be chained
          onto a sequence nobody can verify.
      LEDGER_LINE_UNPARSEABLE:
        definition: A line is not a parseable event object.
        rule: >-
          REPORTED by line number, never skipped. Skipping is how an evidence store comes to
          answer confidently from a subset of itself. Appending is refused here too.

  disposition_carry:
    description: >-
      How an approved exception reached the finding it is being applied to. Read from the
      register; this never re-keys an approval.
    consumers: [scripts/finding_lineage.py, tests/prove_lineage_durability.py]
    rule: >-
      AN INFERENCE NEVER OVERWRITES AN OBSERVATION. The approver approved a specific key. A
      carried approval is a human decision extended by machine assertions, so it is reported as
      CARRIED with the route, the cause and the asserter at every hop, and flagged for
      reaffirmation -- which is what lets a consumer agree with the extension rather than
      inherit it silently.
    forbidden: >-
      DISPOSITION_CARRIED_BY_LINEAGE MUST NOT BE RENDERED AS DISPOSITION_KEYED_DIRECTLY. Doing so
      lets an unbounded chain of machine-asserted links suppress findings on the authority of one
      old human decision.
    values:
      DISPOSITION_KEYED_DIRECTLY:
        definition: The register holds an entry keyed on this identity itself.
        rule: Requires no reaffirmation. This is what was actually approved.
      DISPOSITION_CARRIED_BY_LINEAGE:
        definition: >-
          The register holds an entry keyed on an identity this one descends from through
          recorded lineage events.
        rule: >-
          Always flagged for reaffirmation, and always reported with the identity that was
          actually approved and the causes of each hop between.
      DISPOSITION_NOT_FOUND:
        definition: >-
          No entry is keyed on this identity or on any identity it descends from.
        rule: >-
          Carries the lineage_resolution state alongside it, so "untriaged and new to the estate"
          stays distinct from "untriaged, but the live form of something with a history".

  identity_proof_failure:
    description: >-
      The failure vocabulary of tests/prove_identity_durability.py. Separate words because an
      identity that MOVED is a normalisation bug and one that was NEVER COMPUTED is an extraction
      bug, and the two remedies share nothing.
    consumers: [tests/prove_identity_durability.py]
    rule: >-
      IDENTITY_NEVER_COMPUTED MUST NEVER BE REPORTED AS IDENTITY_MOVED, OR AS A PASS. Two empty
      identities compare equal, so an equality assertion alone reports durable identity over a
      pipeline that computes none -- which is why non-emptiness is asserted first and separately.
    values:
      IDENTITY_NEVER_COMPUTED:
        definition: >-
          The identity is empty: identify() was called and refused. An EXTRACTION defect -- the
          record reaching the identity model could not satisfy any subject's specification.
        rule: >-
          Reported with the refusal reason, so the missing field is named rather than implied.
      IDENTITY_MOVED:
        definition: >-
          A non-empty identity changed across a vendor-side event it is specified to survive. A
          NORMALISATION defect.
        rule: >-
          Every disposition approved against the old key is orphaned and the finding reappears as
          new at the next scan.
      IDENTITY_COLLIDED:
        definition: >-
          Two genuinely different findings produced one identity, or a record that should have
          refused produced a hash.
        rule: >-
          The permissive direction, and the worst of the three: the second finding silently
          inherits the first's risk acceptance.
      IDENTITY_NOT_DURABLE:
        definition: The proof's overall verdict when any of the above was observed.

  lineage_proof_failure:
    description: >-
      The failure vocabulary of tests/prove_lineage_durability.py. Separate words because these
      have separate fixes and reporting them under one would send the next reader to the wrong
      file.
    consumers: [tests/prove_lineage_durability.py]
    rule: >-
      IDENTITY_NEVER_MOVED IS NOT A PASS AND NOT A NORMAL FAILURE. It means the proof could not
      test anything: with no move, the register matches by exact key and the ledger is never
      consulted, so every other assertion in the file would be satisfied vacuously.
    values:
      IDENTITY_NEVER_MOVED:
        definition: >-
          Two identities that the fixture intended to differ are equal, so there is no identity
          change to carry a disposition across.
      DISPOSITION_ORPHANED:
        definition: >-
          An approval that should have been carried across a recorded identity change was not
          found. This is the defect the ledger exists to end.
      LINEAGE_CHAIN_BROKEN:
        definition: >-
          A chain did not resolve to its far end, a cycle was followed, or a carry did not cite
          the event, cause or asserter that authorised it.
      MERGE_AND_SPLIT_COLLAPSED:
        definition: >-
          A merge and a split over the same identities produced the same answers, so the relation
          is being treated as a symmetric edge.

  # ─────────────────────────────────────────────────────────────────────────────
  # THE TWO NAMESPACES BELOW ARE THE BASELINE CASCADE'S OWN WORDS (ETFB section 5.3, L44).
  #
  # Proposed as CANDIDATES in ENFORCEMENT_TIERS_AND_FINDING_BASELINE.md section 12.1 and 12.2 and held
  # back "because registering them would assert they had been decided". They are registered now
  # because the mechanism that branches on them exists (scripts/finding_match.py) -- registration
  # follows the consumer, never precedes it. Checked first, per TAXONOMY_DRIFT remedy 2:
  # artifact_identity is about bytes and a registry; provenance_identity CARRIES an identity and
  # does not match two; finding_classification owns what a RED result MEANS (and already owns
  # POTENTIALLY_ABSENT, reused below rather than respelled); disposition_type is an AUTHORISED
  # decision, and baseline state is an OBSERVATION nobody authorises. Section 12.6's merge advice is
  # taken: the generation-change event lives in finding_baseline_state, not in a namespace of its
  # own, and the candidate MOVED value is not registered here -- a move is a match outcome
  # (IDENTITY_MATCHED_MOVED), and a moved finding's baseline state is whatever its entry licenses.

  finding_identity_match:
    description: >-
      The outcome of matching a current finding against the baseline ledger. Five answers, never a
      boolean, because "could not compute" and "no match" are opposite facts about the evidence.
    consumers: [scripts/finding_match.py, tests/prove_baseline_cascade.py,
                scripts/propose_ledger.py]
    rule: >-
      AMBIGUITY IS RESOLVED BY CARDINALITY, NEVER BY GUESSING WHICH ONE MOVED WHERE. The model
      records that it does not know which is which, and enforces on the count, which it does know.
    forbidden: >-
      IDENTITY_UNCOMPUTABLE MUST NEVER BE READ AS IDENTITY_UNMATCHED. An identity that could not be
      computed is not a NEW finding and not a match; it is EVIDENCE_UNTRUSTED for that finding.
    values:
      IDENTITY_MATCHED_EXACT:
        definition: WHAT, WHERE and CONTENT all agree with a ledger entry in the evaluated environment.
        rule: first_seen is carried forward untouched.
      IDENTITY_MATCHED_MOVED:
        definition: >-
          WHAT and CONTENT agree at a different locus, and exactly one unmatched ledger entry and
          exactly one unmatched observation hold that pair.
        rule: A move is an EVENT, recorded, never a reset. first_seen is carried forward.
      IDENTITY_AMBIGUOUS:
        definition: >-
          A (subject, WHAT, CONTENT) group holds more than one unmatched entry or more than one
          unmatched observation.
        rule: >-
          min(N,M) are continuations, surplus is NEW, deficit is POTENTIALLY_ABSENT. The ambiguity
          about WHICH is recorded and changes no enforcement outcome.
      IDENTITY_UNMATCHED:
        definition: No ledger entry in the evaluated environment shares subject, WHAT and CONTENT.
        rule: The finding is NEW.
      IDENTITY_UNCOMPUTABLE:
        definition: >-
          A component could not be derived, the label and the components disagree, or the identity
          is not durable (RELEASE scope), so no match was attempted.
        rule: NOT a NEW finding and NOT a match. EVIDENCE_UNTRUSTED for this finding.

  finding_baseline_state:
    description: >-
      Whether this finding existed before the baseline for this (repo, environment) cell, and on
      what evidence. An OBSERVATION, never an authorization.
    consumers: [scripts/finding_match.py, tests/prove_baseline_cascade.py, scripts/rule_family.py,
                tests/prove_rule_family_upgrade.py,
                security-gate at the run rung (not built), remediation track (not built)]
    rule: >-
      A BASELINE STATE THAT COULD NOT BE COMPUTED IS NOT PRE-EXISTING. Identity failure and ledger
      failure resolve to EVIDENCE_UNTRUSTED, never to the permissive side.
    values:
      NEW:
        definition: No matching identity in the ledger read from the protected default branch.
      PRE_EXISTING_BASELINED:
        definition: >-
          Matched an entry whose first_seen came from a claimable observation time (age_established
          is true).
      PRE_EXISTING_AGE_NOT_ESTABLISHED:
        definition: >-
          Matched an entry with no claimable observation time for its earliest observation. Older
          than the baseline by at least the baseline's own age; how much older is unknown.
        rule: >-
          MUST NOT be reported as PRE_EXISTING_BASELINED. An entry that does not say its age was
          established is read as this, never as established -- defaults are suspicious at
          assurance boundaries.
      PRE_EXISTING_BY_DETECTION_CHANGE:
        definition: >-
          Admitted to the ledger only because a scanner generation or rule set changed, through an
          accepted reconciliation report. The code is not new; the detection is.
        rule: >-
          Never NEW, and never an open-ended grant. Its age is not established and is never
          asserted as the upgrade date.
      BASELINE_UNAVAILABLE:
        definition: >-
          The ledger could not be read, is malformed, or contradicts its own integrity state, so NEW
          and PRE-EXISTING cannot be distinguished.
        rule: >-
          Yields routing_result.EVIDENCE_UNTRUSTED for every finding. MUST NOT default to either
          side -- one bypasses the rung entirely and the other blocks the estate.

  # ─────────────────────────────────────────────────────────────────────────────
  change_artefact:
    description: >-
      The four distinct records of what a deployment changed. They are not four views of one thing,
      and rollback reads only the last two.
    consumers: [deployment contract, rollback planner]
    rule: >-
      A GIT DIFF CANNOT TELL YOU A DEPLOYMENT SHIFTED THREE TRAFFIC WEIGHTS AND HALF-APPLIED A
      MIGRATION. OBSERVED minus PLANNED is work nobody asked for, and is currently unrepresentable.
    values:
      SOURCE_DELTA:
        definition: What changed in code and configuration. Produced by determine-changes.
        rule: The weakest of the four. Never sufficient for a reversal decision.
      PLANNED_MUTATION_SET:
        definition: What the deployment INTENDS to alter, established before the change.
      OBSERVED_MUTATION_SET:
        definition: What actually changed, established by post-change reconciliation.
      REVERSAL_MANIFEST:
        definition: How each observed mutation can be compensated, per mutation.
        rule: Absence of an entry is UNKNOWN_REVERSIBILITY, never reversible.

  # ─────────────────────────────────────────────────────────────────────────────
  # THE THREE NAMESPACES BELOW EXIST BECAUSE A CHANGE MANIFEST IS A RECORD OF THE PAST AND
  # REVERSAL ACTS ON THE PRESENT.
  #
  # `change_artefact` above says what a run did. It cannot say whether the objects it names are
  # still the objects it left behind. Release R1 creates resource X; another onboarding process
  # later modifies X or takes a dependency on it; R1's manifest still truthfully says "I created
  # X" and that sentence is no longer sufficient authority to delete X.
  #
  # So every reversal entry is a PROPOSAL evaluated against live state at reversal time. These
  # namespaces are that evaluation's vocabulary: who owns the object now, what has happened to
  # it since, and what recovery is therefore permitted to do to it.
  # See DEPLOYMENT_CONTRACT_RECONCILIATION.md section 8.

  release_ownership:
    description: >-
      Whether a live object is still attributable to the release that is being reversed. Read from
      the object itself at reversal time, never from the change manifest -- the manifest records
      what a run did, and cannot record what happened afterwards.
    consumers: [reversal planner, deploy workflows, tests/check_reversal_preconditions.py]
    rule: >-
      NOT artifact_identity. That namespace asks whether the artefact a control inspected is the
      artefact that was published -- a question about bytes and a registry. This asks whether a
      DEPLOYED OBJECT is still owned by one release -- a question about a live resource and a
      release graph. An object can have REGISTRY_IDENTITY_PROVEN and be owned by somebody else.
    forbidden: >-
      AN UNREADABLE STAMP IS NOT AN ABSENT OWNER. OWNERSHIP_UNESTABLISHED and OWNED_EXCLUSIVE are
      the two values a tired implementation collapses, because "no owner found" is one line of
      shell away from "I own it, delete it". The whole namespace exists to keep them apart.
    values:
      OWNED_EXCLUSIVE:
        definition: >-
          The live object carries this release's ownership stamp and no other release or external
          claim is recorded against it.
        rule: >-
          The ONLY ownership value from which removal is available. Every other value means the
          object outlived this release's exclusive authority over it.
      OWNED_SHARED:
        definition: >-
          The object carries this release's stamp AND at least one other claim -- a later release
          that adopted it, or an external owner recorded against it.
        rule: >-
          Shared ownership withdraws the removal branch, it does not weaken it. The other owner
          was never asked, and "I made it first" is not consent on their behalf.
      # ── SHARED INFRASTRUCTURE IS THE NORMAL CASE, NOT THE EXCEPTION ──────────────
      #
      # OWNED_SHARED above describes two RELEASES both claiming one object. The four values
      # below describe something different and far more common: a release's relationship to
      # PLATFORM infrastructure it did not create and must not reverse -- a hub firewall, a
      # shared registry, a Log Analytics workspace, a private DNS zone, an App Service plan.
      #
      # The framing that produced these: SHARED INFRASTRUCTURE MAY EXIST ACROSS WORKLOADS;
      # SHARED WRITE AUTHORITY MUST NOT AUTOMATICALLY EXIST ACROSS WORKLOAD DEPLOYMENT
      # IDENTITIES. Existence and authority are different questions, and collapsing them is
      # how an application rollback ends up entitled to delete a workspace.
      #
      # Without these, a rollback planner reading OWNED_SHARED cannot tell "I added a
      # diagnostic setting to their workspace" from "I merely reference their subnet" from
      # "the platform pipeline owns this outright". Those need three different behaviours and
      # only one of them involves removing anything.
      OWNED_BINDING:
        definition: >-
          This release created a BINDING on a resource it does not own -- a diagnostic setting,
          a private endpoint, a role assignment, a firewall rule entry.
        rule: >-
          REVERSE THE BINDING, NEVER THE HOST. The binding is release-owned; the thing it binds
          to is not. Deleting the workspace because you created a diagnostic setting on it is
          the failure this value exists to make unrepresentable.
      SHARED_CONFIGURATION_ENTRY:
        definition: >-
          This release added an ENTRY to a shared configuration surface -- a DNS record, an ACR
          repository path, a route, a policy exemption.
        rule: >-
          Revert only the identified entry, and only if it is unchanged since this release wrote
          it. The surface itself is platform state. An entry another actor has since edited is a
          conflict, not a stale value to overwrite.
      REFERENCE_ONLY:
        definition: >-
          This release CONSUMES a shared resource without having created or modified it -- joining
          an approved subnet, emitting to a workspace, pulling from a registry, using a plan.
        rule: >-
          NEVER REVERSIBLE. There is nothing to undo: consumption left no trace to remove. A
          planner that treats a reference as a mutation will try to un-join a subnet, and the
          subnet belongs to somebody else.
      PLATFORM_OWNED_SHARED:
        definition: >-
          The resource is owned by the platform or infrastructure pipeline. An application release
          may reference or bind to it and may never modify or remove it.
        rule: >-
          An application rollback CANNOT act on this, whatever its manifest says. The manifest
          records what a run did; this records what a run was entitled to do, and the second one
          wins. Changes here belong to the platform pipeline and carry their own release history.
      OWNED_BY_ANOTHER_RELEASE:
        definition: >-
          The stamp names a release that is not the one being reversed.
        rule: >-
          A CONTRADICTION, NOT A LICENCE. The manifest says this run created the object and live
          state says otherwise; something re-created it, adopted it, or the manifest is wrong.
          Resolving that toward deletion acts on the reading that happens to be destructive.
      OWNERSHIP_UNESTABLISHED:
        definition: >-
          The stamp could not be read, the object carries none, or the resource class has no
          metadata channel that could carry one.
        rule: >-
          NEVER RESOLVES TOWARD REMOVAL. This is the per-object form of the run-level do-no-harm
          rule in ROLLBACK_CONTRACT.md, and it is the row that matters most: an unknown must not
          resolve toward destruction because destruction is the easier branch to code.
    artifacts:
      RELEASE_OWNERSHIP_STAMP:
        definition: >-
          Metadata written ONTO the live object, in the adapter's native channel -- a resource
          tag, a label, an annotation, deployment metadata -- carrying the release id, the parent
          release id, the run that wrote it, the version handle of the post-state that run left,
          and when it was written.
        rule: >-
          WRITTEN WITH THE MUTATION, NOT AFTER IT. A stamp applied in a later step is absent from
          every object a cancelled run created before it died -- which is precisely the population
          a reversal has to reason about. It also lives on the OBJECT rather than only in the run
          record, because the run record is the thing a cancelled run does not finish.
        note: >-
          A claim the run makes about itself. Evidence of ownership, not proof against an actor
          who can write tags. Where the resource class cannot carry one, ownership is
          OWNERSHIP_UNESTABLISHED by construction and removal is permanently unavailable for that
          class -- a rollback_capability fact, established BEFORE the mutation, not discovered
          during the reversal.

  reversal_conflict:
    description: >-
      Why a proposed reversal entry could not be actioned as written. Established by comparing the
      live object against the post-state the release recorded, and against the release graph.
    consumers: [reversal planner, outcome report, incident response]
    rule: >-
      NOT rollback_state. That namespace answers "what may be done about a change that failed" for
      the RUN. These answer "what happened to THIS OBJECT since" -- and a run may be
      AUTO_ROLLBACK_ALLOWED while one object in it is still un-reversible. A run-level disposition
      that cannot describe a single dissenting object reports the reversal as total.
    values:
      SUPERSEDED_BY_LATER_RELEASE:
        definition: >-
          The object's current state was written by a release later than the one being reversed.
        rule: >-
          AN ORDERING PROBLEM, NOT A REFUSAL. Reversing this release first would discard the later
          release's state while the later release still believes it is standing. The later
          releases are reversed first, or this entry is not actioned at all.
      MODIFIED_BY_EXTERNAL_ACTOR:
        definition: >-
          The object's current version differs from the recorded post-state and no release in the
          graph claims the change.
        rule: >-
          STOP, DO NOT COMPENSATE. The pre-state this release captured describes a world that no
          longer exists, so restoring it would overwrite a change nobody in the release graph can
          describe. This is the onboarded-in-between case stated precisely.
      DEPENDENT_INTRODUCED_LATER:
        definition: >-
          Something created after this release now depends on the object.
        rule: >-
          Preservation is the correct outcome and it MUST BE REPORTED, not silently skipped. An
          object deliberately retained is legitimate WHEN STATED; unstated retention is a false
          claim about the terminal state.
      REVERSE_ORDER_VIOLATED:
        definition: >-
          A descendant release of the one being reversed has not itself been reversed, whether or
          not it touched this particular object.
        rule: >-
          Distinct from SUPERSEDED_BY_LATER_RELEASE, which is about THIS OBJECT. This is about the
          GRAPH. A descendant that never touched the object can still depend on it existing, and
          checking only per-object drift misses that entirely.
      PRECONDITION_UNESTABLISHED:
        definition: >-
          One of the reversal preconditions could not be evaluated -- the version handle was
          unreadable, the release graph could not be traversed, or the dependency query failed.
        rule: >-
          A READ FAILURE IS NOT AN ABSENCE OF CONFLICT. The same defect as inferring an empty
          previous state from a swallowed error, arriving one layer later: an unevaluated
          precondition must never read as a satisfied one.

  reversal_disposition:
    description: >-
      What recovery is permitted to do to ONE object, derived from its release_ownership and any
      reversal_conflict against it. The value carried by each entry of a REVERSAL_MANIFEST.
    consumers: [reversal planner, outcome report, tests/check_reversal_preconditions.py]
    rule: >-
      DERIVED, NEVER ASSERTED. A disposition is computed from preconditions read out of live state
      at reversal time. A disposition written into the manifest when the manifest was authored is
      a statement about a world that has since moved on.
    forbidden: >-
      THE UNKNOWN BRANCH AND THE DESTRUCTIVE BRANCH ARE NOT THE SAME BRANCH. Exactly one value
      below removes anything, and it is reachable only from OWNED_EXCLUSIVE with no conflict. Any
      implementation in which a failed precondition can fall through into REVERSAL_REMOVE has
      broken the taxonomy even though every word it used was valid.
    values:
      REVERSAL_REMOVE:
        definition: >-
          The object was created by this release, is unchanged since, and is OWNED_EXCLUSIVE.
          Remove it.
        rule: >-
          The only destructive value, and it requires ALL of its preconditions to have been
          positively established. Not "no conflict was found" -- conflicts were looked for and the
          look succeeded.
      REVERSAL_RESTORE_PRIOR:
        definition: >-
          The object existed before this release, this release modified it, and its current state
          still equals the post-state this release recorded. Restore the recorded pre-state.
        rule: >-
          Requires the post-state comparison to have SUCCEEDED. Restoring a pre-state over an
          object somebody else has since changed is destruction with a recovery label on it.
      REVERSAL_DEFERRED_TO_SUCCESSOR:
        definition: >-
          A later release owns the object's current state. This entry is not actioned until the
          later releases have been reversed.
        rule: >-
          NOT a failure and NOT a completion. Reporting it as either is how a multi-release
          recovery reports success halfway through.
      REVERSAL_ENTRY_SCOPED:
        definition: >-
          The parent object changed since this release wrote to it, this release's own entry did
          not, removing that entry alters nothing another actor owns, and the surface can address
          the entry independently. The entry is reversed; the parent is untouched.
        rule: >-
          THE UNIT OF CONFLICT IS THE MUTATION, NOT THE OBJECT. A second actor adding their rule
          changes a Front Door profile's ETag while leaving ours byte-identical; refusing on that
          basis means "something else touched it, so do not even look", which withholds a safe
          reversal on the majority of shared surfaces and leaves our change in production forever.
          A WITHHELD-BUT-SAFE REVERSAL IS NOT THE HARMLESS DIRECTION -- it trains operators to
          override the check. Ordering is the catch: on a priority-ordered surface, removing our
          entry can change the EVALUATION OUTCOME for entries we never touched. An adapter that
          cannot establish independence for its surface resolves to REVERSAL_WITHHELD_UNTRUSTED.
      REVERSAL_REFUSED_CONFLICT:
        definition: >-
          THIS RELEASE'S OWN ENTRY was altered by someone else, or the stamp names another
          release. Narrowed from "the object changed" -- see REVERSAL_ENTRY_SCOPED, which covers
          the far more common case of a neighbour editing a different entry on the same object. Automatic
          reversal stops for this object and a conflict is reported.
        rule: >-
          Carries the escalation contract. A refusal with no named owner and no permitted agent
          action is a dead end, and the observed consequence of dead ends is automation that
          retries, fabricates a remediation, or routes around the gate.
      REVERSAL_WITHHELD_DEPENDENCY:
        definition: >-
          Something introduced later depends on the object, or the object is now OWNED_SHARED.
          It is preserved, and the dependent or co-owner that preserved it is named.
        rule: >-
          Projects to ROLLBACK_PARTIAL at the run level. Partial never rounds up to verified, and
          a preserved object omitted from the report is indistinguishable from one that was
          removed.
      REVERSAL_WITHHELD_UNTRUSTED:
        definition: >-
          Ownership or current state could not be established. Nothing destructive happens to this
          object and the run says so.
        rule: >-
          THE ROW THAT MATTERS MOST. Could-not-establish must never resolve toward a destructive
          branch. ROLLBACK_CONTRACT.md already says this for a run whose previous state is
          unknown; this is the same rule applied per object, which is where a run with a perfectly
          good previous state still meets an object it cannot vouch for.

  # ─────────────────────────────────────────────────────────────────────────────
  transition_reason:
    description: >-
      Why a release moved. Recorded on the transition, not inferred from the endpoints.
    consumers: [release graph, dashboarding]
    rule: >-
      "R47 -> R46" IS NOT A FACT ANYONE CAN ACT ON. Two releases produce that identical arrow for
      opposite reasons, and only one of them leaves technical_provenance VERIFIED standing.
    values:
      HEALTH_FAILURE:      {definition: Health or readiness validation failed after the change.}
      VALIDATION_FAILURE:  {definition: Functional or operational validation failed.}
      BUSINESS_DECISION:   {definition: Technically healthy and withdrawn anyway. Case E.}
      SECURITY_FINDING:    {definition: Reversed because of a security finding against the release.}
      DEPENDENCY_FAILURE:  {definition: Something the release depends on failed, not the release itself.}
      OPERATOR_DIRECTED:   {definition: A human directed it, with no other class applying.}

  # ─────────────────────────────────────────────────────────────────────────────
  selftest_reach:
    description: >-
      How a workflow is actually exercised by this repository's own CI. The self-test reported
      green for six days over a workflow that started zero times, and this vocabulary exists so a
      green can never again be read as covering more than it does.
    consumers: [tests/check_selftest_coverage.py, self-test.yml]
    rule: >-
      SCHEDULE IS NOT PUSH. A weekly job does not catch a break introduced by the commit that
      caused it, and collapsing the two hides the exact gap that cost six days. Counted on
      2026-09-22: 3 of 12 workflows run on the commit that could break them.
    values:
      EXERCISED_ON_PUSH:
        definition: Invoked on push or pull_request -- on the commit that could break it.
        rule: The only class that catches a regression at the moment it is introduced.
      EXERCISED_ON_SCHEDULE:
        definition: Invoked only by a cron, directly or through a scheduled caller.
        rule: >-
          A break lands and WAITS. Not a failure state, but never to be counted alongside
          EXERCISED_ON_PUSH when reporting what the suite covers.
      EXERCISED_ON_DISPATCH:
        definition: Invoked only when a human asks -- its own workflow_dispatch, or a dispatch-only caller.
        rule: >-
          Human-runnable is not unreachable. An earlier draft of the checker called these
          "exercised by nothing" because it looked only at who CALLS a workflow, which is a false
          finding, and a checker that reports false findings teaches people to distrust the column.
      EXERCISED_BY_NOTHING:
        definition: Nothing in this repository invokes it, by any trigger.
        rule: >-
          NOT automatically a failure -- a workflow needing a real cloud target is honestly
          unexercisable here. It must be ACCOUNTED FOR by a dated deferral. Unexercised AND
          undeclared is the state that produced the six days.

  capability_maturity:
    description: >-
      How far a capability has actually been PROVEN, from a name in a file to a control shown to
      block something. Every rung is a different claim and collapsing any two produces a false green.
    consumers: [tests/capability_inventory.py, security-gate]
    rule: >-
      A CAPABILITY MAY NOT BE RECORDED AT A RUNG IT HAS NOT REACHED, AND A STATIC CENSUS MAY NEVER
      AWARD ANYTHING ABOVE IMPLEMENTED.
    values:
      IMPLEMENTED:
        definition: A step exists that would call the tool. Provable by reading the workflow.
        rule: The ceiling of static analysis. Everything above requires a runner.
      EXECUTED:
        definition: The job ran on a real runner and completed.
        rule: >-
          NOT detection. Proven 2026-09-15: CodeQL executed, uploaded its analysis and reported
          zero results over a file containing three XSS sinks; gitleaks executed and reported zero
          over a planted credential. Both green. A green job is the most persuasive possible
          evidence for a control that did nothing.
      DETECTION_PROVEN:
        definition: It found a planted defect that a NAMED rule or query is documented to catch.
        rule: >-
          The fixture must be valid for the detector's threat model. Both zeroes above were the
          FIXTURE: an allowlisted published example key, and sinks fed by a React prop, which no
          taint engine treats as a source. Name the rule in advance or a zero is unattributable.
      ENFORCEMENT_PROVEN:
        definition: A real finding actually blocked a real promotion under the policy in force.
        rule: Detection that cannot block is a report. The gate must be shown to fail, not assumed to.
      REVALIDATED:
        definition: Proven again after the code stopped changing and the vulnerability feed moved.
        rule: Same artifact, same SBOM, new intelligence. The assurance state changed without the software changing.

  capability_metadata:
    description: >-
      Capability-SPECIFIC facts a consumer may want, carried ALONGSIDE the shared assurance
      vocabulary and never instead of it. NVD has different scanner details; it does not get a
      different dialect for "was posture established".
    consumers: [callers of reusable-nvd-cve, cost reporting]
    rule: >-
      These NEVER substitute for assurance_state. A caller must not infer posture from
      nvd_database_state, and must not infer cost-health from assurance_state.
    values:
      UPDATED:
        definition: The vulnerability database was refreshed successfully this run.
      STALE:
        definition: >-
          The update failed and the scan ran against whatever data existed.
        rule: >-
          A stale database CANNOT establish "no known vulnerabilities". This projects to
          assurance_state=UNDETERMINED, which is the original defect this workflow was rebuilt to
          fix -- the version it was abstracted from swallowed update failures with `|| true` and
          reported clean.
      RESTORED_COMPLETE:
        definition: A cache of a COMPLETE database was restored. The fast path.
      RESTORED_PARTIAL:
        definition: >-
          Only a partial database was restored, usable as a RESUME BASE and never as the basis for
          a clean verdict.
      COLD:
        definition: >-
          No cache restored; the database was built from scratch. Measured at ~10 minutes with a
          valid key and a current client -- NOT the ~50 minutes a stale client once took.

  # ─────────────────────────────────────────────────────────────────────────
  api_boundary:
    description: >-
      The CONSUMER-FACING contract. Added after the HIL asked whether contracts were shaped for
      people to hook into -- they were not. The assurance workflows exposed no outputs at all, so
      every state in this registry died at the workflow boundary and callers saw only red or green.
      The internal control was richer than the external contract.
    consumers: [calling workflows, future orchestration, dashboards, correlation, release gating]
    rule: >-
      NO SECOND VOCABULARY AT THE API BOUNDARY. Every value a consumer receives is a term defined
      here. Otherwise each future layer invents its own interpretation of "green".
    schema: schemas/assurance-result.schema.json
    values:
      # assurance_state -- what the run ESTABLISHED
      UNDETERMINED:
        definition: >-
          Posture could not be established -- something was UNAVAILABLE or COLLECTION_FAILED.
        rule: >-
          NEVER equivalent to PASS. A consumer must not read "did not block" as "safe". Absence of
          a block is not evidence of absence of risk.
      # enforcement_state -- what the gate DID about it
      BLOCKED:  {definition: The gate stopped the caller.}
      ALLOWED:  {definition: Nothing required blocking.}
      ADVISORY:
        definition: Findings existed and were deliberately not blocked.
        rule: Not a clean result. Secrets are never included in this.
      # evidence_state
      CANONICAL: {definition: Identity-bound evidence was produced.}
      UNBOUND:   {definition: Provenance identity could not be bound; downstream MUST NOT merge or correlate this.}
      BOUND:     {definition: Full provenance identity was bound at capture.}
      # discovery_state at the boundary
      COMPLETE:  {definition: Discovery established applicability across the requested scope.}
      # publication
      PUBLISHED:     {definition: Evidence reached its presentation channel.}
      NOT_ATTEMPTED: {definition: Publication was not tried. Distinct from failing.}

  # ─────────────────────────────────────────────────────────────────────────
  execution_unavailable_reason:
    description: >-
      WHY a scanner never ran. All of these mean "posture undeterminable" and every one has
      completely different remediation, so the reason is part of the classification.
    consumers: [security-gate, operator triage]
    rule: Distinguishable ONLY by the job annotation, never by the logs. Check the annotation.
    values:
      BILLING_EXECUTION_REFUSED:
        definition: Spending limit or payment failure refused the job.
        signature: job with 0 steps, billing annotation
      ACTION_ACQUISITION_FAILURE:
        definition: The runner could not download a required action.
        signature: job with 1 step, Set up job fails with 429/502/503
      POLICY_REFUSED:
        definition: Environment protection refused the ref.
        signature: job with 0 steps, ~2s, no token minted
      EXECUTION_TIMEOUT:
        definition: The job hit its timeout-minutes bound.
        requires_evidence: last completed phase
        status: DECLARED-NOT-IMPLEMENTED
        note: >-
          A timeout currently surfaces as a plain job failure. Cost is bounded; SEMANTICS ARE NOT.
          Recorded here so the gap is visible rather than implied.
      DEPENDENCY_ACQUISITION_UNAVAILABLE:
        definition: A required tool could not be obtained or made fit.
        signature: bounded acquisition failed or timed out
      DISCOVERY_UNAVAILABLE:
        definition: Discovery could not establish what exists, so applicability is unknown.
        rule: >-
          MUST NOT resolve to a set of NOT_APPLICABLE. Discovery failing means everything runs.
      INFRASTRUCTURE_UNKNOWN:
        definition: None of the above and the scanner still never executed.

  # ─────────────────────────────────────────────────────────────────────────
  prerequisite_readiness:
    description: >-
      Whether the EXECUTION ENVIRONMENT can service a capability that discovery found applicable.
      Distinct from discovery: discovery is about the repository, this is about the runner.
      The leak-gate setup helpers use PREREQUISITE_UNAVAILABLE and FITNESS_FAILED for the same
      facts about the machine that runs them (docs/adoption/LEAK_GATES.md exit tables).
    consumers: [scanner jobs, security-gate, assurance reporting,
                developer-safety/gitignore/merge-baseline.sh, developer-safety/branch-protection/apply-push-ruleset.sh]
    lifecycle: >-
      discover applicability -> exercise ACTUAL TOOL fitness -> if fit, scan
      -> if unfit or missing, remediate/acquire -> RE-CHECK FITNESS (only because state changed)
      -> scan -> capture evidence.
      The pipeline's job is to get the scan done, not to produce an exquisitely classified excuse.
    rule: >-
      Fitness is established by EXERCISING THE REAL CONSUMER, never a proxy. `command -v java`
      proves a name resolves; a version string is self-reported; neither is the JVM that
      dependency-check.sh actually selects. Run the tool.
    transitions:
      - "check fitness -> READY                       (fit already; NO re-check, nothing changed)"
      - "check fitness -> remediate                   (unfit or missing, and a safe path exists)"
      - "remediate -> re-check -> ACQUIRED_AND_READY  (re-check ONLY because state changed)"
      - "remediate -> re-check -> REMEDIATION_FAILED  (install claimed success, tool still will not run)"
      - "no remediation path -> PREREQUISITE_UNAVAILABLE"
      - "remediation could not obtain it -> ACQUISITION_UNAVAILABLE"
    values:
      READY:
        definition: The real tool ran its fitness check. No acquisition attempted or needed.
      ACQUIRED_AND_READY:
        definition: A prerequisite was missing or unfit, remediation ran, and re-check PASSED.
        note: The re-check is required here precisely BECAUSE environment state changed.
      PREREQUISITE_UNAVAILABLE:
        definition: Required prerequisite absent and no remediation path is available.
        projects_to: UNAVAILABLE / DEPENDENCY_ACQUISITION_UNAVAILABLE
      ACQUISITION_UNAVAILABLE:
        definition: Remediation was attempted and could not obtain the prerequisite.
        projects_to: UNAVAILABLE / DEPENDENCY_ACQUISITION_UNAVAILABLE
      FITNESS_FAILED:
        definition: The tool is present but the real consumer will not run.
        note: Present is not fit. A tool on PATH that cannot execute is an absent tool in costume.
      REMEDIATION_FAILED:
        definition: Acquisition reported success but the post-change fitness check still failed.
        note: >-
          An install that "succeeded" and a tool that runs are different claims. This state exists
          so that difference cannot be silently collapsed.

  # ─────────────────────────────────────────────────────────────────────────
  discovery_state:
    description: What discovery established about the caller's scope.
    consumers: [all scanner jobs, security-gate]
    values:
      RUN:        {definition: Discovered in scope AND permitted by the selector.}
      EXCLUDED_BY_SELECTOR:
        definition: Present in scope but excluded by explicit configuration.
        rule: MUST be reported. Narrowing scope must never silently reduce VISIBILITY.
      NOT_APPLICABLE: {definition: Searched and none found. Evidence-backed.}
      DISABLED:   {definition: Explicitly turned off. An exception, reported loudly, never a default.}
      MISSING_BUT_REQUIRED:
        definition: Profile declares this must exist and it does not. ABSENCE IS THE FINDING.
      ARTIFACT_PRESENT:
        definition: An artifact of this class was discovered in scope. Presence is established; nothing is yet claimed about whether it was examined.
        rule: Presence and examination are different facts. A pipeline that reports only the second lets the first disappear.
      CAPABILITY_REQUIRED:
        definition: This artifact class needs a control. The obligation is asserted independently of whether anything can currently satisfy it.
        rule: >-
          An obligation nobody can meet is still an obligation. Deriving it from the available
          tooling lets the tooling define the standard.
      SCANNER_UNAVAILABLE:
        definition: No capable scanner exists in this kit for a discovered artifact class. A platform statement, not a developer one.
        rule: Distinct from UNAVAILABLE, which means a scanner exists and could not run here.
      COVERAGE_GAP:
        definition: ARTIFACT_PRESENT + CAPABILITY_REQUIRED + SCANNER_UNAVAILABLE. The code is here, a control is owed, and nothing looked.
        rule: >-
          THE THIRD ANSWER, and the one most often collapsed. NOT_APPLICABLE means the artifact is
          not here, so there is nothing to find. CLEAN means a scanner ran and found nothing --
          evidence of absence. COVERAGE_GAP is ABSENCE OF EVIDENCE, and reporting it as either of
          the others converts a hole into a reassurance. Proven live 2026-09-16: shell and GitHub
          Actions workflows were present in a scanned repository with no capable scanner, and the
          run was green.
      UNDETERMINED_PRESENT:
        definition: This ecosystem's probe failed. Presence was neither confirmed nor ruled out.
        rule: >-
          Force-enabled, and an explicit selector MUST NOT narrow it away. Configuration narrows
          among things known to be present; it has no authority to resolve an unknown into an
          absence.
      DISCOVERY_PARTIAL:
        definition: Some probes established applicability and at least one did not.
        rule: >-
          What the successful probes established STILL HOLDS. One failure does not convert six
          answers into ignorance — discarding established evidence is as destructive as inventing
          it, in the opposite direction.
      DISCOVERY_UNAVAILABLE:
        definition: EVERY probe failed. Applicability could not be established at all.
        rule: Everything runs. Over-scanning is a cost problem; under-scanning reported green is not.

  # ─────────────────────────────────────────────────────────────────────────
  # COVERAGE IS NOT APPLICABILITY, AND THIS NAMESPACE EXISTS BECAUSE COLLAPSING THEM HID A DEFECT.
  #
  # Discovery answers "what is here that I know how to scan?". It used to ask seven closed
  # questions and, hearing no seven times, report COMPLETE — so a repository written in languages
  # this platform does not support produced a green run over code nothing had looked at. Discovery
  # had not failed. It answered its own questions correctly and the wrong question completely.
  #
  # COMPLETE means "the survey ran". It does NOT mean "this repository is understood". Kept as a
  # separate namespace from discovery_state on purpose: a scanner gap is a KNOWN LIMITATION of the
  # platform, a survey failure is an ERROR CONDITION, and letting a permanent limitation hide
  # inside a transient error is how a coverage gap becomes invisible.
  coverage_state:
    description: How much of the caller's code this platform is capable of reasoning about at all.
    consumers: [security-gate, adopters evaluating the platform, coverage reporting]
    values:
      FULL:
        definition: No code was found that this platform lacks a scanner for.
      UNSUPPORTED_PRESENT:
        definition: Code is present that this platform has NO scanner for. It was not scanned.
        rule: >-
          A COVERAGE DECLARATION, NEVER A FINDING. Unsupported code is not a vulnerability and must
          never be scored, gated, or dispositioned as one. It tells an adopter precisely where this
          platform's assurance stops inside THEIR repository — which is the most useful sentence it
          can say to someone deciding whether to trust it. It must also never be silently absorbed
          into PASS: the run established nothing about those files.
      COVERAGE_UNDETERMINED:
        definition: The coverage probe itself could not run. Unknown, not absent.
        rule: >-
          The platform does not know whether it has blind spots here. That is a weaker claim than
          FULL and must not be reported as one.

  # ─────────────────────────────────────────────────────────────────────────
  finding_classification:
    description: What a RED result means, assigned before anything is changed.
    consumers: [operators, remediation decisions]
    values:
      KIT_DEFECT:                 {definition: The machinery is wrong., action: fix the kit — the ONLY class that justifies changing it}
      REPO_TRUE_FINDING:          {definition: The scanner is right., action: remediate the repository; never tune the scanner to hide it}
      ASSURANCE_PREREQUISITE_GAP: {definition: A condition prevented a claim being established., action: state the coverage boundary}
      FALSE_POSITIVE:             {definition: Produced, but does not mean what it appears to., action: narrow disposition with evidence}
      EXECUTION_UNAVAILABLE:      {definition: Never ran., action: clear the cause and re-run}
      POTENTIALLY_ABSENT:         {definition: Present earlier and absent now, where the later observation is NOT shown to have covered the scope it lived in., action: establish coverage before calling it fixed -- absence of the scope is not absence of the thing}
      REOPENED_BY_LAPSE:          {definition: The finding never changed; its disposition expired., action: re-decide with a named approver and a new expiry -- silence must never renew a disposition}
      UNKNOWN:                    {definition: Not yet established., action: NEVER assume clean}

  # ─────────────────────────────────────────────────────────────────────────
  disposition_type:
    description: >-
      An authorized decision that a specific finding should not block. Four MATERIALLY DIFFERENT
      truth claims. Collapsing them produces nonsense such as "remediated" findings a scanner
      detects forever.
    consumers: [security-gate, future findings model, audit]
    rule: >-
      A finding is exempted ONLY by an exact, unexpired, approved disposition. Dispositions are
      consumed from the PROTECTED DEFAULT BRANCH, never from the PR under evaluation — otherwise a
      PR can exempt the secret it introduces in the same PR.
    invariant: >-
      A DISPOSITION DOES NOT MUTATE EVIDENCE. It changes ENFORCEMENT against that evidence. The
      original observation is preserved forever. Without this rule the exception layer becomes
      destructive deduplication wearing governance perfume — the same failure as collapsing two
      corroborating scanners into one finding, arriving through the policy door instead.
    transitions:
      - "observed -> proposed              (anyone may propose)"
      - "proposed -> under_review          (Security picks it up)"
      - "under_review -> approved          (merged to the protected branch; ONLY now does it suppress)"
      - "under_review -> rejected          (returns to blocking)"
      - "under_review -> needs_evidence    (returns to proposed)"
      - "approved -> expired               (automatic; silence NEVER renews)"
      - "approved -> invalidated           (scope no longer matches, or REMEDIATED still reproduces)"
    forbidden_transition: "proposed -> suppressing (a proposal never buys passage)"

    required_fields:
      [fingerprint, scanner, rule, scope_path, disposition_type, rationale, evidence_ref,
       approver_role, created, expires]
    rejected_synonyms: >-
      ACCEPTED_RISK is the registered spelling. RISK_ACCEPTED and RISK_ACCEPTANCE were both in
      circulation -- one in the reporter's own suppression list, one in conversation. A reporter
      matching only its own spelling would honour nothing written to this schema, blocking an
      approved exception forever with no error anywhere. scan_report.py asserts that neither
      synonym suppresses.
    values:
      FALSE_POSITIVE:
        claim: The finding was never valid. The detector is wrong.
        evidence_must_show: why the detector is wrong
      ACCEPTED_RISK:
        claim: The finding is valid and remains. Authorized to proceed temporarily or conditionally.
        evidence_must_show: who accepted it, under what conditions, until when
      MITIGATED:
        claim: >-
          The finding remains technically observable, but compensating controls reduce effective
          risk enough for authorized continuation.
        evidence_must_show: which compensating control, and that it is in force
        note: NOT the same claim as "the scanner is wrong" and NOT the same as "we accept it as-is".
      REMEDIATED:
        claim: The underlying condition was corrected. Future scans should NOT reproduce it.
        self_invalidating: true
        rule: >-
          If the finding still reproduces, the disposition is STALE OR WRONG and must not suppress.
          This is the only disposition class that can be falsified by the scanner itself.
    secrets_rule: >-
      Secrets get a much narrower path. A documented dummy credential or generated fixture may
      qualify. "It looks like a secret but probably isn't" does not. A PROPOSED disposition never
      buys passage.

  # ─────────────────────────────────────────────────────────────────────────
  ticket_class:
    description: >-
      WHAT A TICKET IS ASKING FOR. Five classes, and the first of them asks nobody for anything —
      it is work. The other four are REQUESTS for a disposition, and a request is made by a person.
      Proposed as CANDIDATE in docs/architecture/TICKETING_CONTRACT.md section 9.1 and registered
      here on 2026-10-08 because scripts/reconcile_tickets.py now branches on the distinction.
    consumers: [scripts/reconcile_tickets.py, promotion review, audit]
    rule: >-
      A CLASS NEVER SUPPRESSES ANYTHING. The class says what is being asked for; disposition_type
      says what was granted; and they are different objects in different places. Reading a class as
      an outcome is how anyone who can file a ticket comes to authorise an exception.
    invariant: >-
      Each class names the ONE disposition_type it may result in, and naming it is not granting it.
      The arrow only points one way: a ticket carries a reference to a disposition request, a
      request becomes a disposition only on merge to the protected default branch, and nothing in
      the tracker can travel back up that chain.
    values:
      REMEDIATION_WORK_ITEM:
        definition: >-
          The finding is real and is being fixed. The only class this kit's automation opens, and
          the only one that is not a request for an authorization.
        results_in: REMEDIATED
        rule: >-
          Nobody approves it. Its terminal state is established by a scanner no longer reproducing
          the finding, never granted by a person — which is why REMEDIATED is self_invalidating.
          CLOSING THIS TICKET DOES NOT CLEAR THE FINDING.
      FALSE_POSITIVE_REQUEST:
        definition: A request to establish that the detector is wrong about this finding.
        results_in: FALSE_POSITIVE
        rule: >-
          Approved by Security, distinct from the requester. A secret finding takes the much
          narrower disposition_type.secrets_rule path instead.
      ACCEPTED_RISK_REQUEST:
        definition: >-
          A request to proceed with a real finding that will not be fixed now.
        results_in: ACCEPTED_RISK
        rule: >-
          Spelled to match the registered disposition rather than the reversed word order
          disposition_type.rejected_synonyms already refused. Requires acceptance_ref, owner_role
          and expires_at.
      MITIGATED_REQUEST:
        definition: >-
          A request recording that a compensating control is in force, evidenced rather than
          merely designed.
        results_in: MITIGATED
        rule: >-
          Carries its own re-verification expiry, because a compensating control can lapse
          silently. Re-verification keeps it standing; renewal does not.
      GRANDFATHER_TRACK_ITEM:
        definition: >-
          The finding was already present in production and is scheduled rather than blocking.
        results_in: ACCEPTED_RISK
        rule: >-
          The expiry is COMPUTED from the SLA, never chosen, and the record carries a track
          reference. Requires a claimable first-seen or an explicit record that the age is
          unestablished — assuming the age is how a finding introduced yesterday joins the
          day-one cohort.

  # ─────────────────────────────────────────────────────────────────────────
  ticket_lookup_outcome:
    description: >-
      WHAT A LOOKUP ESTABLISHED before anything was created. Proposed as CANDIDATE in
      docs/architecture/TICKETING_CONTRACT.md section 9.2 and registered here on 2026-10-08
      because scripts/reconcile_tickets.py now branches on it. IDENTITY_NOT_ESTABLISHED is added
      beyond the proposal: the contract assumed a finding arrives with a durable identity, and
      findings arrive without one.
    consumers: [scripts/reconcile_tickets.py, tests/prove_ticket_idempotency.py, audit]
    rule: >-
      NEVER A BOOLEAN. "No ticket was found" is four different facts — the sweep saw the project
      and nothing matched, the sweep never completed, a reference existed and did not resolve, or
      the finding had no identity to look up — and only the FIRST of them may be followed by a
      creation. Collapsing them produces a duplicate ticket for every finding on every run, which
      is the defect this namespace exists to prevent.
    invariant: >-
      THE UNCLASSIFIED CASE DEFAULTS TO BINDING_UNESTABLISHED, NEVER TO BINDING_ABSENT. A lookup
      that did not complete has established nothing, and treating its silence as absence is the
      permissive collapse — the error would be in the direction of writing to someone else's
      tracker. A ticketing outcome NEVER changes the finding's own routing under the rung: a
      ticketing failure does not soften a finding.
    values:
      LEDGER_BOUND:
        definition: >-
          The ledger named a ticket and the backend sweep returned it. The zero-cost steady state.
        rule: Creates nothing. Writes nothing unless something in the updatable set changed.
      BACKEND_BOUND:
        definition: >-
          No ledger reference, and exactly one ticket carrying this cluster's stamp was found —
          created by hand with the stamp applied, or by a run whose ledger write was lost.
        rule: >-
          Creates nothing AND owes a ledger repair. Self-healing an index is not a decision; the
          repair is recorded with the run that made it.
      BINDING_ABSENT:
        definition: >-
          The ledger held no reference, a COMPLETE sweep returned nothing under the stamp, and a
          calibration probe established that this channel can see tickets this credential did not
          create. Equivalent to observation_quality.VERIFIED_ABSENT for a tracker.
        rule: >-
          THE ONLY OUTCOME FROM WHICH CREATION IS AVAILABLE. All three conditions are required:
          absence reported by a channel not shown able to see the thing it reports absent is not
          absence, it is observation_quality.DISTINCTION_NOT_OBSERVABLE.
      BINDING_AMBIGUOUS:
        definition: More than one ticket carries this cluster's stamp.
        rule: >-
          Creates nothing AND UPDATES NOTHING. Ambiguity is resolved by cardinality, never by
          guessing which one is canonical — picking the first would be a decision made by
          pagination. Every candidate is named and routed routing_result.DECISION_REQUIRED for a
          human to declare canonical.
      BINDING_DANGLING:
        definition: >-
          A reference existed and did not resolve: not found, refused, or moved without a
          redirect.
        rule: >-
          NOT AN ABSENCE. A reference that did not resolve is an unresolved reference. Creation
          requires a probe first establishing observation_quality.DISTINCTION_OBSERVABLE, because
          a not-found from a channel that cannot see foreign tickets is indistinguishable from a
          deletion.
      BINDING_UNESTABLISHED:
        definition: >-
          The lookup did not complete — rate limited, an outage, an expired credential, or a
          sweep that paged out.
        rule: >-
          THE UNCLASSIFIED CASE DEFAULTS HERE, never to BINDING_ABSENT. Projects to
          publication_state.PUBLICATION_DEGRADED and routes routing_result.EVIDENCE_UNTRUSTED —
          never DECISION_REQUIRED and never clean. MUST NOT fail the scan, and MUST NOT soften the
          finding's routing. Any count taken from a partial sweep is a FLOOR, never a total.
      IDENTITY_NOT_ESTABLISHED:
        definition: >-
          The finding carries no durable identity, so there was nothing to look a ticket up BY and
          no lookup was attempted. The ticket is withheld.
        rule: >-
          NOT A FAILURE OF THE LOOKUP, AND NOT AN ABSENCE — the lookup never ran. A ticket keyed on
          an empty identity cannot be found again, so the next run would create it a second time
          and the run after that a third: creating one is strictly worse than withholding it. MUST
          be reported as its own state and never counted as a clean result or folded into a zero.
          The remedy is upstream, in finding_identity.py — an identity, not a ticket.
        note: >-
          Added beyond TICKETING_CONTRACT.md section 9.2's proposal. The contract assumed findings
          arrive fingerprinted; on 2026-10-08 identity extraction was returning UNFINGERPRINTABLE
          for findings that should fingerprint, and a reconciler without this state would have
          created a fresh duplicate set on every run.

  # ─────────────────────────────────────────────────────────────────────────
  ticket_trigger:
    description: >-
      WHY a finding's ticket was raised or reopened (FUTURE_WORK.md D5; KDEC-024). Three triggers,
      and they are not variations of one thing: two come from the scan, the third from the
      calendar.
    consumers: [scripts/reconcile_tickets.py, tests/prove_ticket_lifecycle.py, triage]
    rule: >-
      A TRIGGER NEVER SUPPRESSES ANYTHING AND IS NEVER INHERITED. A RECURRED finding does not
      inherit the earlier clearance, and a lapse does not renew the disposition that lapsed: each
      is CONTEXT on the ticket, never a suppression.
    values:
      NEW:
        definition: A fingerprint never seen before -- nobody has decided about this yet.
        rule: Raised only from ticket_lookup_outcome.BINDING_ABSENT.
      RECURRED:
        definition: >-
          A finding the kit VERIFIED ABSENT (its ticket closed on a clearance citing the run and
          commit) is detected again. A fix did not hold -- a revert, a merge, a dependency bump.
        rule: >-
          NOT the `falsified` reopen, which is an APPROVED REMEDIATED disposition the scanner still
          reproduces; RECURRED follows the kit's own evidenced closure. The earlier clearance is
          context, never a suppression.
      REOPENED_BY_LAPSE:
        definition: >-
          The finding never changed; the disposition that backed its closed ticket expired. Comes
          from the CALENDAR -- the scheduled clock (`--resurface`) -- because on the day an
          acceptance expires the scan is byte-identical to yesterday's.
        rule: Silence must never renew a disposition (finding_classification.REOPENED_BY_LAPSE).

  # ─────────────────────────────────────────────────────────────────────────
  ticketing_availability:
    description: >-
      Whether the TRACKER could be read and written this run (KDEC-024). Stated in every ticket
      run record, its summary and the reusable workflow's `ticketing_state` output.
    consumers: [scripts/reconcile_tickets.py, .github/workflows/reusable-ticket-reconcile.yml,
                tests/prove_ticket_lifecycle.py]
    rule: >-
      NEVER A SILENT PASS AND NEVER A GATE INPUT. TICKETING_UNAVAILABLE exits 3 and routes the
      ticketing claim EVIDENCE_UNTRUSTED; the security gate ran before ticketing and does not
      wait for it, so a tracker outage changes no verdict -- in either direction.
    values:
      TICKETING_AVAILABLE:
        definition: Every lookup, creation and update this run attempted completed.
      TICKETING_TEST_TARGETS_REAL_PROJECT:
        definition: >-
          A TEST ticketing run (any branch but the default one, in the sandbox environment; the
          mode is derived from the ref, never set by a variable -- KDEC-028) would write to a real
          project: its JIRA_PROJECT is one of JIRA_REAL_PROJECTS or a project the register's
          ticket_routing names, or JIRA_REAL_PROJECTS is unset so that cannot be ruled out.
        rule: >-
          Refused before anything is sent: configuration refuses it, run-start validation refuses
          it, and create refuses it. Nothing is written, the claim is EVIDENCE_UNTRUSTED (exit 3),
          and the remedy is to point the ticketing-test environment at a sandbox project. Test
          tickets that are written carry the label kit-test and a [TEST] summary prefix, and test
          ledger bindings are kept apart from real ones (test:<cluster key>), in both directions.
      TICKETING_UNAVAILABLE:
        definition: >-
          The tracker could not be reached, refused the credential, failed run-start validation,
          throttled past the retry ceiling, exhausted the per-run call budget, or a write failed.
        rule: >-
          Obligations are CARRIED in the ledger with their cause; nothing is concluded from what
          was not read. Never rendered as "no tickets were needed".
      TICKETING_NOT_CONFIGURED:
        definition: No tracker is configured (or two are, which is refused) -- the control is off.
        rule: >-
          Not "nothing to ticket" -- nothing was checked. The claim is EVIDENCE_UNTRUSTED.

  # ─────────────────────────────────────────────────────────────────────────
  ticket_state:
    description: >-
      The lifecycle of a PARENT ticket — the object coordinating one cluster's remediation.
      Carried from a prior engagement's ticket engine, whose parent/child work-item model solved
      something this kit had not: a cluster of six findings was six obligations sharing one status,
      so "partially fixed" was not representable.
    consumers: [scripts/ticket_model.py, scripts/reconcile_tickets.py, audit]
    rule: >-
      RESOLVED AND CLOSED ARE NOT THE SAME CLAIM. RESOLVED is the execution path saying the work
      is done; CLOSED is somebody having established that it is. Collapsing them means the only
      way to record completed work is to discharge the obligation, and the two facts become one
      field.
    invariant: >-
      A PARENT MAY NOT CLOSE WHILE ANY CHILD IS OPEN, DEFERRED OR DISPUTED. The parent does not
      certify its own closure — closure is evaluated from the children, and the evaluation returns
      which children are holding it open rather than a bare boolean.
    transitions:
      - "DRAFT -> OPEN                  (a human triages it; a created ticket is a PROPOSAL)"
      - "OPEN -> IN_PROGRESS | BLOCKED"
      - "IN_PROGRESS -> BLOCKED | RESOLVED | CLOSED  (CLOSED only under AUTHORITY_OVERRIDE)"
      - "BLOCKED -> IN_PROGRESS"
      - "RESOLVED -> CLOSED"
    forbidden_transition: >-
      OPEN -> CLOSED (closing an obligation nobody said was finished); and IN_PROGRESS -> CLOSED
      without the AUTHORITY_OVERRIDE rule and a recorded rationale.
    values:
      DRAFT:
        definition: >-
          Created by automation and not yet triaged by a person. The state every ticket this kit
          opens starts in.
        rule: >-
          A DRAFT IS A PROPOSAL, NOT AN OBLIGATION. It is the human-in-loop requirement expressed
          as an initial state rather than as a comment somebody can overlook.
      OPEN:
        definition: A person has triaged it and its children exist.
      IN_PROGRESS:
        definition: At least one child is being worked.
      BLOCKED:
        definition: Waiting on an external dependency or an approval.
        rule: >-
          NOT A FAILURE AND NOT A DEFERRAL. Blocked work is still owed and still counted; a
          deferral is a decision to stop looking at it for a stated period.
      RESOLVED:
        definition: The closure rule is satisfied and the execution path claims completion.
        rule: >-
          Claims completion. Does NOT establish it, and does not discharge the finding — a
          finding stops blocking only through a merged disposition.
      CLOSED:
        definition: Terminal. A person established that the obligation is discharged.
        rule: CLOSING A TICKET DOES NOT CLEAR A FINDING. The scanner decides that, by not reproducing it.

  # ─────────────────────────────────────────────────────────────────────────
  task_state:
    description: >-
      The lifecycle of a CHILD task — one finding inside a cluster ticket, carrying its own state.
      This is what makes a partially-remediated cluster representable.
    consumers: [scripts/ticket_model.py, scripts/reconcile_tickets.py, audit]
    rule: >-
      FIXED IS A CLAIM; VALIDATED IS AN ESTABLISHMENT. The edge from FIXED to DISPUTED is what
      makes the first one falsifiable, and a task that went straight from FIXED to CLOSED would be
      the implementer validating their own work.
    invariant: >-
      DISPUTED NEVER COUNTS AS RESOLVED. Conflicting evidence is not a resolution, and a cluster
      closing over the findings its own scanners disagreed about is the merged-away finding that
      leaves no trace.
    transitions:
      - "OPEN -> IN_PROGRESS | DEFERRED"
      - "IN_PROGRESS -> FIXED | DISPUTED | DEFERRED"
      - "FIXED -> VALIDATED | DISPUTED"
      - "VALIDATED -> CLOSED"
      - "DISPUTED -> IN_PROGRESS"
      - "DEFERRED -> OPEN            (ONLY via the explicit reopen path; never silently)"
    forbidden_transition: >-
      OPEN -> VALIDATED (validating work nobody did); FIXED -> CLOSED (self-validation); and any
      reopen of a DEFERRED task through the ordinary transition path.
    values:
      OPEN:        {definition: Awaiting work.}
      IN_PROGRESS: {definition: Being worked.}
      FIXED:
        definition: A fix has been applied and is not yet confirmed by anybody else.
        rule: A CLAIM BY WHOEVER DID THE WORK. Not evidence that the condition is gone.
      VALIDATED:
        definition: The fix was confirmed by something other than the party that applied it.
      DISPUTED:
        definition: The evidence conflicts — detectors disagree, or the fix did not hold.
        rule: >-
          NOT A RESOLUTION AND NOT A FALSE POSITIVE. It is an unresolved disagreement, and it
          blocks its parent's closure by design.
      DEFERRED:
        definition: >-
          Explicitly set aside, with a stated reason and a stated end date. Both are REQUIRED.
        rule: >-
          A DEFERRAL WITH NO REASON OR NO END DATE IS REFUSED. An absent end date reads as
          open-ended rather than as unspecified, which is how a deferred finding becomes a
          permanent silent exception that nothing ever revisits — the same failure as a
          disposition with no expiry, which this kit shipped once.
        reopen_rule: >-
          REOPENING IS EXPLICIT. The end date passing is a PRECONDITION that makes a reopen
          AVAILABLE; it is never a trigger that performs one. A reopen requires the date to have
          passed AND a named trigger AND a human approval. The reference engine this is carried
          from declared silent reopening forbidden and then reopened past-due items inside its own
          split routine with the actor recorded as the system; that path is deliberately NOT
          carried.
      CLOSED:
        definition: Terminal.

  # ─────────────────────────────────────────────────────────────────────────
  ticket_closure_rule:
    description: >-
      How a parent ticket's closure is evaluated. Evaluation only — a satisfied rule means a person
      MAY close the ticket, never that it is closed.
    consumers: [scripts/ticket_model.py, audit]
    rule: >-
      AN UNRECOGNISED CLOSURE RULE FAILS CLOSED. Membership of the allowed set, never inequality
      with one bad value — so a rule added later and not handled refuses instead of falling
      through to permitted.
    values:
      ALL_CHILDREN_RESOLVED:
        definition: >-
          Every child task is VALIDATED or CLOSED, and there is at least one child. A parent with
          no children has established nothing.
      AUTHORITY_OVERRIDE:
        definition: >-
          A named authority discharges the obligation by decision rather than by work.
        rule: >-
          REQUIRES A RECORDED RATIONALE. An override with no stated reason is indistinguishable
          from a mistake six months later.
    rejected_rule: >-
      A `quorum` rule closing a parent when a configurable fraction of children are resolved —
      defaulting to 0.8 — was present in the engine this model was carried from and is
      deliberately NOT registered. A threshold nobody derived, applied to obligations of unequal
      severity, closes a parent over the fraction that might be the only one that mattered. If a
      consumer wants it, it is a governance decision with a named authority and a defended number.

  # ─────────────────────────────────────────────────────────────────────────
  human_approval:
    description: >-
      Whether a person has explicitly permitted ONE mutation. Carried from a prior engagement's
      ticket engine, which held it as a numbered invariant covering every creation, closure,
      transition, split, reopen, suppression and validation — and that scope is NOT carried. See
      `mutation_class`, whose `rejected_rule` records why: applied to a deterministic reconciler
      a blanket gate is an off switch, not a control.
    consumers: [scripts/ticket_model.py, scripts/reconcile_tickets.py, audit]
    rule: >-
      AN APPROVAL IS NOT THE SAME FACT AS AN APPLY MODE. `--apply` is the operator — or the
      policy that scheduled the run — intending writes this run; an approval is a person
      permitting a specific judgement. A schedule can set the first, and a schedule is never an
      approver. WHICH MUTATIONS NEED THE SECOND IS DECIDED BY `mutation_class` AND NOWHERE ELSE:
      `ROUTINE_RECONCILIATION` needs only the first, `GOVERNANCE_DISPOSITION` needs both, and a
      mutation whose class is unstated is refused.
    invariant: >-
      An approval must carry a ROLE and a readable reason. An unattributed approval is a decision
      nobody has made — `control_weakening.WEAKENING_UNATTRIBUTED` one namespace over — and an
      approval whose rationale cannot be read later is unreviewable, which is the same defect as
      an exception with no justification.
    values:
      APPROVAL_GRANTED:
        definition: A named role permitted this mutation, with a stated reason.
      APPROVAL_NOT_GRANTED:
        definition: >-
          No approval, an ungranted one, one with no actor, or one whose reason is too thin to
          review.
        rule: >-
          MUST be reported as its own outcome and never folded into the dry-run path. "Nobody
          approved this" and "the operator asked for a plan" are different facts about the same
          non-write, and a reader who cannot tell them apart will assume the second.

  # ─────────────────────────────────────────────────────────────────────────
  mutation_class:
    description: >-
      WHETHER A MUTATION NEEDS A PERSON. Every mutation the ticketing path performs is mapped to
      one of these EXPLICITLY, in `ticket_model.MUTATION_CLASS`, with the reasoning for each row
      recorded beside it. `scripts/ticket_model.py --explain-mutations` prints the table.
    consumers: [scripts/ticket_model.py, scripts/reconcile_tickets.py, audit, governance]
    rule: >-
      THE CLASS IS LOOKED UP, NEVER INFERRED. No prefix rule, no name heuristic, no position in a
      tuple. A classifier with a rule in it is a classifier that can be argued with, and the
      argument happens at the moment somebody wants a disposition to go through.
    invariant: >-
      A MUTATION WHOSE CLASS IS NOT STATED REFUSES. Neither default is safe: defaulting to
      automatic hands a disposition the unattended path, and defaulting to approval reproduces
      the blanket gate that made the reconciler unrunnable. So there is no default.
    rejected_rule: >-
      "EVERY MUTATION REQUIRES EXPLICIT HUMAN APPROVAL" IS NOT CARRIED, and the rejection is the
      reason this namespace exists. A prior engagement's ticket engine held it as a numbered
      invariant covering every creation, closure, transition, split, reopen, suppression and
      validation, and the first draft of this kit's ticketing path imported it whole. Applied to
      a reconciler whose entire value is that it is deterministic, idempotent and evidence-backed,
      a blanket gate is not a control — it is an off switch, and a reconciler nobody runs
      reconciles nothing. The operator's correction, verbatim: a human is consulted "for something
      like an exception, exclusion, risk acceptance, mitigation, false positive, something that
      requires budget judgement or would impact the security and governance of the environment and
      system."
    values:
      ROUTINE_RECONCILIATION:
        definition: >-
          Deterministic, evidence-backed bookkeeping that changes nothing about what the
          organisation accepts. Creating a work item for a fingerprinted anchored cluster,
          re-syncing the machine-owned block, linking a child task, binding the ledger, recording
          progress a scanner can confirm, and closure reached BECAUSE every child is evidenced
          complete.
        rule: >-
          RUNS UNATTENDED. No approval is consulted and none is required. `--apply` remains a
          separate gate — it is the operator or the policy that scheduled the run intending writes
          rather than a plan — but it is not an approval and does not stand in for one.
        invariant: >-
          WHERE THE ROUTINE PATH IS UNATTENDED BECAUSE IT IS EVIDENCED, THE EVIDENCE IS REQUIRED.
          `ticket.close.ALL_CHILDREN_RESOLVED` refuses when the children are not supplied:
          closing on an absence is not closing on evidence. The audit history records
          `ticket_model.ROUTINE_ACTOR` rather than a person or "the system", so a reader can see
          at a glance that nobody signed for it because nobody had to.
      GOVERNANCE_DISPOSITION:
        definition: >-
          A judgement that changes what the organisation accepts: an exception, an exclusion, a
          false-positive call, a risk acceptance, a deferral (a time-boxed risk acceptance), the
          renewal or ending of one, accepting a compensating control instead of a fix, closure
          reached by judgement rather than by evidence, anything committing budget, and anything
          moving the security or governance posture of the environment or system.
        rule: >-
          REQUIRES AN APPROVAL CARRYING A ROLE AND A READABLE REASON — `human_approval` one
          namespace over. The refusal is reported as ITS OWN OUTCOME and never folded into the
          dry-run path.
        note: >-
          A disposition REQUEST reaching a ticket is still not a disposition. A finding stops
          blocking only when an exact, unexpired, approved disposition is merged to the protected
          default branch under CODEOWNERS. `scripts/reconcile_tickets.py` never writes one.
      MUTATION_CLASS_NOT_STATED:
        definition: >-
          The mutation is not in the table, so whether it is routine or a disposition has not
          been established.
        rule: >-
          REFUSED, and reported by name so a reader can tell it from a missing approval. A
          mutation added to the model and not added to the table stops working rather than
          quietly picking a side — which is also how an unrecognised disposition REQUEST is
          handled: `risk-accepted` is not `risk_acceptance`, and silently treating it as one
          would turn "we are asking you to accept this risk" into "somebody please fix this".

  # ─────────────────────────────────────────────────────────────────────────
  deferral_obligation:
    description: >-
      WHETHER A RECORDED DEFERRAL IS STILL IN FORCE. Computed from the deferral's end date and a
      reference date, and nothing else. Reported in every ordinary reconciliation run.
    consumers: [scripts/ticket_model.py, scripts/reconcile_tickets.py, triage, governance]
    rule: >-
      AN ELAPSED DEFERRAL CREATES A REVIEW OBLIGATION ON A PERSON, NOT AN ACTION BY THE MACHINE.
      Three values and never a boolean: "this deferral is fine" and "this deferral has no term to
      check" are different facts, and a caller that cannot tell them apart renders the second as
      the first.
    invariant: >-
      NOTHING REOPENS AND NOTHING GOES ON QUIETLY SUPPRESSING. The task stays DEFERRED — a
      deferral that reopens because a date passed is an obligation changing state with nobody
      having decided anything — and the acceptance is reported as lapsed in every run until an
      authorised person ends it or renews it to a future date. Both of those are
      `mutation_class.GOVERNANCE_DISPOSITION`. There is deliberately no "clear" or "dismiss": an
      obligation marked handled without the acceptance being ended or renewed is a suppression
      with a tidier name.
    rejected_rule: >-
      The engine this discipline was carried from declared that silent or automatic reopening was
      forbidden and then reopened past-due tasks inside its split routine with the actor recorded
      as the system. The first correction here forbade that and stopped — which left a past-due
      deferral either suppressing for ever or waiting for a trigger nobody fires. Both are
      silence, and silence is what the rule exists to forbid.
    values:
      DEFERRAL_WITHIN_TERM:
        definition: >-
          An end date is recorded, a reference date was supplied, and the end date has not passed.
        rule: >-
          NOT REPORTED in the past-due section. A review signal that fires on deferrals in good
          standing is noise, and noise gets ignored.
      DEFERRAL_PAST_DUE:
        definition: >-
          The recorded end date is earlier than the reference date. The acceptance has lapsed and
          the suppression is no longer authorised.
        rule: >-
          VISIBLE IN THE ORDINARY OUTPUT WITH NO FLAG ENABLING IT, and it makes the run exit 1. A
          past-due acceptance that only appears under a switch is one nobody sees; one that exits
          0 is one nobody chases.
      DEFERRAL_TERM_UNKNOWN:
        definition: >-
          No end date is recorded, the recorded one is not an ISO YYYY-MM-DD date, the deferral
          record could not be read at all, or no reference date was supplied.
        rule: >-
          REPORTED ALONGSIDE DEFERRAL_PAST_DUE, never filtered out. An absent expiry is NOT an
          open-ended one — it is unspecified, and it is the defect this kit already shipped once
          in its suppression path, so it must not be the one case that stays quiet. A date is
          never parsed hopefully: one this model guessed at would decide whether an acceptance is
          still in force.

  # ─────────────────────────────────────────────────────────────────────────
  compliance_review_type:
    description: >-
      THE SECOND OBLIGATION A FINDING CLASS CAN IMPLY. Carried from a prior engagement's ticket
      engine, which mapped a vulnerability class to the appropriate ticket AND to the
      corresponding compliance request through a table, with no model and no agent in the path.
      A reconciler whose output depends on a model cannot be defended to an auditor.
    consumers: [scripts/ticket_model.py, scripts/reconcile_tickets.py, compliance, audit]
    rule: >-
      A COMPLIANCE REVIEW IS A SECOND OBLIGATION, NOT A RESTATEMENT OF THE FIRST. Remediating the
      finding does not discharge the review, and the review does not remediate the finding.
      Collapsing them means one of the two silently stops happening.
    invariant: >-
      THE PAIRING IS A TABLE LOOKUP, DETERMINISTIC, KEYED ON THE REGISTERED `finding_subject`.
      No inference, no model, no guess. Where the table has no row, or the subject was never
      established, or the subject is unrecognised, the answer is PAIRING_NOT_ESTABLISHED — which
      is a state and never a silent "none required".
    note: >-
      The TABLE'S CONTENT is a governance proposal awaiting an owner; the MECHANISM is what was
      carried. Which subject warrants which review depends on the framework a consumer is held to,
      and this kit does not know it. `scripts/ticket_model.py --explain-pairing` prints the
      current table with the reasoning for every row.
    values:
      COMPLIANCE_VALIDATION:
        definition: >-
          Establish whether a declared control is actually in force. The assurance question rather
          than the design question.
        paired_from: RESOURCE, RUNTIME_OBSERVATION
      FRAMEWORK_GAP_REVIEW:
        definition: >-
          A control the framework requires is absent from the declared estate — a gap in the
          mapping rather than only a defect to fix.
        paired_from: IAC_PLAN, POLICY
      REGULATORY_OVERLAY_REVIEW:
        definition: >-
          A regulatory overlay applies independently of exploitability, most often where access
          and entitlement are concerned.
        paired_from: IDENTITY_ASSIGNMENT
      PAIRING_NOT_ESTABLISHED:
        definition: >-
          The lookup was performed and yielded no review: the subject is deliberately unmapped,
          was never established, or is not in the table.
        rule: >-
          DOES NOT ESTABLISH THAT NO REVIEW IS REQUIRED. It establishes that this kit does not
          know of one. A secret finding also lands here deliberately — its remedy is rotation, and
          a review in front of a rotation is delay wearing governance clothing.

  # ─────────────────────────────────────────────────────────────────────────
  finding_confidence:
    description: >-
      How strongly the evidence supports that a cluster is ONE REAL OBLIGATION. Derived
      deterministically from three observable things: how many scanners anchored on the cluster,
      whether a durable identity was established, and whether the evidence channel was degraded.
    consumers: [scripts/ticket_model.py, scripts/reconcile_tickets.py, triage]
    rule: >-
      A LABEL, WITH ITS DERIVATION CARRIED ALONGSIDE IT, AND NEVER A NUMBER.
      `epistemic_property.CONFIDENCE` already requires a confidence claim to be answerable —
      "confidence in WHAT claim, based on WHICH evidence, diminished by WHICH missing
      observations, computed under WHICH model, at WHAT time" — and calls one without provenance
      "numerology with an API". The engine this was carried from held `confidence` as a float
      defaulting to 0.5; that default answers none of those questions and is indistinguishable
      downstream from a measured 0.5, so it is deliberately NOT carried.
    invariant: >-
      SCOPE: this is confidence that the finding exists and that the cluster's members belong
      together. It is NOT a claim about exploitability, business risk or fix priority. One label
      covering all of those would be a composite verdict stronger than its weakest axis, which
      this registry's governing rule forbids.
    values:
      CORROBORATED_ANCHORED:
        definition: >-
          Two or more independent scanners anchored on the same durable identity, through a
          channel that was not degraded.
        rule: >-
          Corroboration across independent detectors, not one tool agreeing with itself. The
          derivation names every contributing scanner so the claim can be checked.
      SINGLE_SOURCE_ANCHORED:
        definition: One scanner, with an established durable identity.
        rule: >-
          NOT DOUBT ABOUT THE FINDING — only the absence of a second observation. Reading it as
          weak evidence is how a real finding gets deprioritised for being seen once.
      CONTESTED_ANCHORED:
        definition: >-
          Anchored, and a scanner of the SAME detection class (dependency, container or secret --
          classes whose detectors match shared identifiers) ran this run, established its row,
          covered the file, and did NOT report it (KDEC-024, FW-3a).
        rule: >-
          DISAGREEMENT ESCALATES, NEVER AVERAGES. The finding stays ticketed -- a peer's silence
          suppresses nothing -- its ticket names the silent peer and carries a disagreement label,
          and a person is asked once (DECISION_REQUIRED on the ticket run). It changes no gate
          input. SAST and IaC are never contested this way: their rule sets differ, so a peer's
          silence observes nothing about another tool's rule.
      CONFIDENCE_NOT_ESTABLISHED:
        definition: >-
          No durable identity was established, or the evidence channel was degraded so the
          contributor set is a FLOOR rather than a count.
        rule: >-
          NOT LOW CONFIDENCE. NO confidence — a different state. Scanners that would have
          corroborated may simply not have been read, and a count from a PARTIAL collection is a
          floor and never a total.

  # ─────────────────────────────────────────────────────────────────────────
  rollback_state:
    description: >-
      What may be done about a change that failed. Found MISSING from this registry by the
      reconciler on its first run -- it was live vocabulary in ROLLBACK_CONTRACT.md driving real
      decisions, defined nowhere central. Exactly the gap this file exists to close.
    consumers: [deploy workflows, build-and-push, incident response]
    rule: >-
      "Put it back how it was" is NOT always the safe outcome. An unknown must not resolve toward
      destruction merely because destruction is the easier branch to code.
    values:
      AUTO_ROLLBACK_ALLOWED:
        definition: Reversible and safe. Proceed, then VERIFY.
        note: A rollback command exiting 0 is not proof of restored service.
      ROLLBACK_REQUIRES_VALIDATION:
        definition: Reverse, but prove the restored state is correct before declaring success.
      ROLLBACK_REQUIRES_HUMAN_DECISION:
        definition: >-
          Prior state unknown, or reversal has consequences a machine should not weigh.
        emitted_by: >-
          scripts/rollback_sequence.py as the record's rollback_state (and the rollback reusable's
          rollback_state output) whenever a person must decide: a dependency conflict (KDEC-023), a
          halt, an ineligible step. Before KDEC-023 the census found it was never emitted.
        produced_by: >-
          A cancelled or TIMED-OUT mutation. A timeout is a cancellation nobody chose and nobody is
          watching, which is why mutating jobs are deliberately unbounded pending this design.
      ROLLBACK_PROHIBITED:
        definition: Forward-fix only. Reversal is worse than the failure.
        examples: >-
          Reverting an emergency mitigation restores a known-exploitable state; reverting an RBAC
          removal hands back access that was deliberately taken away.
      ROLLBACK_VERIFIED:
        definition: >-
          Restored service has been PROVEN. Asserted only after verification, never after a rollback
          command merely exits 0 -- same rung problem as a green job that ran no scanner.

  # ─────────────────────────────────────────────────────────────────────────
  # Registered 2026-10-14 when the mechanism landed (DCR section 3.2, proposed in section 4).
  # Checked first: rollback_state says what MAY be done about a failed change; change_artefact
  # names the records of what a run did. Neither can say what the target held BEFORE the run,
  # and that answer is the input every reversal decision starts from.
  previous_state:
    description: >-
      What the deploy's capture step established about the target before the first mutation.
      Exactly one value per run, and never inferred from an empty string.
    consumers: [reusable-deploy-appservice, reusable-deploy-containerapp, scripts/deploy_contract.py,
                tests/prove_deploy_outcome.py]
    rule: >-
      A READ FAILURE IS NOT AN ABSENCE. The Container Apps capture ended `2>/dev/null || true`, so
      a throttled or permission-denied read and a first deployment both produced "", and "" skipped
      the rollback. UNKNOWN fails the capture loudly, before anything is changed.
    values:
      EXISTING_DEPLOYMENT:
        definition: >-
          The target was read and a prior deployment observed, with the declared mutation surface
          captured into the pre-change snapshot.
      EMPTY:
        definition: >-
          Both reads succeeded and nothing was deployed: the absence was MEASURED, not assumed.
        rule: >-
          A rollback point, not "nothing to do": reversal returns the target to this measured
          absence (ROLLBACK_TO_EMPTY), and every object it would remove still runs the per-object
          preconditions of DCR section 8, because empty-then says nothing about the target now.
      UNKNOWN:
        definition: >-
          The capture could not establish either of the above -- a read failed, timed out or was
          never made.
        rule: Resolves toward reconcile-and-report, never toward a destructive branch or a mutation.

  # Registered 2026-10-14 with the mechanism (DCR section 3.5, proposed in section 4).
  rollback_capability:
    description: >-
      Whether this change can be reversed, established BEFORE the first irreversible mutation
      from the captured previous state and the adapter's mechanism for the observed configuration.
      The environment tier consumes it to decide whether the mutation may proceed.
    consumers: [reusable-deploy-appservice, reusable-deploy-containerapp, scripts/deploy_contract.py]
    rule: >-
      GOVERNANCE BELONGS BEFORE THE POINT OF NO RETURN. At uat and prod UNAVAILABLE refuses the
      deploy before it mutates; at lower tiers it proceeds as a recorded accepted risk.
    values:
      AVAILABLE:
        definition: >-
          A prior state was captured and a reversal mechanism valid for the target's observed
          configuration exists (multiple-revision traffic weights; slot swap-back / image restore).
      UNAVAILABLE:
        definition: >-
          No usable prior state, no valid mechanism for this configuration (single-revision mode),
          or reversal authority withheld by the caller.
      NO_PRIOR_STATE:
        definition: >-
          The target is measured EMPTY. Reversal means removing what this run creates -- a
          capability, not the absence of one.

  # ─────────────────────────────────────────────────────────────────────────
  # DCR section 4 proposed this sibling of rollback_state: rollback_state says what MAY be done
  # about a failed change; this says what a run actually DID, established from reconciled live
  # state. Values are registered as the deploy reusables start emitting them, never ahead.
  deployment_outcome:
    description: >-
      What a deploy run actually did, from reconciled live state rather than step exit codes.
      A run ends in exactly one terminal outcome; the reversal paths below are the route a
      reversal took, and are always qualified by whether it was verified.
    consumers: [reusable-deploy-appservice, reusable-deploy-containerapp, scripts/deploy_contract.py,
                promotion gate, incident response]
    rule: >-
      Every identifier reported beside an outcome is labelled ATTEMPTED or NOW SERVING, and NOW
      SERVING is read back from live state. Echoing an input there is the defect this exists for.
    values:
      DEPLOY_REFUSED:
        definition: >-
          The run stopped BEFORE its first mutation -- a gate verdict that does not permit, an
          unregistered tier, a mutable tag, an UNKNOWN previous state, an unavailable rollback
          capability at a production tier. Nothing in live state was changed by this run.
        rule: >-
          Not in DCR section 4's proposal, which had no value for "never mutated"; added because
          reporting a refusal as a failed deploy reads as "something changed and broke".
      DEPLOY_HEALTHY:
        definition: >-
          The mutation took effect AND the intended artefact was read back loaded, healthy and
          serving the consumer path. Not a promotion claim.
      PARTIAL_APPLY:
        definition: >-
          The mutation was issued and never confirmed: objects may exist that no state record
          knows about.
        produced_by: >-
          Termination or an adapter error between the first mutating call and its confirmation.
        note: Recovery is out-of-band and manual by construction; the record that would scope it is incomplete.
      MANUAL_RECOVERY_REQUIRED:
        definition: >-
          Verification failed and no automated path reached a known-good state -- reversal
          disabled, or the run stopped before it. The failed change is still in place.
        rule: Carries an escalation contract (owner, artefacts, what an automated actor may and may not do).
      ROLLBACK_TO_PRIOR:
        definition: >-
          Reversal performed against a captured prior deployment. Not yet proven; a reversal path
          is never terminal on its own.
      ROLLBACK_TO_EMPTY:
        definition: >-
          Reversal performed against a MEASURED empty prior state: what this run created was
          removed and what it changed was restored, each object only where its live-state
          preconditions held, leaving unrelated resources alone.
        rule: >-
          A FIRST-CLASS RECOVERY PATH, NOT AN ERROR, and NOT teardown of the environment. A
          workflow that skips reversal when no prior deployment exists skips recovery on exactly
          the population that orphans the most.
      ROLLBACK_PARTIAL:
        definition: >-
          Some of the change manifest was reversed and some was not, established by reading live
          state back against the pre-change snapshot; each item's reason and the residue are
          recorded. Deliberate retention is legitimate WHEN STATED.
        rule: >-
          NEVER ROUNDS UP TO ROLLBACK_VERIFIED (registered under rollback_state and reused here
          unchanged, so the two namespaces agree). A consumer that treats partial as verified has
          broken the taxonomy even though every word it used was valid.
      STATUS_UNTRUSTED:
        definition: >-
          Infrastructure was mutated and the run then lost the ability to describe it: a read-back
          failed, or every reversal entry was withheld as untrusted, so nothing was reconciled.
        rule: >-
          NOT "failed" -- failure implies nothing changed. The honest report is mutated,
          unreconciled, untrusted; it is never resolved by assuming the attempt took or did not.

  # ─────────────────────────────────────────────────────────────────────────
  # Registered 2026-10-22 (KDEC-019 item 4, lane L-RB) with the mechanism: scripts/rollback_sequence.py,
  # .github/workflows/reusable-rollback-sequence.yml, ROLLBACK_CONTRACT.md "Sequential rollback".
  # Checked first: rollback_state says what MAY be done about ONE failed change and deployment_outcome
  # what ONE run did; neither can say what happened to an ORDERED SET of reversals with tests between
  # them, nor why a step was or was not reversed. rollback_state's two refusals are reused unchanged
  # as the disposition of an ineligible step.
  rollback_sequence:
    description: >-
      What a sequential rollback did: several standing deployments reversed in REVERSE deployment
      order, each step eligible, reversed by the deploy contract, probed and end-to-end tested
      before the next. Exactly one value per sequence.
    consumers: [scripts/rollback_sequence.py, reusable-rollback-sequence, tests/prove_rollback_sequence.py]
    rule: >-
      VERIFIED ONLY WHEN EVERY STEP IS ROLLBACK_STEP_VERIFIED. A halt never rounds up, and the
      sequence never continues past a step whose rollback, health probe or end-to-end tests did not
      hold. No end-to-end tests is a refusal, not a pass (owner, 2026-10-22: tests between each
      rollback). KDEC-021 (owner, 2026-10-23): the tests run over a TEST PERIOD after every step
      (start, interval, end), and a failure at any check halts; a kit deployment that landed
      mid-sequence is rolled back first; an App Service sequence ends on the version it requested.
    values:
      ROLLBACK_SEQUENCE_VERIFIED:
        definition: >-
          Every step was eligible, reversed and ROLLBACK_VERIFIED by the deploy contract, and
          answered its health probe and passed the application's end-to-end tests at every check of
          its test period, newest first; production is on the requested version when one was named.
      ROLLBACK_SEQUENCE_REFUSED_NO_TEST_PERIOD:
        definition: >-
          The end-to-end test period was 0. Refused before login and before the first step; nothing
          was touched. Registered 2026-10-23 (KDEC-021, lane L-RB2).
        rule: >-
          THE SAME FAMILY AS ROLLBACK_SEQUENCE_REFUSED_NO_E2E: one instant is not a period, and the
          owner's rule is "There needs to be an end to end test period." A period past the bound
          (240 minutes) is ROLLBACK_SEQUENCE_REFUSED_INPUT.
      ROLLBACK_SEQUENCE_REFUSED_NO_E2E:
        definition: >-
          No end-to-end test command was supplied. Refused before login and before the first step;
          nothing was touched.
        rule: >-
          THE FAIL-SAFE, CHOSEN OVER "RUN AND RECORD THE GAP": running the reversals untested is the
          broken intermediate state the rule forbids, and a record after the fact cannot un-break a
          user path. Each deploy's own single-run reversal is unaffected.
      ROLLBACK_SEQUENCE_REFUSED_INPUT:
        definition: >-
          The sequence, or a step's deploy evidence, could not be read whole or was inconsistent (an
          unknown field, a run named twice, a manifest belonging to another run, a step outside the
          target whose lock is held, an App Service sequence naming no target_version, a
          target_version the target did not hold before the deployments, a test period past its
          bound). Refused before anything was touched.
      ROLLBACK_SEQUENCE_STOPPED_INELIGIBLE:
        definition: >-
          A step was not eligible (rollback_step_eligibility) and the sequence stopped BEFORE it.
          The steps before it are reversed and verified; it and the steps after it are untouched.
      ROLLBACK_SEQUENCE_HALTED_ROLLBACK_UNVERIFIED:
        definition: >-
          A step's reversal ended ROLLBACK_PARTIAL or STATUS_UNTRUSTED. The sequence halts; a partial
          rollback is never verified and no test is run on it.
      ROLLBACK_SEQUENCE_HALTED_HEALTH_FAILED:
        definition: >-
          A step was reversed and verified, but at a check of its test period the health probe on the
          consumer-facing name never answered 200. The end-to-end tests are not run on it; the
          sequence halts.
      ROLLBACK_SEQUENCE_HALTED_E2E_FAILED:
        definition: >-
          A step was reversed, verified and healthy, but at a check of its test period (start,
          interval or end) the application's end-to-end tests failed or exceeded their bound. The
          sequence halts for a human decision; a pass at the start is not the period.
        rule: A hung test is a failed test, never a pass.
      ROLLBACK_SEQUENCE_STOPPED_DEPENDENCY_CONFLICT:
        definition: >-
          An ARM step's dependency review (rollback_dependency_outcome) found a node another actor
          changed: the full rollback was refused, and either the independent nodes were reversed,
          verified and given their test period (ROLLBACK_STEP_PARTIAL) or nothing was touched. The
          sequence stops there for a human, with the dependency graph; the steps after it are
          untouched. Registered 2026-10-23 (KDEC-023, lane L-RB3).

  rollback_sequence_step:
    description: What happened to ONE step of a sequential rollback. Exactly one value per step.
    consumers: [scripts/rollback_sequence.py, tests/prove_rollback_sequence.py]
    rule: >-
      A STEP IS COMPLETE ONLY WHEN ELIGIBLE, ROLLBACK_VERIFIED, HEALTHY AND ITS END-TO-END TESTS
      PASSED. A step that was never reached says so; silence about a step is indistinguishable from
      a step that was reversed.
    values:
      ROLLBACK_STEP_VERIFIED:
        definition: Eligible, reversed and verified, healthy, end-to-end tests passed.
      ROLLBACK_STEP_HALTED:
        definition: The step ran and its reversal, health probe or end-to-end tests did not hold.
      ROLLBACK_STEP_INELIGIBLE:
        definition: >-
          Judged not eligible from a fresh live read; nothing of it was touched. Its disposition is
          ROLLBACK_REQUIRES_HUMAN_DECISION or ROLLBACK_PROHIBITED (rollback_state).
      ROLLBACK_STEP_NOT_REACHED:
        definition: The sequence was refused, stopped or halted before this step; it is untouched.
      ROLLBACK_STEP_PARTIAL:
        definition: >-
          KDEC-023. The dependency review refused the full rollback of the step; the nodes
          independent of the cross-edit were reversed, verified (every other entry read back
          byte-identical) and passed the test period. The rest is left with its reasons for a human.
        rule: NEVER ROUNDS UP TO ROLLBACK_STEP_VERIFIED; the sequence stops after it.

  rollback_step_eligibility:
    description: >-
      Why a step of a sequential rollback was eligible, judged from a fresh live read just before it
      against what the deploying run recorded. The two bases the owner named (KDEC-019 item 4).
    consumers: [scripts/rollback_sequence.py, tests/prove_rollback_sequence.py]
    rule: >-
      EVERY UNKNOWN RESOLVES TO A HUMAN DECISION, NEVER TO THE REVERSAL. Revisions created by steps
      this sequence already reversed are its own, not another actor's. A change with no kit stamp is
      another actor's and always a human decision; a KIT release that landed after the sequence
      started is not judged here -- it is rolled back first (KDEC-021).
    values:
      ELIGIBLE_UNTOUCHED:
        definition: >-
          Nothing else touched the resource: every object the run's manifest names holds what the
          run left (P1 stamp, P2 version), no later release stands on it (P6), nothing labels it
          (P5), and nothing else on the resource moved.
      ELIGIBLE_OWNED_PART_SEPARABLE:
        definition: >-
          The resource is shared and something else on it moved, but this deployment's own part (on
          a Container App: its revision and its traffic) is intact and is reversed on its own -- DCR
          section 8.1, "the unit of conflict is the mutation".
        rule: >-
          Container Apps only. An App Service reversal is verified across every slot it captured,
          so a moved slot makes the step ineligible rather than certainly partial.

  # ─────────────────────────────────────────────────────────────────────────
  # Registered 2026-10-23 (KDEC-023, owner; lane L-RB3) with the mechanism: rollback-resource-classes.yaml,
  # scripts/rollback_dependencies.py, scripts/rollback_hold.py, tests/prove_rollback_dependencies.py.
  # Checked first: rollback_step_eligibility says why a step MAY be reversed and reversal_disposition
  # what one object's reversal is; neither classes a resource as shared or whole, says what a
  # release that touched SEVERAL resources may still reverse once one is cross-edited, nor what an
  # incoming deploy may do after a rollback.
  rollback_resource_class:
    description: >-
      How a rollback treats one Azure resource type (rollback-resource-classes.yaml). A type the
      registry does not name is never guessed: a human decision.
    consumers: [scripts/rollback_dependencies.py, rollback-resource-classes.yaml, tests/prove_rollback_dependencies.py]
    rule: >-
      Owner, 2026-10-23: shared, multi-configurable resources (Front Door, NSGs, firewall and WAF rules,
      routing) roll back only the product's configs; a solid stable resource changed by something else
      gets the dependency review and a partial or no rollback.
    values:
      SHARED_MULTI_CONFIG:
        definition: >-
          Many products keep their own config ENTRIES in one resource (Front Door routes, origin
          groups and rule sets; NSG security rules; firewall policy rule collections; Application
          Gateway listeners and rules and WAF custom rules; route-table routes; DNS record sets; API
          Management APIs and products). Only the product's entries are reversed; every other entry
          and the parent are read back byte-identical before and after.
      STABLE:
        definition: >-
          One product's whole resource (App Service and Function apps, Container Apps and AKS,
          Container Instances, SQL, PostgreSQL, Cosmos DB, storage accounts, Key Vaults, VMs). Changed
          by anything but the release being rolled back, it is not reversed; the dependency review
          decides what else may be.

  rollback_dependency_outcome:
    description: >-
      What the dependency review of one release decided, from a fresh live read of every node it
      changed (marks: unchanged, changed-by-this-release, changed-by-other, unknown, not-judged) and
      the graph of who depends on what. Exactly one value per reviewed step.
    consumers: [scripts/rollback_dependencies.py, scripts/rollback_sequence.py, tests/prove_rollback_dependencies.py,
                tests/prove_seam_app_rollback_refuses_shared_entry.py, schemas/rollback-sequence.schema.json]
    rule: >-
      THE UNIT OF CONFLICT IS THE MUTATION, AND ITS DEPENDENCIES. A node another actor changed (or that
      cannot be read) is never reversed, and neither is any node that depends on it, that it depends on,
      or that is evaluated together with it. Partial and refused are ROLLBACK_REQUIRES_HUMAN_DECISION,
      with the graph (JSON and Mermaid) in the record, the evidence and the summary.
    values:
      ROLLBACK_DEPENDENCY_CLEAR:
        definition: Nothing else changed what the release changed (stable resources only); the full rollback runs.
      ROLLBACK_SCOPED_TO_PRODUCT_CONFIG:
        definition: >-
          Nothing else changed the product's part; shared resources were reversed entry by entry, only
          the product's entries, and every other entry read back byte-identical. Other products moving
          their own entries since does not matter (the basis is then ELIGIBLE_OWNED_PART_SEPARABLE).
      ROLLBACK_PARTIAL_DEPENDENCY_CONFLICT:
        definition: >-
          A node was changed by another actor: the FULL rollback is refused; the nodes independent of
          every cross-edit are reversed and verified; the rest is left, each with its reason.
      ROLLBACK_REFUSED_DEPENDENCY_CONFLICT:
        definition: >-
          Every node the release changed is cross-edited or tied to one that is: nothing is reversed.
      ROLLBACK_REFUSED_PLATFORM_OWNED:
        definition: >-
          With the seam in force (OF-5 K-5; rollback_sequence.py --seam-ownership, passed when the environment
          opts into the KDEC-030 lease): a node whose type's entry_owner is landing-zone (a shared entry:
          Front Door, DNS, WAF, NSG, firewall, route; or a platform resource), or a release target
          (kit-release-fields) offered for a whole-body ARM PUT, is never read for reversal and never written
          by an application rollback; its reverser is the landing zone's recovery. Everything tied to it is
          held as for a cross-edit; independent release-owned nodes are still reversed.
          ROLLBACK_REQUIRES_HUMAN_DECISION. Outranks PARTIAL and REFUSED.
      ROLLBACK_REFUSED_FOREIGN_EVIDENCE:
        definition: >-
          With the seam in force: the step's resources.json is not the evidence of a kit deploy of the
          locked target (its release_id is not run-<id>-<attempt>, its producer is the landing zone, or it
          names another target -- for example a landing-zone apply's); the whole sequence is refused before
          anything is read live. Emitted as rollback_refusal by rollback_sequence.py.
        rule: Never a step's dependency_review outcome; a refusal of the INPUT (ROLLBACK_SEQUENCE_REFUSED_INPUT).

  rollback_dependency_check:
    description: >-
      What the deploy reusables decided, before login, about an incoming deploy of a target that was
      rolled back (scripts/rollback_hold.py check, against the target's rollback marker). Exactly one
      value per deploy.
    consumers: [scripts/rollback_hold.py, reusable-deploy-appservice, reusable-deploy-containerapp,
                tests/prove_rollback_dependencies.py]
    rule: >-
      Owner, 2026-10-23: "We need to do a dependency check on the incoming deployment to ensure that it
      isn't reliant on things that were just rolled back ... If there are no dependencies on rolled back
      items then deploy it." No override input: the fix is to correct the deploy. A check that cannot be
      completed never lets the deploy proceed blind.
    values:
      ROLLBACK_CHECK_NOT_REQUIRED:
        definition: >-
          No rollback of the target is on record, or the deploy's base commit is newer than the
          rollback's completion (it was built after it).
      DEPLOY_NO_ROLLBACK_DEPENDENCY:
        definition: >-
          The deploy was built before the rollback finished and was checked -- release lineage, image,
          declared dependencies -- and depends on nothing the rollback took out. It proceeds, with the note.
      DEPLOY_REFUSED_ROLLBACK_DEPENDENCY:
        definition: >-
          The deploy is built on a rolled-back commit, ships a rolled-back image, or declares a
          dependency on something the rollback removed or changed. Refused before login, with a report
          naming the rollback and each dependency (old -> new, or no longer exists).
      ROLLBACK_DEPENDENCY_CHECK_INCOMPLETE:
        definition: >-
          The marker, the commit or the comparison could not be read: refused before login, with the reason.

  # KDEC-030 DRAFT (PROPOSED, lane L-SEAM, 2026-10-26; docs/architecture/LZ_KIT_SEAM_CONTRACT.md).
  # target_lease is emitted by scripts/target_lease.py (the model and, since lane L-SEAM2 2026-10-27,
  # its CLI through the target-lease composite), proven by tests/prove_target_lease.py and
  # tests/prove_target_lease_crossrepo.py; the deploy reusables emit it only when opted in. Since OF-5
  # (2026-10-28, KDEC-034 proposed) the kit side of the rest is wired, opt-in with the lease:
  # seam_ownership_refusal and seam_ownership_check by the deploy reusables' `seam` step (K-6), the two
  # rollback_dependency_outcome values by the ARM rollback (K-5). seam_field_drift stays a CANDIDATE: its
  # emitter is the landing zone's seam detector.
  target_lease:
    description: >-
      What the cross-repository target lease decided for one acquisition, fence or mutation. One
      lease per deploy target (an Azure Storage blob lease plus a generation in its metadata, the
      fencing token), taken by the landing-zone pipeline and the kit alike, because a GitHub
      concurrency group is evaluated inside one repository and cannot serialise the two.
    consumers: [scripts/target_lease.py, tests/prove_target_lease.py, tests/prove_target_lease_crossrepo.py,
                .github/actions/target-lease,
                "reusable-deploy-appservice, reusable-deploy-containerapp, reusable-rollback-sequence (opt-in: KIT_TARGET_LEASE_ACCOUNT)",
                scripts/deploy_contract.py, "(owed) the LZ apply and destroy jobs"]
    rule: >-
      A LOCK A HOLDER CAN LOSE WITHOUT NOTICING IS NOT A LOCK. Every mutation is fenced before it is
      sent and checked again after it; a lost lease is never reported as a clean mutation, and a
      holder that died mid-mutation is never taken over by a machine.
    values:
      LEASE_HELD:
        definition: >-
          Another live holder (inside its logical expiry) holds the target. The acquirer stops before
          its first mutation, naming the holder; it does not wait inside a mutating job.
      STALE_LEASE_HOLDER:
        definition: >-
          The token's lease id is no longer the blob's lease (broken, released, taken over), or its
          generation or holder is not the blob's current one. The mutation is not sent.
      LEASE_EXPIRED_HOLDER:
        definition: >-
          The token is still the blob's lease but past its own logical expiry (it stopped
          heart-beating); a contender may take over at any moment, so the mutation is not sent.
      LEASE_ABANDONED_MID_MUTATION:
        definition: >-
          The holder expired while its metadata said it was mutating. No automatic takeover: the
          target's state is unknown and a human (the break authority) decides.
      RELEASE_MID_MUTATION:
        definition: The holder tried to release while mid-mutation; refused, so the lease never reads clean over a half change.
      BREAK_NOT_AUTHORISED:
        definition: >-
          A break by an actor outside the break authority. Azure lets any blob writer break a lease,
          so this refusal is the protocol's, backed by review and the recorded reason, not by RBAC.
      LEASE_STORE_UNREACHABLE:
        definition: The lease could not be read or written; fail closed, nothing is mutated. A lease that cannot be read is not free.
      LEASE_TARGET_NOT_VENDED:
        definition: >-
          The target's lease container does not exist: the landing zone vends it with the target, and a
          pipeline never creates it (its grant is the container). Fail closed, nothing is mutated.
      LEASE_ACQUIRED:
        definition: The caller now holds the target's lease at a new generation (a takeover of an expired clean holder is recorded).
      LEASE_FENCE_PASSED:
        definition: The token is still the blob's lease, generation and holder, inside its expiry; the expiry was extended (heartbeat).
      LEASE_MUTATION_MARKED:
        definition: Fenced, and the lease metadata now reads mutating with what is being changed.
      LEASE_RELEASED:
        definition: The holder released a clean lease; the next acquirer takes it at the next generation.
      LEASE_BROKEN:
        definition: The break authority broke the lease, recorded who and why, and bumped the generation so every former holder is fenced.
      LEASE_STATUS:
        definition: A read-only report of the current holder, generation, state and expiry; decides nothing.
      LEASE_LOST:
        definition: >-
          A renewal during a held step (the e2e test period, a rollback sequence) or a fence before a
          mutating az call failed. The held step is stopped at once, the loss is recorded beside the
          token, and every later fence of the run refuses without asking the store: nothing further is mutated.
      LEASE_NOT_HELD:
        definition: >-
          The lease is switched on for this environment but the run holds no token (it never acquired the
          target). A mutating call is refused before it is sent.
      MUTATED_UNDER_LEASE:
        definition: The mutation was fenced before and after; the lease was held throughout.
      MUTATED_WITHOUT_LEASE:
        definition: >-
          The lease was lost while the mutation was in flight (the after-fence failed). The change may
          have landed; the run ends ROLLBACK_REQUIRES_HUMAN_DECISION.
      MUTATION_FAILED:
        definition: >-
          The mutating call itself failed under the lease; the metadata stays "mutating" so nobody
          takes the target over automatically, and the run ends ROLLBACK_REQUIRES_HUMAN_DECISION.

  edge_purge:
    description: >-
      What a deploy did, after a verified release, about the edge cache of the app's own Front Door endpoint
      (KDEC-030 D-4, decided 2026-10-26; OF-5 K-7): the endpoint the landing zone vends in KIT_EDGE_ENDPOINT,
      and no other. Emitted by scripts/deploy_contract.py purge.
    consumers: [scripts/deploy_contract.py, reusable-deploy-appservice.yml, reusable-deploy-containerapp.yml,
                tests/prove_handoff_extended.py]
    rule: >-
      NOT APPLICABLE IS NEVER A PASS, AND A STALE CACHE IS NEVER A FAILED RELEASE. Only the vended endpoint is
      purged; a failed or refused purge leaves the release's outcome as the report step established it and
      routes the posture PROCEED_WITH_ADVISORY.
    values:
      EDGE_PURGED:
        definition: The app's own endpoint was purged (all of its paths), once, after the release was verified and stamped.
      EDGE_PURGE_NOT_APPLICABLE:
        definition: >-
          The environment vends no edge endpoint, or production did not change (App Service staged without a
          swap). Recorded; not a purge.
      EDGE_PURGE_REFUSED:
        definition: The vended value is not a Front Door afdEndpoints resource id; nothing was purged.
      EDGE_PURGE_FAILED:
        definition: >-
          The purge call did not complete; the endpoint may serve previous content until its cache expires.
          An advisory (PROCEED_WITH_ADVISORY), never a failed release.

  handoff_write_refusal:
    description: >-
      The landing zone's own refusals in its hand-off write (its BUILD-12), cited by the kit's hand-off
      contract so one spelling serves both. The kit emits none of them.
    consumers: ["(the landing zone) its hand-off write", docs/architecture/LZ_KIT_HANDOFF_CONTRACT.md]
    rule: One approver list (OF-5 P6); the landing zone reads the kit's and never keeps a second.
    values:
      HANDOFF_APPROVER_LIST_MISMATCH:
        definition: >-
          The landing zone's worksheet names approver groups that differ from the kit policy register's
          deploy_approval list; the hand-off write refuses before any call and tells the platform admins.

  # OF-5 K-10 (the LZ-vs-kit review's P13, 2026-10-28; KDEC-034 proposed). The landing zone's drift
  # vocabulary, carried by every finding of the kit's daily deployed scan (scripts/promotion.py LZ_DRIFT,
  # SARIF properties lz_drift_dimension / lz_drift_class, and the scan's drift_view), so one view serves
  # both. The values are the landing zone's (its event envelope's drift.dimension and drift.class, plus
  # `release` from its seam detector); lower-case, as the landing zone spells them.
  lz_drift_dimension:
    description: Which kind of divergence a drift finding is, in the landing zone's terms (its brief §3.7, §6.9).
    consumers: [scripts/promotion.py, tests/prove_deployed_scan_lz_vocabulary.py, "(the landing zone) drift.detected events"]
    rule: >-
      IaC state can be fully green while the security posture has diverged: a dimension is never collapsed
      into "iac". The kit's own rules stay the kit's; the dimension is a second label, never a replacement.
    values:
      iac: {definition: The declared infrastructure differs from what is deployed.}
      identity: {definition: An identity, its assignment or its federation differs from what was declared.}
      authentication: {definition: How callers authenticate to the resource changed.}
      authorisation: {definition: Who may do what on the resource changed.}
      network_exposure: {definition: "The resource's reachability changed (public access, plain-text traffic, isolation)."}
      security_control: {definition: "A security control's setting or result changed (TLS floor, remote debugging, a vulnerable or known-exploited component serving)."}
      monitoring: {definition: Diagnostics, logging or alerting of the resource changed.}
      release:
        definition: >-
          What serves, or the evidence of how it got there, differs from the kit's release record (the
          landing zone's seam detector; the kit's KIT-ARTIFACT-DRIFT, break-glass testing owed).
  lz_drift_class:
    description: How severe a drift finding is, in the landing zone's terms, and what it calls for.
    consumers: [scripts/promotion.py, tests/prove_deployed_scan_lz_vocabulary.py, "(the landing zone) drift.detected events"]
    rule: >-
      A RUN THAT COULD NOT FINISH IS not_attempted, NEVER "NO DRIFT". Phase 1 is visibility-first: detect,
      report, flag; nothing here rolls back a healthy production (KDEC-029 item 8; the landing zone's own rule).
    values:
      benign: {definition: Reported only (tags, a SKU change, debug settings).}
      operational: {definition: "Surfaced and flagged: an unsupported pattern, a bypassed pipeline, a weakened control."}
      critical:
        definition: >-
          Public exposure, plain-text traffic, a known-exploited or critical component serving, or a digest
          no kit run verified serving -- escalated at once.
      not_attempted: {definition: "The check could not be completed (unreadable, not re-scannable); never read as no drift."}

  release_record:
    description: >-
      Whether a deploy kept its release record durably in the target's lease store (the `releases/`
      folder of the target's container, KDEC-030), where the landing zone reads it: OF-5 K-4.
      Emitted by scripts/target_lease.py `record`, only when the run took the target lease.
    consumers: [scripts/target_lease.py, reusable-deploy-appservice.yml, reusable-deploy-containerapp.yml,
                reusable-deploy-staticwebapp.yml, tests/prove_release_record_store.py,
                "(the landing zone) its seam detector, destroy evidence and status.json citation"]
    rule: >-
      CREATE-ONLY, NEVER OVERWRITTEN, AND NEVER SILENTLY MISSING. A record that could not be kept fails
      the step; the GitHub artifact (30 days) is not the durable copy. Retention is the store's (the
      landing zone's immutability policy on the container), read and recorded, never assumed.
    values:
      RELEASE_RECORD_KEPT:
        definition: >-
          The record was written as releases/<environment>/<UTC time>-<run>-<attempt>.json in the
          target's container, with the fields the landing zone reads and the full promotion record; the
          container's retention policy (present | absent | unreadable) is in it.
      RELEASE_RECORD_NOT_KEPT:
        definition: >-
          No record was written: none to keep, a record of that name already exists (never overwritten),
          the container was never vended, or the store could not be reached. The step fails.

  seam_field_drift:
    description: >-
      CANDIDATE (KDEC-030 draft). What the landing zone's seam detector found when it compared a
      kit-owned field of a release target (image, revision, traffic, slot contents, the kit's stamps
      and tags, kit-assigned setting keys), read live, with the kit's release record for the target.
    consumers: ["(owed) the landing-zone seam detector beside its daily drift job"]
    rule: >-
      DETECTED, NEVER SILENTLY REVERTED. The landing zone reports drift on a field the kit owns to its
      owner; only a kit run may put it back. A field or record that could not be read is not "no drift".
    values:
      KIT_FIELD_MATCHES_RECORD:
        definition: The live field equals the kit's release record.
      KIT_FIELD_RELEASED:
        definition: The field differs from the cached record and a newer kit run of this target explains it.
      KIT_FIELD_UNAUTHORISED_CHANGE:
        definition: >-
          The field differs and no kit run of this target explains it. Reported to the application
          owner and the platform admins; never reverted by the landing zone.
      KIT_FIELD_NOT_ATTEMPTED:
        definition: The field or the record could not be read; the comparison did not happen.

  seam_ownership_refusal:
    description: >-
      A write refused because it would change configuration the writer does not own, decided before the
      write by the landing-zone plan or the kit's deploy (OF-5 K-6: the deploy reusables' `seam` step,
      scripts/deploy_contract.py decide_seam, opt-in with the KDEC-030 lease).
    consumers: [scripts/deploy_contract.py, reusable-deploy-appservice.yml, reusable-deploy-containerapp.yml,
                tests/prove_seam_setting_ownership.py, "(the landing zone) its plan"]
    rule: Every app-setting or environment key has exactly one owner; a write by the other side, or a key claimed by both, is refused.
    values:
      SEAM_SETTING_OWNERSHIP_CONFLICT:
        definition: >-
          A key the writer does not own, or a key both sides claim. Refused before anything is
          written, naming the key and its owner. On the kit side: a key a deploy would write outside
          release_ownership_stamp and KIT_SETTING_KEYS, or a KIT_SETTING_KEYS key the landing zone also
          claims (slot-sticky, or secret-backed).
      SEAM_SWAP_MOVES_LZ_SETTING:
        definition: >-
          An App Service slot swap would carry a non-sticky landing-zone-owned setting from one slot
          to the other. The kit refuses the swap; the landing zone makes the key sticky or equal.

  seam_ownership_check:
    description: >-
      What the deploy's `seam` step established, when it did not refuse (the refusals are
      seam_ownership_refusal): OF-5 K-6, before the first mutation.
    consumers: [scripts/deploy_contract.py, reusable-deploy-appservice.yml, reusable-deploy-containerapp.yml,
                tests/prove_seam_setting_ownership.py]
    rule: A setting nobody could read is not a setting nobody owns.
    values:
      SEAM_OWNERSHIP_HELD:
        definition: >-
          The settings were read; the deploy writes no key outside the kit's, no kit key is also claimed
          by the landing zone, and (App Service) the swap moves no non-sticky landing-zone setting.
      SEAM_OWNERSHIP_NOT_IN_FORCE:
        definition: The environment has not opted into the seam (no KIT_TARGET_LEASE_ACCOUNT); nothing is decided.
      SEAM_OWNERSHIP_NOT_ESTABLISHED:
        definition: >-
          The target's settings, the slot's or the connection strings could not be read, or KIT_SETTING_KEYS
          is not a list of names. A refusal: unknown ownership is not clear ownership.

  # ─────────────────────────────────────────────────────────────────────────
  evidence_confidence:
    description: How strongly a capability claim is supported.
    consumers: [capability-matrix, validation-debt, handoff readiness]
    values:
      observed_tool_attributed:
        definition: A SPECIFIC named scanner independently produced the evidence.
        note: The strongest form. Overlapping coverage cannot hide a dead detector behind a live one.
      observed_corroborated:
        definition: Detected, but by any of several scanners — tool-agnostic.
        warning: >-
          Do NOT "simplify" a tool-attributed assertion into this. The extra metadata is the point;
          it is what caught a dead flawfinder covered for by cppcheck.
      unknown:   {definition: A probe exists and has not passed.}
      untested:  {definition: No probe at all.}
      requires_integration_environment:
        definition: Provable, but needs resources not provisioned here.
      REQUIRES_INTEGRATION_ENV:
        definition: The identifier form used by tests/reconcile_validation.py for the state above.
        note: Registered so the two spellings cannot drift apart unnoticed.

  # ─────────────────────────────────────────────────────────────────────────
  publication_state:
    description: >-
      Repeatedly proven to be four separate claims. A scanner running, a report existing, a report
      being valid, and a report being published are not the same event.
    consumers: [security-gate, dashboards if they ever exist]
    values:
      ANALYSIS_COMPLETE:     {definition: The scanner executed and finished.}
      REPORT_PRODUCED:       {definition: An output file exists and is non-empty.}
      REPORT_STRUCTURALLY_VALID: {definition: The output parses as the format it claims to be.}
      PERSISTED:             {definition: Retained as an artifact independent of any publication channel.}
      PUBLICATION_DEGRADED:
        definition: A presentation channel was unavailable.
        rule: >-
          MUST NOT fail the scan. An unreachable dashboard cancelled an entire deep scan once.
          An empty Security tab is indistinguishable from a clean codebase — say which it is.
      NO_FINDINGS_COUNT:
        definition: >-
          The report job succeeded and published no blocking_findings count. The scanners' jobs
          ended; whether the code is clean was never established, because the evidence that would
          say so is absent.
        rule: >-
          NO COUNT IS NOT A COUNT OF ZERO. The gate records it as report(NO_FINDINGS_COUNT) among
          the unestablished capabilities, assurance_state is PARTIAL at best and PASS is
          unavailable -- a green report job is not a clean result (tests/prove_gate_reads_findings.py,
          scenario findings_unknown).

  # ─────────────────────────────────────────────────────────────────────────
  validation_debt_state:
    description: How an unproven capability is allowed to exist without permanent red.
    consumers: [reconcile_validation.py, self-test]
    rule: >-
      A permanently red check is not a control, it is training: people learn red means "known
      backlog", stop reading it, and a real regression arrives wearing the same colour.
    values:
      IMPLEMENTATION_HELD:
        definition: A component exists whose blocker is an UNBUILT CAPABILITY, not an unwritten probe.
        rule: >-
          A probe cannot close it: testing an orphan proves the orphan works in a fixture and says
          nothing about the pipeline. Carries an activation TRIGGER rather than only a date, because
          it returns to scope when the thing it waits on starts. The date remains as a backstop so
          it cannot be held indefinitely without anyone looking.
      BLOCKING:
        definition: Unregistered, undeferred, or an EXPIRED deferral. Fails the build.
      ACCEPTED_DEBT:
        definition: Dated, owned, unexpired deferral. Passes, reported loudly.
        required_fields: [reason, owner_role, proves, expires]
        rule: Expiry is the mechanism. Silence must NEVER renew a deferral.

  # ─────────────────────────────────────────────────────────────────────────
  policy_mode:
    description: How hard the gate enforces. Changes ENFORCEMENT, never VISIBILITY.
    consumers: [security-gate, profiles]
    values:
      adoption:
        definition: Non-secret findings report without blocking while a team learns its baseline.
        invariant: SECRETS STILL BLOCK. advisory_mode does not and must never cover them.
        warning: A baseline tool, not a resting state. Left on it is indistinguishable from no gate.
      strict:
        definition: High/critical findings block. Lint blocks only if policy says it matters.
    forbidden: >-
      There is no mode in which a secret finding passes without an exact approved disposition.

  # ─────────────────────────────────────────────────────────────────────────
  # A WEAKENING IS A GOVERNED EXCEPTION, NOT A BOOLEAN PREFERENCE.
  #
  # `soft_fail_sast` appeared in no summary, no report, no annotation and nowhere in this file.
  # A caller could soften the gate and the run was reported identically to one that passed
  # honestly -- the exact collapse this kit refuses everywhere else, sitting in its own front
  # door. `policy_mode` above says a mode "changes ENFORCEMENT, never VISIBILITY"; that sentence
  # was true of the vocabulary and false of the implementation, because nothing emitted it.
  #
  # WHICH NAMESPACES WERE CHECKED FIRST, and why none of them owned this:
  #   disposition_type        an authorized decision about ONE FINDING, matched by fingerprint.
  #                           A weakening is decided before any finding exists and applies to a
  #                           CONTROL. Reusing it would let a config flag wear a finding's
  #                           governance record without a finding's evidence.
  #   suppression_reason      why an error-suppressing IDIOM exists in source. Per code site,
  #                           consumed by the suppression linter. A caller input is not a site.
  #   policy_mode             adoption | strict -- the two shapes the GATE can take. It has no
  #                           room for per-input attribution, expiry or an exception reference,
  #                           and adding those to it would make one term carry two models.
  #   validation_debt_state   an unproven CAPABILITY of the kit. A weakening is a proven
  #                           capability deliberately not applied.
  #   scan_depth              DOES own DEPTH_REDUCED, which is reused below rather than
  #                           respelled. Registering a synonym for it would be the drift this
  #                           file exists to catch.
  #   capability_maturity /
  #   evidence_confidence /
  #   publication_state       all about what the KIT can prove or has published. None of them
  #                           can express "the consumer asked for less".
  control_weakening:
    description: >-
      What a caller's configuration did to a control, recorded per input, before any result
      exists. Three axes kept separate on purpose: the CLASS of surface the input governs, the
      STATE that surface is currently in, and whether the weakening is ATTRIBUTED to a named
      decision.
    consumers:
      [reusable-nvd-cve, reusable-build-docker, workflow-policy-check, tests/check_weakening_record.py,
       security-gate, anyone reading a step summary before approving a promotion]
    rule: >-
      A WEAKENING THAT IS NOT IN THE RECORD DID NOT HAPPEN, AS FAR AS THE EVIDENCE IS CONCERNED --
      and that is indistinguishable from a clean run, which is the defect. Every declared input of
      a workflow carries exactly one class, the classification must be TOTAL, and an input whose
      class says it can soften or disable a control must reach the record through `env:`.
      Totality is the control: a check that enumerates weakenings from a hand-written list is a
      list that goes stale, and a stale list reports clean on a narrower denominator.
    attribution_rule: >-
      WHO DECIDED AND ON WHAT BASIS IS PART OF THE RECORD, NOT METADATA ABOUT IT. An unattributed
      weakening is not an approved one; it is a decision nobody has made yet, and it routes to
      DECISION_REQUIRED rather than quietly to PROCEED. Expiry is the mechanism -- silence must
      never renew a weakening, the same rule disposition_type and validation_debt_state already
      hold for their own exceptions.
    cannot_establish: >-
      A workflow receives RESOLVED input values. It cannot see whether a caller passed a value
      explicitly or inherited the declared default, so `WEAKENING_IN_FORCE` says the control is
      weakened and says NOTHING about who chose it. Where the kit's own default is the weak side,
      that is the KIT's weakening and the record must not imply a caller asked for it.
    values:
      # ── CLASS: what kind of surface the input governs ────────────────────────────────
      GATE_SOFTENED:
        definition: The control still runs and still reports; only the block is withheld.
        rule: >-
          NOT the same as CONTROL_DISABLED and must never be merged with it. Evidence still
          exists here; what is missing is enforcement. Merging them would make a recorded finding
          look like an absent one.
      CONTROL_DISABLED:
        definition: The control does not run. The kit ships it ON, so the off position is a weakening.
        rule: >-
          Produces a row in controls_skipped, NEVER a clean row. Nothing looked, so nothing was
          established -- absence_is_not_a_negative_observation applies unchanged.
      TARGET_NOT_SUPPLIED:
        definition: >-
          The control needs a caller-supplied target (an SBOM path, an image reference) and none
          was given, so it had nothing to examine.
        rule: >-
          Reported in controls_skipped and deliberately NOT counted as a weakening: the kit ships
          this off because it cannot invent a target. Distinct from CONTROL_DISABLED, where a
          control that could have run was switched off.
      SCOPE_NARROWED:
        definition: What the control is pointed at was changed -- paths, selectors, ecosystems.
        rule: >-
          Narrowing scope must never silently reduce VISIBILITY of what was not examined, the
          same rule discovery_state.EXCLUDED_BY_SELECTOR already carries for language selectors.
      SEVERITY_RAISED:
        definition: The threshold at which a finding counts was moved, so fewer findings act.
        rule: >-
          A finding below a raised threshold was OBSERVED and not ACTED ON. It must not be
          reported as absent.
      CONTROL_SURFACE_DEAD:
        definition: >-
          A declared input nothing reads. Setting it has no effect and the run must say so.
        rule: >-
          Worse than an absent input: an absent one fails loudly at the call site, while a dead
          one reads as configuration and silently means nothing. `enable_iac` shipped in exactly
          this state and a caller who set it got no IaC scanning at all.
      EXCEPTION_ATTRIBUTION:
        definition: >-
          The input carries the governance fields themselves -- reason, authority, exception
          reference, expiry. It governs no control.
        rule: >-
          Classified separately from NOT_A_CONTROL_SURFACE so that emptying the record cannot be
          disguised as configuring nothing.
      NOT_A_CONTROL_SURFACE:
        definition: >-
          The input changes no control's strength, scope, depth or enforcement -- a language
          version, a display name, an artifact retention period.
        rule: >-
          THE ESCAPE HATCH, AND THEREFORE THE THING TO GUARD. A totality check is defeated the
          moment everything can be labelled this, so tests/check_weakening_record.py refuses this
          class for any input whose own description says it softens, skips, disables or reports
          without failing. The input's documentation is evidence against its classification.
      # ── STATE: where that surface currently sits ─────────────────────────────────────
      WEAKENING_AT_BASELINE:
        definition: The value equals this workflow's declared full-strength setting for that input.
        rule: >-
          Baseline means "as strong as this kit ships it", NOT "as strong as it could be". Where
          the shipped default is itself the weak side, the baseline is declared at the strong
          value and the default run therefore records WEAKENING_IN_FORCE. That is the honest
          reading and it is the whole reason this namespace exists.
      WEAKENING_IN_FORCE:
        definition: >-
          The value is weaker than baseline and the DIRECTION IS ESTABLISHED -- a two-position
          surface whose strong side is known.
      CONTROL_RECONFIGURED:
        definition: >-
          The value differs from baseline on a surface where this record CANNOT establish the
          direction: a severity list, a path, a query suite. Different is not provably weaker.
        rule: >-
          Recorded as owing a decision rather than asserted as a weakening. Claiming a narrowing
          we cannot demonstrate would be the same overstatement, pointed the other way -- and
          calling it equivalent to baseline would be the silence this namespace exists to end.
      # ── ATTRIBUTION: whether a person stands behind it ───────────────────────────────
      WEAKENING_ATTRIBUTED:
        definition: A reason AND a named authority are recorded, and any stated expiry is in the future.
        rule: An exception reference is reported when present and its absence is reported too.
      WEAKENING_UNATTRIBUTED:
        definition: A weakening is in force and no reason, or no authority, was recorded.
        rule: >-
          NOT an approved exception. It is a decision nobody has made, and it routes to
          DECISION_REQUIRED. A proposal never buys passage -- the same rule disposition_type
          states for findings, applied to controls.
      WEAKENING_EXCEPTION_EXPIRED:
        definition: A reason and authority exist and the stated expiry has passed.
        rule: >-
          Reverts to owing a decision. Silence NEVER renews a weakening; that is the mechanism,
          exactly as it is for an expired disposition and an expired validation deferral.

  # ─────────────────────────────────────────────────────────────────────────
  routing_result:
    description: >-
      WHAT SHOULD HAPPEN NEXT -- five outcomes, because pass/fail is the collapse this kit
      refuses everywhere else and then performed at its own boundary. Separate from
      assurance_state (what the run ESTABLISHED) and enforcement_state (what the gate DID):
      routing is the third question, addressed to whoever or whatever consumes the run.
    consumers: [calling workflows, promotion gates, release routing, reviewers]
    rule: >-
      EVIDENCE_UNTRUSTED IS THE ONE THAT MATTERS AND THE ONE MOST OFTEN LOST. A scanner that could
      not be acquired is not a decision someone owes and is emphatically not clean. A container tag
      that never existed made every `docker run` fail, `|| true` swallowed it, and "could not be
      acquired" was reported as "found nothing" for two weeks with a seeded fixture sitting
      unscanned. This value exists so that shape has somewhere to land.
    precedence: >-
      BLOCKED > EVIDENCE_UNTRUSTED > DECISION_REQUIRED > PROCEED_WITH_ADVISORY > PROCEED --
      and BLOCKED requires an OBSERVED refusal, never an inferred one. A refusal is an observation
      that fired, which is why it outranks the absence of one; but a job that merely failed while a
      control was unavailable has not demonstrated that anything refused it, so an emitter that
      cannot separate "a control said no" from "a tool could not be acquired" must fall to
      EVIDENCE_UNTRUSTED rather than claim the stronger reading. Both stop the run, so the ordering
      is low-stakes in practice -- and every unavailable control is still named in
      controls_unavailable regardless of which value won, so precedence never erases a fact.
    values:
      PROCEED:
        definition: Clean, and no weakening was in force.
        rule: >-
          Unavailable only when every required control executed at baseline strength. A run with a
          weakening in force is never PROCEED, however green its scanners were.
      PROCEED_WITH_ADVISORY:
        definition: >-
          Findings were recorded and not blocked, or a weakening is in force -- AND the record says
          so, with a reason and a named authority.
        rule: >-
          The record is what separates this from PROCEED. Without the record it is PROCEED wearing
          a different name, which is the defect.
      DECISION_REQUIRED:
        definition: >-
          A human or governance decision is owed: a weakening in force with no reason or no
          authority, or an exception whose expiry has passed.
        rule: >-
          NOT a failure and NOT a pass. It is the state a kit should be in when someone has
          weakened a control and nobody has said why.
      BLOCKED:
        definition: A control refused it.
        reuses: api_boundary.BLOCKED
        rule: >-
          The same spelling and the same claim as the enforcement_state value, deliberately
          reused rather than respelled. A second word for one concept is the drift this registry
          exists to catch.
      EVIDENCE_UNTRUSTED:
        definition: >-
          The result cannot be relied on. A control was UNAVAILABLE or COLLECTION_FAILED, discovery
          could not establish applicability, or the evidence was never assembled.
        rule: >-
          NEVER DECISION_REQUIRED and never clean. There is nothing here to decide about yet --
          the input to a decision is missing. Re-acquire the tool and run again; a consumer must
          not convert this into any successful state without new collection
          (authority_never_grows_from_loss).

  # ─────────────────────────────────────────────────────────────────────────
  advisory_cause:
    description: >-
      WHY a run routed PROCEED_WITH_ADVISORY. The security gate emits them as `advisory_causes`
      (comma-separated; empty for every other route) and a caller passes them to the deploy
      reusables beside routing_result. KDEC-014.
    consumers: [security-gate, reusable-deploy-appservice, reusable-deploy-containerapp,
                tests/prove_version_gap_production.py]
    rule: >-
      ONE VERDICT, SEVERAL CAUSES, AND THE CONSEQUENCE DIFFERS BY CAUSE. At uat and prod a
      VERSION_GAP -- wholly or partly -- is refused unless a named person accepts it; the other
      causes are not. A PROCEED_WITH_ADVISORY with no cause, or an unregistered one, cannot be
      shown not to be a version gap, so a production-tier deploy refuses it
      (version_gap_ruling.ADVISORY_CAUSE_UNKNOWN).
    values:
      VERSION_GAP:
        definition: >-
          A claim is unestablished because no carried scanner can read the target version: the
          job pointed at it was capped at PARTIAL by the capability selection (KDEC-010), and
          every claimed candidate's range is `verified: READ`, so the gap is ESTABLISHED (resolve
          `proven_gap_jobs`).
        reuses: version_applicability.VERSION_GAP
        rule: Enforced at uat/prod -- refused without an attributed exception.
      VERSION_GAP_UNVERIFIED:
        definition: >-
          The same cap, where at least one claimed candidate's range is UNVERIFIED: nothing
          measured whether that scanner could read the target, so the gap is unverified by
          construction.
        rule: >-
          Recorded prominently at uat/prod and NOT enforced, until a seeded corpus makes the range
          READ -- which turns it into VERSION_GAP with no other change (KDEC-014 rollout).
      COVERAGE_PARTIAL:
        definition: >-
          A claim is unestablished at PARTIAL for a reason the gate did not record as a version
          gap. Reached by a job that publishes its own PARTIAL state: sast-semgrep's scan_state
          PARTIAL (scan_partial_reason.PARSE_PARTIAL_PHP_SYNTAX -- PHP files Semgrep could not
          fully parse, named; everything else scanned and its findings kept; KDEC-016 amended
          2026-10-22), and sast-cpp's scan_state PARTIAL (scan_partial_reason.CPP_ANALYSIS_PARTIAL --
          C/C++ source with no compilation database, analysed source-only; KDEC-026).
        rule: >-
          Not a version gap, so not refused at uat/prod by KDEC-014: the deploy records it
          (version_gap_ruling.VERSION_GAP_NOT_ENGAGED). It is advisory in every enforcement mode.
      WEAKENING_ATTRIBUTED:
        definition: A weakening is in force, with a reason and a named authority, unexpired.
        reuses: control_weakening.WEAKENING_ATTRIBUTED
      FINDINGS_NOT_BLOCKED:
        definition: >-
          Findings were established and the gate did not block them (enforcement ADVISORY, or a
          job that succeeded with findings on record).
      SECRET_EXCEPTION_ATTRIBUTED:
        definition: >-
          The secret scan found secrets and EVERY one is excepted by a policy-register entry's
          secret_exceptions item in force: one finding by its fingerprint, a work-item ticket, an
          explanation, a named approver, an unexpired date, and environment reviewers at uat/prod
          (owner ruling 2026-10-22; lane L-S). The gate's secret_gate is EXCEPTED, and the run
          record lists each exception.
        rule: >-
          Never a clean secret scan. Not a version gap, so not refused at uat/prod by KDEC-014; the
          deploy records it. Any secret not covered, or any exception refused, and the run is
          BLOCKED.
      KNOWN_EXPLOITED_EXCEPTION_ATTRIBUTED:
        definition: >-
          Every dependency/image CVE found on the CISA KEV catalog is excepted by a register
          known_exploited_exceptions item in force -- one finding by fingerprint and CVE, ticketed,
          explained, approved, unexpired, reviewers at uat/prod, history checked against git
          (KDEC-022 item 3). The gate's kev_verdict is EXCEPTED.
        rule: >-
          Never a clean result. Not a version gap, so the deploy records it. Any catalogued CVE not
          excepted and the run is BLOCKED (known_exploited.FINDING_KNOWN_EXPLOITED).
      KEV_UNAVAILABLE:
        definition: >-
          The CISA KEV catalog could not be read on this run (unreachable, malformed, or the check
          did not report): KEV_STATE UNAVAILABLE (KDEC-022 item 3).
        rule: >-
          VISIBLE AND NEVER A PASS: a run that is otherwise PROCEED routes PROCEED_WITH_ADVISORY
          with this cause. It does not block -- nothing was observed -- and the deploy records it.

  # ─────────────────────────────────────────────────────────────────────────
  secret_exception_refusal:
    description: >-
      Why the policy register refused ONE secret exception (owner ruling 2026-10-22: exceptions
      "must be requested and logged with tickets that have explanations"). A refused exception was
      never in force: the secret it named still blocks. The rest of the register resolves.
    consumers: [scripts/policy_registration.py, security-gate, tests/prove_gate_policy_enforcement.py]
    rule: >-
      A class-wide or scanner-wide softening of secrets is not an exception at all: it stays
      CHERRY_PICK_BELOW_FLOOR (policy_resolution), refusing the register.
    values:
      SECRET_EXCEPTION_NOT_FINDING_SCOPED:
        definition: The item names no single finding fingerprint (12 lowercase hex, the report's fp).
      SECRET_EXCEPTION_UNTICKETED:
        definition: >-
          No ticket, or one that is not a <PROJECT>-<digits> work-item key within the register's
          numbers.ticket_min_digits..ticket_max_digits (scripts/ticket_reference.py, KDEC-013).
      SECRET_EXCEPTION_UNATTRIBUTED:
        definition: >-
          No explanation, approver or readable expiry; or it applies at uat/prod and names no
          environment reviewers.
      SECRET_EXCEPTION_EXPIRED:
        definition: Its expiry, or its entry's decision, has passed. Silence never renews it.
      EXCEPTION_RENEWAL_LIMIT:
        definition: The exception was renewed more often than the authority's cap.
        reuses: exception_lifecycle.EXCEPTION_RENEWAL_LIMIT
      EXCEPTION_HISTORY_TAMPERED:
        definition: Its declared renewal history is shorter than git shows (KDEC-022 item 2).
        reuses: exception_lifecycle.EXCEPTION_HISTORY_TAMPERED
      EXCEPTION_HISTORY_UNVERIFIED:
        definition: Git cannot show its register's history, so its renewals cannot be verified.
        reuses: exception_lifecycle.EXCEPTION_HISTORY_UNVERIFIED

  # ─────────────────────────────────────────────────────────────────────────
  known_exploited:
    description: >-
      KDEC-022 item 3 (owner, 2026-10-23: "confirmed malicious packages should block if we know there
      is an exploit in the wild right?"). What the known-exploited check (scripts/known_exploited.py,
      .github/actions/known-exploited) established about the CISA Known Exploited Vulnerabilities
      catalog and the CVEs this run found in dependencies and images. kev_state is whether the
      catalog was read; kev_verdict is what it says about the findings. The gate enforces it.
    consumers: [scripts/known_exploited.py, security-gate, reusable-nvd-cve, tests/prove_known_exploited.py]
    rule: >-
      A KNOWN-MALICIOUS PACKAGE (OSV MAL-) STILL BLOCKS ON ITS OWN, in the secret class. A CVE on the
      catalog joins that every-mode class: BLOCKED at every rung, crawl and advisory_mode included.
      The catalog is read once per run (a date-keyed cache) and pinned in the evidence by
      catalogVersion, dateReleased and sha256. Unreadable is never CLEAR.
    values:
      AVAILABLE:
        definition: The catalog was read (fetched today, or today's cached copy) and parsed.
      UNAVAILABLE:
        definition: >-
          The catalog could not be fetched or parsed, the check did not report, or a SARIF it was
          handed could not be read. As kev_state and as kev_verdict.
        rule: Never CLEAR and never a pass -- the run routes at least PROCEED_WITH_ADVISORY (KEV_UNAVAILABLE).
      CLEAR:
        definition: The catalog was read and no CVE this run found is on it.
      EXCEPTED:
        definition: >-
          Every catalogued CVE found is excepted by a register known_exploited_exceptions item in
          force (advisory_cause.KNOWN_EXPLOITED_EXCEPTION_ATTRIBUTED).
        rule: Never CLEAR. Each exception is listed with its ticket, approver, expiry and history.
      FINDING_KNOWN_EXPLOITED:
        definition: >-
          A dependency or image finding whose CVE is on the CISA KEV catalog and that no exception in
          force covers. kev_verdict BLOCKED.
        rule: >-
          BLOCKED at every rung, crawl included, and under advisory_mode: the gate's every-mode class
          (secret_gate FAIL, cause known-exploited). On the NVD path, which resolves no policy, no
          exception is honoured and the run routes BLOCKED.

  # ─────────────────────────────────────────────────────────────────────────
  # KDEC-032 PROPOSED (Release 4, lane L-MIRROR, 2026-10-27; docs/adoption/FEED_MIRRORS.md). Owner,
  # 2026-10-27: "release 4 could have the mirrors yes? I could have it in the security platform azure
  # subscription".
  feed_mirror:
    description: >-
      What a scan established about the organisation-hosted mirror of one external feed (nvd, kev,
      trivy, trivy-checks, osv) before using it: scripts/feed_mirror.py consume, through .github/actions/feed-mirror and
      the known-exploited composite. The mirror is a static website behind a private endpoint, written
      by reusable-feed-mirror-refresh.yml with a manifest per feed (source, upstream version and
      timestamp, sha256 and size per file, refreshed_at).
    consumers: [scripts/feed_mirror.py, .github/actions/feed-mirror, .github/actions/known-exploited,
                scripts/known_exploited.py, reusable-nvd-cve, reusable-security, reusable-build-docker,
                reusable-deploy-appservice, reusable-deploy-containerapp, reusable-deployed-scan,
                tests/prove_feed_mirror.py]
    rule: >-
      A MIRROR THAT CANNOT BE VOUCHED FOR IS REFUSED BY NAME, NEVER READ AS CLEAN, AND NEVER QUIETLY
      REPLACED BY THE PUBLIC FEED. The refusal becomes the consumer's existing unavailable state: KEV
      -> kev_state UNAVAILABLE (advisory_cause.KEV_UNAVAILABLE); NVD -> the database update failed
      (nvd-dependency-check in controls_unavailable, EVIDENCE_UNTRUSTED); Trivy -> an emptied cache with
      the update off, so every Trivy call refuses and its scanner is unavailable; the checks bundle ->
      `trivy config` made fatal (a missing custom-check path), never Trivy's silent embedded fallback;
      OSV -> offline against an empty database, so osv-scanner fails and malicious-deps is
      COLLECTION_FAILED. The 48-hour policy is a ceiling a caller may only tighten.
    values:
      NOT_CONFIGURED:
        definition: >-
          No mirror is named (vars.KIT_FEED_MIRROR_URL empty): the public feed is read exactly as before
          Release 4. Not a weakening and not a refusal.
      MIRROR_CURRENT:
        definition: >-
          The feed's manifest was read, is for this feed, was refreshed within the policy, and every file
          the consumer read matched its sha256 and size (nvd: cache.properties and every .meta; the
          refresh verified each year's bytes against its .meta and read the whole upload back).
      MIRROR_STALE:
        definition: The manifest's refreshed_at is older than the policy (48 h, or a tighter caller value).
        rule: Refused. The refresh stopped; data that stopped updating cannot establish "no known vulnerabilities".
      MIRROR_UNREACHABLE:
        definition: >-
          The manifest or a file could not be fetched (no private network path, DNS, the endpoint down),
          or the check did not complete. Typically a job on a runner that cannot reach the private
          endpoint (vars.KIT_FEED_MIRROR_RUNNER).
        rule: Refused. A mirror that cannot be read is not a mirror that is clean.
      MIRROR_INTEGRITY_FAILED:
        definition: >-
          The manifest is unreadable, for another feed, malformed, refreshed in the future; a file's bytes
          do not match its sha256; or an archive member escapes its directory.
        rule: Refused. Never retried against the public feed unless fallback upstream is configured.
      MIRROR_FALLBACK_UPSTREAM:
        definition: >-
          The mirror was refused (its cause is recorded as mirror_cause) and the caller EXPLICITLY set
          vars.KIT_FEED_MIRROR_FALLBACK to upstream, so the public feed was read. Recorded in the outputs,
          the step summary and the evidence file.
        rule: >-
          Allowed only when configured; it is an exception to the private-only rule (R8) and is reviewed
          as one. Never taken on a current mirror, never on an unknown fallback value.

  feed_mirror_refresh:
    description: >-
      What one run of reusable-feed-mirror-refresh.yml did for one feed: fetched the upstream (the
      Dependency-Check project's datafeed, the CISA KEV catalog, Trivy's own database download),
      verified it, published a new generation and manifest, and read the publication back through the
      consumer path.
    consumers: [scripts/feed_mirror.py, reusable-feed-mirror-refresh, tests/prove_feed_mirror.py]
    rule: >-
      NOTHING UNVERIFIED IS PUBLISHED, AND A PUBLICATION IS NOT DONE UNTIL IT READS BACK. Files go up
      first, the manifest last (the switch is one blob write), and the run then consumes its own
      publication with --verify-all. A refusal leaves the previous generation in place, which then ages
      into MIRROR_STALE at the consumers -- the failure is visible downstream, never hidden.
    values:
      MIRROR_PUBLISHED:
        definition: The generation and its manifest were uploaded and read back MIRROR_CURRENT, every file matching.
      MIRROR_UPSTREAM_STALE:
        definition: >-
          The upstream's own timestamp is older than its limit (NVD datafeed and Trivy DB 48 h; Trivy Java
          DB 14 days): publishing it would reset refreshed_at over old data.
      MIRROR_UPSTREAM_UNREACHABLE:
        definition: The upstream (or a file it names) could not be fetched.
      MIRROR_UPSTREAM_INTEGRITY_FAILED:
        definition: >-
          The upstream's bytes do not match its own checksums (an NVD year against its .meta sha256 and
          sizes), or the KEV catalog does not parse as a catalog the check would accept.
      MIRROR_PUBLISH_UNVERIFIED:
        definition: >-
          The upload completed but reading it back through the consumer path did not return MIRROR_CURRENT
          (or an image copied to the registry does not resolve at its source digest). The run fails.

  # ─────────────────────────────────────────────────────────────────────────
  known_exploited_exception_refusal:
    description: >-
      Why the policy register refused ONE known_exploited_exceptions item (KDEC-022 item 3: "a
      ticketed, finding-scoped exception is allowed, with the same rules as secret exceptions"). A
      refused exception was never in force: the known-exploited finding still blocks.
    consumers: [scripts/policy_registration.py, security-gate, tests/prove_known_exploited.py]
    rule: The same rules, in the same order, as secret_exception_refusal.
    values:
      KEV_EXCEPTION_NOT_FINDING_SCOPED:
        definition: >-
          The item names no single finding fingerprint (12 lowercase hex), or no CVE: a CVE
          everywhere, a package, a scanner or a wildcard is never excepted.
      KEV_EXCEPTION_UNTICKETED:
        definition: No ticket, or one that is not a <PROJECT>-<digits> key within the register's digit range.
      KEV_EXCEPTION_UNATTRIBUTED:
        definition: >-
          No explanation, approver or readable expiry; or it applies at uat/prod and names no
          environment reviewers; or its declared history cannot be read.
      KEV_EXCEPTION_EXPIRED:
        definition: Its expiry, or its entry's decision, has passed.
      EXCEPTION_RENEWAL_LIMIT:
        definition: The exception was renewed more often than the authority's cap.
        reuses: exception_lifecycle.EXCEPTION_RENEWAL_LIMIT
      EXCEPTION_HISTORY_TAMPERED:
        definition: Its declared renewal history is shorter than git shows.
        reuses: exception_lifecycle.EXCEPTION_HISTORY_TAMPERED
      EXCEPTION_HISTORY_UNVERIFIED:
        definition: Git cannot show its register's history.
        reuses: exception_lifecycle.EXCEPTION_HISTORY_UNVERIFIED

  # ─────────────────────────────────────────────────────────────────────────
  exception_lifecycle:
    description: >-
      KDEC-018 item 4 (owner, 2026-10-22): "We still need to make sure we are dealing with
      exceptions … and have a timing mechanism to resurface the tickets when those come due. And
      when they resurface it needs to be clear they were exempted previously and shown. Because
      endless exemptions/exceptions are not a thing." Every dated exception the kit honours -- a
      register secret_exceptions item, a register decision (the authority's softening), the deploy's
      version-gap exception (KDEC-014's weakening record) -- may carry `renews`, its PRIOR grants
      {ticket, approver, from, expires}; the count is capped. scripts/exception_history.py.
    consumers: [scripts/exception_history.py, scripts/policy_registration.py, security-gate,
                reusable-deploy-appservice, reusable-deploy-containerapp, scripts/run_record.py,
                tests/prove_exception_lifecycle.py]
    rule: >-
      A history the kit cannot read is not "no history": the exception is refused as unattributed.
      The cap is numbers.max_exception_renewals in the CENTRAL register (kit default 2), an integer
      from 0 to 5 -- never unlimited. The deploy holds the stronger of the cap it is passed and the
      kit default.
    values:
      EXCEPTION_RENEWAL_LIMIT:
        definition: >-
          An exception's history holds more prior grants than the cap: it was renewed more often
          than the authority allows.
        rule: >-
          Refused by name and never in force; the finding reverts to its normal routing -- a secret
          BLOCKS, a register softening reverts (the run routes DECISION_REQUIRED), a version-gap
          deploy at uat/prod is VERSION_GAP_REFUSED. Fix the cause, or the authority raises the cap
          (at most 5).
      EXCEPTION_HISTORY_TAMPERED:
        definition: >-
          KDEC-022 item 2 (owner 2026-10-23, option D, "B plus C"): the git history of the protected
          register file shows more prior grants of a register exception (a secret or known-exploited
          exception by its finding, a softening decision by its entry) than its declared `renews`
          lists -- the history was erased. Derived by scripts/exception_history.py from `git log
          --follow` of the file on the default branch.
        rule: >-
          BLOCKED (policy_resolution), and the exception is refused: the finding reverts to its
          normal routing and a softening does not apply. The renewal cap binds the DERIVED count.
      EXCEPTION_HISTORY_UNVERIFIED:
        definition: >-
          Git cannot show the register file's history -- a shallow clone, a file in no git history,
          a central register whose delivered copy is not the newest committed version, a blob the
          fetch cannot supply -- so a register exception's renewal count cannot be verified.
        rule: >-
          Refused exactly as an unreadable history is -- never read as zero renewals: a secret or
          known-exploited finding still blocks, and a softening decision reverts (the run routes
          DECISION_REQUIRED, the rest of the policy stands). The workflow fetches the default branch
          blob-less with its history so this is not the everyday case.

  # ─────────────────────────────────────────────────────────────────────────
  exception_resurfacing:
    description: >-
      What the scheduled exception check found and did (KDEC-018 item 4; scripts/exception_due.py,
      .github/workflows/reusable-exception-due.yml, templates/exception-due.yml). It reads the central
      register, the repository's register and the caller's workflows, lists every exception coming
      due or expired with its full history, and raises each on its Jira ticket (Jira only, KDEC-017
      item 5).
    consumers: [scripts/exception_due.py, reusable-exception-due, tests/prove_exception_due.py]
    rule: >-
      A register or workflow that could not be read is REGISTRATION_UNAVAILABLE (policy_resolution),
      never NOTHING_DUE. No Jira credential is NOT_CONFIGURED -- the list still stands -- never a
      silent pass.
    values:
      EXCEPTION_DUE_SOON:
        definition: An exception expires within the window (default 14 days).
      EXCEPTION_OVERDUE:
        definition: An exception has expired, or its expiry cannot be read.
        rule: An expiry nobody can read has not "not arrived".
      EXCEPTIONS_DUE:
        definition: The listing found at least one exception due or overdue.
      NOTHING_DUE:
        definition: Every source was read and no exception is due or overdue within the window.
      NOT_REQUESTED:
        definition: Only the listing was asked for; nothing was to be resurfaced.
      NOTHING_TO_RESURFACE:
        definition: Resurfacing was asked for and nothing is due.
      NOT_ATTEMPTED:
        definition: Resurfacing was asked for and not attempted, because a source could not be read.
      PLANNED:
        definition: Plan only (apply off) -- the actions are named and nothing was written.
      NOT_CONFIGURED:
        definition: No Jira credential is configured; the due list is emitted and nothing is written.
        rule: Never read as "nothing due" -- the list beside it says what is.
      RESURFACED:
        definition: Every due exception was raised on its Jira ticket (reopened if closed, commented, or created once).
      RESURFACE_FAILED:
        definition: >-
          A tracker other than Jira was configured, the Jira configuration was refused, or a write
          failed. Named per exception; the job fails.
      CHECKED:
        definition: >-
          The Jira cross-check (--cross-check, KDEC-022 item 2 C) read the ticket of every ticketed
          exception; each disagreement is listed as EXCEPTION_TICKET_MISMATCH.
      EXCEPTION_TICKET_MISMATCH:
        definition: >-
          An exception's Jira ticket does not exist, does not name the approver the register records,
          or does not show (by a link, a mention or a comment) a renewal the register lists.
        rule: >-
          REPORTED, NEVER GATING: in the JSON, the run summary and -- with --apply -- a comment on the
          ticket. The gate never depends on Jira being reachable; the register and its git history
          decide the run.

  # ─────────────────────────────────────────────────────────────────────────
  version_gap_ruling:
    description: >-
      What a deploy's verdict step decided about a version-gap advisory (KDEC-014, owner
      2026-10-16: "Version-gap-only PROCEED_WITH_ADVISORY is DEV/TEST ONLY. UAT and prod refuse
      it until the scanner gap is closed or a named person accepts it as an attributed
      exception."). Emitted before login as the verdict step output `version_gap_ruling`, shown
      in the posture record and recorded in deploy-evidence/outcome.json. Written exactly once on
      every path that reaches the verdict step, VERSION_GAP_NOT_ENGAGED included; EMPTY is never a
      value: it is an absent answer (see VERSION_GAP_NOT_ENGAGED.rule).
    consumers: [reusable-deploy-appservice, reusable-deploy-containerapp,
                tests/prove_version_gap_production.py]
    rule: >-
      The exception is the deploy's existing weakening record: a named accepter
      (weakening_authority) AND a reason (weakening_reason) AND a YYYY-MM-DD weakening_expires
      that has not passed -- plus the GitHub environment's required reviewers, a platform
      setting the kit records but cannot read. Any field missing, an unreadable date, or a past
      date is no exception. Silence never renews it -- the same rule as
      WEAKENING_EXCEPTION_EXPIRED.
    values:
      VERSION_GAP_RECORDED:
        definition: Below uat (sandbox, dev, test); the deploy proceeds and the gap is recorded.
      VERSION_GAP_UNVERIFIED_RECORDED:
        definition: >-
          At uat or prod, the only gap is a VERSION_GAP_UNVERIFIED: the deploy proceeds with the
          gap recorded prominently (warning, summary, posture record, outcome.json), never
          silently, until a seeded corpus proves the range.
      VERSION_GAP_EXCEPTION_ACCEPTED:
        definition: >-
          At uat or prod; a valid attributed exception was supplied, so the deploy proceeds and
          the accepter, reason and expiry are recorded.
      VERSION_GAP_REFUSED:
        definition: At uat or prod with no valid exception; refused before login.
        rule: Routes DECISION_REQUIRED -- a named person's decision is owed, not new evidence.
      ADVISORY_CAUSE_UNKNOWN:
        definition: >-
          At uat or prod the advisory's cause is absent or unregistered; refused before login.
        rule: Routes EVIDENCE_UNTRUSTED -- pass the gate's advisory_causes and run again.
      VERSION_GAP_NOT_ENGAGED:
        definition: >-
          The verdict step ran and no version-gap rule applied: the verdict was PROCEED or a
          refusal on another verdict (BLOCKED, DECISION_REQUIRED, EVIDENCE_UNTRUSTED, none, or an
          unregistered value), or it was PROCEED_WITH_ADVISORY with no VERSION_GAP or
          VERSION_GAP_UNVERIFIED cause to rule on at that tier.
        rule: >-
          Written explicitly, so the verdict step answers exactly once on every path that reaches
          it; routes nothing by itself. An EMPTY ruling is NOT this value -- it means the verdict
          step never ran or never finished, an absent answer: the posture step routes it
          EVIDENCE_UNTRUSTED (never weaker than a BLOCKED it already reached) and shows it as "not
          reported". tests/prove_version_gap_production.py.

  # ─────────────────────────────────────────────────────────────────────────
  iac_mode:
    description: Applicability model for infrastructure-as-code.
    consumers: [discover job, iac-scan]
    supersedes: enable_iac (boolean, default false)
    values:
      auto:     {definition: Discover IaC in scope and scan what is found.}
      disabled: {definition: Explicitly skipped. Reported loudly. An exception, not a default.}
      required: {definition: Absence is itself a finding — this repo is declared to contain IaC.}

  # ─────────────────────────────────────────────────────────────────────────
  capability_origin:
    description: >-
      WHERE A CAPABILITY CAME FROM, which is not the date it became real. CodeQL had twelve
      upload-sarif references and zero init calls -- a defect in a pre-existing neutral kit,
      discovered during an employer engagement. Discovery location is not origin, and "not fully
      implemented yet" is not "originated here".
    consumers: [docs/assurance/CAPABILITY_CUSTODY.csv, tests/check_custody.py]
    rule: >-
      Record ORIGIN separately from implementation date, and draw the line per capability while
      everything is still pre-instantiation -- the only moment it is free to draw.
    values:
      PREEXISTING_NEUTRAL_IMPLEMENTATION:
        {definition: "Built and working in the neutral kit before the engagement."}
      PREEXISTING_NEUTRAL_INTENT:
        {definition: "Intended and annotated in the neutral kit, wiring incomplete. A defect, not an import."}
      GENERIC_TEAM_PATTERN:
        {definition: "A pattern any team shape needs. One engagement forcing you to notice a gap does not transfer the capability -- though specific VALUES may be employer policy."}
      OVERLAY_REQUESTED_CAPABILITY:
        {definition: "Entered from the employer's declared ecosystem. Overlay custody."}
      OVERLAY_SPECIFIC_INTEGRATION:
        {definition: "A concrete integration with the employer's own systems. Overlay custody."}
      OVERLAY_SPECIFIC_POLICY:
        {definition: "Their values, not the capability. A 3-4 digit ticket rule is policy; the ability to enforce a configurable range is not."}
      OVERLAY_ECOSYSTEM_DECLARED:
        {definition: "Declared in their stack and NOT implemented here. Listed so the capability map is honest about what is expected and absent."}

  environment_tier:
    description: >-
      Gating stringency increases along the promotion path. UAT and PROD are BOTH production for
      this purpose -- UAT usually holds production-shaped data and is the last place a defect is
      cheap to find.
    consumers: [deployment gate, promotion policy]
    rule: >-
      "Scanner did not run" MUST block at production tiers. UNDETERMINED is not PASS, and the
      promotion gate is the last place that distinction is free.
    values:
      sandbox: {definition: "Throwaway. Findings warn; nothing blocks."}
      dev:     {definition: "Shared development. Findings warn."}
      test:    {definition: "New critical/high block. Scanner failure still warns."}
      uat:     {definition: "PRODUCTION TIER. New critical/high block; a scanner that did not run blocks."}
      prod:    {definition: "PRODUCTION TIER. Same as uat."}

  team_pattern:
    description: >-
      Some controls cannot exist below a headcount. A gate requiring reviewer separation on a
      single-developer repository is unsatisfiable, and shipping it produces a control everyone
      routes around.
    consumers: [branch protection policy, approval routing, disposition workflow]
    rule: >-
      A solo repository cannot prove the human half of the operating model. Required reviewers,
      CODEOWNERS routing and approval separation are UNVALIDATED HUMAN-WORKFLOW PATHS there --
      not failures, and not to be reported as passing either.
    values:
      solo_dev:   {definition: "1. Branch protection and required checks only; the author is the only approver."}
      pair_devs:  {definition: "2. Mutual review possible; no separation of duties on an exception."}
      small_team: {definition: "3-4. Real review, CODEOWNERS routing, rotation."}
      full_team:  {definition: "5+. Approval separation; security reviewer distinct from author and approver."}

  # ─────────────────────────────────────────────────────────────────────────
  # THE THREE NAMESPACES BELOW ARE STAGE 1'S OWN WORDS (policy resolution, L32 / L33).
  #
  # ENFORCEMENT_TIERS_AND_FINDING_BASELINE.md section 13 held the rung vocabulary back until "the
  # derivation table itself" existed. It exists now (scripts/rung_ladder.py, documented in
  # docs/architecture/RUNG_DERIVATION_TABLE.md), and scripts/policy_registration.py branches on
  # every value here. Checked first, per TAXONOMY_DRIFT remedy 2: policy_mode has two values and
  # is DERIVED from the rung, so it cannot also be the rung; control_weakening is reused unchanged
  # for a demotion and a supplied-rung divergence rather than respelled; validation_debt_state is
  # about an unproven capability of the kit, not a repository's declared posture; team_pattern's
  # rule already says what solo_dev cannot prove, and human_control_availability is the VALUE that
  # rule was always implying and never had.
  enforcement_rung:
    description: >-
      The business's declared enforcement posture per (repository, environment) cell. The ROOT of
      the enforcement tree: policy_mode is derived from it, team_pattern says how its floor is
      satisfied, environment_tier may only raise its floor, cherry-picks may only strengthen it.
    consumers: [scripts/rung_ladder.py, scripts/policy_registration.py, security-gate (wiring owed),
                promotion review]
    rule: >-
      A RUNG IS A FLOOR, NOT A SETTING, AND IT IS NOT A WORKFLOW INPUT. It sets, per control, the
      weakest routing result that control may contribute. It is registered on the protected
      default branch under CODEOWNERS and read from there; a rung a caller can pass is a
      governance position expressed as a config flag. Declaring downward is a weakening event.
    forbidden: >-
      THE DECLARED RUNG MUST NEVER BE REPORTED AS THE EFFECTIVE ONE. "Comfortable with" and
      "prepared for" are different claims; the evidence of section 4.3 sets the effective rung,
      the record carries both, and the gate obeys the effective one.
    values:
      crawl: {definition: "Only secrets block. Everything else is reported."}
      walk:  {definition: "Secrets block, plus the cherry-picked set. Everything else is reported with a disposition required."}
      run:   {definition: "All new critical and high block. Pre-existing findings on an unexpired remediation track proceed with advisory; a lapsed track blocks. A schedule, never amnesty."}

  policy_resolution:
    description: >-
      What stage 1 established about this run's enforcement policy before any scanner ran. One
      resolved outcome and six refusals, each by name, because "could not read the policy" and
      "the policy is defective" are different facts with different remedies.
    consumers: [scripts/policy_registration.py, tests/prove_policy_registration.py,
                security-gate (wiring owed), the posture record]
    rule: >-
      NOTHING RESOLVES TO THE DEFAULT BECAUSE IT COULD NOT READ A FILE. An unreadable,
      unparseable or schema-violating register, or a protected ref that cannot be fetched, is a run
      whose input to enforcement is missing, and it routes EVIDENCE_UNTRUSTED. Only a register that
      is genuinely ABSENT -- read successfully, nothing there -- resolves to the documented kit
      default (crawl: only secrets block), recorded as policy_source KIT_DEFAULT on every run (owner
      requirement 2026-10-22, the crawl phase; this supersedes the O-03 recommendation that uat
      and prod refuse). A policy DEFECT observed by this check -- a supplied policy_mode, a
      conflict, an unattributed decision, a softened secret, a repository file that softens,
      non-monotone tiers -- is an observed refusal and routes BLOCKED. Both stop a gate; the
      difference tells a person which problem they have.
    values:
      POLICY_RESOLVED:
        definition: >-
          The register (central and repository, read from places a pull request cannot write) was
          valid; every matching entry was applied in precedence order; the effective minimum per
          control was computed; policy_mode was derived. Also the state of the kit default.
      POLICY_REGISTER_CONFLICT:
        definition: >-
          Two registrations say different things about one thing: two entries with one scope, an
          entry id or a JSON key that appears twice, one environment name mapped to two tiers, or
          the repository file and the central register both registering one repository tier.
        rule: >-
          A POLICY DEFECT, BLOCKED, naming both. Which one governs must never be an accident of
          file order -- the reader that keeps "the last one" has silently chosen for the owner.
      POLICY_DECISION_UNATTRIBUTED:
        definition: >-
          A register nobody signed off, or an entry whose decision lacks authority, reason,
          decided_on or expires, or a uat/prod departure whose decision does not name the
          environment's required reviewers.
        rule: >-
          BLOCKED. Every registration is a decision a named person made; a tightening or a
          softening with no name on it is a decision nobody made.
      POLICY_DECISION_EXPIRED:
        definition: An entry applied to this run carries a decision whose expiry has passed.
        rule: >-
          Routes DECISION_REQUIRED. AN EXPIRY NEVER SOFTENS ANYTHING: the entry's tightening stays
          in force and its softening reverts to what the scope inherited. Silence never renews it.
      REPOSITORY_FILE_SOFTENING:
        definition: >-
          The repository's own registration left a control, the rung or the deploy approval weaker
          than the central register gave that repository.
        rule: >-
          BLOCKED, and the softening is not applied. A repository may tighten its own policy; it
          may never loosen what it inherits.
      POLICY_BELOW_AUTHORITY_FLOOR:
        definition: >-
          A central register entry left the rung, a control's routing or a deploy approval weaker
          than what a registered entry above it in precedence set -- an org beneath its
          enterprise, a team, product, team+product or repository entry beneath its org, or a
          tier-qualified entry beneath the tier-less entry of its own scope -- or a scope narrower
          than the authority (enterprise or org) softened the kit default's deploy approval.
          KDEC-018 (owner, 2026-10-22): "whatever is allocated at the org or enterprise ... must be
          the level we run at across the entire enterprise. So if they say walk everyone is at
          walk."
        rule: >-
          BLOCKED, WITH OR WITHOUT A DECISION, and the softening is not applied: the entry's
          tightening (if any) stays and the floor holds in the record. Narrower scopes may only
          tighten. Raising the rung is a tightening even where the ladder routes one class
          differently. Per-finding exceptions (secret_exceptions) are not rung changes and are not
          this. Crawl itself is the absolute floor: no rung is below it and secrets never soften
          (CHERRY_PICK_BELOW_FLOOR).
      ORG_NOT_UNDER_ENTERPRISE:
        definition: >-
          RETIRED 2026-10-23, NO LONGER EMITTED. Built 2026-10-22 (lane L-RB, 26ca9e8) as a refusal
          of a run in an org the central `orgs` map does not name -- a misreading of the owner's
          "No run with the enterprise floor even if unmapped previously", which meant "No -- RUN
          with the enterprise floor". KDEC-020 supersedes KDEC-019 item 1: such an org runs at the
          enterprise floor with the notice policy_notice.ORG_UNMAPPED_RAN_AT_ENTERPRISE_FLOOR.
        rule: >-
          Kept registered only because earlier records and the explainer's change history name it.
          Nothing in the kit refuses with it; tests/prove_authority_floor.py A11 proves the resolver
          no longer carries it.
      EXCEPTION_RENEWAL_LIMIT:
        definition: >-
          A register entry SOFTENS (the authority's softening of the kit default deploy approval)
          on a decision whose `renews` history exceeds the renewal cap (KDEC-018 item 4).
        reuses: exception_lifecycle.EXCEPTION_RENEWAL_LIMIT
        rule: >-
          Routes DECISION_REQUIRED, like an expired decision: the softening does not apply, any
          tightening stays, and someone must fix the cause rather than renew again.
      EXCEPTION_HISTORY_TAMPERED:
        definition: >-
          A register exception -- a secret or known-exploited exception, or a softening decision --
          declares a shorter renewal history than the git history of its register file shows
          (KDEC-022 item 2).
        reuses: exception_lifecycle.EXCEPTION_HISTORY_TAMPERED
        rule: BLOCKED. The exception is refused and the softening does not apply.
      EXCEPTION_HISTORY_UNVERIFIED:
        definition: >-
          A register SOFTENING decision's renewal history cannot be read from git (KDEC-022 item 2).
          (An unverified secret or known-exploited exception is refused per item and is not a
          resolution state: its finding simply blocks.)
        reuses: exception_lifecycle.EXCEPTION_HISTORY_UNVERIFIED
        rule: >-
          Routes DECISION_REQUIRED, like EXCEPTION_RENEWAL_LIMIT: the softening does not apply, the
          rest of the policy stands.
      POLICY_MODE_SUPPLIED:
        definition: The run received policy_mode as an input, in any spelling, with any value.
        rule: >-
          REFUSED EVEN WHEN THE VALUE IS THE ONE THE DERIVATION WOULD PRODUCE. A derived value a
          caller can still override is not derived.
      TICKET_ROUTING_BELOW_FLOOR:
        definition: >-
          An entry's ticket_routing sends a secret, a KEV-listed vulnerability or a known-malicious
          package (the floor classes) to project "none" -- no ticket (KDEC-028,
          scripts/ticket_routing.py). Routing is otherwise free at every scope: the most specific
          wins and narrower scopes override broader ones in either direction.
        rule: >-
          A POLICY DEFECT, named, routing BLOCKED like CHERRY_PICK_BELOW_FLOOR: a register may route
          a floor-class finding to any project but may never switch its ticketing off. At run time
          the same rule holds where a register could not see it coming -- a none-rule or
          none-default that matches a floor-class finding is skipped for it, with this name in the
          run notes, and the finding is ticketed by the next target or JIRA_PROJECT.
      CHERRY_PICK_BELOW_FLOOR:
        definition: >-
          A registered control asks for less than the kit permits at all: a secret-class control
          (secrets, secret-scan, malicious-deps) below BLOCKED, or any control set to PROCEED; or
          the run RECEIVED an input that switches a crawl-floor scan off -- enable_malicious_pkg_scan
          false (KDEC-020: the malicious-package scan is part of the crawl floor).
        rule: >-
          A POLICY DEFECT, named. Not applied-then-overridden and not silently dropped: a
          silently-dropped override reads as applied to everyone who wrote it. The effective set
          never contains the defective value. (A control below the RUNG's floor, with an
          attributed decision, is a softening and a weakening row -- not this.)
      CELLS_NOT_MONOTONE:
        definition: >-
          rung(sandbox) <= rung(dev) <= rung(test) <= rung(uat) = rung(prod) is violated, or two
          cells at one tier disagree.
        rule: >-
          A policy defect. Without the ordering everything merges at the lower rung and is
          discovered at the promotion gate, weeks later, belonging to someone who moved on.
      CELL_NOT_REGISTERED:
        definition: >-
          The registration is readable and holds no cell for the targeted environment, or a pull
          request has no environment reachable from a merge without a human gate.
        rule: Routes EVIDENCE_UNTRUSTED. An unregistered cell has no floor to apply.
      REGISTRATION_UNAVAILABLE:
        definition: >-
          A register is unparseable, violates the schema (schema_version 2), cannot be read, or
          the protected ref cannot be resolved. NOT an absent one: absent is the kit default.
        rule: >-
          Routes EVIDENCE_UNTRUSTED, with the reason. Unreadable is not the default, and the
          working tree is never consulted as a fallback -- a registration read from the PR under
          evaluation is a self-signed demotion.
      POLICY_NUMBER_NOT_CONFIGURED:
        definition: >-
          A number the mechanism needs -- a promotion run count, an SLA period, a grace period --
          is not in the registration's numbers block.
        rule: >-
          REFUSED, NEVER DEFAULTED. Every number in the design is a placeholder awaiting an owner's
          decision, and none of them is implemented as a constant. The code holds no value to fall
          back to, by construction.
      RUNG_EFFECTIVE_BELOW_DECLARED:
        definition: >-
          The declared rung exceeds what the promotion evidence of section 4.3 supports; the
          effective rung is the evidenced one.
        rule: >-
          NOT A REFUSAL. The record carries both values and the gate obeys the effective one --
          never the reverse, and never a single number that hides which it is. A dashboard
          showing run over an estate running at crawl is the most expensive artefact in the design.

  policy_notice:
    description: >-
      Something stage 1 did that a person must see but that is NOT a refusal: the run resolves and
      proceeds, and the notice travels with it -- in the resolution's `notices` and `notes`, the
      policy_notices output, a workflow warning annotation and the gate's policy summary.
    consumers: [scripts/policy_registration.py, .github/actions/resolve-policy,
                reusable-security.yml (policy summary), tests/prove_authority_floor.py]
    rule: >-
      NEVER SILENT, NEVER A REFUSAL. A notice names what happened and the remedy; it does not
      change the rung, the routing or the verdict.
    values:
      ORG_UNMAPPED_RAN_AT_ENTERPRISE_FLOOR:
        definition: >-
          The central register defines an enterprise (its `orgs` map is non-empty) and the run's org
          is not named in that map. The org ran at the enterprise floor: the one enterprise's
          entries, or with several enterprises the STRICTEST of them at the evaluated tier (higher
          rung, then stronger controls, then stronger deploy approval; never the lower). KDEC-020
          (owner, 2026-10-23): "I thought we agreed unmapped orgs would be rolled in at whatever
          level the enterprise or other orgs are at."
        rule: >-
          The run resolves at that floor; the org's own entries may tighten above it and an entry
          that goes below it is POLICY_BELOW_AUTHORITY_FLOOR. The notice names the org, the
          enterprise and rung used, and says "add it to the orgs map". With no enterprise ENTRY in the
          register, KDEC-022 item 1 governs instead (ORG_UNMAPPED_RAN_AT_STRICTEST_ORG).
      ORG_UNMAPPED_RAN_AT_STRICTEST_ORG:
        definition: >-
          The central register has an `orgs` map or org entries but NO enterprise entry, and the run's
          org is not known to it (not in the map, named by no entry, owning no registered
          repository). The org ran at the STRICTEST registered org, judged tier by tier on each
          org's org-level entries by KDEC-020's comparison (higher rung, then stronger controls,
          then stronger deploy approval; a tie goes to the first name). KDEC-022 item 1 (owner,
          2026-10-23): "Yes you should get the strictest from the orgs."
        rule: >-
          The run resolves at that floor and never below crawl; its own repository file may tighten
          above it, and one that goes below it is REPOSITORY_FILE_SOFTENING. The floor org's
          per-finding exceptions never travel. The notice names the org, the floor org, the rung and
          the tier, and says to register the org.

  environment_protection:
    description: >-
      What a deploy read back about the GitHub environment it runs in: whether its required
      reviewers give what the policy demands at this tier (one approver, from the named groups,
      self-review prevented). Emitted by the deploy reusables' `protection` step, before login.
    consumers: [scripts/environment_protection.py, reusable-deploy-appservice.yml,
                reusable-deploy-containerapp.yml, tests/prove_deploy_environment_protection.py]
    rule: >-
      AT uat AND prod ONLY VERIFIED AND NOT_REQUIRED PROCEED. The kit cannot set an environment's
      reviewers; it can read them, so an unprotected production environment is a refusal, not a
      hand-off note. A rule that could not be read is not a rule that was satisfied. Below uat every
      outcome is recorded and warned, never refused. The demand is the stronger of the gate's
      deploy_approval and the kit default: a value handed to the deploy can tighten, never weaken.
    values:
      ENVIRONMENT_PROTECTION_VERIFIED:
        definition: The environment's required reviewers satisfy the demand.
      ENVIRONMENT_PROTECTION_NOT_REQUIRED:
        definition: Nothing is demanded at this tier (below uat, by default); the rules were not consulted.
      ENVIRONMENT_REVIEWERS_ABSENT:
        definition: No required-reviewer rule, or one with no reviewers -- anyone who can run the workflow deploys.
      ENVIRONMENT_SELF_REVIEW_ALLOWED:
        definition: Self-review must be prevented and the environment lets the deployer approve their own deploy.
      ENVIRONMENT_APPROVER_GROUP_MISSING:
        definition: >-
          Named approver groups are demanded and a reviewer outside them could approve, or none of
          the reviewers is one of them.
      ENVIRONMENT_PROTECTION_NOT_ESTABLISHED:
        definition: >-
          The environment API could not be read, the demand could not be read, or the tier is not
          a registered one.
        rule: Refused at uat and prod. Unknown is not protected.

  # ─────────────────────────────────────────────────────────────────────────
  # OF-5 (the LZ-vs-kit deployment review, 2026-10-28; KDEC-034 PROPOSED). The landing zone's stronger
  # release preconditions, held by the kit before login: scripts/release_gates.py, the deploy reusables'
  # `zone` and `approval` steps, tests/prove_release_gates.py. Checked first: environment_protection says
  # what the environment's reviewer SETTING is; no existing namespace says what the PLATFORM's stop, the
  # ZONE's readiness or the RUN's own approval established.
  release_block:
    description: >-
      What a deploy read, before login, of the landing zone's platform stop for its workload
      (KIT_RELEASE_BLOCK in the GitHub environment, written by the vend on every halt and apply_block
      change: none | platform_halted | ttl_expired | budget_cap_reached).
    consumers: [scripts/release_gates.py, reusable-deploy-appservice.yml, reusable-deploy-containerapp.yml,
                reusable-deploy-staticwebapp.yml, tests/prove_release_gates.py]
    rule: >-
      ANYTHING BUT `none` REFUSES, AT EVERY TIER. A halted, TTL-expired or budget-capped platform takes no
      release; an unregistered value is never read as a clearance. Unset is recorded, not a refusal: no
      landing zone writes it there.
    values:
      RELEASE_NOT_BLOCKED:
        definition: The environment carries KIT_RELEASE_BLOCK = none; the landing zone reports no stop.
      RELEASE_BLOCK_NOT_VENDED:
        definition: >-
          The environment carries no KIT_RELEASE_BLOCK (no landing zone writes one there); no platform stop
          is in force, recorded in the posture record.
      RELEASE_BLOCKED_BY_PLATFORM:
        definition: >-
          KIT_RELEASE_BLOCK is anything but none (platform_halted, ttl_expired, budget_cap_reached, or an
          unregistered value). Refused before login, nothing deployed; releases resume when the platform
          writes none.

  zone_readiness:
    description: >-
      The landing zone's readiness for the zone a release targets, as the vend writes it into the GitHub
      environment (KIT_ZONE_READINESS), from the zone's eight behavioural readiness gates. The landing
      zone's vocabulary, consumed by the kit.
    consumers: [scripts/release_gates.py, "(the landing zone) its readiness register and hand-off write"]
    rule: UNKNOWN IS NEVER A PASS, and there is no overall READY without the gates behind it (the landing zone's rule).
    values:
      READY:
        definition: Every readiness gate of the zone passed.
      READY_WITH_EXCEPTIONS:
        definition: >-
          The zone is ready with recorded, attributed exceptions (the landing zone's record). A release at
          uat or prod proceeds with a warning.
      NOT_READY:
        definition: A readiness gate failed; the zone may take nothing beyond dev.
      UNKNOWN:
        definition: >-
          The readiness was not established -- unset, the landing zone's own UNKNOWN, or a value that is
          not one of these four.

  zone_readiness_gate:
    description: What a deploy decided, before login, from the zone's readiness and its own tier.
    consumers: [scripts/release_gates.py, reusable-deploy-appservice.yml, reusable-deploy-containerapp.yml,
                reusable-deploy-staticwebapp.yml, tests/prove_release_gates.py]
    rule: >-
      AT uat AND prod ONLY READY OR READY_WITH_EXCEPTIONS RELEASES. Below uat the readiness is recorded,
      never refused; a tier that is not registered cannot be shown to be below production.
    values:
      ZONE_READINESS_PERMITTED:
        definition: A uat or prod release into a zone that is READY or READY_WITH_EXCEPTIONS.
      ZONE_READINESS_NOT_REQUIRED:
        definition: Below uat; the readiness is recorded in the posture record and not consulted.
      RELEASE_REFUSED_ZONE_NOT_READY:
        definition: >-
          A uat or prod release into a zone that is NOT_READY or UNKNOWN (unset included), or a release at an
          unregistered tier. Refused before login.

  release_approval:
    description: >-
      What a deploy read, before login, of its OWN run's environment approvals (GET
      /repos/{owner}/{repo}/actions/runs/{run_id}/approvals) and the released commit's authors: whether
      consent to this release was given by someone other than the requester and the author, and bound to
      the digest being released. The approving reviewer who quotes the digest is the confirmer.
    consumers: [scripts/release_gates.py, reusable-deploy-appservice.yml, reusable-deploy-containerapp.yml,
                reusable-deploy-staticwebapp.yml, tests/prove_release_gates.py]
    rule: >-
      THE APPROVER IS NEITHER THE REQUESTER NOR THE AUTHOR, AND APPROVES THE BYTES. GitHub's self-review
      prevention excludes only the run's trigger; this holds the landing zone's rule (approver, confirmer and
      requester distinct; the plan digest confirmed) for releases. At uat and prod only VERIFIED proceeds;
      below uat it is recorded unless the policy demands the digest (deploy_approval.confirm_digest), which
      can only tighten. Anything that cannot be read is NOT_ESTABLISHED, a refusal.
    values:
      RELEASE_APPROVAL_VERIFIED:
        definition: >-
          An approval of this run's environment exists, no approving reviewer is the requester or the
          release's author, and (where demanded) an independent approval's comment quotes the digest (the
          full digest, or at least its first 12 hex characters).
      RELEASE_APPROVAL_NOT_REQUIRED:
        definition: Below uat with no digest confirmation demanded; the API is not read.
      RELEASE_APPROVAL_ABSENT:
        definition: >-
          No reviewer approved this run's deployment to its environment: an administrator bypass, or an
          environment without required reviewers, leaves no approval. Refused at uat and prod.
      SELF_DEPLOYMENT_APPROVAL:
        definition: >-
          An approving reviewer is the requester (the run's triggering actor or actor) or the release's
          author (the released commit's author, or a merge commit's second parent's). The landing zone's own
          name for the same refusal (its item 52), so one view serves both. Refused before login.
      RELEASE_APPROVAL_NOT_BOUND_TO_DIGEST:
        definition: >-
          The approval is independent but no approval comment quotes the digest being released, so the
          consent is not shown to be for these bytes. Refused where the confirmation is demanded.
      RELEASE_APPROVAL_NOT_ESTABLISHED:
        definition: >-
          The approvals, the requester, the released commit's author (an author email not linked to an
          account included) or the demand could not be read, or the tier is not registered. Refused.

  policy_source:
    description: >-
      Where this run's enforcement policy came from: a registered decision, or the kit's documented
      default. Emitted by the security gate beside policy_resolution.
    consumers: [scripts/policy_registration.py, security-gate (policy step and posture record)]
    rule: >-
      THE DEFAULT IS NAMED, NEVER IMPLIED. A run at crawl because nobody registered anything and
      a run at crawl because a person decided crawl read the same on the floor table and differ in
      who answers for them; the record says which.
    values:
      KIT_DEFAULT:
        definition: >-
          No central register entry and no repository registration matched this run (each was
          read successfully and held nothing for it). The kit default applies: crawl at every
          tier, only secrets block, every other control PROCEED_WITH_ADVISORY; uat and prod
          deploys need one environment reviewer with self-review prevented.
        rule: Never the result of a read that failed -- that is REGISTRATION_UNAVAILABLE.
      REGISTER:
        definition: At least one signed-off register entry matched this run and was applied.

  human_control_availability:
    description: >-
      Whether a human control a floor or a cherry-pick relies on can EXIST at this team_pattern.
      Team size changes the mechanism, never the floor.
    consumers: [scripts/enforcement_axes.py, scripts/policy_registration.py,
                tests/prove_enforcement_axes.py, breach escalation, promotion review]
    rule: >-
      UNVALIDATED IS NOT PASSING AND NOT FAILING. A solo repository cannot prove the human half of
      the operating model; a control it cannot demonstrate is reported as an unvalidated
      human-workflow path and the decision routes to an authority outside the repository. Reading
      team size as permission to lower a rung is how "we're small" becomes a standing exemption.
    values:
      HUMAN_CONTROL_AVAILABLE:
        definition: The pattern has the headcount for this control, and it can be demonstrated.
      HUMAN_CONTROL_UNVALIDATED:
        definition: >-
          The control cannot exist at this headcount -- a second reviewer, approval separation or
          CODEOWNERS routing on a one-person repository. An UNVALIDATED HUMAN-WORKFLOW PATH.
        rule: Never rendered as satisfied. The floor it would have served is untouched.
      HUMAN_CONTROL_NO_SEPARATION:
        definition: >-
          The control exists in a weaker form -- two people can review each other -- with no
          separation of duties on an exception. Recorded as such.
        rule: >-
          Distinct from HUMAN_CONTROL_UNVALIDATED -- the review happens; the separation does not.

  # ─────────────────────────────────────────────────────────────────────────
  # THE TWO NAMESPACES BELOW ARE THE REMEDIATION TRACK'S OWN WORDS (L47; ETFB sections 7-8).
  #
  # Proposed as CANDIDATES in ENFORCEMENT_TIERS_AND_FINDING_BASELINE.md sections 12.3 and 12.4 and
  # registered now because scripts/remediation_sla.py branches on them. Section 12.6's advice --
  # merge 12.4 into disposition fields -- was weighed and not taken: a track state is COMPUTED from
  # a clock, a deadline and the decisions on record, and nobody writes it; a disposition field is
  # written by an approver. Putting a computed value where an authorised one lives would let the
  # clock look like a decision. Section 12.3's spelling flag is honoured: the not-established value
  # follows the NOT_ESTABLISHED form the kit already uses.
  fix_availability:
    description: >-
      Whether the thing this finding names can currently be fixed, ESTABLISHED rather than assumed.
      A remediation track is a schedule, and a schedule over something nobody can fix is a promise
      with a date attached that nobody can keep.
    consumers: [scripts/remediation_sla.py, tests/prove_remediation_sla.py, remediation track
                admission, SLA breach routing, promotion review]
    rule: >-
      ONLY AN ESTABLISHED VALUE ADMITS A FINDING TO A TRACK. Not-established is a gap, never a
      benign default -- defaults_are_suspicious_at_assurance_boundaries applies unchanged.
    values:
      FIX_AVAILABLE:
        definition: A patch, version or configuration change exists AND is applicable to this consumer.
        rule: Upstream having shipped something is not the same as it being applicable here.
      MITIGATION_AVAILABLE:
        definition: No fix, and a compensating control exists that can be put in force here.
        rule: >-
          Takes a track whose deliverable is the control IN FORCE and EVIDENCED, closing to
          disposition_type.MITIGATED with its own re-verification expiry -- never to REMEDIATED.
          The finding remains open and observable.
      NO_FIX_AVAILABLE:
        definition: Upstream has none; the thing cannot currently be remediated.
        rule: >-
          Requires a DECISION, not a schedule: ACCEPTED_RISK with a named authority and an expiry,
          or removal of the exposure. Carries a re-check cadence (a configured number), because
          "no fix exists" is a claim with a shelf life and the single most attractive thing in the
          model to assert and then forget. The clock still runs.
      FIX_AVAILABILITY_NOT_ESTABLISHED:
        definition: Nobody has established which of the above is true.
        rule: >-
          May not take a track and may not be grandfathered. Routes to DECISION_REQUIRED at the run
          rung until established.

  remediation_track_state:
    description: >-
      The progress of the obligation created when a pre-existing finding was authorised to
      proceed. The disposition says it may proceed; this says whether anyone is doing anything
      about it. COMPUTED from the deadline, the configured grace and the decisions on record.
    consumers: [scripts/remediation_sla.py, tests/prove_remediation_sla.py, security-gate at the
                run rung (wiring owed), promotion review, breach escalation]
    rule: >-
      A TRACK WITH NO VERIFIED CLOSURES IS AMNESTY WITH PAPERWORK, and it is indistinguishable
      from a working track until the morning everything expires at once. Nothing here moves a
      deadline: new deadline = min(existing, re-score date + period), and the module exposes no
      function that extends one.
    forbidden: >-
      BREACHED_ACCEPTED MUST NEVER BE RENDERED AS COMPLIANT. It records an accepted, dated breach;
      the clock was not reset. And CLOSING A TICKET NEVER PRODUCES CLOSED_VERIFIED -- only the
      scanner not reproducing the finding over demonstrated coverage does.
    values:
      ON_TRACK:
        definition: Admitted (fix or mitigation established), unexpired, owned.
      BREACHED_ACCEPTED:
        definition: >-
          Past its SLA deadline, with a dated decision from a named authority that has not itself
          expired -- a per-finding acceptance or the day-one cohort decision. The record says
          BREACHED, never COMPLIANT.
      BREACHED_UNDECIDED:
        definition: >-
          Past its deadline with no decision in force. Routes DECISION_REQUIRED within the
          configured grace; after it, carries finding_classification.REOPENED_BY_LAPSE and routes
          at the rung's lapsed-track floor (BLOCKED at run).
        rule: A decision after a lapse is a new dated decision; it never restores the original deadline.
      CLOSED_VERIFIED:
        definition: The scanner no longer reproduces it, over a scope shown to cover where it lived.
        rule: Absence without demonstrated coverage is POTENTIALLY_ABSENT, not this.
      TRACK_STALLED:
        definition: >-
          Zero verified closures for this cell in the configured period, regardless of how many
          entries are unexpired. A DECISION_REQUIRED at promotion review.
      TRACK_NOT_ADMITTED:
        definition: >-
          Not on a track: fix availability not established, NO_FIX_AVAILABLE with no decision in
          force, no severity, or no deadline.
        rule: Routes DECISION_REQUIRED. A track without a date is amnesty.

  scan_depth:
    description: >-
      How hard to look, decided by TRIGGER CONTEXT. Distinct from applicability (discovery) and
      from enforcement (environment x team). Distinct also from pipeline STAGE, which is a
      dependency graph inside one run rather than a context the graph executes under.
    consumers: [reusable-security profile input]
    rule: >-
      A scanner reduced in depth must NOT report as NOT_APPLICABLE. "We looked less hard this
      time" and "there was nothing to look at" are different statements about coverage.
    values:
      pr:         {definition: "Fast and precise. Default query suite, diff-scoped secrets, changed paths."}
      merge:      {definition: "Full tree, security-extended, blocking."}
      nightly:    {definition: "security-and-quality, full git history, report only."}
      release:    {definition: "Extended plus SBOM and attestation. Hard gate."}
      revalidate: {definition: "Deployed artifact ONLY -- image digest and SBOM. No source scanning: the source did not change, the world did."}
      DEPTH_REDUCED:
        {definition: "A scanner that ran with a narrower suite or scope than its fullest setting. NOT NOT_APPLICABLE -- 'we looked less hard this time' and 'there was nothing to look at' are different statements about coverage, and collapsing them is how a PR-speed run reads as full assurance."}

  platform_applicability:
    description: >-
      WHETHER A CAPABILITY COULD HAVE RUN AT ALL -- a different axis from whether it did. The
      Actions UI renders every one of these as `skipped`, so a reader cannot tell a licensing
      decision from an empty repository from a crash. Established ONCE by discovery and consumed
      everywhere, because sixteen jobs answering separately meant sixteen possible beliefs about
      one organisation setting.
    consumers: [discover job, report job, scripts/scan_report.py]
    rule: >-
      UNKNOWN IS NOT FALSE. The security_and_analysis block is returned only to callers with
      admin, so a read-scoped token legitimately cannot see it. Reporting false there is a
      fabricated negative that silently disables scanning on fully licensed repositories.
    values:
      APPLICABLE:     {definition: In scope and available; the scanner should run.}
      NOT_APPLICABLE: {definition: "No files of a supported kind in scope. Nobody's action."}
      UNAVAILABLE:    {definition: "Not licensed or not available to this repository. PLATFORM action, never developer action."}
      NOT_CONFIGURED: {definition: "Available and switched off. PLATFORM action -- a decision was made, or never made."}
      UNKNOWN:        {definition: "This token could not see the answer. Run anyway and say so; never report a clean result."}

  execution_state:
    description: >-
      WHETHER THE SCANNER ACTUALLY COMPLETED, separate from whether it was applicable. Pairs with
      platform_applicability; scanner_state collapses the two, which is right for a gate verdict
      and wrong for telling a person what to do next.
    consumers: [report job, scripts/scan_status.sh, scripts/scan_report.py]
    rule: >-
      ONLY COMPLETE MAY CARRY A FINDING COUNT. A scanner that did not finish cannot report 0, and
      cannot report a number scraped from a partial report it happened to leave behind. `0` says
      something looked; NOT ESTABLISHED says nothing did, and they render almost identically to a
      tired reader at 5pm.
    values:
      COMPLETE:          {definition: Ran to completion and produced a parseable result.}
      FAILED:            {definition: Did not complete. Findings NOT ESTABLISHED.}
      COLLECTION_FAILED: {definition: "Ran and produced no usable report -- a pipeline defect, not a code defect."}
      NOT_RUN:           {definition: "Never started: skipped, cancelled, or gated off upstream."}
      NOT_DECLARED:
        definition: >-
          The invoking job did not state this. The ABSENCE of a measurement, not a measurement.
        rule: >-
          THIS IS THE DEFAULT, AND THAT IS THE WHOLE POINT. The reporter previously defaulted to
          COMPLETE, so a job that forgot to declare its execution state got the strongest claim in
          this namespace for free -- an omission producing a stronger verdict than any statement
          could. Silence must degrade a verdict, never strengthen it. Carries no finding count,
          for the same reason NOT_RUN carries none: nobody said anything looked.

  # ─────────────────────────────────────────────────────────────────────────
  # WHETHER THE SCAN EXAMINED ANYTHING, which is not whether it completed.
  #
  # A SEPARATE NAMESPACE BECAUSE THE SOURCE OF TRUTH IS DIFFERENT. execution_state is DECLARED by
  # the job that ran the scanner. This is DERIVED from the scanner's own SARIF, and it has to be,
  # because the declaring job is the thing being checked: a scanner that crashed and exited 0
  # produces a job that truthfully declares COMPLETE over a run that read nothing.
  #
  # Folding this into execution_state would mean asking the caller whether the caller was right.
  scan_partial_reason:
    description: >-
      WHY a scanner job that ran and kept its findings published scan_state PARTIAL rather than a
      complete scan. The job names the reason beside the state (`scan_reason`) and the evidence
      (for Semgrep, `parse_partial_files`); the gate reads the state as scanner_state.PARTIAL and
      the posture names the advisory cause COVERAGE_PARTIAL.
    consumers: [sast-semgrep, sast-cpp, security-gate, tests/prove_semgrep_php.py,
                tests/prove_version_gap_production.py, tests/prove_cpp_build_aware.py]
    rule: >-
      A REGISTERED REASON OR NOTHING. A partial scan with a reason nobody registered is not a
      partial scan: it is the strict refusal (COLLECTION_FAILED). PARTIAL is never PASS.
    values:
      PARSE_PARTIAL_PHP_SYNTAX:
        definition: >-
          Semgrep exited 3 under --strict and its own JSON names ONLY parse errors (error_type
          PartialParsing, Syntax error, Lexical error, Other syntax error, AST builder error) on
          .php files, having examined files. Everything else was scanned and the parsed rest of
          those files too; the findings are kept; the files are named with the lines Semgrep
          reported. PHP 8.5's `(void)` cast and `final` promoted constructor properties are the
          measured case (Semgrep 1.178.0 and 1.182.0).
        rule: >-
          Owner, 2026-10-22: "scan what parses, flag the rest" (KDEC-016 amended). Any OTHER
          error class -- a non-PHP file that did not parse, a rule that did not load, a timeout,
          a crash, nothing examined -- stays COLLECTION_FAILED.
      CPP_ANALYSIS_PARTIAL:
        definition: >-
          At least one C/C++ translation unit in scope had no compilation database -- none
          committed that names files present here, no top-level CMakeLists.txt whose configure-only
          export succeeded, no top-level Makefile for which `make -n` works and bear recorded a
          build -- so cppcheck analysed it source-only: includes and macros unresolved. Measured
          2026-10-23: a write past a buffer sized by a header on the build's include path is
          invisible source-only and reported through the database. Findings are kept; the files
          are counted and named in the job summary.
        rule: >-
          FUTURE_WORK section 5 (owner): "never synthesise a build system to make a scanner happy".
          The kit writes no build file; it reads the build the repository already has, or says
          PARTIAL. Read by the gate as scanner_state.PARTIAL (COVERAGE_PARTIAL), never PASS
          (KDEC-026).
      CODEQL_BUILD_PARTIAL:
        definition: >-
          A CodeQL leg that runs autobuild (Go, and Java/Kotlin when Kotlin is discovered) analysed
          the database its build produced, and that build did not succeed: some of the code may
          never have been compiled into the database, so the analysis covers an unknown part of it.
          The leg's findings are kept; the leg names itself in the row builder's codeql_partial and
          its row's PASS is capped at PARTIAL.
        rule: >-
          Never COMPLETE and never PASS. Distinct from a leg that initialised and could not analyse
          at all, which is COLLECTION_FAILED and fails its job; and from a buildless leg
          (build_mode none), which needs no build and is not partial for the want of one. Read by
          the gate as scanner_state.PARTIAL (COVERAGE_PARTIAL).

  scan_examination:
    description: >-
      WHETHER THE SCAN ACTUALLY READ ANYTHING, derived from the SARIF rather than declared by the
      job. SARIF carries four witnesses and the reporter read none of them until 2026-10-08:
      `runs[].invocations[].executionSuccessful`, `runs[].invocations[].toolExecutionNotifications`
      at error or fatal, `runs[].tool.driver.rules`, and `runs[].artifacts`.
    consumers: [scripts/scan_report.py, scripts/sarif_validity.py, tests/prove_hollow_scan.py]
    rule: >-
      ONLY EXAMINED MAY CARRY A FINDING COUNT. A scan that examined nothing is the third of the
      four answers -- NOT_APPLICABLE means there was nothing to find, CLEAN means a scanner looked
      and found nothing, and this means NOTHING LOOKED. Rendering it as CLEAN converts a hole into
      a reassurance, and it is the strongest-looking output the reporter can emit, so the error is
      in the permissive direction. Observed live 2026-10-08: five document shapes, including a
      SARIF whose own `executionSuccessful` was false and one carrying no runs at all, every one
      rendered as a scope with no findings in it.
    values:
      EXAMINED:
        definition: >-
          The run declared itself successful (or reported a result) and no witness below says
          otherwise. An empty `rules` array is NOT a witness unless the tool's validity profile
          says it is, and no profile does (KDEC-008 OD-2, 2026-10-14: "A clean bandit run is not
          hollow" -- bandit lists only the rules that fired, so its clean run emits `rules: []`).
          Retired here 2026-10-16; until then this registry, the reporter and
          tests/prove_hollow_scan.py held the rule the decision overturned while the runner-side
          check (scripts/sarif_validity.py) obeyed it.
      EXAMINED_NOTHING:
        definition: >-
          The report parsed and establishes that nothing was examined -- the tool declared its own
          run unsuccessful, or emitted an error/fatal notification in EITHER
          `toolExecutionNotifications` or `toolConfigurationNotifications` (bandit files a file it
          could not parse under the second), or read no artifacts (an `artifacts` array present
          and empty), or loaded no rules where its profile makes that a witness.
        rule: >-
          NOT A ZERO. The scanner's exit code may well have been 0 and the job's declared
          execution_state COMPLETE; this is the axis on which that is contradicted by the
          scanner's own account of itself. Findings NOT ESTABLISHED.
      NOT_DECLARED:
        definition: >-
          The document records nothing either way about what it examined, or there was no document
          to read.
        rule: >-
          ABSENCE OF A WITNESS IS NOT A WITNESS OF PRESENCE. A SARIF that omits `invocations`,
          `rules` and `artifacts` entirely has not said it examined anything, so it carries no
          count -- the same reasoning as discovery_state.COVERAGE_GAP one namespace over.

  untrusted_input_transport:
    description: >-
      How a value reaches a script body. The ticket-reference gate interpolated a PR body into `run:`, so any
      contributor could execute code on the runner -- and a lone double quote truncated the
      variable, making the gate report a link ABSENT from a description that contained one.
    consumers: [tests/lint_injection.py, self-test workflow]
    rule: >-
      Any value GitHub does not constrain must arrive through `env:`, never through ${{ }} inside
      `run:` or a github-script body. In env: it is DATA. In the script it is CODE.
    values:
      UNTRUSTED_CONTEXT_INTERPOLATION:
        definition: >-
          A value controlled by anyone who can open an issue, PR or comment, or push a branch,
          interpolated into a script body. Remote code execution with the job's token.
        severity: critical
      CALLER_CONTROLLED_INPUT_INTERPOLATION:
        definition: >-
          A reusable-workflow or workflow_dispatch input interpolated into a script body. Setting
          it needs write access to the CALLING repository, so the exposure is smaller and it is
          not nothing: a trusted input can still be a malformed one, it truncates on a quote, and
          a kit consumed by many repositories should not let one misconfigured caller execute
          code in the workflow the others share.
        severity: medium
      SAFE_ENV_TRANSPORT:
        definition: >-
          The value arrives through env:. This is the FIX and is never reported -- a linter that
          flags the remedy teaches people to ignore it.
        severity: none

  credential_redaction:
    description: >-
      Only gitleaks was redacted. Thirteen other jobs published raw SARIF, and several scanners
      embed matched source by design -- bandit's B105 snippet IS the password.
    consumers: [scripts/redact_sarif.py, scripts/scan_report.py, tests/prove_redaction_chain.py]
    rule: >-
      Redaction runs BEFORE every publication step -- artifact and Security tab both. A redactor
      after the upload protects nothing while looking exactly like protection.
    artifacts:
      SECRET_PATTERNS:
        definition: >-
          The shared pattern set. Duplicated between the printer and the artifact redactor because
          each is inlined separately and neither can import the other at consumer runtime;
          tests/check_redaction_parity.py fails the build if they drift.
    retains: >-
      rule id, severity, FILE, LINE, and a short identifying prefix of the value. Removes
      snippet, contextRegion.snippet, codeFlow snippets and partialFingerprints -- which for a
      secret scanner can be a hash OF the secret.

  provenance_identity:
    description: >-
      The identity that must be BOUND AT CAPTURE, before anything merges or interprets evidence.
      Once identity is lost it cannot be reconstructed — proven twice, by gosec and by Trivy.
    consumers: [capture boundary, future correlation, future multi-repo collator]
    rule: Normalize only after source identity is bound. NEVER merge first and recover provenance later.
    status: PARTIAL — canonical path normalization exists; the full envelope does NOT.
    fields:
      # observed_at / observed_at_source ADDED: the envelope had thirteen fields and not one was
      # a time. `run_id` implies a moment and records none -- and it stops resolving the day the
      # run is deleted or its artifacts expire, typically 30-90 days, after which the finding has
      # no date at all. Without an observation time the entire freshness half of this model is
      # unprovable: "passed when built != safe now" needs both ends stamped, COLLECTED_STALE
      # cannot be evaluated, a risk acceptance cannot be checked against its own expiry, and
      # continuous revalidation cannot say what it is revalidating AGAINST.
      [organization, repository, repository_id, commit_sha, ref, component_root, scanner,
       scanner_version, rule_id, canonical_path, original_scanner_path, finding_fingerprint,
       run_id, observed_at, observed_at_source]
    artifacts:
      DEPLOY_PROVENANCE:
        definition: >-
          Provenance stamped onto a RUNNING deployment -- image digest, SBOM hash, git SHA and run
          id. The deployed counterpart of finding provenance: it answers "what is actually running
          and where did it come from", which a branch name cannot.
    observation_time:
      rule: >-
        A FRESHNESS CLAIM MAY ONLY BE MADE FROM A SOURCE THAT RECORDED THE TIME AT CAPTURE.
        Weaker sources are not forbidden; they are forbidden from being mistaken for the strong
        ones. Same discipline as evidence_state.
      sources:
        DECLARED_IN_CONTENT:
          tier: 1
          claimable: true
          definition: >-
            The artifact carries its own collection time -- a TimeGenerated or CollectedUtc
            column, a "Generated:" header, a scanner's own invocation startTimeUtc. Survives
            renaming, copying, zipping and re-download, none of which the weaker tiers survive.
        SIDECAR:
          tier: 2
          claimable: true
          definition: >-
            A record written BY the collecting process at the moment it ran -- a
            <name>.collection.json, or SARIF invocations[].startTimeUtc. Separable from the
            artifact so it can be lost, but written by something that actually knew.
        FILENAME:
          tier: 3
          claimable: false
          definition: >-
            A date in the name. A CLAIM: renameable, inheritable by a re-export that kept the old
            name, typo-able. Useful for routing, never for asserting age.
        FILE_MTIME:
          tier: 4
          claimable: false
          definition: >-
            Filesystem time. Records the last COPY, not the collection. Zip, download, OneDrive
            sync, restore-from-backup and cp-without-p all rewrite it, so in a packet assembled
            today every file reads as collected today. It looks authoritative and is
            systematically wrong in the direction that makes stale evidence look fresh.
        UNKNOWN:
          tier: 5
          claimable: false
          definition: Nothing establishes when this was collected.
      consequence: >-
        Where the source is not claimable, freshness is NOT ESTABLISHED -- weaker than "current",
        different from "stale". The age is unknown, and a control reporting it as current would
        be inventing the one number the claim rests on.

    warning: >-
      Path normalization is NOT provenance. It closed one defect class and proved one abstraction
      generalizes. Do not let "Trivy normalization passed" stand in for this.

  # ─────────────────────────────────────────────────────────────────────────
  authorization_probe_outcome:
    description: >-
      What a DELIBERATE ACCESS ATTEMPT against an external authority established. Added because
      verify-azure-oidc.yml previously proved authentication and inferred isolation from it:
      three identities printing three different client IDs, which is not a boundary. A boundary
      is only established by an attempt that is DENIED, and a denial is only established when
      the call reached the authority and came back refused ON AUTHORIZATION.
    consumers: [.github/workflows/verify-azure-oidc.yml, future deploy-scope preconditions]
    rule: >-
      A CLI EXITING NON-ZERO IS NOT A REFUSAL. It exits non-zero for a typo, the wrong
      subscription, throttling, a malformed name, and a scope that does not exist. NOT_FOUND and
      UNAVAILABLE MUST NOT be counted as REFUSED, and MUST NOT be reported as a pass with a
      caveat: an assertion that lands on either has established nothing and must cost the run.
      "The control could not be acquired" recorded as "the control found nothing" is the whole
      failure family in one line.
    values:
      REACHED:
        definition: The call succeeded. The identity holds the permission at that scope.
        rule: >-
          On a scope declared refused this is the loudest available failure -- the authority is
          WIDER than declared -- and never a tolerable surprise.
      REFUSED:
        definition: >-
          The call reached the authority and was denied on AUTHORIZATION: AuthorizationFailed,
          LinkedAuthorizationFailed, or a 403 attributable to role assignment.
        rule: >-
          THE ONLY OUTCOME THAT IS EVIDENCE OF A BOUNDARY. Its strength is bounded by
          observation_quality -- where the channel returns 403 for an absent scope too, a REFUSED
          proves unreachability and NOT the existence of the thing refused.
        forbidden: >-
          MUST NOT be produced by a policy denial. Policy is a different control that arrives
          with the same status code; it classifies UNAVAILABLE, so an RBAC claim is never made on
          evidence a different mechanism produced.
      NOT_FOUND:
        definition: The scope does not exist. There was nothing present to be refused by.
        rule: >-
          PROVES NOTHING ABOUT AUTHORIZATION, in either direction. Distinct from
          discovery_state.NOT_APPLICABLE, which is an evidence-backed absence after a search;
          this is a NAMED TARGET that did not resolve, and its usual cause is a typo in the
          declaration that would otherwise read as a successful refusal.
      UNAVAILABLE:
        definition: >-
          The attempt never produced an authorization decision: throttled, network, policy
          denial, CLI misuse, expired credential, or an error nobody classified.
        rule: >-
          THE UNCLASSIFIED CASE DEFAULTS HERE, never to REFUSED. A classifier that guesses in the
          permissive direction manufactures the exact false assurance this namespace exists to
          prevent.
        note: >-
          Same meaning as scanner_state.UNAVAILABLE and platform_applicability.UNAVAILABLE -- the
          control could not be acquired. Registered here as well so the probe axis is complete,
          rather than borrowing a term from a namespace that models something else.

  # ─────────────────────────────────────────────────────────────────────────
  reusable_workflow_resolution:
    description: >-
      WHICH workflow logic produced a piece of evidence, and whether anybody asserted it. A
      reusable workflow called from another repository presents the CALLER's repository claim
      while job_workflow_ref names the file and ref that actually ran; that asymmetry is the only
      in-band proof that private cross-repo resolution happened at all.
    consumers: [.github/workflows/verify-azure-oidc.yml, future multi-repo collator]
    rule: >-
      RECORDED IS NOT ASSERTED. A job_workflow_ref printed into a log tells a reader which kit
      ref ran. Only a declared expectation compared against it tells anyone that the kit they
      believe they called is the kit that answered.
    values:
      SAME_REPO:
        definition: job_workflow_ref names the same repository as the repository claim.
        rule: >-
          Establishes NOTHING about cross-repo consumption. A kit that only ever proves itself
          from inside itself has not proven it is consumable.
      CROSS_REPO:
        definition: >-
          job_workflow_ref names a DIFFERENT repository from the repository claim: the caller
          resolved workflow logic held elsewhere and presented its own identity to do it.
      MATCHED:
        definition: job_workflow_ref matched the prefix the caller declared it expected.
      MISMATCHED:
        definition: >-
          job_workflow_ref did not match the declared expectation. The evidence was produced by
          logic other than the logic the caller named. A supply-chain fact, and it blocks.
      UNASSERTED:
        definition: No expectation was declared, so the claim is RECORDED ONLY.
        rule: >-
          MUST be reported as its own state and never rendered as a match. An unasserted boundary
          is an unproven one, and silence here is how a consumer comes to believe a ref was
          checked when nothing checked it.

  # ─────────────────────────────────────────────────────────────────────────
  oidc_subject_form:
    description: >-
      WHICH of the two shapes GitHub issues for an OIDC `sub` claim the probe verified. GitHub
      issues repo:<owner>/<name>:environment:<env> for some callers and the immutable-id form
      repo:<owner>@<owner_id>/<name>@<repo_id>:environment:<env> for others, and a federated
      credential matches whichever the token presents. Registered 2026-10-15, when hosted runs
      38824385082 and 38824392100 showed the probe refusing a genuine caller that presented the
      second form, before login, on a subject the login itself had accepted in September.
    consumers: [.github/workflows/verify-azure-oidc.yml, tests/prove_oidc_subject_forms.py]
    rule: >-
      THE FORM IS RECORDED, NEVER COLLAPSED. A reader of the evidence must be able to tell which
      comparison established the subject, because the two forms rest on different facts: the
      plain form on names alone, the id form on names AND the token's own numeric
      repository_owner_id and repository_id claims. Names and environment are compared exactly as
      presented, case-sensitively, in both forms.
    values:
      PLAIN:
        definition: The sub claim equalled repo:<owner>/<name>:environment:<env> for the declared expectation.
      ID_QUALIFIED:
        definition: >-
          The sub claim equalled repo:<owner>@<owner_id>/<name>@<repo_id>:environment:<env> where
          owner, name and environment equal the declared expectation and both ids equal the
          token's own repository_owner_id and repository_id claims, present and numeric.
        rule: >-
          The ids are taken from the TOKEN, never from an input. A declared id would let a caller
          assert the pair it wanted matched; a token-sourced id only confirms that the subject
          GitHub composed agrees with the claims GitHub issued alongside it.
      UNMATCHED:
        definition: >-
          The sub claim equalled neither accepted form: a wrong name, owner, environment or id, a
          missing or non-numeric id claim, or another subject shape entirely (a ref-scoped job).
        rule: >-
          HARD FAILS the probe before anything is attempted against Azure. Never rendered as a
          partial match, and never resolved by relaxing the comparison.
  ticket_reference_outcome:
    description: >-
      WHAT the pull-request ticket-reference gate established about a pull-request description.
      Registered 2026-10-16 when the gate moved from one consumer's overlay into the core
      (KDEC-013, .github/workflows/reusable-ticket-reference.yml). The four states the core
      library scripts/ticket_reference.py already kept apart are here as the gate's outputs, plus
      the three the workflow adds: a range that is half-configured, an unconfigured site, and an
      event that carries no description at all.
    consumers: [.github/workflows/reusable-ticket-reference.yml, tests/prove_ticket_reference_gate.py]
    rule: >-
      NEVER A BOOLEAN, AND NOTHING HERE MEANS THE ISSUE EXISTS. Every value answers a question
      about TEXT. REFERENCE_FOUND means a well-formed reference is present; it never means the
      work item exists, is open, or describes the change -- that is a reviewer's judgement and,
      for existence, a tracker call this gate does not make.
    values:
      REFERENCE_FOUND:
        definition: A candidate reference in the description satisfied the configured policy.
        rule: Format only. Never read as evidence the issue exists or authorises the change.
      NO_CANDIDATE_PASSED:
        definition: >-
          One or more references were found and every one failed the consumer's issue-number
          range. The rejected keys are named with their digit counts.
        rule: >-
          The DEVELOPER acts, unless the range has been outgrown -- then the governance owner
          raises it. Never collapsed into NO_CANDIDATE: a reference was supplied.
      NO_CANDIDATE:
        definition: The description has text and no reference of the configured shape.
        rule: The developer acts. Not NO_TEXT, which says the description was empty.
      NO_TEXT:
        definition: The pull-request description is empty; nothing was searched.
        rule: The developer acts. Not NO_CANDIDATE.
      POLICY_MISCONFIGURED:
        definition: >-
          An issue-number range was supplied half-configured, non-numeric, or with the lower bound
          above the upper. The gate could not run.
        rule: >-
          A PLATFORM action, never the developer's, and never a pass. The gate does not choose the
          missing bound: that would be the kit inventing a consumer's numbering.
      NOT_A_PULL_REQUEST:
        definition: >-
          The calling event carries no pull-request description (a push, a schedule, a dispatch),
          so nothing was assessed.
        rule: >-
          Exit 0 and NOT ASSESSED in the summary. Never rendered as a pass: nothing was checked.

  # ─────────────────────────────────────────────────────────────────────────
  # KDEC-029 (owner, 2026-10-26, closing O-11): build once, promote the same digest.
  promotion_gate:
    description: >-
      The answer the promotion preflight and the promotion gate give a deploy, before login. Exactly
      one value per deploy step: PREFLIGHT_PASSED or a preflight refusal, then (promotion mode only)
      PROMOTION_ALLOWED or the FIRST refusal; every refusal is listed with its reason in
      promotion-gate.json and the step summary.
    consumers: [scripts/promotion.py, reusable-deploy-containerapp, reusable-deploy-appservice, tests/prove_promotion.py]
    rule: >-
      EVERY REFUSAL NAMES ITS REASON, AND EVERY REFUSAL IS BEFORE LOGIN. Nothing here may be read as
      a pass by default: an unreadable source, KEV or SBOM refuses (RECHECK_INCOMPLETE). Break-glass
      may lift only the testing refusals (NOT_VERIFIED, WRONG_PREDECESSOR, STALE, SUPERSEDED,
      NEW_FINDING, RECHECK_INCOMPLETE), never a substitution, a non-default branch, an unverified
      signature or a revocation; a named rollback or hotfix decision may lift STALE only.
    values:
      PREFLIGHT_PASSED:
        definition: The release path, DAST mode, predecessor requirement, break-glass exception and test-period bounds all hold.
      PROMOTION_ALLOWED:
        definition: >-
          The digest was verified-for-promotion in the required predecessor, from the default
          branch, its signed provenance verified here (V1), within 14 days, not superseded, not
          revoked, and the SBOM and KEV re-check found nothing new.
        rule: Allowed is not deployed; the deploy contract still decides the outcome.
      PROMOTION_REFUSED_SOURCE_UNREADABLE:
        definition: The named run published no readable promotion record for the named environment.
      PROMOTION_REFUSED_DIGEST_MISMATCH:
        definition: The digest to deploy is not the digest the source record verified -- a substituted artefact.
      PROMOTION_REFUSED_WRONG_PREDECESSOR:
        definition: >-
          The source is not the required predecessor, or its record is not a test or uat tier. A dev
          success never satisfies a test or uat predecessor.
      PROMOTION_REFUSED_NOT_VERIFIED:
        definition: The source record does not read verified-for-promotion; the missing conditions are named.
      PROMOTION_REFUSED_NOT_FROM_MAIN:
        definition: The record's source ref or its run's branch is not the default branch.
      PROMOTION_REFUSED_SIGNATURE:
        definition: V1 in the promoting deploy did not read ATTESTATION_VERIFIED (held by the plan included).
      PROMOTION_REFUSED_REVOKED:
        definition: >-
          Eligibility was revoked: a revocation register entry (digest, signer, approval, test
          evidence) matches, or the re-check found a new critical or known-exploited finding.
        rule: Fourteen days is a maximum, never a guarantee; a revocation acts at once.
      PROMOTION_REFUSED_NEW_FINDING:
        definition: The SBOM re-scan found a HIGH finding the build gate (HIGH,CRITICAL) did not have.
      PROMOTION_REFUSED_RECHECK_INCOMPLETE:
        definition: The SBOM re-scan, the KEV check, the predecessor history or the revocation register could not be read.
        rule: COULD-NOT-ESTABLISH IS NEVER ESTABLISHED.
      PROMOTION_REFUSED_STALE:
        definition: Verified more than 14 days ago, with no attributed rollback or hotfix decision.
      PROMOTION_REFUSED_SUPERSEDED:
        definition: A newer build was verified in the same predecessor after this one.
      PROMOTION_REFUSED_NO_PREDECESSOR:
        definition: A uat or prod deploy named no promotion source and is not break-glass.
      PROMOTION_REFUSED_PATH_UNKNOWN:
        definition: release_path is not normal, hotfix, rollback or break-glass.
      DAST_REFUSED_PRODUCTION_TARGET:
        definition: Active DAST was configured against prod. DAST runs against the predecessor.
      TEST_PERIOD_REFUSED_OUT_OF_BOUNDS:
        definition: e2e_test_period_minutes is not above 0 and at most 240.
      BREAK_GLASS_REFUSED_NO_EXCEPTION:
        definition: Break-glass without a reason, an authority, an exception reference and an expiry.
      BREAK_GLASS_REFUSED_EXPIRED:
        definition: The break-glass exception's expiry has passed.
      BREAK_GLASS_REFUSED_TOO_LONG:
        definition: The break-glass exception expires more than 7 days out.

  promotion_revocation:
    description: Why a verified record's eligibility was revoked (the reason PROMOTION_REFUSED_REVOKED carries).
    consumers: [scripts/promotion.py, tests/prove_promotion.py]
    rule: >-
      A REASON, NEVER A NEW GATE. Each value names its evidence: a register entry on the default
      branch (who and when), or the promotion-time re-scan.
    values:
      DIGEST_REVOKED:
        definition: The revocation register names this digest.
      SIGNING_IDENTITY_REVOKED:
        definition: The revocation register names the signer workflow that signed the digest.
      APPROVAL_REVOKED:
        definition: The revocation register names an approver of the predecessor deploy.
      TEST_EVIDENCE_INVALIDATED:
        definition: The revocation register names the predecessor run's test evidence.
      NEW_KNOWN_EXPLOITED:
        definition: The KEV re-check at promotion found a known-exploited CVE in the digest's SBOM.
      NEW_CRITICAL_FINDING:
        definition: The SBOM re-scan at promotion found a CRITICAL finding the build did not have.

  promotion_record_state:
    description: The state a promotion record carries (lower-case verified-for-promotion and not-verified, and BREAK_GLASS).
    consumers: [scripts/promotion.py, scripts/deploy_contract.py, schemas/promotion-record.schema.json]
    rule: >-
      BREAK_GLASS IS NEVER VERIFIED. It records a deploy that proceeded on an exception with its
      testing owed; the daily deployed scan flags it until a verified record of the digest exists in
      the predecessor.
    values:
      BREAK_GLASS:
        definition: A healthy deploy that proceeded on an approved, time-limited exception; testing owed.

  promotion_check:
    description: The result of one "tested" check after a deploy serves (DAST, security settings), or why it was not run.
    consumers: [scripts/promotion.py, scripts/deploy_contract.py]
    rule: >-
      PASSIVE AT PROD IS NOT A SKIP. NOT_APPLICABLE_PASSIVE says the active check ran in the
      predecessor instead; it is never written below prod.
    values:
      NOT_APPLICABLE_PASSIVE:
        definition: At prod the active checks (the e2e period, DAST) are not run; prod gets health and posture only.
      DAST_PASSED:
        definition: The DAST command's SARIF holds no unsuppressed result at level error.
      DAST_BLOCKING_FINDINGS:
        definition: The DAST command's SARIF holds at least one unsuppressed result at level error.
      DAST_INCOMPLETE:
        definition: The DAST command left no readable SARIF (it failed, timed out, or wrote nothing).
        rule: Never a pass.
      POSTURE_PASSED:
        definition: Every security setting read back from the live target holds.
      POSTURE_FAILED:
        definition: A security setting read back from the live target does not hold; the failing ones are named.
      POSTURE_UNREADABLE:
        definition: The target's settings could not be read.
        rule: Never a pass.

  promotion_approval:
    description: What the run's environment approvals read back as, for the promotion record.
    consumers: [scripts/promotion.py]
    values:
      NONE_REQUIRED_OR_RECORDED:
        definition: The run's approvals API lists no approval decision (an environment without required reviewers).
  # -------------------------------------------------------------------------
  leak_gate_state:
    description: >-
      Whether each layer between a committed secret and the default branch is in place (lane
      L-LEAK, KDEC-031 PROPOSED): push protection, the push ruleset, the branch gate, the local
      rails and secret scanning, as the discover platform step read them. The security gate's
      leakgates step emits them as `leak_gates`, and every OFF layer becomes a control_weakening row
      (CONTROL_DISABLED, WEAKENING_IN_FORCE, WEAKENING_UNATTRIBUTED).
    consumers: [.github/actions/discover, security-gate leakgates step, tests/prove_leak_gate_posture.py]
    rule: >-
      UNKNOWN IS NEVER ON. A 403, a token without the scope, or a body nobody could read is
      UNKNOWN, and OFF is claimed only where every source that could have said ON was read. At crawl
      the record does not move routing_result.
    values:
      "ON":
        definition: The layer was read and is in force.
      "OFF":
        definition: Every source that could show the layer was read, and none did.
        rule: A recorded weakening and a warning, never a silent pass. It does not block at crawl.
      UNKNOWN:
        definition: The layer could not be read with this run's token.
        rule: Never ON and never OFF. Not a weakening, and not a clean row either.
      NO_LEAK_GATE_SHOWN:
        definition: >-
          The alarm (`leak_gate_alarm`): none of push protection, the push ruleset or the local
          rails could be shown ON, so only the CI secret scan stands before the default branch.
        rule: >-
          The louder warning, not a block, at crawl. KDEC-031 records how the owner may make it
          route or block.
  # -------------------------------------------------------------------------
  # Beside leak_gate_state, not inside it. leak_gate_state answers "is this layer in force?", read
  # by discover with the run's token; these answer "why did the helper that puts a layer in place
  # stop?", printed by an adopter's own run of a script. Folding them into one namespace would let
  # a setup refusal be read as a posture value (or the reverse). Two causes the helpers share with
  # every scanner job are NOT here: a missing tool, shell or login is
  # prerequisite_readiness.PREREQUISITE_UNAVAILABLE and a tool that is present but answers wrongly is
  # prerequisite_readiness.FITNESS_FAILED (remedy 2: reuse, not a second spelling).
  leak_gate_setup_refusal:
    description: >-
      Why one of the two leak-gate setup helpers (adoption steps 1 and 3 of
      docs/adoption/LEAK_GATES.md: developer-safety/gitignore/merge-baseline.sh and
      developer-safety/branch-protection/apply-push-ruleset.sh) refused or failed, so that the
      layer it sets up (the baseline .gitignore, the push ruleset) is NOT shown to be in place.
      Each value is printed as `NAME: message` on stderr with its own exit code (the tables in
      LEAK_GATES.md); the helper stops at the first one.
    consumers: [developer-safety/gitignore/merge-baseline.sh, developer-safety/branch-protection/apply-push-ruleset.sh,
                tests/prove_baseline_gitignore.py, tests/prove_push_ruleset_secret_files.py,
                "the adopter, or a wrapper script, branching on the exit code (docs/adoption/LEAK_GATES.md)"]
    rule: >-
      A REFUSAL IS NEVER A SUCCESS AND NEVER A PLAN. Before this vocabulary a dry run with gh missing
      printed existing_id=none and exited 0, an empty baseline reported "already carries every
      pattern", and a .gitignore was written into a directory that was no repository. Every value
      here exits non-zero, prints no plan, and claims nothing about the layer: the layer stays
      unshown until a re-run exits 0, and the security gate's leak-gate posture (leak_gate_state)
      reads it independently either way.
    transitions:
      - "checks run in a fixed order (prerequisites, then inputs, then the target); the first failure ends the run with its value"
      - "every value is terminal for that run; the only way out is to clear the cause and re-run, which re-checks everything"
      - "nothing is written before any value except TARGET_NOT_WRITABLE (an append that failed part-way) and MERGE_NOT_VERIFIED (written, then re-read)"
      - "never -> exit 0: a helper does not downgrade a refusal to a warning"
    values:
      NOT_APPLIED:
        definition: >-
          apply-push-ruleset.sh, exit 1. Every prerequisite held and the lookup answered, and GitHub
          refused the PUT or POST that would create or update the ruleset (403: no repository
          administration; 422: a personal-account, public, or unlicensed repository).
        rule: >-
          The ruleset is not in place. Not REPO_NOT_READABLE: the repository was read and the WRITE
          was refused, so the remedy is a permission or a plan, not an access fix.
      REPO_NOT_READABLE:
        definition: >-
          apply-push-ruleset.sh, exit 14. GET repos/OWNER/REPO on the run's host failed: no such
          repository, no access with this token, or the wrong host.
        rule: Not NOT_APPLIED. Nothing was attempted; whether a write would be allowed is unknown.
      RULESET_LOOKUP_FAILED:
        definition: >-
          apply-push-ruleset.sh, exit 15. The repository was readable but GET .../rulesets failed or
          returned a non-numeric id, so whether the kit's ruleset already exists is unknown.
        rule: >-
          UNKNOWN IS NOT NONE. A failed lookup must never print existing_id=none or choose POST,
          which would create a duplicate ruleset or plan one that already exists.
      TEMPLATE_UNREADABLE:
        definition: >-
          apply-push-ruleset.sh, exit 16. The kit's push-ruleset-secret-files.json beside the script
          is missing, is not JSON, or has no name, so there is nothing to apply.
        rule: A defect in the kit copy, not in the target repository; re-fetch the kit.
      BASELINE_UNREADABLE:
        definition: >-
          merge-baseline.sh, exit 12. The kit's baseline.gitignore beside the script is missing,
          unreadable, or holds no pattern.
        rule: >-
          Never "already carries every baseline pattern". An empty baseline makes that sentence
          vacuously true, which is the false success this value replaced. A kit-copy defect, as
          TEMPLATE_UNREADABLE is, for the other helper's input.
      REPO_DIR_MISSING:
        definition: merge-baseline.sh, exit 13. The directory named does not exist or is not a directory. Nothing is created.
        rule: Not NOT_A_GIT_REPO. The path is wrong, not the kind of directory.
      NOT_A_GIT_REPO:
        definition: >-
          merge-baseline.sh, exit 14. The directory exists but holds no .git and git does not place
          it inside a work tree. Nothing is written.
        rule: A .gitignore outside a repository protects nothing; writing one there is a false success.
      TARGET_NOT_WRITABLE:
        definition: >-
          merge-baseline.sh, exit 15. The repository's .gitignore is not a readable, writable regular
          file, cannot be created, or an append to it failed.
        rule: >-
          The file may hold part of an append when this is raised mid-write; the re-run's exact-line
          merge completes it without duplicating lines.
      MERGE_NOT_VERIFIED:
        definition: >-
          merge-baseline.sh, exit 16. The merge wrote, and re-reading the .gitignore found at least
          one baseline pattern absent (each is named on stderr).
        rule: >-
          SUCCESS IS CLAIMED ONLY FOR WHAT THE FILE NOW CARRIES. Not FITNESS_FAILED: the tools passed
          their self-test, and only the read-back after writing caught the gap.
  # -------------------------------------------------------------------------
  # The cost redesign's acceptance measurement (KDEC-033, owner 2026-10-27). Not a scan verdict and
  # never read by the gate: these say whether a cost comparison may be printed and whether a
  # scanner identity behaved the same before and after a topology change.
  cost_measurement_state:
    description: >-
      What scripts/measure_cost.py can say about a before/after comparison of the security suite on
      one fixture class: whether enough runs exist to print a saving, and, per scanner identity,
      whether its state and SARIF result count were stable and equal across the two phases.
    consumers: [scripts/measure_cost.py, docs/operations/COST_MEASUREMENT.md, the coordinator reading its report]
    rule: >-
      A SAVING IS NEVER PRINTED FROM TOO FEW RUNS, AND A SCANNER THAT CHANGED IS NEVER AVERAGED
      AWAY. Billed figures are computed from measured job durations (per-job ceiling), not
      invoice-reconciled; fewer than five runs in either phase is INSUFFICIENT_RUNS, and any
      per-scanner difference fails the comparison however much cheaper the after phase is.
    transitions:
      - "INSUFFICIENT_RUNS -> a measured saving only when both phases reach five runs on the same fixture commit"
      - "UNSTABLE_BEFORE / UNSTABLE_AFTER are not CHANGED: the fixture or the tool is noisy, and the comparison is not trusted either way"
      - "never -> a pass: every value here except a measured saving with no per-scanner difference fails the acceptance test"
    values:
      INSUFFICIENT_RUNS:
        definition: Fewer than five runs in the before or the after phase of a class; no saving is printed.
        rule: Not a zero saving and not a failed saving. Unmeasured, and labelled as such.
      NO_SARIF:
        definition: A scanner identity's state row names no SARIF, so it has no result count to compare.
        rule: Not a count of zero. Compared as itself (NO_SARIF before must be NO_SARIF after).
      UNSTABLE_BEFORE:
        definition: The before runs disagree with each other on this scanner's state or result count.
        rule: Not CHANGED. The baseline is not a baseline; re-run or fix the fixture before comparing.
      UNSTABLE_AFTER:
        definition: The after runs disagree with each other on this scanner's state or result count.
        rule: Not CHANGED, and not a pass. The new topology is nondeterministic for this identity.
  # -------------------------------------------------------------------------
  # The protected capability floor (owner rulings 4 and 8, 2026-10-27, KDEC-033). Not a scanner state:
  # whether what the KIT requires is present, independently of what scanner-registry.yaml now lists.
  capability_floor_state:
    description: >-
      Whether every scanner identity in the kit-owned capability-floor.json produced an evidence row
      in this run (runtime, the security gate's floor step), and whether every capability removed
      from the floor left a valid tombstone (static and against a pull request's base).
    consumers: [scripts/capability_floor.py, .github/actions/capability-floor, security-gate verdict step,
                tests/prove_capability_floor.py]
    rule: >-
      A ROW DELETED IS NOT A SCANNER NEVER EXPECTED. The floor is read from the kit, never from the
      registry rows a contributor edits, and an unread or unreadable floor is BREACHED. GAP_DECIDED is
      never a clean coverage claim, and an expired gap decision is BREACHED: expiry needs a renewed
      decision or a proven replacement, and never restores the removed tool.
    transitions:
      - "HELD -> BREACHED when a floor identity has no evidence row, or a tombstone is invalid or expired"
      - "HELD -> GAP_DECIDED only through a tombstone with an authorised, unexpired gap decision"
      - "GAP_DECIDED -> HELD only through a proven replacement in the floor; -> BREACHED at expiry"
    values:
      HELD:
        definition: Every floor identity is present, and every tombstone names a proven replacement.
      GAP_DECIDED:
        definition: >-
          A required capability was removed under an authorised, time-limited gap decision and nothing
          replaces it yet.
        rule: Not HELD and not a pass of coverage. The gate records it unestablished; it does not block.
      BREACHED:
        definition: >-
          A floor identity produced no evidence row, a floor entry vanished without a tombstone, a
          tombstone lacks its decision, or a gap decision expired. Also: the floor could not be read.
        rule: The gate fails. Not a finding, so advisory_mode does not soften it.
